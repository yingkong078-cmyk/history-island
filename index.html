/* ---------- app/sync.js ---------- */
/* ============================================================
   云同步 · 腾讯云开发（国内）/ Firebase（海外）
   同一同步码 = 同一个家庭学习档案；只同步学习进度
   ============================================================ */
const SYNC_KEY = 'timeship_sync_v1';

function loadSyncPrefs() {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); } catch (e) { raw = {}; }
  const preset = window.TIMESHIP_CLOUD || {};
  const cloudbase = (raw.cloudbase && typeof raw.cloudbase === 'object')
    ? raw.cloudbase
    : (preset.cloudbase || null);
  const config = (raw.config && typeof raw.config === 'object')
    ? raw.config
    : (preset.firebase || null);
  return {
    provider: raw.provider === 'firebase' ? 'firebase' : 'cloudbase',
    config,
    cloudbase,
    code: typeof raw.code === 'string' ? raw.code : '',
    enabled: !!raw.enabled,
    clientId: raw.clientId || ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `device-${Date.now()}-${Math.random().toString(16).slice(2)}`)
  };
}
let syncPrefs = loadSyncPrefs();
let syncRuntime = {
  provider: syncPrefs.provider, status: 'offline', error: '', unsub: null, ref: null,
  auth: null, app: null, db: null, pollTimer: 0, lastPushed: '', lastSync: 0,
  pushTimer: 0, connecting: false, applying: false
};

function saveSyncPrefs() {
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncPrefs)); } catch (e) { /* noop */ }
}

/* ---------- 只同步学习进度 ---------- */
function cloudPayload(s) {
  return {
    xp: Number(s.xp || 0),
    streak: Number(s.streak || 0),
    lastDay: s.lastDay || '',
    bestCombo: Number(s.bestCombo || 0),
    learned: Array.isArray(s.learned) ? s.learned : [],
    explored: Array.isArray(s.explored) ? s.explored : [],
    badges: Array.isArray(s.badges) ? s.badges : [],
    wrong: Array.isArray(s.wrong) ? s.wrong : [],
    answers: s.answers || {},
    campaign: s.campaign || {},
    daily: s.daily || {},
    log: Array.isArray(s.log) ? s.log.slice(-60) : [],
    totalAnswered: Number(s.totalAnswered || 0),
    totalCorrect: Number(s.totalCorrect || 0),
    quizCount: Number(s.quizCount || 0),
    readSources: Number(s.readSources || 0)
  };
}

function mergeProgress(local, remote) {
  const l = local || {};
  const r = remote || {};
  const out = { ...l };
  const max = (a, b) => Math.max(Number(a || 0), Number(b || 0));
  const union = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])];

  out.xp = max(l.xp, r.xp);
  out.streak = max(l.streak, r.streak);
  out.bestCombo = max(l.bestCombo, r.bestCombo);
  out.lastDay = [l.lastDay, r.lastDay].filter(Boolean).sort().pop() || '';
  out.learned = union(l.learned, r.learned);
  out.explored = union(l.explored, r.explored);
  out.badges = union(l.badges, r.badges);
  out.totalAnswered = max(l.totalAnswered, r.totalAnswered);
  out.totalCorrect = max(l.totalCorrect, r.totalCorrect);
  out.quizCount = max(l.quizCount, r.quizCount);
  out.readSources = max(l.readSources, r.readSources);

  const answers = { ...(l.answers || {}) };
  Object.entries(r.answers || {}).forEach(([qid, rec]) => {
    const prev = answers[qid];
    if (!prev) { answers[qid] = rec; return; }
    answers[qid] = {
      right: max(prev.right, rec.right),
      wrong: max(prev.wrong, rec.wrong),
      last: max(prev.last, rec.last)
    };
  });
  out.answers = answers;

  const rank = { todo: 1, mastered: 2 };
  const wrongMap = new Map();
  [...(l.wrong || []), ...(r.wrong || [])].forEach(w => {
    if (!w || !w.qid) return;
    const prev = wrongMap.get(w.qid);
    if (!prev) { wrongMap.set(w.qid, { ...w }); return; }
    const newest = Number(w.last || 0) >= Number(prev.last || 0) ? w : prev;
    wrongMap.set(w.qid, {
      ...newest,
      qid: w.qid,
      status: (rank[w.status] || 0) >= (rank[prev.status] || 0) ? w.status : prev.status,
      wrongCount: max(prev.wrongCount, w.wrongCount),
      rightStreak: max(prev.rightStreak, w.rightStreak),
      last: max(prev.last, w.last)
    });
  });
  out.wrong = [...wrongMap.values()];

  const campaign = { ...(l.campaign || {}) };
  Object.entries(r.campaign || {}).forEach(([uid, rec]) => {
    const prev = campaign[uid];
    if (!prev) { campaign[uid] = rec; return; }
    campaign[uid] = { stars: max(prev.stars, rec.stars), best: max(prev.best, rec.best) };
  });
  out.campaign = campaign;

  const ld = l.daily || {};
  const rd = r.daily || {};
  if (!rd.date) out.daily = ld;
  else if (!ld.date) out.daily = { ...rd, goal: rd.goal || 40 };
  else if (ld.date === rd.date) {
    out.daily = {
      ...ld,
      learned: max(ld.learned, rd.learned),
      correct: max(ld.correct, rd.correct),
      reviewed: max(ld.reviewed, rd.reviewed),
      xp: max(ld.xp, rd.xp),
      goal: ld.goal || rd.goal || 40,
      chestClaimed: !!(ld.chestClaimed || rd.chestClaimed),
      qid: ld.qid || rd.qid,
      qChecked: !!(ld.qChecked || rd.qChecked),
      qChosen: ld.qChecked ? ld.qChosen : rd.qChosen
    };
  } else {
    out.daily = ld.date > rd.date ? ld : { ...rd, goal: rd.goal || 40 };
  }

  const logMap = new Map();
  [...(l.log || []), ...(r.log || [])].forEach(row => {
    if (!row || !row.date) return;
    const prev = logMap.get(row.date);
    if (!prev) { logMap.set(row.date, row); return; }
    logMap.set(row.date, {
      date: row.date,
      xp: max(prev.xp, row.xp),
      answered: max(prev.answered, row.answered),
      correct: max(prev.correct, row.correct)
    });
  });
  out.log = [...logMap.values()].sort((a, b) => String(a.date).localeCompare(String(b.date))).slice(-60);
  return out;
}

function applyCloudProgress(merged) {
  if (!merged) return;
  const keep = {
    version: state.version,
    name: state.name,
    sound: state.sound,
    notes: state.notes,
    lastUnit: state.lastUnit,
    lastVolume: state.lastVolume
  };
  syncRuntime.applying = true;
  state = { ...merged, ...keep };
  saveState();
  updateTopStats();
  syncRuntime.applying = false;
  const page = parseHash().page;
  const canRerender = !(typeof quiz !== 'undefined' && quiz);
  if (canRerender && ['home', 'campaign', 'wrong', 'achievements', 'report', 'courses', 'practice', 'guide', 'unit'].includes(page)) {
    setTimeout(() => route(), 90);
  } else if (page === 'sync') {
    updateSyncUI();
  }
}

/* ---------- 状态提示 ---------- */
function syncStatusLabel() {
  if (syncRuntime.status === 'online') {
    return syncRuntime.lastSync
      ? `已连接 · ${new Date(syncRuntime.lastSync).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`
      : '已连接';
  }
  if (syncRuntime.status === 'connecting') return '正在连接…';
  if (syncRuntime.status === 'error') return `连接失败：${syncRuntime.error || '请检查配置'}`;
  return '未连接';
}
function updateSyncUI() {
  const el = $('#syncStatus');
  if (el) { el.textContent = syncStatusLabel(); el.className = `sync-status ${syncRuntime.status}`; }
  ['#syncDot', '#syncPageDot'].forEach(sel => { const d = $(sel); if (d) d.className = `sync-dot ${syncRuntime.status}`; });
  const btn = $('#syncBtn');
  if (btn) {
    btn.classList.toggle('online', syncRuntime.status === 'online');
    btn.classList.toggle('error', syncRuntime.status === 'error');
    btn.title = `云同步 · ${syncStatusLabel()}`;
    btn.setAttribute('aria-label', `云同步：${syncStatusLabel()}`);
  }
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[data-sync-src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.dataset.syncSrc = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('云端脚本加载失败，请检查网络'));
    document.head.appendChild(s);
  });
}

function parseSyncConfig(raw) {
  let text = String(raw || '').trim();
  text = text.replace(/^const\s+firebaseConfig\s*=\s*/i, '').replace(/^var\s+firebaseConfig\s*=\s*/i, '').replace(/^let\s+firebaseConfig\s*=\s*/i, '').replace(/;\s*$/, '');
  try {
    const parsed = JSON.parse(text);
    if (parsed && typeof parsed === 'object') return parsed;
  } catch (e) { /* 继续解析 JS 片段 */ }
  const out = {};
  ['apiKey', 'authDomain', 'projectId', 'appId'].forEach(key => {
    const m = text.match(new RegExp(key + '\\s*:\\s*["\']([^"\']+)["\']', 'i'));
    if (m) out[key] = m[1];
  });
  if (out.apiKey && out.authDomain && out.projectId && out.appId) return out;
  throw new Error('无法识别 Firebase 配置');
}

/* ---------- 连接 ---------- */
async function connectSync(silent = false) {
  if (syncRuntime.connecting) return;
  return syncPrefs.provider === 'firebase' ? connectFirebaseSync(silent) : connectCloudBase(silent);
}

async function connectFirebaseSync(silent = false) {
  if (syncRuntime.connecting) return;
  syncRuntime.provider = 'firebase';
  const codeInput = $('#syncCode');
  const configInput = $('#syncConfig');
  const code = (codeInput ? codeInput.value.trim() : syncPrefs.code).toLowerCase().replace(/[^a-z0-9_-]/g, '');
  let config = syncPrefs.config;
  if (configInput && configInput.value.trim()) {
    try { config = parseSyncConfig(configInput.value.trim()); }
    catch (e) {
      syncRuntime.status = 'error'; syncRuntime.error = 'Firebase 配置格式不对'; updateSyncUI();
      if (!silent) toast('无法识别 Firebase 配置，请粘贴 firebaseConfig 对象或 JSON。', '⚠️');
      return;
    }
  }
  if (!config || !config.apiKey || !config.authDomain || !config.projectId || !config.appId) {
    syncRuntime.status = 'error'; syncRuntime.error = '缺少 Firebase 配置'; updateSyncUI();
    if (!silent) toast('请先粘贴完整的 Firebase Web 配置。', '⚠️');
    return;
  }
  if (code.length < 6) {
    syncRuntime.status = 'error'; syncRuntime.error = '同步码至少 6 位'; updateSyncUI();
    if (!silent) toast('家庭同步码至少 6 位。', '🔑');
    return;
  }
  syncPrefs = { ...syncPrefs, provider: 'firebase', config, code, enabled: true };
  saveSyncPrefs();
  syncRuntime.status = 'connecting'; syncRuntime.connecting = true; syncRuntime.error = '';
  updateSyncUI();
  try {
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js');
    if (!window.firebase) throw new Error('Firebase 未加载');
    if (syncRuntime.unsub) { try { syncRuntime.unsub(); } catch (e) { /* noop */ } syncRuntime.unsub = null; }
    if (syncRuntime.app) { try { await syncRuntime.app.delete(); } catch (e) { /* noop */ } syncRuntime.app = null; }
    const app = firebase.initializeApp(config, 'timeship-sync');
    syncRuntime.app = app;
    const auth = firebase.auth(app);
    await auth.signInAnonymously();
    const db = firebase.firestore(app);
    const ref = db.collection('families').doc(code);
    syncRuntime.ref = ref; syncRuntime.auth = auth; syncRuntime.db = db;
    syncRuntime.unsub = ref.onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data();
      if (!data || !data.progress) return;
      const merged = mergeProgress(state, data.progress);
      if (JSON.stringify(cloudPayload(merged)) !== JSON.stringify(data.progress)) {
        syncRuntime.lastPushed = '';
        applyCloudProgress(merged);
        scheduleSyncPush();
      }
      syncRuntime.lastSync = Date.now();
      syncRuntime.status = 'online';
      updateSyncUI();
    }, err => {
      syncRuntime.status = 'error'; syncRuntime.error = err.message || '监听失败'; updateSyncUI();
    });
    const snap = await ref.get();
    if (!snap.exists) await ref.set({ progress: cloudPayload(state), updatedAt: Date.now(), clientId: syncPrefs.clientId });
    else if (snap.data().progress) {
      const merged = mergeProgress(state, snap.data().progress);
      if (JSON.stringify(cloudPayload(merged)) !== JSON.stringify(snap.data().progress)) applyCloudProgress(merged);
    }
    syncRuntime.status = 'online';
    syncRuntime.lastSync = Date.now();
    syncRuntime.lastPushed = JSON.stringify(cloudPayload(state));
    updateSyncUI();
    if (!silent) toast('云同步已连接。其他设备填同一个同步码即可共享进度。', '☁️', 4200);
  } catch (e) {
    syncPrefs.enabled = false; saveSyncPrefs();
    syncRuntime.status = 'error'; syncRuntime.error = e.message || '连接失败'; updateSyncUI();
    if (!silent) toast(`云同步连接失败：${syncRuntime.error}`, '⚠️', 4500);
  } finally {
    syncRuntime.connecting = false;
  }
}

async function cloudbaseCreateDoc(db, doc, code, payload) {
  const isMissing = e => /Document not found|DOCUMENT_NOT_FOUND|not found|not exist/i.test(String(e && (e.message || e.code) || e));
  try { await doc.set(payload); return; } catch (e) { if (!isMissing(e)) throw e; }
  try { await db.collection('families').add({ _id: code, ...payload }); return; }
  catch (addError) {
    try { await db.createCollection('families'); await db.collection('families').add({ _id: code, ...payload }); return; }
    catch (createError) { throw addError; }
  }
}

async function connectCloudBase(silent = false) {
  if (syncRuntime.connecting) return;
  syncRuntime.provider = 'cloudbase';
  const envInput = $('#cbEnv'), regionInput = $('#cbRegion'), keyInput = $('#cbKey'), codeInput = $('#syncCode');
  const env = (envInput ? envInput.value.trim() : (syncPrefs.cloudbase?.env || ''));
  const region = (regionInput ? regionInput.value : (syncPrefs.cloudbase?.region || 'ap-shanghai')) || 'ap-shanghai';
  const key = (keyInput ? keyInput.value.trim() : (syncPrefs.cloudbase?.accessKey || ''));
  const code = (codeInput ? codeInput.value.trim() : syncPrefs.code).toLowerCase().replace(/[^a-z0-9_-]/g, '');
  if (!env || !key) {
    syncRuntime.status = 'error'; syncRuntime.error = '请填写环境 ID 和 Publishable Key'; updateSyncUI();
    if (!silent) toast('请先填写腾讯云开发环境 ID 和 Publishable Key。', '☁️');
    return;
  }
  if (code.length < 6) {
    syncRuntime.status = 'error'; syncRuntime.error = '同步码至少 6 位'; updateSyncUI();
    if (!silent) toast('家庭同步码至少 6 位。', '🔑');
    return;
  }
  syncPrefs = { ...syncPrefs, provider: 'cloudbase', code, enabled: true, cloudbase: { env, region, accessKey: key } };
  saveSyncPrefs();
  syncRuntime.status = 'connecting'; syncRuntime.connecting = true; syncRuntime.error = '';
  updateSyncUI();
  try {
    await loadScriptOnce('https://static.cloudbase.net/cloudbase-js-sdk/3.11.0/cloudbase.full.js');
    if (!window.cloudbase) throw new Error('腾讯云开发 SDK 未加载');
    if (syncRuntime.unsub) { try { syncRuntime.unsub(); } catch (e) { /* noop */ } syncRuntime.unsub = null; }
    clearInterval(syncRuntime.pollTimer);
    const app = cloudbase.init({ env, region, accessKey: key });
    const db = app.database();
    const doc = db.collection('families').doc(code);
    syncRuntime.app = app; syncRuntime.db = db; syncRuntime.ref = doc;
    let remote = null;
    try {
      const snap = await doc.get();
      remote = Array.isArray(snap.data) ? (snap.data[0] || null) : (snap.data || null);
    } catch (readError) {
      if (!/Document not found|DOCUMENT_NOT_FOUND|not found/i.test(String(readError.message || readError.code || readError))) throw readError;
    }
    if (!remote) await cloudbaseCreateDoc(db, doc, code, { progress: cloudPayload(state), updatedAt: Date.now(), clientId: syncPrefs.clientId });
    else if (remote.progress) {
      const merged = mergeProgress(state, remote.progress);
      if (JSON.stringify(cloudPayload(merged)) !== JSON.stringify(remote.progress)) applyCloudProgress(merged);
    }
    syncRuntime.status = 'online';
    syncRuntime.lastSync = Date.now();
    syncRuntime.lastPushed = JSON.stringify(cloudPayload(state));
    syncRuntime.pollTimer = setInterval(pollCloudBase, 15000);
    updateSyncUI();
    if (!silent) toast('云同步已连接。其他设备填同一个同步码即可共享进度。', '☁️', 4200);
  } catch (e) {
    syncPrefs.enabled = false; saveSyncPrefs();
    syncRuntime.status = 'error';
    syncRuntime.error = /NETWORK|timeout|fetch/i.test(String(e.message || e)) ? '无法连接腾讯云开发，请检查环境 ID、地域和 Web 安全域名' : (e.message || '连接失败');
    updateSyncUI();
    if (!silent) toast(`腾讯云开发连接失败：${syncRuntime.error}`, '⚠️', 5000);
  } finally {
    syncRuntime.connecting = false;
  }
}

async function pollCloudBase() {
  if (syncRuntime.provider !== 'cloudbase' || syncRuntime.status !== 'online' || !syncRuntime.ref) return;
  try {
    let remote = null;
    try {
      const snap = await syncRuntime.ref.get();
      remote = Array.isArray(snap.data) ? (snap.data[0] || null) : (snap.data || null);
    } catch (readError) {
      if (/Document not found|DOCUMENT_NOT_FOUND|not found/i.test(String(readError.message || readError.code || readError))) return;
      throw readError;
    }
    if (!remote || !remote.progress) return;
    const merged = mergeProgress(state, remote.progress);
    if (JSON.stringify(cloudPayload(merged)) !== JSON.stringify(remote.progress)) {
      syncRuntime.lastPushed = '';
      applyCloudProgress(merged);
      scheduleSyncPush();
    }
    syncRuntime.lastSync = Date.now();
    updateSyncUI();
  } catch (e) {
    syncRuntime.status = 'error'; syncRuntime.error = e.message || '读取失败'; updateSyncUI();
  }
}

function disconnectSync(notify = true) {
  if (syncRuntime.unsub) { try { syncRuntime.unsub(); } catch (e) { /* noop */ } }
  syncRuntime.unsub = null;
  clearInterval(syncRuntime.pollTimer);
  syncRuntime.pollTimer = 0;
  syncRuntime.ref = null; syncRuntime.db = null;
  if (syncRuntime.auth) { try { syncRuntime.auth.signOut(); } catch (e) { /* noop */ } }
  syncRuntime.auth = null;
  syncRuntime.status = 'offline';
  syncPrefs.enabled = false;
  saveSyncPrefs();
  updateSyncUI();
  if (notify) toast('云同步已断开。本机进度仍然保留。', '☁️');
}

async function pushSync() {
  if (syncRuntime.status !== 'online' || !syncRuntime.ref || syncRuntime.applying) return;
  const payload = cloudPayload(state);
  const json = JSON.stringify(payload);
  if (json === syncRuntime.lastPushed) return;
  try {
    await syncRuntime.ref.set({ progress: payload, updatedAt: Date.now(), clientId: syncPrefs.clientId });
    syncRuntime.lastPushed = json;
    syncRuntime.lastSync = Date.now();
    syncRuntime.status = 'online';
    updateSyncUI();
  } catch (e) {
    syncRuntime.status = 'error'; syncRuntime.error = e.message || '写入失败'; updateSyncUI();
  }
}
function scheduleSyncPush() {
  if (!syncPrefs.enabled || syncRuntime.applying) return;
  clearTimeout(syncRuntime.pushTimer);
  syncRuntime.pushTimer = setTimeout(pushSync, 1200);
}

/* ---------- 共享链接 ---------- */
function b64urlEncode(text) {
  return btoa(unescape(encodeURIComponent(text))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(text) {
  const pad = '='.repeat((4 - text.length % 4) % 4);
  return decodeURIComponent(escape(atob(text.replace(/-/g, '+').replace(/_/g, '/') + pad)));
}
function decodeShare(str) {
  try {
    const obj = JSON.parse(b64urlDecode(str));
    if (!obj || obj.v !== 1) return null;
    return obj;
  } catch (e) { return null; }
}
function applyShare(obj) {
  if (!obj) return false;
  syncPrefs.provider = obj.p === 'firebase' ? 'firebase' : 'cloudbase';
  syncPrefs.code = String(obj.code || '').slice(0, 40);
  if (obj.firebase) syncPrefs.config = obj.firebase;
  if (obj.cloudbase) syncPrefs.cloudbase = obj.cloudbase;
  syncPrefs.enabled = false;
  saveSyncPrefs();
  return true;
}

/* ---------- 导入 / 导出 ---------- */
function exportProgressFile() {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `时光探险岛-学习记录-${todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('已导出学习记录。', '💾');
  } catch (e) { toast('导出失败，请稍后再试。', '⚠️'); }
}
async function importProgressFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object') throw new Error('格式不对');
    openModal({
      title: '导入学习记录',
      body: `<p style="color:var(--ink)">将把文件中的学习进度与本机进度<strong>合并</strong>：XP、知识卡、错题、徽章、战功星取较高值或并集；本机昵称、笔记和设置不会被覆盖。</p><p class="small muted">文件：${esc(file.name)}</p>`,
      actions: [
        { text: '取消' },
        { text: '合并导入', primary: true, onClick: () => {
          applyCloudProgress(mergeProgress(state, obj));
          toast('学习记录已合并导入。', '📥');
        } }
      ]
    });
  } catch (e) {
    toast('导入失败：文件不是有效的学习记录 JSON。', '⚠️');
  }
}

function copyShareLink() {
  if (location.protocol === 'file:') { toast('请先把网页部署到 https 公网，再复制共享链接。', '☁️'); return; }
  const code = ($('#syncCode') ? $('#syncCode').value.trim() : syncPrefs.code).toLowerCase().replace(/[^a-z0-9_-]/g, '');
  if (code.length < 6) { toast('先填一个至少 6 位的同步码。', '🔑'); return; }
  const provider = syncPrefs.provider === 'firebase' ? 'firebase' : 'cloudbase';
  const payload = {
    v: 1, p: provider, code,
    firebase: provider === 'firebase' ? (syncPrefs.config || parseConfigSafe($('#syncConfig')?.value)) : undefined,
    cloudbase: provider === 'cloudbase' ? {
      env: $('#cbEnv')?.value.trim() || syncPrefs.cloudbase?.env || '',
      region: $('#cbRegion')?.value || syncPrefs.cloudbase?.region || 'ap-shanghai',
      accessKey: $('#cbKey')?.value.trim() || syncPrefs.cloudbase?.accessKey || ''
    } : undefined
  };
  if (provider === 'firebase' && !payload.firebase) { toast('先粘贴 Firebase 配置。', '⚠️'); return; }
  if (provider === 'cloudbase' && (!payload.cloudbase.env || !payload.cloudbase.accessKey)) { toast('先填写腾讯云开发环境 ID 和 Key。', '⚠️'); return; }
  const url = location.href.split('#')[0] + '#sync/' + b64urlEncode(JSON.stringify(payload));
  const done = () => toast('共享链接已复制。链接包含同步码，只发给家人。', '🔗', 4200);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => window.prompt('复制下面的共享链接：', url));
  } else {
    window.prompt('复制下面的共享链接：', url);
  }
}
function parseConfigSafe(text) {
  try { return parseSyncConfig(text); } catch (e) { return null; }
}

/* ---------- 启动 ---------- */
window.__onStateSaved = function () {
  if (syncRuntime.status === 'online' && !syncRuntime.applying) scheduleSyncPush();
};

function initSync() {
  updateSyncUI();
  const btn = $('#syncBtn');
  if (btn) btn.addEventListener('click', () => { location.hash = '#sync'; });
  const ready = syncPrefs.provider === 'cloudbase'
    ? !!(syncPrefs.cloudbase && syncPrefs.cloudbase.env && syncPrefs.cloudbase.accessKey)
    : !!syncPrefs.config;
  if (syncPrefs.enabled && ready && syncPrefs.code && parseHash().page !== 'sync') {
    setTimeout(() => connectSync(true), 800);
  }
}

/* ============================================================
   启动

function initTopbar() {
  const topbar = $('#topbar');
  const onScroll = () => topbar.classList.toggle('scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  $('#searchBtn').addEventListener('click', openSearch);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  });
  const soundBtn = $('#soundBtn');
  soundBtn.addEventListener('click', () => {
    state.sound = !state.sound;
    saveState();
    $('#soundIcon').textContent = state.sound ? '♪' : '🔇';
    soundBtn.setAttribute('aria-label', state.sound ? '关闭音效' : '开启音效');
    if (state.sound) playSound('click');
    toast(state.sound ? '音效已开启' : '音效已关闭', state.sound ? '🔊' : '🔇', 1600);
  });
  if (!state.sound) $('#soundIcon').textContent = '🔇';
}

function init() {
  touchDay();
  pickDailyQuestion();
  initTopbar();
  updateTopStats();
  if (!location.hash) history.replaceState(null, '', '#home');
  window.addEventListener('hashchange', route);
  route();
  initSync();
}
init();
