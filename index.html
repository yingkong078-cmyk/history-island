社会转型。"],"terms":[["活字印刷术","用胶泥、木头等制成单个字模，排版印刷后再拆开重复使用，比雕版省时省料，由北宋毕昇发明。"],["《梦溪笔谈》","北宋沈括所著的笔记体科学著作，记载了活字印刷、指南针、石油等大量科技知识。"],["《授时历》","元朝郭守敬主持编订的历法，测定一年为 365.2425 天，精度与现行公历相当，1281 年颁行。"],["突火枪","南宋时出现的管形火器，用竹管装火药和子窠发射，是世界上最早的管形射击火器。"]],"figures":[["毕昇","北宋工匠，发明泥活字印刷术，其事见于《梦溪笔谈》"],["沈括","北宋科学家，著《梦溪笔谈》，记录多项科技成就"],["郭守敬","元朝天文学家，主持编订《授时历》"]],"events":[["北宋","毕昇发明活字印刷术"],["北宋","指南针开始应用于航海"],["宋元","火药武器在战争中广泛使用"],["1281 年","《授时历》颁行"]],"treaty":null,"significance":"宋元时期的科技成就在世界上处于领先地位，活字印刷、指南针、火药的广泛应用与外传，改变了世界的信息传播、航海和战争方式，为欧洲社会的转型提供了重要条件，也证明了中华文明对世界文明发展的贡献。","source":{"quote":"若止印三二本，未为简易；若印数十百千本，则极为神速。","from":"沈括《梦溪笔谈·技艺》（北宋）"},"pitfall":"活字印刷术的发明者是北宋毕昇，不是东汉蔡伦；《授时历》由郭守敬编订，不是沈括；指南针用于航海始于北宋，不是战国。","memory":"毕昇活字沈括记，指南航海火药飞；守敬授时一年整，四大发明天下传。","link":"科技与文化的成就，是这一单元经济繁荣、民族交融和对外交流的集中体现，也为下一单元明清的历史作了铺垫。","exam":["活字印刷术的发明与传播","指南针、火药的应用与外传","沈括、郭守敬的科技成就"]}],"questions":[{"id":"b2q1","lesson":"b2l1","unit":"b2","type":"choice","level":1,"stem":"北宋初年，宋太祖“杯酒释兵权”的直接目的是","options":["削弱宰相的行政权力","解除禁军将领的兵权，防止武将夺权","增加国家的财政收入","加强对地方财政的控制"],"answer":1,"explain":"“杯酒释兵权”针对的是石守信等禁军大将，目的是防止武将效仿陈桥兵变夺取政权。分割相权靠增设参知政事等，控制地方财政靠转运使。","point":"杯酒释兵权"},{"id":"b2q2","lesson":"b2l1","unit":"b2","type":"choice","level":2,"stem":"北宋扩大科举取士、重用文臣，这一做法带来的结果是","options":["武将地位提高，军队战斗力增强","中央集权加强，但官员冗滥、军队战斗力下降","地方势力膨胀，形成藩镇割据","宰相权力扩大，皇权受到限制"],"answer":1,"explain":"重文轻武防止了武将专权，加强了中央集权；但文臣掌兵、机构重叠，造成冗官冗兵冗费，军队战斗力下降，形成积贫积弱的局面。","point":"重文轻武的影响"},{"id":"b2q3","lesson":"b2l1","unit":"b2","type":"order","level":2,"stem":"按时间先后排列北宋政治领域的下列事件","items":["陈桥兵变，北宋建立","杯酒释兵权","庆历新政开始","王安石变法开始"],"explain":"北宋建立于 960 年，961 年杯酒释兵权，1043 年范仲淹主持庆历新政，1069 年宋神宗任用王安石变法。两次改革都是为了解决积贫积弱问题。","point":"北宋的政治与改革"},{"id":"b2q4","lesson":"b2l1","unit":"b2","type":"fill","level":2,"stem":"北宋在地方各州设置______，与知州共同签署文书，并有权直接向皇帝报告，以监督知州。","answer":["通判"],"explain":"通判是北宋为监督地方长官而设的官职，与知州相互牵制，体现了北宋分散地方权力、加强中央集权的思路。","point":"北宋对地方的管辖"},{"id":"b2q5","lesson":"b2l2","unit":"b2","type":"choice","level":1,"stem":"1005 年宋辽订立澶渊之盟，北宋每年送给辽的银两和绢帛被称为","options":["岁币","贡赋","榷场","赔款"],"answer":0,"explain":"澶渊之盟规定北宋每年给辽银十万两、绢二十万匹，称为“岁币”。榷场是边境互市市场，不是银绢。","point":"澶渊之盟"},{"id":"b2q6","lesson":"b2l2","unit":"b2","type":"choice","level":1,"stem":"1038 年称大夏皇帝、建立西夏政权的是","options":["耶律阿保机","元昊","完颜阿骨打","铁木真"],"answer":1,"explain":"元昊是党项族首领，1038 年称帝，史称西夏。耶律阿保机建立契丹，完颜阿骨打建立金，铁木真统一蒙古。","point":"西夏的建立"},{"id":"b2q7","lesson":"b2l2","unit":"b2","type":"match","level":2,"stem":"把下列政权与其建立者配对","pairs":[["契丹（辽）","耶律阿保机"],["西夏","元昊"],["北宋","赵匡胤"],["金","完颜阿骨打"]],"explain":"916 年耶律阿保机建立契丹政权，960 年赵匡胤建立北宋，1038 年元昊建立西夏，1115 年完颜阿骨打建立金。四个政权在辽宋夏金时期长期并立。","point":"辽宋夏金政权的建立"},{"id":"b2q8","lesson":"b2l2","unit":"b2","type":"fill","level":1,"stem":"1005 年，北宋与辽订立______，此后双方保持了一百多年的和平局面。","answer":["澶渊之盟","澶渊之盟约"],"explain":"澶渊之盟订立于 1005 年，宋辽约为兄弟之国，北宋每年给辽岁币，此后百余年边境基本安定，榷场贸易兴盛。","point":"澶渊之盟"},{"id":"b2q9","lesson":"b2l3","unit":"b2","type":"choice","level":1,"stem":"1127 年，金军攻破开封，掳走宋徽宗、宋钦宗，北宋灭亡。这一事件史称","options":["靖康之变","陈桥兵变","绍兴和议","澶渊之盟"],"answer":0,"explain":"1127 年是靖康年间，金军攻破开封、掳走二帝，史称靖康之变。陈桥兵变发生在 960 年，澶渊之盟在 1005 年，绍兴和议在 1141 年。","point":"靖康之变"},{"id":"b2q10","lesson":"b2l3","unit":"b2","type":"choice","level":2,"stem":"1140 年，岳飞率领“岳家军”大败金军主力的战役是","options":["澶州之战","郾城大捷","崖山海战","东京保卫战"],"answer":1,"explain":"1140 年岳飞在郾城大败金军主力，乘胜收复郑州、洛阳等地。澶州之战发生在 1004 年宋辽之间，崖山海战是 1279 年元灭南宋。","point":"岳飞抗金"},{"id":"b2q11","lesson":"b2l3","unit":"b2","type":"order","level":2,"stem":"按时间先后排列下列与宋金关系有关的事件","items":["金灭辽","靖康之变，北宋灭亡","赵构建立南宋","郾城大捷","宋金达成绍兴和议"],"explain":"1125 年金灭辽，1127 年金灭北宋、赵构随即建立南宋，1140 年岳飞取得郾城大捷，1141 年宋金订立绍兴和议，南北对峙局面形成。","point":"金与南宋的对峙"},{"id":"b2q12","lesson":"b2l3","unit":"b2","type":"choice","level":3,"stem":"澶渊之盟与绍兴和议的共同之处是","options":["都是宋朝与金朝订立的和约","宋朝都要每年送给对方银两和绢帛","都规定宋朝向对方称臣","都使宋朝收复了燕云十六州"],"answer":1,"explain":"两次和议都以宋朝每年交纳银绢换取和平，这是共同点。澶渊之盟的对手是辽，双方约为兄弟之国；绍兴和议规定南宋向金称臣，宋始终没能收复燕云十六州。","point":"宋与辽、金和议的比较"},{"id":"b2q13","lesson":"b2l4","unit":"b2","type":"choice","level":1,"stem":"世界上最早的纸币“交子”出现在","options":["北宋前期的四川地区","南宋的临安","唐朝的长安","元朝的大都"],"answer":0,"explain":"北宋前期，四川地区商业发达，铁钱笨重，出现了纸币交子，这是世界上最早的纸币，后来由官府发行。","point":"交子"},{"id":"b2q14","lesson":"b2l4","unit":"b2","type":"choice","level":2,"stem":"“苏湖熟，天下足”的谚语反映了宋代","options":["北方农业超过南方","太湖流域成为全国重要的粮仓","经济重心南移刚刚开始","海外贸易收入超过农业税"],"answer":1,"explain":"苏州、湖州一带粮食丰足，说明太湖流域成为重要粮仓，是经济重心南移的表现。南移始于唐中期，完成于南宋，并非刚刚开始。","point":"经济重心南移"},{"id":"b2q15","lesson":"b2l4","unit":"b2","type":"match","level":2,"stem":"把宋代经济的部门与其主要成就配对","pairs":[["农业","占城稻推广，苏州、湖州成为粮仓"],["手工业","景德镇成为瓷都，瓷器大量外销"],["商业","四川地区出现纸币交子"],["海外贸易","广州、泉州设市舶司管理贸易"]],"explain":"宋代农业以占城稻推广和稻麦轮作为代表，手工业以景德镇瓷器和造船业著称，商业出现纸币交子，海外贸易由市舶司管理。","point":"宋代经济的发展"},{"id":"b2q16","lesson":"b2l4","unit":"b2","type":"fill","level":1,"stem":"北宋前期，四川地区出现的世界上最早的纸币叫“______”。","answer":["交子"],"explain":"交子出现于北宋前期的四川，用纸印制，便于携带和大宗交易，是世界上最早的纸币。","point":"交子"},{"id":"b2q17","lesson":"b2l5","unit":"b2","type":"choice","level":1,"stem":"1206 年，统一蒙古各部、被推举为全蒙古大汗并被尊为“成吉思汗”的是","options":["忽必烈","铁木真","耶律阿保机","完颜阿骨打"],"answer":1,"explain":"铁木真统一蒙古各部，1206 年被推举为大汗，尊号“成吉思汗”。忽必烈是元朝开国皇帝，耶律阿保机建契丹，完颜阿骨打建金。","point":"成吉思汗统一蒙古"},{"id":"b2q18","lesson":"b2l5","unit":"b2","type":"choice","level":2,"stem":"元朝建立的时间、建立者和都城分别是","options":["1206 年、铁木真、和林","1271 年、忽必烈、大都","1279 年、忽必烈、大都","1115 年、完颜阿骨打、会宁"],"answer":1,"explain":"1271 年忽必烈改国号为元，次年定都大都（今北京）。1206 年建立的是蒙古政权，1279 年元朝才统一全国。","point":"元朝的建立"},{"id":"b2q19","lesson":"b2l5","unit":"b2","type":"order","level":2,"stem":"按时间先后排列蒙古兴起与元朝统一的下列事件","items":["铁木真统一蒙古，建立蒙古政权","蒙古灭西夏","蒙古灭金","忽必烈改国号为元","元灭南宋残部，统一全国"],"explain":"1206 年蒙古政权建立，1227 年灭西夏，1234 年灭金，1271 年忽必烈改国号为元，1279 年消灭南宋残部，完成全国统一。","point":"蒙古的兴起与元朝统一"},{"id":"b2q20","lesson":"b2l5","unit":"b2","type":"fill","level":1,"stem":"1271 年，忽必烈改国号为______，次年定都大都。","answer":["元","大元"],"explain":"1271 年忽必烈定国号为元，1272 年定都大都。元朝是中国历史上第一个由少数民族建立的大一统王朝。","point":"元朝的建立"},{"id":"b2q21","lesson":"b2l6","unit":"b2","type":"choice","level":1,"stem":"元朝在地方推行、成为我国省级行政区划开端的制度是","options":["分封制","郡县制","行省制度","三省六部制"],"answer":2,"explain":"元朝在地方设行省，行省是中书省的派出机构，掌管地方军政事务，我国省级行政区划由此开端。郡县制始于秦朝，三省六部制始于隋唐。","point":"行省制度"},{"id":"b2q22","lesson":"b2l6","unit":"b2","type":"choice","level":2,"stem":"元朝设置管理西藏地区军政和佛教事务的中央机构是","options":["宣政院","澎湖巡检司","中书省","北庭都元帅府"],"answer":0,"explain":"宣政院管理全国佛教事务并管辖西藏地区，西藏从此正式纳入中央政府行政管辖。澎湖巡检司管辖澎湖和琉球，北庭都元帅府管辖西域。","point":"元朝对西藏的管辖"},{"id":"b2q23","lesson":"b2l6","unit":"b2","type":"match","level":2,"stem":"把元朝的机构与其管辖范围配对","pairs":[["宣政院","管辖西藏地区"],["澎湖巡检司","管辖澎湖和琉球（今台湾）"],["北庭都元帅府","管辖西域地区"],["行省","地方最高行政区划"]],"explain":"元朝通过宣政院、澎湖巡检司、北庭都元帅府等机构，把西藏、台湾、西域纳入中央政府的有效管辖，行省则是地方最高行政区划。","point":"元朝对边疆的管辖"},{"id":"b2q24","lesson":"b2l6","unit":"b2","type":"choice","level":3,"stem":"元朝时期，因各族长期杂居通婚而逐渐形成的新民族是","options":["回族","蒙古族","女真族","契丹族"],"answer":0,"explain":"元朝时东迁的波斯人、阿拉伯人与汉族、蒙古族、畏兀儿等族长期杂居通婚，逐渐形成回族。蒙古族在 1206 年蒙古统一时已形成，女真、契丹是更早的民族。","point":"元朝的民族交融"},{"id":"b2q25","lesson":"b2l7","unit":"b2","type":"choice","level":1,"stem":"宋元城市中娱乐兼营商业的场所被称为","options":["坊市","瓦子","草市","榷场"],"answer":1,"explain":"瓦子（瓦舍、瓦肆）是娱乐兼营商业的场所，里面有勾栏上演杂剧、说书等。坊市是唐代城市格局，草市是乡村集市，榷场是边境互市市场。","point":"瓦子与市民生活"},{"id":"b2q26","lesson":"b2l7","unit":"b2","type":"choice","level":2,"stem":"下列宋词作家与作品风格对应正确的是","options":["苏轼——婉约细腻，多写离愁别绪","李清照——豪放派，气象开阔","辛弃疾——豪放派，多抒抗金报国之志","柳永——豪放派，善写边塞风光"],"answer":2,"explain":"辛弃疾是豪放派代表，词中多抒发抗金报国之志。苏轼是豪放派，李清照、柳永是婉约派，四人的风格不能颠倒。","point":"宋词的代表人物"},{"id":"b2q27","lesson":"b2l7","unit":"b2","type":"match","level":2,"stem":"把下列人物与其代表作配对","pairs":[["苏轼","《念奴娇·赤壁怀古》"],["李清照","《如梦令》"],["关汉卿","《窦娥冤》"],["司马光","《资治通鉴》"]],"explain":"苏轼、李清照是宋词代表，关汉卿是元杂剧代表，司马光主持编写编年体通史《资治通鉴》。","point":"宋元时期的文化成就"},{"id":"b2q28","lesson":"b2l7","unit":"b2","type":"fill","level":2,"stem":"北宋司马光主持编写的《______》是一部编年体通史，记述了从战国到五代的历史。","answer":["资治通鉴"],"explain":"《资治通鉴》由司马光主持编写，1084 年成书，按年月日顺序记事，属编年体通史，书名取“鉴于往事，有资于治道”之意。","point":"《资治通鉴》"},{"id":"b2q29","lesson":"b2l8","unit":"b2","type":"choice","level":1,"stem":"宋朝在广州、泉州等地设置的管理海外贸易、征收商税的机构是","options":["市舶司","宣政院","转运使","枢密院"],"answer":0,"explain":"市舶司负责发放出海公凭、征收商税、管理外商，是宋元管理海外贸易的机构。宣政院管西藏，转运使管地方财赋，枢密院掌军事。","point":"市舶司与海外贸易"},{"id":"b2q30","lesson":"b2l8","unit":"b2","type":"choice","level":2,"stem":"元朝时来华、回国后口述《马可·波罗行纪》的意大利旅行家是","options":["马可·波罗","汪大渊","沈括","郭守敬"],"answer":0,"explain":"马可·波罗是意大利威尼斯商人，元朝时来华并在中国生活十七年，回国后口述游记。汪大渊是元朝航海家，著《岛夷志略》。","point":"马可·波罗来华"},{"id":"b2q31","lesson":"b2l8","unit":"b2","type":"match","level":2,"stem":"把下列人物、地点与其相关内容配对","pairs":[["市舶司","管理海外贸易的机构"],["泉州","元朝时世界著名的大港"],["马可·波罗","元朝时来华的意大利旅行家"],["《岛夷志略》","汪大渊记录亚非风土的著作"]],"explain":"宋元时期海路贸易繁荣，市舶司管理贸易，泉州成为大港，马可·波罗来华著游记，汪大渊著《岛夷志略》，都是对外交流活跃的见证。","point":"宋元时期的对外交流"},{"id":"b2q32","lesson":"b2l8","unit":"b2","type":"fill","level":1,"stem":"元朝时，意大利旅行家______来到中国，他的游记激起了欧洲人对东方的向往。","answer":["马可·波罗","马可波罗"],"explain":"马可·波罗元朝时来华，曾在元朝任职，回国后口述《马可·波罗行纪》，书中对东方富庶的描述影响了后来的欧洲航海家。","point":"马可·波罗来华"},{"id":"b2q33","lesson":"b2l9","unit":"b2","type":"choice","level":1,"stem":"北宋时期发明泥活字印刷术的是","options":["蔡伦","毕昇","沈括","郭守敬"],"answer":1,"explain":"北宋匠人毕昇发明泥活字印刷术，比雕版省时省料。蔡伦改进造纸术，沈括著《梦溪笔谈》记载了活字印刷，郭守敬编订《授时历》。","point":"活字印刷术的发明"},{"id":"b2q34","lesson":"b2l9","unit":"b2","type":"choice","level":2,"stem":"我国古代指南针开始应用于航海是在","options":["战国时期","唐朝","北宋","明朝"],"answer":2,"explain":"战国时的司南是最早的指南仪器，但指南针用于航海始于北宋，南宋时广泛使用，为远洋航行提供了重要条件。","point":"指南针的应用"},{"id":"b2q35","lesson":"b2l9","unit":"b2","type":"match","level":2,"stem":"把下列人物或发明与其成就配对","pairs":[["毕昇","泥活字印刷术"],["沈括","《梦溪笔谈》"],["郭守敬","《授时历》"],["指南针","北宋开始应用于航海"]],"explain":"毕昇发明活字印刷，沈括以《梦溪笔谈》记录科技成就，郭守敬编订《授时历》，指南针在北宋开始用于航海，都是宋元科技领先世界的表现。","point":"宋元时期的科技成就"},{"id":"b2q36","lesson":"b2l9","unit":"b2","type":"choice","level":3,"stem":"宋元时期活字印刷术、指南针和火药相继外传，它们对世界的共同影响是","options":["使欧洲最早进入封建社会","推动了欧洲社会转型和世界文明进步","使中国从此失去科技领先地位","直接引发了欧洲的宗教改革"],"answer":1,"explain":"印刷术促进思想传播，指南针推动新航路开辟，火药改变了战争方式，三者共同为欧洲社会转型和世界文明进步提供了条件。","point":"四大发明外传的影响"}],"timeline":[{"t":"916 年","y":916,"text":"耶律阿保机统一契丹各部，建立契丹政权，后改国号为辽","unit":"b2","tag":"民族政权","volume":"v2"},{"t":"960 年","y":960,"text":"陈桥兵变，赵匡胤建立北宋，定都开封","unit":"b2","tag":"民族政权","volume":"v2"},{"t":"1005 年","y":1005,"text":"宋辽订立澶渊之盟，北宋每年给辽岁币，边境百年安定","unit":"b2","tag":"民族关系","volume":"v2"},{"t":"1038 年","y":1038,"text":"元昊称帝，建立西夏，与北宋、辽形成三足并立","unit":"b2","tag":"民族政权","volume":"v2"},{"t":"1115 年","y":1115,"text":"完颜阿骨打建立金政权；1125 年金灭辽","unit":"b2","tag":"民族政权","volume":"v2"},{"t":"1127 年","y":1127,"text":"靖康之变，北宋灭亡；赵构建立南宋","unit":"b2","tag":"民族关系","volume":"v2"},{"t":"1141 年","y":1141,"text":"宋金达成绍兴和议，南北对峙局面形成","unit":"b2","tag":"民族关系","volume":"v2"},{"t":"1206 年","y":1206,"text":"铁木真统一蒙古各部，被尊为成吉思汗","unit":"b2","tag":"民族政权","volume":"v2"},{"t":"1271—1279 年","y":1271,"text":"忽必烈定国号为元、定都大都，元灭南宋，统一全国","unit":"b2","tag":"大一统","volume":"v2"},{"t":"1368 年","y":1368,"text":"红巾军攻入大都，元朝灭亡","unit":"b2","tag":"元朝","volume":"v2"}]},{"volume":"v2","unit":{"id":"b3","volume":"v2","num":3,"title":"明清时期（至鸦片战争前）：统一多民族封建国家的巩固与发展","short":"明清帝国","years":"1368—1840 年","accent":"#6E4E7A","soft":"#F0E6F2","tint":"#D8C3DE","icon":"🏯","tagline":"皇权登峰，疆域底定，明清帝国在繁荣中转身向内。","intro":"1368 年明朝建立，1644 年清朝入关，近五百年间，皇权一步步集中到皇帝手中，边疆在战争与册封中纳入版图，市镇、商帮和人口织出繁荣景象。也正是在这时，文字狱、闭关锁国和僵化的体制，让中国与走向近代的世界渐行渐远。本单元要回答：明清的“巩固”究竟巩固了什么，又遮蔽了什么？","bigQuestion":"明清两朝把皇权和疆域都推到了顶峰，为什么却没能挡住近代的冲击？","goals":["说出明清两朝强化皇权的主要措施及其影响。","梳理清朝巩固边疆的史事，理解统一多民族国家的发展。","概括清朝前期经济繁荣的表现与人口压力。","列举明清科技文化成就，认识其总结性与世俗化特点。"],"keyLine":"洪武废相设厂卫 → 郑和七下西洋 → 崇祯自缢清入关 → 康雍乾巩固边疆、设军机、锁国门 → 鸦片战争前夜危机已现。"},"lessons":[{"id":"b3l1","num":15,"unit":"b3","title":"明朝的统治","years":"1368—1644 年","icon":"👑","tag":"明","hook":"1368 年正月初四，应天府城内钟鼓齐鸣。一个放过牛、当过和尚的农家子弟，在这里换上龙袍，宣布建立大明王朝。","core":"朱元璋建立明朝后，废除丞相、权分六部，设厂卫特务机构，用八股取士，把皇权推到新高度；同时恢复经济、经营边疆，为明朝近三百年的统治打下基础。","points":["建立：1368 年朱元璋称帝，定都应天府，年号洪武。他废除行省，设三司分掌地方民政、财政与司法。","中央：废除丞相和中书省，权分六部，六部直接对皇帝负责；设锦衣卫，后设东厂，监视臣民言行。","科举：考试只在“四书”“五经”范围内命题，答卷必须写成八股文，读书人的思想被严重束缚。","经济：鼓励垦荒、兴修水利、推广棉桑；景德镇瓷器精美；徽商、晋商等商帮活跃，商品经济日趋繁荣。","民族关系：修长城防御蒙古，东起鸭绿江、西至嘉峪关；1421 年迁都北京，形成“天子守国门”的格局。","1571 年，明朝册封蒙古俺答汗为顺义王，开放互市，长城沿线出现数十年的和平局面。"],"terms":[["厂卫","锦衣卫和东厂的合称。锦衣卫由皇帝直接指挥，掌管侍卫、缉捕、刑狱；东厂由宦官统领，专门侦查臣民言行。"],["八股文","明朝科举规定的答卷格式，分破题、承题、起讲等部分，内容只能代圣贤立言，形式死板，束缚思想。"],["三司","明朝地方机构，承宣布政使司管民政财政，提刑按察使司管司法，都指挥使司管军事，分权制衡。"],["互市","明朝与边疆民族在指定地点进行的贸易。1571 年明朝与蒙古俺答汗开互市，缓和了双方关系。"]],"figures":[["朱元璋","明太祖，建立明朝，废除丞相"],["朱棣","明成祖，1421 年迁都北京"],["俺答汗","蒙古首领，1571 年受封顺义王"]],"events":[["1368","朱元璋建立明朝，定都应天府"],["1380","废除丞相制度和中书省"],["1421","明成祖迁都北京"],["1571","册封俺答汗为顺义王，开放互市"]],"treaty":null,"significance":"明朝废除丞相、强化皇权，使君主专制空前加强，也埋下宦官专权、政治腐败的隐患；八股取士禁锢思想，影响了中国数百年。","source":{"quote":"以后子孙做皇帝时，并不许立丞相。臣下敢有奏请设立者，文武群臣即时劾奏，处以重刑。","from":"《皇明祖训·祖训首章》（明初）"},"pitfall":"废除丞相的是明太祖朱元璋，不是明成祖；八股取士始于明朝，不是清朝；厂卫是特务机构，不参与正常司法审判。","memory":"洪武开国都应天，废相分权六部专；锦衣东厂监臣下，八股文章锁心田。","link":"承接元末农民起义，明朝重建汉族政权 → 皇权强化与经济发展，为明朝对外交往和清朝制度提供基础。","exam":["明朝强化皇权的措施","八股取士的影响","明朝的民族关系与长城"]},{"id":"b3l2","num":16,"unit":"b3","title":"明朝的对外关系","years":"1405—1644 年","icon":"⛵","tag":"明","hook":"1405 年夏，苏州刘家港，两百多艘海船首尾相望，风帆遮天。船队载着丝绸、瓷器和两万多人，驶向茫无边际的西洋。","core":"明朝前期国力强盛，郑和七下西洋，最远抵达非洲东海岸和红海沿岸；中后期海防松弛，戚继光等抗击倭寇，葡萄牙人攫取澳门居住权，明朝的对外关系由主动走向被动。","points":["条件：明初国力强盛，造船和航海技术进步，指南针广泛用于航海，政府支持大规模远航。","郑和：1405—1433 年七次下西洋，先后到达亚非三十多个国家和地区，最远到非洲东海岸和红海沿岸。","目的与影响：宣扬国威、加强与海外各国的联系；是世界航海史上的壮举，增进了中国与亚非国家的友好往来。","倭患：明朝中期海防松弛，倭寇与中国海盗勾结，侵扰东南沿海，百姓的生命财产遭受重大损失。","抗倭：戚继光组建“戚家军”，1561 年在台州九战九捷，又与俞大猷等配合，基本解除东南沿海的倭患。","西方东来：1553 年葡萄牙人攫取在澳门的居住权；1624 年荷兰殖民者侵占台湾，中国海疆面临新的威胁。"],"terms":[["西洋","明朝时指今文莱以西的东南亚和印度洋沿岸地区。郑和下西洋即出使这一广阔海域。"],["倭寇","元末明初以来骚扰中国东南沿海的日本海盗，常与中国走私商人勾结，明朝中期最为猖獗。"],["戚家军","戚继光在浙江招募农民、矿工训练而成的军队，纪律严明、作战勇猛，是抗倭主力。"],["澳门","1553 年葡萄牙人以晾晒货物为借口取得居住权，此后长期居留，但澳门主权仍属中国。"]],"figures":[["郑和","航海家，七下西洋"],["戚继光","抗倭名将，取得台州大捷"],["俞大猷","与戚继光配合抗倭"],["李如松","率军援朝抗倭，取得平壤大捷"]],"events":[["1405","郑和首次下西洋"],["1433","第七次下西洋，郑和病逝于古里"],["1553","葡萄牙人攫取澳门居住权"],["1561","戚继光取得台州大捷"],["1592—1598","明朝派兵援朝抗倭"]],"treaty":null,"significance":"郑和下西洋是世界航海史上的空前壮举，比欧洲航海家的远航早半个多世纪；但明朝的远航以政治目的为主，未能转化为持续的海上开拓。","source":{"quote":"观夫海洋，洪涛接天，巨浪如山……而我之云帆高张，昼夜星驰，涉彼狂澜，若履通衢。","from":"《天妃灵应之记》碑（1431 年）"},"pitfall":"郑和下西洋最远到达非洲东海岸和红海沿岸，不是欧洲；抗倭的是戚继光，收复台湾的是郑成功，二者不可混淆。","memory":"七下西洋郑和船，台州九捷戚家军；澳门居住葡萄牙，荷兰侵占我台湾。","link":"明朝前期主动出海 → 中期海防松弛、被动挨打 → 清朝闭关锁国，中国与世界的距离越拉越大。","exam":["郑和下西洋的目的与影响","戚继光抗倭","明朝对外关系的变化"]},{"id":"b3l3","num":17,"unit":"b3","title":"明朝的灭亡和清朝的建立","years":"1616—1644 年","icon":"🔥","tag":"明清","hook":"1644 年 3 月，李自成的军队从居庸关一路南下，北京城门外火光冲天。崇祯帝在煤山的一棵老槐树下，结束了一个王朝。","core":"明朝后期政治腐败、土地兼并严重、赋税沉重，李自成起义推翻明朝；与此同时，努尔哈赤建立后金，皇太极改国号为清，清军入关后逐步确立对全国的统治。","points":["腐败：明朝中后期皇帝多沉迷享乐，宦官专权，魏忠贤把持朝政；土地不断集中于皇室、官僚和地主手中。","民变：为对付辽东战事加征“辽饷”等赋税，陕西连年灾荒，农民起义此起彼伏，李自成部逐渐成为主力。","口号：李自成提出“均田免赋”，得到广大农民拥护，队伍迅速壮大，1644 年在西安建立大顺政权。","灭明：1644 年 3 月，起义军攻入北京，崇祯帝自缢，统治近三百年的明朝灭亡。","后金：1616 年努尔哈赤统一女真各部，建立后金，定都赫图阿拉；1635 年皇太极改族名为满洲，1636 年改国号为清。","入关：1644 年吴三桂降清，清军入关，李自成兵败；顺治帝迁都北京，清朝逐步统一全国。"],"terms":[["均田免赋","李自成起义军提出的口号，主张把土地分给农民、免除赋税，反映了农民的土地要求。"],["后金","1616 年努尔哈赤建立的政权，是清朝的前身，定都赫图阿拉，后迁沈阳。"],["三饷","明朝末年加征的辽饷、剿饷、练饷，数额巨大，加重了农民负担，激化了社会矛盾。"],["大顺政权","1644 年李自成在西安建立的农民政权，同年攻入北京，推翻了明朝。"]],"figures":[["李自成","起义军领袖，建立大顺政权"],["努尔哈赤","统一女真各部，建立后金"],["皇太极","改族名为满洲，改国号为清"],["崇祯帝","明朝末代皇帝，1644 年自缢"]],"events":[["1616","努尔哈赤建立后金"],["1635","皇太极改女真族名为满洲"],["1636","皇太极改国号为清"],["1644.3","李自成攻入北京，明朝灭亡"],["1644.5","清军入关，迁都北京"]],"treaty":null,"significance":"明朝的灭亡是政治腐败、土地兼并和农民起义共同作用的结果；清朝入关后继承中原制度，逐步建立起对全国的统治，中国历史进入清朝时期。","source":{"quote":"吃他娘，穿他娘，开了大门迎闯王，闯王来时不纳粮。","from":"明末民谣（计六奇《明季北略》）"},"pitfall":"建立后金的是努尔哈赤，改国号为清的是皇太极；明朝亡于李自成起义军攻入北京，不是被清军直接攻破京城。","memory":"努尔哈赤建后金，皇太极改国号清；闯王进京明朝灭，三桂开关清入京。","link":"明朝在内忧外患中灭亡 → 清朝入关并巩固统一 → 清朝前期的疆域奠定与专制强化。","exam":["明朝灭亡的原因","后金与清的建立","李自成起义的口号"]},{"id":"b3l4","num":18,"unit":"b3","title":"统一多民族国家的巩固和发展","years":"1644—1840 年","icon":"🗺","tag":"清","hook":"1683 年，清军战船驶入台湾鹿耳门，郑氏政权归降。第二年的春天，一份诏书从北京发出：设台湾府，隶属福建省。","core":"清朝前期通过收复台湾、册封达赖和班禅、设驻藏大臣、平定大小和卓叛乱、设伊犁将军、雅克萨之战等举措，巩固了统一多民族国家，奠定了今日中国疆域的基础。","points":["台湾：1662 年郑成功收复台湾，赶走荷兰殖民者；1683 年清军进入台湾，1684 年设台湾府，隶属福建省。","西藏：顺治帝册封五世达赖“达赖喇嘛”，康熙帝册封五世班禅“班禅额尔德尼”；1727 年设立驻藏大臣。","西藏制度：1793 年颁布《钦定藏内善后章程》，规定金瓶掣签制度，加强了中央政府对西藏的管辖。","新疆：康熙帝三次亲征，平定噶尔丹；乾隆帝平定大小和卓叛乱，1762 年设伊犁将军，管辖整个新疆地区。","回归：1771 年，渥巴锡率领土尔扈特部万里东归，回到新疆，受到乾隆帝接见，成为民族交融的佳话。","东北与西南：1685—1686 年雅克萨之战击败沙俄，1689 年签订《尼布楚条约》；雍正时在西南推行改土归流。"],"terms":[["驻藏大臣","1727 年清朝设立，代表中央政府与达赖、班禅共同管理西藏事务，加强了中央对西藏的管辖。"],["金瓶掣签","1793 年《钦定藏内善后章程》规定的活佛转世制度，转世灵童须经金瓶掣签、报中央政府批准。"],["伊犁将军","1762 年清朝设立，管辖天山南北的军政事务，是清朝治理新疆的最高军政长官。"],["改土归流","清朝废除西南少数民族地区的土司制度，改设府、厅、州、县，由中央委派流官管理。"]],"figures":[["郑成功","收复台湾的民族英雄"],["康熙帝","平定噶尔丹，设台湾府，签《尼布楚条约》"],["乾隆帝","平定大小和卓叛乱，接待土尔扈特部"],["渥巴锡","土尔扈特部首领，率部万里东归"]],"events":[["1662","郑成功收复台湾"],["1684","清朝设台湾府"],["1689","中俄签订《尼布楚条约》"],["1727","设驻藏大臣"],["1762","设伊犁将军"],["1771","土尔扈特部回归新疆"]],"treaty":{"name":"《尼布楚条约》","date":"1689 年","items":["中俄两国以格尔必齐河、额尔古纳河和外兴安岭为界","外兴安岭以北属俄国，以南属中国","乌第河地区留待以后议定","两国不得收留对方逃亡者，持有护照者可过界贸易"],"note":"这是中俄双方在平等协商基础上签订的第一个边界条约，从法律上肯定了黑龙江和乌苏里江流域包括库页岛在内的广大地区都是中国领土。"},"significance":"清朝前期的这些举措，加强了中央对边疆的管辖，巩固了统一多民族国家，基本奠定了今天中国的疆域；也促进了边疆开发和各民族交往交流交融。","source":{"quote":"开辟荆榛逐荷夷，十年始克复先基。","from":"郑成功《复台》（1662 年）"},"pitfall":"郑成功收复台湾赶走的是荷兰殖民者，不是葡萄牙人；设台湾府的是清朝（1684 年），不是郑氏政权；《尼布楚条约》是平等条约。","memory":"郑成功收台湾，驻藏大臣管西藏；伊犁将军辖新疆，尼布楚约定东北。","link":"承接明朝的边疆经营 → 清朝把统一多民族国家推到新高度 → 为清朝前期经济文化发展提供稳定环境。","exam":["清朝对台湾、西藏、新疆的管辖","《尼布楚条约》的性质","统一多民族国家的巩固"]},{"id":"b3l5","num":19,"unit":"b3","title":"清朝前期社会经济的发展","years":"1644—1840 年","icon":"🌾","tag":"清","hook":"乾隆年间，江南市镇上“商贾云集，百货骈阗”。码头上，一船船稻米、棉布、瓷器正待起运，远处山地里，新开的坡田一直延伸到云雾里。","core":"清朝前期，统治者重视农业，耕地扩大、高产作物推广，人口迅速增长；手工业和商业繁荣，形成全国性商业网；但人地矛盾、环境破坏和封建制度的束缚，也制约着社会继续发展。","points":["农业恢复：清政府鼓励垦荒、兴修水利，推广玉米、甘薯等高产作物，粮食产量大幅提高。","人口：社会安定、赋税改革，人口迅速增长，乾隆末年突破 3 亿，成为当时世界上人口最多的国家。","手工业：丝织、棉织、制瓷、矿冶等行业发展，景德镇成为制瓷业中心，产品远销海内外。","商业：形成农村集市、城镇市场、区域性市场和全国性市场组成的商业网，晋商、徽商等商帮活跃。","问题：人口增长使人地矛盾突出，大量开垦导致水土流失；重农抑商和闭关锁国政策阻碍经济进一步发展。","盛世：康熙、雍正、乾隆时期，社会相对安定、经济繁荣，史称“康乾盛世”，但盛世之下已隐藏危机。"],"terms":[["康乾盛世","清朝康熙、雍正、乾隆三朝社会相对安定、经济繁荣、疆域巩固的局面，也潜伏着人口与制度的危机。"],["商帮","明清时期按地域结成的商人团体，如晋商、徽商，经营盐、茶、布、票号等，势力遍及全国。"],["高产作物","明朝引进、清朝推广的玉米、甘薯、马铃薯等原产美洲的作物，耐旱高产，推动了山地开发和人口增长。"],["人地矛盾","人口增长快于耕地增长，人均耕地减少，粮食紧张、地价上涨，成为清朝中后期的社会难题。"]],"figures":[["康熙帝","奖励垦荒，1712 年宣布“滋生人丁，永不加赋”"],["雍正帝","推行摊丁入亩，放松对农民的人身控制"],["乾隆帝","在位时人口突破 3 亿，盛世之下危机渐显"]],"events":[["清初","奖励垦荒，兴修水利"],["1712","宣布“滋生人丁，永不加赋”"],["18 世纪中期","全国人口增至 3 亿"],["乾隆年间","晋商、徽商势力鼎盛"]],"treaty":null,"significance":"清朝前期经济的恢复和发展，支撑了疆域巩固和人口增长，使中国仍是世界上的经济大国；但农业为主、人口压力与闭关政策，使中国与正在工业化的西方差距拉大。","source":{"quote":"今海宇承平已久，户口日繁，若按见在人丁加征钱粮，实有不可。","from":"《清圣祖实录》卷二百四十九（1712 年）"},"pitfall":"“康乾盛世”是清朝前期的繁荣局面，不等于中国已进入近代；人口增长既是经济发展的表现，也是人地矛盾加剧的根源。","memory":"垦荒兴水利，玉米甘薯上山地；三亿人口商帮忙，盛世底下藏危机。","link":"承接清朝疆域巩固带来的安定局面 → 经济发展与人口压力 → 君主专制强化和闭关锁国限制了进一步发展。","exam":["清朝前期农业与人口","商帮与全国性商业网","康乾盛世的评价"]},{"id":"b3l6","num":20,"unit":"b3","title":"清朝君主专制的强化","years":"1644—1840 年","icon":"🔒","tag":"清","hook":"雍正年间，紫禁城隆宗门内的一间小屋，军机大臣跪在皇帝面前聆听谕旨，随即提笔记录。这里没有议政的喧哗，只有笔尖划过纸面的声音。","core":"清朝雍正帝设立军机处，军机大臣只供传述缮撰、跪受笔录，军政大权完全集中于皇帝，君主专制达到顶峰；文字狱禁锢思想，闭关锁国又使中国逐渐隔绝于世界潮流之外。","points":["军机处：雍正年间设立，军机大臣由皇帝钦定，跪受笔录、承旨办事，军政大权完全集中于皇帝。","奏折制度：官员可密折奏事，皇帝直接批阅，绕过内阁和议政王大臣会议，进一步加强了皇权。","文字狱：康熙、雍正、乾隆三朝，从文人著作中摘取字句罗织罪名，制造冤狱，禁锢思想、摧残人才。","文化政策：推崇儒家学说，提倡尊孔读经；同时禁书毁书，许多珍贵典籍在编纂《四库全书》时被删改。","闭关锁国：严格限制对外贸易，1757 年只留广州一处通商口岸，由广州十三行统一经营管理。","影响：闭关锁国对西方殖民者的侵略起过一定的自卫作用，但使中国看不到世界的变化，逐渐落伍。"],"terms":[["军机处","清朝雍正年间设立的辅助皇帝处理军政要务的机构，军机大臣无决策权，君主专制由此达到顶峰。"],["文字狱","统治者从文人的著作中摘取字句、罗织罪名而制造的冤狱，清朝康雍乾时期尤为严酷。"],["闭关锁国","清朝严格限制对外贸易和交往的政策，乾隆时只开广州一处，阻碍了中国与世界的交流。"],["十三行","清朝广州经营对外贸易的商人团体，1757 年后统一经营管理对外贸易，代海关征收关税。"]],"figures":[["雍正帝","设立军机处，推行密折制度"],["乾隆帝","文字狱严酷，1757 年定广州一口通商"],["康熙帝","兴文字狱，也组织编纂《康熙字典》"]],"events":[["雍正年间","设立军机处"],["康熙至乾隆","文字狱盛行"],["1757","只留广州一处通商口岸"]],"treaty":null,"significance":"军机处的设立使君主专制达到顶峰，行政效率提高但决策完全依赖皇帝个人；文字狱和闭关锁国扼杀了思想活力，使中国在世界工业化浪潮前夜逐渐落后。","source":{"quote":"军机大臣只供传述缮撰，而不能稍有赞画于其间。","from":"赵翼《檐曝杂记》（清）"},"pitfall":"军机处是雍正帝设立的，不是康熙帝；军机大臣没有决策权，只是“跪受笔录”；闭关锁国不是完全断绝往来，而是严格限制。","memory":"雍正设军机，跪受笔录权归帝；文字狱锁思想，一口通商门自闭。","link":"君主专制的强化与闭关锁国相互配合，与同一时期西方资产阶级革命和工业革命形成鲜明对比。","exam":["军机处的设立与影响","文字狱的危害","闭关锁国的表现与评价"]},{"id":"b3l7","num":21,"unit":"b3","title":"明清时期的科技与文化","years":"1368—1840 年","icon":"📚","tag":"文化","hook":"1637 年，宋应星放下笔，看着案头厚厚的手稿：从种稻、制盐到炼锌、造纸，一百三十多项生产技术被他一一画下、写清。","core":"明清时期，传统科技进入总结阶段，《本草纲目》《天工开物》《农政全书》等巨著问世；小说、戏曲走向世俗与繁荣，四大名著和京剧成为中华文化的瑰宝。","points":["医药：李时珍历时二十七年写成《本草纲目》，记载药物一千八百多种，被誉为“东方医药巨典”。","工艺：宋应星《天工开物》总结农业和手工业生产技术，被誉为“中国 17 世纪的工艺百科全书”。","农学与地理：徐光启《农政全书》系统总结农业生产经验；徐霞客《徐霞客游记》记载石灰岩溶洞地貌。","建筑：明长城东起鸭绿江、西至嘉峪关；北京城以紫禁城为中心，中轴线布局严整，体现皇权至上。","小说：罗贯中《三国演义》、施耐庵《水浒传》、吴承恩《西游记》、曹雪芹《红楼梦》，后者是中国古典小说的高峰。","戏曲：昆曲一度独领风骚，汤显祖《牡丹亭》脍炙人口；乾隆年间四大徽班进京，徽汉合流，逐渐形成京剧。"],"terms":[["《天工开物》","宋应星所著，总结农业和手工业生产技术，被誉为“中国 17 世纪的工艺百科全书”。"],["《本草纲目》","李时珍所著药物学巨著，记载药物一千八百多种，对世界医药学产生深远影响。"],["京剧","清朝乾隆年间四大徽班进京，与汉调等融合形成的剧种，被誉为中国的“国粹”。"],["《红楼梦》","曹雪芹创作的长篇小说，以贾宝玉、林黛玉的爱情悲剧为线索，揭示封建社会末期的腐朽，是中国古典小说的高峰。"]],"figures":[["李时珍","著《本草纲目》"],["宋应星","著《天工开物》"],["徐光启","著《农政全书》，与利玛窦合译《几何原本》"],["曹雪芹","著《红楼梦》"]],"events":[["1578","《本草纲目》写成"],["1637","《天工开物》刊行"],["明末","《徐霞客游记》成书"],["清乾隆年间","四大徽班进京，京剧逐渐形成"]],"treaty":null,"significance":"明清科技以总结传统经验为主，缺少实验和理论突破；文学艺术则走向世俗化和大众化，四大名著和京剧成为中华文明的标志性成果。","source":{"quote":"卷分前后，乃贵五谷而贱金玉之义。","from":"宋应星《天工开物·序》（1637 年）"},"pitfall":"《天工开物》是宋应星所作，不是李时珍；京剧形成于清朝，不是明朝；《红楼梦》是小说，不是史书。","memory":"时珍本草纲目全，应星天工开物篇；四大名著红楼梦，徽班进京京剧传。","link":"明清科技文化的总结与繁荣，是统一多民族国家巩固的成果，也与同一时期西方近代科学的兴起形成对照。","exam":["明清科技著作及其作者","四大名著与京剧","明清科技的特点"]}],"questions":[{"id":"b3q1","lesson":"b3l1","unit":"b3","type":"choice","level":1,"stem":"1368 年，在应天府称帝、建立明朝的是","options":["朱元璋","朱棣","李自成","努尔哈赤"],"answer":0,"explain":"1368 年朱元璋称帝，定都应天府，年号洪武，即明太祖。朱棣是明成祖，1421 年迁都北京；李自成推翻了明朝；努尔哈赤建立的是后金。","point":"明朝的建立"},{"id":"b3q2","lesson":"b3l1","unit":"b3","type":"choice","level":2,"stem":"明太祖为加强皇权，在中央采取的措施是","options":["废除丞相制度和中书省，权分六部","设立军机处，军机大臣跪受笔录","设立驻藏大臣，管理西藏事务","设置台湾府，隶属福建省"],"answer":0,"explain":"明太祖废除丞相和中书省，把权力分给六部，六部直接对皇帝负责。军机处是清朝雍正帝设立的，驻藏大臣和台湾府也都是清朝的措施。","point":"明朝强化皇权的措施"},{"id":"b3q3","lesson":"b3l1","unit":"b3","type":"order","level":2,"stem":"按时间先后排列下列明朝的史事","items":["朱元璋称帝，建立明朝","废除丞相制度和中书省","明成祖迁都北京","册封俺答汗为顺义王，开放互市"],"explain":"1368 年明朝建立 → 1380 年废除丞相 → 1421 年迁都北京 → 1571 年册封俺答汗、开放互市。","point":"明朝的建立与统治措施"},{"id":"b3q4","lesson":"b3l1","unit":"b3","type":"fill","level":1,"stem":"明朝科举考试只许在“四书”“五经”范围内命题，答卷必须写成死板的______，读书人的思想被严重束缚。","answer":["八股文","八股"],"explain":"八股文分破题、承题、起讲等固定部分，内容只能代圣贤立言，形式僵化，是明朝加强思想控制的工具。","point":"八股取士"},{"id":"b3q5","lesson":"b3l2","unit":"b3","type":"choice","level":1,"stem":"郑和下西洋最远到达的地区是","options":["印度半岛南端","波斯湾沿岸","非洲东海岸和红海沿岸","地中海沿岸"],"answer":2,"explain":"1405—1433 年郑和七次下西洋，到达亚非三十多个国家和地区，最远抵达非洲东海岸和红海沿岸，并未到达欧洲的地中海。","point":"郑和下西洋"},{"id":"b3q6","lesson":"b3l2","unit":"b3","type":"choice","level":2,"stem":"1553 年，以晾晒货物为借口攫取在中国澳门居住权的是","options":["西班牙人","葡萄牙人","荷兰人","英国人"],"answer":1,"explain":"1553 年葡萄牙人取得在澳门的居住权。1624 年侵占台湾的是荷兰殖民者，1662 年郑成功收复台湾。","point":"西方殖民者的东来"},{"id":"b3q7","lesson":"b3l2","unit":"b3","type":"match","level":2,"stem":"把下列人物、国家与其主要活动配对","pairs":[["郑和","七次下西洋"],["戚继光","台州九战九捷"],["李如松","率军援朝抗倭"],["葡萄牙","攫取澳门居住权"]],"explain":"郑和远航宣扬国威；戚继光、俞大猷抗击倭寇；李如松参加援朝抗倭；葡萄牙人 1553 年取得澳门居住权。","point":"明朝的对外关系"},{"id":"b3q8","lesson":"b3l2","unit":"b3","type":"fill","level":2,"stem":"1405—1433 年，郑和先后______次下西洋，是世界航海史上的壮举。","answer":["七","7","七次"],"explain":"郑和共七次远航，每次都由刘家港出发，最远到达非洲东海岸和红海沿岸。","point":"郑和下西洋"},{"id":"b3q9","lesson":"b3l3","unit":"b3","type":"choice","level":1,"stem":"1636 年，改女真族名为满洲、改国号为清的是","options":["努尔哈赤","皇太极","顺治帝","康熙帝"],"answer":1,"explain":"1616 年努尔哈赤建立后金；1635 年皇太极改女真族名为满洲，1636 年改国号为清。","point":"清朝的建立"},{"id":"b3q10","lesson":"b3l3","unit":"b3","type":"choice","level":1,"stem":"明末李自成起义军提出的口号是","options":["“均田免赋”","“扶清灭洋”","“自强”“求富”","“民主”“科学”"],"answer":0,"explain":"“均田免赋”反映了农民对土地和减轻赋税的渴望，起义军因此得到广泛拥护。“扶清灭洋”是义和团的口号，“自强”“求富”是洋务运动的口号。","point":"李自成起义"},{"id":"b3q11","lesson":"b3l3","unit":"b3","type":"order","level":2,"stem":"按时间先后排列明清易代过程中的重大事件","items":["努尔哈赤建立后金","皇太极改国号为清","李自成攻入北京，明朝灭亡","清军入关，迁都北京"],"explain":"1616 年后金建立 → 1636 年改国号为清 → 1644 年 3 月明朝灭亡 → 1644 年 5 月清军入关、迁都北京。","point":"明朝灭亡与清朝建立"},{"id":"b3q12","lesson":"b3l3","unit":"b3","type":"fill","level":2,"stem":"1644 年，李自成在______建立大顺政权，同年攻入北京，推翻了明朝。","answer":["西安"],"explain":"1644 年李自成在西安建立大顺政权，随后挥师北上，攻入北京，崇祯帝自缢，明朝灭亡。","point":"大顺政权"},{"id":"b3q13","lesson":"b3l4","unit":"b3","type":"choice","level":1,"stem":"1684 年，清朝设置台湾府，隶属","options":["广东省","福建省","浙江省","江苏省"],"answer":1,"explain":"1683 年清军进入台湾，1684 年设台湾府，隶属福建省，加强了中央对台湾的管辖；1885 年台湾才正式建省。","point":"清朝对台湾的管辖"},{"id":"b3q14","lesson":"b3l4","unit":"b3","type":"choice","level":2,"stem":"清朝设立驻藏大臣，代表中央政府与达赖、班禅共同管理西藏事务，开始于","options":["1653 年","1684 年","1727 年","1793 年"],"answer":2,"explain":"1727 年清朝设驻藏大臣。1653 年顺治帝册封五世达赖，1684 年设台湾府，1793 年颁布《钦定藏内善后章程》并规定金瓶掣签。","point":"清朝对西藏的管辖"},{"id":"b3q15","lesson":"b3l4","unit":"b3","type":"match","level":2,"stem":"把下列边疆地区与清朝的管辖措施配对","pairs":[["台湾","1684 年设台湾府"],["西藏","1727 年设驻藏大臣"],["新疆","1762 年设伊犁将军"],["东北","1689 年签《尼布楚条约》"]],"explain":"清朝针对不同边疆地区采取不同措施，中央管辖不断加强，统一多民族国家得到巩固。","point":"清朝巩固边疆的措施"},{"id":"b3q16","lesson":"b3l4","unit":"b3","type":"fill","level":2,"stem":"1771 年，______率领土尔扈特部万里东归，回到新疆，受到乾隆帝接见。","answer":["渥巴锡"],"explain":"渥巴锡率土尔扈特部摆脱沙俄控制，历经艰险返回新疆，体现了中华民族的凝聚力。","point":"土尔扈特部回归"},{"id":"b3q17","lesson":"b3l5","unit":"b3","type":"choice","level":1,"stem":"清朝前期从美洲引进并大力推广的高产作物是","options":["水稻和小麦","玉米和甘薯","棉花和桑树","茶叶和甘蔗"],"answer":1,"explain":"玉米、甘薯原产美洲，明朝引进、清朝推广，耐旱高产，使山地得到开发，也支撑了人口增长。","point":"清朝前期的农业"},{"id":"b3q18","lesson":"b3l5","unit":"b3","type":"choice","level":2,"stem":"清朝前期人口迅速增长带来的最突出问题是","options":["人地矛盾突出，人均耕地减少","海外贸易迅速扩大","资本主义制度逐步确立","边疆战事完全停止"],"answer":0,"explain":"乾隆末年人口突破 3 亿，耕地增长有限，人均耕地减少，粮价上涨，大量开垦还造成水土流失。","point":"清朝前期的人口问题"},{"id":"b3q19","lesson":"b3l5","unit":"b3","type":"match","level":2,"stem":"把下列经济领域与清朝前期的表现配对","pairs":[["农业","耕地扩大，高产作物推广"],["手工业","景德镇成为制瓷业中心"],["商业","形成全国性商业网，商帮活跃"],["人口","乾隆末年突破 3 亿，人地矛盾突出"]],"explain":"清朝前期农业、手工业、商业都有发展，人口激增既显示经济繁荣，也带来资源与环境压力。","point":"清朝前期社会经济的发展"},{"id":"b3q20","lesson":"b3l5","unit":"b3","type":"fill","level":1,"stem":"清朝前期社会相对安定、经济繁荣，康熙、雍正、乾隆三朝的局面被称为“______”。","answer":["康乾盛世","康乾盛世时期"],"explain":"“康乾盛世”是清朝前期的繁荣局面，但人口压力、制度僵化和闭关政策已埋下危机。","point":"康乾盛世"},{"id":"b3q21","lesson":"b3l6","unit":"b3","type":"choice","level":1,"stem":"清朝设立军机处、使君主专制达到顶峰的皇帝是","options":["康熙帝","雍正帝","乾隆帝","顺治帝"],"answer":1,"explain":"雍正年间设立军机处，军机大臣跪受笔录、承旨办事，君主专制进一步强化并达到顶峰。","point":"军机处的设立"},{"id":"b3q22","lesson":"b3l6","unit":"b3","type":"choice","level":2,"stem":"清朝实行闭关锁国政策，1757 年后只留一处通商口岸，它是","options":["泉州","宁波","广州","上海"],"answer":2,"explain":"1757 年清朝只留广州一处对外通商，由广州十三行统一经营管理对外贸易，严格限制对外交往。","point":"闭关锁国政策"},{"id":"b3q23","lesson":"b3l6","unit":"b3","type":"match","level":2,"stem":"把下列措施与其作用配对","pairs":[["军机处","雍正年间设立，君主专制达到顶峰"],["文字狱","康雍乾三朝，禁锢思想摧残人才"],["闭关锁国","1757 年只留广州一处通商"],["广州十三行","统一经营管理对外贸易"]],"explain":"军机处强化皇权，文字狱控制思想，闭关锁国限制对外交往，三者共同维护清朝的专制统治。","point":"清朝君主专制的强化"},{"id":"b3q24","lesson":"b3l6","unit":"b3","type":"fill","level":2,"stem":"清朝雍正年间设立的______，军机大臣只能跪受笔录、承旨办事，标志着君主专制达到顶峰。","answer":["军机处"],"explain":"军机处不是法定的中央行政机构，军机大臣也没有决策权，一切军政大事均由皇帝裁决。","point":"军机处"},{"id":"b3q25","lesson":"b3l7","unit":"b3","type":"choice","level":1,"stem":"被誉为“中国 17 世纪的工艺百科全书”的著作是","options":["《本草纲目》","《天工开物》","《农政全书》","《徐霞客游记》"],"answer":1,"explain":"《天工开物》由宋应星所著，总结农业和手工业生产技术。《本草纲目》是药物学著作，《农政全书》是农学著作。","point":"《天工开物》"},{"id":"b3q26","lesson":"b3l7","unit":"b3","type":"choice","level":2,"stem":"我国古典小说的高峰是","options":["《三国演义》","《水浒传》","《西游记》","《红楼梦》"],"answer":3,"explain":"曹雪芹的《红楼梦》以贾宝玉、林黛玉的爱情悲剧为线索，揭示封建社会末期的腐朽，是中国古典小说的高峰。","point":"明清小说"},{"id":"b3q27","lesson":"b3l7","unit":"b3","type":"order","level":2,"stem":"按时间先后排列下列明清文化成果","items":["《三国演义》成书","《本草纲目》写成","《天工开物》刊行","《红楼梦》成书"],"explain":"《三国演义》成书于元末明初 → 1578 年《本草纲目》写成 → 1637 年《天工开物》刊行 → 18 世纪《红楼梦》成书。","point":"明清科技与文化成就"},{"id":"b3q28","lesson":"b3l7","unit":"b3","type":"fill","level":1,"stem":"明长城东起______，西至嘉峪关，全长一万余里。","answer":["鸭绿江"],"explain":"明长城东起鸭绿江、西至嘉峪关，是明朝防御北方蒙古势力的重要军事工程。","point":"明长城"}],"timeline":[{"t":"1368 年","y":1368,"text":"朱元璋称帝，建立明朝，定都应天府","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1405 年","y":1405,"text":"郑和首次下西洋，最远到达非洲东海岸和红海沿岸","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1553 年","y":1553,"text":"葡萄牙人攫取在中国澳门的居住权","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1616 年","y":1616,"text":"努尔哈赤统一女真各部，建立后金","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1644 年","y":1644,"text":"李自成攻入北京，明朝灭亡；清军入关，迁都北京","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1662 年","y":1662,"text":"郑成功收复台湾，荷兰殖民者投降","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1684 年","y":1684,"text":"清朝设置台湾府，隶属福建省","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1689 年","y":1689,"text":"中俄签订《尼布楚条约》，划定东段边界","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1727 年","y":1727,"text":"清朝设立驻藏大臣，加强对西藏的管辖","unit":"b3","tag":"中国古代","volume":"v2"},{"t":"1757 年","y":1757,"text":"清朝只留广州一处通商口岸，闭关锁国进一步加强","unit":"b3","tag":"中国古代","volume":"v2"}]},{"volume":"v4","unit":{"id":"d1","volume":"v4","num":1,"title":"中华人民共和国的成立和巩固","short":"建国奠基","years":"1949—1953 年","accent":"#C0392B","soft":"#FBE8E4","tint":"#F0C4BC","icon":"🚩","tagline":"从开国大典到抗美援朝、土地改革，新生政权站稳了脚跟。","intro":"1949 年 10 月 1 日，天安门城楼上的宣告结束了一个旧时代。可新生的政权面前摆着三道难题：怎样建立一个人民当家作主的国家，怎样顶住朝鲜战场上的战火，怎样把土地分给世代耕种的农民。这一单元要回答：新中国是怎样诞生的，又是靠什么在短短四年里站稳脚跟的？","bigQuestion":"一个新生的国家，凭什么在短短四年里站稳了脚跟？","goals":["说出新中国成立的时间、标志与历史意义。","了解《共同纲领》和西藏和平解放的史实。","讲述抗美援朝的背景、英雄事迹与胜利意义。","说明土地改革的内容、结果和历史作用。"],"keyLine":"1949 年开国大典立国，1950 年抗美援朝与土地改革一外一内并举，1953 年停战协定签订、土改基本完成，新生政权站稳了脚跟。"},"lessons":[{"id":"d1l1","num":1,"unit":"d1","title":"中华人民共和国成立","years":"1949 年","icon":"🚩","tag":"建国","hook":"1949 年 10 月 1 日下午三时，天安门广场上三十万人静静站立。毛泽东亲手升起第一面五星红旗，军乐响起，一个旧时代在身后合上了门。","core":"1949 年 9 月，中国人民政治协商会议第一届全体会议在北平召开，通过起临时宪法作用的《共同纲领》，完成建国的各项准备。10 月 1 日开国大典举行，中华人民共和国成立，中国历史进入新纪元；1951 年西藏和平解放，祖国大陆实现统一。","points":["背景：国民党政权覆灭，人民解放战争取得基本胜利；全国人民渴望和平民主，建立新国家的条件已经成熟。","筹备：1949 年 9 月，中国人民政治协商会议第一届全体会议在北平召开，决定成立中华人民共和国，通过了《共同纲领》。","会议决定：毛泽东任中央人民政府主席，北平改名北京作为首都，五星红旗为国旗，《义勇军进行曲》为代国歌，采用公元纪年。","成立：1949 年 10 月 1 日，开国大典在天安门广场举行，毛泽东宣告中央人民政府成立，并升起第一面五星红旗。","意义：新中国成立开辟了中国历史新纪元，中国人民从此站起来了，成为国家的主人；壮大了世界和平、民主和社会主义的力量。","统一：1951 年，西藏地方政府派阿沛·阿旺晋美到北京谈判，西藏和平解放，祖国大陆获得统一，各族人民实现大团结。"],"terms":[["中国人民政治协商会议","1949 年 9 月在北平召开第一届全体会议，代行全国人民代表大会职权，完成建国的筹备工作，被称为“新政协”。"],["《共同纲领》","《中国人民政治协商会议共同纲领》的简称，规定新中国是新民主主义即人民民主主义的国家，起临时宪法作用。"],["开国大典","1949 年 10 月 1 日在天安门广场举行的庆祝中华人民共和国中央人民政府成立典礼，标志新中国诞生。"],["西藏和平解放","1951 年中央人民政府与西藏地方政府签订协议，西藏和平解放，祖国大陆获得统一。"]],"figures":[["毛泽东","宣告新中国成立，当选中央人民政府主席"],["周恩来","任政务院总理兼外交部长"],["阿沛·阿旺晋美","代表西藏地方政府到北京谈判，促成西藏和平解放"]],"events":[["1949.9","中国人民政治协商会议第一届全体会议召开"],["1949.10.1","开国大典，中华人民共和国成立"],["1951.5","西藏和平解放"]],"treaty":null,"significance":"新中国的成立，结束了中国半殖民地半封建社会的历史，中国人民成为国家的主人；它改变了世界政治力量的对比，鼓舞了殖民地半殖民地人民争取民族独立的斗争。","source":{"quote":"占人类总数四分之一的中国人从此站立起来了。","from":"毛泽东《中国人民站起来了》（1949 年 9 月 21 日）"},"pitfall":"1949 年召开的是新政协，不同于 1946 年重庆的旧政协；《共同纲领》只起临时宪法作用，第一部宪法是 1954 年。","memory":"四九九月新政协，共同纲领临时宪；十月一日开国典，一九五一收西藏。","link":"本课是第四册的起点：新中国成立后，抗美援朝、土地改革接连展开，新生政权在内外考验中站稳脚跟。","exam":["新中国成立的时间、标志与历史意义","《共同纲领》与政协会议的决定","西藏和平解放的时间与意义"]},{"id":"d1l2","num":2,"unit":"d1","title":"抗美援朝","years":"1950—1953 年","icon":"🎖","tag":"外交","hook":"1950 年 10 月，鸭绿江边的夜很冷。志愿军战士踩着浮桥过江，回头望了一眼对岸的灯火，谁也不知道自己还能不能回来。","core":"1950 年 6 月朝鲜内战爆发，美国出兵干涉、威胁中国安全。10 月，中国人民志愿军在彭德怀率领下开赴朝鲜，连续五次战役把美军赶回三八线附近。1953 年 7 月《朝鲜停战协定》签订，抗美援朝战争胜利，新中国国际地位大大提高。","points":["背景：1950 年 6 月朝鲜内战爆发，美国第七舰队侵入台湾海峡，又操纵“联合国军”越过三八线、轰炸中国东北边境。","出兵：1950 年 10 月，应朝鲜请求，志愿军由彭德怀率领开赴朝鲜；10 月 25 日首战告捷，后成为抗美援朝纪念日。","战绩：志愿军连续发起五次战役，把美国侵略者赶回三八线附近；1952 年上甘岭战役中，志愿军坚守阵地，粉碎敌军进攻。","英雄：黄继光用胸膛堵住敌人枪眼，邱少云在烈火中纹丝不动，杨根思抱起炸药包与敌人同归于尽；他们被称为“最可爱的人”。","胜利：1953 年 7 月，美国被迫在《朝鲜停战协定》上签字，抗美援朝战争取得胜利。","意义：抗美援朝战争打破了美军不可战胜的神话，捍卫了新中国安全，提高了中国的国际地位，为国内建设赢得了和平环境。"],"terms":[["抗美援朝","1950 年 10 月至 1953 年 7 月，中国人民志愿军为援助朝鲜、保家卫国而进行的战争。"],["三八线","朝鲜半岛北纬三十八度附近的军事分界线。二战后美苏以此线分区受降，朝鲜半岛由此分裂。"],["上甘岭战役","1952 年 10 月至 11 月，志愿军在朝鲜上甘岭地区抗击敌军的著名战役，阵地反复争夺，最终守住阵地。"],["最可爱的人","作家魏巍对中国人民志愿军战士的称呼，赞颂他们的爱国主义和革命英雄主义精神。"]],"figures":[["彭德怀","中国人民志愿军司令员，指挥五次战役"],["黄继光","上甘岭战役中用胸膛堵住敌人枪眼，壮烈牺牲"],["邱少云","潜伏时被烈火烧身，为不暴露目标一动不动，直至牺牲"],["魏巍","发表《谁是最可爱的人》，歌颂志愿军战士"]],"events":[["1950.6","朝鲜内战爆发，美国出兵干涉"],["1950.10","中国人民志愿军开赴朝鲜"],["1952.10","上甘岭战役"],["1953.7","《朝鲜停战协定》签订"]],"treaty":{"name":"《朝鲜停战协定》","date":"1953 年 7 月 27 日","items":["在朝鲜板门店签订，双方停止一切敌对行动","以双方实际接触线为军事分界线","双方各后撤两千米，建立非军事区","战俘按自愿原则遣返","建议召开政治会议，协商外国军队撤出朝鲜等问题"],"note":"这是停战协定，不是和平条约。朝鲜半岛在法律上至今仍处于停战状态。"},"significance":"抗美援朝战争的胜利，打破了美军不可战胜的神话，捍卫了新中国的安全，为国内经济建设赢得了相对稳定的和平环境；它使新中国的国际地位大大提高，也锻造出伟大的抗美援朝精神。","source":{"quote":"西方侵略者几百年来只要在东方一个海岸上架起几尊大炮就可霸占一个国家的时代是一去不复返了。","from":"彭德怀《关于中国人民志愿军抗美援朝工作的报告》（1953 年 9 月）"},"pitfall":"抗美援朝开始于 1950 年 10 月，不是朝鲜内战爆发的 6 月；1953 年签订的是《朝鲜停战协定》，不是和平条约。","memory":"一九五〇过鸭绿，五次战役回三八；上甘岭上英雄血，五三停战扬国威。","link":"上承新中国成立，下启“一五”计划：抗美援朝与土地改革一外一内，共同巩固了新生的人民政权。","exam":["抗美援朝的背景、时间与司令员","黄继光、邱少云等英雄事迹","抗美援朝胜利的意义与抗美援朝精神"]},{"id":"d1l3","num":3,"unit":"d1","title":"土地改革","years":"1950—1952 年","icon":"🌾","tag":"土改","hook":"1950 年冬天，新解放区的田埂上插起一块块木牌，上面写着分到土地的农户名字。有人蹲下去抓起一把土，攥了很久没有说话。","core":"1950 年 6 月，中央人民政府颁布《中华人民共和国土地改革法》，废除地主阶级封建剥削的土地所有制，实行农民的土地所有制。到 1952 年底，除部分少数民族地区外，全国大陆基本完成土地改革，三亿多农民分到土地，封建土地制度被彻底摧毁。","points":["背景：新中国成立时新解放区尚未土改，不到 10% 的地主、富农占有 70% 以上的土地，封建土地制度阻碍农村发展。","法令：1950 年 6 月，中央人民政府颁布《土地改革法》，规定废除封建剥削的土地所有制，实行农民的土地所有制。","实施：1950 年冬起，新解放区分期分批开展土改，没收地主的土地分给无地少地的农民，也分给地主一份土地，让其自食其力。","完成：到 1952 年底，除部分少数民族地区外，全国大陆基本上完成土地改革，三亿多无地少地的农民分到七亿亩土地。","结果：封建土地制度被彻底摧毁，地主阶级被消灭，农民翻身成为土地的主人，人民政权更加巩固。","影响：农民生产积极性空前高涨，农业生产迅速恢复和发展，为国家的工业化建设准备了条件。"],"terms":[["土地改革","1950—1952 年在新解放区废除封建土地制度、实行农民土地所有制的运动。"],["《中华人民共和国土地改革法》","1950 年 6 月颁布，规定废除地主阶级封建剥削的土地所有制，实行农民的土地所有制。"],["封建土地制度","地主占有大量土地、靠收取地租剥削农民的制度，在中国延续两千多年，是农村贫穷落后的根源。"],["新解放区","1949 年以后解放的地区，人口三亿多，土地改革主要在这些地区进行。"]],"figures":[["毛泽东","发布命令公布《中华人民共和国土地改革法》"],["刘少奇","作《关于土地改革问题的报告》，说明土改的路线和政策"]],"events":[["1950.6","《中华人民共和国土地改革法》颁布"],["1950 年冬","新解放区分期分批开始土地改革"],["1952 年底","全国大陆基本完成土地改革"]],"treaty":null,"significance":"土地改革彻底摧毁了在我国延续两千多年的封建土地制度，农民成为土地的主人，人民政权更加巩固；农村生产力得到解放，为新中国工业化建设准备了条件。","source":{"quote":"废除地主阶级封建剥削的土地所有制，实行农民的土地所有制，借以解放农村生产力，发展农业生产，为新中国的工业化开辟道路。","from":"《中华人民共和国土地改革法》第一条（1950 年 6 月）"},"pitfall":"土改后土地归农民所有，仍然是私有制；土地变为集体所有，是 1956 年农业合作化完成以后的事。","memory":"五〇年颁土改法，废除封建地主制；三亿农民得土地，一九五二基本成。","link":"与抗美援朝一内一外，共同巩固新生政权；土改为工业化准备了粮食、市场和资金，直接接续“一五”计划。","exam":["《土地改革法》的内容与土改时间","土地改革的历史意义","土地改革与农业合作化的区别"]}],"questions":[{"id":"d1q1","lesson":"d1l1","unit":"d1","type":"choice","level":1,"stem":"1949 年 9 月，中国人民政治协商会议第一届全体会议通过、起临时宪法作用的文件是","options":["《中华民国临时约法》","《中国人民政治协商会议共同纲领》","《中华人民共和国宪法》","《中国土地法大纲》"],"answer":1,"explain":"《共同纲领》规定新中国是新民主主义即人民民主主义的国家，在 1954 年宪法颁布前起临时宪法作用。《中华民国临时约法》颁布于 1912 年，《中国土地法大纲》是 1947 年解放区颁布的。","point":"《共同纲领》"},{"id":"d1q2","lesson":"d1l1","unit":"d1","type":"choice","level":2,"stem":"“占人类总数四分之一的中国人从此站立起来了。”毛泽东这句话评价的历史事件是","options":["抗日战争的胜利","中华人民共和国成立","西藏和平解放","抗美援朝战争的胜利"],"answer":1,"explain":"这句话出自毛泽东 1949 年 9 月在中国人民政治协商会议第一届全体会议上的开幕词，说的是新中国即将成立、中国人民从此成为国家的主人。抗日战争胜利是 1945 年，此时新中国尚未成立。","point":"新中国成立的意义"},{"id":"d1q3","lesson":"d1l1","unit":"d1","type":"match","level":2,"stem":"把下列新中国成立时的史实与其内容配对","pairs":[["《共同纲领》","起临时宪法作用"],["五星红旗","中华人民共和国国旗"],["《义勇军进行曲》","代国歌"],["1951 年","西藏和平解放"]],"explain":"这四项都是新中国成立前后的重要史实：政协会议通过《共同纲领》，确定国旗、代国歌，1951 年西藏和平解放使祖国大陆获得统一。","point":"新中国成立与西藏和平解放"},{"id":"d1q4","lesson":"d1l1","unit":"d1","type":"fill","level":2,"stem":"1951 年，西藏地方政府派______等到北京谈判，双方签订协议，西藏和平解放。","answer":["阿沛·阿旺晋美","阿沛阿旺晋美"],"explain":"1951 年，西藏地方政府派出以阿沛·阿旺晋美为首席代表的代表团到北京谈判，双方签订《关于和平解放西藏办法的协议》，西藏和平解放，祖国大陆获得统一。","point":"西藏和平解放"},{"id":"d1q5","lesson":"d1l2","unit":"d1","type":"choice","level":1,"stem":"1950 年 10 月，率领中国人民志愿军开赴朝鲜作战的司令员是","options":["林彪","彭德怀","陈毅","刘伯承"],"answer":1,"explain":"1950 年 10 月，中国人民志愿军开赴朝鲜，彭德怀任司令员兼政治委员，指挥了连续五次战役。","point":"抗美援朝的出兵"},{"id":"d1q6","lesson":"d1l2","unit":"d1","type":"choice","level":2,"stem":"1950 年 6 月朝鲜内战爆发后，美国采取的下列行动中，直接威胁中国安全的是","options":["派第七舰队侵入台湾海峡，又操纵“联合国军”越过三八线、轰炸中国东北边境","宣布承认中华人民共和国并建立外交关系","从朝鲜半岛撤出全部军队","支持恢复中华人民共和国在联合国的合法席位"],"answer":0,"explain":"美国派第七舰队侵入台湾海峡，阻挠中国人民解放台湾；又操纵“联合国军”越过三八线，把战火烧到中朝边境，轰炸中国东北边境地区，严重威胁中国安全，这是中国出兵抗美援朝的直接原因。其余三项与史实不符。","point":"抗美援朝的背景"},{"id":"d1q7","lesson":"d1l2","unit":"d1","type":"order","level":2,"stem":"按时间先后排列抗美援朝战争中的大事","items":["朝鲜内战爆发","中国人民志愿军开赴朝鲜","上甘岭战役","《朝鲜停战协定》签订"],"explain":"1950 年 6 月朝鲜内战爆发；1950 年 10 月志愿军开赴朝鲜；1952 年 10 月上甘岭战役；1953 年 7 月《朝鲜停战协定》签订。","point":"抗美援朝的进程"},{"id":"d1q8","lesson":"d1l2","unit":"d1","type":"fill","level":1,"stem":"1952 年上甘岭战役中，用胸膛堵住敌人枪眼、壮烈牺牲的志愿军战斗英雄是______。","answer":["黄继光"],"explain":"黄继光是上甘岭战役中的战斗英雄，为部队冲锋开辟道路而用胸膛堵住敌人枪眼，壮烈牺牲。邱少云是在潜伏时被烈火烧身、为不暴露目标而牺牲的。","point":"抗美援朝英雄"},{"id":"d1q9","lesson":"d1l3","unit":"d1","type":"choice","level":1,"stem":"1950 年，中央人民政府颁布的、规定废除地主阶级封建剥削的土地所有制的文件是","options":["《中国土地法大纲》","《中华人民共和国土地改革法》","《中国人民政治协商会议共同纲领》","《中华人民共和国宪法》"],"answer":1,"explain":"1950 年 6 月，中央人民政府颁布《中华人民共和国土地改革法》，规定废除地主阶级封建剥削的土地所有制，实行农民的土地所有制。《中国土地法大纲》是 1947 年解放区颁布的。","point":"《土地改革法》"},{"id":"d1q10","lesson":"d1l3","unit":"d1","type":"choice","level":2,"stem":"到 1952 年底，全国大陆基本上完成土地改革。这一事件最重要的历史作用是","options":["建立了社会主义集体所有制","彻底摧毁了在我国延续两千多年的封建土地制度","实现了国家的社会主义工业化","完成了对农业的社会主义改造"],"answer":1,"explain":"土地改革废除了地主阶级封建剥削的土地所有制，实行农民的土地所有制，彻底摧毁了延续两千多年的封建土地制度，农民成为土地的主人。集体所有制和农业社会主义改造是 1956 年三大改造完成后的结果，工业化起步于“一五”计划。","point":"土地改革的意义"},{"id":"d1q11","lesson":"d1l3","unit":"d1","type":"order","level":2,"stem":"按时间先后排列土地改革过程中的大事","items":["《中华人民共和国土地改革法》颁布","新解放区分期分批开展土地改革","全国大陆基本完成土地改革"],"explain":"1950 年 6 月颁布《土地改革法》；1950 年冬起新解放区分期分批开展土改；到 1952 年底，除部分少数民族地区外，全国大陆基本上完成土地改革。","point":"土地改革的进程"},{"id":"d1q12","lesson":"d1l3","unit":"d1","type":"fill","level":2,"stem":"土地改革完成后，我国农村实行的土地所有制是______。","answer":["农民土地所有制","农民的土地所有制","农民所有"],"explain":"土地改革废除地主阶级封建剥削的土地所有制，实行农民的土地所有制，土地归农民私有。1956 年农业合作化完成后，土地才变为集体所有。","point":"土地改革的内容"}],"timeline":[{"t":"1949 年 9 月","y":1949.7,"text":"中国人民政治协商会议第一届全体会议在北平召开，通过《共同纲领》。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1949 年 10 月 1 日","y":1949.75,"text":"开国大典举行，中华人民共和国成立。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1950 年 6 月","y":1950.45,"text":"朝鲜内战爆发，美国派第七舰队侵入台湾海峡并出兵干涉。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1950 年 6 月","y":1950.5,"text":"中央人民政府颁布《中华人民共和国土地改革法》。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1950 年 10 月","y":1950.78,"text":"中国人民志愿军开赴朝鲜，抗美援朝战争开始。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1951 年 5 月","y":1951.4,"text":"西藏和平解放，祖国大陆获得统一。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1952 年 10 月","y":1952.8,"text":"上甘岭战役开始，志愿军坚守阵地，粉碎敌军进攻。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1952 年底","y":1952.95,"text":"全国大陆基本上完成土地改革，封建土地制度被彻底摧毁。","unit":"d1","tag":"中国现代","volume":"v4"},{"t":"1953 年 7 月","y":1953.55,"text":"《朝鲜停战协定》签订，抗美援朝战争取得胜利。","unit":"d1","tag":"中国现代","volume":"v4"}]},{"volume":"v4","unit":{"id":"d2","volume":"v4","num":2,"title":"社会主义制度的建立与社会主义建设的探索","short":"制度确立","years":"1953—1978 年","accent":"#B5482F","soft":"#FAE7E0","tint":"#EEC3B7","icon":"⚙","tagline":"从一五计划的厂房到人民大会堂，中国确立社会主义制度","intro":"这一单元要回答：新中国靠什么从一穷二白的农业国走向社会主义？一五计划的工地上，钢水、汽车和长江大桥搭起工业骨架；三大改造把私有制变为公有制，社会主义基本制度由此确立；此后二十余年，既有八大与“两弹一星”的成就，也有“大跃进”的曲折。","bigQuestion":"社会主义制度为什么能在新中国扎下根，又为什么在探索中走了弯路？","goals":["说明一五计划优先发展重工业的原因与成就","理解人民代表大会制度是我国的根本政治制度","说出三大改造的形式、实质与历史意义","用史实评价 1956—1978 年的探索与成就"],"keyLine":"一五计划搭起工业骨架 → 三大改造确立社会主义制度 → 中共八大开启良好开端 → “大跃进”留下曲折 → “两弹一星”撑起成就。"},"lessons":[{"id":"d2l1","num":4,"unit":"d2","title":"新中国工业化的起步和人民代表大会制度的确立","years":"1953—1957 年","icon":"🏭","tag":"建设","hook":"1956 年 7 月，长春第一汽车制造厂的总装线上，一辆墨绿色卡车缓缓开下。车头挂着红绸，工人们围上去摸车身——这是中国自己造出的第一辆汽车。","core":"1953 年起，我国实施第一个五年计划，集中力量发展重工业，鞍钢、长春一汽、武汉长江大桥相继建成，开始改变工业落后的面貌。1954 年第一届全国人民代表大会召开，制定《中华人民共和国宪法》，人民代表大会制度作为根本政治制度确立起来。","points":["背景：国民经济恢复后，我国仍是落后的农业国，能造桌子椅子，却造不出汽车、飞机、坦克和拖拉机。","任务：1953 年起实施一五计划，集中主要力量发展重工业，奠定工业化和国防现代化的初步基础，相应发展交通、轻工业、农业。","工业成就：1953 年底鞍钢三大工程建成投产；1956 年长春一汽产出解放牌汽车，沈阳第一机床厂、飞机制造厂建成投产。","交通成就：1957 年武汉长江大桥建成，川藏、青藏、新藏公路修到“世界屋脊”，宝成、鹰厦铁路相继通车。","意义：到 1957 年底，一五计划超额完成，我国开始改变工业落后的面貌，向社会主义工业化迈进。","政治建设：1954 年 9 月第一届全国人大通过《中华人民共和国宪法》，规定一切权力属于人民，人民代表大会制度由此确立。"],"terms":[["第一个五年计划","1953—1957 年我国集中力量发展重工业，建立工业化和国防现代化的初步基础，同时发展交通、轻工业、农业和商业。"],["《中华人民共和国宪法》","1954 年 9 月由第一届全国人大通过，是我国第一部社会主义类型的宪法，也是我国有史以来真正反映人民利益的宪法。"],["人民代表大会制度","我国的根本政治制度。人民选出代表组成各级人民代表大会，由人民代表大会行使管理国家的权力。"],["重工业","生产生产资料的工业部门，如钢铁、机械、能源、化工。一五计划优先发展重工业，为工业化打下基础。"]],"figures":[["毛泽东","提出过渡时期总路线，部署新中国的工业化建设"],["周恩来","主持一五计划的编制，任国务院总理，组织实施各项建设"],["李富春","国家计划委员会主任，具体主持第一个五年计划的编制"]],"events":[["1953 年","第一个五年计划开始实施"],["1953 年底","鞍山钢铁公司三大工程建成投产"],["1954 年 9 月","第一届全国人民代表大会召开，通过《宪法》"],["1956 年 7 月","长春一汽生产出第一辆解放牌汽车"],["1957 年","武汉长江大桥建成，一五计划超额完成"]],"treaty":null,"significance":"一五计划使我国开始改变工业落后的面貌，为社会主义工业化奠定了初步基础；第一届全国人大和 1954 年宪法确立了人民代表大会制度，为社会主义民主政治建设奠定了基础。","source":{"quote":"现在我们能造什么？……但是，一辆汽车、一架飞机、一辆坦克、一辆拖拉机都不能造。","from":"毛泽东《关于中华人民共和国宪法草案》（1954 年 6 月）"},"pitfall":"一五计划优先发展重工业，但不是只发展重工业；1954 年宪法是我国第一部社会主义类型的宪法，人民代表大会制度同年确立。","memory":"五三起跑一五计，鞍钢一汽武汉桥；五四人大立宪法，根本制度人民定。","link":"上一单元新中国成立与政权巩固 → 本课工业化起步与人大制度确立 → 下一课三大改造，社会主义制度全面建立。","exam":["一五计划的时间、特点与主要成就","1954 年宪法的性质与地位","人民代表大会制度的确立"]},{"id":"d2l2","num":5,"unit":"d2","title":"三大改造","years":"1953—1956 年","icon":"🤝","tag":"改造","hook":"1956 年 1 月，天还没亮，上海一家绸布店门口就排起了队。店主摘下私营的老招牌，换上公私合营的新牌子，敲锣打鼓，像过年一样。","core":"1953 年起，国家引导农民和手工业者组织起来走集体化道路，对资本主义工商业实行公私合营和赎买政策。到 1956 年底，三大改造基本完成，生产资料私有制变为社会主义公有制，社会主义基本制度在我国建立起来。","points":["背景：土地改革后分散的小农经济难以满足工业化需要，私营工商业中也存在不利于国计民生的现象，国家决定把私有制转变为公有制。","农业改造：1953 年起引导农民参加农业生产合作社，走集体化道路；1955 年出现合作化高潮，1956 年基本完成。","手工业改造：引导个体手工业者组织起来，成立手工业生产合作社，把个体经济逐步改造为集体经济。","资本主义工商业：1954 年起逐步实行公私合营，国家对资本家的生产资料实行赎买政策，实现和平过渡，是社会主义改造的创举。","结果：1956 年底三大改造基本完成，生产资料私有制转变为社会主义公有制，我国进入社会主义初级阶段。","评价：这是中国历史上最深刻的社会变革；后期存在要求过急、工作过粗、改变过快等缺点，给后来留下一些问题。"],"terms":[["三大改造","1953—1956 年国家对农业、手工业和资本主义工商业进行的社会主义改造，实质是把生产资料私有制变为社会主义公有制。"],["农业生产合作社","农业改造的主要形式。农民把土地、农具等入股，统一经营、按劳分配，走集体化道路。"],["公私合营","资本主义工商业改造的形式。国家向私营企业投资、派干部参与管理，企业利润按“四马分肥”分配。"],["赎买政策","国家有偿地把资本家占有的生产资料收归国有，按合营企业利润给资本家一定回报，实现了和平过渡。"]],"figures":[["毛泽东","提出党在过渡时期的总路线，领导三大改造"],["陈云","参与领导资本主义工商业的社会主义改造工作"],["荣毅仁","上海工商界代表人物，接受资本主义工商业的社会主义改造"]],"events":[["1953 年","农业合作化开始，三大改造起步"],["1954 年","资本主义工商业开始实行公私合营"],["1955 年","农业合作化出现高潮"],["1956 年底","三大改造基本完成，社会主义基本制度建立"]],"treaty":null,"significance":"三大改造实现了生产资料私有制向社会主义公有制的转变，社会主义基本制度在我国建立起来，我国从此进入社会主义初级阶段。这是中国历史上最深刻的社会变革，为社会主义建设奠定了制度基础。","source":{"quote":"要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造。","from":"毛泽东在中央政治局会议上的讲话（1953 年 6 月）"},"pitfall":"三大改造的实质是生产资料私有制变为社会主义公有制，不是消灭个体劳动；赎买政策是和平过渡的创举，不是无偿没收。","memory":"农业合作社，手工业联合；工商搞合营，赎买创举多；五六年底改造完，社会主义初阶段。","link":"上一课一五计划与人大制度 → 本课三大改造完成，社会主义制度确立 → 下一课在社会主义道路上艰辛探索。","exam":["三大改造的形式与实质","赎买政策的创举","社会主义基本制度确立的标志"]},{"id":"d2l3","num":6,"unit":"d2","title":"艰辛探索与建设成就","years":"1956—1978 年","icon":"🔥","tag":"探索","hook":"1964 年 10 月 16 日，新疆罗布泊的戈壁滩上，一团蘑菇云腾空而起。指挥所里，人们跳起来互相拥抱，很多人哭了——中国有了自己的原子弹。","core":"1956 年中共八大正确分析国内主要矛盾，是探索社会主义道路的良好开端。此后总路线、“大跃进”和人民公社化运动使国民经济遭遇严重困难，1961 年起调整恢复；“文化大革命”造成十年动乱，但仍取得“两弹一星”、大庆油田、杂交水稻等成就。","points":["中共八大：1956 年 9 月召开，指出主要矛盾是先进工业国的要求同落后农业国现实之间的矛盾，任务是集中力量发展生产。","总路线：1958 年提出“鼓足干劲、力争上游、多快好省地建设社会主义”，反映了改变落后面貌的愿望，但忽视了客观经济规律。","“大跃进”和人民公社化：高指标、瞎指挥、浮夸风和“共产风”盛行，“左”倾错误泛滥，1959—1961 年经济严重困难。","调整：1961 年起实行“调整、巩固、充实、提高”的八字方针，到 1965 年调整任务完成，工农业生产得到恢复和发展。","“文化大革命”：1966—1976 年，给党、国家和人民带来新中国成立后最严重的挫折；1976 年粉碎“四人帮”。","建设成就：大庆油田石油自给；1964 年原子弹、1967 年氢弹爆炸，1970 年卫星升空，1973 年杂交水稻育成。"],"terms":[["中共八大","1956 年 9 月在北京召开，正确分析国内主要矛盾，是探索社会主义建设道路的良好开端。"],["“大跃进”","1958 年开始的以片面追求高速度、高指标为特征的群众运动，严重违背客观经济规律。"],["人民公社化运动","1958 年在全国农村推开，特点是“一大二公”，刮起“共产风”，挫伤了农民的生产积极性。"],["“两弹一星”","原子弹、导弹和人造地球卫星。1964 年原子弹爆炸、1970 年卫星上天，极大提高了我国的国际地位。"]],"figures":[["王进喜","大庆油田石油工人，人称“铁人”，率队艰苦创业"],["焦裕禄","兰考县委书记，带领群众治理风沙、内涝、盐碱，被誉为“县委书记的榜样”"],["邓稼先","核物理学家，为我国原子弹、氢弹研制作出重大贡献"],["袁隆平","农业科学家，1973 年培育出籼型杂交水稻，被誉为“杂交水稻之父”"]],"events":[["1956 年 9 月","中共八大召开"],["1958 年","提出总路线，发动“大跃进”和人民公社化运动"],["1961 年","开始实行“八字方针”调整国民经济"],["1964 年 10 月","第一颗原子弹爆炸成功"],["1970 年 4 月","“东方红一号”卫星发射成功"]],"treaty":null,"significance":"这一时期的探索有成功也有失误。中共八大和“八字方针”证明党能够正视并纠正错误；“大跃进”和“文革”则说明违背客观规律、脱离民主法制要付出沉重代价。建设成就为改革开放准备了物质技术基础。","source":{"quote":"我们国内的主要矛盾，已经是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾。","from":"中共八大《关于政治报告的决议》（1956 年 9 月）"},"pitfall":"社会主义制度建立标志是 1956 年底三大改造完成，不是中共八大；原子弹 1964、氢弹 1967、卫星 1970 年。","memory":"五六八大开好头，五八大跃进吃苦头；八字方针挽危局，两弹一星振神州。","link":"上一课三大改造确立社会主义制度 → 本课在社会主义道路上探索二十余年 → 下一单元十一届三中全会实现伟大历史转折。","exam":["中共八大对主要矛盾的判断","“大跃进”和人民公社化的教训","“两弹一星”等建设成就"]}],"questions":[{"id":"d2q1","lesson":"d2l1","unit":"d2","type":"choice","level":1,"stem":"第一个五年计划的基本任务中，处于优先发展地位的部门是","options":["轻工业","重工业","农业","商业"],"answer":1,"explain":"一五计划集中主要力量发展重工业，以建立国家工业化和国防现代化的初步基础；轻工业、农业、商业和交通运输业是“相应地”发展。","point":"一五计划的特点"},{"id":"d2q2","lesson":"d2l1","unit":"d2","type":"choice","level":2,"stem":"1957 年底第一个五年计划超额完成。这一成就对我国工业最重要的意义是","options":["我国已经实现了社会主义工业化","我国开始改变工业落后的面貌，向社会主义工业化迈进","我国工业产值已超过农业产值，成为工业国","我国已经建立起完整的工业体系"],"answer":1,"explain":"一五计划只是为工业化奠定初步基础，我国仍是落后的农业国，尚未实现工业化，也谈不上完整工业体系，因此“开始改变”“迈进”的表述才准确。","point":"一五计划的意义"},{"id":"d2q3","lesson":"d2l1","unit":"d2","type":"order","level":2,"stem":"按时间先后排列第一个五年计划期间发生的重大事件","items":["第一个五年计划开始实施","鞍山钢铁公司三大工程建成投产","长春第一汽车制造厂生产出解放牌汽车","武汉长江大桥建成通车"],"explain":"1953 年一五计划开始 → 1953 年底鞍钢三大工程投产 → 1956 年长春一汽产出解放牌汽车 → 1957 年武汉长江大桥建成。","point":"一五计划期间的成就"},{"id":"d2q4","lesson":"d2l1","unit":"d2","type":"fill","level":2,"stem":"1954 年 9 月，第一届全国人民代表大会第一次会议通过了《中华人民共和国______》，这是我国第一部社会主义类型的宪法。","answer":["宪法","中华人民共和国宪法","《宪法》"],"explain":"1954 年 9 月 20 日，第一届全国人大通过《中华人民共和国宪法》，规定国家的一切权力属于人民，人民代表大会制度由此确立。","point":"1954 年宪法"},{"id":"d2q5","lesson":"d2l2","unit":"d2","type":"choice","level":1,"stem":"在对资本主义工商业的社会主义改造中，我国创造的、实现和平过渡的政策是","options":["无偿没收资本家的企业","实行赎买政策","组织手工业生产合作社","取消私人企业的一切利润"],"answer":1,"explain":"国家对资本家占有的生产资料实行赎买政策，按合营企业利润给资本家一定回报，实现了和平过渡，是中国社会主义改造的创举。公私合营是改造形式，赎买是其中的创举性政策。","point":"赎买政策"},{"id":"d2q6","lesson":"d2l2","unit":"d2","type":"choice","level":2,"stem":"1956 年底，我国农业、手工业和资本主义工商业的社会主义改造基本完成。这一事件标志着","options":["社会主义基本制度在我国建立起来","第一个五年计划超额完成","中华人民共和国成立","人民公社化运动开始"],"answer":0,"explain":"三大改造完成使生产资料私有制变为社会主义公有制，社会主义基本制度在我国建立起来，我国进入社会主义初级阶段。一五计划完成于 1957 年底，人民公社化运动始于 1958 年。","point":"社会主义制度确立的标志"},{"id":"d2q7","lesson":"d2l2","unit":"d2","type":"match","level":2,"stem":"把三大改造的对象与其主要形式配对","pairs":[["农业","农业生产合作社"],["手工业","手工业生产合作社"],["资本主义工商业","公私合营"]],"explain":"农业、手工业走合作化道路，分别组织生产合作社；资本主义工商业实行公私合营，并配以赎买政策。三者共同完成了生产资料私有制向公有制的转变。","point":"三大改造的形式"},{"id":"d2q8","lesson":"d2l2","unit":"d2","type":"choice","level":3,"stem":"三大改造后期出现了一些缺点，主要是","options":["把生产资料私有制转变为公有制","对资本家实行赎买政策","要求过急、工作过粗、改变过快","建立了社会主义基本制度"],"answer":2,"explain":"三大改造后期存在要求过急、工作过粗、改变过快等缺点，遗留了一些问题；把私有制变为公有制、实行赎买政策、建立社会主义基本制度都是改造的成就，不是缺点。","point":"三大改造的评价"},{"id":"d2q9","lesson":"d2l3","unit":"d2","type":"choice","level":1,"stem":"1956 年召开的中共八大指出，党和人民的主要任务是","options":["集中力量把我国尽快地从落后的农业国变为先进的工业国","在全国农村开展人民公社化运动","完成对资本主义工商业的改造","发动“文化大革命”"],"answer":0,"explain":"中共八大正确分析国内主要矛盾，确定主要任务是集中力量把我国尽快地从落后的农业国变为先进的工业国，是探索社会主义建设道路的良好开端。","point":"中共八大的主要内容"},{"id":"d2q10","lesson":"d2l3","unit":"d2","type":"choice","level":2,"stem":"1958 年“大跃进”和人民公社化运动出现严重失误，主要原因在于","options":["否定了社会主义基本制度","片面追求高速度，忽视了客观经济规律","放弃了对农业生产的领导","没有发动广大群众参与"],"answer":1,"explain":"“大跃进”片面追求高速度、高指标，人民公社化运动刮起“共产风”，都违背了客观经济规律，加上自然灾害，造成 1959—1961 年国民经济严重困难。","point":"“大跃进”的教训"},{"id":"d2q11","lesson":"d2l3","unit":"d2","type":"order","level":2,"stem":"按时间先后排列下列社会主义建设探索中的事件","items":["中共八大召开","“大跃进”和人民公社化运动发动","开始实行“八字方针”调整国民经济","第一颗原子弹爆炸成功","“东方红一号”卫星发射成功"],"explain":"1956 年 9 月中共八大 → 1958 年“大跃进”和人民公社化 → 1961 年“八字方针” → 1964 年 10 月原子弹爆炸 → 1970 年 4 月“东方红一号”升空。","point":"社会主义建设探索的进程"},{"id":"d2q12","lesson":"d2l3","unit":"d2","type":"fill","level":2,"stem":"1964 年 10 月，我国第一颗______爆炸成功，打破了帝国主义的核垄断，增强了我国的国防实力。","answer":["原子弹"],"explain":"1964 年 10 月 16 日，我国第一颗原子弹爆炸成功；1967 年第一颗氢弹爆炸成功；1970 年“东方红一号”卫星发射成功。","point":"“两弹一星”"}],"timeline":[{"t":"1953 年","y":1953,"text":"第一个五年计划开始实施，集中力量发展重工业","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1954 年 9 月","y":1954,"text":"第一届全国人民代表大会召开，通过《中华人民共和国宪法》","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1956 年 7 月","y":1956,"text":"长春第一汽车制造厂生产出第一辆解放牌汽车","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1956 年 9 月","y":1956,"text":"中共八大召开，正确分析国内主要矛盾","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1956 年底","y":1956,"text":"三大改造基本完成，社会主义基本制度在我国建立","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1957 年","y":1957,"text":"武汉长江大桥建成，第一个五年计划超额完成","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1958 年","y":1958,"text":"提出社会主义建设总路线，“大跃进”和人民公社化运动发动","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1964 年 10 月","y":1964,"text":"我国第一颗原子弹爆炸成功","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1970 年 4 月","y":1970,"text":"“东方红一号”人造地球卫星发射成功","unit":"d2","tag":"中国现代","volume":"v4"},{"t":"1973 年","y":1973,"text":"袁隆平培育出籼型杂交水稻","unit":"d2","tag":"中国现代","volume":"v4"}]},{"volume":"v4","unit":{"id":"d3","volume":"v4","num":3,"title":"中国特色社会主义道路","short":"改革开放","years":"1978 年至今","accent":"#A83E31","soft":"#F9E6E1","tint":"#ECC0B5","icon":"🌱","tagline":"从十一届三中全会出发，中国走出了一条自己的现代化道路。","intro":"1978 年冬天，北京的一场会议把国家的工作中心从阶级斗争转向经济建设。此后四十多年，小岗村的土地上按下红手印，深圳的荒滩上立起高楼，社会主义市场经济从陌生概念变成亿万人的生活。本单元要回答：这条被称为“中国特色社会主义”的道路，是怎样一步步走出来的，又为什么能走得通。","bigQuestion":"一条没有现成答案的路，靠什么走对第一步，又靠什么一直走下去？","goals":["理解十一届三中全会实现伟大转折的历史意义。","梳理农村与城市经济体制改革的主要内容和作用。","说明我国对外开放格局形成的过程与特点。","认识中国特色社会主义理论体系的发展脉络。"],"keyLine":"十一届三中全会实现转折，小岗村按下红手印，深圳特区打开窗口，南方谈话破除迷雾，中国梦接续复兴路。"},"lessons":[{"id":"d3l1","num":7,"unit":"d3","title":"伟大的历史转折","years":"1978 年","icon":"🔄","tag":"转折","hook":"1978 年 12 月，北京京西宾馆的一间会议室里暖气烧得很足。几十位与会者争论的不是一场战役，而是一个国家接下来要往哪里走。","core":"1978 年 12 月，中共十一届三中全会在北京召开。全会停止使用“以阶级斗争为纲”的口号，把党和国家的工作中心转移到经济建设上来，作出实行改革开放的历史性决策，是新中国成立以来党的历史上具有深远意义的伟大转折。","points":["背景：1976 年 10 月粉碎“四人帮”，“文化大革命”结束；但“两个凡是”的方针使拨乱反正举步维艰。","思想准备：1978 年 5 月，《光明日报》发表《实践是检验真理的唯一标准》，引发全国性的真理标准问题大讨论。","召开：1978 年 12 月，中共十一届三中全会在北京召开，确定解放思想、开动脑筋、实事求是、团结一致向前看的指导方针。","决策：全会停止使用“以阶级斗争为纲”的口号，把党和国家的工作中心转移到经济建设上来，作出实行改革开放的历史性决策。","组织：全会形成以邓小平为核心的党的第二代中央领导集体，恢复党的民主集中制传统，大批冤假错案得到平反。","意义：这次会议是新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设新时期。"],"terms":[["两个凡是","1977 年提出的方针：凡是毛主席作出的决策都坚决维护，凡是毛主席的指示都始终不渝地遵循，实质是坚持“左”的错误。"],["真理标准问题大讨论","1978 年围绕《实践是检验真理的唯一标准》展开的全国性讨论，冲破了“两个凡是”的束缚，是一次深刻的思想解放。"],["中共十一届三中全会","1978 年 12 月在北京召开，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。"],["拨乱反正","纠正“文化大革命”的错误，平反冤假错案，恢复被破坏的秩序；1981 年通过《关于建国以来党的若干历史问题的决议》。"]],"figures":[["邓小平","在中央工作会议上发表《解放思想，实事求是，团结一致向前看》的讲话，成为全会的主题报告"],["陈云","在中央工作会议上提出解决历史遗留问题，推动拨乱反正"],["胡耀邦","主持平反冤假错案，支持真理标准问题讨论"]],"events":[["1976 年 10 月","粉碎“四人帮”，“文化大革命”结束"],["1978 年 5 月","《实践是检验真理的唯一标准》发表"],["1978 年 12 月","中共十一届三中全会召开"],["1980 年","为刘少奇平反昭雪"],["1981 年 6 月","通过《关于建国以来党的若干历史问题的决议》"]],"treaty":null,"significance":"十一届三中全会重新确立了党的解放思想、实事求是的思想路线，实现了党和国家工作中心的战略转移，开启了改革开放和社会主义现代化建设新时期，是新中国成立以来党的历史上具有深远意义的伟大转折。","source":{"quote":"一个党，一个国家，一个民族，如果一切从本本出发，思想僵化，迷信盛行，那它就不能前进，它的生机就停止了。","from":"邓小平《解放思想，实事求是，团结一致向前看》（1978 年 12 月）"},"pitfall":"十一届三中全会是新中国成立以来党的历史上的伟大转折，不是新民主主义革命的开端；改革首先从农村起步。","memory":"七六粉碎四人帮，七八三中开新章；中心转向搞建设，改革开放启新航。","link":"上承“文化大革命”结束后的两年徘徊，下启农村改革与对外开放，是中国现代史的分水岭。","exam":["十一届三中全会的内容与意义","真理标准问题大讨论的作用","伟大转折的主要表现"]},{"id":"d3l2","num":8,"unit":"d3","title":"经济体制改革","years":"1978—1992 年","icon":"🌾","tag":"改革","hook":"1978 年冬夜，安徽凤阳小岗村一间低矮的土屋里，18 户农民在一张纸上按下红手印。纸上写的很朴素：分田到户，不再向国家伸手要钱要粮。","core":"经济体制改革首先从农村突破。1978 年，安徽凤阳小岗村农民实行分田包干到户，家庭联产承包责任制在全国推开，农业生产和农民生活明显改善。1984 年城市经济体制改革全面展开，1992 年中共十四大明确提出建立社会主义市场经济体制的目标。","points":["背景：人民公社体制下集体劳动、平均分配，农民生产积极性不高，农业发展缓慢，温饱问题长期没有解决。","农村突破：1978 年，安徽凤阳小岗村 18 户农民签订“大包干”契约，分田包干到户、自负盈亏，粮食产量大幅增长。","推广：在中央支持下，家庭联产承包责任制在全国推开，到 1983 年基本普遍实行，农民有了生产经营自主权。","农村发展：农业生产向专业化、商品化、社会化发展，乡镇企业异军突起，为农村剩余劳动力提供了出路。","城市改革：1984 年中共十二届三中全会后，城市经济体制改革全面展开，中心环节是增强企业活力，扩大企业自主权。","目标确立：1992 年中共十四大提出建立社会主义市场经济体制，1993 年十四届三中全会通过相关决定，改革进入新阶段。"],"terms":[["家庭联产承包责任制","在土地公有制基础上，把土地承包给农户经营，实行包产到户、自负盈亏。农民有了生产自主权，农业生产迅速发展。"],["大包干","小岗村农民创造的做法：保证国家的，留足集体的，剩下都是自己的。简单说就是分田包干到户、自负盈亏。"],["乡镇企业","农村改革后发展起来的集体或个体企业，吸纳了大量农村剩余劳动力，成为农村经济的重要支柱。"],["社会主义市场经济体制","使市场在国家宏观调控下对资源配置起基础性作用的经济体制，1992 年中共十四大明确为改革目标。"]],"figures":[["小岗村 18 户农民","按下红手印，率先实行“大包干”，拉开农村改革序幕"],["万里","任安徽省委第一书记，支持小岗村等地实行包产到户"],["邓小平","肯定农村改革，推动城市经济体制改革全面展开"]],"events":[["1978 年冬","小岗村 18 户农民签订“大包干”契约"],["1983 年","家庭联产承包责任制基本在全国农村普遍实行"],["1984 年 10 月","中共十二届三中全会通过《关于经济体制改革的决定》"],["1992 年 10 月","中共十四大提出建立社会主义市场经济体制"]],"treaty":null,"significance":"农村改革使农民获得生产自主权，农业生产和农民收入大幅增长，解决了长期困扰中国的吃饭问题；城市改革增强了企业活力；社会主义市场经济体制目标的确立，为中国经济持续快速发展开辟了道路。","source":{"quote":"如不成，我们干部坐牢杀头也甘心，大家社员也保证把我们的小孩养活到 18 岁。","from":"安徽凤阳小岗村 18 户农民“大包干”契约（1978 年冬）"},"pitfall":"家庭联产承包责任制没有改变土地公有制，改变的是经营方式；改革首先从农村开始，城市经济体制改革到 1984 年才全面展开。","memory":"小岗红手印，包干到户忙；农村先破题，城市再登场；九二定市场，体制换新装。","link":"承接十一届三中全会的改革决策，农村的成功为城市改革积累经验，体制转型又为对外开放提供了底气。","exam":["家庭联产承包责任制的性质与作用","城市经济体制改革的中心环节","社会主义市场经济体制目标的确立"]},{"id":"d3l3","num":9,"unit":"d3","title":"对外开放","years":"1980 年至今","icon":"🌊","tag":"开放","hook":"1980 年，深圳还只是一个边陲小镇。推土机开进荒滩，蛇口的开山炮响过之后，一座城市在几年间拔地而起。","core":"1980 年，我国在深圳、珠海、汕头、厦门兴办四个经济特区；此后开放沿海城市、开辟沿海经济开放区，逐步形成“经济特区—沿海开放城市—沿海经济开放区—内地”的全方位、多层次、宽领域的对外开放格局。2001 年中国加入世界贸易组织，开放进入新阶段。","points":["背景：十一届三中全会后，对外开放成为基本国策；世界新技术革命兴起，中国需要通过学习和引进缩小与发达国家的差距。","特区创办：1980 年，中央决定在广东、福建兴办深圳、珠海、汕头、厦门四个经济特区，实行特殊政策，吸引外资和先进技术。","特区作用：深圳由边陲小镇发展为现代化城市，成为对外开放的“窗口”；1988 年海南岛被划为经济特区。","扩大开放：1984 年开放 14 个沿海城市；1985 年开辟长江三角洲、珠江三角洲、闽南三角地区为沿海经济开放区。","纵深推进：1990 年上海浦东开发开放；1992 年后又开放沿江、沿边城市和内陆省会城市。","入世与升级：2001 年 12 月中国正式加入世界贸易组织；2013 年设立上海自由贸易试验区，开放向更高水平推进。"],"terms":[["经济特区","国家划出一定区域，实行特殊的经济政策和管理体制，吸引外资、技术和管理经验，是改革开放的“窗口”和“试验田”。"],["沿海经济开放区","1985 年开辟的长江三角洲、珠江三角洲、闽南三角地区等，依托沿海优势发展外向型经济。"],["世界贸易组织","简称 WTO。2001 年 12 月中国正式加入，标志着中国对外开放进入一个新的阶段。"],["浦东开发开放","1990 年国家决定开发开放上海浦东，使其逐步成为国际经济、金融、贸易、航运中心之一。"]],"figures":[["邓小平","倡导兴办经济特区，1984 年视察深圳并题词肯定特区政策"],["袁庚","主持创办蛇口工业区，提出“时间就是金钱，效率就是生命”"],["习仲勋","主政广东，向中央建议在广东实行特殊政策、试办特区"]],"events":[["1980 年","深圳、珠海、汕头、厦门经济特区设立"],["1984 年","开放 14 个沿海城市"],["1990 年","上海浦东开发开放"],["2001 年 12 月","中国正式加入世界贸易组织"],["2013 年","中国（上海）自由贸易试验区设立"]],"treaty":null,"significance":"对外开放使中国在更大范围、更高层次上参与国际经济技术合作与竞争，引进了资金、技术和管理经验，推动了经济体制改革的深化，也改变了沿海地区的面貌，是中国融入世界的关键一步。","source":{"quote":"深圳的发展和经验证明，我们建立经济特区的政策是正确的。","from":"邓小平视察深圳时的题词（1984 年 1 月）"},"pitfall":"最早设立的四个经济特区是深圳、珠海、汕头、厦门，海南到 1988 年才设特区；经济特区不是特别行政区。","memory":"八〇深圳珠海汕，厦门一起开门窗；沿海沿江向内陆，入世浦东步步宽。","link":"对内改革与对外开放相互促进：农村改革解放了生产力，对外开放则引来资金与技术，二者共同支撑起中国经济的起飞。","exam":["经济特区的设立与作用","对外开放格局的形成过程","中国加入世界贸易组织的意义"]},{"id":"d3l4","num":10,"unit":"d3","title":"建设中国特色社会主义","years":"1982—2012 年","icon":"📘","tag":"理论","hook":"1982 年 9 月，中共十二大开幕。邓小平在开幕词里说要“走自己的道路”。台下的人未必都意识到，这句话会成为此后几十年中国政治的底色。","core":"1982 年中共十二大提出“建设有中国特色的社会主义”。此后，从社会主义初级阶段理论到社会主义市场经济体制，从邓小平理论到“三个代表”重要思想、科学发展观，中国特色社会主义理论体系逐步形成，指导改革开放不断深化。","points":["提出：1982 年中共十二大，邓小平提出把马克思主义同中国实际结合起来，走自己的道路，建设有中国特色的社会主义。","初级阶段：1987 年中共十三大系统阐述社会主义初级阶段理论，提出“一个中心、两个基本点”的基本路线。","南方谈话：1992 年初，邓小平视察南方并发表谈话，强调发展才是硬道理，提出判断改革成败的“三个有利于”标准。","市场经济：1992 年中共十四大提出建立社会主义市场经济体制的目标，确立邓小平建设有中国特色社会主义理论在全党的指导地位。","理论确立：1997 年中共十五大把邓小平理论确立为党的指导思想；2002 年十六大把“三个代表”重要思想确立为党的指导思想。","继续发展：2007 年中共十七大提出中国特色社会主义理论体系；2012 年十八大把科学发展观确立为党的指导思想。"],"terms":[["社会主义初级阶段","我国在生产力落后、商品经济不发达条件下建设社会主义必然要经历的阶段，从 20 世纪 50 年代中期起至少一百年。"],["一个中心，两个基本点","党在社会主义初级阶段基本路线的核心内容：以经济建设为中心，坚持四项基本原则，坚持改革开放。"],["三个有利于","邓小平南方谈话提出的判断标准：是否有利于发展社会主义社会的生产力，是否有利于增强综合国力，是否有利于提高人民生活水平。"],["中国特色社会主义理论体系","包括邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想在内的科学理论体系。"]],"figures":[["邓小平","提出建设有中国特色的社会主义，发表南方谈话，创立邓小平理论"],["江泽民","提出“三个代表”重要思想"],["胡锦涛","提出科学发展观"]],"events":[["1982 年 9 月","中共十二大提出“建设有中国特色的社会主义”"],["1987 年 10 月","中共十三大阐述社会主义初级阶段理论"],["1992 年","邓小平南方谈话；中共十四大提出建立社会主义市场经济体制"],["1997 年 9 月","中共十五大把邓小平理论确立为党的指导思想"],["2012 年 11 月","中共十八大把科学发展观确立为党的指导思想"]],"treaty":null,"significance":"中国特色社会主义理论体系回答了什么是社会主义、怎样建设社会主义，建设什么样的党、怎样建设党，实现什么样的发展、怎样发展等重大问题，是改革开放和社会主义现代化建设的行动指南。","source":{"quote":"走自己的道路，建设有中国特色的社会主义，这就是我们总结长期历史经验得出的基本结论。","from":"邓小平《中国共产党第十二次全国代表大会开幕词》（1982 年 9 月）"},"pitfall":"中国特色社会主义理论体系不包括毛泽东思想；毛泽东思想是马克思列宁主义在中国的运用和发展，不属于这一理论体系。","memory":"八十二大提特色，八七十三讲阶段；九二南方春雷响，十四市场定方向，十五邓论入党章。","link":"理论在改革实践中形成，又反过来指导改革：认识每前进一步，体制改革的步伐就更稳一分。","exam":["中国特色社会主义理论的提出与发展","邓小平南方谈话的内容与意义","邓小平理论的历史地位"]},{"id":"d3l5","num":11,"unit":"d3","title":"为实现中国梦而努力奋斗","years":"2012 年至今","icon":"🌟","tag":"复兴","hook":"2012 年 11 月 29 日，习近平走进国家博物馆参观《复兴之路》展览。看完展览，他说：实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想。","core":"2012 年 11 月，习近平提出实现中华民族伟大复兴的中国梦。中共十八大提出全面建成小康社会，十九大宣告中国特色社会主义进入新时代，2021 年我国全面建成小康社会，二十大提出以中国式现代化全面推进中华民族伟大复兴。","points":["提出：2012 年 11 月，习近平在参观《复兴之路》展览时提出中国梦，其内涵是国家富强、民族振兴、人民幸福。","目标：中共十八大提出到 2020 年全面建成小康社会；“两个一百年”奋斗目标指向建党一百年和新中国成立一百年两个时间节点。","布局：以“四个全面”战略布局统筹推进，树立创新、协调、绿色、开放、共享的新发展理念。","新时代：2017 年中共十九大宣告中国特色社会主义进入新时代，习近平新时代中国特色社会主义思想被确立为指导思想。","新矛盾：我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","小康与新征程：2021 年宣告全面建成小康社会；2022 年中共二十大提出以中国式现代化全面推进中华民族伟大复兴。"],"terms":[["中国梦","实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想，基本内涵是国家富强、民族振兴、人民幸福。"],["两个一百年","到中国共产党成立一百年时全面建成小康社会，到新中国成立一百年时建成富强民主文明和谐美丽的社会主义现代化强国。"],["新发展理念","2015 年中共十八届五中全会提出创新、协调、绿色、开放、共享的发展理念，指引我国经济社会高质量发展。"],["中国式现代化","中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。"]],"figures":[["习近平","提出中国梦，领导打赢脱贫攻坚战，推动中国特色社会主义进入新时代"],["黄文秀","脱贫攻坚一线的驻村第一书记，把生命献给了大山里的乡亲"]],"events":[["2012 年 11 月","习近平提出实现中华民族伟大复兴的中国梦"],["2017 年 10 月","中共十九大宣告中国特色社会主义进入新时代"],["2021 年 7 月","宣告全面建成小康社会"],["2022 年 10 月","中共二十大提出以中国式现代化全面推进中华民族伟大复兴"]],"treaty":null,"significance":"中国梦把国家追求、民族向往和人民期盼凝聚在一起，成为全党全国各族人民共同的奋斗目标；全面建成小康社会和脱贫攻坚的胜利，为全面推进中华民族伟大复兴奠定了坚实基础。","source":{"quote":"实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想。","from":"习近平参观《复兴之路》展览时的讲话（2012 年 11 月 29 日）"},"pitfall":"中国梦于 2012 年 11 月提出；“两个一百年”的第一个百年目标已在 2021 年实现，第二个指向新中国成立一百年。","memory":"一二复兴讲梦想，三个内涵记心上；二〇二一达小康，中国式现代化启新航。","link":"从十一届三中全会的“富起来”到新时代的“强起来”，本课是这条道路的当下进行时。","exam":["中国梦的提出与内涵","“两个一百年”奋斗目标","中国式现代化的特点"]}],"questions":[{"id":"d3q1","lesson":"d3l1","unit":"d3","type":"choice","level":1,"stem":"1978 年 12 月，中共中央在北京召开、作出改革开放历史性决策的会议是","options":["中共十一大","中共十一届三中全会","中共十二大","中共十四大"],"answer":1,"explain":"1978 年 12 月中共十一届三中全会在北京召开，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。中共十二大在 1982 年，中共十四大在 1992 年。","point":"中共十一届三中全会"},{"id":"d3q2","lesson":"d3l1","unit":"d3","type":"choice","level":2,"stem":"中共十一届三中全会作出的历史性决策是","options":["继续“以阶级斗争为纲”","把党和国家的工作中心转移到经济建设上来，实行改革开放","建立社会主义市场经济体制","加入世界贸易组织"],"answer":1,"explain":"十一届三中全会停止使用“以阶级斗争为纲”的口号，把工作中心转移到经济建设上来，作出实行改革开放的决策。建立社会主义市场经济体制是 1992 年十四大的目标，加入世界贸易组织发生在 2001 年。","point":"十一届三中全会的决策"},{"id":"d3q3","lesson":"d3l1","unit":"d3","type":"order","level":2,"stem":"按时间先后排列下列事件","items":["粉碎“四人帮”","《实践是检验真理的唯一标准》发表","中共十一届三中全会召开","通过《关于建国以来党的若干历史问题的决议》"],"explain":"1976 年 10 月粉碎“四人帮”；1978 年 5 月发表《实践是检验真理的唯一标准》；1978 年 12 月召开十一届三中全会；1981 年 6 月通过《关于建国以来党的若干历史问题的决议》。","point":"伟大转折的进程"},{"id":"d3q4","lesson":"d3l1","unit":"d3","type":"fill","level":1,"stem":"1978 年 5 月，《光明日报》发表《______》，引发关于真理标准问题的大讨论。","answer":["实践是检验真理的唯一标准","《实践是检验真理的唯一标准》"],"explain":"1978 年 5 月 11 日，《光明日报》以特约评论员名义发表《实践是检验真理的唯一标准》，引发全国性讨论，为十一届三中全会作了思想准备。","point":"真理标准问题大讨论"},{"id":"d3q5","lesson":"d3l2","unit":"d3","type":"choice","level":1,"stem":"我国经济体制改革首先取得突破的领域是","options":["城市国有企业","农村","金融业","对外贸易"],"answer":1,"explain":"经济体制改革首先从农村开始。1978 年小岗村农民实行分田包干到户，家庭联产承包责任制随后在全国推开，城市经济体制改革到 1984 年才全面展开。","point":"经济体制改革的起点"},{"id":"d3q6","lesson":"d3l2","unit":"d3","type":"choice","level":2,"stem":"家庭联产承包责任制的实质是","options":["改变了土地公有制","在土地公有制基础上改变经营方式，使农民获得生产自主权","恢复了封建土地私有制","取消了农民的全部赋税"],"answer":1,"explain":"家庭联产承包责任制坚持土地公有制，把土地承包给农户经营，改变的是经营方式和分配方式。土地公有制没有改变，也没有恢复封建土地私有制。","point":"家庭联产承包责任制"},{"id":"d3q7","lesson":"d3l2","unit":"d3","type":"match","level":2,"stem":"把下列改革举措与其意义配对","pairs":[["小岗村“大包干”","率先实行分田包干到户"],["1984 年中共十二届三中全会","城市经济体制改革全面展开"],["1992 年中共十四大","提出建立社会主义市场经济体制"],["乡镇企业","吸纳农村剩余劳动力"]],"explain":"农村改革以小岗村为起点，1983 年家庭联产承包责任制基本普遍实行；1984 年城市改革全面展开；1992 年十四大确立市场经济体制改革目标；乡镇企业发展为农村剩余劳动力提供了出路。","point":"经济体制改革的主要举措"},{"id":"d3q8","lesson":"d3l2","unit":"d3","type":"fill","level":1,"stem":"1978 年冬，安徽凤阳______村 18 户农民签订“大包干”契约，率先实行分田包干到户。","answer":["小岗","小岗村"],"explain":"1978 年冬，安徽凤阳小岗村 18 户农民签订契约，实行分田包干到户、自负盈亏，拉开农村改革序幕。","point":"小岗村与农村改革"},{"id":"d3q9","lesson":"d3l3","unit":"d3","type":"choice","level":1,"stem":"1980 年设立的第一批经济特区中，被称为对外开放“窗口”的是","options":["深圳","海南","浦东","天津"],"answer":0,"explain":"1980 年设立深圳、珠海、汕头、厦门四个经济特区，深圳发展最快，成为经济特区的代表和对外开放的“窗口”。海南到 1988 年才设特区，浦东 1990 年开发开放。","point":"经济特区"},{"id":"d3q10","lesson":"d3l3","unit":"d3","type":"choice","level":2,"stem":"经过多年推进，我国形成的对外开放格局是","options":["全方位、多层次、宽领域","只开放沿海少数城市","仅限于经济特区","完全的自由贸易"],"answer":0,"explain":"我国逐步形成“经济特区—沿海开放城市—沿海经济开放区—内地”的格局，具有全方位、多层次、宽领域的特点，不是只开放少数地区。","point":"对外开放格局"},{"id":"d3q11","lesson":"d3l3","unit":"d3","type":"order","level":2,"stem":"按时间先后排列我国对外开放的重大步骤","items":["设立深圳等四个经济特区","开放 14 个沿海城市","上海浦东开发开放","中国加入世界贸易组织","设立中国（上海）自由贸易试验区"],"explain":"1980 年设四个经济特区；1984 年开放 14 个沿海城市；1990 年开发开放浦东；2001 年 12 月加入世界贸易组织；2013 年设立上海自由贸易试验区。","point":"对外开放的历程"},{"id":"d3q12","lesson":"d3l3","unit":"d3","type":"fill","level":1,"stem":"2001 年 12 月，中国正式加入______，对外开放进入一个新的阶段。","answer":["世界贸易组织","世贸组织","WTO","wto"],"explain":"2001 年 12 月中国正式加入世界贸易组织（WTO），标志着中国对外开放进入新阶段。","point":"中国加入世界贸易组织"},{"id":"d3q13","lesson":"d3l4","unit":"d3","type":"choice","level":1,"stem":"首次提出“建设有中国特色的社会主义”的会议是","options":["中共十一届三中全会","中共十二大","中共十三大","中共十四大"],"answer":1,"explain":"1982 年中共十二大上，邓小平在开幕词中提出“走自己的道路，建设有中国特色的社会主义”。十三大阐述社会主义初级阶段理论，十四大提出建立社会主义市场经济体制。","point":"中共十二大"},{"id":"d3q14","lesson":"d3l4","unit":"d3","type":"choice","level":2,"stem":"1992 年，邓小平在南方谈话中强调的著名论断是","options":["“发展才是硬道理”","“以阶级斗争为纲”","“两个凡是”","“多快好省”"],"answer":0,"explain":"1992 年初邓小平视察南方并发表谈话，强调党的基本路线要管一百年，发展才是硬道理，提出“三个有利于”标准，进一步解放了人们的思想。","point":"邓小平南方谈话"},{"id":"d3q15","lesson":"d3l4","unit":"d3","type":"match","level":2,"stem":"把下列会议与其主要贡献配对","pairs":[["中共十二大","提出建设有中国特色的社会主义"],["中共十三大","阐述社会主义初级阶段理论"],["中共十四大","提出建立社会主义市场经济体制"],["中共十五大","把邓小平理论确立为党的指导思想"]],"explain":"十二大提出“建设有中国特色的社会主义”；十三大阐述社会主义初级阶段理论和基本路线；十四大提出市场经济体制改革目标；十五大把邓小平理论确立为党的指导思想。","point":"中国特色社会主义理论的形成"},{"id":"d3q16","lesson":"d3l4","unit":"d3","type":"choice","level":3,"stem":"下列不属于中国特色社会主义理论体系的是","options":["邓小平理论","“三个代表”重要思想","科学发展观","毛泽东思想"],"answer":3,"explain":"中国特色社会主义理论体系包括邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想。毛泽东思想是马克思列宁主义在中国的运用和发展，不属于这一理论体系。","point":"中国特色社会主义理论体系"},{"id":"d3q17","lesson":"d3l5","unit":"d3","type":"choice","level":1,"stem":"2012 年 11 月，习近平在参观《复兴之路》展览时提出的奋斗目标是","options":["实现中华民族伟大复兴的中国梦","“一国两制”","科教兴国","西部大开发"],"answer":0,"explain":"2012 年 11 月 29 日，习近平参观《复兴之路》展览时提出，实现中华民族伟大复兴就是中华民族近代以来最伟大的梦想。","point":"中国梦的提出"},{"id":"d3q18","lesson":"d3l5","unit":"d3","type":"choice","level":2,"stem":"“两个一百年”奋斗目标中，到新中国成立一百年时要建成","options":["社会主义初级阶段","富强民主文明和谐美丽的社会主义现代化强国","社会主义市场经济体制","总体小康"],"answer":1,"explain":"第一个百年目标是到中国共产党成立一百年时全面建成小康社会，已在 2021 年实现；第二个百年目标是到新中国成立一百年时建成富强民主文明和谐美丽的社会主义现代化强国。","point":"“两个一百年”奋斗目标"},{"id":"d3q19","lesson":"d3l5","unit":"d3","type":"order","level":2,"stem":"按时间先后排列新时代的重大事件","items":["习近平提出中国梦","中共十九大宣告中国特色社会主义进入新时代","宣告全面建成小康社会","中共二十大提出以中国式现代化全面推进中华民族伟大复兴"],"explain":"2012 年 11 月提出中国梦；2017 年 10 月十九大宣告进入新时代；2021 年 7 月宣告全面建成小康社会；2022 年 10 月二十大提出以中国式现代化全面推进中华民族伟大复兴。","point":"新时代的奋斗历程"},{"id":"d3q20","lesson":"d3l5","unit":"d3","type":"fill","level":2,"stem":"2022 年 10 月，中共二十大提出以______全面推进中华民族伟大复兴。","answer":["中国式现代化","中国式"],"explain":"2022 年 10 月中共二十大召开，提出以中国式现代化全面推进中华民族伟大复兴，明确了新征程上的中心任务。","point":"中国式现代化"}],"timeline":[{"t":"1978 年 12 月","y":1978.95,"text":"中共十一届三中全会召开，作出改革开放的历史性决策","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"1980 年","y":1980.65,"text":"深圳、珠海、汕头、厦门经济特区设立","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"1982 年 9 月","y":1982.75,"text":"中共十二大提出“建设有中国特色的社会主义”","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"1984 年 10 月","y":1984.8,"text":"城市经济体制改革全面展开；14 个沿海城市对外开放","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"1987 年 10 月","y":1987.8,"text":"中共十三大阐述社会主义初级阶段理论","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"1992 年","y":1992.2,"text":"邓小平发表南方谈话；中共十四大提出建立社会主义市场经济体制","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"2001 年 12 月","y":2001.95,"text":"中国正式加入世界贸易组织","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"2012 年 11 月","y":2012.9,"text":"中共十八大召开；习近平提出实现中华民族伟大复兴的中国梦","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"2021 年 7 月","y":2021.5,"text":"宣告全面建成小康社会，历史性地解决绝对贫困问题","unit":"d3","tag":"中国现代","volume":"v4"},{"t":"2022 年 10 月","y":2022.8,"text":"中共二十大提出以中国式现代化全面推进中华民族伟大复兴","unit":"d3","tag":"中国现代","volume":"v4"}]},{"volume":"v4","unit":{"id":"d4","volume":"v4","num":4,"title":"民族团结与祖国统一","short":"团结统一","years":"1949 年至今","accent":"#B8553F","soft":"#FAE9E3","tint":"#EDC6BB","icon":"🤝","tagline":"民族区域自治凝一体，一国两制归港澳，两岸同盼统一。","intro":"1949 年新中国成立后，中国面前摆着两道统一课题：国内各民族如何在一个国家里平等相处、共同发展；香港、澳门、台湾如何回到祖国怀抱。前者用民族区域自治制度回答，后者用“一国两制”构想回答。这一单元要弄清：这些制度从哪里来，怎样运作，又为什么能凝聚起中华民族共同体的认同。","bigQuestion":"在一个多民族、尚未完全统一的国家里，用什么制度才能把“多元”凝聚成“一体”？","goals":["说出民族区域自治制度的确立过程与五个自治区。","理解民族区域自治的意义和共同繁荣的举措。","解释“一国两制”的含义，复述港澳回归历程。","梳理两岸交往进程，认识一个中国原则。"],"keyLine":"四七内蒙立自治，八四中英签声明，九七香港九九澳，九二共识两岸通。"},"lessons":[{"id":"d4l1","num":12,"unit":"d4","title":"民族大团结","years":"1949 年至今","icon":"🎎","tag":"民族","hook":"1947 年 5 月 1 日，内蒙古王爷庙，各族代表在风雪初歇的草原上宣布成立自治政府。这是中国第一个省级民族自治区，比新中国成立还早两年多。","core":"我国在少数民族聚居的地方实行民族区域自治制度：1949 年《共同纲领》将其确定为一项基本政治制度，1954 年载入宪法，1984 年颁布《民族区域自治法》。全国建立五个省级自治区，保障少数民族当家作主，维护民族团结和国家统一。","points":["历史依据：我国是统一多民族国家，各民族在长期交往交流交融中形成了谁也离不开谁的格局。","制度确立：1949 年《共同纲领》把民族区域自治确定为一项基本政治制度；1954 年宪法将其载入；1984 年《民族区域自治法》颁布实施。","基本含义：在国家统一领导下，在少数民族聚居的地方实行区域自治，设立自治机关，行使自治权。","五个自治区：1947 年内蒙古自治区成立，是最早的一个；之后新疆（1955）、广西和宁夏（1958）、西藏（1965）相继成立。","共同繁荣：国家从资金、技术、人才等方面支援民族地区；2000 年实施西部大开发，2006 年青藏铁路全线通车。","文化与认同：保护和发展少数民族语言文字、文化遗产；铸牢中华民族共同体意识，各民族像石榴籽一样紧紧抱在一起。"],"terms":[["民族区域自治制度","在国家统一领导下，在少数民族聚居的地方实行区域自治，设立自治机关，行使自治权的制度，是我国一项基本政治制度。"],["自治区","省级民族自治地方。我国有内蒙古、新疆、广西、宁夏、西藏五个自治区，行政地位相当于省。"],["西部大开发","2000 年国家开始实施，覆盖重庆、四川、贵州、云南、西藏、陕西、甘肃、青海、宁夏、新疆、内蒙古、广西 12 个省区市，目的是加快西部和民族地区发展。"],["中华民族共同体意识","各民族在长期交往交流交融中形成的休戚与共、荣辱与共、生死与共、命运与共的共同体认同。"]],"figures":[["乌兰夫","领导内蒙古自治运动，1947 年内蒙古自治区成立时任自治区政府主席"],["孔繁森","援藏干部，任阿里地委书记，1994 年因公殉职"],["习近平","提出铸牢中华民族共同体意识"]],"events":[["1947 年","内蒙古自治区成立"],["1949 年","《共同纲领》确立民族区域自治制度"],["1954 年","民族区域自治载入《中华人民共和国宪法》"],["1984 年","《中华人民共和国民族区域自治法》颁布实施"],["2006 年","青藏铁路全线通车"]],"treaty":null,"significance":"民族区域自治制度把国家的集中统一与少数民族聚居地区的区域自治结合起来，保障了少数民族当家作主的权利，维护了民族团结和国家统一，为各民族共同繁荣发展奠定了基础。","source":{"quote":"各少数民族聚居的地方实行区域自治，设立自治机关，行使自治权。各民族自治地方都是中华人民共和国不可分离的部分。","from":"《中华人民共和国宪法》第四条（1982 年）"},"pitfall":"民族区域自治是在国家统一领导下、在少数民族聚居的地方实行，不是民族独立，也不等于港澳的“高度自治”。","memory":"四七内蒙开先河，五四宪法定国策；五个自治区当家，共同繁荣石榴籽。","link":"上承新中国成立后的民主制度建设，与人民代表大会制度并列；下与港澳“一国两制”呼应，共同回答民族团结与国家统一两大课题。","exam":["民族区域自治制度的确立与含义","五个省级自治区的成立时间","西部大开发与各民族共同繁荣"]},{"id":"d4l2","num":13,"unit":"d4","title":"香港和澳门回归祖国","years":"1997—1999 年","icon":"🌺","tag":"统一","hook":"1997 年 6 月 30 日午夜，香港会展中心新翼，英国国旗在雨中缓缓降下。7 月 1 日零时，五星红旗升起。一个半世纪的等待，在这一刻画上句号。","core":"为解决台湾、香港、澳门问题，邓小平提出“一国两制”构想：在一个中国的前提下，国家主体坚持社会主义制度，香港、澳门保持原有资本主义制度长期不变。1984 年中英、1987 年中葡签署联合声明，1997 年香港、1999 年澳门回归祖国。","points":["问题由来：1842 年《南京条约》割香港岛，1860 年《北京条约》割九龙司，1898 年强租新界 99 年；1553 年后葡萄牙人逐步占据澳门。","构想提出：改革开放后，邓小平从维护祖国和中华民族根本利益出发，提出“一国两制”伟大构想。","基本含义：在一个中国的前提下，国家的主体坚持社会主义制度，香港、澳门、台湾保持原有的资本主义制度长期不变。","谈判与声明：1984 年 12 月中英签署联合声明，1987 年 4 月中葡签署联合声明，确定了回归的时间表。","回归：1997 年 7 月 1 日香港回归，1999 年 12 月 20 日澳门回归；人民解放军进驻，特别行政区享有高度自治权。","回归后：港澳保持繁荣稳定，与内地交流合作加深；2020 年香港国安法实施，香港局势实现由乱到治的重大转折。"],"terms":[["一国两制","一个国家，两种制度。在一个中国的前提下，国家的主体坚持社会主义制度，香港、澳门、台湾保持原有的资本主义制度长期不变。"],["特别行政区","根据宪法设立、直属于中央人民政府的地方行政区域，享有高度自治权，其外交和国防事务由中央人民政府管理。"],["高度自治","特别行政区享有行政管理权、立法权、独立的司法权和终审权，但外交、国防等事务由中央负责。"],["粤港澳大湾区","由香港、澳门两个特别行政区和广东省广州、深圳等九市组成，2019 年《粤港澳大湾区发展规划纲要》发布。"]],"figures":[["邓小平","提出“一国两制”伟大构想"],["撒切尔夫人","英国首相，1984 年与中方签署中英联合声明"],["董建华","香港特别行政区第一任行政长官"],["何厚铧","澳门特别行政区第一任行政长官"]],"events":[["1984 年 12 月","中英签署关于香港问题的联合声明"],["1987 年 4 月","中葡签署关于澳门问题的联合声明"],["1997 年 7 月 1 日","中国对香港恢复行使主权"],["1999 年 12 月 20 日","中国对澳门恢复行使主权"],["2020 年 6 月","香港特别行政区维护国家安全法通过"]],"treaty":{"name":"中英、中葡联合声明","date":"1984 年 12 月、1987 年 4 月","items":["中英联合声明：中国政府于 1997 年 7 月 1 日对香港恢复行使主权","中葡联合声明：中国政府于 1999 年 12 月 20 日对澳门恢复行使主权","回归后设立香港特别行政区、澳门特别行政区，享有高度自治权","香港、澳门保持原有的资本主义制度和生活方式长期不变","特别行政区的外交和国防事务由中央人民政府管理"],"note":"两个联合声明是解决历史遗留问题的国际文件，不是不平等条约；“一国两制”构想最先为解决台湾问题提出，首先在港澳得到成功实践。"},"significance":"香港、澳门回归祖国，洗雪了百年国耻，是“一国两制”方针的成功实践，在完成祖国统一大业的道路上迈出了重要一步，也为国际社会和平解决历史遗留问题提供了范例。","source":{"quote":"实现国家统一是民族的愿望，一百年不统一，一千年也要统一的。","from":"邓小平《一个国家，两种制度》（1984 年 6 月）"},"pitfall":"香港岛为 1842 年《南京条约》割占，九龙司为 1860 年《北京条约》割占，新界是 1898 年租借 99 年；港澳回归是恢复行使主权，不是“新取得”领土。","memory":"一国两制邓公谋，中英中葡定归期；九七香港九九澳，百年国耻此时洗。","link":"与民族区域自治制度共同构成维护国家统一的制度安排；港澳回归的成功实践，为海峡两岸的和平统一提供了示范。","exam":["“一国两制”的含义与提出者","香港、澳门回归的时间与意义","特别行政区的高度自治权"]},{"id":"d4l3","num":14,"unit":"d4","title":"海峡两岸的交往","years":"1949 年至今","icon":"🌉","tag":"两岸","hook":"1979 年元旦，收音机里传出《告台湾同胞书》。同一天，福建前线的炮声停了下来。炮击了二十年的金门，第一次安静下来。","core":"台湾问题是 1949 年国民党败退台湾后形成的。改革开放后，党和政府形成“和平统一、一国两制”的对台基本方针。1979 年《告台湾同胞书》倡导和平统一，1987 年两岸隔绝状态被打破，1992 年达成“九二共识”，两岸交往日益密切。","points":["问题由来：1949 年国民党败退台湾，台湾与祖国大陆分离；《开罗宣言》《波茨坦公告》规定台湾归还中国。","方针演变：新中国成立初提出解放台湾；20 世纪 50 年代中期确立争取用和平方式解放台湾的思想；改革开放后形成“和平统一、一国两制”基本方针。","打破隔绝：1979 年元旦全国人大常委会发表《告台湾同胞书》，宣布采用和平方式统一祖国；1987 年台湾当局开放居民赴大陆探亲。","两会与共识：1990 年台湾成立海基会，1991 年大陆成立海协会；1992 年两会达成“九二共识”，即海峡两岸均坚持一个中国原则。","汪辜会谈与反分裂：1993 年汪道涵与辜振甫在新加坡会谈；2005 年十届全国人大三次会议通过《反分裂国家法》。","交流与统一：2008 年两岸实现全面直接双向“三通”；2015 年习近平与马英九在新加坡会面，是 1949 年以来两岸领导人首次会面。"],"terms":[["九二共识","1992 年海协会与海基会达成的共识：海峡两岸均坚持一个中国原则。它是两岸关系和平发展的政治基础。"],["海协会与海基会","海协会是 1991 年大陆成立的海峡两岸关系协会，海基会是 1990 年台湾成立的海峡交流基金会，两会负责两岸事务性商谈。"],["“三通”","海峡两岸直接通邮、通航、通商。2008 年两岸实现全面直接双向“三通”。"],["和平统一、一国两制","改革开放后形成的对台基本方针，即争取和平统一，统一后台湾保持原有的资本主义制度长期不变。"]],"figures":[["邓小平","提出“一国两制”构想，形成对台基本方针"],["汪道涵","海峡两岸关系协会会长，1993 年与辜振甫会谈"],["辜振甫","台湾海峡交流基金会董事长，出席汪辜会谈"],["连战","2005 年率中国国民党访问团访问大陆，被称为“和平之旅”"]],"events":[["1979 年 1 月","全国人大常委会发表《告台湾同胞书》"],["1987 年","台湾当局开放居民赴大陆探亲，两岸隔绝状态被打破"],["1992 年","两会达成“九二共识”"],["2008 年 12 月","两岸实现全面直接双向“三通”"],["2015 年 11 月","习近平与马英九在新加坡会面"]],"treaty":null,"significance":"海峡两岸的交往由隔绝走向密切，两岸同胞的经济文化联系不断加强；“九二共识”确立了一个中国原则这一政治基础，为实现祖国完全统一积累了条件。","source":{"quote":"今天，实现中国的统一，是人心所向，大势所趋。","from":"《中华人民共和国全国人大常委会告台湾同胞书》（1979 年 1 月 1 日）"},"pitfall":"“九二共识”的核心是海峡两岸均坚持一个中国原则，不是“两个中国”或“一中一台”；台湾问题是中国内战遗留问题，与港澳问题性质不同。","memory":"七九告同胞，八七破隔绝；九二共识立，两岸一家亲。","link":"与港澳回归同属“祖国统一”主线：港澳以“一国两制”成功回归，两岸在“九二共识”基础上和平发展，共同指向祖国完全统一。","exam":["“九二共识”与一个中国原则","两岸关系发展的主要历程","台湾问题的由来与《反分裂国家法》"]}],"questions":[{"id":"d4q1","lesson":"d4l1","unit":"d4","type":"choice","level":1,"stem":"我国在少数民族聚居地区实行的一项基本政治制度是","options":["人民代表大会制度","民族区域自治制度","中国共产党领导的多党合作和政治协商制度","基层群众自治制度"],"answer":1,"explain":"民族区域自治制度是我国的一项基本政治制度，1949 年《共同纲领》将其确定下来，1954 年载入宪法。人民代表大会制度是我国的根本政治制度。","point":"民族区域自治制度"},{"id":"d4q2","lesson":"d4l1","unit":"d4","type":"choice","level":2,"stem":"我国第一个省级少数民族自治区是","options":["内蒙古自治区","新疆维吾尔自治区","广西壮族自治区","西藏自治区"],"answer":0,"explain":"1947 年 5 月 1 日内蒙古自治区成立，是我国第一个省级民族自治区，比新中国成立还早两年多。西藏自治区 1965 年成立，是五个自治区中成立最晚的一个。","point":"五个省级自治区"},{"id":"d4q3","lesson":"d4l1","unit":"d4","type":"match","level":2,"stem":"把下列自治区与其成立时间配对","pairs":[["内蒙古自治区","1947 年"],["新疆维吾尔自治区","1955 年"],["宁夏回族自治区","1958 年"],["西藏自治区","1965 年"]],"explain":"内蒙古自治区 1947 年成立，新疆维吾尔自治区 1955 年成立，宁夏回族自治区 1958 年成立，西藏自治区 1965 年成立；广西壮族自治区也在 1958 年成立。","point":"民族自治区的建立"},{"id":"d4q4","lesson":"d4l1","unit":"d4","type":"fill","level":2,"stem":"2006 年全线通车的______，结束了西藏没有铁路的历史，是各民族共同繁荣发展的见证。","answer":["青藏铁路","青藏铁路线"],"explain":"2006 年 7 月 1 日青藏铁路全线通车，把西藏与内地更紧密地连接起来，体现了国家对民族地区发展的支持。","point":"各民族的共同繁荣"},{"id":"d4q5","lesson":"d4l2","unit":"d4","type":"choice","level":1,"stem":"“一国两制”伟大构想的提出者是","options":["毛泽东","周恩来","邓小平","江泽民"],"answer":2,"explain":"改革开放后，邓小平从维护祖国和中华民族根本利益出发，提出“一国两制”伟大构想，首先用于解决香港、澳门问题。","point":"“一国两制”的提出"},{"id":"d4q6","lesson":"d4l2","unit":"d4","type":"choice","level":2,"stem":"中国对香港恢复行使主权的时间是","options":["1984 年 12 月","1987 年 4 月","1997 年 7 月 1 日","1999 年 12 月 20 日"],"answer":2,"explain":"1997 年 7 月 1 日中国对香港恢复行使主权，香港特别行政区成立。1984 年 12 月是中英签署联合声明的时间，1999 年 12 月 20 日是澳门回归的时间。","point":"香港回归"},{"id":"d4q7","lesson":"d4l2","unit":"d4","type":"order","level":2,"stem":"按时间先后排列下列事件","items":["中英签署关于香港问题的联合声明","中葡签署关于澳门问题的联合声明","中国对香港恢复行使主权","中国对澳门恢复行使主权"],"explain":"1984 年 12 月中英签署联合声明 → 1987 年 4 月中葡签署联合声明 → 1997 年 7 月 1 日香港回归 → 1999 年 12 月 20 日澳门回归。","point":"港澳回归的历程"},{"id":"d4q8","lesson":"d4l2","unit":"d4","type":"fill","level":2,"stem":"“一国两制”构想中，国家的主体坚持______制度，香港、澳门、台湾保持原有的资本主义制度长期不变。","answer":["社会主义","社会主义制度"],"explain":"“一国两制”的前提是一个中国，国家的主体坚持社会主义制度，港澳台保持原有的资本主义制度长期不变。","point":"“一国两制”的含义"},{"id":"d4q9","lesson":"d4l3","unit":"d4","type":"choice","level":1,"stem":"1979 年元旦，全国人大常委会发表《告台湾同胞书》，宣布","options":["用武力解放台湾","采用和平方式统一祖国","在台湾实行“一国两制”","停止一切两岸交往"],"answer":1,"explain":"《告台湾同胞书》宣布采用和平方式统一祖国的方针；同一天，国防部宣布停止对金门等岛屿的炮击。“一国两制”构想是此后逐步形成的。","point":"《告台湾同胞书》"},{"id":"d4q10","lesson":"d4l3","unit":"d4","type":"choice","level":2,"stem":"“九二共识”的核心内容是","options":["海峡两岸均坚持一个中国原则","两岸都实行“一国两制”","两岸直接通邮、通航、通商","台湾可以保留自己的军队"],"answer":0,"explain":"1992 年海协会与海基会达成“九二共识”，即海峡两岸均坚持一个中国原则，这是两岸关系和平发展的政治基础。直接“三通”是 2008 年实现的。","point":"“九二共识”"},{"id":"d4q11","lesson":"d4l3","unit":"d4","type":"match","level":2,"stem":"把下列两岸交往中的事件与其时间配对","pairs":[["《告台湾同胞书》发表","1979 年"],["“九二共识”达成","1992 年"],["汪辜会谈举行","1993 年"],["两岸全面直接双向“三通”","2008 年"]],"explain":"1979 年发表《告台湾同胞书》 → 1992 年达成“九二共识” → 1993 年汪辜会谈在新加坡举行 → 2008 年两岸实现全面直接双向“三通”。","point":"两岸交往的历程"},{"id":"d4q12","lesson":"d4l3","unit":"d4","type":"choice","level":3,"stem":"1943 年《开罗宣言》规定，日本所窃取于中国之领土，例如东北、台湾、澎湖列岛等，归还中国；1945 年《波茨坦公告》重申这一条件必将实施。这两份文件说明","options":["台湾是中国领土不可分割的一部分有国际法依据","台湾问题是中国内战遗留的问题","解决台湾问题必须依靠国际会议","台湾可以与大陆实行不同的社会制度"],"answer":0,"explain":"《开罗宣言》《波茨坦公告》是重要的国际法文件，明确规定台湾归还中国，为台湾是中国领土不可分割的一部分提供了国际法依据。台湾问题是中国内战遗留问题，属于中国内政。","point":"台湾是中国领土的一部分"}],"timeline":[{"t":"1947 年 5 月","y":1947.4,"text":"内蒙古自治区成立，这是我国第一个省级民族自治区","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"1949 年 9 月","y":1949.7,"text":"《中国人民政治协商会议共同纲领》通过，把民族区域自治作为一项基本政治制度确定下来","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"1965 年 9 月","y":1965.7,"text":"西藏自治区成立，我国五个省级民族自治区全部建立","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"1979 年 1 月","y":1979.01,"text":"全国人大常委会发表《告台湾同胞书》，宣布采用和平方式统一祖国的方针","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"1984 年 12 月","y":1984.95,"text":"中英签署关于香港问题的联合声明，确定 1997 年 7 月 1 日恢复行使主权","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"1992 年","y":1992.5,"text":"海协会与海基会达成“九二共识”，即海峡两岸均坚持一个中国原则","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"1997 年 7 月 1 日","y":1997.5,"text":"中国对香港恢复行使主权，香港特别行政区成立","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"1999 年 12 月 20 日","y":1999.97,"text":"中国对澳门恢复行使主权，澳门特别行政区成立","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"2008 年 12 月","y":2008.95,"text":"两岸实现全面直接双向“三通”，海运直航、空运直航和直接通邮启动","unit":"d4","tag":"中国现代","volume":"v4"},{"t":"2015 年 11 月","y":2015.85,"text":"习近平与马英九在新加坡会面，这是 1949 年以来两岸领导人的首次会面","unit":"d4","tag":"中国现代","volume":"v4"}]},{"volume":"v4","unit":{"id":"d5","volume":"v4","num":5,"title":"国防建设与外交成就","short":"国防外交","years":"1949 年至今","accent":"#C05A3C","soft":"#FBECE6","tint":"#EFC9BD","icon":"🛡","tagline":"枪炮守国门，谈判交朋友：新中国怎样站稳世界舞台","intro":"1949 年，新中国在一穷二白中站起：海防线上没有几艘像样的军舰，国际舞台上处处受排挤。这一单元要回答两个问题：一支人民的军队怎样从“小米加步枪”长成钢铁长城？一个刚刚摆脱屈辱的国家，又怎样以独立自主的姿态走进世界、赢得尊重？","bigQuestion":"一个刚刚站起来的国家，靠什么守住国门，又靠什么赢得世界的尊重？","goals":["梳理人民海军、空军、导弹部队建立与发展的关键节点","说出和平共处五项原则的内容，理解其国际影响","概述恢复联合国合法席位与中美、中日关系正常化的过程","认识国防与外交相互支撑，体会中国走和平发展道路"],"keyLine":"1949 年海军空军诞生 → 1953 年五项原则提出 → 1971 年重返联合国 → 1972 年中美握手 → 2012 年航母入列"},"lessons":[{"id":"d5l1","num":15,"unit":"d5","title":"钢铁长城","years":"1949 年至今","icon":"🛡","tag":"国防","hook":"1949 年 4 月，江苏泰州白马庙，几间旧民房里升起一面红旗——人民海军的第一支部队在这里成立。当时，能开得动的舰船屈指可数。","core":"新中国在陆军基础上建立起海军、空军、导弹部队等多军种合成的国防力量。从仿制到自主研发，从近岸防御到走向深蓝，人民军队筑起保卫祖国的钢铁长城。","points":["背景：新中国成立时，海军、空军刚刚起步，装备落后，海防和空防力量薄弱，国防建设任务十分艰巨。","海军建立：1949 年 4 月，华东军区海军成立；20 世纪 50 年代，海军先后建立北海、东海、南海舰队。","海军装备：1970 年研制出第一艘核潜艇，1971 年自行研制的导弹驱逐舰入列，2012 年辽宁舰交接入列。","空军建设：1949 年 11 月，人民空军成立；1956 年仿制成功歼-5 型歼击机，此后逐步走上自主研发道路。","导弹部队：1966 年，第二炮兵部队组建；2015 年 12 月，第二炮兵更名为火箭军，成为战略威慑的核心力量。","新时代强军：2015 年军队改革，军委管总、战区主战、军种主建，组建五大战区；人民军队在抗洪、抗震、抗疫中冲锋在前。"],"terms":[["人民海军","1949 年 4 月成立于江苏泰州白马庙，是新中国第一支海上武装力量，4 月 23 日后来被定为海军建军节。"],["火箭军","我国战略导弹部队。1966 年组建时称第二炮兵，2015 年 12 月更名为火箭军，是战略威慑的核心力量。"],["辽宁舰","我国第一艘航空母舰，2012 年 9 月交接入列；此后山东舰、福建舰相继入列，海军进入航母时代。"],["五大战区","2015 年军队改革后设立东部、南部、西部、北部、中部五大战区，担负本战略方向的作战指挥任务。"]],"figures":[["毛泽东","1949 年宣告新中国将拥有强大的陆军、空军和海军，为国防建设指明方向"],["钱学森","中国航天事业奠基人，为导弹和火箭技术的发展作出开创性贡献"]],"events":[["1949.4","华东军区海军成立"],["1949.11","人民空军成立"],["1966","第二炮兵部队组建"],["2012.9","辽宁舰交接入列"],["2015.12","火箭军成立"]],"treaty":null,"significance":"国防建设为国家发展提供安全保障，也为外交谈判增添底气；人民军队由弱到强的历程，见证了新中国从站起来到强起来的历史跨越。","source":{"quote":"我们将不但有一个强大的陆军，而且有一个强大的空军和一个强大的海军。","from":"毛泽东《中国人民站起来了》（1949 年 9 月）"},"pitfall":"海军建立于 1949 年 4 月，空军建立于同年 11 月，并非同时；第二炮兵是火箭军的前身，不是另外一支部队。","memory":"四九海空先后立，六六二炮守国门；一五火箭更名号，一二航母辽宁奔。","link":"国防实力的增强，为新中国独立自主的和平外交提供了坚实后盾；腰杆硬了，谈判桌上说话才有分量。","exam":["人民海军、空军的建立时间","火箭军的由来与地位","国防建设与外交成就的关系"]},{"id":"d5l2","num":16,"unit":"d5","title":"独立自主的和平外交","years":"1949—1979 年","icon":"🕊","tag":"外交","hook":"1955 年 4 月，印尼万隆的会议厅里，一些代表正对中国代表团指指点点。轮到周恩来发言，他放下讲稿，第一句话就让会场安静了下来。","core":"新中国奉行独立自主的和平外交政策。20 世纪 50 年代，周恩来提出和平共处五项原则，在日内瓦会议和万隆会议上展现大国风度，打破了西方的孤立封锁，为中国赢得众多朋友。","points":["外交政策：新中国成立后奉行独立自主的和平外交政策，《共同纲领》对此作出明确规定，不承认旧中国签订的一切不平等条约。","建交高潮：1949 年 10 月苏联第一个承认新中国；1950 年 2 月签订《中苏友好同盟互助条约》，此后又同十几个国家建交。","五项原则：1953 年 12 月，周恩来接见印度代表团时首次提出和平共处五项原则，1954 年与印度、缅甸总理共同倡导。","日内瓦会议：1954 年召开，讨论朝鲜问题和印度支那问题。新中国第一次以世界五大国之一的身份参加国际会议，周恩来率团出席。","万隆会议：1955 年 4 月，第一次没有殖民主义国家参加的亚非会议在印尼万隆举行，周恩来提出“求同存异”，推动会议圆满成功。","历史意义：这些外交活动打破了帝国主义的孤立和封锁，增进了中国同亚非国家的团结合作，为国内建设争取了有利的国际环境。"],"terms":[["和平共处五项原则","互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处，1953 年由周恩来首次提出。"],["求同存异","周恩来在万隆会议上提出的方针。“同”指亚非国家共同的历史遭遇和发展任务，“异”指社会制度、意识形态不同。"],["万隆精神","万隆会议形成的团结、友谊、合作精神，成为亚非国家友好相处、共同发展的共同准则。"],["日内瓦会议","1954 年召开的国际会议，讨论朝鲜和印度支那问题，新中国第一次以五大国之一身份参加。"]],"figures":[["周恩来","新中国外交的奠基人，提出和平共处五项原则和“求同存异”方针"],["毛泽东","确立新中国独立自主的和平外交政策，1949 年 12 月访问苏联"],["尼赫鲁","印度总理，1954 年与周恩来共同倡导和平共处五项原则"],["吴努","缅甸总理，与周恩来共同倡导和平共处五项原则"]],"events":[["1949.10","苏联第一个同新中国建交"],["1950.2","《中苏友好同盟互助条约》签订"],["1953.12","首次提出和平共处五项原则"],["1954.4","日内瓦会议召开"],["1955.4","万隆会议召开"]],"treaty":{"name":"《中苏友好同盟互助条约》","date":"1950 年 2 月","items":["双方保证共同尽力采取一切必要措施，制止日本或其他直接间接与日本相勾结的国家的侵略","一方受到日本或与日本同盟的国家侵略而处于战争状态时，另一方尽其全力给予军事及其他援助","双方根据平等、互利、互相尊重国家主权和领土完整及不干涉内政的原则，发展经济与文化关系","双方均不缔结反对对方的任何同盟，不参加反对对方的任何集团及行动","条约有效期为 30 年"],"note":"这是新中国成立后与外国签订的第一个平等条约，对打破帝国主义的孤立封锁、巩固新生政权具有重要意义。"},"significance":"和平共处五项原则标志着新中国外交政策的成熟，被越来越多的国家接受，成为处理国与国之间关系的基本准则，至今仍具生命力。","source":{"quote":"为保障本国独立、自由和领土主权的完整，拥护国际的持久和平和各国人民间的友好合作。","from":"《中国人民政治协商会议共同纲领》（1949 年 9 月）"},"pitfall":"五项原则 1953 年首次提出、1954 年与印缅共同倡导；“求同存异”则是 1955 年万隆会议提出的，两者不可混淆。","memory":"五三首提五原则，五四日内瓦扬名；五五万隆求同异，亚非朋友携手行。","link":"50 年代的外交打开了局面，但中国仍被挡在联合国大门之外；下一课将看到 1971 年以后中国外交的重大突破。","exam":["和平共处五项原则的内容与意义","万隆会议与“求同存异”方针","新中国成立初期的外交成就"]},{"id":"d5l3","num":17,"unit":"d5","title":"外交事业的发展","years":"1971 年至今","icon":"🌐","tag":"外交","hook":"1971 年 10 月 25 日，纽约联合国总部，电子计票牌亮出结果：76 票赞成。会议厅里掌声、欢呼声响成一片，有人当场跳起舞来。","core":"1971 年恢复联合国合法席位，1972 年中美关系走向正常化、中日建交，中国外交打开新局面。改革开放后，中国形成全方位外交布局，在国际事务中发挥负责任大国作用。","points":["重返联合国：1971 年 10 月，第 26 届联大恢复中国在联合国的一切合法权利，中国重新取得安理会常任理事国席位。","中美关系：1972 年 2 月尼克松访华，双方在上海发表《中美联合公报》，关系开始走向正常化；1979 年 1 月 1 日正式建交。","中日建交：1972 年 9 月，日本首相田中角荣访华，中日两国正式建立外交关系，带动一批国家同中国建交。","全方位外交：改革开放后，中国以周边、大国、发展中国家和多边外交为重点，形成全方位、多层次、立体化的外交布局。","多边舞台：2001 年加入世界贸易组织，上海合作组织成立；中国还举办 APEC 会议、G20 杭州峰会等。","大国担当：中国提出构建人类命运共同体，参加联合国维和行动，向发展中国家提供力所能及的援助，成为维护世界和平的重要力量。"],"terms":[["安理会常任理事国","联合国安全理事会五个常任理事国之一。1971 年中国恢复在联合国的合法席位，同时恢复这一席位。"],["《中美联合公报》","1972 年 2 月尼克松访华期间在上海发表，又称《上海公报》，指出中美关系正常化符合两国利益。"],["全方位外交","改革开放后中国同各类国家全面发展关系，涵盖政治、经济、文化等领域，形成多层次、立体化布局。"],["“一带一路”","2013 年提出的共建“丝绸之路经济带”和“21 世纪海上丝绸之路”倡议，推动沿线国家合作共赢。"]],"figures":[["周恩来","新中国外交奠基人，1972 年与尼克松会谈，推动中美关系正常化"],["尼克松","美国总统，1972 年访华，中美关系开始走向正常化"],["田中角荣","日本首相，1972 年访华，实现中日邦交正常化"],["习近平","提出共建“一带一路”倡议和构建人类命运共同体理念"]],"events":[["1971.10","恢复在联合国的合法席位"],["1972.2","尼克松访华，中美关系开始正常化"],["1972.9","中日建交"],["1979.1","中美正式建交"],["2013","提出共建“一带一路”倡议"]],"treaty":null,"significance":"恢复联合国合法席位和中美、中日关系正常化，打破了西方的孤立；全方位外交为现代化建设营造了良好外部环境，也提升了中国的国际地位。","source":{"quote":"美国方面声明：美国认识到，在台湾海峡两边的所有中国人都认为只有一个中国，台湾是中国的一部分。","from":"《中美联合公报》（1972 年 2 月，上海）"},"pitfall":"1971 年是恢复联合国合法席位，不是“加入联合国”；中美 1972 年开始正常化，1979 年 1 月 1 日才正式建交。","memory":"联大七一复席位，七二握手美与日；七九元旦中美建，一带一路联四海。","link":"从“求同存异”到“人类命运共同体”，中国外交一脉相承；强大的国防与主动的外交，共同撑起新中国的国际地位。","exam":["恢复联合国合法席位的原因和意义","中美关系正常化的过程","全方位外交的主要表现"]}],"questions":[{"id":"d5q1","lesson":"d5l1","unit":"d5","type":"choice","level":1,"stem":"1949 年 4 月，新中国建立的第一支海上武装力量是","options":["华东军区海军","北海舰队","东海舰队","南海舰队"],"answer":0,"explain":"1949 年 4 月，中国人民解放军华东军区海军建立，这是新中国第一支海上武装力量。北海、东海、南海三支舰队是 20 世纪 50 年代才先后建立的。","point":"人民海军的建立"},{"id":"d5q2","lesson":"d5l1","unit":"d5","type":"choice","level":1,"stem":"2012 年 9 月交接入列、标志中国海军进入航母时代的军舰是","options":["山东舰","辽宁舰","福建舰","致远舰"],"answer":1,
