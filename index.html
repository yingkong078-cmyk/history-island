  const GEN = [{"volume":"v1","unit":{"id":"a1","volume":"v1","num":1,"title":"史前时期：原始社会与中华文明的起源","short":"文明起源","years":"约 170 万年前—约公元前 2070 年","accent":"#8A6A3A","soft":"#F3E8D5","tint":"#E2CFA9","icon":"🏺","tagline":"从元谋人的火种到良渚的玉琮，追问中华文明从哪里来","intro":"这一单元要回答一个问题：中国人从哪里来，中华文明又从哪里来。我们将走进元谋人、北京人的洞穴，看人类怎样打制石器、使用火；再走进河姆渡、半坡的村落，看农业如何让人定居下来；最后走进良渚、陶寺的古城，看阶级、国家和文明如何在各地交流中形成。没有文字的时代，答案要靠化石和遗址说话。","bigQuestion":"在没有文字的时代，我们凭什么说中华文明有五千多年？","goals":["说出元谋人、北京人、山顶洞人的时间与主要特征","比较河姆渡与半坡遗址，说明自然环境对农业的影响","用良渚、陶寺的考古发现论证中华文明五千年","理解中华文明起源多元一体的特征"],"keyLine":"元谋人点起第一堆火 → 河姆渡人种下第一株稻 → 良渚人筑起第一座城 → 禹建立第一个王朝。"},"lessons":[{"id":"a1l1","num":1,"unit":"a1","title":"远古时期的人类活动","years":"约 170 万年前—约 1 万年前","icon":"🦴","tag":"史前时期","hook":"周口店龙骨山的山洞里，一层层灰烬中埋着烧过的石块和兽骨。约七十万年前，一群人在洞口点起火堆，火光映着他们刚打制好的石器。","core":"我国境内古人类遗址分布广泛、数量众多，是人类的起源地之一。元谋人、郧县人、北京人、山顶洞人的化石与遗物表明：从打制石器到人工取火，人类在旧石器时代一步步走向现代人。","points":["我国境内的旧石器时代遗址数量多、分布广，北到辽宁、南至云南，说明中国是古人类的重要起源地之一。","约 170 万年前，云南元谋人已经能够制作工具、知道用火，是我国境内目前已知最早的古人类之一。","约 100 万年前，湖北郧县人留下头骨化石，为研究东亚早期人类的演化提供了珍贵材料。","距今约 70 万—20 万年，北京人生活在周口店龙骨山，使用打制石器，从事采集和渔猎，会使用天然火并保存火种。","距今约 3 万年，山顶洞人的模样和现代人基本相同，掌握磨光和钻孔技术，会人工取火、缝制衣服，有了爱美意识。","旧石器时代的人们过着群居生活，共同劳动、共同分享食物；工具和火的使用增强了人类改造自然的能力。"],"terms":[["旧石器时代","以打制石器为主要工具的时代，距今约 300 万年到约 1 万年前，人类靠采集、渔猎为生，过群居生活。"],["化石","古代生物的遗骸或遗迹埋藏在地层中石化形成的遗存，是研究人类起源最直接、最可靠的材料。"],["直立人","人类演化的一个阶段，元谋人、郧县人、北京人都属于直立人，已能直立行走、制作石器并使用火。"],["周口店遗址","位于北京西南周口店龙骨山，出土北京人和山顶洞人的化石、遗物，1987 年列入《世界遗产名录》。"]],"figures":[["元谋人","距今约 170 万年，云南元谋，我国境内目前已知最早的古人类之一"],["北京人","距今约 70 万—20 万年，周口店龙骨山，会使用天然火、保存火种"],["山顶洞人","距今约 3 万年，掌握磨光与钻孔技术，会人工取火、缝制衣服"],["裴文中","1929 年发现第一个北京人头盖骨化石，为人类起源研究提供了关键证据"]],"events":[["约 170 万年前","元谋人活动于今云南元谋一带"],["约 100 万年前","郧县人生活在今湖北郧阳一带"],["约 70 万—20 万年前","北京人生活在周口店龙骨山的山洞中"],["约 3 万年前","山顶洞人活动于周口店龙骨山顶部的洞穴"]],"treaty":null,"significance":"这些遗址证明中国是人类起源的重要地区之一。从直立行走到打制石器，从使用天然火到人工取火，体质进步与文化积累为农业的出现和文明的诞生准备了条件。","source":{"quote":"上古之世，人民少而禽兽众，人民不胜禽兽虫蛇。","from":"《韩非子·五蠹》（战国）"},"pitfall":"元谋人是“我国境内目前已知最早的古人类之一”，不能简写成“最早的人类”；使用天然火的是北京人，人工取火的是山顶洞人。","memory":"元谋百七、郧县百万、北京七十万，山顶洞人三万年：磨光钻孔会取火。","link":"本课是初中历史的起点：旧石器时代的人类活动 → 下一课农业出现、聚落形成 → 再下一课早期国家与文明起源。","exam":["元谋人、北京人的时间、地点与地位","北京人使用天然火与山顶洞人人工取火的区别","化石、遗址在人类起源研究中的作用"]},{"id":"a1l2","num":2,"unit":"a1","title":"原始农业与史前社会","years":"约 1 万年前—约公元前 3500 年","icon":"🌾","tag":"史前时期","hook":"一粒炭化的稻谷躺在浙江浦江上山遗址的泥土里，距今约一万年。它比任何文字都古老，却清楚告诉后人：这块土地上的人，开始种田了。","core":"距今约一万年，长江中下游率先栽培水稻，黄河流域培育出粟和黍。农业、家畜饲养、磨制石器、聚落和陶器结伴而来，人类由采集渔猎转向定居农耕，中华文明的物质基础由此奠定。","points":["距今约一万年，长江中下游的先民开始栽培水稻，北方黄河流域则培育出粟和黍，中国是世界农业起源地之一。","原始农业兴起的标志是农作物种植、家畜饲养、聚落形成，以及磨制石器和陶器的使用，人类从此定居生活。","河姆渡遗址距今约 7000 年，位于浙江余姚：种植水稻，使用骨耜，住干栏式建筑，还挖有木结构水井。","半坡遗址距今约 6000 年，位于陕西西安：种植粟，住半地穴式圆形房屋，制作彩陶，已经会纺线织布。","仰韶文化（约 7000—5000 年前，黄河中游）以彩陶著称；大汶口文化晚期墓葬随葬品悬殊，表明出现了贫富分化。","农业发展使人口增加、聚落扩大，剩余产品和私有制随之出现，为阶级分化和早期国家的产生创造了条件。"],"terms":[["新石器时代","以磨制石器为主要工具的时代，距今约 1 万年到约 4000 年前，农业、畜牧业和制陶出现，人类过上定居生活。"],["干栏式建筑","河姆渡人的房屋，底层架空、上层住人，可以防潮防虫，适应南方潮湿多雨的环境。"],["彩陶","在陶坯上用矿物颜料绘画后烧制的陶器，仰韶文化的半坡人面鱼纹彩陶盆是代表作。"],["聚落","原始人定居生活形成的村落，房屋、窖穴、墓葬等遗迹集中分布，是农业定居生活的直接证据。"]],"figures":[["河姆渡人","距今约 7000 年，浙江余姚，种植水稻、住干栏式建筑、使用骨耜"],["半坡人","距今约 6000 年，陕西西安，种植粟、制作彩陶、纺线织布"],["神农氏","传说中教民农耕、尝百草的人物，是农业起源在古书中的集体记忆"]],"events":[["约 1 万年前","长江中下游出现稻作农业，北方开始栽培粟和黍"],["约 9000—7800 年前","河南舞阳贾湖遗址留下骨笛和契刻符号"],["约 7000 年前","河姆渡聚落兴盛，种植水稻、建造干栏式房屋"],["约 6000 年前","半坡聚落形成，制作彩陶、种植粟"],["约 5000 年前","大汶口文化晚期墓葬随葬品差别悬殊，出现贫富分化"]],"treaty":null,"significance":"农业起源被称为“农业革命”。定居生活、剩余产品和社会分工随之出现，聚落逐步发展为早期国家，中华文明的多元起源有了坚实的物质基础。","source":{"quote":"神农氏作，斫木为耜，揉木为耒，耒耨之利，以教天下。","from":"《周易·系辞下》（战国至汉初）"},"pitfall":"河姆渡人种水稻、住干栏式房屋，半坡人种粟、住半地穴式房屋，不要张冠李戴；水稻是中国本土栽培的，不是从外传入。","memory":"南稻北粟一万年，河姆渡干栏、半坡穴；磨石制陶又养畜，定居聚落文明先。","link":"上一课旧石器时代的人类活动 → 本课农业出现、定居聚落 → 下一课良渚、陶寺等早期国家与文明起源。","exam":["河姆渡遗址与半坡遗址的对比","原始农业兴起的主要标志","农业起源对文明诞生的作用"]},{"id":"a1l3","num":3,"unit":"a1","title":"中华文明的起源","years":"约公元前 5000—前 2070 年","icon":"🏛","tag":"史前时期","hook":"浙江余杭的良渚古城，城墙厚达几十米，城外水坝纵横。五千年前的先民在这里筑城、治水、祭祀，也把精致的玉琮随葬进贵族的大墓。","core":"距今约五千年，长江下游的良渚古城与黄河中游的陶寺古城已出现宫殿、城墙、礼器和明显的阶级分化，表明中华大地已迈入文明社会。中华文明的起源呈现多元一体的特征。","points":["良渚古城（约 5300—4300 年前，浙江余杭）有宫殿区、内外城墙和大型水利系统，贵族墓随葬大量玉琮、玉璧。","陶寺古城（约 4300—4000 年前，山西襄汾）发现宫殿区、墓葬和观象台，随葬品差别悬殊，被认为是尧都平阳的候选。","牛河梁（红山文化，约 5500—5000 年前，辽宁朝阳）有祭坛、女神庙和积石冢，出土玉猪龙，说明北方已出现文明因素。","炎帝、黄帝被后人尊为中华民族的人文初祖，炎黄部落联盟在涿鹿之战中打败蚩尤，华夏族逐渐形成。","尧、舜、禹时期实行禅让制，把联盟首领的位子传给贤德之人；禹治理洪水，得到各部落的敬仰。","各地遗址满天星斗又相互交流，最终汇聚成以中原为核心、多元一体的中华文明格局。"],"terms":[["良渚古城","距今约 5300—4300 年，位于浙江余杭，有宫殿区、内外城墙和水利系统，是实证中华五千年文明史的圣地。"],["玉琮","良渚文化的代表性玉器，内圆外方，刻有神人兽面纹，是祭祀用的礼器，象征持有者的身份与权力。"],["禅让制","尧、舜、禹时期推举贤德之人担任联盟首领的做法，传说尧传舜、舜传禹，反映原始社会末期的推举传统。"],["人文初祖","后人对炎帝和黄帝的尊称。传说他们教民农耕、制陶、造舟车、创文字，被视为中华民族的共同祖先。"]],"figures":[["黄帝","传说与炎帝结盟打败蚩尤，被尊为中华民族的人文初祖"],["炎帝","传说教民农耕、尝百草，与黄帝并称人文初祖"],["大禹","治理洪水，在外十三年，“三过家门而不入”，后建立夏朝"],["尧、舜","传说中的联盟首领，以禅让方式把位子传给贤德之人"]],"events":[["约 5500—5000 年前","红山文化牛河梁遗址筑起祭坛、女神庙和积石冢"],["约 5300—4300 年前","良渚古城筑城治水，玉礼器随葬于贵族大墓"],["约 4300—4000 年前","陶寺古城出现宫殿、大墓和观象台"],["约公元前 2070 年","禹建立夏朝，中国进入王朝时代"]],"treaty":null,"significance":"良渚、陶寺等遗址把中华文明的形成时间上推到距今五千年左右。多元起源、相互交流、最终汇聚，是中华文明连绵不断、从未中断的重要原因。","source":{"quote":"轩辕之时，神农氏世衰。诸侯相侵伐，暴虐百姓，而神农氏弗能征。","from":"《史记·五帝本纪》（西汉·司马迁）"},"pitfall":"良渚古城在长江下游的浙江，陶寺古城在黄河中游的山西；炎黄、尧舜禹属于传说，要与考古发现区分，不能当作确凿信史。","memory":"良渚玉琮陶寺观象，五千年前已有城邦；炎黄涿鹿华夏成，尧舜禅让禹治江。","link":"上一课农业定居 → 本课早期国家与文明起源 → 下一课夏商周王朝更替，中华文明进入青铜时代。","exam":["良渚古城遗址的历史价值","中华文明起源多元一体的特征","禅让制与传说时代的历史信息"]}],"questions":[{"id":"a1q1","lesson":"a1l1","unit":"a1","type":"choice","level":1,"stem":"距今约 170 万年，发现于云南、是我国境内目前已知最早的古人类之一的是","options":["北京人","元谋人","山顶洞人","郧县人"],"answer":1,"explain":"元谋人距今约 170 万年，发现于云南元谋。北京人距今约 70 万—20 万年，山顶洞人距今约 3 万年，郧县人距今约 100 万年。","point":"元谋人的时间与地点"},{"id":"a1q2","lesson":"a1l1","unit":"a1","type":"choice","level":2,"stem":"与北京人相比，山顶洞人最明显的进步是","options":["开始直立行走","会制作打制石器","掌握磨光和钻孔技术，会人工取火","开始过群居生活"],"answer":2,"explain":"北京人使用打制石器和天然火；山顶洞人掌握磨光、钻孔技术，会人工取火、缝制衣服。直立行走、打制石器、群居生活北京人已经具备，不是“进步”之处。","point":"北京人与山顶洞人的比较"},{"id":"a1q3","lesson":"a1l1","unit":"a1","type":"order","level":2,"stem":"按出现时间先后排列我国境内的远古人类","items":["元谋人生活于云南元谋","郧县人留下头骨化石","北京人生活在周口店龙骨山","山顶洞人活动于龙骨山顶洞穴"],"explain":"元谋人约 170 万年前 → 郧县人约 100 万年前 → 北京人约 70 万—20 万年前 → 山顶洞人约 3 万年前。","point":"我国境内古人类的先后"},{"id":"a1q4","lesson":"a1l1","unit":"a1","type":"fill","level":2,"stem":"北京人遗址位于北京西南的______龙骨山，是迄今所知世界上内涵最丰富、材料最齐全的直立人遗址之一。","answer":["周口店","北京周口店"],"explain":"周口店龙骨山遗址出土了大量北京人化石、石器和用火遗迹，1987 年被列入《世界遗产名录》。","point":"北京人遗址的位置"},{"id":"a1q5","lesson":"a1l2","unit":"a1","type":"choice","level":1,"stem":"距今约 7000 年，种植水稻、使用骨耜、居住在干栏式建筑中的原始居民是","options":["半坡人","河姆渡人","北京人","山顶洞人"],"answer":1,"explain":"河姆渡遗址位于浙江余姚，距今约 7000 年，出土稻谷遗存和骨耜，房屋为干栏式。半坡人种粟、住半地穴式房屋。","point":"河姆渡遗址"},{"id":"a1q6","lesson":"a1l2","unit":"a1","type":"choice","level":2,"stem":"半坡人建造半地穴式圆形房屋，主要是为了适应","options":["南方潮湿多雨、虫蛇众多的环境","黄河流域干燥寒冷、风沙较大的环境","便于在水上出行捕鱼","便于在山坡上开凿窑洞"],"answer":1,"explain":"半坡遗址在黄河流域，气候干燥寒冷，半地穴式房屋一半在地下，可以保暖防风沙。干栏式建筑则是河姆渡人适应南方潮湿环境的创造。","point":"半坡人的房屋与自然环境"},{"id":"a1q7","lesson":"a1l2","unit":"a1","type":"match","level":2,"stem":"把下列史前遗址与其典型遗存配对","pairs":[["河姆渡遗址","干栏式建筑"],["半坡遗址","人面鱼纹彩陶盆"],["贾湖遗址","骨笛"],["大汶口文化","随葬品悬殊的墓葬"]],"explain":"河姆渡人住干栏式房屋；半坡人制作人面鱼纹彩陶盆；贾湖遗址出土距今约八九千年的骨笛；大汶口文化晚期墓葬随葬品差别悬殊，说明出现贫富分化。","point":"史前遗址的典型遗存"},{"id":"a1q8","lesson":"a1l2","unit":"a1","type":"fill","level":2,"stem":"原始农业兴起的重要标志有：农作物种植、家畜饲养、聚落的形成，以及______和陶器的使用。","answer":["磨制石器","磨制石器的使用"],"explain":"原始农业兴起的标志包括农作物种植、家畜饲养、聚落、磨制石器和陶器，其中磨制石器是新石器时代的基本特征。","point":"原始农业兴起的标志"},{"id":"a1q9","lesson":"a1l3","unit":"a1","type":"choice","level":1,"stem":"2019 年被列入《世界遗产名录》、被视为实证中华五千年文明史圣地的遗址是","options":["半坡遗址","良渚古城遗址","陶寺古城遗址","牛河梁遗址"],"answer":1,"explain":"良渚古城遗址位于浙江余杭，距今约 5300—4300 年，有宫殿区、内外城墙和水利系统，2019 年列入《世界遗产名录》。","point":"良渚古城遗址"},{"id":"a1q10","lesson":"a1l3","unit":"a1","type":"choice","level":3,"stem":"良渚古城内有宫殿区、内城和外城，贵族大墓随葬大量玉琮、玉璧，平民墓几乎没有随葬品。这一现象最能说明当时","options":["已经普遍使用铁制农具","已经出现阶级分化和国家权力","已经建立统一的多民族国家","已经实行科举选官制度"],"answer":1,"explain":"宫殿、城墙说明公共权力的存在，随葬品悬殊说明阶级分化。铁器普及在春秋战国，统一多民族国家建立于秦朝，科举制创立于隋朝，均与良渚无关。","point":"良渚考古发现的历史信息"},{"id":"a1q11","lesson":"a1l3","unit":"a1","type":"order","level":2,"stem":"按时间先后排列下列早期文明的代表性遗存与事件","items":["牛河梁遗址筑起祭坛和积石冢","良渚古城筑城治水","陶寺古城出现宫殿与观象台","禹建立夏朝"],"explain":"牛河梁约 5500—5000 年前 → 良渚约 5300—4300 年前 → 陶寺约 4300—4000 年前 → 约公元前 2070 年禹建立夏朝。","point":"中华文明起源的进程"},{"id":"a1q12","lesson":"a1l3","unit":"a1","type":"choice","level":2,"stem":"传说尧年老时把联盟首领的位子传给舜，舜年老时又传给治水有功的禹。这种推举贤德之人担任首领的做法被称为","options":["世袭制","分封制","禅让制","郡县制"],"answer":2,"explain":"禅让制是尧、舜、禹时期推举贤德之人担任联盟首领的做法。世袭制自启开始，分封制盛行于西周，郡县制推广于秦朝。","point":"禅让制"}],"timeline":[{"t":"约 170 万年前","y":-1700000,"text":"元谋人活动于今云南元谋一带，会制作工具、知道用火","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 100 万年前","y":-1000000,"text":"郧县人生活在今湖北郧阳一带，留下头骨化石","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 70 万—20 万年前","y":-700000,"text":"北京人生活在周口店龙骨山，使用打制石器和天然火","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 3 万年前","y":-30000,"text":"山顶洞人掌握磨光、钻孔技术，会人工取火","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 1 万年前","y":-10000,"text":"长江中下游栽培水稻，北方培育粟和黍，原始农业兴起","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 7000 年前","y":-7000,"text":"河姆渡聚落兴盛，种植水稻、建造干栏式房屋","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 6000 年前","y":-6000,"text":"半坡聚落形成，种植粟、制作彩陶","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 5300—4300 年前","y":-5300,"text":"良渚古城筑城治水，出现玉礼器和阶级分化","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约 4300—4000 年前","y":-4300,"text":"陶寺古城出现宫殿、大墓和观象台","unit":"a1","tag":"中国古代","volume":"v1"},{"t":"约公元前 2070 年","y":-2070,"text":"禹建立夏朝，中国进入王朝时代","unit":"a1","tag":"中国古代","volume":"v1"}]},{"volume":"v1","unit":{"id":"a2","volume":"v1","num":2,"title":"夏商周时期：奴隶制王朝的更替和向封建社会的过渡","short":"青铜时代","years":"约公元前 2070—前 221 年","accent":"#9A6B3F","soft":"#F4E9D8","tint":"#E3CFA8","icon":"⚱","tagline":"青铜礼制维系夏商周，变法争鸣推动中国走向封建社会。","intro":"约公元前 2070 年，禹建立夏朝，中国进入王朝时代。此后一千八百年里，青铜礼器标记着等级，分封制维系着周天子的天下。春秋战国，铁犁牛耕把旧秩序犁开：诸侯争霸、变法图强、百家争鸣。这个单元要回答的是——中国如何从奴隶社会走向封建社会，又如何在动荡中孕育出影响两千年的制度与思想。","bigQuestion":"为什么春秋战国的动荡，反而催生了中国历史上第一次思想文化高峰和影响深远的制度变革？","goals":["梳理夏商西周更替脉络，理解分封制与礼乐秩序的作用。","说明铁犁牛耕带来的变化，概述商鞅变法的内容与作用。","比较诸子主张，理解百家争鸣出现的原因与深远影响。","认识甲骨文、青铜器和《诗经》，感受夏商周文化成就。"],"keyLine":"禹建夏、汤灭夏、武王伐纣立西周；平王东迁后诸侯争霸，商鞅变法图强，百家争鸣定下中国思想底色。"},"lessons":[{"id":"a2l1","num":4,"unit":"a2","title":"夏商西周王朝的更替","years":"约前 2070—前 771 年","icon":"👑","tag":"青铜时代","hook":"河南偃师的二里头遗址，出土了中国最早的青铜礼器群。约公元前 2070 年，禹建立夏朝，中国从此进入王朝时代。此后一千三百年，王朝更替的钟声一遍遍响起。","core":"约公元前 2070 年禹建立夏朝；禹死后其子启继位，世袭制取代禅让制。约公元前 1600 年商汤灭夏，公元前 1046 年周武王灭商建西周。西周以分封制、礼乐制维系统治，公元前 771 年犬戎攻破镐京，西周灭亡。","points":["夏朝建立：约公元前 2070 年，禹建立夏朝，这是中国历史上第一个奴隶制王朝，标志着中国早期国家的产生。","世袭制代替禅让制：禹死后其子启继位，王位在一家一姓中传承，“公天下”变为“家天下”。","商朝兴亡：约公元前 1600 年商汤灭夏；商王盘庚迁殷后政局稳定；商纣暴虐，约公元前 1046 年牧野之战中商军倒戈，商朝灭亡。","西周分封制：周王把土地和人民分给宗亲、功臣，封他们为诸侯；诸侯须服从周王、进献贡赋、随从作战，分封制稳定了周初统治。","西周衰亡：公元前 841 年国人暴动，周厉王出逃；公元前 771 年犬戎攻破镐京，周幽王被杀，西周灭亡。","历史地位：夏商西周是中国奴隶制社会的形成、发展与鼎盛时期，青铜礼器和分封秩序共同构成早期国家的政治文明。"],"terms":[["世袭制","王位由父传子、兄传弟，在一家一姓中世代传承的制度。禹死后启继位，世袭制取代了禅让制。"],["分封制","西周周王把土地和人民分给宗亲、功臣等，封为诸侯。诸侯须服从周王、进献贡赋、随从作战。"],["井田制","西周时期的奴隶制土地制度，土地归周王所有，分配给各级贵族，奴隶集体耕作，产品归贵族。"],["牧野之战","约公元前 1046 年，周武王联合各部落在牧野大败商军，商军阵前倒戈，商朝灭亡。"]],"figures":[["禹","治水有功，建立夏朝"],["商汤","灭夏建商，任用伊尹为相"],["周武王","牧野之战灭商，建立西周"],["周厉王","暴虐无道，引发国人暴动"]],"events":[["约前 2070 年","禹建立夏朝"],["约前 1600 年","商汤灭夏，商朝建立"],["约前 1300 年","盘庚迁殷"],["前 1046 年","牧野之战，西周建立"],["前 771 年","犬戎攻破镐京，西周灭亡"]],"treaty":null,"significance":"夏朝是中国历史上第一个王朝，世袭制由此确立；商周青铜礼器与甲骨文留下可信的文明印记；分封制使周王朝的统治延伸到广大地区，也埋下诸侯坐大的隐患。","source":{"quote":"周公吊二叔之不咸，故封建亲戚，以藩屏周。","from":"《左传·僖公二十四年》（春秋）"},"pitfall":"夏朝的建立者是禹，不是启；启的贡献是继位后确立世袭制。西周亡于公元前 771 年犬戎攻破镐京，不是公元前 770 年平王东迁。","memory":"夏禹商汤周武王，启开世袭盘庚迁；分封亲戚以屏周，七七一犬戎破镐京。","link":"本课结束于西周灭亡，下一课东迁的周天子再也管不住诸侯，中国进入春秋争霸。","exam":["夏商西周更替的时序与都城","分封制的内容和作用","世袭制取代禅让制的意义"]},{"id":"a2l2","num":5,"unit":"a2","title":"动荡变化中的春秋时期","years":"前 770—前 476 年","icon":"🐎","tag":"春秋","hook":"公元前 770 年，周平王把都城从镐京东迁到洛邑。车队走过荒芜的王畿，天子的号令再也传不出百里。一个“礼乐征伐自诸侯出”的时代开始了。","core":"公元前 770 年平王东迁，东周开始。春秋时期铁制农具和牛耕出现，生产力提高，周王室衰微，诸侯以“尊王攘夷”为口号争霸。争霸战争带来灾难，也促进了局部统一和民族交融。","points":["政治变动：公元前 770 年周平王东迁洛邑，史称东周。周王室衰微，分封制、宗法制遭到破坏，出现“礼乐征伐自诸侯出”的局面。","经济变动：春秋后期，铁制农具和牛耕开始使用并逐步推广，生产力水平提高，井田制逐步瓦解，私田大量出现。","齐桓公首霸：任用管仲改革，发展生产、改革军制，以“尊王攘夷”为口号，公元前 651 年葵丘会盟，成为春秋第一个霸主。","晋楚争霸：公元前 632 年城濮之战，晋文公“退避三舍”大败楚军；此后楚庄王问鼎中原，诸侯争霸持续百年。","争霸影响：战争给人民带来灾难，但客观上加快了统一趋势，促进了中原与周边各族的交往交融。","社会变化：一些诸侯国为在争霸中取胜，纷纷改革内政、发展生产，开始在新占领区设立县、郡，世卿世禄制受到冲击。"],"terms":[["尊王攘夷","尊奉周天子，抵御周边少数民族的进攻。齐桓公借此口号号令诸侯，取得霸主地位。"],["葵丘会盟","公元前 651 年，齐桓公在葵丘召集诸侯会盟，周天子派人参加，齐桓公成为春秋第一个霸主。"],["退避三舍","城濮之战中，晋文公履行当年承诺，主动后退九十里（三舍），诱敌深入，大败楚军。"],["铁犁牛耕","春秋后期出现的铁制农具和牛耕技术，大大提高农业生产效率，是春秋战国社会变革的根本动力。"]],"figures":[["齐桓公","任用管仲改革，首成霸主"],["管仲","改革内政军制，助齐桓公称霸"],["晋文公","城濮之战败楚，称霸中原"],["楚庄王","问鼎中原，邲之战胜晋"]],"events":[["前 770 年","平王东迁，东周开始"],["前 685 年","齐桓公即位，任用管仲"],["前 651 年","葵丘会盟，齐桓公称霸"],["前 632 年","城濮之战，晋文公称霸"]],"treaty":null,"significance":"春秋时期是奴隶社会向封建社会过渡的开端：铁犁牛耕动摇井田制，王室衰微打破旧秩序，争霸战争在破坏中推动统一与民族交融。","source":{"quote":"管仲相桓公，霸诸侯，一匡天下，民到于今受其赐。","from":"《论语·宪问》（春秋）"},"pitfall":"东周开始的标志是公元前 770 年平王东迁，不是公元前 771 年西周灭亡；春秋第一个霸主是齐桓公，不是晋文公。","memory":"前七七〇平王迁，铁犁牛耕井田变；尊王攘夷齐桓公，葵丘会盟首称霸。","link":"春秋的争霸与改革让旧制度裂开缝隙；下一课战国七雄的兼并战争，把变革推向变法的深水区。","exam":["春秋争霸的原因与影响","铁犁牛耕出现的历史意义","齐桓公、晋文公称霸的史实"]},{"id":"a2l3","num":6,"unit":"a2","title":"战国时期的社会变革","years":"前 475—前 221 年","icon":"⚔","tag":"战国","hook":"公元前 356 年，秦国的都城里贴出变法法令：斩敌首者赐爵，耕织多者免役，贵族无功不得世禄。反对声四起，商鞅却在市场南门立下一根木头，谁能搬到北门，赏十金。","core":"战国时期，铁农具和牛耕进一步推广，各国为富国强兵纷纷变法。公元前 356 年秦孝公任用商鞅变法，废除井田制、奖励耕战、推行县制，使秦国国力大增，为秦统一六国奠定基础。","points":["战国格局：晋国被韩、赵、魏三家瓜分，齐国政权被田氏取代，形成齐、楚、燕、韩、赵、魏、秦“战国七雄”并立的局面。","兼并战争：战争规模扩大，桂陵之战、马陵之战之后，公元前 260 年长平之战秦大败赵军，东方六国再无力抗秦。","变法背景：铁农具和牛耕推广，井田制瓦解，新兴地主阶级力量壮大，各国为在兼并战争中取胜纷纷变法。","商鞅变法（公元前 356 年）：废除井田制，允许土地自由买卖；奖励耕织；奖励军功；推行县制；统一度量衡；严明法度。","变法作用：秦国国力大为增强，军队战斗力提高，成为最强盛的诸侯国；商鞅本人被车裂，但新法继续推行。","水利工程：公元前 256 年，秦国蜀郡太守李冰主持修建都江堰，发挥防洪、灌溉、水运等作用，使成都平原成为“天府之国”。"],"terms":[["战国七雄","齐、楚、燕、韩、赵、魏、秦七个强国。它们由春秋争霸演变为兼并战争，最终由秦完成统一。"],["商鞅变法","公元前 356 年秦孝公任用商鞅推行的改革，涉及土地、军功、行政、度量衡等方面，使秦国迅速富强。"],["县制","商鞅变法时确立，由国君直接派官吏治理地方，加强中央对地方的控制，是后来郡县制的雏形。"],["都江堰","公元前 256 年李冰主持修建的水利工程，位于岷江上，至今仍发挥防洪灌溉作用。"]],"figures":[["商鞅","在秦孝公支持下变法，奠定秦国富强基础"],["秦孝公","任用商鞅变法，图强图霸"],["李冰","主持修建都江堰"],["赵括","长平之战中纸上谈兵，赵军大败"]],"events":[["前 475 年","战国时期开始"],["前 356 年","商鞅在秦国开始变法"],["前 260 年","长平之战，秦大败赵国"],["前 256 年","李冰主持修建都江堰"]],"treaty":null,"significance":"商鞅变法使秦国实现富国强兵，是战国时期最彻底的一次变法；各国变法推动奴隶制瓦解、封建制度确立，中国历史由此进入封建社会。","source":{"quote":"治世不一道，便国不法古。汤武不循古而王，夏殷不易礼而亡。","from":"《史记·商君列传》（西汉·司马迁）"},"pitfall":"商鞅变法开始于公元前 356 年，支持者是秦孝公；商鞅后被杀，但变法措施并未废止。长平之战在公元前 260 年，不是秦统一之年。","memory":"铁犁牛耕井田崩，七雄兼并战不停；三五六、商鞅变，奖励耕战秦最强。","link":"战国变法让秦国一家独强，也为下一课“百家争鸣”提供了社会土壤——旧秩序崩塌，人们不得不重新思考怎样治国。","exam":["商鞅变法的内容与作用","战国七雄与兼并战争","都江堰的修建与作用"]},{"id":"a2l4","num":7,"unit":"a2","title":"百家争鸣","years":"前 770—前 221 年","icon":"📜","tag":"思想","hook":"曲阜的杏树下，一位老人每天讲学，弟子三千，不问出身贵贱。他说“有教无类”。同一时代，有人主张兼爱非攻，有人主张严刑峻法——中国思想史上最热闹的一场辩论开始了。","core":"春秋战国社会大变革，士阶层活跃，各国招贤纳士，私学兴起，形成儒家、道家、墨家、法家等学派。各家围绕治国与人生展开争论，史称“百家争鸣”，是中国古代第一次思想文化发展的高峰。","points":["背景：铁犁牛耕推动经济发展，分封制、宗法制瓦解，诸侯争霸需要人才；私学兴起，学术下移，“士”阶层活跃。","老子：春秋后期楚国人，道家学派创始人。主张顺应自然、“无为而治”，认为事物有对立面并可相互转化，著作《老子》。","孔子：春秋后期鲁国人，儒家创始人。核心思想是“仁”，主张“为政以德”；创办私学，主张“有教无类”，言论辑成《论语》。","战国儒家：孟子主张“仁政”，提出“民为贵，社稷次之，君为轻”；荀子主张“礼治”，强调“制天命而用之”。","墨家与法家：墨子主张“兼爱”“非攻”，提倡节俭；韩非主张以法治国，建立中央集权专制统治，其学说受到秦王嬴政赏识。","影响：百家争鸣为中国古代文化发展奠定基础，儒家思想后来成为封建社会的正统思想，法家思想为秦统一和中央集权提供了理论依据。"],"terms":[["百家争鸣","春秋战国时期各学派围绕社会问题著书立说、相互辩论的思想繁荣局面，是中国古代第一次思想文化高峰。"],["仁","孔子思想的核心，意为“爱人”，主张统治者体贴民情、为政以德，人与人之间相互尊重。"],["无为而治","老子和庄子主张的治国思想，要求顺应自然、不妄加干涉，让百姓休养生息。"],["兼爱非攻","墨子的主张：人与人互爱互利，反对不义战争，反映了下层劳动者的愿望。"]],"figures":[["孔子","儒家创始人，主张“仁”和“为政以德”"],["老子","道家创始人，主张顺应自然、无为而治"],["孟子","主张“仁政”，提出民贵君轻"],["韩非","法家代表，主张以法治国、中央集权"]],"events":[["春秋后期","孔子创办私学，创立儒家学派"],["春秋后期","老子著《老子》（《道德经》）"],["战国时期","墨子提出“兼爱”“非攻”"],["战国后期","韩非集法家之大成，主张以法治国"]],"treaty":null,"significance":"百家争鸣是中国古代第一次思想文化发展的高峰，奠定了中国古代思想文化的基础；儒家思想经后世改造成为正统思想，法家、道家、墨家的主张也深刻影响了中国政治与社会。","source":{"quote":"为政以德，譬如北辰，居其所而众星共之。","from":"《论语·为政》（春秋）"},"pitfall":"孔子是春秋后期鲁国人，儒家学派创始人，不是宗教创始人；老子是道家创始人，不是儒家；主张以法治国的是韩非，不是孔子。","memory":"孔子讲仁老无为，墨子兼爱韩非法；孟子仁政荀子礼，百家争鸣定基调。","link":"百家争鸣是春秋战国社会变革在思想上的回响；此后儒家与法家轮流登场，塑造了秦汉以后两千年的治国思路。","exam":["孔子、老子的主要主张","百家争鸣的背景与影响","儒、墨、道、法四家主张比较"]},{"id":"a2l5","num":8,"unit":"a2","title":"夏商周时期的科技与文化","years":"约前 2070—前 221 年","icon":"🔭","tag":"文化","hook":"1899 年，北京的药铺里，王懿荣在一味叫“龙骨”的中药上发现了刻痕。那些刻痕，是三千多年前商王占卜的记录——甲骨文，就这样被认了出来。","core":"夏商周时期天文历法、医学成就突出；商朝甲骨文是我国已发现的年代最早、体系较为完整的文字，我国有文字可考的历史从商朝开始；青铜铸造业高度发达，《诗经》和“楚辞”奠定了中国文学的两大传统。","points":["天文历法：商朝甲骨文中有日食、月食记录；《诗经》保存了我国第一次有确切日期的日食记录；战国时期已把一年分为二十四节气。","医学：相传神农尝百草；战国名医扁鹊总结出望、闻、问、切四诊法；《黄帝内经》战国问世、西汉编定，是现存较早的医学文献。","文字：商朝刻在龟甲、兽骨上的文字叫甲骨文，我国有文字可考的历史从商朝开始。","甲骨文是我国已发现的年代最早、体系较为完整的文字，使用象形、指事、会意、形声等造字法；西周青铜器铭文称金文。","青铜器：商周青铜铸造业发达，后母戊鼎是迄今世界上出土最重的青铜器，四羊方尊造型精美，三星堆青铜面具风格独特。","文学：《诗经》是我国第一部诗歌总集，收录西周初年至春秋中叶诗歌 305 篇，分风、雅、颂三部分；屈原《离骚》是楚辞代表作。"],"terms":[["甲骨文","商朝刻在龟甲和兽骨上的文字，主要用于占卜记事，是我国已发现的年代最早、体系较为完整的文字。"],["金文","铸刻在青铜器上的文字，也叫铭文。西周金文篇幅渐长，是研究西周历史的重要资料。"],["四诊法","望、闻、问、切四种诊断疾病的方法，由战国名医扁鹊总结，成为中医的传统诊断方法。"],["《诗经》","我国第一部诗歌总集，收录西周初年至春秋中叶的诗歌 305 篇，分为风、雅、颂三部分。"]],"figures":[["扁鹊","战国名医，总结望、闻、问、切四诊法"],["屈原","战国楚国诗人，创作《离骚》"],["王懿荣","清代官员，首次识别甲骨文"]],"events":[["商朝后期","甲骨文大量用于占卜记事"],["前 776 年","《诗经》记载我国第一次有确切日期的日食"],["战国时期","扁鹊总结望、闻、问、切四诊法"],["战国后期","屈原创作《离骚》"]],"treaty":null,"significance":"甲骨文使我国有文字可考的历史从商朝开始；青铜礼器与金文记录了早期国家的制度与信仰；《诗经》《离骚》开创了中国诗歌的现实主义与浪漫主义传统，夏商周文化成为中华文明的重要源头。","source":{"quote":"十月之交，朔月辛卯，日有食之。","from":"《诗经·小雅·十月之交》（西周）"},"pitfall":"甲骨文是商朝刻在龟甲兽骨上的文字，不是青铜器铭文；我国有文字可考的历史从商朝开始，不是从夏朝开始。","memory":"商有甲骨周有金，后母戊鼎世最重；《诗经》三百风雅颂，屈子《离骚》楚辞兴。","link":"本课把夏商西周的礼器、文字、诗歌串成文明的证据，也为下一单元秦汉统一后的文化高峰埋下伏笔。","exam":["甲骨文的地位与造字方法","青铜器的代表与历史价值","《诗经》《离骚》的文学地位"]}],"questions":[{"id":"a2q1","lesson":"a2l1","unit":"a2","type":"choice","level":1,"stem":"中国历史上第一个王朝——夏朝的建立者是","options":["启","禹","汤","周武王"],"answer":1,"explain":"约公元前 2070 年禹建立夏朝。启是禹的儿子，继位后确立世袭制；汤灭夏建立商朝；周武王灭商建立西周。","point":"夏朝的建立"},{"id":"a2q2","lesson":"a2l1","unit":"a2","type":"choice","level":1,"stem":"西周为巩固统治，把土地和人民分给宗亲、功臣，封他们为诸侯，这一制度是","options":["禅让制","世袭制","分封制","井田制"],"answer":2,"explain":"分封制是西周的地方管理制度，诸侯须服从周王、进献贡赋、随从作战。禅让制是尧舜禹时期推举首领的办法；世袭制是王位传承制度；井田制是土地制度。","point":"分封制"},{"id":"a2q3","lesson":"a2l1","unit":"a2","type":"order","level":2,"stem":"按时间先后排列夏商西周时期的主要事件","items":["禹建立夏朝","商汤灭夏","盘庚迁殷","牧野之战","犬戎攻破镐京"],"explain":"约公元前 2070 年禹建夏 → 约公元前 1600 年商汤灭夏 → 约公元前 1300 年盘庚迁殷 → 公元前 1046 年牧野之战 → 公元前 771 年犬戎攻破镐京，西周灭亡。","point":"夏商西周的更替"},{"id":"a2q4","lesson":"a2l1","unit":"a2","type":"fill","level":2,"stem":"西周时期，周王把土地和人民分给宗亲、功臣，封他们为诸侯，这种制度叫______。","answer":["分封制","封邦建国"],"explain":"西周通过分封制控制广大地区，诸侯要服从周王命令、向周王进献贡赋、服从周王调兵。","point":"分封制"},{"id":"a2q5","lesson":"a2l2","unit":"a2","type":"choice","level":1,"stem":"春秋时期第一个称霸中原的诸侯是","options":["晋文公","齐桓公","楚庄王","秦穆公"],"answer":1,"explain":"齐桓公任用管仲改革，以“尊王攘夷”为口号，公元前 651 年葵丘会盟，成为春秋第一个霸主。晋文公在城濮之战后称霸，晚于齐桓公。","point":"春秋争霸"},{"id":"a2q6","lesson":"a2l2","unit":"a2","type":"choice","level":2,"stem":"春秋后期，推动社会生产力发展的关键因素是","options":["铁制农具和牛耕的使用","都江堰的修建","商鞅变法的推行","分封制的确立"],"answer":0,"explain":"春秋后期铁制农具和牛耕开始使用并逐步推广，生产力提高，井田制瓦解。都江堰修建于战国，商鞅变法在战国，分封制确立于西周。","point":"春秋时期的经济发展"},{"id":"a2q7","lesson":"a2l2","unit":"a2","type":"order","level":2,"stem":"按时间先后排列春秋时期的下列事件","items":["周平王东迁洛邑","齐桓公任用管仲改革","葵丘会盟","城濮之战"],"explain":"公元前 770 年平王东迁 → 公元前 685 年齐桓公即位用管仲 → 公元前 651 年葵丘会盟 → 公元前 632 年城濮之战。","point":"春秋时期的重大事件"},{"id":"a2q8","lesson":"a2l2","unit":"a2","type":"fill","level":2,"stem":"春秋时期，齐桓公以“______”为口号，号令诸侯，成为第一个霸主。","answer":["尊王攘夷"],"explain":"“尊王”指尊奉周天子，“攘夷”指抵御周边少数民族进攻。这一口号使齐桓公在争霸中占据道义优势。","point":"齐桓公称霸"},{"id":"a2q9","lesson":"a2l3","unit":"a2","type":"choice","level":1,"stem":"商鞅在秦国开始变法是在","options":["公元前 475 年","公元前 356 年","公元前 260 年","公元前 221 年"],"answer":1,"explain":"公元前 356 年，秦孝公任用商鞅开始变法。公元前 475 年是战国开始，公元前 260 年是长平之战，公元前 221 年秦统一六国。","point":"商鞅变法"},{"id":"a2q10","lesson":"a2l3","unit":"a2","type":"choice","level":2,"stem":"商鞅变法中，直接加强中央对地方控制的措施是","options":["奖励耕织","奖励军功","推行县制","统一度量衡"],"answer":2,"explain":"县制由国君直接派官吏治理，取代了贵族世袭管理地方的方式，加强了中央对地方的控制。奖励耕织、奖励军功分别针对农业和军事，统一度量衡针对经济。","point":"商鞅变法的内容"},{"id":"a2q11","lesson":"a2l3","unit":"a2","type":"order","level":2,"stem":"按时间先后排列战国时期的下列事件","items":["三家分晋","商鞅在秦国开始变法","长平之战","李冰主持修建都江堰"],"explain":"公元前 403 年三家分晋 → 公元前 356 年商鞅变法 → 公元前 260 年长平之战 → 公元前 256 年修建都江堰。","point":"战国时期的大事"},{"id":"a2q12","lesson":"a2l3","unit":"a2","type":"fill","level":2,"stem":"战国时期，秦国蜀郡太守______主持修建都江堰，使成都平原成为“天府之国”。","answer":["李冰"],"explain":"公元前 256 年，李冰主持修建都江堰，集防洪、灌溉、水运于一体，至今仍发挥作用。","point":"都江堰"},{"id":"a2q13","lesson":"a2l4","unit":"a2","type":"choice","level":1,"stem":"提出“仁”的学说、主张“为政以德”的思想家是","options":["老子","孔子","墨子","韩非"],"answer":1,"explain":"孔子是儒家学派创始人，核心思想是“仁”，主张“为政以德”。老子主张无为而治，墨子主张兼爱非攻，韩非主张以法治国。","point":"孔子的思想"},{"id":"a2q14","lesson":"a2l4","unit":"a2","type":"choice","level":2,"stem":"战国时期，主张“兼爱”“非攻”，反对不义战争的思想家是","options":["孟子","庄子","墨子","荀子"],"answer":2,"explain":"墨子是墨家创始人，主张“兼爱”“非攻”，提倡节俭。孟子主张仁政，庄子主张顺应自然，荀子主张礼治。","point":"墨子的主张"},{"id":"a2q15","lesson":"a2l4","unit":"a2","type":"match","level":2,"stem":"把下列思想家与其主要主张配对","pairs":[["孔子","“仁”和“为政以德”"],["老子","顺应自然、无为而治"],["韩非","以法治国、中央集权"],["墨子","兼爱、非攻"]],"explain":"孔子属儒家，老子属道家，韩非属法家，墨子属墨家。四家主张的差异，反映了战国时期不同阶层对社会治理的思考。","point":"诸子百家的主张"},{"id":"a2q16","lesson":"a2l4","unit":"a2","type":"fill","level":3,"stem":"战国时期，提出“民为贵，社稷次之，君为轻”的儒家代表人物是______。","answer":["孟子","孟轲"],"explain":"孟子主张“仁政”，提出民贵君轻的思想，认为统治者应重视民心。这一主张是儒家民本思想的重要体现。","point":"孟子的思想"},{"id":"a2q17","lesson":"a2l5","unit":"a2","type":"choice","level":1,"stem":"我国已发现的年代最早、体系较为完整的文字是","options":["金文","甲骨文","小篆","隶书"],"answer":1,"explain":"甲骨文是商朝刻在龟甲、兽骨上的文字，我国有文字可考的历史从商朝开始。金文晚于甲骨文，小篆和隶书是秦朝及以后通行的字体。","point":"甲骨文"},{"id":"a2q18","lesson":"a2l5","unit":"a2","type":"choice","level":2,"stem":"迄今世界上出土的最重的青铜器是","options":["四羊方尊","三星堆青铜面具","后母戊鼎","利簋"],"answer":2,"explain":"后母戊鼎（原称司母戊鼎）重 832.84 千克，是迄今世界上出土最重的青铜器，反映商朝青铜铸造业的高超水平。","point":"青铜器"},{"id":"a2q19","lesson":"a2l5","unit":"a2","type":"match","level":2,"stem":"把下列文化成果与其内容配对","pairs":[["甲骨文","商朝刻在龟甲兽骨上的文字"],["金文","铸刻在青铜器上的文字"],["《诗经》","我国第一部诗歌总集"],["《离骚》","楚辞的代表作"]],"explain":"甲骨文、金文是研究商周历史的一手资料；《诗经》分为风、雅、颂三部分；《离骚》是屈原创作的楚辞名篇。","point":"夏商周的文化成就"},{"id":"a2q20","lesson":"a2l5","unit":"a2","type":"fill","level":2,"stem":"商朝刻在龟甲和牛、羊等兽骨上的文字，被称为______。","answer":["甲骨文","甲骨文字"],"explain":"甲骨文主要记录商王的占卜活动，使用象形、指事、会意、形声等造字方法，是汉字形成与发展的重要阶段。","point":"甲骨文"}],"timeline":[{"t":"约公元前 2070 年","y":-2070,"text":"禹建立夏朝，中国历史上第一个王朝产生","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"约公元前 1600 年","y":-1600,"text":"商汤灭夏，商朝建立","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"约公元前 1300 年","y":-1300,"text":"商王盘庚迁殷，商朝统治稳定下来","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"公元前 1046 年","y":-1046,"text":"牧野之战，周武王灭商，西周建立","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"公元前 771 年","y":-771,"text":"犬戎攻破镐京，西周灭亡","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"公元前 770 年","y":-770,"text":"周平王东迁洛邑，东周开始","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"公元前 651 年","y":-651,"text":"葵丘会盟，齐桓公成为春秋第一个霸主","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"公元前 356 年","y":-356,"text":"秦孝公任用商鞅开始变法","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"公元前 260 年","y":-260,"text":"长平之战，秦大败赵军","unit":"a2","tag":"中国古代","volume":"v1"},{"t":"公元前 256 年","y":-256,"text":"李冰主持修建都江堰","unit":"a2","tag":"中国古代","volume":"v1"}]},{"volume":"v1","unit":{"id":"a3","volume":"v1","num":3,"title":"秦汉时期：统一多民族封建国家的建立和巩固","short":"大一统","years":"前 221—220 年","accent":"#8C5A3C","soft":"#F5E7D9","tint":"#E5C9AF","icon":"🐉","tagline":"从秦始皇到汉武帝，看大一统国家怎样建立、巩固并走向世界。","intro":"公元前 221 年，秦完成统一，中国第一次出现中央集权的统一多民族封建国家。但秦的暴政迅速引爆起义，汉朝在废墟上重建秩序。本单元要回答：大一统国家靠什么建立，又靠什么维系？从郡县制、推恩令到丝绸之路，看制度、思想与交流如何把一个庞大国家凝聚起来。","bigQuestion":"一个疆域辽阔、人口众多的国家，怎样才能真正“统”得住，又“统”得久？","goals":["掌握秦统一的过程与郡县制等巩固统一的措施。","分析秦亡原因，理解汉初休养生息与文景之治。","归纳汉武帝巩固大一统的措施，评价其历史作用。","说明丝绸之路与西域都护的历史意义。"],"keyLine":"秦灭六国建大一统，汉承秦制休养生息，武帝推恩尊儒，张骞凿空开丝路，西域都护定版图。"},"lessons":[{"id":"a3l1","num":9,"unit":"a3","title":"秦统一中国","years":"前 221—前 207 年","icon":"🧱","tag":"秦","hook":"公元前 221 年，咸阳宫前的朝会上，嬴政不再称“王”，而自称“始皇帝”。六国的旌旗已经倒下，一个前所未有的庞大国家刚刚诞生。","core":"公元前 221 年，秦王嬴政灭六国，建立我国历史上第一个统一多民族的封建国家。秦朝创立中央集权制度，推行郡县制，统一文字、货币、度量衡，奠定了此后两千多年国家治理的基本格局。","points":["背景：商鞅变法后秦国国力最强；长期战乱使人民渴望统一；嬴政重用人才，筹划统一方略。","过程：公元前 230—前 221 年，秦先后灭韩、赵、魏、楚、燕、齐，嬴政称“始皇帝”，定都咸阳。","政治：创立皇帝制度，中央设丞相、太尉、御史大夫；地方废分封、行郡县，郡县长官由朝廷任免。","经济文化：统一货币为圆形方孔半两钱，统一度量衡，以小篆为通用文字，统一车轨并修筑道路。","边疆：北击匈奴，修筑西起临洮、东到辽东的长城；开凿灵渠，统一岭南，设桂林、南海、象郡。","影响：结束长期分裂割据，促进各地经济文化交流和民族交融；但严刑峻法、赋役沉重，为秦的速亡埋下隐患。"],"terms":[["皇帝制度","秦王嬴政自称“始皇帝”，总揽全国一切军政大权，皇权至高无上，此后为历代王朝沿用。"],["郡县制","秦朝在地方推行的行政制度。全国分 36 郡，郡下设县，长官由朝廷任免，加强中央对地方的控制。"],["小篆","秦朝统一后颁行全国的通用文字，笔画圆转、结构整齐，有利于文化交流与国家统一。"],["灵渠","秦朝开凿的水利工程，沟通湘江与漓江，连接长江和珠江水系，便利了岭南与中原的往来。"]],"figures":[["秦始皇（嬴政）","灭六国，建立秦朝，创立中央集权制度"],["李斯","建议推行郡县制，主持统一文字"],["蒙恬","率军北击匈奴，主持修筑长城"]],"events":[["公元前 230 年","秦灭韩，统一战争开始"],["公元前 221 年","秦灭齐，秦朝建立"],["公元前 215 年","蒙恬北击匈奴，修筑长城"],["公元前 214 年","开凿灵渠，统一岭南"]],"treaty":null,"significance":"秦的统一结束了春秋战国以来长期分裂割据的局面，建立起我国历史上第一个统一多民族的封建国家；中央集权制度与统一措施为后世所沿用，对中华民族的形成与发展影响深远。","source":{"quote":"一法度衡石丈尺。车同轨。书同文字。","from":"《史记·秦始皇本纪》（公元前 221 年后）"},"pitfall":"秦朝是我国历史上第一个统一多民族的封建国家，但第一个王朝是夏朝；秦统一文字以小篆为通用文字，不是隶书。","memory":"前二二一秦王扫，韩赵魏楚燕齐倒；皇帝郡县书同文，货币度量衡一套。","link":"上承春秋战国的分裂与变革，下启秦末起义与汉承秦制，是本册“大一统”主线的起点。","exam":["秦统一的意义","郡县制与分封制的比较","秦始皇巩固统一的措施"]},{"id":"a3l2","num":10,"unit":"a3","title":"秦末农民大起义","years":"前 209—前 207 年","icon":"🌾","tag":"秦末","hook":"公元前 209 年秋天，大泽乡大雨滂沱，九百名被征发的贫苦农民困在泥泞中。按秦法，误期当斩。陈胜、吴广对视一眼，决定不再等死。","core":"秦的暴政激化了社会矛盾。公元前 209 年，陈胜、吴广在大泽乡起义，这是中国历史上第一次大规模农民起义。起义虽失败，却沉重打击了秦朝统治；公元前 207 年，秦朝在刘邦入关、项羽破敌的夹击下灭亡。","points":["原因：赋税沉重，徭役、兵役繁重，法律严苛；秦二世继位后更加残暴，社会矛盾空前尖锐。","爆发：公元前 209 年，陈胜、吴广在大泽乡起义，提出“王侯将相宁有种乎”，建立“张楚”政权。","发展：起义军攻占陈县后分兵进攻，一度打到咸阳附近；因缺乏统一指挥、力量分散，最终失败。","巨鹿之战：公元前 207 年，项羽率军以少胜多，大败秦军主力，秦军从此一蹶不振。","秦亡：公元前 207 年，刘邦率军攻入咸阳，秦王子婴投降，秦朝灭亡。","楚汉之争：公元前 206—前 202 年，刘邦与项羽争夺帝位，刘邦获胜，为西汉建立奠定基础。"],"terms":[["大泽乡起义","公元前 209 年陈胜、吴广领导的农民起义，是中国历史上第一次大规模农民起义。"],["张楚","陈胜在陈县建立的政权，意为“张大楚国”，是起义军号召群众的政治旗帜。"],["巨鹿之战","公元前 207 年项羽率军在巨鹿以少胜多，击败秦军主力，成为反秦战争的转折点。"],["楚汉之争","公元前 206—前 202 年刘邦与项羽争夺帝位的战争，属于统治阶级内部的争斗。"]],"figures":[["陈胜、吴广","领导大泽乡起义，中国历史上第一次大规模农民起义"],["项羽","巨鹿之战大败秦军主力，后与刘邦争夺天下"],["刘邦","率军入咸阳，秦朝灭亡；后击败项羽，建立西汉"],["秦二世","统治残暴，激化社会矛盾"]],"events":[["公元前 209 年","陈胜、吴广在大泽乡起义"],["公元前 207 年","巨鹿之战；刘邦入咸阳，秦朝灭亡"],["公元前 206 年","楚汉之争开始"],["公元前 202 年","刘邦战胜项羽，西汉建立"]],"treaty":null,"significance":"大泽乡起义是中国历史上第一次大规模农民起义，沉重打击了秦朝的残暴统治，显示了人民群众的力量；陈胜、吴广的革命首创精神为后世农民反抗斗争树立了榜样。","source":{"quote":"且壮士不死即已，死即举大名耳，王侯将相宁有种乎！","from":"《史记·陈涉世家》（公元前 209 年）"},"pitfall":"秦朝是被刘邦率军攻入咸阳推翻的，不是陈胜、吴广直接推翻；击败秦军主力的是项羽。楚汉之争是争夺帝位，不是农民起义。","memory":"大泽乡中一声吼，王侯将相宁有种；巨鹿项羽破秦军，刘邦入关秦祚终。","link":"承接秦的暴政与速亡，说明“得民心者得天下”；汉初的休养生息政策正是对秦亡教训的回应。","exam":["陈胜、吴广起义的地位与精神","秦朝灭亡的原因","楚汉之争的性质"]},{"id":"a3l3","num":11,"unit":"a3","title":"西汉建立和“文景之治”","years":"前 202—前 141 年","icon":"🕊","tag":"西汉","hook":"公元前 202 年，刚刚称帝的刘邦坐在洛阳的宫殿里，看到的是遍地荒芜、人口锐减的天下。他问群臣：秦为何亡？汉该如何活下去？","core":"公元前 202 年，刘邦建立西汉，定都长安。面对秦末战乱留下的残破经济，汉初统治者推行休养生息政策；文帝、景帝继续轻徭薄赋、提倡节俭，出现“文景之治”，为汉武帝时期的大一统奠定了物质基础。","points":["背景：秦末战乱使社会经济遭到严重破坏，人口锐减、田地荒芜、粮价飞涨，新王朝急需恢复生产。","建立：公元前 202 年，刘邦称帝，定都长安，史称西汉。刘邦就是汉高祖。","高祖措施：让士兵还乡务农，释放奴婢为平民，轻徭薄赋（十五税一），鼓励农业生产，恢复社会经济。","文景之治：文帝、景帝重视农业，提倡以农为本，把田赋降到三十税一，减少徭役，勤俭治国，废除部分严刑峻法。","成效：政治清明，经济发展，人口增长，人民生活安定，史称“文景之治”。","隐患：诸侯王势力膨胀，公元前 154 年发生七国之乱，平定后中央集权有所加强。"],"terms":[["休养生息","统治者在大动荡之后采取减轻赋税徭役、恢复生产、安定民生的政策，汉初长期推行。"],["文景之治","汉文帝、汉景帝时期政治清明、经济恢复发展、社会安定的局面，为西汉鼎盛奠定基础。"],["三十税一","汉文帝时期把田赋税率降为三十分之一，是汉初轻徭薄赋政策的重要体现。"],["七国之乱","公元前 154 年，吴王刘濞等七个诸侯王发动叛乱，被汉景帝平定，中央集权得到加强。"]],"figures":[["汉高祖（刘邦）","建立西汉，推行休养生息政策"],["汉文帝","轻徭薄赋，提倡节俭，废除部分严刑"],["汉景帝","继续休养生息，平定七国之乱"]],"events":[["公元前 202 年","刘邦建立西汉，定都长安"],["公元前 195 年","汉高祖去世，休养生息政策初见成效"],["公元前 180 年","汉文帝即位，继续轻徭薄赋"],["公元前 154 年","平定七国之乱"]],"treaty":null,"significance":"休养生息政策使残破的社会经济得到恢复，文景时期出现政治清明、经济发展的局面，为汉武帝时期国力强盛、巩固大一统提供了物质基础，也体现了汉初统治者对秦亡教训的反思。","source":{"quote":"农，天下之本，务莫大焉。","from":"《史记·孝文本纪》（公元前 167 年）"},"pitfall":"西汉定都长安，东汉定都洛阳；休养生息政策始于汉高祖，文帝、景帝是继续推行；“文景之治”指文帝、景帝时期，不是汉高祖时期。","memory":"高祖还乡释奴婢，十五税一劝农桑；文景节俭三十一，仓廪充实汉家昌。","link":"承接秦亡教训，用“与民休息”换来国力恢复；到汉武帝时，才有力量推行推恩令、北击匈奴。","exam":["休养生息政策的内容与作用","文景之治的表现","汉初政策与秦政的比较"]},{"id":"a3l4","num":12,"unit":"a3","title":"大一统王朝的巩固","years":"前 141—前 87 年","icon":"👑","tag":"西汉","hook":"一道诏书从长安发往各诸侯国：诸侯王可以把封地再分给子弟。看似恩泽，实则一刀刀切开了诸侯的势力。","core":"汉武帝从政治、思想、经济、军事四个方面巩固大一统：颁布“推恩令”削弱诸侯王，设刺史监察地方，罢黜百家、尊崇儒术，盐铁官营、统一铸五铢钱，北击匈奴。西汉王朝进入鼎盛时期。","points":["政治：采纳主父偃建议颁布“推恩令”，让诸侯王把封地分给子弟，侯国越分越小，中央集权大大加强。","监察：全国分 13 个州部，每州部派刺史，负责监察地方官吏、豪强及其子弟。","思想：接受董仲舒建议，“罢黜百家，尊崇儒术”，把儒家学说立为正统思想；在长安兴办太学。","经济：把铸币权收归中央，统一铸造五铢钱；实行盐铁官营、专卖；统一调配物资，平抑物价。","军事：公元前 119 年漠北战役，卫青、霍去病大败匈奴，匈奴再也无力与西汉对抗。","影响：大一统局面得到巩固，西汉进入鼎盛；但连年用兵、赋役繁重，后期社会矛盾日益尖锐。"],"terms":[["推恩令","汉武帝颁布的法令，允许诸侯王将封地分给子弟，使侯国越分越小，从而削弱诸侯王势力。"],["刺史","汉武帝把全国分为 13 个州部，每州部派刺史一人，监察地方官吏、豪强及其子弟。"],["罢黜百家，尊崇儒术","汉武帝接受董仲舒建议，排斥其他学派，把儒家学说立为正统思想，并兴办太学。"],["五铢钱","汉武帝统一铸造的货币，由中央垄断铸币权，促进经济交流，加强中央对经济的控制。"]],"figures":[["汉武帝","颁推恩令、尊崇儒术、盐铁官营，巩固大一统"],["主父偃","建议实行“推恩令”"],["董仲舒","提出“罢黜百家，尊崇儒术”"],["卫青、霍去病","漠北战役大败匈奴"]],"events":[["公元前 141 年","汉武帝即位"],["公元前 127 年","颁布“推恩令”"],["公元前 119 年","漠北战役，卫青、霍去病大败匈奴"],["公元前 118 年","统一铸造五铢钱"]],"treaty":null,"significance":"汉武帝从政治、思想、经济、军事等方面巩固了大一统，使中央集权空前加强，西汉王朝进入鼎盛时期；儒家思想成为中国封建社会的正统思想，影响深远。","source":{"quote":"《春秋》大一统者，天地之常经，古今之通谊也。","from":"《汉书·董仲舒传》（汉武帝时期）"},"pitfall":"“推恩令”是汉武帝的措施，不是汉景帝的“削藩”；“罢黜百家，尊崇儒术”使儒家学说成为正统思想，但并未禁绝一切学派。","memory":"推恩分国弱诸侯，刺史监察十三州；罢黜百家尊儒术，盐铁五铢归中央。","link":"在文景之治积累的国力基础上，汉武帝把大一统从制度推向思想与经济，其后的对外开拓正是这一实力的延伸。","exam":["推恩令的作用","罢黜百家、尊崇儒术的影响","汉武帝巩固大一统的措施"]},{"id":"a3l5","num":13,"unit":"a3","title":"东汉的兴衰","years":"25—220 年","icon":"🏯","tag":"东汉","hook":"公元 25 年，刘秀在鄗城称帝。他接手的天下，是经历战乱、户口大减的残破江山；二十多年后，史书却写下了“光武中兴”四个字。","core":"公元 25 年，刘秀建立东汉，定都洛阳。他释放奴婢、减轻赋税、整顿吏治，出现“光武中兴”。东汉中后期外戚与宦官交替专权，政治腐败；184 年黄巾起义沉重打击了东汉统治，东汉走向衰亡。","points":["建立：公元 25 年，刘秀称帝，定都洛阳，史称东汉。刘秀就是光武帝。","光武中兴：多次释放奴婢，减轻农民负担，减轻刑法；合并郡县、裁减官员，惩处贪官污吏。","民族关系：允许北方各族内迁，缓和民族矛盾，促进了民族交往与交融。","中后期政治：皇帝大多年幼即位，外戚与宦官交替专权，政治腐败，社会矛盾激化。","黄巾起义：184 年，张角创立太平道，领导黄巾起义，提出“苍天已死，黄天当立”，起义被镇压。","结局：黄巾起义后军阀割据混战；220 年曹丕废汉献帝，东汉灭亡。"],"terms":[["光武中兴","东汉光武帝刘秀统治后期社会安定、经济恢复发展、人口增长的局面。"],["外戚宦官交替专权","东汉中后期皇帝年幼即位，母族外戚与宦官轮流把持朝政，政治日益腐败。"],["黄巾起义","184 年张角领导的农民起义，因起义军头裹黄巾得名，沉重打击了东汉统治。"],["太平道","张角创立的宗教组织，以传教方式组织群众，成为黄巾起义的组织基础。"]],"figures":[["光武帝（刘秀）","建立东汉，开创“光武中兴”"],["张角","创立太平道，领导黄巾起义"],["曹丕","220 年废汉献帝，东汉灭亡"]],"events":[["公元 25 年","刘秀称帝，建立东汉"],["公元 57 年","光武帝去世，光武中兴局面形成"],["公元 184 年","黄巾起义爆发"],["公元 220 年","曹丕废汉献帝，东汉灭亡"]],"treaty":null,"significance":"光武中兴使东汉前期社会经济得到恢复，政局稳定；但外戚宦官专权和黄巾起义暴露了东汉统治的腐朽，东汉最终在军阀割据中灭亡，为三国鼎立埋下伏笔。","source":{"quote":"苍天已死，黄天当立，岁在甲子，天下大吉。","from":"《后汉书·皇甫嵩传》（184 年）"},"pitfall":"东汉定都洛阳，西汉定都长安；“光武中兴”是刘秀时期的局面；东汉不是被黄巾起义直接推翻，而是 220 年曹丕废汉献帝。","memory":"光武中兴释奴婢，洛阳城里汉再兴；外戚宦官轮流坐，甲子黄巾撼东京。","link":"东汉的衰亡直接引出下一单元的三国鼎立；东汉班超经营西域、蔡伦改进造纸术，又延续着本单元的交流与文明成果。","exam":["光武中兴的措施","外戚宦官专权","黄巾起义的影响"]},{"id":"a3l6","num":14,"unit":"a3","title":"丝绸之路的开通与经营西域","years":"前 138—公元 2 世纪","icon":"🐫","tag":"丝路","hook":"公元前 138 年，一支百余人的使团从长安出发，向西走入戈壁。领队的郎官张骞并不知道，他这一走，会走出一条贯通欧亚的大道。","core":"公元前 138 年和公元前 119 年，张骞两次出使西域，使汉朝与西域的联系日益密切。此后陆上丝绸之路从长安经河西走廊、今新疆通往中亚、西亚和欧洲；公元前 60 年西汉设西域都护，西域正式归属中央政权。","points":["背景：匈奴控制西域，威胁汉朝；汉武帝为联络大月氏夹击匈奴，决定派人出使西域。","第一次出使：公元前 138 年张骞出发，途中被匈奴扣留十余年，历尽艰险返回，带回西域的详细情况。","第二次出使：公元前 119 年，张骞再次出使西域，访问乌孙等国，西域各国纷纷与汉朝交往。","陆上丝路：从长安出发，经河西走廊、今新疆地区，通往中亚、西亚，直到欧洲；丝绸西传，良马、香料、瓜果东来。","海上丝路：汉武帝时期开辟海上交通，从东南沿海出发，经中南半岛、马六甲海峡，最远到达印度半岛南端和锡兰。","经营西域：公元前 60 年设西域都护，标志西域正式归属中央政权；东汉班超经营西域三十多年，派甘英出使大秦。"],"terms":[["西域","汉代指今新疆地区和更西的地方。张骞通西域后，汉朝与西域的联系日益密切。"],["丝绸之路","古代连接中国与中亚、西亚、欧洲的陆上贸易与文化交流通道，因中国丝绸经此西运而得名。"],["西域都护","公元前 60 年西汉设置的管理西域的最高长官，标志西域正式归属中央政权。"],["凿空","司马迁称张骞通西域为“凿空”，意为开通了中原通往西域的道路。"]],"figures":[["张骞","两次出使西域，开通中原与西域的往来"],["班超","东汉经营西域三十多年，派甘英出使大秦"],["甘英","97 年出使大秦，到达波斯湾一带"],["汉武帝","支持张骞出使西域，开辟海上丝绸之路"]],"events":[["公元前 138 年","张骞第一次出使西域"],["公元前 119 年","张骞第二次出使西域"],["公元前 60 年","西汉设置西域都护"],["公元 73 年","班超开始经营西域"],["公元 97 年","甘英出使大秦"]],"treaty":null,"significance":"丝绸之路是古代东西方往来的大动脉，促进了中国与中亚、西亚、欧洲的经济文化交流；西域都护的设置标志西域正式归属中央政权，新疆地区自古以来就是中国领土的一部分。","source":{"quote":"然张骞凿空，其后使往者皆称博望侯。","from":"《史记·大宛列传》（汉武帝时期）"},"pitfall":"张骞出使西域的直接目的是联络大月氏夹击匈奴，不是开辟商路；西域正式归属中央政权管辖的标志是公元前 60 年设置西域都护。","memory":"张骞凿空通西域，丝绸西去良马还；前六〇设都护，西域自此入汉版。","link":"承接汉武帝时期国力强盛与北击匈奴，把大一统从内部制度延伸到对外交往，是理解“统一多民族国家”形成的关键一课。","exam":["张骞通西域的意义","丝绸之路的路线与作用","西域都护设置的意义"]},{"id":"a3l7","num":15,"unit":"a3","title":"秦汉时期的科技与文化","years":"前 221—220 年","icon":"📚","tag":"文化","hook":"长沙马王堆汉墓里，一幅 T 形帛画把天上、人间、地下三层世界画在一起；同一时代的洛阳，蔡伦正把树皮、破布泡进水池。","core":"秦汉时期，造纸术、医学、数学、天文历法和史学都取得突出成就：蔡伦改进造纸术，张仲景、华佗推动中医发展，《九章算术》形成体系，司马迁著《史记》、班固著《汉书》；佛教传入，道教兴起，中华文化呈现统一而开放的气象。","points":["造纸术：西汉已有麻纸；东汉蔡伦改进造纸术，用树皮、麻头、破布、旧渔网为原料，纸的质量和产量大大提高。","医学：东汉末年张仲景著《伤寒杂病论》，提出“治未病”，被尊为“医圣”；华佗发明“麻沸散”，创编“五禽戏”。","数学与天文：《九章算术》标志中国古代数学形成完整体系；汉武帝时颁布《太初历》，东汉张衡发明地动仪。","史学：司马迁著《史记》，是我国第一部纪传体通史；班固著《汉书》，是我国第一部纪传体断代史。","宗教：佛教在西汉末年经丝绸之路传入中国，东汉明帝时得到扶持；道教在东汉末年兴起。","艺术：秦始皇陵兵马俑、马王堆汉墓帛画、东汉说唱俑，展现了秦汉高超的雕塑与绘画水平。"],"terms":[["蔡侯纸","东汉蔡伦改进造纸术后的纸，原料易得、价格低廉，便于推广，是中国对世界文明的贡献。"],["《史记》","西汉司马迁所著，我国第一部纪传体通史，记述从黄帝到汉武帝时期约 3000 年的历史。"],["《九章算术》","东汉时期成书的数学著作，总结了周秦到汉代的数学成就，标志中国古代数学形成完整体系。"],["《太初历》","汉武帝时期颁布的历法，是我国第一部比较完整的历法，确立以正月为岁首。"]],"figures":[["蔡伦","改进造纸术，制成“蔡侯纸”"],["张仲景","著《伤寒杂病论》，被尊为“医圣”"],["华佗","发明“麻沸散”，创编“五禽戏”"],["司马迁","著《史记》，我国第一部纪传体通史"]],"events":[["公元前 104 年","汉武帝颁布《太初历》"],["公元 105 年","蔡伦改进造纸术"],["公元 132 年","张衡发明地动仪"],["公元 2 世纪","《伤寒杂病论》《九章算术》成书"]],"treaty":null,"significance":"秦汉时期的科技文化成就，体现了统一国家的雄厚国力与开放胸怀；造纸术的改进更是中国对世界文明的重大贡献，中华文明在交流互鉴中不断丰富发展。","source":{"quote":"亦欲以究天人之际，通古今之变，成一家之言。","from":"司马迁《报任安书》（约公元前 93 年）"},"pitfall":"蔡伦是改进造纸术，不是发明造纸术；《史记》是纪传体通史，《汉书》是纪传体断代史；地动仪用于测定地震方位，不能预测地震。","memory":"蔡伦造纸传四海，仲景医圣华佗麻；史记通史汉书本，九章算术太初历。","link":"本课汇总秦汉的文明成果，上承战国百家争鸣的思想遗产，下启魏晋南北朝时期的科技与艺术。","exam":["造纸术的改进与传播","《史记》的地位","张仲景、华佗的医学成就"]}],"questions":[{"id":"a3q1","lesson":"a3l1","unit":"a3","type":"choice","level":1,"stem":"秦朝在地方上推行的行政制度是","options":["分封制","郡县制","行省制","三省六部制"],"answer":1,"explain":"秦朝废分封、行郡县，全国分 36 郡，郡下设县，长官由朝廷任免，从而加强中央对地方的控制。分封制是西周的制度，行省制始于元朝，三省六部制是隋唐的中央官制。","point":"郡县制"},{"id":"a3q2","lesson":"a3l1","unit":"a3","type":"choice","level":2,"stem":"秦统一后，作为全国通用文字颁行的是","options":["甲骨文","金文","小篆","楷书"],"answer":2,"explain":"秦统一后以小篆为通用文字颁行全国，笔画圆转、结构整齐，便于政令推行和文化交流。甲骨文、金文是先秦更早的文字，楷书在魏晋以后才逐渐流行。","point":"秦统一文字"},{"id":"a3q3","lesson":"a3l1","unit":"a3","type":"order","level":2,"stem":"按时间先后排列秦统一及巩固统一的重大举措","items":["秦灭韩，统一战争开始","秦朝建立，嬴政称“始皇帝”","统一文字、货币和度量衡","北击匈奴，修筑长城","开凿灵渠，统一岭南"],"explain":"公元前 230 年秦灭韩，揭开统一战争序幕；公元前 221 年秦朝建立；随后统一文字、货币、度量衡；公元前 215 年蒙恬北击匈奴、修筑长城；公元前 214 年开凿灵渠、统一岭南。","point":"秦统一的过程与措施"},{"id":"a3q4","lesson":"a3l1","unit":"a3","type":"fill","level":1,"stem":"秦朝创立大一统的中央集权制度，在地方上废分封、行______，郡县长官由朝廷直接任免。","answer":["郡县制","郡县"],"explain":"秦朝在地方推行郡县制，全国分 36 郡，郡下设县，长官由朝廷任免，加强了中央对地方的控制。","point":"郡县制"},{"id":"a3q5","lesson":"a3l2","unit":"a3","type":"choice","level":1,"stem":"中国历史上第一次大规模农民起义是","options":["大泽乡起义","黄巾起义","黄巢起义","李自成起义"],"answer":0,"explain":"公元前 209 年陈胜、吴广在大泽乡发动起义，是中国历史上第一次大规模农民起义。黄巾起义发生在东汉末年，黄巢起义在唐朝末年，李自成起义在明朝末年。","point":"陈胜、吴广起义"},{"id":"a3q6","lesson":"a3l2","unit":"a3","type":"choice","level":2,"stem":"公元前 207 年，项羽率军以少胜多、大败秦军主力的战役是","options":["巨鹿之战","长平之战","官渡之战","赤壁之战"],"answer":0,"explain":"公元前 207 年，项羽在巨鹿之战中以少胜多，击败秦军主力，秦军从此一蹶不振。长平之战是战国时秦赵之战，官渡之战、赤壁之战都发生在东汉末年到三国时期。","point":"巨鹿之战"},{"id":"a3q7","lesson":"a3l2","unit":"a3","type":"match","level":2,"stem":"把下列人物与其在秦末反秦斗争中的活动配对","pairs":[["陈胜、吴广","领导大泽乡起义"],["项羽","在巨鹿之战大败秦军主力"],["刘邦","率军攻入咸阳，秦朝灭亡"],["秦二世","统治更加残暴，激化社会矛盾"]],"explain":"陈胜、吴广揭竿而起，项羽在巨鹿击溃秦军主力，刘邦率先入关使秦朝灭亡；秦二世的残暴统治是起义爆发的背景。","point":"秦末反秦斗争"},{"id":"a3q8","lesson":"a3l2","unit":"a3","type":"fill","level":1,"stem":"公元前 209 年，陈胜、吴广在______（地名）发动起义，这是中国历史上第一次大规模农民起义。","answer":["大泽乡"],"explain":"公元前 209 年，被征发的农民因大雨误期，按秦法当斩，陈胜、吴广在大泽乡率众起义。","point":"大泽乡起义"},{"id":"a3q9","lesson":"a3l3","unit":"a3","type":"choice","level":1,"stem":"公元前 202 年建立西汉、定都长安的是","options":["刘邦","刘秀","项羽","刘备"],"answer":0,"explain":"公元前 202 年刘邦称帝，定都长安，史称西汉。刘秀建立的是东汉，项羽在楚汉之争中失败，刘备建立的是蜀汉。","point":"西汉的建立"},{"id":"a3q10","lesson":"a3l3","unit":"a3","type":"choice","level":2,"stem":"汉初推行休养生息政策的直接原因是","options":["秦末战乱使经济凋敝、人口锐减","匈奴不断南下威胁长安","诸侯王势力膨胀","“文景之治”已经出现"],"answer":0,"explain":"秦末连年战乱使社会生产遭到严重破坏，人口锐减、田地荒芜，恢复经济成为当务之急，因此汉初推行休养生息政策。匈奴威胁、诸侯王问题是其他背景，“文景之治”是政策推行的结果。","point":"休养生息的背景"},{"id":"a3q11","lesson":"a3l3","unit":"a3","type":"order","level":2,"stem":"按时间先后排列西汉初年的重大史事","items":["刘邦建立西汉","汉高祖推行休养生息政策","汉文帝、汉景帝继续轻徭薄赋","平定七国之乱","汉武帝即位，西汉走向鼎盛"],"explain":"公元前 202 年西汉建立；汉高祖时开始休养生息；文帝、景帝继续推行并出现“文景之治”；公元前 154 年平定七国之乱；公元前 141 年汉武帝即位，西汉进入鼎盛。","point":"西汉初年的统治"},{"id":"a3q12","lesson":"a3l3","unit":"a3","type":"choice","level":3,"stem":"汉高祖、汉文帝、汉景帝时期都重视农业生产、轻徭薄赋，其共同目的是","options":["大幅增加政府赋税收入","恢复发展经济，稳定汉朝统治","抑制土地兼并","加强对地方官吏的监察"],"answer":1,"explain":"汉初经济残破，统治者吸取秦亡教训，以休养生息恢复生产、安定民生，根本目的是稳定统治。轻徭薄赋会减少政府赋税收入；抑制土地兼并、监察地方官吏不是这些措施的共同目的。","point":"休养生息政策的目的"},{"id":"a3q13","lesson":"a3l4","unit":"a3","type":"choice","level":1,"stem":"汉武帝为削弱诸侯王势力，采纳主父偃建议实行","options":["推恩令","分封制","郡县制","刺史制度"],"answer":0,"explain":"汉武帝颁布“推恩令”，允许诸侯王把封地分给子弟，侯国越分越小，诸侯王势力被削弱。分封制是西周制度，郡县制是秦朝的地方制度，刺史制度用于监察地方。","point":"推恩令"},{"id":"a3q14","lesson":"a3l4","unit":"a3","type":"choice","level":2,"stem":"汉武帝接受董仲舒建议，“罢黜百家，尊崇儒术”，其根本目的是","options":["发展文化教育事业","加强思想控制，巩固大一统","恢复战国百家争鸣的局面","联合儒家学者共同抗击匈奴"],"answer":1,"explain":"汉武帝把儒家学说立为正统思想，是为了统一思想、加强思想控制，从而巩固政治上的大一统。发展教育是影响而非根本目的；“百家争鸣”与尊崇儒术相反；抗击匈奴属于军事措施。","point":"罢黜百家，尊崇儒术"},{"id":"a3q15","lesson":"a3l4","unit":"a3","type":"match","level":2,"stem":"把汉武帝巩固大一统的措施与其作用配对","pairs":[["推恩令","削弱诸侯王势力"],["刺史制度","监察地方官吏和豪强"],["盐铁官营","增加中央财政收入"],["统一铸五铢钱","加强中央对经济的控制"]],"explain":"汉武帝从政治、经济等方面加强中央集权：推恩令解决王国问题，刺史监察地方，盐铁官营和统一铸币增强中央财力。","point":"汉武帝巩固大一统的措施"},{"id":"a3q16","lesson":"a3l4","unit":"a3","type":"fill","level":2,"stem":"汉武帝接受董仲舒的建议，把______学说立为正统思想，并在长安兴办太学。","answer":["儒家","儒学","儒家学说"],"explain":"汉武帝“罢黜百家，尊崇儒术”，把儒家学说立为正统思想，在长安兴办太学，以儒家经典为教材。","point":"尊崇儒术"},{"id":"a3q17","lesson":"a3l5","unit":"a3","type":"choice","level":1,"stem":"公元 25 年建立东汉、定都洛阳的是","options":["刘秀","刘邦","刘彻","刘备"],"answer":0,"explain":"公元 25 年刘秀称帝，定都洛阳，史称东汉，刘秀就是光武帝。刘邦建立西汉，刘彻是汉武帝，刘备建立蜀汉。","point":"东汉的建立"},{"id":"a3q18","lesson":"a3l5","unit":"a3","type":"choice","level":2,"stem":"东汉中后期政治黑暗的突出表现是","options":["外戚与宦官交替专权","诸侯王起兵叛乱","匈奴攻入洛阳","豪强地主拒绝纳税"],"answer":0,"explain":"东汉中后期皇帝大多年幼即位，母族外戚和宦官轮流把持朝政，形成外戚与宦官交替专权的局面，政治日益腐败。诸侯王叛乱主要发生在西汉初年。","point":"外戚宦官交替专权"},{"id":"a3q19","lesson":"a3l5","unit":"a3","type":"order","level":2,"stem":"按时间先后排列东汉由兴到衰的史事","items":["刘秀建立东汉","出现“光武中兴”的局面","外戚与宦官交替专权","黄巾起义爆发","曹丕废汉献帝，东汉灭亡"],"explain":"公元 25 年东汉建立；光武帝后期出现“光武中兴”；中后期外戚宦官交替专权；184 年黄巾起义；220 年曹丕废汉献帝，东汉灭亡。","point":"东汉的兴衰"},{"id":"a3q20","lesson":"a3l5","unit":"a3","type":"choice","level":3,"stem":"东汉中后期出现外戚与宦官交替专权，其直接原因是","options":["诸侯王势力强大，威胁中央","皇帝大多年幼即位，无法主政","察举制选官不公","黄巾起义打击了东汉统治"],"answer":1,"explain":"东汉中后期皇帝大多年幼即位，无法处理政事，母族外戚和宦官借机轮流掌权。诸侯王威胁中央主要是西汉初年的问题，黄巾起义发生在专权局面形成之后。","point":"东汉中后期政治"},{"id":"a3q21","lesson":"a3l6","unit":"a3","type":"choice","level":1,"stem":"公元前 138 年奉命第一次出使西域的是","options":["张骞","班超","甘英","卫青"],"answer":0,"explain":"公元前 138 年，张骞奉命第一次出使西域，途中被匈奴扣留十余年，返回后带回西域的详细情况。班超、甘英是东汉人，卫青是北击匈奴的将领。","point":"张骞通西域"},{"id":"a3q22","lesson":"a3l6","unit":"a3","type":"choice","level":2,"stem":"公元前 60 年西汉设置西域都护，其标志性意义是","options":["丝绸之路正式开通","西域正式归属中央政权","匈奴威胁彻底解除","海上丝绸之路开辟"],"answer":1,"explain":"公元前 60 年西汉设置西域都护，作为管理西域的最高长官，标志西域正式归属中央政权。丝绸之路在张骞通西域后逐渐开通，海上丝绸之路开辟于汉武帝时期。","point":"西域都护的设置"},{"id":"a3q23","lesson":"a3l6","unit":"a3","type":"order","level":2,"stem":"按时间先后排列汉朝开通丝路与经营西域的史事","items":["张骞第一次出使西域","张骞第二次出使西域","西汉设置西域都护","班超开始经营西域","甘英出使大秦"],"explain":"公元前 138 年张骞第一次出使；公元前 119 年第二次出使；公元前 60 年设西域都护；公元 73 年班超经营西域；公元 97 年甘英出使大秦。","point":"丝绸之路与西域经营"},{"id":"a3q24","lesson":"a3l6","unit":"a3","type":"fill","level":1,"stem":"公元前 60 年，西汉朝廷设置______，作为管理西域的最高长官，标志西域正式归属中央政权。","answer":["西域都护"],"explain":"公元前 60 年，西汉设置西域都护，管理西域事务，西域正式归属中央政权管辖。","point":"西域都护"},{"id":"a3q25","lesson":"a3l7","unit":"a3","type":"choice","level":1,"stem":"东汉时期改进造纸术、制成“蔡侯纸”的是","options":["蔡伦","张衡","华佗","张仲景"],"answer":0,"explain":"东汉蔡伦改进造纸术，用树皮、麻头、破布、旧渔网为原料，纸的质量和产量大大提高。张衡发明地动仪，华佗、张仲景是医学家。","point":"造纸术的改进"},{"id":"a3q26","lesson":"a3l7","unit":"a3","type":"choice","level":2,"stem":"我国第一部纪传体通史是","options":["《史记》","《汉书》","《春秋》","《资治通鉴》"],"answer":0,"explain":"西汉司马迁所著《史记》是我国第一部纪传体通史；《汉书》是第一部纪传体断代史；《春秋》是编年体史书；《资治通鉴》是北宋司马光主编的编年体通史。","point":"《史记》"},{"id":"a3q27","lesson":"a3l7","unit":"a3","type":"match","level":2,"stem":"把下列秦汉人物与其成就配对","pairs":[["司马迁","著《史记》"],["班固","著《汉书》"],["张仲景","著《伤寒杂病论》"],["张衡","发明地动仪"]],"explain":"司马迁、班固是著名史学家，张仲景被尊为“医圣”，张衡是东汉天文学家，发明了测定地震方位的地动仪。","point":"秦汉科技与文化成就"},{"id":"a3q28","lesson":"a3l7","unit":"a3","type":"fill","level":2,"stem":"东汉末年，张仲景写成《______》，发展了中医理论和治疗方法，后世尊称他为“医圣”。","answer":["伤寒杂病论","《伤寒杂病论》"],"explain":"张仲景在《伤寒杂病论》中系统总结了中医的辨证论治方法，提出“治未病”的思想，被后世尊为“医圣”。","point":"张仲景与《伤寒杂病论》"}],"timeline":[{"t":"公元前 221 年","y":-221,"text":"秦灭六国，秦朝建立，嬴政称“始皇帝”","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元前 209 年","y":-209,"text":"陈胜、吴广在大泽乡起义","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元前 207 年","y":-207,"text":"巨鹿之战；刘邦攻入咸阳，秦朝灭亡","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元前 202 年","y":-202,"text":"刘邦建立西汉，定都长安","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元前 138 年","y":-138,"text":"张骞第一次出使西域","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元前 119 年","y":-119,"text":"漠北战役，卫青、霍去病大败匈奴；张骞第二次出使西域","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元前 60 年","y":-60,"text":"西汉设置西域都护，西域正式归属中央政权","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元 25 年","y":25,"text":"刘秀建立东汉，定都洛阳","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元 105 年","y":105,"text":"蔡伦改进造纸术","unit":"a3","tag":"中国古代","volume":"v1"},{"t":"公元 184 年","y":184,"text":"张角领导黄巾起义，东汉统治走向衰亡","unit":"a3","tag":"中国古代","volume":"v1"}]},{"volume":"v1","unit":{"id":"a4","volume":"v1","num":4,"title":"三国两晋南北朝时期：政权分立与民族交融","short":"分立交融","years":"220—589 年","accent":"#7D5B45","soft":"#F2E7DB","tint":"#DDC8B3","icon":"🐎","tagline":"政权分立近四百年，民族交融与江南开发重塑中国。","intro":"从 220 年曹丕称帝到 589 年隋灭陈，中国经历了近四百年的政权分立。北方战乱频仍，人口南迁，江南得到开发；内迁各族与汉族杂居相处，在冲突与交流中走向交融。这一单元要回答：分裂的时代，为什么反而孕育出统一的新因素？","bigQuestion":"政权分立近四百年，为什么最终又走向统一，它给隋唐留下了什么？","goals":["梳理从三国到南北朝的政权更替脉络。","说明江南地区开发的原因、表现和影响。","理解北魏孝文帝改革与北方民族交融的关系。","认识分裂时期科技文化成就的历史地位。"],"keyLine":"官渡定北方，赤壁分三国；西晋短暂合，淝水南北分；孝文改旧俗，江南渐富庶。"},"lessons":[{"id":"a4l1","num":16,"unit":"a4","title":"三国鼎立","years":"220—280 年","icon":"⚔","tag":"三国","hook":"建安年间的中原，白骨露于野，千里无鸡鸣。官渡一战，曹操击溃袁绍；八年后，他的大军却在长江边停下——赤壁的火焰，把中国烧成了三块。","core":"200 年官渡之战后曹操统一北方；208 年赤壁之战孙刘联军以少胜多，为三国鼎立奠定基础；220—229 年魏、蜀、吴相继建立；280 年西晋灭吴，三国归于统一。","points":["背景：东汉末年军阀混战，生产遭到严重破坏；曹操“挟天子以令诸侯”，招贤纳士、实行屯田，势力迅速壮大。","官渡之战：200 年，曹操以少胜多击败袁绍，为统一北方奠定基础。","赤壁之战：208 年，孙刘联军用火攻大败曹军，为三国鼎立局面的形成奠定基础。","三国建立：220 年曹丕称帝建魏，定都洛阳；221 年刘备称帝建汉（蜀汉），定都成都；229 年孙权称帝建吴，定都建业。","三国经济：魏重视农业、兴修水利；蜀汉丝织业发达，蜀锦行销各地；吴开发江东，造船业发达，230 年孙权派卫温到达夷洲。","归于统一：263 年魏灭蜀；266 年司马炎代魏建晋；280 年西晋灭吴，结束分裂局面。"],"terms":[["屯田","曹操招募流民，利用荒地屯田，既解决了军粮问题，又使北方农业得到恢复。"],["挟天子以令诸侯","曹操把汉献帝迎到许，借皇帝的名义号令四方，在政治上取得有利地位。"],["夷洲","今台湾。230 年孙权派卫温率船队到达夷洲，这是史书上关于大陆与台湾联系的重要记载。"],["三国鼎立","魏、蜀、吴三个政权鼎足而立。它是局部统一，比东汉末年军阀混战有利于社会安定。"]],"figures":[["曹操","挟天子以令诸侯，统一北方"],["刘备","三顾茅庐，建立蜀汉"],["孙权","据有江东，建立吴国"],["诸葛亮","辅佐刘备，主张联孙抗曹"]],"events":[["200 年","官渡之战"],["208 年","赤壁之战"],["220 年","曹丕称帝，魏国建立"],["229 年","孙权称帝，吴国建立"],["280 年","西晋灭吴，统一全国"]],"treaty":null,"significance":"三国鼎立结束了东汉末年群雄割据的混战局面，实现了局部统一；三个政权各自发展经济，促进了江南和西南地区的开发，为西晋统一和此后经济重心南移准备了条件。","source":{"quote":"白骨露于野，千里无鸡鸣。生民百遗一，念之断人肠。","from":"曹操《蒿里行》（东汉末年）"},"pitfall":"曹操死于 220 年，是东汉末年人物，不算三国人物；赤壁之战为三国鼎立奠定基础，鼎立局面到 229 年才最终形成。","memory":"官渡以少胜袁绍，赤壁火攻定三分；魏蜀吴成鼎足势，二八〇年晋统一。","link":"上承东汉末年军阀混战，下启西晋短暂统一；三国对江南、西南的开发，为东晋南朝江南经济繁荣埋下伏笔。","exam":["官渡之战与赤壁之战的比较","三国鼎立局面形成的过程","三国时期的经济与夷洲"]},{"id":"a4l2","num":17,"unit":"a4","title":"西晋的短暂统一和北方各族的内迁","years":"266—316 年","icon":"🏹","tag":"西晋","hook":"洛阳城的宫墙里，晋惠帝听说百姓饿死，反问：“何不食肉糜？”十六年的皇族厮杀，把西晋的江山和北方的一片安宁一起烧成了灰。","core":"266 年司马炎建立西晋，280 年灭吴统一。但统治腐朽、分封同姓王，引发八王之乱；内迁各族趁乱起兵，316 年西晋灭亡，北方进入十六国时期。","points":["建立：266 年司马炎（晋武帝）代魏称帝，定都洛阳，史称西晋；280 年灭吴，统一全国。","腐朽：西晋统治集团奢侈腐化，晋惠帝昏庸无能；又分封同姓王，诸王手握重兵。","八王之乱：291—306 年，晋惠帝时皇族争夺皇位，历时十六年，中原人口大量死亡，幸存者纷纷南迁。","内迁：从东汉末年起，匈奴、鲜卑、羯、氐、羌等族陆续内迁，到西晋时人数达数百万，与汉族杂居。","灭亡：316 年，内迁匈奴人的一支攻占长安，西晋灭亡；317 年司马睿在建康重建晋朝，史称东晋。","影响：西晋短暂统一结束了三国分裂，却未能巩固；八王之乱和各族起兵使北方陷入长期动乱，人口大规模南迁。"],"terms":[["八王之乱","西晋皇族为争夺皇位引发的战乱，历时十六年，严重削弱西晋统治，导致人口大量南迁。"],["五胡","匈奴、鲜卑、羯、氐、羌五个内迁少数民族的合称。这是习惯说法，内迁民族不止五个。"],["人口南迁","西晋末年，为躲避战乱，中原人口大量迁往南方，形成我国古代历史上第一次大规模人口迁徙高潮。"],["十六国","西晋灭亡后，北方先后出现的十几个割据政权，大部分由内迁少数民族建立。"]],"figures":[["司马炎","建立西晋，灭吴统一全国"],["晋惠帝","昏庸无能，八王之乱时在位"],["刘渊","匈奴贵族，起兵反晋"],["司马睿","317 年重建晋朝，史称东晋"]],"events":[["266 年","司马炎建立西晋"],["280 年","西晋灭吴，统一全国"],["291—306 年","八王之乱"],["316 年","西晋灭亡"],["317 年","司马睿重建晋朝，史称东晋"]],"treaty":null,"significance":"西晋结束了三国以来的分裂，却因统治腐朽和内战迅速衰亡。北方各族内迁与西晋灭亡，揭开了十六国和南北朝民族大交融的序幕。","source":{"quote":"关中之人百余万口，率其少多，戎狄居半。","from":"江统《徙戎论》，《晋书·江统传》（西晋）"},"pitfall":"西晋 266 年建立、280 年才统一；八王之乱是皇族内乱，不是农民起义；西晋灭亡后北方进入十六国，不是立即进入南北朝。","memory":"二六六晋代魏兴，二八〇年灭吴平；八王乱起中原破，三一六亡十六国。","link":"承接三国分裂，西晋短暂统一；八王之乱与人口南迁，直接引出东晋南朝的江南开发与北方的民族政权。","exam":["西晋统一与速亡的原因","八王之乱的影响","北方各族内迁的史实"]},{"id":"a4l3","num":18,"unit":"a4","title":"东晋南朝政治和江南地区开发","years":"317—589 年","icon":"🌾","tag":"东晋南朝","hook":"一批批北方人渡过长江，把麦种、织机和水碓的图纸一起带到南方。荒地被开成水田，建康的码头一天比一天热闹。","core":"317 年司马睿重建晋朝，史称东晋，士族掌权，出现“王与马，共天下”。420 年起，宋、齐、梁、陈相继统治南方，合称南朝。北方人口南迁带来劳动力和技术，江南得到大规模开发。","points":["东晋建立：317 年司马睿在建康重建晋朝，史称东晋；王导、王敦等士族辅政，形成门阀政治。","北伐：祖逖闻鸡起舞、中流击楫，率军北伐，收复黄河以南部分地区，但未能成功。","淝水之战：383 年，前秦苻坚南下攻晋，东晋以少胜多，前秦瓦解，北方重新陷入分裂。","南朝更替：420 年刘裕建立宋，此后齐、梁、陈相继，均定都建康，合称南朝，与北朝对峙。","开发原因：北方人口南迁带来劳动力、先进生产工具和技术；江南自然条件优越；社会比较安定；统治者重视。","开发表现：开垦荒地、兴修水利，水稻育秧移栽、麦稻兼作；纺织、制瓷、造船等发展；建康商业繁荣。"],"terms":[["门阀士族","魏晋南北朝时期世代做官、享有政治经济特权的大家族，东晋时势力尤其强大。"],["王与马，共天下","东晋时琅琊王氏士族与司马氏皇权共治天下的说法，反映士族专权的政治特点。"],["淝水之战","383 年东晋与前秦在淝水展开的战役，东晋以少胜多，前秦瓦解，南北对峙局面延续。"],["南朝","宋、齐、梁、陈四个王朝的合称，四个王朝都定都建康，与北方的北朝对峙。"]],"figures":[["司马睿","317 年重建晋朝，史称东晋"],["王导","东晋士族代表，辅佐司马睿"],["祖逖","闻鸡起舞，率军北伐"],["谢玄","淝水之战中率晋军取胜"]],"events":[["317 年","司马睿重建晋朝，史称东晋"],["383 年","淝水之战"],["420 年","刘裕建立宋，南朝开始"],["589 年","隋灭陈，南朝结束"]],"treaty":null,"significance":"江南开发使南方经济迅速发展，为后来我国经济重心南移奠定了基础；南迁人口与当地人民共同劳动，也促进了民族交融。","source":{"quote":"江南之为国盛矣……地广野丰，民勤本业，一岁或稔，则数郡忘饥。","from":"《宋书·孔季恭等传》（南朝梁）"},"pitfall":"江南开发为经济重心南移奠定基础，不等于南移完成，南移完成是在南宋；淝水之战的胜者是东晋，不是前秦。","memory":"司马南渡建东晋，淝水以少胜前秦；宋齐梁陈称南朝，北人南来江南兴。","link":"承接西晋灭亡与人口南迁，江南开发为隋唐经济繁荣打下基础；南朝的稳定与北朝的交融，共同为隋朝统一创造条件。","exam":["江南地区开发的原因","淝水之战","东晋南朝的政治特点"]},{"id":"a4l4","num":19,"unit":"a4","title":"北朝政治和北方民族大交融","years":"386—581 年","icon":"🐎","tag":"北朝","hook":"平城的宫门外，鲜卑贵族脱下窄袖胡服，换上宽袍大袖；朝堂上，三十岁以下的官员被要求改说汉语。一场自上而下的改变，从衣着和口音开始。","core":"386 年鲜卑拓跋部建立北魏，439 年统一北方。494 年孝文帝迁都洛阳，推行说汉语、穿汉服、改汉姓、通婚等改革，促进北方民族大交融，为隋唐统一奠定基础。","points":["北魏兴起：386 年鲜卑族拓跋部建立北魏，定都平城；439 年统一北方，结束十六国以来的分裂割据局面。","改革背景：北方各族杂居，鲜卑统治者需要学习汉族先进文化，加强对中原地区的统治。","迁都：494 年孝文帝迁都洛阳，以便更好地吸收汉族文化、控制中原。","汉化措施：朝廷中改用汉语、禁说鲜卑语；改穿汉服；改汉姓（拓跋改元）；与汉族通婚；采用汉制、学习汉礼。","交融表现：内迁各族学习农业生产，汉族接受胡床、胡饼等；各族在制度、文化、生活上互相影响。","北朝更替：北魏后期分裂为东魏、西魏，又演变为北齐、北周；577 年北周灭北齐，581 年杨坚代周建隋。"],"terms":[["北魏","鲜卑族拓跋部建立的政权，386 年建立，439 年统一北方。"],["孝文帝改革","北魏孝文帝推行的汉化改革，包括迁都洛阳、说汉语、穿汉服、改汉姓、与汉族通婚等。"],["民族交融","各民族在长期杂居相处中，生产、生活、制度、文化互相学习、互相影响，差距逐渐缩小、隔阂逐渐消减的过程。"],["北朝","北魏、东魏、西魏、北齐、北周五个政权的合称，它们与南方的南朝对峙。"]],"figures":[["拓跋宏（孝文帝）","迁都洛阳，推行汉化改革"],["冯太后","辅佐孝文帝，推动改革"],["杨坚","代周建隋，589 年统一全国"]],"events":[["386 年","拓跋部建立北魏"],["439 年","北魏统一北方"],["494 年","孝文帝迁都洛阳"],["577 年","北周灭北齐"],["581 年","杨坚建立隋朝"]],"treaty":null,"significance":"孝文帝改革促进了北方民族大交融，增强了北魏的实力，也加速了鲜卑等族的封建化进程；民族交融为隋唐统一多民族国家的繁荣奠定了基础。","source":{"quote":"今欲断诸北语，一从正音。年三十以上，习性已久，容或不可卒革。","from":"《魏书·咸阳王禧传》（北齐）"},"pitfall":"北魏由鲜卑族拓跋部建立，不是匈奴；孝文帝改革是少数民族学习汉族；北魏统一北方在 439 年，不是 386 年建国。","memory":"拓跋建魏都平城，四三九统一北方；孝文迁洛行汉化，民族交融隋唐兴。","link":"北朝的民族交融与南朝的江南开发同时展开，一北一南，为隋朝结束分裂、唐朝走向繁荣准备了条件。","exam":["北魏孝文帝改革的措施与作用","北方民族交融的表现","北朝的政权更替"]},{"id":"a4l5","num":20,"unit":"a4","title":"三国两晋南北朝时期的科技与文化","years":"220—589 年","icon":"📐","tag":"文化","hook":"在政权更迭最频繁的三百多年里，有人把圆周率算到小数点后第七位，有人走遍江河写下《水经注》，有人在兰亭曲水流觞间写下行书第一。","core":"三国两晋南北朝时期，农学、数学、地理学成就突出：贾思勰著《齐民要术》，祖冲之把圆周率精确到小数点后第七位，郦道元著《水经注》；书法、绘画、石窟艺术也达到很高水平。","points":["农学：北朝贾思勰著《齐民要术》，总结北方农牧业生产经验，是我国现存最早的一部完整的农书。","数学：南朝祖冲之把圆周率精确到小数点后第七位，领先世界近千年，著有《缀术》，制定《大明历》。","地理：北魏郦道元著《水经注》，以水道为纲，记述河流、地形、物产、风俗，是一部综合性地理著作。","书法：曹魏钟繇擅楷书；东晋王羲之被尊为“书圣”，《兰亭集序》被誉为“天下第一行书”。","绘画与雕塑：东晋顾恺之《女史箴图》《洛神赋图》；山西大同云冈石窟、河南洛阳龙门石窟。","思想与文学：佛教盛行，范缜著《神灭论》反对佛教；陶渊明写田园诗，南北朝民歌有《木兰诗》《敕勒歌》。"],"terms":[["《齐民要术》","北朝贾思勰所著农书，总结北方农牧业生产经验，是我国现存最早的一部完整农书。"],["《水经注》","北魏郦道元所著地理著作，以水道为纲，记述河道、地形、物产和风俗。"],["《兰亭集序》","东晋王羲之的行书作品，被誉为“天下第一行书”，王羲之因此被称为“书圣”。"],["《神灭论》","南朝范缜所著，主张形神相即、形体死亡精神随之消灭，批判佛教的神不灭论。"]],"figures":[["贾思勰","北朝农学家，著《齐民要术》"],["祖冲之","南朝数学家、天文学家，精确计算圆周率"],["郦道元","北魏地理学家，著《水经注》"],["王羲之","东晋书法家，被称为“书圣”"],["顾恺之","东晋画家，代表作《洛神赋图》"]],"events":[["353 年","王羲之书写《兰亭集序》"],["约 5 世纪","祖冲之把圆周率精确到小数点后第七位"],["约 6 世纪","贾思勰著《齐民要术》"],["约 6 世纪","郦道元著《水经注》"]],"treaty":null,"significance":"这一时期的科技文化成就承前启后，农学、数学、地理学长期领先世界，书法绘画成为中华艺术的经典，为隋唐文化的繁荣奠定基础。","source":{"quote":"两岸连山，略无阙处。重岩叠嶂，隐天蔽日。","from":"郦道元《水经注·江水》（北魏）"},"pitfall":"祖冲之是南朝人，《齐民要术》是北朝农书，不要张冠李戴；《水经注》是地理著作，不是农书；《兰亭集序》是行书，不是楷书。","memory":"贾氏要术祖冲之，水经注里写山川；书圣兰亭顾恺之，云冈龙门石窟传。","link":"这一时期的文化成就上承秦汉、下启隋唐；南北方的开发与民族交融，为隋唐大一统和文化高峰提供了物质与人才基础。","exam":["祖冲之与圆周率","《齐民要术》《水经注》的作者与价值","王羲之与《兰亭集序》"]}],"questions":[{"id":"a4q1","lesson":"a4l1","unit":"a4","type":"choice","level":1,"stem":"为三国鼎立局面的形成奠定基础的战役是","options":["官渡之战","赤壁之战","淝水之战","巨鹿之战"],"answer":1,"explain":"208 年赤壁之战，孙刘联军以少胜多击败曹操，为三国鼎立局面的形成奠定基础。官渡之战为曹操统一北方奠定基础；淝水之战发生在东晋。","point":"赤壁之战"},{"id":"a4q2","lesson":"a4l1","unit":"a4","type":"choice","level":1,"stem":"220 年称帝建立魏国、定都洛阳的是","options":["曹操","曹丕","刘备","孙权"],"answer":1,"explain":"220 年曹丕称帝，国号魏，定都洛阳。曹操已于 220 年去世，是东汉末年人物；刘备 221 年称帝，孙权 229 年称帝。","point":"三国鼎立的形成"},{"id":"a4q3","lesson":"a4l1","unit":"a4","type":"order","level":2,"stem":"按时间先后排列三国鼎立形成过程中的大事","items":["官渡之战","赤壁之战","曹丕称帝建魏","刘备称帝建蜀汉","孙权称帝建吴"],"explain":"200 年官渡之战 → 208 年赤壁之战 → 220 年曹丕称帝 → 221 年刘备称帝 → 229 年孙权称帝。","point":"三国鼎立的过程"},{"id":"a4q4","lesson":"a4l1","unit":"a4","type":"fill","level":1,"stem":"230 年，孙权派将军______率船队到达夷洲，加强了大陆与台湾的联系。","answer":["卫温"],"explain":"230 年孙权派卫温率船队到达夷洲（今台湾），这是史书上关于大陆与台湾联系的重要记载。","point":"三国时期的经济与夷洲"},{"id":"a4q5","lesson":"a4l2","unit":"a4","type":"choice","level":1,"stem":"建立西晋、并于 280 年灭吴统一全国的是","options":["司马懿","司马昭","司马炎","司马睿"],"answer":2,"explain":"266 年司马炎代魏称帝，建立西晋，280 年灭吴统一全国。司马睿于 317 年重建晋朝，史称东晋。","point":"西晋的建立与统一"},{"id":"a4q6","lesson":"a4l2","unit":"a4","type":"choice","level":2,"stem":"西晋末年，严重削弱西晋统治、导致中原人口大量南迁的事件是","options":["八王之乱","黄巾起义","淝水之战","赤壁之战"],"answer":0,"explain":"291—306 年，西晋皇族为争夺皇位混战，史称八王之乱，中原人口大量死亡，幸存者纷纷南迁。黄巾起义发生在东汉末年。","point":"八王之乱"},{"id":"a4q7","lesson":"a4l2","unit":"a4","type":"match","level":2,"stem":"把下列事件与其发生的时间配对","pairs":[["266 年","司马炎建立西晋"],["280 年","西晋灭吴，统一全国"],["316 年","西晋灭亡"],["317 年","司马睿重建晋朝，史称东晋"]],"explain":"西晋 266 年建立，280 年统一，316 年灭亡；317 年司马睿在建康重建晋朝，史称东晋。","point":"西晋的兴亡"},{"id":"a4q8","lesson":"a4l2","unit":"a4","type":"fill","level":1,"stem":"从东汉末年起，匈奴、鲜卑、羯、氐、羌等族陆续内迁，历史上常称为“______”。","answer":["五胡"],"explain":"“五胡”是习惯说法，内迁民族不止五个；到西晋时，内迁各族人口已达数百万，与汉族杂居。","point":"北方各族的内迁"},{"id":"a4q9","lesson":"a4l3","unit":"a4","type":"choice","level":1,"stem":"317 年在建康重建晋朝、史称东晋的是","options":["司马炎","司马睿","刘裕","苻坚"],"answer":1,"explain":"317 年司马睿在建康重建晋朝，史称东晋。司马炎建立西晋；刘裕 420 年建立宋；苻坚是前秦君主。","point":"东晋的建立"},{"id":"a4q10","lesson":"a4l3","unit":"a4","type":"choice","level":3,"stem":"东晋南朝时期江南地区得到开发，最主要的原因是","options":["江南自然条件优越","北方人口南迁带来劳动力、生产工具和技术","南方社会比较安定","南方统治者重视农业"],"answer":1,"explain":"四项都是江南开发的原因，但北方人口大量南迁，带来劳动力、先进生产工具和技术，是最主要的原因。","point":"江南开发的原因"},{"id":"a4q11","lesson":"a4l3","unit":"a4","type":"order","level":2,"stem":"按时间先后排列下列事件","items":["东晋建立","淝水之战","刘裕建立宋","隋灭陈，统一全国"],"explain":"317 年东晋建立 → 383 年淝水之战 → 420 年刘裕建立宋 → 589 年隋灭陈。","point":"东晋南朝的历史脉络"},{"id":"a4q12","lesson":"a4l3","unit":"a4","type":"fill","level":1,"stem":"383 年，东晋在______之战中以少胜多，击败前秦军队。","answer":["淝水"],"explain":"383 年淝水之战，东晋以少胜多击败前秦，前秦瓦解，北方重新陷入分裂。","point":"淝水之战"},{"id":"a4q13","lesson":"a4l4","unit":"a4","type":"choice","level":1,"stem":"439 年统一北方、结束十六国以来分裂割据局面的政权是","options":["前秦","北魏","东魏","北周"],"answer":1,"explain":"386 年鲜卑族拓跋部建立北魏，439 年统一北方。前秦曾在 4 世纪后期统一北方，但淝水之战后瓦解。","point":"北魏统一北方"},{"id":"a4q14","lesson":"a4l4","unit":"a4","type":"choice","level":2,"stem":"下列不属于北魏孝文帝改革措施的是","options":["迁都洛阳","在朝廷中使用汉语、禁说鲜卑语","改鲜卑姓为汉姓，与汉族通婚","用科举考试选拔官员"],"answer":3,"explain":"科举制创立于隋朝，不是北魏的措施。迁都洛阳、说汉语、穿汉服、改汉姓、与汉族通婚都是孝文帝改革的内容。","point":"北魏孝文帝改革"},{"id":"a4q15","lesson":"a4l4","unit":"a4","type":"order","level":2,"stem":"按时间先后排列北朝时期的重大事件","items":["拓跋部建立北魏","北魏统一北方","孝文帝迁都洛阳","北周灭北齐","杨坚建立隋朝"],"explain":"386 年北魏建立 → 439 年统一北方 → 494 年迁都洛阳 → 577 年北周灭北齐 → 581 年杨坚建立隋朝。","point":"北朝的政权更替"},{"id":"a4q16","lesson":"a4l4","unit":"a4","type":"fill","level":1,"stem":"494 年，北魏孝文帝把都城从平城迁到______，以便更好地学习汉族文化、加强对中原的控制。","answer":["洛阳"],"explain":"494 年孝文帝迁都洛阳，随后推行说汉语、穿汉服、改汉姓、与汉族通婚等汉化措施。","point":"孝文帝迁都"},{"id":"a4q17","lesson":"a4l5","unit":"a4","type":"choice","level":1,"stem":"我国现存最早的一部完整的农书是","options":["《水经注》","《齐民要术》","《缀术》","《神灭论》"],"answer":1,"explain":"北朝贾思勰所著《齐民要术》是我国现存最早的一部完整的农书。《水经注》是地理著作，《缀术》是数学著作。","point":"《齐民要术》"},{"id":"a4q18","lesson":"a4l5","unit":"a4","type":"choice","level":2,"stem":"把圆周率精确到小数点后第七位的南朝科学家是","options":["贾思勰","郦道元","祖冲之","王羲之"],"answer":2,"explain":"南朝祖冲之把圆周率精确到小数点后第七位，即 3.1415926 到 3.1415927 之间，领先世界近千年。","point":"祖冲之与圆周率"},{"id":"a4q19","lesson":"a4l5","unit":"a4","type":"match","level":2,"stem":"把下列人物与其文化成就配对","pairs":[["贾思勰","《齐民要术》"],["祖冲之","把圆周率精确到小数点后第七位"],["郦道元","《水经注》"],["顾恺之","《洛神赋图》"]],"explain":"贾思勰著农书《齐民要术》；祖冲之精算圆周率；郦道元著地理著作《水经注》；顾恺之是东晋画家，代表作有《洛神赋图》。","point":"三国两晋南北朝的文化成就"},{"id":"a4q20","lesson":"a4l5","unit":"a4","type":"fill","level":1,"stem":"东晋书法家______被后人尊称为“书圣”，其代表作《兰亭集序》被誉为“天下第一行书”。","answer":["王羲之"],"explain":"东晋王羲之擅长行书，《兰亭集序》被誉为“天下第一行书”，他被后人尊称为“书圣”。","point":"王羲之与《兰亭集序》"}],"timeline":[{"t":"220 年","y":220,"text":"曹丕称帝，建立魏国，定都洛阳，东汉灭亡。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"229 年","y":229,"text":"孙权在建业称帝，建立吴国，三国鼎立局面形成。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"280 年","y":280,"text":"西晋灭吴，结束三国分裂局面，统一全国。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"291—306 年","y":291,"text":"八王之乱爆发，西晋统治严重削弱，中原人口大量南迁。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"316 年","y":316,"text":"内迁匈奴人的一支攻占长安，西晋灭亡。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"317 年","y":317,"text":"司马睿在建康重建晋朝，史称东晋。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"383 年","y":383,"text":"淝水之战，东晋以少胜多击败前秦，前秦瓦解。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"439 年","y":439,"text":"北魏统一北方，结束十六国以来的分裂割据局面。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"494 年","y":494,"text":"北魏孝文帝迁都洛阳，推行汉化改革。","unit":"a4","tag":"中国古代","volume":"v1"},{"t":"589 年","y":589,"text":"隋灭陈，结束南北朝分裂，重新统一全国。","unit":"a4","tag":"中国古代","volume":"v1"}]},{"volume":"v2","unit":{"id":"b1","volume":"v2","num":1,"title":"隋唐时期：繁荣与开放的时代","short":"隋唐气象","years":"581—907 年","accent":"#7E5B8C","soft":"#F1E7F3","tint":"#DCC9E2","icon":"🏯","tagline":"从隋的统一到唐的鼎盛，开放与交流铸就气象恢宏的盛世。","intro":"581 年，分裂近三百年的中国重新统一。隋唐两朝接连创新：科举取士、运河通航、贞观之治、开元盛世，长安成为世界性大都市。本单元要回答的是：这样的繁荣与开放如何形成，又为何在安史之乱后由盛转衰。","bigQuestion":"隋朝二世而亡，唐朝却在极盛之后急转直下——繁荣与开放为何没能让王朝长久？","goals":["说出隋朝统一、开凿大运河和创立科举制的史实。","理解贞观之治、开元盛世出现的原因与主要表现。","举例说明唐朝中外文化交流的双向性与开放气象。","分析安史之乱为何成为唐朝由盛转衰的转折点。"],"keyLine":"隋统一 → 贞观之治 → 开元盛世 → 鉴真玄奘双向交流 → 安史之乱 → 907 年唐亡。"},"lessons":[{"id":"b1l1","num":1,"unit":"b1","title":"隋朝统一与灭亡","years":"581—618 年","icon":"🚢","tag":"隋","hook":"589 年正月，建康城头的陈朝旗帜落下。长江上，隋军战船遮天蔽日。分裂了近三百年的南北，重新合成一个国家。","core":"581 年杨坚建立隋朝，589 年灭陈统一全国。隋朝创立科举制、开凿大运河，国力一度强盛；但隋炀帝滥用民力，618 年隋朝在农民起义中灭亡。","points":["581 年，杨坚夺取北周政权，建立隋朝，定都大兴，他就是隋文帝。","589 年，隋军南下灭陈，统一全国，结束了魏晋南北朝以来长期分裂的局面。","隋文帝发展经济、编订户籍、统一南北币制和度量衡，加强中央集权，国力迅速强盛。","605 年起，隋炀帝开凿大运河，以洛阳为中心，北抵涿郡，南至余杭，全长 2000 多千米。","隋文帝初步建立考试选官制度，隋炀帝设进士科，科举制正式确立，选官权收归中央。","隋炀帝营建东都洛阳，三次征辽东，徭役兵役沉重，618 年在江都被部下杀死，隋朝灭亡。"],"terms":[["大运河","隋炀帝时开凿，以洛阳为中心，北抵涿郡，南至余杭，全长 2000 多千米，是古代世界最长的运河。"],["科举制","通过考试选拔官吏的制度。隋文帝初步建立，隋炀帝设进士科后正式确立，扩大了官吏选拔范围。"],["进士科","科举考试的重要科目，隋炀帝时创立。此后逐渐成为最重要的科目，读书人可凭才学入仕。"],["江都","今江苏扬州。618 年，隋炀帝在江都被部下杀死，隋朝随之灭亡。"]],"figures":[["隋文帝（杨坚）","建立隋朝，统一南北，发展经济，编订户籍，开创考试选官制度"],["隋炀帝（杨广）","开凿大运河，设进士科，又滥用民力、三征辽东，导致隋朝灭亡"]],"events":[["581 年","杨坚建立隋朝，定都大兴"],["589 年","隋灭陈，统一全国"],["605 年","隋炀帝下令开凿大运河"],["618 年","隋炀帝在江都被杀，隋朝灭亡"]],"treaty":null,"significance":"隋朝虽只存在 37 年，却结束了长期分裂，创立的科举制和大运河影响深远：科举制为历代王朝沿用一千三百多年，大运河至今仍是南北水运的重要通道。","source":{"quote":"尽道隋亡为此河，至今千里赖通波。","from":"皮日休《汴河怀古》（唐）"},"pitfall":"科举制正式确立于隋炀帝设进士科，不是隋文帝；大运河以洛阳为中心，不是以长安为中心，也不能说“隋朝因开运河而亡”。","memory":"五八一隋建立，五八九统南北；炀帝开河设进士，六一八亡江都。","link":"隋朝统一为唐朝的繁荣奠定基础；它创立的科举制、开凿的大运河，正是下一课“贞观之治”的起点。","exam":["隋朝统一的意义","大运河的路线与作用","科举制创立的过程与影响"]},{"id":"b1l2","num":2,"unit":"b1","title":"唐朝建立与“贞观之治”","years":"618—649 年","icon":"👑","tag":"唐","hook":"贞观年间的一天，魏征在朝堂上当面顶撞皇帝，把唐太宗气得回宫摔杯子。可第二天，皇帝还是照他的意见改了诏令。","core":"618 年李渊建立唐朝，626 年李世民即位。唐太宗吸取隋亡教训，虚心纳谏、革新制度、减轻赋役，出现“贞观之治”，为唐朝的强盛奠定基础。","points":["618 年，李渊在长安称帝，建立唐朝，他就是唐高祖；随后唐朝逐步统一全国。","626 年，李世民即位，次年改年号“贞观”，他就是唐太宗。","唐太宗吸取隋朝速亡的教训，勤于政事，认为“为君之道，必须先存百姓”。","政治上完善三省六部制，制定法律、减省刑罚；增加科举考试科目，进士科逐渐成为最重要的科目。","经济上减轻百姓的田租和劳役负担，鼓励发展农业生产；严格考核官吏政绩，吏治比较清明。","虚心纳谏，魏征前后进谏二百多次；重用房玄龄、杜如晦，史称“房谋杜断”。"],"terms":[["贞观之治","唐太宗统治期间，政治比较清明，经济得到进一步发展，国力增强，文教昌盛，史称“贞观之治”。"],["三省六部制","隋唐中央官制。中书省起草政令，门下省审议，尚书省执行，下设六部，分工明确、互相牵制。"],["天可汗","唐太宗实行开明的民族政策，被西北各族首领共同尊奉的称号，是民族交融的见证。"],["唐蕃和亲","641 年文成公主入藏，与吐蕃赞普松赞干布和亲，促进了吐蕃经济和社会的发展，增进了唐蕃友好。"]],"figures":[["唐太宗（李世民）","即位后改元贞观，虚心纳谏，革新制度，开创“贞观之治”"],["魏征","敢于直言进谏，前后进谏二百多次，被唐太宗视为可以知得失的“人镜”"],["房玄龄","善于谋略，与杜如晦并称“房谋杜断”，是贞观名相"],["文成公主","641 年入藏和亲，带去大量工匠、书籍和谷物种子，促进唐蕃交流"]],"events":[["618 年","李渊建立唐朝，定都长安"],["626 年","李世民即位，次年改元贞观"],["641 年","文成公主入藏，唐蕃和亲"],["649 年","唐太宗去世"]],"treaty":null,"significance":"“贞观之治”使唐朝国力增强、社会安定，为开元盛世打下基础；唐太宗开明的民族政策推动了民族交融，唐朝由此成为当时世界上最富强的国家之一。","source":{"quote":"以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。","from":"《旧唐书·魏征传》（643 年）"},"pitfall":"“贞观之治”出现在唐太宗时期，不是唐玄宗时期；三省六部制始于隋朝、完善于唐朝，不要记成唐太宗首创。","memory":"六一八唐建立，六二六贞观始；三省六部加纳谏，文成入藏天可汗。","link":"承接隋朝的统一与制度创新，贞观之治让唐朝站稳脚跟，为下一课开元盛世的鼎盛局面蓄力。","exam":["贞观之治的原因与表现","唐太宗的治国措施","文成公主入藏与民族交融"]},{"id":"b1l3","num":3,"unit":"b1","title":"开元盛世","years":"713—741 年","icon":"🌸","tag":"唐","hook":"开元年间，长安西市驼铃不断，胡商把香料、宝石摆上柜台；东市的绢帛堆到屋檐。这座百万人口的城市，是当时世界上最繁华的都市。","core":"唐玄宗即位后整顿吏治、发展经济、任用贤能，唐朝进入鼎盛时期，史称“开元盛世”。农业、手工业和商业全面繁荣，长安成为国际性大都市。","points":["712 年，李隆基即位，次年改年号“开元”，他就是唐玄宗。","整顿吏治，裁减冗员；任用姚崇、宋璟等贤相，重视地方官员的选拔和考核。","发展经济，改革税制，兴修水利；农业生产技术改进，发明曲辕犁和筒车。","手工业发达：蜀锦色彩艳丽，越窑青瓷、邢窑白瓷闻名，唐三彩是陶器珍品。","商业繁荣：长安城坊市分开，东市、西市商铺林立，人口上百万，是国际性大都市。","结果：政治稳定，经济繁荣，国库充盈，民众生活安定，唐朝进入鼎盛时期。"],"terms":[["开元盛世","唐玄宗统治前期，政治稳定，经济繁荣，国库充盈，民众生活安定，唐朝国力达到前所未有的强大，史称“开元盛世”。"],["曲辕犁","唐代改进的耕地工具，轻便灵活，可以调节犁地深浅，提高了耕作效率，在江南地区推广。"],["筒车","唐代出现的灌溉工具，以水流为动力，把水提升到高处灌溉农田，节省人力。"],["唐三彩","唐代烧制的彩色釉陶，以黄、绿、白为主色，造型生动，是闻名世界的工艺品。"]],"figures":[["唐玄宗（李隆基）","即位后励精图治，任用贤能，开创“开元盛世”；后期怠于政事，酿成安史之乱"],["姚崇","开元初年名相，提出十条治国建议，被称为“救时之相”"],["宋璟","与姚崇并称的贤相，为官刚正，敢于直言进谏"]],"events":[["712 年","李隆基即位"],["713 年","改年号为“开元”，开始改革"],["741 年","开元年间结束，唐朝国力达到鼎盛"]],"treaty":null,"significance":"开元时期，唐朝国力达到前所未有的强大，长安成为国际性大都市，丝绸、瓷器远销海外；这种繁荣也为下一课的中外文化交流提供了物质基础。","source":{"quote":"忆昔开元全盛日，小邑犹藏万家室。稻米流脂粟米白，公私仓廪俱丰实。","from":"杜甫《忆昔二首》（唐）"},"pitfall":"曲辕犁是耕地工具，筒车是灌溉工具，不要混淆；开元盛世出现在唐玄宗前期，不是唐太宗时期。","memory":"七一三开元始，姚崇宋璟治天下；曲辕犁加筒车转，长安西市聚万商。","link":"贞观之治打基础，开元盛世到顶峰；盛极之后，唐玄宗后期的怠政埋下了安史之乱的祸根。","exam":["开元盛世出现的原因","唐朝经济繁荣的表现","曲辕犁、筒车与唐三彩"]},{"id":"b1l4","num":4,"unit":"b1","title":"唐朝的中外文化交流","years":"618—907 年","icon":"🐫","tag":"唐","hook":"754 年，日本九州的海面上，一位双目失明的老僧被人扶下船。他叫鉴真，第六次东渡，终于踏上了日本的土地。","core":"唐朝国力强盛、政策开放，中日、中印之间往来频繁。鉴真东渡、玄奘西行、日本遣唐使来华，构成双向交流的盛况，中华文化远播海外。","points":["背景：唐朝国力强盛，经济文化发达，海陆交通便利，统治者实行开放的对外政策。","日本先后十几次派遣唐使来华，把唐朝的制度、文字、建筑、艺术等带回日本，深刻影响日本社会发展。","阿倍仲麻吕（晁衡）来唐学习并任官，与李白、王维交好，是中日友好的见证。","鉴真六次东渡，754 年到达日本，传授佛法与医药、建筑技艺，主持修建唐招提寺。","玄奘于贞观初年西行天竺，在那烂陀寺学习，645 年回到长安，带回大量佛经并主持翻译。","玄奘口述《大唐西域记》，记载 100 多个国家和地区的山川风物、社会习俗，是研究中外交流史的珍贵文献。"],"terms":[["遣唐使","日本派往唐朝的使团。日本先后十几次派遣唐使来华，学习唐朝制度与文化，对日本社会发展产生深远影响。"],["《大唐西域记》","玄奘口述、弟子记录，记载他西行途中 100 多个国家和地区的山川风物与社会习俗，是珍贵的历史文献。"],["唐招提寺","鉴真到达日本后主持修建的寺院，是日本佛教律宗的重要道场，也是中日文化交流的见证。"],["天竺","中国古代对印度的称呼。玄奘西行到此学习佛法，带回大量佛经。"]],"figures":[["鉴真","六次东渡，754 年到达日本，传播佛法与中华文化，主持修建唐招提寺"],["玄奘","西行天竺取经，回国后主持译经，口述《大唐西域记》"],["阿倍仲麻吕","日本人，来唐学习并任官，与李白、王维交好，是中日友好的见证"]],"events":[["贞观初年","玄奘从长安出发，西行天竺"],["645 年","玄奘回到长安，带回大量佛经"],["754 年","鉴真第六次东渡，到达日本"]],"treaty":null,"significance":"唐朝的对外交流是双向的：既把制度、文字、技术、艺术传到日本等国，也吸收外来的宗教、物产与艺术。开放包容使唐朝成为当时世界上最具影响力的国家之一。","source":{"quote":"是为法事也，何惜身命？诸人不去，我即去耳。","from":"《唐大和上东征传》（779 年）"},"pitfall":"玄奘是“西行天竺取经”，不是去日本；鉴真是“东渡日本”，不是去天竺。两人方向相反，不要记混。","memory":"玄奘西行取真经，鉴真东渡传佛法；遣唐使来学制度，双向交流盛唐风。","link":"上一课的经济繁荣为交流提供底气；唐朝的开放气象，也在下一课的由盛转衰中留下余韵。","exam":["鉴真东渡与玄奘西行的比较","遣唐使与唐朝对外政策","《大唐西域记》的史料价值"]},{"id":"b1l5","num":5,"unit":"b1","title":"安史之乱与唐朝衰亡","years":"755—907 年","icon":"🔥","tag":"唐","hook":"755 年冬天，范阳城外的军营里火把连成一片。安禄山以“讨伐杨国忠”为名起兵，十五万大军南下。消息传到长安，唐玄宗不敢相信。","core":"755 年安禄山、史思明发动叛乱，历时八年。安史之乱使唐朝国势由盛转衰，形成藩镇割据；此后黄巢起义沉重打击唐朝，907 年朱温建后梁，唐朝灭亡。","points":["背景：唐玄宗后期追求享乐，不理朝政，任用李林甫、杨国忠等奸臣，朝政日趋腐败。","节度使掌握军事、财政大权，势力不断膨胀，中央与地方力量失衡，社会矛盾日益尖锐。","经过：755 年安禄山在范阳起兵，攻占洛阳、长安；唐玄宗逃往蜀地，太子李亨即位，763 年叛乱被平定。","影响：北方经济遭到极大破坏，唐朝国势由盛转衰；中央权力衰微，逐渐形成藩镇割据局面。","黄巢起义：875 年爆发，转战南北，一度攻入长安，给唐朝统治以致命打击，884 年失败。","907 年，朱温建立后梁政权，唐朝灭亡；此后出现“五代十国”的分裂局面。"],"terms":[["安史之乱","755—763 年，安禄山、史思明发动的叛乱。它是唐朝由盛转衰的转折点，战后形成藩镇割据局面。"],["藩镇割据","安史之乱后，各地节度使拥兵自重，自行任免官吏、征收赋税，不听中央号令，形成割据局面。"],["黄巢起义","875 年爆发的农民起义，转战大半个中国，一度攻入长安，给唐朝统治以致命打击。"],["五代十国","唐朝灭亡后，北方黄河流域相继出现五个政权，南方出现十个割据政权，是藩镇割据局面的延续。"]],"figures":[["安禄山","范阳节度使，755 年以讨伐杨国忠为名起兵，发动叛乱"],["史思明","与安禄山一起发动叛乱，叛军一度攻占洛阳、长安"],["唐玄宗","后期怠于政事，酿成安史之乱，被迫逃往蜀地"],["朱温","原为黄巢部将，后降唐，907 年建立后梁，唐朝灭亡"]],"events":[["755 年","安禄山在范阳起兵，安史之乱爆发"],["763 年","安史之乱被平定"],["875 年","黄巢起义爆发"],["907 年","朱温建立后梁，唐朝灭亡"]],"treaty":null,"significance":"安史之乱是唐朝由盛转衰的转折点：北方经济凋敝，中央集权削弱，藩镇割据延续到唐末；五代十国的分裂，正是这一局面的延续。","source":{"quote":"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。","from":"杜甫《春望》（757 年）"},"pitfall":"安史之乱爆发于 755 年，平定于 763 年，共八年，不是“乱后唐朝立刻灭亡”；唐朝灭亡是 907 年朱温建立后梁。","memory":"七五五安史乱，八年战火盛转衰；八七五黄巢起，九〇七唐灭亡。","link":"开元盛世是顶点，安史之乱是转折；藩镇割据与五代十国的分裂，为下一单元的重新统一埋下伏笔。","exam":["安史之乱的原因与影响","唐朝由盛转衰的转折点","黄巢起义与唐朝灭亡"]}],"questions":[{"id":"b1q1","lesson":"b1l1","unit":"b1","type":"choice","level":1,"stem":"隋朝完成全国统一，结束长期分裂局面是在","options":["581 年","589 年","605 年","618 年"],"answer":1,"explain":"589 年隋军南下灭陈，统一全国。581 年是隋朝建立，605 年开始开凿大运河，618 年隋朝灭亡。","point":"隋朝的统一"},{"id":"b1q2","lesson":"b1l1","unit":"b1","type":"choice","level":2,"stem":"科举制正式确立的标志是","options":["隋文帝初步分科考试选拔官员","隋炀帝设立进士科","唐太宗增加科举考试科目","武则天创立殿试"],"answer":1,"explain":"隋文帝只是初步建立通过考试选官的制度，隋炀帝设进士科，科举制才正式确立。唐太宗、武则天是后来的完善与发展。","point":"科举制的创立"},{"id":"b1q3","lesson":"b1l1","unit":"b1","type":"order","level":2,"stem":"按时间先后排列隋朝的主要事件","items":["杨坚夺取北周政权，建立隋朝","隋军南下灭陈，统一全国","隋文帝编订户籍，统一南北币制","隋炀帝下令开凿大运河","隋炀帝在江都被部下杀死"],"explain":"581 年建隋 → 589 年灭陈统一 → 隋文帝在位时编订户籍、统一币制 → 605 年开凿大运河 → 618 年隋炀帝被杀、隋朝灭亡。","point":"隋朝的兴亡过程"},{"id":"b1q4","lesson":"b1l1","unit":"b1","type":"fill","level":1,"stem":"隋炀帝时开凿的大运河，以______为中心，北抵涿郡，南至余杭。","answer":["洛阳"],"explain":"大运河以洛阳为中心，北抵涿郡（今北京），南至余杭（今杭州），加强了南北地区政治、经济和文化交流。","point":"大运河的路线"},{"id":"b1q5","lesson":"b1l2","unit":"b1","type":"choice","level":1,"stem":"唐太宗统治时期出现的治世局面被称为","options":["文景之治","光武中兴","贞观之治","开元盛世"],"answer":2,"explain":"唐太宗年号“贞观”，其统治期间政治清明、经济发展，史称“贞观之治”。开元盛世出现在唐玄宗时期。","point":"贞观之治"},{"id":"b1q6","lesson":"b1l2","unit":"b1","type":"choice","level":2,"stem":"下列唐太宗的措施中，直接有利于扩大官吏来源的是","options":["完善三省六部制","增加科举考试科目，鼓励士人报考","减轻百姓的田租和劳役","严格考核各级官吏的政绩"],"answer":1,"explain":"增加科举科目、鼓励士人报考，使更多读书人有机会入仕，直接扩大了官吏来源。其余三项属于政治制度、经济政策和吏治考核。","point":"唐太宗的治国措施"},{"id":"b1q7","lesson":"b1l2","unit":"b1","type":"match","level":2,"stem":"把下列人物与其主要事迹配对","pairs":[["房玄龄","善于谋略"],["杜如晦","敢于决断"],["魏征","直言进谏二百多次"],["文成公主","入藏和亲，促进唐蕃交流"]],"explain":"房玄龄、杜如晦合称“房谋杜断”；魏征以敢于直谏著称；641 年文成公主入藏，与松赞干布和亲。","point":"贞观名臣与民族交往"},{"id":"b1q8","lesson":"b1l2","unit":"b1","type":"choice","level":3,"stem":"唐太宗说：“为君之道，必须先存百姓。”这句话反映的治国理念是","options":["以法治国，严刑峻法","以民为本，关注民生","无为而治，与民休息","重农抑商，闭关自守"],"answer":1,"explain":"“先存百姓”强调百姓生计是治国前提，唐太宗因此减轻田租劳役、鼓励农业生产，体现了以民为本的思想。","point":"唐太宗的治国理念"},{"id":"b1q9","lesson":"b1l3","unit":"b1","type":"choice","level":1,"stem":"唐朝时发明并推广，可以调节犁地深浅的耕地工具是","options":["耧车","曲辕犁","筒车","翻车"],"answer":1,"explain":"曲辕犁是唐代改进的耕地工具，轻便灵活、可调深浅。筒车是灌溉工具，耧车是汉代播种工具，翻车是灌溉工具。","point":"唐朝的农业生产工具"},{"id":"b1q10","lesson":"b1l3","unit":"b1","type":"choice","level":2,"stem":"“开元盛世”出现在","options":["唐太宗统治时期","武则天统治时期","唐玄宗统治前期","唐玄宗统治后期"],"answer":2,"explain":"712 年李隆基即位，次年改元开元，他统治前期励精图治，唐朝进入鼎盛时期。唐玄宗后期怠于政事，酿成安史之乱。","point":"开元盛世"},{"id":"b1q11","lesson":"b1l3","unit":"b1","type":"match","level":2,"stem":"把下列唐代事物与其类别配对","pairs":[["曲辕犁","耕地工具"],["筒车","灌溉工具"],["唐三彩","彩色釉陶工艺品"],["长安东市、西市","商业区"]],"explain":"曲辕犁用于耕地，筒车用于灌溉；唐三彩是唐代著名陶器；长安城坊市分开，东市、西市是集中交易的商业区。","point":"唐朝经济繁荣的表现"},{"id":"b1q12","lesson":"b1l3","unit":"b1","type":"choice","level":3,"stem":"杜甫诗句“忆昔开元全盛日，小邑犹藏万家室。稻米流脂粟米白，公私仓廪俱丰实”可以直接用来说明","options":["开元时期人口增长、粮食储备充足","安史之乱对北方经济的破坏","唐朝科举制度的不断完善","唐朝对外交通的发达"],"answer":0,"explain":"“小邑犹藏万家室”写人口之多，“公私仓廪俱丰实”写粮食储备之足，正对应开元时期农业繁荣、国力强盛。","point":"开元时期的经济繁荣"},{"id":"b1q13","lesson":"b1l4","unit":"b1","type":"choice","level":1,"stem":"唐朝时六次东渡、最终到达日本传播中华文化的僧人是","options":["玄奘","鉴真","法显","一行"],"answer":1,"explain":"鉴真六次东渡，754 年到达日本，传授佛法与医药、建筑技艺。玄奘是西行天竺取经。","point":"鉴真东渡"},{"id":"b1q14","lesson":"b1l4","unit":"b1","type":"choice","level":2,"stem":"贞观初年，玄奘从长安出发西行取经，他的目的地是","options":["日本","天竺","波斯","大食"],"answer":1,"explain":"天竺是中国古代对印度的称呼。玄奘到天竺那烂陀寺学习佛法，645 年回到长安。","point":"玄奘西行"},{"id":"b1q15","lesson":"b1l4","unit":"b1","type":"order","level":2,"stem":"按时间先后排列下列中外交流事件","items":["玄奘从长安出发，西行天竺","玄奘到达天竺，在那烂陀寺学习","玄奘回到长安，带回大量佛经","鉴真第六次东渡，到达日本"],"explain":"玄奘于贞观初年出发西行，在天竺游学多年，645 年回到长安；鉴真 754 年第六次东渡成功到达日本。","point":"唐朝中外交流的史实"},{"id":"b1q16","lesson":"b1l4","unit":"b1","type":"choice","level":3,"stem":"《大唐西域记》记载了 100 多个国家和地区的山川风物与社会习俗，这本书的主要史料价值在于","options":["复原唐朝长安城的坊市布局","研究唐代中外交流和中亚、印度历史","说明日本大化改新的具体过程","证明唐朝以科举考试选拔官员"],"answer":1,"explain":"《大唐西域记》是玄奘口述的西行见闻，记载沿途国家和地区的地理、物产、习俗，是研究中外交流及中亚、印度历史的珍贵文献。","point":"《大唐西域记》的史料价值"},{"id":"b1q17","lesson":"b1l5","unit":"b1","type":"choice","level":1,"stem":"唐朝由盛转衰的转折点是","options":["安史之乱","黄巢起义","藩镇割据","朱温建立后梁"],"answer":0,"explain":"755—763 年的安史之乱使北方经济遭到极大破坏，唐朝国势由盛转衰；藩镇割据是安史之乱后的结果。","point":"安史之乱的影响"},{"id":"b1q18","lesson":"b1l5","unit":"b1","type":"choice","level":2,"stem":"755 年安禄山起兵发动叛乱时，在位的皇帝是","options":["唐太宗","唐玄宗","唐肃宗","唐僖宗"],"answer":1,"explain":"755 年安史之乱爆发时在位的是唐玄宗。叛军攻占长安后，唐玄宗逃往蜀地，太子李亨（唐肃宗）即位。","point":"安史之乱的经过"},{"id":"b1q19","lesson":"b1l5","unit":"b1","type":"order","level":2,"stem":"按时间先后排列唐朝衰亡过程中的大事","items":["安禄山在范阳起兵","叛军攻占洛阳、长安","安史之乱被平定","黄巢起义爆发","朱温建立后梁"],"explain":"755 年起兵 → 756 年攻占洛阳、长安 → 763 年平定叛乱 → 875 年黄巢起义 → 907 年朱温建立后梁，唐朝灭亡。","point":"唐朝衰亡的过程"},{"id":"b1q20","lesson":"b1l5","unit":"b1","type":"fill","level":1,"stem":"907 年，______建立后梁政权，唐朝灭亡。","answer":["朱温"],"explain":"朱温原是黄巢部将，后降唐，势力不断壮大，907 年建立后梁，唐朝灭亡，中国进入五代十国时期。","point":"唐朝的灭亡"}],"timeline":[{"t":"581 年","y":581,"text":"杨坚夺取北周政权，建立隋朝，定都大兴","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"589 年","y":589,"text":"隋灭陈，统一全国，结束长期分裂局面","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"605 年","y":605,"text":"隋炀帝下令开凿大运河，以洛阳为中心，北抵涿郡，南至余杭","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"隋炀帝时期","y":607,"text":"隋炀帝设立进士科，科举制正式确立","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"618 年","y":618,"text":"隋炀帝在江都被杀，隋朝灭亡；李渊建立唐朝","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"626 年","y":626,"text":"李世民即位，次年改元贞观，开创“贞观之治”","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"713 年","y":713,"text":"唐玄宗改元开元，励精图治，后出现“开元盛世”","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"754 年","y":754,"text":"鉴真第六次东渡到达日本，传播中华文化","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"755 年","y":755,"text":"安禄山在范阳起兵，安史之乱爆发，唐朝由盛转衰","unit":"b1","tag":"中国古代","volume":"v2"},{"t":"907 年","y":907,"text":"朱温建立后梁，唐朝灭亡，五代十国开始","unit":"b1","tag":"中国古代","volume":"v2"}]},{"volume":"v2","unit":{"id":"b2","volume":"v2","num":2,"title":"辽宋夏金元时期：民族关系发展和社会变化","short":"多族并立","years":"916—1368 年","accent":"#6B5A8A","soft":"#EDE8F5","tint":"#D4CBE6","icon":"🏹","tagline":"政权并立三百年，在碰撞与往来中走向更大的一统","intro":"916 年到 1368 年，中原的宋与辽、西夏、金、元先后并立，又彼此往来。战争、和议、榷场贸易与人口迁徙交织在一起，边疆和内地越走越近。这一单元要弄清楚：多个政权为什么能长期并立？民族交融与经济发展又如何为元朝的大一统铺路？","bigQuestion":"辽宋夏金多个政权长期并立，为什么最后走向元朝的空前一统？","goals":["说出北宋加强中央集权的措施与重文轻武的影响","梳理辽、西夏、金与两宋并立对峙的基本线索","说明宋代经济重心南移的表现和都市文化的特点","理解元朝行省制度与统一多民族国家的发展"],"keyLine":"960 北宋建立 · 1005 澶渊之盟 · 1127 靖康之变 · 1206 蒙古统一 · 1279 元灭南宋统一全国"},"lessons":[{"id":"b2l1","num":6,"unit":"b2","title":"北宋的政治","years":"960—1127 年","icon":"📜","tag":"北宋","hook":"960 年正月初三，陈桥驿。一觉醒来，赵匡胤被部下披上黄袍，山呼万岁。大军掉头南下，开封城门不战而开——一个新的王朝就这样诞生了。","core":"北宋吸取唐末五代藩镇割据的教训，用“杯酒释兵权”、分割事权、重文轻武等办法把军政财权收归中央，形成强干弱枝的格局。中央集权空前加强，也埋下冗官、冗兵、冗费和积贫积弱的隐患。","points":["背景：唐末五代藩镇割据、武将专权，赵匡胤本人就是靠兵变夺权，深知“兵权”二字的危险。","收兵权：961 年“杯酒释兵权”，解除石守信等大将兵权；设枢密院掌调兵，三衙掌统兵，调兵权与统兵权分离。","分相权：设中书门下掌行政，增设参知政事为副相；枢密院掌军事，三司掌财政，宰相的权力被一分为三。","控地方：派文臣做知州，设通判监督知州；设转运使把地方财赋收归中央，地方从此无力与中央抗衡。","重文轻武：重用文臣、扩大科举，武臣地位下降。这防止了武将夺权，也造成官员冗滥、军队战斗力下降。","改革：1043 年范仲淹主持庆历新政，1069 年宋神宗任用王安石变法，力求富国强兵，因触犯大官僚大地主利益而阻力重重。"],"terms":[["杯酒释兵权","961 年，宋太祖在酒宴上劝石守信等大将交出兵权、回乡置田享乐，用和平手段消除了武将夺权的隐患。"],["参知政事","北宋增设的副宰相，与宰相共同议政，用来分割宰相的行政权。"],["通判","北宋在州府设置的通判，与知州共同签署文书，有权直接向皇帝报告，起到监督知州的作用。"],["转运使","北宋设于各路，负责把地方赋税、财帛转运中央，使地方财权收归朝廷。"]],"figures":[["宋太祖（赵匡胤）","陈桥兵变建北宋，收兵权、控地方，确立重文轻武的国策"],["范仲淹","主持庆历新政，整顿吏治，因守旧派反对而失败"],["王安石","宋神宗时主持变法，推行青苗法、募役法等，力求富国强兵"]],"events":[["960 年","陈桥兵变，北宋建立"],["961 年","杯酒释兵权"],["1043 年","庆历新政开始"],["1069 年","王安石变法开始"]],"treaty":null,"significance":"北宋把兵权、财权、行政权集中到中央，结束了五代十国以来武将专权的局面，有利于政权稳定和社会经济文化的发展。但过度分权造成机构重叠、军队臃肿、财政困难，北宋逐渐形成“积贫积弱”的局面。","source":{"quote":"朕今选儒臣干事者百余，分治大藩，纵皆贪浊，亦未及武臣一人也。","from":"宋太祖赵匡胤语，见《续资治通鉴长编》（北宋）"},"pitfall":"北宋加强中央集权，削弱的是地方和宰相的权力，皇权反而空前强化；重文轻武不是不要军队，而是压制武将地位、防范武将专权。","memory":"一杯酒释兵权，二府三司分相权，文臣知州通判监，强干弱枝积贫弱。","link":"北宋“强干弱枝”的政治格局，直接影响了它与辽、西夏、金打交道时的军事实力与外交选择。","exam":["北宋加强中央集权的措施及影响","重文轻武国策的评价","王安石变法的背景与内容"]},{"id":"b2l2","num":7,"unit":"b2","title":"辽、西夏与北宋的并立","years":"916—1127 年","icon":"⚔","tag":"辽宋夏","hook":"1004 年深秋，辽军直逼澶州城下，黄河北岸的宋军阵脚大乱。宰相寇准硬把皇帝推到城楼上，黄龙旗一展，宋军呼声震天——一场大战，转眼变成了一场谈判。","core":"916 年契丹建立政权，1038 年党项族建立西夏，与北宋长期并立。战争与和议交替，澶渊之盟、宋夏和约以岁币换和平，边境榷场贸易兴盛，民族交往交融在冲突中不断加深。","points":["辽的兴起：916 年耶律阿保机统一契丹各部，建立契丹政权（后改国号辽），创制文字，农牧并重，成为北方强国。","西夏的建立：1038 年党项族首领元昊称大夏皇帝，史称西夏，仿唐宋制度建立官制，并创制西夏文字。","宋辽战争：宋太宗两次北伐，试图收复燕云十六州，均告失败；此后辽军不断南下，宋辽冲突加剧。","澶渊之盟：1004 年辽军攻至澶州，宋真宗亲征，宋军射杀辽将；1005 年双方议和，北宋每年给辽岁币，约为兄弟之国。","宋夏和战：元昊称帝后与北宋交战，宋军屡败；1044 年双方议和，西夏向宋称臣，北宋每年送给西夏钱物。","影响：和议带来长期和平，边境设榷场贸易，中原的茶叶、丝绸与辽夏的马匹、皮毛互通，民族交融加深。"],"terms":[["澶渊之盟","1005 年北宋与辽订立的和约：北宋每年给辽银十万两、绢二十万匹，双方约为兄弟之国，各守边界。"],["岁币","两宋给辽、西夏、金的银两和绢帛，名义上是“赠”或“赐”，实际上是屈辱性的经济负担。"],["榷场","宋与辽、西夏、金在边境设置的互市市场，由政府管理，交易茶叶、粮食、马匹、皮毛等。"],["燕云十六州","今北京、山西大同一带，后晋时割给契丹，北宋一直想收复而未能成功，成为宋辽冲突的焦点。"]],"figures":[["耶律阿保机","统一契丹各部，916 年建立契丹政权，创制契丹文字"],["元昊","党项族首领，1038 年称帝建立西夏，创制西夏文字"],["寇准","北宋宰相，力主宋真宗亲征澶州，促成澶渊之盟"],["宋真宗","亲征澶州，后与辽议和，签订澶渊之盟"]],"events":[["916 年","耶律阿保机建立契丹政权"],["1004 年","辽军攻至澶州，宋真宗亲征"],["1005 年","宋辽订立澶渊之盟"],["1038 年","元昊称帝，西夏建立"],["1044 年","宋夏和议"]],"treaty":{"name":"澶渊之盟","date":"1005 年","items":["北宋每年给辽银十万两、绢二十万匹，称为“岁币”","双方约为兄弟之国，皇帝互称兄弟","各守现有边界，不得互相侵犯","在边境设置榷场，开展互市贸易","双方互遣使节，遇有纠纷以和议解决"],"note":"澶渊之盟对北宋来说是屈辱的和约，加重了财政负担；但它结束了宋辽大规模战争，此后百余年边境基本安定，客观上有利于民族交往和经济交流。"},"significance":"澶渊之盟后，宋辽之间百余年没有发生大规模战争，边境榷场贸易繁忙，使者往来不断。辽、西夏与北宋在并立中互相学习制度与文化，民族交融进一步发展，也为后来北方民族政权与中原的深度联系打下基础。","source":{"quote":"终仁宗、英宗之世，契丹固守盟好，互市不绝。","from":"《宋史·食货志》（元代）"},"pitfall":"澶渊之盟是北宋与辽订立的，不是与西夏；宋夏和议中西夏向宋称臣，与宋辽“兄弟之国”不同。岁币每年交纳，不是一次付清。","memory":"阿保机建辽九一六，元昊称帝一〇三八；澶渊之盟一〇〇五，岁币换来百年和。","link":"北宋没能收复燕云十六州，军事上的被动在宋辽、宋夏关系中暴露无遗，也为金灭北宋埋下伏笔。","exam":["澶渊之盟的内容与评价","辽、西夏的建立者与民族","宋与辽、夏和议的比较"]},{"id":"b2l3","num":8,"unit":"b2","title":"金与南宋的对峙","years":"1115—1276 年","icon":"🏹","tag":"金宋","hook":"1141 年腊月，临安城张灯结彩，准备过年。大理寺狱中，39 岁的岳飞在供状上写下“天日昭昭”四个字，随后被害。风波亭外的雪，落了一夜。","core":"女真族建立的金先后灭辽、灭北宋。1127 年靖康之变后宋室南渡，建立南宋。岳飞抗金屡获胜绩，1141 年宋金议和，形成南北对峙。金朝迁都燕京、推行汉制，女真与汉族在杂居中不断交融。","points":["金的兴起：1115 年完颜阿骨打统一女真各部，建立金政权，创制女真文字，起兵反抗辽的压迫。","灭辽灭宋：1125 年金灭辽；1127 年金军攻破开封，掳走宋徽宗、宋钦宗及大量财物，北宋灭亡，史称靖康之变。","南宋建立：1127 年赵构在应天府即位，后定都临安（今杭州），史称南宋，偏安江南。","岳飞抗金：岳飞率“岳家军”北伐，纪律严明，1140 年在郾城大败金军主力，收复郑州、洛阳等地。","宋金议和：宋高宗、秦桧一意求和，召回岳飞并将其杀害；1141 年双方达成和议，南宋向金称臣纳贡，以淮水至大散关为界。","金朝汉化：金迁都燕京（今北京），仿宋制建立中央机构，推行科举，女真人与汉人杂居通婚，民族交融加深。"],"terms":[["靖康之变","1127 年金军攻破开封，掳走宋徽宗、宋钦宗，北宋灭亡的事件，因发生在靖康年间而得名。"],["绍兴和议","1141 年南宋与金订立的和议：南宋向金称臣，每年纳贡银二十五万两、绢二十五万匹，以淮水至大散关为界。"],["岳家军","岳飞统率的抗金军队，纪律严明，“冻死不拆屋，饿死不掳掠”，深受百姓拥护。"],["猛安谋克","金朝女真人的社会军事组织，平时生产、战时出征，后来随着封建化逐渐瓦解。"]],"figures":[["完颜阿骨打","统一女真各部，1115 年建立金政权"],["岳飞","南宋抗金名将，郾城大捷，后被以“莫须有”罪名杀害"],["宋高宗（赵构）","南宋开国皇帝，偏安江南，坚持对金求和"],["秦桧","南宋宰相，力主议和，陷害岳飞"]],"events":[["1115 年","完颜阿骨打建立金"],["1125 年","金灭辽"],["1127 年","靖康之变，北宋灭亡；南宋建立"],["1140 年","郾城大捷"],["1141 年","宋金达成绍兴和议"]],"treaty":{"name":"绍兴和议","date":"1141 年","items":["南宋向金称臣","南宋每年向金纳贡银二十五万两、绢二十五万匹","双方以东起淮水、西至大散关一线为界，以北归金，以南归宋","双方停止军事行动，各守疆界","金归还宋徽宗灵柩及宋高宗生母"],"note":"和议签订前，岳飞被召回并杀害。绍兴和议确立了宋金南北对峙的格局，此后近二十年双方没有发生大的战争。"},"significance":"宋金对峙使南北分裂持续百余年，南宋偏安江南，北方在金朝统治下逐步封建化。金朝迁都燕京、推行汉制与科举，女真、契丹、汉族在杂居交往中相互影响，为元朝的统一和民族交融准备了条件。","source":{"quote":"文臣不爱钱，武臣不惜死，天下太平矣。","from":"岳飞语，见《宋史·岳飞传》（元代）"},"pitfall":"灭北宋的是金，不是辽：1125 年金灭辽，1127 年才发生靖康之变。绍兴和议的对手是金，澶渊之盟的对手是辽，不要混淆。","memory":"一一一五金建立，一一二七靖康耻；郾城大捷岳家军，绍兴和议南北分。","link":"北宋亡于金，南宋与金对峙，北方民族政权一轮接一轮兴起，最终由蒙古完成统一。","exam":["靖康之变与北宋灭亡","岳飞抗金与宋金议和","金朝改革与民族交融"]},{"id":"b2l4","num":9,"unit":"b2","title":"宋代经济的发展","years":"960—1279 年","icon":"⚖","tag":"经济","hook":"北宋汴京的清晨，虹桥两岸已经挤满了人：粮船靠岸，脚夫吆喝，摊贩支起棚子，卖茶的、卖布的、算命的挤作一团。张择端把这一幕画进了《清明上河图》。","core":"宋代农业、手工业和商业全面繁荣：水稻成为南方第一粮食作物，景德镇瓷器名扬天下，四川出现世界上最早的纸币交子，海外贸易兴盛。南宋时经济重心南移最终完成，“国家根本，仰给东南”。","points":["农业：从越南引进的占城稻在东南推广，稻麦轮作一年两熟；太湖流域成为粮仓，人称“苏湖熟，天下足”。","经济作物：茶、桑的种植扩大，棉花种植由南向北推广，为棉纺织业的发展提供了原料。","手工业：丝织业中心南移；景德镇成为瓷都，瓷器大量外销；广州、泉州等地造船业发达，能造大型海船。","商业：城市打破坊市界限，出现早市、夜市；北宋前期四川地区出现交子，是世界上最早的纸币。","海外贸易：宋在广州、泉州、明州等地设市舶司管理贸易，商船远至阿拉伯半岛和非洲东海岸，外贸收入成为财政重要来源。","重心南移：南宋时南方人口和赋税超过北方，经济重心南移最终完成，为后世“南强北弱”的经济格局奠定基础。"],"terms":[["交子","北宋前期四川地区出现的纸质货币，是世界上最早的纸币，便于大宗贸易，后来由官府发行。"],["市舶司","宋朝管理海外贸易的机构，设于广州、泉州、明州等港口，负责发放公凭、征收商税、管理外商。"],["经济重心南移","全国经济中心从黄河流域转移到长江流域的过程，始于唐中期，到南宋最终完成。"],["景德镇","宋代兴起的瓷业中心，所产青白瓷精美，产品远销海外，被誉为“瓷都”。"]],"figures":[["宋真宗","在位时从越南引进占城稻，推广到东南地区"],["张择端","北宋画家，绘《清明上河图》，再现汴京商业繁华"]],"events":[["北宋","占城稻在东南地区推广，稻麦轮作普及"],["北宋前期","四川地区出现纸币交子"],["南宋","经济重心南移完成，市舶司收入大增"]],"treaty":null,"significance":"宋代经济在农业、手工业、商业和海外贸易上全面超过前代，纸币、市舶司、大型海船都是新事物。经济重心南移完成，使南方成为全国财赋的主要来源，也为宋元城市繁荣、文化下移和海外交流提供了物质基础。","source":{"quote":"集四海之珍奇，皆归市易；会寰区之异味，悉在庖厨。","from":"孟元老《东京梦华录》序（南宋初）"},"pitfall":"交子出现在北宋前期的四川，不是南宋；经济重心南移开始于唐中期，完成于南宋，不能说“宋代才开始南移”。","memory":"占城稻香苏湖熟，景德瓷美交子行；市舶司里番商聚，经济重心移江南。","link":"经济发展养活了庞大的城市人口，才有了宋元瓦子、勾栏和词曲的繁荣。","exam":["宋代农业、手工业、商业的表现","交子的地位与意义","经济重心南移的原因与完成"]},{"id":"b2l5","num":10,"unit":"b2","title":"蒙古族的兴起与元朝的建立","years":"1206—1271 年","icon":"🐎","tag":"蒙古","hook":"1206 年春，斡难河源头，各部落首领牵来白马、摆下祭品。铁木真被推举为全蒙古的大汗，号“成吉思汗”。从此，草原上不再有部落仇杀，只有一支向南、向西席卷的骑兵。","core":"1206 年铁木真统一蒙古草原，建立蒙古政权。蒙古先后灭西夏、灭金，势力进入中原。1271 年忽必烈改国号为元，定都大都；1276 年攻占临安，1279 年消灭南宋残部，完成全国统一。","points":["统一蒙古：铁木真经过多年战争统一蒙古各部，1206 年被推举为大汗，尊号“成吉思汗”，建立军政合一的统治。","对外扩张：蒙古军队先后进攻西夏、金和西辽，1227 年灭西夏，1234 年灭金，北方大部分地区纳入蒙古统治。","忽必烈建元：1260 年忽必烈即位，推行“行汉法”，重用汉人儒士；1271 年改国号为元，次年定都大都（今北京）。","统一全国：1276 年元军攻占南宋都城临安，南宋大臣文天祥坚持抗元；1279 年元军消灭南宋残部，全国统一。","文天祥抗元：文天祥兵败被俘，写下“人生自古谁无死，留取丹心照汗青”，拒绝招降，从容就义。","意义：元朝的统一结束了唐末以来长期分裂割据的局面，为统一多民族国家的发展奠定了基础。"],"terms":[["成吉思汗","1206 年铁木真被推举为全蒙古大汗后的尊号，意为“拥有海洋四方的可汗”。"],["行汉法","忽必烈即位后采用中原王朝的统治制度，设官分职、重农劝农、尊崇儒学，以稳定对汉地的统治。"],["大都","元朝都城，在今北京。1272 年忽必烈定都于此，是全国的政治中心。"]],"figures":[["铁木真（成吉思汗）","统一蒙古各部，1206 年建立蒙古政权"],["忽必烈","元朝开国皇帝，行汉法、定国号、都大都，完成全国统一"],["文天祥","南宋抗元名臣，被俘后坚贞不屈，慷慨就义"]],"events":[["1206 年","铁木真统一蒙古，被尊为成吉思汗"],["1227 年","蒙古灭西夏"],["1234 年","蒙古灭金"],["1271 年","忽必烈改国号为元"],["1279 年","元灭南宋残部，统一全国"]],"treaty":null,"significance":"元朝的统一结束了唐末五代以来数百年的分裂局面，疆域“北逾阴山，西极流沙，东尽辽左，南越海表”，是中国历史上第一个由少数民族建立的大一统王朝，为统一多民族国家的巩固和东西方交流创造了条件。","source":{"quote":"一代天骄，成吉思汗，只识弯弓射大雕。","from":"毛泽东《沁园春·雪》（1936 年）"},"pitfall":"1206 年建立的是蒙古政权，元朝建于 1271 年，不能混为一谈；1276 年攻占临安，1279 年才完成统一。","memory":"一二〇六成吉思汗，一二二七灭西夏；一二三四灭金国，一二七一忽必烈建元。","link":"元朝的统一把辽、宋、夏、金数百年的并立画上句号，接下来要学的是它如何统治这片空前辽阔的疆域。","exam":["成吉思汗统一蒙古","元朝的建立与全国统一","文天祥抗元与元朝统一的意义"]},{"id":"b2l6","num":11,"unit":"b2","title":"元朝的统治","years":"1271—1368 年","icon":"🗺","tag":"元","hook":"元朝的驿道上，信使换马不换人，一日可行数百里。从大都出发的公文，几天内就能送到岭北、云南。这个王朝要管的，是此前任何中原王朝都没有管过的辽阔土地。","core":"元朝疆域空前辽阔，中央设中书省、枢密院、御史台，地方推行行省制度；设宣政院管辖西藏，设澎湖巡检司管辖澎湖和琉球。空前的大一统促进了民族交融，逐渐形成新的民族——回族。","points":["疆域：元朝疆域“北逾阴山，西极流沙，东尽辽左，南越海表”，疆域之广超过汉唐。","中央机构：中书省掌管全国行政，枢密院掌军事，御史台负责监察，宣政院管理西藏地区和全国佛教事务。","行省制度：在地方设十个行省，行省是中书省的派出机构，掌管地方军政事务，我国省级行政区划由此开端。","边疆管辖：设宣政院管辖西藏，西藏正式成为中国的一个行政区；设澎湖巡检司管辖澎湖和琉球（今台湾）。","民族交融：大量少数民族内迁，汉族迁往边疆，各族杂居通婚；波斯人、阿拉伯人与汉、蒙古等族长期相处，形成回族。","灭亡：元朝后期政治腐败、赋税沉重，红巾军起义爆发，1368 年元朝灭亡。"],"terms":[["行省制度","元朝在地方设置的最高行政区划，行省长官掌管地方军政，重大事务须报中书省，是我国省制的开端。"],["宣政院","元朝中央机构，管理全国佛教事务并管辖西藏地区，西藏从此正式纳入中央政府行政管辖。"],["澎湖巡检司","元朝在澎湖岛设置的机构，负责管辖澎湖和琉球（今台湾），是中央政府首次在台湾地区正式设立行政机构。"],["回族","元朝时由东迁的波斯人、阿拉伯人与汉族、蒙古族、畏兀儿等族长期杂居通婚逐渐形成的新民族。"]],"figures":[["忽必烈","元朝开国皇帝，确立行省制度，加强对边疆的管辖"],["元顺帝","元朝末代皇帝，统治后期政治腐败，1368 年元朝灭亡"]],"events":[["1271 年","忽必烈定国号为元，次年定都大都"],["1279 年","元朝统一全国"],["元朝","设宣政院、澎湖巡检司，推行行省制度"],["1368 年","红巾军攻入大都，元朝灭亡"]],"treaty":null,"significance":"行省制度使中央对地方的控制空前加强，为后世省级行政区划所沿用；宣政院、澎湖巡检司的设置，标志着西藏、台湾地区正式纳入中央政府管辖。元朝在空前统一中推动民族交融，回族形成，统一多民族国家进一步发展。","source":{"quote":"北逾阴山，西极流沙，东尽辽左，南越海表。","from":"《元史·地理志》（明代）"},"pitfall":"行省不是独立的王国，而是中书省的派出机构，重大事务要报中央；宣政院管西藏，澎湖巡检司管台湾，不要张冠李戴。","memory":"中书枢密御史台，行省十区管地方；宣政院里辖西藏，澎湖巡检司守台湾。","link":"元朝把辽阔疆域纳入统一管理，驿站、行省与海上航路一起，让这一时期的对外交流格外活跃。","exam":["行省制度的内容与影响","元朝对西藏、台湾地区的管辖","元朝民族交融与回族的形成"]},{"id":"b2l7","num":12,"unit":"b2","title":"宋元时期的都市和文化","years":"960—1368 年","icon":"🎭","tag":"文化","hook":"汴京的夜市刚散，早市又开了。瓦子里说书的拍响醒木，勾栏中杂剧锣鼓齐鸣，隔壁摊上卖着糖果和纸画。这样的热闹，在宋元的城市里夜夜上演。","core":"宋元时期城市繁荣，市民阶层壮大，出现瓦子、勾栏等娱乐场所，词、曲、话本、杂剧兴盛。宋代节日习俗基本定型，司马光编成《资治通鉴》，苏轼、李清照、辛弃疾、关汉卿等留下大量名篇。","points":["都市繁荣：北宋开封人口逾百万，店铺林立，早市、夜市、草市并存；南宋临安更加繁华，商业通宵不绝。","市民生活：城市中出现瓦子（瓦舍），里面设勾栏，上演说书、杂剧、傀儡戏、相扑等节目，市民文化需求旺盛。","节日习俗：春节（元旦）、元宵、端午、中秋等节日在宋代基本定型，放爆竹、贴春联、吃粽子、赏月等习俗流传至今。","宋词：词句子长短不一，便于歌唱。苏轼、辛弃疾属豪放派，气象开阔；李清照、柳永属婉约派，细腻含蓄。","元曲与话本：元曲包括散曲和杂剧，关汉卿的《窦娥冤》揭露社会黑暗；话本是说书人的底本，为后世小说发展奠定基础。","史学：北宋司马光主持编写《资治通鉴》，是一部编年体通史，记述从战国到五代的历史，供统治者借鉴。"],"terms":[["瓦子","宋元城市中娱乐兼营商业的场所，也叫瓦舍、瓦肆，里面有各种演出和摊贩，是市民文化的集中体现。"],["勾栏","瓦子中用围栏或布幔围出的演出场地，上演杂剧、说书、杂技等节目。"],["词","盛行于宋代的一种配乐歌唱的诗歌体裁，句子长短不一，也称“长短句”，有豪放、婉约等风格。"],["编年体","按年月日顺序记载历史的史书体例，《资治通鉴》是编年体通史的代表作。"]],"figures":[["苏轼","北宋文学家，豪放派词人代表，代表作《念奴娇·赤壁怀古》"],["李清照","两宋之交女词人，婉约派代表，词风细腻，后期多悲叹身世"],["辛弃疾","南宋词人，豪放派代表，词中多抒发抗金报国之志"],["关汉卿","元朝杂剧作家，代表作《窦娥冤》，揭露社会黑暗"]],"events":[["北宋","开封城内瓦子、勾栏兴盛，夜市通宵"],["1084 年","司马光主持编成《资治通鉴》"],["元朝","元曲兴盛，关汉卿创作《窦娥冤》"]],"treaty":null,"significance":"宋元时期的文化不再只是士大夫的专利，说书、杂剧、词曲走进市井，市民成为文化消费的主力。雅俗共赏的文化格局影响了后世的小说、戏曲，也让我们今天仍能从节日习俗中看到宋元的影子。","source":{"quote":"大江东去，浪淘尽，千古风流人物。","from":"苏轼《念奴娇·赤壁怀古》（北宋）"},"pitfall":"《资治通鉴》是编年体通史，不是纪传体；作者是司马光，不是司马迁。瓦子是娱乐兼商业的场所，勾栏只是其中的演出场地。","memory":"瓦子勾栏市民乐，苏辛豪放李柳柔；资治通鉴司马光，窦娥一曲叹元曲。","link":"城市繁荣带来文化下移，而支撑这一切的，正是上一课所讲的经济繁荣与商贸往来。","exam":["宋词的代表人物与风格","瓦子、勾栏与市民生活","《资治通鉴》的体例与价值"]},{"id":"b2l8","num":13,"unit":"b2","title":"辽宋夏金元时期的对外交流","years":"960—1368 年","icon":"⛵","tag":"交流","hook":"泉州的码头上，一艘艘福船装满了瓷器和丝绸。水手把指南针放稳，等候季风。与此同时，一位威尼斯商人正沿着驿道赶往大都——海路和陆路，都在这个时代重新忙了起来。","core":"宋元时期海路贸易空前繁荣，广州、泉州、明州设市舶司管理，商船远达阿拉伯与东非；元朝陆路交通重新畅通，马可·波罗来华，中外使者、商人往来不断，四大发明与外来文化在交流中互传。","points":["海路：宋朝造船和航海技术进步，指南针用于航海，商船从东南沿海出发，经南海、印度洋到达波斯湾、阿拉伯半岛和非洲东海岸。","管理机构：宋在广州、泉州、明州等地设市舶司，发放出海公凭、征收商税、接待外商，海外贸易收入成为重要财源。","大港泉州：元朝时泉州是世界著名的大港，各国商人聚居，伊斯兰教、基督教等寺庙并存，被称为“东方第一大港”。","陆路：元朝驿站四通八达，从大都通往中亚、西亚和欧洲的商路重新畅通，使者、商队络绎不绝。","马可·波罗：意大利威尼斯商人，元朝时来华，受到忽必烈赏识，在中国生活十七年，回国后口述《马可·波罗行纪》。","交流成果：中国的造纸术、印刷术、火药、指南针传往西方，阿拉伯的天文、历法、医药和伊斯兰教等传入中国。"],"terms":[["海上丝绸之路","从东南沿海出发，经南海、印度洋通往西亚、东非的航线，宋元时期达到鼎盛。"],["市舶司","宋元管理海外贸易的机构，负责发放出海凭证、抽解商税、收购舶货、安置外商。"],["《马可·波罗行纪》","马可·波罗口述、他人笔录的游记，描述了中国和东方的富庶，激起欧洲人对东方的向往。"]],"figures":[["马可·波罗","意大利威尼斯商人，元朝时来华，在华十七年，口述《马可·波罗行纪》"],["汪大渊","元朝航海家，两次远航，著《岛夷志略》，记录亚非多国的风土物产"]],"events":[["宋朝","广州、泉州、明州设市舶司，海外贸易兴盛"],["1275 年","马可·波罗到达元朝大都"],["元朝","泉州成为世界著名大港，驿道通达中亚、欧洲"]],"treaty":null,"significance":"宋元时期的对外交流以海路为主、陆海并举，中国的发明与商品走向世界，外来的宗教、作物、工艺进入中国。这种双向交流既促进了中国自身的发展，也让世界更多地了解了东方。","source":{"quote":"外国巨价异物及百物之输入此城者，世界诸城无能与比。","from":"《马可·波罗行纪》（约 1298 年）"},"pitfall":"马可·波罗是意大利人，元朝时来华，不是明朝；宋元时期海路贸易繁荣，但陆上丝绸之路并未断绝，元朝时重新畅通。","memory":"市舶司里番舶来，泉州港上万国商；马可·波罗游大都，四大发明传西方。","link":"对外交流的活跃，建立在经济繁荣和元朝大一统的基础之上，也为下一课总结这一时期的科技成就作了铺垫。","exam":["宋元海外贸易与市舶司","马可·波罗与元朝的中外交流","四大发明的外传及影响"]},{"id":"b2l9","num":14,"unit":"b2","title":"辽宋夏金元时期的科技与文化","years":"960—1368 年","icon":"🧭","tag":"科技","hook":"北宋庆历年间，杭州一家书铺里，工匠毕昇把一个个刻好的胶泥字排在铁板上，一版印完，拆开重排。一部书印完，比雕版快了不知多少倍。","core":"宋元时期，活字印刷术、指南针和火药广泛应用并外传，沈括《梦溪笔谈》、郭守敬《授时历》等成就突出。四大发明在宋元走向成熟并传向世界，深刻影响了人类文明的进程。","points":["活字印刷：北宋毕昇发明泥活字印刷术，排版印刷后可拆开重复使用，省时省料；元代王祯又创制了木活字和转轮排字架。","指南针：战国时的司南是最早的指南仪器；北宋时指南针开始应用于航海，南宋时广泛使用，为远洋航行提供了条件。","火药：唐朝时火药开始用于军事；宋元时期火药武器广泛使用，出现突火枪、火铳等，13 世纪火药和火器传入阿拉伯和欧洲。","沈括：北宋科学家，著《梦溪笔谈》，记载了活字印刷术、指南针和石油等，被誉为“中国科学史上的坐标”。","郭守敬：元朝天文学家，主持编订《授时历》，测定一年为 365.2425 天，与现行公历基本相同，但早了约三百年。","外传影响：四大发明经由陆路和海路传入西方，推动了欧洲的思想解放、新航路开辟和
