"explain":"辽宁舰是我国第一艘航空母舰，2012 年 9 月交接入列。山东舰是我国第一艘国产航母，福建舰是第三艘航母，致远舰是甲午战争中的清朝军舰。","point":"海军装备的发展"},{"id":"d5q3","lesson":"d5l1","unit":"d5","type":"order","level":2,"stem":"按时间先后排列新中国国防建设中的大事","items":["人民空军成立","第二炮兵部队组建","辽宁舰交接入列","火箭军成立"],"explain":"人民空军成立于 1949 年 11 月；第二炮兵部队组建于 1966 年；辽宁舰 2012 年 9 月交接入列；2015 年 12 月第二炮兵更名为火箭军。","point":"国防建设的历程"},{"id":"d5q4","lesson":"d5l1","unit":"d5","type":"fill","level":2,"stem":"2015 年 12 月，我国战略导弹部队由第二炮兵更名为______。","answer":["火箭军","中国人民解放军火箭军"],"explain":"1966 年组建的第二炮兵部队是我国战略导弹部队，2015 年 12 月更名为火箭军，成为我国战略威慑的核心力量。","point":"火箭军"},{"id":"d5q5","lesson":"d5l2","unit":"d5","type":"choice","level":1,"stem":"新中国成立后，第一个承认中华人民共和国并同中国建立外交关系的国家是","options":["苏联","印度","朝鲜","越南"],"answer":0,"explain":"1949 年 10 月 2 日，苏联第一个承认中华人民共和国并同中国建交。印度、缅甸等是在和平共处五项原则提出前后与中国发展友好关系的。","point":"新中国成立初期的建交"},{"id":"d5q6","lesson":"d5l2","unit":"d5","type":"choice","level":2,"stem":"1953 年 12 月，周恩来在接见印度代表团时首次提出的是","options":["“求同存异”方针","和平共处五项原则","“一国两制”构想","独立自主的和平外交政策"],"answer":1,"explain":"1953 年 12 月，周恩来在接见印度代表团时首次提出和平共处五项原则。“求同存异”提出于 1955 年万隆会议；“一国两制”是 20 世纪 80 年代提出的；独立自主的和平外交政策在新中国成立时即已确立。","point":"和平共处五项原则的提出"},{"id":"d5q7","lesson":"d5l2","unit":"d5","type":"match","level":2,"stem":"把新中国外交的史事与其意义配对","pairs":[["日内瓦会议","新中国第一次以世界五大国之一身份参加的国际会议"],["万隆会议","第一次没有殖民主义国家参加的亚非会议"],["《中苏友好同盟互助条约》","1950 年签订，新中国与外国签订的第一个平等条约"],["和平共处五项原则","1953 年首次提出，成为处理国与国关系的基本准则"]],"explain":"1954 年日内瓦会议让世界看到新中国的外交能力；1955 年万隆会议上周恩来提出“求同存异”，会议圆满成功；1950 年的中苏条约打破了孤立；五项原则则成为国际关系的基本准则。","point":"新中国的外交成就"},{"id":"d5q8","lesson":"d5l2","unit":"d5","type":"fill","level":2,"stem":"1955 年，周恩来在万隆会议上提出“______”的方针，促进了会议的圆满成功。","answer":["求同存异"],"explain":"面对部分代表对中国的攻击，周恩来提出“求同存异”，强调亚非国家的共同遭遇和共同任务，使会议避免了争吵，取得圆满成功。","point":"万隆会议"},{"id":"d5q9","lesson":"d5l3","unit":"d5","type":"choice","level":1,"stem":"1971 年 10 月，第 26 届联合国大会通过决议，恢复中华人民共和国在联合国的合法权利，同时恢复的是","options":["联合国秘书长职位","安理会常任理事国席位","联合国大会主席职位","国际法院法官席位"],"answer":1,"explain":"1971 年第 26 届联大恢复中华人民共和国在联合国的一切合法权利，中国重新取得安理会常任理事国席位，这是中国外交的重大胜利。","point":"恢复在联合国的合法席位"},{"id":"d5q10","lesson":"d5l3","unit":"d5","type":"choice","level":2,"stem":"1972 年 2 月尼克松访华期间，中美双方在上海签署的文件是","options":["《中美建交公报》","《中美联合公报》","《中美友好通商航海条约》","《上海合作组织成立宣言》"],"answer":1,"explain":"1972 年 2 月，尼克松访华，中美双方在上海发表《中美联合公报》（又称《上海公报》），中美关系开始走向正常化。中美建交公报发表于 1978 年 12 月，1979 年 1 月 1 日两国正式建交。","point":"中美关系正常化"},{"id":"d5q11","lesson":"d5l3","unit":"d5","type":"order","level":2,"stem":"按时间先后排列新中国外交史上的大事","items":["恢复在联合国的合法席位","尼克松访华","中日建交","中美正式建交"],"explain":"1971 年 10 月恢复联合国合法席位；1972 年 2 月尼克松访华；1972 年 9 月中日建交；1979 年 1 月 1 日中美正式建交。","point":"20 世纪 70 年代的外交突破"},{"id":"d5q12","lesson":"d5l3","unit":"d5","type":"fill","level":3,"stem":"2001 年 12 月，中国正式加入______，为参与经济全球化开辟了新途径。","answer":["世界贸易组织","世贸组织","WTO"],"explain":"2001 年 12 月，中国正式加入世界贸易组织，这是中国融入经济全球化的重要一步，也为中国外交和多边合作提供了新舞台。","point":"全方位外交"}],"timeline":[{"t":"1949 年 4 月","y":1949.3,"text":"华东军区海军成立，人民海军诞生","unit":"d5","tag":"国防建设","volume":"v4"},{"t":"1949 年 11 月","y":1949.85,"text":"人民空军成立","unit":"d5","tag":"国防建设","volume":"v4"},{"t":"1953 年 12 月","y":1953.95,"text":"周恩来首次提出和平共处五项原则","unit":"d5","tag":"外交成就","volume":"v4"},{"t":"1955 年 4 月","y":1955.3,"text":"万隆会议召开，周恩来提出“求同存异”","unit":"d5","tag":"外交成就","volume":"v4"},{"t":"1966 年","y":1966.5,"text":"第二炮兵部队组建，战略导弹部队诞生","unit":"d5","tag":"国防建设","volume":"v4"},{"t":"1971 年 10 月","y":1971.8,"text":"第 26 届联大恢复中华人民共和国在联合国的合法席位","unit":"d5","tag":"外交成就","volume":"v4"},{"t":"1972 年 2 月","y":1972.1,"text":"尼克松访华，中美关系开始走向正常化","unit":"d5","tag":"外交成就","volume":"v4"},{"t":"1979 年 1 月","y":1979,"text":"中美正式建交","unit":"d5","tag":"外交成就","volume":"v4"},{"t":"2012 年 9 月","y":2012.7,"text":"辽宁舰交接入列，中国海军进入航母时代","unit":"d5","tag":"国防建设","volume":"v4"},{"t":"2015 年 12 月","y":2015.95,"text":"火箭军成立，军队改革组建五大战区","unit":"d5","tag":"国防建设","volume":"v4"}]},{"volume":"v4","unit":{"id":"d6","volume":"v4","num":6,"title":"科技文化与社会生活","short":"科技生活","years":"1949 年至今","accent":"#B04A35","soft":"#FAE8E3","tint":"#EDC4B9","icon":"🔬","tagline":"从“两弹一星”到全面小康，科技与民生一起改写了中国人的日常。","intro":"1964 年罗布泊上空的蘑菇云，2003 年杨利伟在太空中的招手，2021 年脱贫攻坚的全面胜利，最后都落在一户普通人家的餐桌和手机上。这一单元要回答三个问题：新中国怎样在一穷二白的基础上发展科技文化，中国怎样在 2021 年宣告全面建成小康社会，中国人的衣食住行又经历了怎样的变化。","bigQuestion":"从戈壁滩上的蘑菇云，到你手里的一部手机，国家的科技突破和普通人的日子，是怎样一步步连起来的？","goals":["说出“两弹一星”、杂交水稻、载人航天的主要成就。","了解“双百”方针和文化领域的重要成果。","说明精准扶贫方略和全面建成小康社会的历程。","举例说明改革开放以来衣食住行和通信的变化。"],"keyLine":"1964 年原子弹爆炸、1970 年卫星上天、1973 年杂交水稻育成，2013 年精准扶贫落地，2021 年全面建成小康社会——中国人的日子就这样一点点变了模样。"},"lessons":[{"id":"d6l1","num":18,"unit":"d6","title":"科技文化成就","years":"1949 年至今","icon":"🚀","tag":"科技","hook":"1964 年 10 月 16 日下午，罗布泊戈壁深处，一座百米铁塔静静立着。一声巨响之后，火球腾空，蘑菇云翻滚上升，几十公里外的参试人员摘下防护镜，欢呼着跳了起来。","core":"新中国科研基础薄弱。1956 年党中央号召“向科学进军”，制定科学技术发展远景规划。此后“两弹一星”研制成功，杂交水稻、青蒿素造福世界，载人航天不断突破；文化领域坚持“双百”方针，优秀作品走向世界。科技文化成为国家实力和民族自信的支撑。","points":["背景：新中国成立初期人才缺乏、科研基础薄弱。1956 年党中央号召“向科学进军”，制定科学技术发展远景规划。","“两弹一星”：1964 年原子弹、1966 年导弹核武器、1967 年氢弹试验成功，1970 年“东方红一号”卫星升空。","农业与医学：1973 年袁隆平培育出籼型杂交水稻；20 世纪 70 年代初屠呦呦团队发现青蒿素，挽救大量疟疾患者生命。","载人航天：1999 年“神舟一号”升空，2003 年“神舟五号”载人飞天，2008 年航天员出舱，2022 年空间站建成。","文化事业：1956 年“双百”方针提出，文艺创作走向繁荣；2012 年莫言获诺贝尔文学奖；北京成为“双奥之城”。","精神：研制“两弹一星”的科学家在戈壁滩上隐姓埋名、自力更生，铸就了热爱祖国、无私奉献、艰苦奋斗的“两弹一星”精神。"],"terms":[["两弹一星","“两弹”指核弹（原子弹、氢弹）和导弹，“一星”指人造地球卫星；1999 年国家表彰了 23 位作出突出贡献的科技专家。"],["“双百”方针","1956 年毛泽东提出“百花齐放、百家争鸣”，即艺术上不同形式和风格可以自由发展，科学上不同学派可以自由争论。"],["籼型杂交水稻","1973 年袁隆平成功培育，单位面积产量大幅提高，后被推广到世界许多国家，袁隆平被誉为“杂交水稻之父”。"],["青蒿素","屠呦呦团队从青蒿中提取的抗疟药物，治愈了大量疟疾患者；屠呦呦因此获得 2015 年诺贝尔生理学或医学奖。"]],"figures":[["钱学森","中国航天事业的奠基人，主持我国导弹与人造卫星的研制"],["邓稼先","核物理学家，“两弹”研制的开拓者，隐姓埋名二十余年"],["袁隆平","培育出籼型杂交水稻，被誉为“杂交水稻之父”"],["屠呦呦","发现青蒿素，2015 年获诺贝尔生理学或医学奖"]],"events":[["1964.10","第一颗原子弹爆炸成功"],["1967.6","第一颗氢弹爆炸成功"],["1970.4","“东方红一号”人造地球卫星发射成功"],["1973","籼型杂交水稻培育成功"],["2003.10","“神舟五号”载人飞船发射成功"]],"treaty":null,"significance":"核技术和航天技术打破了垄断、增强了国防实力，杂交水稻和青蒿素造福人类；“双百”方针推动文化走向繁荣。这些成就提高了中国的国际地位，也为后来的发展打下了基础。","source":{"quote":"如果六十年代以来中国没有原子弹、氢弹，没有发射卫星，中国就不能叫有重要影响的大国，就没有现在这样的国际地位。","from":"邓小平《中国必须在世界高科技领域占有一席之地》（1988 年 10 月）"},"pitfall":"原子弹 1964 年、氢弹 1967 年，顺序不能颠倒；“东方红一号”是卫星而非飞船；首次载人飞行是 2003 年的“神舟五号”。","memory":"六四原子弹，六七氢弹响；七〇东方红，七三杂交稻；〇三神舟五，太空留身影。","link":"本课是本册科技与文化的总账：这些成就为国家积累了实力，也悄悄改变着下一课要讲的中国人的日常生活。","exam":["“两弹一星”的成就与意义","袁隆平、屠呦呦的贡献","中国载人航天的发展历程"]},{"id":"d6l2","num":19,"unit":"d6","title":"决胜全面建成小康社会","years":"2012—2021 年","icon":"🏡","tag":"小康","hook":"2013 年 11 月，湖南湘西十八洞村的泥巴路上走来几位客人。这个人均耕地不足一亩的苗寨，成了“精准扶贫”四个字最早落地的地方。","core":"2012 年，中共十八大提出到 2020 年全面建成小康社会的目标。2013 年，习近平总书记在十八洞村提出“精准扶贫”。2015 年脱贫攻坚战全面打响，2021 年 2 月宣布脱贫攻坚战取得全面胜利，7 月宣告全面建成小康社会，历史性地解决了绝对贫困问题。","points":["目标：2012 年中共十八大提出，确保到 2020 年实现全面建成小康社会；2017 年中共十九大又作出新的部署。","方略：2013 年，习近平总书记在湖南十八洞村首次提出“精准扶贫”，要求做到“六个精准”、实施“五个一批”。","标准：“两不愁三保障”——不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障，这是现行标准下脱贫的基本要求。","攻坚：2015 年中央扶贫开发工作会议召开，中西部 22 个省区市党政主要负责人向中央立下脱贫攻坚“军令状”。","成就：现行标准下 9899 万农村贫困人口全部脱贫，832 个贫困县全部摘帽，12.8 万个贫困村全部出列。","接续：脱贫摘帽不是终点。2017 年中共十九大提出实施乡村振兴战略，脱贫攻坚成果同乡村振兴有效衔接。"],"terms":[["小康社会","我国现代化建设“三步走”战略中的第二步目标，指人民生活达到温饱有余、较为宽裕的水平；2021 年我国宣告全面建成小康社会。"],["精准扶贫","2013 年提出，指对扶贫对象实行精细化管理、精确化帮扶，做到扶持对象、项目安排、资金使用等“六个精准”。"],["两不愁三保障","现行标准下脱贫的基本要求：稳定实现农村贫困人口不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障。"],["乡村振兴战略","2017 年中共十九大提出，按照产业兴旺、生态宜居、乡风文明、治理有效、生活富裕的总要求推进农业农村现代化。"]],"figures":[["习近平","提出精准扶贫方略，亲自部署、指挥脱贫攻坚战"],["黄文秀","广西乐业县百坭村第一书记，2019 年牺牲在扶贫路上"],["张桂梅","创办云南丽江华坪女子高中，帮助大批贫困女孩走进大学"],["毛相林","重庆巫山县下庄村党支部书记，带领村民在绝壁上凿出八公里“天路”"]],"events":[["2012.11","中共十八大提出全面建成小康社会目标"],["2013.11","习近平总书记在十八洞村提出“精准扶贫”"],["2015.11","中央扶贫开发工作会议召开，脱贫攻坚战全面打响"],["2021.2","全国脱贫攻坚总结表彰大会宣布脱贫攻坚战全面胜利"],["2021.7","庆祝中国共产党成立 100 周年大会宣告全面建成小康社会"]],"treaty":null,"significance":"全面建成小康社会，历史性地解决了绝对贫困问题，提前十年实现联合国 2030 年可持续发展议程的减贫目标；脱贫攻坚的胜利，彰显了中国共产党领导和中国特色社会主义制度的优势。","source":{"quote":"脱贫摘帽不是终点，而是新生活、新奋斗的起点。","from":"习近平《在决战决胜脱贫攻坚座谈会上的讲话》（2020 年 3 月 6 日）"},"pitfall":"目标提出在 2012 年十八大，宣告实现在 2021 年；脱贫标准是“两不愁三保障”，不只是吃饱穿暖；脱贫之后接续的是乡村振兴。","memory":"十八大定小康目标，十八洞村出精准招；五年攻坚近亿人，二一年七月传捷报。","link":"上承科技文化积累的国家实力，下启社会生活的变迁：小康不小康，最终要落到老百姓的衣食住行上。","exam":["精准扶贫方略与脱贫标准","全面建成小康社会的时间与意义","脱贫攻坚的成就与典型人物"]},{"id":"d6l3","num":20,"unit":"d6","title":"社会生活的变迁","years":"1949 年至今","icon":"📱","tag":"生活","hook":"上世纪八十年代的一个清晨，粮店门口排起长队，人们手里攥着粮票和布袋。三十多年后，同一个街角，年轻人用手机扫一下二维码，拎着早餐就走了。","core":"新中国成立后，特别是改革开放以来，中国人的衣食住行、通信方式、就业与社会保障发生了深刻变化。从凭票供应到商品丰富，从自行车到高铁飞机，从书信到互联网，人民生活实现了从贫困到温饱、再到总体小康和全面小康的跨越。","points":["改革开放前：物资匮乏，粮食、棉布、食用油凭票证限量供应，服装颜色样式单一，城镇住房紧张，出行主要靠步行和自行车。","衣着：从“蓝灰色的海洋”到色彩缤纷、款式多样，名牌服装和个性化穿着走进寻常生活，人们对美的追求不断释放。","饮食：从“吃饱”到“吃好”，肉蛋奶增多，营养均衡受到重视；“菜篮子工程”和生鲜电商让餐桌更加丰富。","居住：城镇人均住房建筑面积大幅增加，楼房、电梯、装修进入普通家庭，农村住房也不断翻新。","出行：家用汽车进入寻常百姓家；2008 年京津城际铁路开通，到 2021 年底我国高铁营业里程超过 4 万公里，居世界第一。","通信与保障：1994 年我国接入国际互联网，手机、网购、移动支付普及；就业转向自主择业，养老、医疗保险覆盖城乡。"],"terms":[["凭票供应","改革开放前物资短缺时期，国家按人口发放粮票、布票、油票等，凭票限量购买生活必需品；1993 年票证基本退出日常生活。"],["恩格尔系数","食品支出占家庭消费总支出的比重。比重越低，一般说明生活水平越高；改革开放以来我国城乡居民恩格尔系数持续下降。"],["高速铁路","2008 年京津城际铁路开通，我国进入高铁时代；到 2021 年底，我国高铁营业里程超过 4 万公里，居世界第一。"],["社会保障体系","包括养老、医疗、失业等社会保险和社会救助。我国已建成世界上规模最大的社会保障体系，基本医疗保险覆盖十三亿多人。"]],"figures":[["邓小平","1979 年提出“小康”构想，推动改革开放，为生活改善奠定基础"],["王选","主持研制汉字激光照排系统，让中文出版告别铅与火，被誉为“当代毕昇”"]],"events":[["1955","国家开始实行粮食定量供应，粮票走上百姓餐桌"],["1993","全国取消粮票，票证逐步退出日常生活"],["1994.4","中国正式接入国际互联网"],["2008.8","京津城际铁路开通，我国进入高铁时代"],["2019.6","我国发放 5G 商用牌照，进入 5G 时代"]],"treaty":null,"significance":"社会生活的变迁是改革开放和科技进步最直观的成果，也是全面建成小康社会的生动注脚。它说明发展的最终目的是让人民过上好日子，而生活方式的变化又推动着消费、产业和社会观念的更新。","source":{"quote":"我们要实现的四个现代化，是中国式的四个现代化……而是“小康之家”。","from":"邓小平会见日本首相大平正芳时的谈话（1979 年 12 月）"},"pitfall":"粮票退出是 1993 年，不是改革开放之初；“小康”构想由邓小平在 1979 年提出，生活改善是改革与科技共同推动的结果。","memory":"票证年代物匮乏，九三粮票退场；九四联网指尖忙，高铁飞驰万里长。","link":"承接上一课：全面小康不只是一串数字，它落在每家每户的餐桌上；本课也为整册教材收束，把大历史落到普通人的一天里。","exam":["票证供应与改革开放后生活的变化","高铁、互联网等科技进步对生活的影响","恩格尔系数与社会保障体系"]}],"questions":[{"id":"d6q1","lesson":"d6l1","unit":"d6","type":"choice","level":1,"stem":"1964 年 10 月，我国第一颗原子弹爆炸成功。这一成就最重大的意义是","options":["使我国成为世界上第一个拥有核武器的国家","打破了帝国主义的核垄断，增强了我国的国防实力","标志着我国载人航天技术取得突破","使我国完成了社会主义工业化"],"answer":1,"explain":"1964 年 10 月 16 日，我国第一颗原子弹爆炸成功，成为继美国、苏联、英国、法国之后第五个拥有核武器的国家。它打破了帝国主义的核垄断，增强了国防实力。载人航天的突破是 2003 年“神舟五号”，与原子弹无关。","point":"“两弹一星”的意义"},{"id":"d6q2","lesson":"d6l1","unit":"d6","type":"choice","level":2,"stem":"1973 年，袁隆平成功培育出籼型杂交水稻。这项成果最重要的作用是","options":["大幅提高水稻产量，为解决中国人的吃饭问题作出重大贡献","使我国彻底告别了粮食进口","结束了我国农业依靠手工劳动的历史","推动了我国载人航天工程的发展"],"answer":0,"explain":"杂交水稻大幅提高了单位面积产量，为保障我国粮食安全作出重大贡献，后来还被推广到世界许多国家。它并没有使我国“彻底告别粮食进口”，也没有结束农业依靠手工劳动的历史。","point":"袁隆平与杂交水稻"},{"id":"d6q3","lesson":"d6l1","unit":"d6","type":"order","level":2,"stem":"按时间先后排列我国航天事业取得的成就","items":["第一颗人造地球卫星“东方红一号”发射成功","“神舟一号”无人飞船发射成功","“神舟五号”载人飞船将杨利伟送入太空","航天员翟志刚完成我国首次太空出舱活动","“天和”核心舱发射成功"],"explain":"1970 年“东方红一号”升空 → 1999 年“神舟一号” → 2003 年“神舟五号”首次载人飞行 → 2008 年“神舟七号”翟志刚出舱 → 2021 年“天和”核心舱发射。","point":"中国航天事业的发展"},{"id":"d6q4","lesson":"d6l1","unit":"d6","type":"fill","level":2,"stem":"1970 年 4 月，我国成功发射第一颗人造地球卫星“______”，成为世界上第五个能独立发射人造地球卫星的国家。","answer":["东方红一号","东方红1号","东方红一号卫星"],"explain":"1970 年 4 月 24 日，“东方红一号”人造地球卫星发射成功，我国成为继苏联、美国、法国、日本之后第五个能独立发射人造地球卫星的国家。","point":"“东方红一号”"},{"id":"d6q5","lesson":"d6l2","unit":"d6","type":"choice","level":1,"stem":"2013 年 11 月，习近平总书记在湖南湘西十八洞村考察时首次提出的方略是","options":["乡村振兴","精准扶贫","西部大开发","科教兴国"],"answer":1,"explain":"习近平总书记在十八洞村考察时提出“实事求是、因地制宜、分类指导、精准扶贫”，“精准扶贫”由此成为脱贫攻坚的基本方略。乡村振兴战略是 2017 年中共十九大提出的。","point":"精准扶贫方略"},{"id":"d6q6","lesson":"d6l2","unit":"d6","type":"choice","level":2,"stem":"2021 年 2 月，全国脱贫攻坚总结表彰大会宣布现行标准下 9899 万农村贫困人口全部脱贫。这里的“现行标准”指的是","options":["“两不愁三保障”","人均年收入超过一万元","家家住上楼房、通上自来水","全部实现农业机械化"],"answer":0,"explain":"“两不愁三保障”指稳定实现农村贫困人口不愁吃、不愁穿，义务教育、基本医疗、住房安全有保障。这是现行标准下脱贫的基本要求，其余三项都不是国家规定的脱贫标准。","point":"脱贫标准"},{"id":"d6q7","lesson":"d6l2","unit":"d6","type":"match","level":2,"stem":"把下列人物与其在脱贫攻坚中的主要事迹配对","pairs":[["黄文秀","广西百坭村第一书记，牺牲在扶贫路上"],["张桂梅","创办华坪女子高中，帮助贫困女孩上学"],["毛相林","带领村民在绝壁上凿出八公里“天路”"],["习近平","提出精准扶贫方略"]],"explain":"黄文秀任广西乐业县百坭村第一书记，2019 年遭遇山洪牺牲；张桂梅创办云南丽江华坪女子高级中学；毛相林带领重庆巫山县下庄村村民凿出“天路”；精准扶贫方略由习近平总书记提出。","point":"脱贫攻坚的典型人物"},{"id":"d6q8","lesson":"d6l2","unit":"d6","type":"fill","level":2,"stem":"2021 年 7 月 1 日，习近平总书记在庆祝中国共产党成立 100 周年大会上庄严宣告，我国已经全面建成了______。","answer":["小康社会"],"explain":"2021 年 7 月 1 日，习近平总书记在庆祝中国共产党成立 100 周年大会上宣告，我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题。","point":"全面建成小康社会"},{"id":"d6q9","lesson":"d6l3","unit":"d6","type":"choice","level":1,"stem":"20 世纪 50—70 年代，我国城镇居民购买粮食要凭粮票，购买棉布要凭布票。这一现象反映的实质是","options":["我国农业生产长期停滞","物资供应不足，国家实行计划供应","人民生活水平已经达到小康","商业企业不愿意经营粮食和棉布"],"answer":1,"explain":"票证是物资短缺年代国家实行计划供应的产物：按人口发票、凭票限量购买，以保证基本生活需要。它反映的是物资供应不足，而不是农业停滞或商业企业不愿经营。","point":"凭票供应"},{"id":"d6q10","lesson":"d6l3","unit":"d6","type":"choice","level":2,"stem":"1994 年 4 月，中国正式接入国际互联网。此后，网络购物、移动支付、线上课堂走进普通人的生活。这一变化主要说明","options":["科技进步改变了人们的生活方式","我国已经进入发达国家行列","互联网取代了全部传统产业","城乡居民的收入差距已经消失"],"answer":0,"explain":"互联网技术让购物、支付、学习突破了时间和空间的限制，改变了人们的生活方式。我国仍是发展中国家，互联网也没有取代全部传统产业，城乡收入差距仍然存在。","point":"科技进步与生活变化"},{"id":"d6q11","lesson":"d6l3","unit":"d6","type":"order","level":2,"stem":"按时间先后排列下列与中国人生活变化相关的事件","items":["国家开始实行粮食定量供应，粮票走上餐桌","全国取消粮票，票证退出日常生活","中国正式接入国际互联网","京津城际铁路开通，我国进入高铁时代","我国进入 5G 商用时代"],"explain":"1955 年开始粮食定量供应、发行粮票 → 1993 年取消粮票 → 1994 年接入国际互联网 → 2008 年京津城际铁路开通 → 2019 年 5G 正式商用。","point":"社会生活变迁的进程"},{"id":"d6q12","lesson":"d6l3","unit":"d6","type":"choice","level":3,"stem":"1978 年以来，我国城乡居民的恩格尔系数持续下降。这一变化最能说明","options":["食品价格在不断下降","居民生活水平提高，食品支出在消费总支出中的比重降低","城乡居民的收入差距在扩大","我国农业生产出现萎缩"],"answer":1,"explain":"恩格尔系数是食品支出占家庭消费总支出的比重。收入增加后，人们把更多的钱用于教育、旅游、文化等方面，食品支出的比重随之下降，所以恩格尔系数下降一般说明生活水平提高。","point":"恩格尔系数"}],"timeline":[{"t":"1956 年 4 月","y":1956.3,"text":"毛泽东提出“百花齐放、百家争鸣”方针，文艺和科学事业出现繁荣局面。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"1964 年 10 月","y":1964.8,"text":"我国第一颗原子弹爆炸成功，打破了帝国主义的核垄断。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"1967 年 6 月","y":1967.5,"text":"我国第一颗氢弹爆炸成功。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"1970 年 4 月","y":1970.3,"text":"“东方红一号”人造地球卫星发射成功，我国成为世界上第五个能独立发射卫星的国家。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"1973 年","y":1973.5,"text":"袁隆平成功培育出籼型杂交水稻，粮食产量大幅提高。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"2003 年 10 月","y":2003.8,"text":"“神舟五号”载人飞船发射成功，杨利伟成为中国首位进入太空的航天员。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"2012 年 11 月","y":2012.9,"text":"中共十八大提出到 2020 年全面建成小康社会的目标。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"2013 年 11 月","y":2013.9,"text":"习近平总书记在湖南十八洞村首次提出“精准扶贫”。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"2021 年 2 月","y":2021.15,"text":"全国脱贫攻坚总结表彰大会宣布脱贫攻坚战取得全面胜利，9899 万农村贫困人口全部脱贫。","unit":"d6","tag":"中国现代","volume":"v4"},{"t":"2021 年 7 月","y":2021.5,"text":"庆祝中国共产党成立 100 周年大会宣告我国全面建成小康社会。","unit":"d6","tag":"中国现代","volume":"v4"}]},{"volume":"v5","unit":{"id":"w1","volume":"v5","num":1,"title":"古代亚非文明","short":"大河文明","years":"约公元前 3500—前 500 年","accent":"#3A5D7E","soft":"#E7EEF6","tint":"#C4D3E4","icon":"🐍","tagline":"尼罗河、两河、印度河——三条大河托起最早的文明","intro":"这一单元要回答：为什么最早的文明都出现在大河边上？我们沿尼罗河看埃及的统一、法老与金字塔，走进两河流域读《汉谟拉比法典》的条文，再顺印度河与恒河看种姓制度怎样把社会分成等级、佛教又怎样回应它。三条大河、三种答案，却在回答同一个问题：人怎样组织起来，建成国家与社会。","bigQuestion":"同是依河而生的文明，埃及、两河流域和印度为什么长出三种不同的国家与社会？","goals":["说出古埃及统一、法老统治与金字塔的史实","读懂《汉谟拉比法典》条文，说明其地位与实质","描述种姓制度的等级结构，理解佛教兴起的背景","比较三大文明的共同点，解释大河与文明的关系"],"keyLine":"约前 3500 年尼罗河与两河出现小国 → 约前 3100 年埃及统一 → 前 18 世纪《汉谟拉比法典》 → 前 6 世纪佛教兴起 → 前 3 世纪阿育王统一印度半岛"},"lessons":[{"id":"w1l1","num":1,"unit":"w1","title":"古代埃及","years":"约前 3500—前 30 年","icon":"🔺","tag":"埃及","hook":"每年七月，尼罗河开始涨水，十月退去，两岸留下一层黑亮的淤泥。农夫把种子撒进湿泥，等来年的收成；法老则在河岸高处，命人垒起一座通天的石塔。","core":"约公元前 3500 年，尼罗河两岸出现小国；约公元前 3100 年，古埃及初步统一，国王称法老，集军政大权于一身。金字塔、象形文字和太阳历是埃及人留下的印记，说明在没有铁器的时代，依靠尼罗河的农业和强大的王权，也能孕育出延续三千年的文明。","points":["尼罗河定期泛滥，退水后留下肥沃淤泥，便于灌溉和耕种；希罗多德因此说“埃及是尼罗河的赠礼”。","约公元前 3500 年起，尼罗河两岸陆续出现若干小国；约公元前 3100 年，古埃及初步实现统一。","法老是最高统治者，集军政大权于一身，自称神的化身，其陵墓是金字塔，王权与神权紧密结合。","胡夫金字塔约建于公元前 2600 年，塔高约 146.5 米，由约 230 万块巨石砌成，是古埃及文明的象征。","古埃及人约在公元前 3000 年发明象形文字，用图形符号表意，写在纸草上，多为祭司和书吏掌握。","古埃及人依据尼罗河泛滥的规律制定太阳历，一年 365 天，是人类历史上第一部太阳历；制作木乃伊还积累了解剖知识。"],"terms":[["法老","古埃及国王的称号，被视为神在人间的代表，掌握军政、司法和宗教大权，金字塔就是他们的陵墓。"],["金字塔","古埃及法老的陵墓，用巨石垒成方锥体。胡夫金字塔最大，既是王权的象征，也体现了埃及人的数学与组织能力。"],["象形文字","古埃及人创造的文字，用鸟、蛇、太阳等图形符号表示事物和读音，约公元前 3000 年出现，主要写在纸草上。"],["太阳历","古埃及人根据尼罗河泛滥和天象制定的历法，一年 12 个月、365 天，是人类历史上第一部太阳历。"]],"figures":[["胡夫","古埃及第四王朝法老，其金字塔是现存最大的金字塔，约建于公元前 2600 年"],["希罗多德","古希腊历史学家，在《历史》中留下“埃及是尼罗河的赠礼”的名言"]],"events":[["约公元前 3500 年","尼罗河两岸出现若干小国"],["约公元前 3100 年","古埃及初步统一，法老统治确立"],["约公元前 2600 年","胡夫金字塔建成"],["公元前 525 年","波斯帝国吞并古埃及"],["公元前 30 年","罗马灭亡托勒密王朝，埃及成为罗马行省"]],"treaty":null,"significance":"古埃及在尼罗河的滋养下建立起统一的君主国家，金字塔、象形文字和太阳历展示了早期文明的创造力。它说明大河流域的农业剩余与强大的王权，是文明诞生的两个支点，也为后人研究早期国家留下了实物证据。","source":{"quote":"埃及人最先发明了历法，把一年分为十二个月。","from":"希罗多德《历史》卷二（约公元前 5 世纪）"},"pitfall":"金字塔是法老的陵墓，不是神庙；胡夫金字塔最大，但不是唯一；约公元前 3100 年是“初步统一”，不是“建立王朝”。","memory":"尼罗河赠礼，三千一百年初统一；法老金字塔，象形文字太阳历。","link":"本单元第一课：尼罗河上的统一国家 → 下一课看两河流域的城邦与法典 → 再下一课看印度河的等级制度。","exam":["尼罗河与古埃及文明的关系","金字塔与法老的王权","象形文字、太阳历等文明成就"]},{"id":"w1l2","num":2,"unit":"w1","title":"古代两河流域","years":"约前 3500—前 539 年","icon":"📜","tag":"两河","hook":"1901 年，法国考古队在伊朗苏萨挖出一根黑色玄武岩石柱。石柱上部刻着太阳神把权标递给一位国王，下部密密刻满楔形文字——那是三千七百多年前的一部法典。","core":"两河流域（幼发拉底河与底格里斯河之间）的苏美尔人创造了楔形文字。约公元前 24 世纪，这里初步统一；公元前 18 世纪，汉谟拉比统一中下游，颁布《汉谟拉比法典》，用“君权神授”维护奴隶主阶级的统治，也为后人留下研究古巴比伦社会的第一手材料。","points":["两河流域又称美索不达米亚，幼发拉底河与底格里斯河定期泛滥，灌溉农业发达，是文明产生的基础。","约公元前 3500 年，两河流域南部出现一些小国；约公元前 24 世纪，两河流域初步实现统一。","苏美尔人用芦苇杆在泥板上刻写楔形文字，还发明 60 进制计数法和太阴历，创作史诗《吉尔伽美什》。","公元前 18 世纪，古巴比伦国王汉谟拉比统一两河流域中下游，建立君主专制统治，宣称受神之命统治人间。","《汉谟拉比法典》刻在黑色石柱上，把居民分为公民、无公民权的自由民和奴隶三个等级，奴隶是主人的财产。","法典用“以眼还眼，以牙还牙”处理伤害案件，条文维护奴隶主利益，是迄今已知世界上第一部较为完整的成文法典。"],"terms":[["楔形文字","苏美尔人用芦苇杆在泥板上刻写的文字，笔画一头粗一头细，形似楔子，约公元前 3000 年出现，是世界上最古老的文字之一。"],["《汉谟拉比法典》","古巴比伦国王汉谟拉比颁布的成文法典，刻在黑色石柱上，维护奴隶主阶级的利益，是迄今已知世界上第一部较为完整的成文法典。"],["君权神授","统治者宣称自己的权力来自神，用来证明统治的合法性。法典石柱上刻太阳神授权的浮雕，就是在宣扬君权神授。"],["美索不达米亚","希腊语“两河之间的地方”，指幼发拉底河与底格里斯河流域，大体在今伊拉克一带，是两河流域文明的发源地。"]],"figures":[["汉谟拉比","古巴比伦国王，公元前 18 世纪统一两河流域中下游，颁布《汉谟拉比法典》"],["苏美尔人","两河流域南部的居民，创造楔形文字、60 进制和太阴历，留下史诗《吉尔伽美什》"]],"events":[["约公元前 3500 年","两河流域南部出现一些小国"],["约公元前 24 世纪","两河流域初步实现统一"],["公元前 18 世纪","汉谟拉比统一两河流域中下游，颁布《汉谟拉比法典》"],["公元前 539 年","波斯帝国征服新巴比伦，两河流域被并入波斯"]],"treaty":{"name":"《汉谟拉比法典》","date":"公元前 18 世纪","items":["刻在一根黑色玄武岩石柱上，上部是太阳神向汉谟拉比授予权标的浮雕","宣扬君权神授，宣称国王的权力来自神","把居民分为公民、无公民权的自由民和奴隶三个等级","奴隶是主人的财产，可以买卖、转让","伤害案件按“以眼还眼，以牙还牙”处理，但同罪不同罚","条文涉及租佃、借贷、婚姻、继承，是了解古巴比伦社会的重要材料"],"note":"法典保护的是奴隶主阶级，不是全体居民；它是迄今已知世界上第一部较为完整的成文法典，不是“世界上第一部法律”。"},"significance":"《汉谟拉比法典》把习惯法固定为成文法典，说明古巴比伦已形成较成熟的国家管理与阶级秩序。它既是王权的宣言，也是社会生活的记录，让后人得以看清四千年前两河流域的等级、财产与家庭关系。","source":{"quote":"倘自由民毁损另一自由民之眼，则应毁其眼。","from":"《汉谟拉比法典》第 196 条（公元前 18 世纪）"},"pitfall":"法典属古巴比伦，不属古埃及；它按等级同罪不同罚；“初步统一”在前 24 世纪，汉谟拉比统一中下游在前 18 世纪。","memory":"两河弯弯楔形字，六十进位太阴历；汉谟拉比石柱上，君权神授护奴隶。","link":"上承埃及的尼罗河统一国家，本课看两河流域的小国、统一与法典；下一课转向印度河与恒河，看等级制度如何固化社会。","exam":["《汉谟拉比法典》的内容、地位与实质","楔形文字、60 进制等两河流域文明成就","汉谟拉比的统一与君主专制"]},{"id":"w1l3","num":3,"unit":"w1","title":"古代印度","years":"约前 2500—前 187 年","icon":"🕉","tag":"印度","hook":"摩亨佐·达罗古城的街道笔直相交，房屋用烧砖砌成，几乎每家都有浴室，污水顺着砖砌的暗沟流走。这座约公元前 2500 年的城市，比许多后世城市更讲究整洁。","core":"约公元前 2500 年，印度河流域出现哈拉帕文明；雅利安人进入后，恒河流域逐渐开发，形成婆罗门、刹帝利、吠舍、首陀罗四级种姓制度。公元前 6 世纪佛教兴起，反对种姓、主张“众生平等”；公元前 3 世纪阿育王基本统一印度半岛，佛教开始外传。","points":["约公元前 2500 年，印度河流域出现哈拉帕文明，摩亨佐·达罗等城市有规划整齐的街道和排水系统。","约公元前 1500 年，雅利安人进入印度，恒河流域逐渐开发；公元前 6 世纪前后，这里出现众多小国，互相争战。","种姓制度把人分为婆罗门（祭祀）、刹帝利（军政）、吠舍（农牧工商）、首陀罗（服务他人）四个等级，另有“不可接触者”。","种姓制度等级世代相袭、职业固定、贵贱分明，不同等级不得通婚，既维护统治秩序，也激化了社会矛盾。","公元前 6 世纪，乔达摩·悉达多创立佛教，反对种姓制度，主张“众生平等”，得到刹帝利和吠舍的支持。","孔雀王朝阿育王在位时基本统一印度半岛，定都华氏城，佛教开始向斯里兰卡、中亚和中国等地传播。"],"terms":[["种姓制度","古代印度以血统和职业划分社会等级的制度，分婆罗门、刹帝利、吠舍、首陀罗四个等级，世代相袭、互不通婚。"],["婆罗门","种姓制度中的第一等级，掌管祭祀和宗教事务，享有特权，被认为是“从造物神口中生出”的人。"],["佛教","公元前 6 世纪乔达摩·悉达多创立，反对种姓制度，主张“众生平等”、忍耐顺从，公元前 3 世纪开始向外传播。"],["哈拉帕文明","约公元前 2500 年出现在印度河流域的早期文明，以摩亨佐·达罗、哈拉帕等城市遗址为代表，有砖砌房屋和排水系统。"]],"figures":[["乔达摩·悉达多","即释迦牟尼，公元前 6 世纪创立佛教，主张“众生平等”"],["阿育王","孔雀王朝国王，在位时基本统一印度半岛，大力弘扬佛教并派人到境外传教"],["雅利安人","约公元前 1500 年进入印度的游牧民族，恒河流域的开发与种姓制度的形成都与之相关"]],"events":[["约公元前 2500 年","印度河流域出现哈拉帕文明"],["约公元前 1500 年","雅利安人进入印度，恒河流域逐渐开发"],["公元前 6 世纪","乔达摩·悉达多创立佛教"],["公元前 3 世纪","阿育王基本统一印度半岛，佛教开始外传"],["公元前 187 年","孔雀王朝灭亡"]],"treaty":null,"significance":"种姓制度把社会分工固定为世袭等级，短期内稳定了秩序，长期却压抑了社会活力；佛教以“众生平等”回应等级压迫，后来成为世界性宗教。古代印度的经验说明，制度与思想都在回答同一个问题：社会靠什么维持秩序。","source":{"quote":"他的口是婆罗门，他的双臂是刹帝利，他的双腿是吠舍，他的双足是首陀罗。","from":"《梨俱吠陀·原人歌》（约公元前 1000 年）"},"pitfall":"第一等级是掌祭祀的婆罗门，不是出国王的刹帝利；佛教反对种姓制度却主张忍耐顺从；阿育王统一的是印度半岛大部分地区。","memory":"婆罗门祭、刹帝利武，吠舍工商首陀罗仆；佛说平等反种姓，阿育王时传四方。","link":"本单元收束课：埃及的王权、两河的法典、印度的等级与宗教。下一单元转向地中海，看希腊城邦与罗马共和。","exam":["种姓制度的等级、特点与影响","佛教产生的背景、主张与传播","孔雀王朝与阿育王"]}],"questions":[{"id":"w1q1","lesson":"w1l1","unit":"w1","type":"choice","level":1,"stem":"古埃及人把尼罗河视为生命之河。尼罗河定期泛滥给埃及带来的最大好处是","options":["河道便于把金字塔的石料运到工地","泛滥后留下肥沃淤泥，便于发展灌溉农业","使埃及免受外族入侵","提供了取之不尽的木材"],"answer":1,"explain":"尼罗河每年定期泛滥，退水后留下厚厚一层肥沃淤泥，两岸因此易于耕种，农业的发展为埃及的统一和文明繁荣提供了基础。运输石料只是便利之一，不是“最大好处”；泛滥挡不住外族入侵，埃及后来先后被波斯、亚历山大帝国和罗马占领；埃及木材缺乏。","point":"尼罗河与古埃及文明"},{"id":"w1q2","lesson":"w1l1","unit":"w1","type":"choice","level":2,"stem":"胡夫金字塔高约 146.5 米，由约 230 万块巨石砌成，石块之间严丝合缝。这一工程最能说明古埃及","options":["已经普及铁制农具","王权强大，国家能组织大量人力和物力","已经建立起民主制度","商业贸易超过农业"],"answer":1,"explain":"金字塔是法老的陵墓，修建它需要调动全国的人力、粮食和技术，说明法老权力强大、国家组织能力很高。古埃及长期使用铜石工具，铁器普及很晚；法老统治是君主专制，没有民主制度；埃及经济以农业为主。","point":"金字塔与法老的王权"},{"id":"w1q3","lesson":"w1l1","unit":"w1","type":"order","level":2,"stem":"按时间先后排列下列古埃及历史事件","items":["尼罗河两岸出现若干小国","古埃及初步实现统一","胡夫金字塔建成","波斯帝国吞并古埃及","罗马灭亡托勒密王朝"],"explain":"约公元前 3500 年出现小国 → 约公元前 3100 年初步统一 → 约公元前 2600 年胡夫金字塔建成 → 公元前 525 年被波斯吞并 → 公元前 30 年被罗马灭亡。","point":"古埃及的历史进程"},{"id":"w1q4","lesson":"w1l1","unit":"w1","type":"fill","level":1,"stem":"约公元前 3100 年，古埃及初步实现统一，国王集军政大权于一身，被称为“______”，其陵墓是金字塔。","answer":["法老"],"explain":"“法老”是古埃及国王的称号，被视为神在人间的代表，掌握军政、司法和宗教大权，金字塔就是法老的陵墓。","point":"法老与王权"},{"id":"w1q5","lesson":"w1l2","unit":"w1","type":"choice","level":1,"stem":"“它刻在一根黑色玄武岩石柱上，上部是太阳神授予国王权标的浮雕，下部是二百多条法律条文。”这段描述的是","options":["《汉谟拉比法典》","《十二铜表法》","《查士丁尼法典》","《权利法案》"],"answer":0,"explain":"《汉谟拉比法典》是古巴比伦国王汉谟拉比颁布的成文法典，刻在黑色玄武岩石柱上，并用君权神授宣扬王权。《十二铜表法》是古代罗马的，《查士丁尼法典》是拜占庭帝国的，《权利法案》是英国 1689 年颁布的。","point":"《汉谟拉比法典》"},{"id":"w1q6","lesson":"w1l2","unit":"w1","type":"choice","level":2,"stem":"下列文明成果中，属于古代两河流域的是","options":["象形文字、太阳历","楔形文字、60 进制计数法","种姓制度、佛教","金字塔、木乃伊"],"answer":1,"explain":"楔形文字、60 进制计数法和太阴历是两河流域苏美尔人的创造；象形文字、太阳历、金字塔和木乃伊属于古埃及；种姓制度和佛教属于古代印度。","point":"两河流域的文明成就"},{"id":"w1q7","lesson":"w1l2","unit":"w1","type":"match","level":2,"stem":"把下列古代两河流域的成就与其内容配对","pairs":[["楔形文字","用芦苇杆在泥板上刻写的文字"],["《汉谟拉比法典》","刻在黑色石柱上的成文法典"],["60 进制","用于计算时间和角度的进位制"],["《吉尔伽美什》","苏美尔人留下的史诗"]],"explain":"楔形文字因笔画形似楔子得名；《汉谟拉比法典》是迄今已知世界上第一部较为完整的成文法典；60 进制至今仍用于时间和角度；《吉尔伽美什》是古代两河流域的著名史诗。","point":"两河流域的文明成就"},{"id":"w1q8","lesson":"w1l2","unit":"w1","type":"fill","level":2,"stem":"公元前 18 世纪，古巴比伦国王______统一两河流域中下游地区，并颁布了一部刻在黑色石柱上的成文法典。","answer":["汉谟拉比"],"explain":"汉谟拉比统一两河流域中下游，建立君主专制统治，颁布《汉谟拉比法典》，用法律维护奴隶主阶级的利益。","point":"汉谟拉比与古巴比伦"},{"id":"w1q9","lesson":"w1l3","unit":"w1","type":"choice","level":1,"stem":"古代印度种姓制度中，掌管祭祀、被认为是“从造物神口中生出”的等级是","options":["婆罗门","刹帝利","吠舍","首陀罗"],"answer":0,"explain":"婆罗门是第一等级，掌管祭祀和宗教事务；刹帝利是国王、武士和官吏；吠舍是农民、手工业者和商人；首陀罗是服务他人的劳动者，四个等级世代相袭，不得通婚。","point":"种姓制度的等级"},{"id":"w1q10","lesson":"w1l3","unit":"w1","type":"choice","level":3,"stem":"公元前 6 世纪，古代印度出现了一股反对种姓制度、主张“众生平等”的思潮。这股思潮后来发展成","options":["婆罗门教","佛教","伊斯兰教","基督教"],"answer":1,"explain":"乔达摩·悉达多创立的佛教反对种姓制度，主张“众生平等”，得到刹帝利和吠舍的支持；但它同时宣扬忍耐顺从，并不主张用暴力推翻等级社会。伊斯兰教兴起于 7 世纪的阿拉伯半岛，基督教兴起于 1 世纪的巴勒斯坦地区。","point":"佛教的兴起"},{"id":"w1q11","lesson":"w1l3","unit":"w1","type":"order","level":2,"stem":"按时间先后排列下列古代印度历史事件","items":["印度河流域出现哈拉帕文明","雅利安人进入印度","乔达摩·悉达多创立佛教","阿育王基本统一印度半岛","孔雀王朝灭亡"],"explain":"约公元前 2500 年哈拉帕文明兴起 → 约公元前 1500 年雅利安人进入印度 → 公元前 6 世纪佛教创立 → 公元前 3 世纪阿育王基本统一印度半岛 → 公元前 187 年孔雀王朝灭亡。","point":"古代印度的历史进程"},{"id":"w1q12","lesson":"w1l3","unit":"w1","type":"fill","level":2,"stem":"公元前 3 世纪，孔雀王朝国王______在位时，基本统一了印度半岛，佛教也开始向境外传播。","answer":["阿育王"],"explain":"阿育王在位时孔雀王朝国力鼎盛，基本统一印度半岛（半岛南端除外）；他大力弘扬佛教，派人到斯里兰卡等地传教，佛教由此逐渐成为世界性宗教。","point":"孔雀王朝与佛教外传"}],"timeline":[{"t":"约公元前 3500 年","y":-3500,"text":"尼罗河两岸和两河流域南部先后出现一些小国","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"约公元前 3100 年","y":-3100,"text":"古埃及初步实现统一，法老统治确立","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"约公元前 2600 年","y":-2600,"text":"胡夫金字塔建成，成为古埃及文明的象征","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"约公元前 2500 年","y":-2500,"text":"印度河流域出现哈拉帕文明，摩亨佐·达罗等城市兴起","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"约公元前 24 世纪","y":-2400,"text":"两河流域初步实现统一","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"公元前 18 世纪","y":-1800,"text":"汉谟拉比统一两河流域中下游，颁布《汉谟拉比法典》","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"约公元前 1500 年","y":-1500,"text":"雅利安人进入印度，恒河流域逐渐开发","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"公元前 6 世纪","y":-600,"text":"乔达摩·悉达多创立佛教，反对种姓制度","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"公元前 3 世纪","y":-300,"text":"阿育王基本统一印度半岛，佛教开始向外传播","unit":"w1","tag":"世界古代","volume":"v5"},{"t":"公元前 187 年","y":-187,"text":"孔雀王朝灭亡，古代印度进入新的分裂时期","unit":"w1","tag":"世界古代","volume":"v5"}]},{"volume":"v5","unit":{"id":"w2","volume":"v5","num":2,"title":"古代欧洲文明","short":"希腊罗马","years":"约公元前 2000—476 年","accent":"#42658A","soft":"#E9EFF7","tint":"#C7D6E7","icon":"🏛","tagline":"从爱琴海城邦到地中海帝国，看欧洲文明的两副面孔。","intro":"爱琴海的岛屿间，一个山头就能是一个邦；台伯河畔的村落，后来把地中海变成了内湖。本单元要看两条不同的路：希腊人在狭小的城邦里发明了公民大会和抽签任职，罗马人用军团和法律把分散的城邦联成帝国。它们都不是完美的样板——雅典的民主只属于少数人，罗马的繁荣离不开奴隶。读懂这两条路，才能读懂欧洲。","bigQuestion":"同样发源于地中海，为什么希腊留下的是城邦民主，罗马留下的却是帝国与法律？","goals":["说出希腊城邦的特点，理解雅典民主的进步与局限。","简述亚历山大东征的经过，辩证评价其历史影响。","梳理罗马从城邦到共和国再到帝国的演进。","分析《十二铜表法》的作用与罗马衰亡的原因。"],"keyLine":"希腊城邦小国寡民育民主，亚历山大东征连通三洲；罗马共和依法而治，屋大维开帝制，地中海终成内湖。"},"lessons":[{"id":"w2l1","num":4,"unit":"w2","title":"希腊城邦和亚历山大帝国","years":"前 8 世纪—前 323 年","icon":"🏛","tag":"希腊","hook":"公元前 5 世纪的一天清晨，雅典公民沿着山路涌向普尼克斯山，抽签、发言、举手。山下的比雷埃夫斯港帆影往来。这个只有几万公民的小邦，正决定着整个希腊的命运。","core":"公元前 8 世纪，希腊出现数以百计的城邦，小国寡民、独立自治。伯里克利时期，雅典以公民大会、抽签任职和津贴制度把民主政治推向高峰，但妇女、外邦人和奴隶被排除在外。公元前 4 世纪马其顿崛起，亚历山大东征灭波斯，建立起横跨欧亚非的帝国。","points":["地理环境：希腊多山多岛、海岸曲折、平原狭小、土地贫瘠，农业受限，却便利航海与海外贸易，城邦由此形成。","城邦特点：公元前 8 世纪出现，一般以一个城市为中心，包括周边村落，小国寡民、独立自治；斯巴达尚武，雅典重民主。","雅典民主：伯里克利时期，公民大会是最高权力机构，公职人员抽签产生并发放津贴；但妇女、外邦人、奴隶无权参加。","马其顿崛起：公元前 4 世纪，位于希腊北部的马其顿强大起来，征服希腊各邦，为亚历山大东征准备了条件。","东征建国：公元前 334 年亚历山大率军东征，灭掉波斯帝国，兵锋最远到达印度河流域，建立横跨欧亚非三洲的大帝国。","评价：东征具有侵略掠夺性质，给东方人民带来深重灾难；但客观上打通了东西方交通，促进了希腊文化与东方文化的交流。"],"terms":[["城邦","以一个城市为中心、包括周边村落的独立政治实体。希腊城邦小国寡民、独立自治，公民政治发达。"],["公民大会","雅典的最高权力机构，全体成年男性公民都可以参加，审议并决定城邦的重大事务。"],["津贴制度","伯里克利时期向参加公民大会和担任公职的公民发放津贴，使贫穷公民也能参与政治。"],["帕特农神庙","雅典卫城上的神庙，供奉雅典娜女神，是古希腊建筑艺术的杰出代表。"]],"figures":[["伯里克利","雅典执政者，主政时期民主政治达到高峰"],["亚历山大","马其顿国王，东征灭波斯，建立三洲帝国"],["亚里士多德","古希腊哲学家，亚历山大的老师，主张观察与思考"]],"events":[["公元前 8 世纪","希腊城邦出现"],["公元前 5 世纪中后期","伯里克利主政，雅典民主政治达到高峰"],["公元前 4 世纪","马其顿征服希腊各邦"],["公元前 334 年","亚历山大开始东征"],["公元前 323 年","亚历山大病逝，帝国分裂"]],"treaty":null,"significance":"希腊城邦的民主实践和公民意识，是西方政治文明的重要源头；亚历山大东征虽然给东方带来灾难，却使希腊文化随军队和商路东传，开启了东西方文明大规模交汇的“希腊化时代”。","source":{"quote":"我们的制度之所以被称为民主政治，是因为政权在全体公民手中，而不是在少数人手中。","from":"伯里克利演说，见修昔底德《伯罗奔尼撒战争史》（约公元前 5 世纪后期）"},"pitfall":"雅典民主只属于成年男性公民，妇女、外邦人和奴隶被排除在外，不能等同于现代民主；亚历山大东征是侵略战争。","memory":"多山多岛小城邦，雅典抽签开大会；马其顿出亚历山大，三洲帝国一夕分。","link":"上承古代亚非的大河文明，下启罗马从城邦到帝国的道路，是本册“西方文明源头”的第一站。","exam":["雅典民主政治的进步性与局限性","亚历山大东征的评价","希腊城邦的特点"]},{"id":"w2l2","num":5,"unit":"w2","title":"罗马城邦和罗马帝国","years":"前 753—476 年","icon":"🦅","tag":"罗马","hook":"公元前 216 年，坎尼平原上，罗马军团的方阵被迦太基骑兵撕开缺口，数万人倒在血泊里。谁也不会想到，这个惨败的城邦，两百年后会把整个地中海变成自己的“内湖”。","core":"罗马从台伯河畔的小城邦起步，公元前 509 年建立共和国，经布匿战争称霸地中海。公元前 27 年屋大维建立元首制，罗马进入帝国时代；公元 2 世纪版图横跨欧亚非，395 年帝国分裂，476 年西罗马帝国灭亡。","points":["城邦兴起：罗马兴起于意大利半岛台伯河畔，公元前 753 年建城（传说）；公元前 509 年推翻君主制，建立共和国。","共和政体：国家权力掌握在元老院、执政官和公民大会手中；执政官由选举产生、任期一年；平民长期斗争，设立保民官。","对外扩张：公元前 3 世纪统一意大利半岛；公元前 264—前 146 年三次布匿战争击败迦太基，成为地中海霸主。","社会危机：长期征战使奴隶制发展、小农破产，矛盾尖锐；公元前 73 年斯巴达克起义；公元前 49 年凯撒夺权。","帝国建立：公元前 27 年屋大维建立元首制，被尊为“奥古斯都”；此后约两百年局势相对稳定，史称“罗马和平”。","帝国衰亡：公元 2 世纪版图横跨欧亚非；3 世纪危机后，395 年分裂为东西两部分；476 年西罗马帝国被日耳曼人所灭。"],"terms":[["共和国","公元前 509 年罗马建立的国家形式。元老院、执政官和公民大会分掌权力，执政官由选举产生，任期一年。"],["布匿战争","公元前 264—前 146 年罗马与北非强国迦太基进行的三次战争。罗马获胜，取得地中海霸权。"],["《十二铜表法》","约公元前 450 年罗马颁布的第一部成文法。它使量刑定罪有了文字依据，是罗马法制建设的第一步。"],["元首制","公元前 27 年屋大维创立。它表面上保留共和制，实际上集军政大权于一身，是罗马帝国的统治形式。"]],"figures":[["屋大维","建立元首制，罗马帝国第一位统治者"],["凯撒","共和国末期军事统帅，公元前 49 年夺权，前 44 年被刺杀"],["斯巴达克","公元前 73 年领导奴隶大起义"],["汉尼拔","迦太基统帅，坎尼战役大败罗马军队"]],"events":[["公元前 509 年","罗马共和国建立"],["公元前 264 年","第一次布匿战争爆发"],["公元前 73 年","斯巴达克起义"],["公元前 27 年","屋大维建立元首制，罗马帝国建立"],["476 年","西罗马帝国灭亡"]],"treaty":null,"significance":"罗马以公民兵和法制起家，把地中海世界连成一体；它的法律、拉丁文字和建筑深刻影响了欧洲。西罗马帝国灭亡，标志西欧奴隶社会结束，欧洲历史进入封建时代。","source":{"quote":"我接受了一座用砖建造的罗马城，却留下一座大理石的城。","from":"屋大维语，见苏维托尼乌斯《罗马十二帝王传》（约 120 年）"},"pitfall":"公元前 27 年屋大维建立元首制，是罗马帝国开始的标志，不是共和国建立；476 年灭亡的是西罗马帝国，不是东罗马。","memory":"台伯河畔起城邦，元老执政共治邦；布匿三战霸中海，屋大维称制开帝国。","link":"承接希腊城邦的民主实验，罗马用法律和军团把地中海连成一体；西罗马灭亡后，欧洲进入封建时代，即下一单元的内容。","exam":["罗马共和国的权力结构","《十二铜表法》的历史地位","罗马帝国建立与西罗马灭亡的时间"]}],"questions":[{"id":"w2q1","lesson":"w2l1","unit":"w2","type":"choice","level":1,"stem":"公元前 8 世纪，希腊出现了数以百计的城邦。下列最能概括希腊城邦特点的是","options":["小国寡民，独立自治","中央集权，郡县管理","政教合一，等级森严","地广人多，王权至上"],"answer":0,"explain":"希腊城邦一般以一个城市为中心，包括周边村落，人口不多、面积狭小，各自独立自治。中央集权、郡县管理是秦朝的制度；政教合一、王权至上也不符合希腊城邦的实际。","point":"希腊城邦的特点"},{"id":"w2q2","lesson":"w2l1","unit":"w2","type":"choice","level":2,"stem":"伯里克利时期，雅典公民大会决定城邦大事，公职人员抽签产生。但下列人群中被排除在民主政治之外的是","options":["成年男性公民","妇女、外邦人和奴隶","服兵役的雅典公民","参加公民大会的公民"],"answer":1,"explain":"雅典民主政治建立在奴隶制基础之上，只有成年男性公民享有政治权利，妇女、外邦人和奴隶都被排除在外，所以它只是少数人的民主。","point":"雅典民主政治的局限性"},{"id":"w2q3","lesson":"w2l1","unit":"w2","type":"order","level":2,"stem":"按时间先后排列下列古代希腊的历史事件","items":["希腊城邦出现","伯里克利主政，雅典民主政治达到高峰","马其顿征服希腊各邦","亚历山大开始东征","亚历山大病逝，帝国分裂"],"explain":"公元前 8 世纪希腊城邦出现 → 公元前 5 世纪中后期伯里克利主政 → 公元前 4 世纪马其顿征服希腊 → 公元前 334 年亚历山大东征 → 公元前 323 年亚历山大病逝、帝国分裂。","point":"希腊城邦与亚历山大帝国"},{"id":"w2q4","lesson":"w2l1","unit":"w2","type":"fill","level":2,"stem":"公元前 5 世纪中后期，______主政，雅典的奴隶制民主政治发展到高峰，公民大会成为最高权力机构。","answer":["伯里克利","伯利克里"],"explain":"伯里克利主政时期，雅典公民大会是最高权力机构，公职人员抽签产生，并给参政公民发放津贴，民主政治发展到高峰；但妇女、外邦人和奴隶仍被排除在外。","point":"雅典民主政治的高峰"},{"id":"w2q5","lesson":"w2l2","unit":"w2","type":"choice","level":1,"stem":"罗马共和国建立于","options":["公元前 753 年","公元前 509 年","公元前 27 年","公元前 146 年"],"answer":1,"explain":"公元前 753 年是罗马建城的传统时间；公元前 509 年罗马废除君主制、建立共和国；公元前 27 年屋大维建立元首制，罗马帝国开始；公元前 146 年罗马在布匿战争后称霸地中海。","point":"罗马共和国的建立"},{"id":"w2q6","lesson":"w2l2","unit":"w2","type":"choice","level":2,"stem":"对《十二铜表法》的认识，正确的是","options":["它是罗马第一部成文法，使量刑定罪有了文字依据","它废除了奴隶制度，实现了公民人人平等","它是屋大维建立元首制的法律依据","它是雅典民主政治的重要成果"],"answer":0,"explain":"《十二铜表法》约颁布于公元前 450 年，是罗马第一部成文法，打破了贵族对法律的垄断，使量刑定罪有了文字依据；但它本质上仍维护奴隶主贵族的利益，并没有废除奴隶制，也与雅典民主、元首制无关。","point":"《十二铜表法》"},{"id":"w2q7","lesson":"w2l2","unit":"w2","type":"match","level":2,"stem":"把下列人物与其主要活动配对","pairs":[["屋大维","建立元首制，罗马帝国开始"],["凯撒","公元前 49 年夺取政权，前 44 年被刺杀"],["斯巴达克","公元前 73 年领导奴隶起义"],["汉尼拔","率迦太基军队在坎尼大败罗马"]],"explain":"屋大维于公元前 27 年建立元首制；凯撒在共和国末期夺权，后被刺杀；斯巴达克领导的起义沉重打击了罗马共和国的统治；汉尼拔是迦太基统帅，曾在坎尼战役中大败罗马军队。","point":"罗马的重要人物"},{"id":"w2q8","lesson":"w2l2","unit":"w2","type":"choice","level":3,"stem":"476 年，西罗马帝国在日耳曼人的打击下灭亡。这一事件的历史意义是","options":["标志西欧奴隶社会结束","标志罗马共和国建立","标志地中海成为罗马的“内湖”","标志基督教在罗马兴起"],"answer":0,"explain":"西罗马帝国灭亡标志着西欧奴隶社会的结束，欧洲开始进入封建社会。罗马共和国建立于公元前 509 年；地中海成为“内湖”是公元 2 世纪帝国鼎盛时的景象；基督教兴起于 1 世纪的巴勒斯坦地区。","point":"西罗马帝国灭亡的意义"}],"timeline":[{"t":"约公元前 2000 年","y":-2000,"text":"爱琴文明兴起，克里特岛出现王宫建筑群","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元前 8 世纪","y":-800,"text":"希腊出现数以百计的城邦，雅典、斯巴达最为著名","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元前 509 年","y":-509,"text":"罗马废除君主制，建立共和国","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元前 5 世纪中后期","y":-450,"text":"伯里克利主政，雅典民主政治达到高峰","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元前 334 年","y":-334,"text":"亚历山大率军东征，先后灭掉波斯帝国","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元前 3 世纪","y":-270,"text":"罗马统一意大利半岛","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元前 2 世纪","y":-146,"text":"布匿战争结束，罗马成为地中海霸主","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元前 27 年","y":-27,"text":"屋大维建立元首制，罗马帝国建立","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"公元 2 世纪","y":100,"text":"罗马帝国版图横跨欧亚非，地中海成为“内湖”","unit":"w2","tag":"世界古代","volume":"v5"},{"t":"476 年","y":476,"text":"西罗马帝国灭亡，标志西欧奴隶社会结束","unit":"w2","tag":"世界古代","volume":"v5"}]},{"volume":"v5","unit":{"id":"w3","volume":"v5","num":3,"title":"封建时代的欧洲","short":"中古欧洲","years":"476—1453 年","accent":"#4B6E8E","soft":"#EAF0F7","tint":"#CBD8E8","icon":"⛪","tagline":"庄园、城市、大学与拜占庭，共同拼出中世纪的欧洲。","intro":"西罗马帝国灭亡后，日耳曼人在废墟上建立法兰克王国，基督教渗入日常生活。庄园成为农村基本的经济与政治单位，城市重新兴起，大学在 12 世纪诞生。东部的拜占庭帝国保存着罗马法与古典文献，直到 1453 年才落幕。这个单元要回答：被称为“黑暗时代”的中世纪，给近代欧洲留下了什么？","bigQuestion":"中世纪常被称为“黑暗时代”，为什么它同时又孕育着近代欧洲的契约、法治与大学？","goals":["梳理基督教兴起与法兰克王国的兴衰线索。","说明封君封臣制和庄园制的内容与特点。","理解城市自治与大学兴起的历史影响。","认识拜占庭帝国与《罗马民法大全》的地位。"],"keyLine":"1 世纪基督教兴起 · 481 年法兰克王国建立 · 800 年查理曼加冕 · 843 年帝国三分 · 9 世纪庄园流行 · 12 世纪大学兴起 · 1453 年拜占庭灭亡"},"lessons":[{"id":"w3l1","num":6,"unit":"w3","title":"基督教的兴起和法兰克王国","years":"1 世纪—843 年","icon":"✝","tag":"中世纪","hook":"公元 800 年 12 月 25 日，罗马圣彼得大教堂里，教皇把皇冠戴在一个高大的法兰克国王头上，众人高呼“罗马人的皇帝”。他叫查理，是当时西欧最有权势的人。","core":"基督教 1 世纪产生于巴勒斯坦地区，4 世纪末被定为罗马国教。西罗马灭亡后，法兰克王国崛起，克洛维皈依基督教，查理·马特改革形成封君封臣制。800 年查理曼加冕，843 年帝国一分为三，德意志、法兰西、意大利的雏形由此出现。","points":["基督教兴起：1 世纪，巴勒斯坦地区的犹太人长期遭受苦难，渴望“救世主”到来，传道者宣传耶稣就是救世主。","从被迫害到国教：基督教早期在罗马帝国境内传播，信徒遭受迫害；4 世纪末，罗马皇帝将基督教确定为国教，教会势力迅速膨胀。","法兰克王国建立：481 年，克洛维建立法兰克王国。为取得罗马教会的支持，克洛维皈依基督教，并把大片土地赐给教会和封建主。","封君封臣制：8 世纪前期，查理·马特把无条件赏赐改为有条件分封，受封者须服兵役；封君保护封臣，封臣效忠封君。","查理曼的统治：800 年教皇为查理加冕，称“罗马人的皇帝”；他四处征战扩大版图，推行“什一税”，借教会巩固统治。","帝国三分：843 年，查理曼的三个孙子签订《凡尔登条约》，把帝国一分为三，奠定了德意志、法兰西、意大利三个国家的雏形。"],"terms":[["封君封臣制","8 世纪前期查理·马特改革后形成。封君把土地封给封臣，封臣须效忠封君、服兵役；封君则须保护封臣，双方各有义务。"],["什一税","教会按居民收入的十分之一征收的税，查理曼时期大力推行，用于维持教会和教士，是基督教深入西欧社会生活的表现。"],["丕平献土","751 年宫相丕平建立加洛林王朝，其后把意大利中部大片土地献给教皇，教皇国由此出现，王权与教权进一步结合。"],["《凡尔登条约》","843 年查理曼的三个孙子签订，把查理曼帝国分为三部分，后来分别发展为德意志、法兰西和意大利。"]],"figures":[["耶稣","基督教创立者，1 世纪在巴勒斯坦地区传教"],["克洛维","481 年建立法兰克王国，皈依基督教"],["查理·马特","法兰克宫相，改革土地分封，促成封君封臣制"],["查理曼","800 年加冕为“罗马人的皇帝”，推行什一税"]],"events":[["1 世纪","基督教产生于巴勒斯坦地区"],["481 年","克洛维建立法兰克王国"],["8 世纪前期","查理·马特改革，封君封臣制形成"],["800 年","教皇为查理加冕，称“罗马人的皇帝”"],["843 年","《凡尔登条约》签订，帝国三分"]],"treaty":{"name":"《凡尔登条约》","date":"843 年","items":["查理曼帝国被分为三部分，由查理曼的三个孙子分别统治","西法兰克王国成为后来法兰西的雏形","东法兰克王国成为后来德意志的雏形","中法兰克王国成为后来意大利的雏形"],"note":"条约只划定了疆界，没有解决王权衰弱和封建割据的问题。三个王国各自发展，西欧从此再未统一为一个帝国。"},"significance":"基督教从受迫害的民间信仰变成罗马国教，又借法兰克王国的力量传遍西欧；封君封臣制把土地、兵役和忠诚绑在一起，成为西欧封建制度的基本骨架；843 年的三分则勾出了德、法、意三国的轮廓。","source":{"quote":"上帝所加冕的伟大而和平的罗马人皇帝查理·奥古斯都，长寿与胜利！","from":"《法兰克王国年代记》（800 年）"},"pitfall":"基督教诞生于 1 世纪的巴勒斯坦，不是罗马城；800 年加冕的是查理曼，不是克洛维；843 年三分的是查理曼帝国。","memory":"一世纪巴勒斯坦，四世纪末成国教；四八一克洛维，八百加冕查理曼，八四三分德法意。","link":"法兰克王国把西欧带入封建时代。本课立起的封君封臣关系，将在下一课庄园的土地上变成日常的劳役与秩序。","exam":["基督教的兴起与国教地位","封君封臣制的形成与双方义务","查理曼帝国与 843 年三分"]},{"id":"w3l2","num":7,"unit":"w3","title":"西欧庄园","years":"9—13 世纪","icon":"🏰","tag":"庄园","hook":"天刚亮，庄园的钟声响起。农奴扛着锄头走向领主的自营地，得先干完领主的活，才能去种自己那块份地。日落时分，庄园法庭又开庭了，罚金照例归领主。","core":"从 9 世纪开始，庄园在西欧流行，11 世纪遍布各地。庄园是独立的自给自足的经济和政治单位，土地分为领主自营地和农民份地，居民是领主与佃户。庄园法庭依据习惯法审判，既维护领主利益，也在一定程度上限制领主的专横。","points":["庄园兴起：9 世纪开始在西欧流行，11 世纪遍布欧洲各地，成为中世纪西欧农村基本的经济和社会组织。","土地构成：庄园土地分为领主自营地和农民份地。自营地由领主直接经营，收入全部归领主；份地交给佃户使用，佃户须为领主服劳役。","居民身份：庄园居民分为领主和佃户。自由农民有人身自由，须服一定劳役；农奴人身不自由，被固定在领主土地上。","经济特点：庄园是独立的自给自足的经济和政治单位，生产主要满足自身需要，很少与外界交换，有教堂、磨坊和作坊。","庄园法庭：由领主或其管家主持，依据习惯法或村法审判，惩罚违法行为的主要手段是罚金，既维护领主利益，也限制领主专横。","历史地位：庄园是西欧封建制度的经济基础，领主靠庄园取得收入、控制人口；随着商品经济发展和货币地租流行，庄园逐渐走向衰落。"],"terms":[["庄园","西欧中世纪农村基本的经济和社会组织，9 世纪流行，11 世纪遍布各地，土地由领主自营地和农民份地构成，自给自足。"],["佃户","庄园中租种领主土地的人，包括自由农民和农奴。他们都要为领主服劳役、缴纳捐税，但人身自由程度不同。"],["农奴","庄园中人身不自由的劳动者，被固定在领主土地上，须服劳役、交纳各种捐税，迁徙和婚姻都受领主限制。"],["庄园法庭","庄园内处理纠纷、惩罚违法行为的机构，由领主或其管家主持，依据习惯法或村法审判，罚金归领主。"]],"figures":[["领主","庄园的主人，占有自营地，主持庄园法庭"],["自由农民","有人身自由，租种份地，须为领主服一定劳役"],["农奴","人身不自由，固定在土地上，负担劳役和捐税"]],"events":[["9 世纪","庄园在西欧开始流行"],["11 世纪","庄园遍布欧洲各地"],["14 世纪","商品经济发展，货币地租流行，庄园逐渐衰落"]],"treaty":null,"significance":"庄园是西欧封建社会的经济基础：土地、劳役和司法权集中在领主手中，农奴被束缚在土地上。自给自足的经济使中世纪早期商业萧条，也塑造了农村森严的等级秩序。","source":{"quote":"庄园是一个独立的自给自足的经济和政治单位。","from":"据教材相关表述整理"},"pitfall":"庄园土地分领主自营地和农民份地，并非全归领主；农奴与自由农民都是佃户，区别在人身自由；庄园法庭按习惯法审判。","memory":"九世纪兴十一盛，自营份地两分开；劳役捐税加法庭，自给自足小天地。","link":"庄园回答了“中世纪的人靠什么活着”。下一课，交换重新活跃，城市在庄园的边缘长出来，市民开始向领主争取自由。","exam":["庄园的土地构成与居民身份","庄园法庭的职能与特点","庄园经济自给自足的特点"]},{"id":"w3l3","num":8,"unit":"w3","title":"中世纪城市和大学的兴起","years":"10—14 世纪","icon":"🎓","tag":"城市","hook":"1112 年的一个清晨，法国琅城的市民敲响警钟，拿起武器冲向主教府。他们不愿再交沉重的赋税，要为自己争一份自由。这场斗争持续多年，琅城终于获得自治权。","core":"10 世纪起，西欧城市重新兴起，意大利、法兰西、英格兰等地出现一批工商业城市。市民用金钱赎买或武力斗争争取自治，市民阶层逐渐形成。12 世纪大学兴起，巴黎大学、牛津大学等被誉为中世纪教育“最美好的花朵”。","points":["城市复兴：10 世纪起，西欧农业恢复、商业活跃，意大利、法兰西、英格兰、德意志等地出现了一批工商业城市。","自治斗争：城市大多坐落在封建领主的领地上，市民受领主盘剥。市民争取自由和自治，常用金钱赎买和武力斗争两种方式。","琅城起义：1112 年，法国琅城市民武装反抗主教和领主的统治，经过长期斗争取得自治权，是武力斗争方式的典型。","自治权利：取得自治的城市获得“自由证书”，享有市政管理权，市民免交赋税、不服劳役，人身自由受到保障。","市民阶层：城市居民以手工业者和商人为主，随着工商业发展，市民阶层形成并壮大，其中的富裕商人成为早期资产阶级。","大学兴起：12 世纪，巴黎大学、牛津大学等相继出现。大学享有免赋税、司法独立、教育自主等权利，课程分基础与专业课程。"],"terms":[["自由证书","城市从领主手中取得自治权时得到的凭证，写明城市享有的权利，市民人身自由、免服劳役，可以自行管理市政。"],["市民阶层","城市中兴起的以手工业和商业为生的居民群体，随着城市经济发展不断壮大，其中的富裕商人成为早期资产阶级。"],["大学","12 世纪在西欧兴起的教师与学生组成的团体，享有免赋税、司法独立等自治权，课程分基础课程与专业课程。"],["琅城起义","1112 年法国琅城市民为争取城市自治发动的武装起义，是西欧城市自治斗争中武力斗争方式的典型。"]],"figures":[["琅城市民","1112 年起义，以武力争取城市自治"],["城市商人","以金钱赎买方式向领主换取城市自由"],["巴黎大学师生","12 世纪组成大学团体，争取自治权利"]],"events":[["10 世纪","西欧城市重新兴起"],["11 世纪","城市争取自治的斗争广泛展开"],["1112 年","法国琅城起义"],["12 世纪","巴黎大学、牛津大学等相继出现"]],"treaty":null,"significance":"城市复兴让西欧的商品交换重新活跃，市民阶层成为一支新的社会力量；大学把教育从修道院带进城市，为文艺复兴和近代科学准备了人才。中世纪的城市与大学，是近代欧洲自由与知识传统的起点。","source":{"quote":"大学的兴起被认为是欧洲中世纪教育“最美好的花朵”。","from":"据教材相关表述整理"},"pitfall":"城市自治不是完全独立，城市仍承认国王或领主的宗主权；大学兴起于 12 世纪，不是文艺复兴时期；市民阶层不等于资产阶级。","memory":"十世纪城复兴，赎买武力争自由；十二世纪大学兴，七艺法医神学修。","link":"城市与大学为西欧打开了商品和知识的窗口。下一课转向东方的拜占庭，那里保存着罗马法与古典文化，却在 1453 年走向终结。","exam":["城市争取自治的方式与结果","市民阶层的形成与影响","大学兴起的表现与自治权利"]},{"id":"w3l4","num":9,"unit":"w3","title":"拜占庭帝国和《查士丁尼法典》","years":"395—1453 年","icon":"📜","tag":"拜占庭","hook":"1453 年 5 月 29 日，奥斯曼土耳其的军队翻过君士坦丁堡的城墙。末代皇帝君士坦丁十一世战死。延续千年的拜占庭帝国，就在这一天落幕。","core":"330 年君士坦丁堡建成，395 年罗马帝国分裂，东罗马帝国（拜占庭帝国）延续千年。6 世纪查士丁尼组织编纂《罗马民法大全》，集罗马法之大成。1453 年，奥斯曼土耳其攻占君士坦丁堡，帝国灭亡。","points":["帝国建立：330 年，君士坦丁迁都拜占庭，改名君士坦丁堡；395 年帝国分裂为东西两部分，东罗马帝国定都于此。","地理位置：拜占庭帝国地跨欧亚非三洲，君士坦丁堡扼守黑海与地中海的通道，商业繁荣，是东西方贸易的枢纽。","查士丁尼的统治：6 世纪，查士丁尼即位，对内加强中央集权，对外扩张，一度夺回部分西罗马故土，并下令编纂法律文献。","《罗马民法大全》：包括《查士丁尼法典》《法学汇纂》《法理概要》《新法典》，承认奴隶制但改善奴隶处境，明确财产与契约规定。","帝国衰落：7 世纪起，阿拉伯人不断进攻；1204 年，第四次十字军东征攻陷君士坦丁堡，帝国元气大伤，版图不断缩小。","帝国灭亡与影响：1453 年奥斯曼土耳其攻占君士坦丁堡。它保存大量希腊、罗马古典文献，融合东西方文化，影响文艺复兴。"],"terms":[["拜占庭帝国","即东罗马帝国，395 年罗马帝国分裂后建立，定都君士坦丁堡，地跨欧亚非三洲，1453 年被奥斯曼土耳其灭亡。"],["《罗马民法大全》","6 世纪查士丁尼组织编纂的法律文献总称，包括《查士丁尼法典》等四部，是罗马法的集大成，奠定了欧洲民法的基础。"],["《查士丁尼法典》","查士丁尼下令编纂的罗马法律汇编，收录历代罗马皇帝的法令，是《罗马民法大全》的重要组成部分。"],["君士坦丁堡","原称拜占庭，330 年罗马皇帝君士坦丁迁都于此并改名，是拜占庭帝国的首都和东西方贸易的枢纽。"]],"figures":[["君士坦丁","罗马皇帝，330 年迁都拜占庭，改名君士坦丁堡"],["查士丁尼","6 世纪拜占庭皇帝，组织编纂《罗马民法大全》"],["君士坦丁十一世","拜占庭末代皇帝，1453 年城破时战死"]],"events":[["330 年","君士坦丁迁都拜占庭，改名君士坦丁堡"],["395 年","罗马帝国分裂为东、西两部分"],["6 世纪","查士丁尼组织编纂《罗马民法大全》"],["1204 年","第四次十字军东征攻陷君士坦丁堡"],["1453 年","奥斯曼土耳其攻占君士坦丁堡，帝国灭亡"]],"treaty":{"name":"《罗马民法大全》","date":"6 世纪（查士丁尼在位期间）","items":["《查士丁尼法典》：收录历代罗马皇帝的法令","《法学汇纂》：汇编罗马法学家的学说和法律解释","《法理概要》：法学的入门教材","《新法典》：查士丁尼在位后期颁布的法令汇编","仍然承认奴隶制，但在一定程度上改善了奴隶的地位","对财产、买卖、债务、契约关系等作出明确规定"],"note":"《罗马民法大全》是罗马法的集大成，奠定了欧洲民法的基础。它是四部法律文献的总称，《查士丁尼法典》只是其中一部。"},"significance":"拜占庭帝国在千年间挡住了外族对西欧的冲击，保存了希腊罗马的古典文献与罗马法传统；《罗马民法大全》成为欧洲民法的基石，查士丁尼的名字因此留在了西方法律史上。","source":{"quote":"皇帝的威严不但依靠兵器，而且须用法律来巩固。","from":"查士丁尼《法学阶梯》序言（6 世纪）"},"pitfall":"拜占庭帝国就是东罗马帝国，不是西罗马；《罗马民法大全》是四部文献的总称；帝国亡于 1453 年，不是 476 年。","memory":"三三〇迁都君堡，三九五东西分；六世纪查士丁尼，民法大全集大成；一四五三君堡陷，千年帝国终落幕。","link":"拜占庭保存的古典文献与罗马法，将在下一单元被意大利的人文主义者重新发现，成为文艺复兴的火种。","exam":["《罗马民法大全》的构成与地位","拜占庭帝国衰落与灭亡的原因","拜占庭文化的历史影响"]}],"questions":[{"id":"w3q1","lesson":"w3l1","unit":"w3","type":"choice","level":1,"stem":"基督教产生于 1 世纪的","options":["巴勒斯坦地区","罗马城","君士坦丁堡","雅典"],"answer":0,"explain":"1 世纪，基督教产生于罗马帝国统治下的巴勒斯坦地区，传道者宣传耶稣就是“救世主”。罗马城后来成为西部教会的中心，君士坦丁堡是拜占庭帝国的首都。","point":"基督教的兴起"},{"id":"w3q2","lesson":"w3l1","unit":"w3","type":"choice","level":2,"stem":"8 世纪前期，查理·马特把无条件赏赐土地改为有条件分封，受封者必须为封君服兵役。这一改革直接促成的是","options":["封君封臣制","庄园法庭","城市自治","什一税"],"answer":0,"explain":"有条件分封使封君与封臣之间形成权利和义务关系：封臣效忠、服兵役，封君保护封臣，这就是封君封臣制。庄园法庭是庄园内的司法机构，城市自治是市民争取的权利，什一税是教会征收的税。","point":"封君封臣制"},{"id":"w3q3","lesson":"w3l1","unit":"w3","type":"order","level":2,"stem":"按时间先后排列下列西欧中世纪早期的事件","items":["基督教产生于巴勒斯坦地区","西罗马帝国灭亡","克洛维建立法兰克王国","查理曼加冕为“罗马人的皇帝”","《凡尔登条约》签订"],"explain":"1 世纪基督教产生 → 476 年西罗马帝国灭亡 → 481 年克洛维建立法兰克王国 → 800 年查理曼加冕 → 843 年《凡尔登条约》签订，帝国三分。","point":"法兰克王国的兴衰"},{"id":"w3q4","lesson":"w3l1","unit":"w3","type":"fill","level":2,"stem":"843 年，查理曼的三个孙子签订《______》，把帝国一分为三，奠定了德意志、法兰西、意大利三个国家的雏形。","answer":["凡尔登条约","《凡尔登条约》"],"explain":"《凡尔登条约》签订于 843 年，查理曼帝国从此分为西法兰克、东法兰克和中法兰克三部分，西欧再未统一为一个帝国。","point":"查理曼帝国的分裂"},{"id":"w3q5","lesson":"w3l2","unit":"w3","type":"choice","level":1,"stem":"西欧庄园的土地中，收入全部归领主所有的是","options":["领主自营地","自由农民的份地","农奴的份地","教会的地产"],"answer":0,"explain":"领主自营地由领主直接经营，收入全部归领主；份地交给佃户使用，收成归佃户，但佃户须为领主服劳役。教会地产不属于庄园土地的划分。","point":"庄园的土地构成"},{"id":"w3q6","lesson":"w3l2","unit":"w3","type":"choice","level":2,"stem":"西欧庄园里的农奴与自由农民相比，最主要的区别是","options":["农奴要服劳役，自由农民不服劳役","农奴人身不自由，被固定在领主的土地上","农奴不耕种领主的自营地","农奴不受庄园法庭的管辖"],"answer":1,"explain":"两者都是佃户，都要为领主服劳役、受庄园法庭管辖，区别在于人身是否自由。农奴人身不自由，被固定在土地上，迁徙和婚姻都受领主限制。","point":"庄园的居民"},{"id":"w3q7","lesson":"w3l2","unit":"w3","type":"match","level":2,"stem":"把下列庄园事物与其特点配对","pairs":[["领主自营地","由领主直接经营，收入全部归领主"],["农民份地","交给佃户使用，佃户须服劳役"],["庄园法庭","依据习惯法审判，罚金归领主"],["农奴","人身不自由，被固定在土地上"]],"explain":"庄园的土地分为自营地和份地；庄园法庭用习惯法维持庄园秩序，罚金归领主；农奴是庄园中人身最不自由的劳动者。","point":"庄园的构成与运作"},{"id":"w3q8","lesson":"w3l2","unit":"w3","type":"fill","level":2,"stem":"西欧庄园中处理纠纷、惩罚违法行为的机构是______，由领主或其管家主持，审判依据是习惯法或村法。","answer":["庄园法庭"],"explain":"庄园法庭惩罚违法行为的主要手段是处以罚金，罚金归领主。它维护领主的利益，也在一定程度上限制领主的专横，维护庄园的公共秩序。","point":"庄园法庭"},{"id":"w3q9","lesson":"w3l3","unit":"w3","type":"choice","level":1,"stem":"中世纪西欧城市争取自由和自治，常用的方式是","options":["金钱赎买和武力斗争","等待国王主动赐予","请求教会出面调解","全体市民投票公决"],"answer":0,"explain":"城市大多位于封建领主的领地上，市民用金钱向领主赎买自由，或者用武力斗争争取自治，法国琅城起义就是武力斗争的典型。","point":"城市争取自治"},{"id":"w3q10","lesson":"w3l3","unit":"w3","type":"choice","level":2,"stem":"12 世纪在西欧兴起、被誉为中世纪教育“最美好的花朵”的是","options":["大学的兴起","庄园法庭的设立","行会组织的出现","骑士学校的普及"],"answer":0,"explain":"12 世纪，巴黎大学、牛津大学等相继出现，大学享有免赋税、司法独立、教育自主等权利，打破了教会对教育的垄断。","point":"大学的兴起"},{"id":"w3q11","lesson":"w3l3","unit":"w3","type":"order","level":2,"stem":"按时间先后排列下列西欧城市与大学发展中的事件","items":["西欧城市重新兴起","法国琅城起义爆发","巴黎大学、牛津大学等相继出现","市民阶层成为西欧新的社会力量"],"explain":"10 世纪起西欧城市重新兴起 → 1112 年琅城起义 → 12 世纪大学兴起 → 随着工商业发展，市民阶层壮大，成为新的社会力量。","point":"城市与大学的兴起"},{"id":"w3q12","lesson":"w3l3","unit":"w3","type":"fill","level":3,"stem":"12 世纪西欧大学的基础课程包括文法、修辞、逻辑、算术、几何、天文和音乐，专业课程有法学、医学和______。","answer":["神学"],"explain":"中世纪大学深受教会影响，神学是专业课程中最重要的一门；法学和医学则适应了城市工商业发展对社会人才的需要。","point":"大学的课程"},{"id":"w3q13","lesson":"w3l4","unit":"w3","type":"choice","level":1,"stem":"6 世纪组织编纂《罗马民法大全》的拜占庭皇帝是","options":["查士丁尼","君士坦丁","狄奥多西","君士坦丁十一世"],"answer":0,"explain":"6 世纪，查士丁尼下令编纂《查士丁尼法典》《法学汇纂》《法理概要》《新法典》，后世合称《罗马民法大全》。君士坦丁是 330 年迁都的皇帝，君士坦丁十一世是末代皇帝。","point":"《罗马民法大全》"},{"id":"w3q14","lesson":"w3l4","unit":"w3","type":"choice","level":2,"stem":"拜占庭帝国灭亡于","options":["395 年","476 年","1204 年","1453 年"],"answer":3,"explain":"1453 年，奥斯曼土耳其攻占君士坦丁堡，拜占庭帝国灭亡。395 年罗马帝国分裂，476 年西罗马帝国灭亡，1204 年第四次十字军攻陷君士坦丁堡但帝国并未灭亡。","point":"拜占庭帝国的灭亡"},{"id":"w3q15","lesson":"w3l4","unit":"w3","type":"match","level":2,"stem":"把下列时间与拜占庭帝国的相关事件配对","pairs":[["330 年","君士坦丁迁都拜占庭，改名君士坦丁堡"],["395 年","罗马帝国分裂为东、西两部分"],["1204 年","第四次十字军东征攻陷君士坦丁堡"],["1453 年","奥斯曼土耳其攻占君士坦丁堡，帝国灭亡"]],"explain":"330 年君士坦丁堡建成，395 年帝国分裂，1204 年十字军攻陷首都使帝国元气大伤，1453 年奥斯曼土耳其攻占君士坦丁堡，拜占庭帝国灭亡。","point":"拜占庭帝国的兴衰"},{"id":"w3q16","lesson":"w3l4","unit":"w3","type":"fill","level":3,"stem":"《罗马民法大全》包括《查士丁尼法典》《法学汇纂》《法理概要》和《______》四部法律文献。","answer":["新法典","《新法典》"],"explain":"《新法典》收录查士丁尼在位后期颁布的法令。四部文献合称《罗马民法大全》，是罗马法的集大成，奠定了欧洲民法的基础。","point":"《罗马民法大全》的构成"}],"timeline":[{"t":"1 世纪","y":30,"text":"基督教产生于巴勒斯坦地区","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"330 年","y":330,"text":"君士坦丁迁都拜占庭，改名君士坦丁堡","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"476 年","y":476,"text":"西罗马帝国灭亡，西欧进入封建时代","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"481 年","y":481,"text":"克洛维建立法兰克王国","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"6 世纪","y":530,"text":"查士丁尼组织编纂《罗马民法大全》","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"800 年","y":800,"text":"教皇为查理加冕，称“罗马人的皇帝”","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"843 年","y":843,"text":"《凡尔登条约》签订，查理曼帝国一分为三","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"9 世纪","y":900,"text":"庄园在西欧流行，成为农村基本的经济和政治单位","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"12 世纪","y":1150,"text":"巴黎大学、牛津大学等兴起，西欧大学诞生","unit":"w3","tag":"世界中古","volume":"v5"},{"t":"1453 年","y":1453,"text":"奥斯曼土耳其攻占君士坦丁堡，拜占庭帝国灭亡","unit":"w3","tag":"世界中古","volume":"v5"}]},{"volume":"v5","unit":{"id":"w4","volume":"v5","num":4,"title":"封建时代的亚洲国家","short":"亚洲中世纪","years":"5—16 世纪","accent":"#3F6386","soft":"#E8EFF6","tint":"#C6D5E5","icon":"🏯","tagline":"日本学唐而变，阿拉伯承古而兴：亚洲中世纪的两种道路","intro":"5 世纪以后，亚洲的日本与阿拉伯半岛先后走出自己的封建之路：日本隔着大海凝望隋唐，把律令、土地和官制搬回岛上；阿拉伯人骑着骆驼与战马，用一部经典把分散的部落拧成横跨三洲的帝国。同一片大陆，两种答案——这一单元要看清楚：地理、信仰与外来文明，怎样塑造出不同的国家。","bigQuestion":"同样面对中古时代，为什么日本走向幕府与武士的割据，阿拉伯却建成政教合一的跨洲帝国？","goals":["说出大化改新的背景、内容与对日本社会的影响","解释武士集团与幕府统治形成的原因和特点","概述伊斯兰教创立、半岛统一与帝国扩张的历程","举例说明阿拉伯人在东西方文化交流中的作用"],"keyLine":"622 年穆罕默德迁居麦地那 → 646 年日本大化改新 → 8 世纪中期阿拉伯帝国地跨三洲 → 12 世纪末日本进入幕府时代"},"lessons":[{"id":"w4l1","num":10,"unit":"w4","title":"古代日本","years":"5—12 世纪","icon":"🌸","tag":"日本","hook":"645 年夏，飞鸟板盖宫的大殿里，中大兄皇子当着天皇的面诛杀权臣苏我入鹿。血迹未干，一场以唐朝为蓝本的改革已经排上日程。","core":"日本在 5 世纪由大和政权基本统一。646 年起，日本仿效中国隋唐制度推行大化改新，废除私地私民，建立以天皇为中心的中央集权，发展为封建国家。8 世纪后土地兼并、庄园兴起，武士集团随之壮大；12 世纪末源赖朝设镰仓幕府，日本进入近 700 年的幕府时代。","points":["背景：1 世纪前后日本出现小国，3 世纪中叶大和兴起，5 世纪大和政权基本统一日本；大王与贵族私有土地和部民。","改革动因：6—7 世纪，日本社会矛盾尖锐，贵族争权、部民反抗；遣隋使、遣唐使带回的制度与文物，让日本看到隋唐的强盛。","大化改新：646 年孝德天皇颁诏，仿效隋唐建立天皇为中心的中央集权，地方设国、郡、里；废除私地私民，国家授田，统一赋税。","结果：大化改新使日本发展成为一个中央集权制的封建国家，经济得到发展，但改革并不彻底，旧贵族势力仍有残留。","庄园与武士：8 世纪起土地兼并盛行，班田收授法难以为继，庄园兴起；11 世纪，庄园主把家臣武装起来，形成武士集团。","幕府统治：12 世纪末源赖朝获“征夷大将军”，设幕府于镰仓；将军掌实权，天皇成为礼仪性摆设，武士效忠的是主公而非国家。"],"terms":[["部民","大和政权中王室和贵族的私有民，从事农业和手工业生产，地位近似奴隶，大化改新时被收归国有成为公民。"],["大化改新","646 年日本仿效中国隋唐制度进行的改革，废私地私民、建中央集权、行班田收授，使日本成为封建国家。"],["班田收授法","大化改新后国家把公地按人口分给公民，每六年授田一次，不得终身使用或买卖，受田者须负担租庸调。"],["幕府","将军掌握实权的军事政权。12 世纪末源赖朝设镰仓幕府，此后室町、德川幕府相继，天皇保留却无实权。"]],"figures":[["孝德天皇","646 年颁布改新诏书，推行大化改新，仿效隋唐制度"],["中大兄皇子","645 年发动政变诛杀苏我入鹿，为改新扫清障碍，后即位为天智天皇"],["源赖朝","12 世纪晚期获“征夷大将军”称号，设幕府于镰仓，开创幕府政治"]],"events":[["5 世纪","大和政权基本统一日本"],["646 年","大化改新开始"],["8 世纪","土地兼并加剧，庄园兴起"],["11 世纪","武士集团逐渐形成"],["12 世纪末","源赖朝建立镰仓幕府"]],"treaty":null,"significance":"大化改新是日本历史上第一次大规模学习中国、主动变革的运动，使日本由部民制走向封建制，也为此后吸收唐文化打开大门；幕府政治则塑造了近 700 年的武士治国传统。","source":{"quote":"乐浪海中有倭人，分为百余国，以岁时来献见云。","from":"《汉书·地理志》（东汉·班固）"},"pitfall":"大化改新学习的是中国隋唐制度；天皇始终存在，只是幕府时期大权旁落；武士效忠的是主公个人，不是国家。","memory":"六四六，学隋唐；公地公民收权忙；庄园起，武士强；镰仓幕府将军掌。","link":"与上一单元的中古欧洲对照：西欧庄园孕育城市与王权，日本庄园孕育武士与幕府；同属亚洲的阿拉伯帝国则另辟一条路。","exam":["大化改新的内容与影响","武士集团和幕府统治的特点","中日封建化道路的比较"]},{"id":"w4l2","num":11,"unit":"w4","title":"阿拉伯帝国","years":"7—13 世纪","icon":"🕌","tag":"阿拉伯","hook":"622 年秋，麦加城外的沙丘上，穆罕默德和同伴压低身子疾行。身后是追杀者，前方是三百多千米外的麦地那——一座即将奉他为领袖的城市。","core":"7 世纪初，穆罕默德在麦加创立伊斯兰教。622 年他迁居麦地那，建立政教合一的穆斯林公社，逐步统一阿拉伯半岛。此后哈里发对外扩张，8 世纪中期形成地跨欧亚非三洲的大帝国；阿拉伯人翻译古典、沟通东西，成为文化交流的桥梁。","points":["背景：6—7 世纪，阿拉伯半岛部落林立、多神崇拜，相互仇杀，商路受阻，社会动荡，人们渴望统一与安宁。","创教：7 世纪初，穆罕默德在麦加创立伊斯兰教，宣称安拉是唯一真神，自己是安拉的使者；早期信徒遭麦加贵族迫害。","建国：622 年迁居麦地那，建立穆斯林公社，政教合一，阿拉伯国家的雏形由此诞生；630 年占领麦加，632 年半岛基本统一。","扩张：穆罕默德去世后，哈里发以“圣战”名义扩张，8 世纪中期建成地跨欧亚非三洲的帝国；1258 年蒙古攻陷巴格达，帝国灭亡。","文化：哈里发重视知识，设“智慧宫”翻译古希腊、波斯、印度典籍；改造印度数字为阿拉伯数字；《医典》《天方夜谭》传世。","交流：中国的造纸术、指南针、火药经阿拉伯人传入欧洲，印度的数字、食糖、棉花也经他们西传，阿拉伯人被称为东西方交流的桥梁。"],"terms":[["伊斯兰教","7 世纪初穆罕默德在阿拉伯半岛创立的一神教，信奉安拉，经典为《古兰经》，随帝国扩张广泛传播。"],["哈里发","阿拉伯帝国最高统治者，集政教大权于一身。穆罕默德去世后由哈里发继位，领导对外扩张。"],["智慧宫","阿拔斯王朝在巴格达设立的翻译和研究机构，汇集学者翻译古希腊、波斯、印度著作，保存古典文明。"],["阿拉伯数字","由古代印度人发明，经阿拉伯人改造并传到欧洲，成为世界通用的数字写法。"]],"figures":[["穆罕默德","伊斯兰教创始人，622 年迁居麦地那建国，632 年前基本统一阿拉伯半岛"],["马蒙","阿拔斯王朝哈里发，扩建智慧宫，组织大规模翻译，推动阿拉伯文化繁荣"],["伊本·西那","阿拉伯医学家、哲学家，著《医典》，长期被欧洲医学院用作教材"]],"events":[["7 世纪初","穆罕默德在麦加创立伊斯兰教"],["622 年","迁居麦地那，建立穆斯林公社"],["630 年","占领麦加，阿拉伯半岛趋于统一"],["8 世纪中期","阿拉伯帝国地跨欧亚非三洲"],["1258 年","蒙古攻陷巴格达，帝国灭亡"]],"treaty":null,"significance":"阿拉伯帝国把西亚、北非和伊比利亚半岛连成一片，伊斯兰教随之广泛传播；阿拉伯人保存并传播古典文明，沟通东西方，为欧洲走出中世纪提供了知识养料。","source":{"quote":"大食国，本在波斯之西……永徽二年，始遣使朝贡。","from":"《旧唐书·西戎传》（后晋·刘昫等）"},"pitfall":"伊斯兰教创立于 7 世纪初，622 年是迁居麦地那而非创教；阿拉伯数字由印度人发明，阿拉伯人只是改造和传播。","memory":"六一〇创伊斯兰，六二二麦地那；八世纪跨三洲，智慧宫里译东西。","link":"与古代日本并读：日本靠学习隋唐走上封建化，阿拉伯靠信仰凝聚成帝国；其保存的古典文化，后来催生了西欧的新变化。","exam":["伊斯兰教创立与阿拉伯半岛统一","阿拉伯帝国的扩张与文化成就","阿拉伯人在东西方文化交流中的作用"]}],"questions":[{"id":"w4q1","lesson":"w4l1","unit":"w4","type":"choice","level":1,"stem":"646 年，日本孝德天皇颁布改新诏书，仿效中国隋唐制度进行改革，这场改革史称","options":["大化改新","明治维新","班田收授","幕府改革"],"answer":0,"explain":"646 年日本仿效隋唐制度进行改革，因年号“大化”而称大化改新。明治维新发生在 1868 年；班田收授法是改新中的一项经济措施，不是改革名称。","point":"大化改新"},{"id":"w4q2","lesson":"w4l1","unit":"w4","type":"choice","level":1,"stem":"大化改新中，日本仿效隋唐建立的政治制度是","options":["以天皇为中心的中央集权制度","以将军为首的幕府制度","以庄园主为核心的领主制度","以部民为基础的部落联盟"],"answer":0,"explain":"大化改新在政治上建立以天皇为中心的中央集权制度，地方设国、郡、里三级，由中央派官治理。幕府制度要到 12 世纪末才出现，庄园和武士是改新之后逐渐形成的。","point":"大化改新的内容"},{"id":"w4q3","lesson":"w4l1","unit":"w4","type":"order","level":2,"stem":"按时间先后排列古代日本历史发展中的事件","items":["大和政权基本统一日本","大化改新开始","庄园在各地兴起","武士集团逐渐形成","源赖朝建立镰仓幕府"],"explain":"5 世纪大和政权基本统一日本；646 年开始大化改新；8 世纪土地兼并加剧、庄园兴起；11 世纪武士集团逐渐形成；12 世纪末源赖朝设镰仓幕府。","point":"古代日本的历程"},{"id":"w4q4","lesson":"w4l1","unit":"w4","type":"fill","level":2,"stem":"12 世纪晚期，源氏首领______获得“征夷大将军”称号，在镰仓设立幕府，日本由此进入幕府统治时期。","answer":["源赖朝"],"explain":"12 世纪晚期，源赖朝获得“征夷大将军”称号，设幕府于镰仓。此后将军实际把持国家大权，天皇成为礼仪性的摆设。","point":"幕府统治的建立"},{"id":"w4q5","lesson":"w4l2","unit":"w4","type":"choice","level":1,"stem":"622 年，穆罕默德离开麦加迁居麦地那，这一事件最重要的历史意义是","options":["创立了伊斯兰教","建立政教合一的穆斯林公社，阿拉伯国家雏形诞生","统一了整个阿拉伯半岛","建立起地跨三洲的阿拉伯帝国"],"answer":1,"explain":"622 年迁居麦地那后，穆罕默德建立穆斯林公社，以信仰为纽带打破部落界限，阿拉伯国家的雏形由此诞生。伊斯兰教创立于 7 世纪初的麦加；半岛基本统一在 632 年前后；帝国形成于 8 世纪中期。","point":"阿拉伯国家的建立"},{"id":"w4q6","lesson":"w4l2","unit":"w4","type":"choice","level":2,"stem":"8 世纪中期，阿拉伯帝国成为地跨欧亚非三洲的大帝国；1258 年攻陷巴格达、使帝国灭亡的是","options":["十字军","蒙古军队","奥斯曼土耳其人","波斯人"],"answer":1,"explain":"1258 年蒙古军队攻陷巴格达，阿拉伯帝国灭亡。十字军东征发生在 11—13 世纪，没有攻陷巴格达；奥斯曼土耳其人灭的是拜占庭帝国。","point":"阿拉伯帝国的兴亡"},{"id":"w4q7","lesson":"w4l2","unit":"w4","type":"match","level":2,"stem":"把阿拉伯帝国的文化成就与其内容配对","pairs":[["《医典》","伊本·西那所著医学著作，长期为欧洲医学院教材"],["《天方夜谭》","又名《一千零一夜》的阿拉伯民间故事集"],["智慧宫","哈里发设立的翻译与研究机构"],["阿拉伯数字","印度人发明、经阿拉伯人改造传播的数字"]],"explain":"阿拉伯人翻译保存古希腊、波斯、印度典籍，在数学、医学、文学上都有成就；这些成果经西班牙等地传入欧洲，推动了欧洲文化的发展。","point":"阿拉伯文化成就"},{"id":"w4q8","lesson":"w4l2","unit":"w4","type":"fill","level":3,"stem":"751 年，唐朝军队与阿拉伯军队在______交战，被俘的中国工匠把造纸术传到阿拉伯地区，后经阿拉伯人传入欧洲。","answer":["怛罗斯","怛逻斯","怛罗斯城"],"explain":"751 年怛罗斯之战，唐军战败，被俘人员中有造纸工匠，造纸术由此西传，再由阿拉伯人传入欧洲。","point":"阿拉伯人与东西方交流"}],"timeline":[{"t":"5 世纪","y":450,"text":"大和政权基本统一日本，王室和贵族私有土地与部民","unit":"w4","tag":"日本","volume":"v5"},{"t":"7 世纪初","y":610,"text":"穆罕默德在麦加创立伊斯兰教","unit":"w4","tag":"阿拉伯","volume":"v5"},{"t":"622 年","y":622,"text":"穆罕默德迁居麦地那，建立穆斯林公社","unit":"w4","tag":"阿拉伯","volume":"v5"},{"t":"630 年","y":630,"text":"穆罕默德占领麦加，阿拉伯半岛趋于统一","unit":"w4","tag":"阿拉伯","volume":"v5"},{"t":"646 年","y":646,"text":"日本开始大化改新，仿效隋唐建立中央集权","unit":"w4","tag":"日本","volume":"v5"},{"t":"8 世纪中期","y":751,"text":"阿拉伯帝国地跨欧亚非三洲；怛罗斯之战后造纸术西传","unit":"w4","tag":"阿拉伯","volume":"v5"},{"t":"11 世纪","y":1050,"text":"日本武士集团逐渐形成","unit":"w4","tag":"日本","volume":"v5"},{"t":"12 世纪末","y":1192,"text":"源赖朝建立镰仓幕府，日本进入幕府时代","unit":"w4","tag":"日本","volume":"v5"},{"t":"1258 年","y":1258,"text":"蒙古军队攻陷巴格达，阿拉伯帝国灭亡","unit":"w4","tag":"阿拉伯","volume":"v5"}]},{"volume":"v5","unit":{"id":"w5","volume":"v5","num":5,"title":"步入近代","short":"走向近代","years":"14—16 世纪","accent":"#35577A","soft":"#E6EDF6","tint":"#C2D1E3","icon":"⛵","tagline":"当庄园的围墙被推开，人、商品和目光一起驶向海洋。","intro":"14 世纪的欧洲还裹在庄园和教堂的阴影里：土地是领主的，学问是教士的。可就在一百多年间，租地农场和手工工场雇起了拿工资的工人，佛罗伦萨的画家开始画普通人的脸，里斯本的帆船一路向西。本单元要追问的是：一个以农业和神权为骨架的社会，怎样一点点长出了资本、市场和世界眼光。","bigQuestion":"为什么说 14—16 世纪的欧洲站在“近代”的门口，而不是又一个中世纪的循环？","goals":["说出垦殖运动、租地农场和手工工场带来的变化。","理解人文主义，认识文艺复兴的实质与影响。","复述四位航海家的航线，评价新航路开辟的影响。","了解三角贸易，辩证看待早期殖民掠夺的后果。"],"keyLine":"租地农场改变生产，文艺复兴改变人心，新航路改变地图，三角贸易把三者连成一条血与金的链条。"},"lessons":[{"id":"w5l1","num":12,"unit":"w5","title":"西欧经济和社会的发展","years":"14—16 世纪","icon":"🏭","tag":"经济","hook":"15 世纪的一个清晨，领主不再巡视自己的田地，而是把整片地租了出去。租地的农民雇来短工，把羊毛卖到远处的市集。庄园的老账本，正被一本新账本取代。","core":"11 世纪以后，西欧开展垦殖运动，人口增长。14 世纪起，领主出租自营地，富裕农民集中土地建立租地农场，雇工生产、产品面向市场；手工业也从分散走向集中，形成雇佣关系。这些变化使西欧生产组织逐渐资本主义化，农村出现富裕农民，城市出现市民阶层。","points":["背景：11 世纪以后，西欧农村开展垦殖运动，林地、荒地得到开垦，耕地面积扩大，人口增长，为经济变化准备了条件。","租地农场：14 世纪中叶以后，领主出租自营地；富裕农民承租、购买土地，集中经营，雇用少地或无地的农民，产品面向市场。","雇佣关系：租地农场主与雇佣工人之间是雇佣与被雇佣的关系，工人靠工资生活，这种新的生产方式带有资本主义性质。","手工工场：手工业者逐渐脱离农业，分散的手工工场走向集中，商人提供原料、统一安排生产，工人与雇主形成彻底的雇佣关系。","社会结构：13、14 世纪，富裕农民、骑士集中土地，控制乡村行政事务；城市手工业者、商人成为市民阶层，政治权利不断扩大。","影响：土地关系的变化和手工业的发展，推动西欧生产组织逐渐资本主义化，开始改变中世纪欧洲社会的整体面貌。"],"terms":[["垦殖运动","11 世纪以后，西欧农民开垦林地、荒地，扩大耕地面积的运动。它带来人口增长和农业发展，也推动土地集中与租佃。"],["租地农场","14 世纪中叶以后，富裕农民承租或购买领主土地建立的农场。它雇用工人经营，产品面向市场，具有资本主义性质。"],["手工工场","手工业生产组织。集中手工工场里，商人提供原料、统一安排生产，工人按件或按时取酬，与雇主形成雇佣关系。"],["市民阶层","城市中的手工业者和商人。他们享有契约赋予的权利，力量壮大后政治地位提高，成为王权所倚重的政治力量。"]],"figures":[["富裕农民","承租、购买土地，建立租地农场，成为农村中的新兴力量"],["雇佣工人","少地或无地的农民，靠出卖劳动力领取工资"],["城市商人","采购原料、销售产品，控制手工业生产，壮大了市民阶层"]],"events":[["11 世纪以后","西欧开展垦殖运动，耕地扩大、人口增长"],["13—14 世纪","富裕农民、骑士集中土地，农村社会结构发生变化"],["14 世纪中叶以后","领主出租自营地，租地农场出现"],["15—16 世纪","集中的手工工场发展，市民阶层力量壮大"]],"treaty":null,"significance":"租地农场和手工工场以雇佣劳动和市场交换为基础，是西欧资本主义萌芽的重要表现。富裕农民和市民阶层的成长，为后来的文艺复兴、新航路开辟和资产阶级革命准备了经济基础与社会力量。","source":{"quote":"土地关系的变化和手工业的发展，推动农业和手工业生产组织逐渐资本主义化，开始改变中世纪欧洲社会的整体面貌。","from":"据教材相关表述整理"},"pitfall":"租地农场靠雇佣劳动、面向市场，已是资本主义性质的生产；但西欧仍是封建社会，资本主义只是“萌芽”，不能说制度已经确立。","memory":"垦殖扩地人口增，领主出租富农耕；集中工场雇工做，农村市民两新生。","link":"本课是“步入近代”的经济起点：生产组织的变化孕育出资本主义萌芽，随之而来的是思想解放与海外扩张。","exam":["租地农场与手工工场中的雇佣关系","西欧经济变化带来的社会结构变动","“资本主义萌芽”与“资本主义制度确立”的区分"]},{"id":"w5l2","num":13,"unit":"w5","title":"文艺复兴运动","years":"14—17 世纪","icon":"🎨","tag":"思想","hook":"1436 年的佛罗伦萨，圣母百花大教堂的穹顶刚刚合拢，市民仰头看着那个没有支柱的巨大圆顶。画家、诗人、银行家在同一座城里谈论人，而不是只谈论神。","core":"14 世纪中叶，文艺复兴在意大利兴起，15、16 世纪扩展到欧洲其他国家。它借复兴古希腊罗马文化之名，宣传资产阶级思想：以人文主义为核心，肯定人的价值和尊严，反对神权束缚，提倡追求现世幸福，为欧洲资本主义的产生奠定了思想文化基础。","points":["背景：14 世纪意大利出现佛罗伦萨、威尼斯等工商业城市，资产阶级逐渐成长，不满教会的精神束缚，需要新的思想文化。","核心：人文主义。主张以人为中心而不是以神为中心，肯定人的价值和尊严，反对禁欲主义，提倡追求现世幸福和个性解放。","实质：借“复兴”古代希腊罗马文化之名，宣传资产阶级的思想观念，是一场资产阶级思想文化运动，不是古典文化的简单复原。","文学：但丁《神曲》率先抨击教会的贪婪腐败，被誉为文艺复兴的先驱；彼特拉克、薄伽丘继起；英国莎士比亚的戏剧写尽人的情感。","艺术：达·芬奇《蒙娜丽莎》《最后的晚餐》，拉斐尔、米开朗琪罗的绘画与雕塑，用写实手法表现人体与人性之美。","影响：促进人们思想的大解放，推动欧洲文化思想领域的繁荣，为欧洲资本主义的产生和发展奠定思想文化基础。"],"terms":[["人文主义","文艺复兴的核心思想。以人为中心而不是以神为中心，肯定人的价值和尊严，反对禁欲主义，提倡追求现世幸福。"],["《神曲》","但丁的长诗，分《地狱》《炼狱》《天堂》三部分。它抨击教会的贪婪腐败，率先透出人文主义的光芒。"],["文艺复兴","14—17 世纪欧洲思想文化运动。它借助复兴古典文化的形式宣传资产阶级思想，是欧洲第一次思想解放运动。"],["美术三杰","文艺复兴时期意大利的达·芬奇、拉斐尔、米开朗琪罗，他们的绘画和雕塑以写实手法展现人体与人性之美。"]],"figures":[["但丁","意大利诗人，文艺复兴先驱，代表作《神曲》"],["达·芬奇","意大利画家，代表作《蒙娜丽莎》《最后的晚餐》"],["莎士比亚","英国戏剧家，代表作《罗密欧与朱丽叶》《哈姆雷特》"],["彼特拉克","意大利诗人，与但丁、薄伽丘并称文学三杰"]],"events":[["14 世纪","但丁完成《神曲》，抨击教会"],["14 世纪中叶","文艺复兴在意大利兴起"],["15 世纪","文艺复兴扩展到欧洲其他国家"],["16 世纪","莎士比亚创作戏剧，文艺复兴在英国达到高峰"]],"treaty":null,"significance":"文艺复兴冲破了教会的精神枷锁，解放了人的思想，为近代自然科学和文学艺术的发展开辟道路，也为欧洲资本主义的兴起提供了思想文化条件，被称为欧洲第一次思想解放运动。","source":{"quote":"人类是一件多么了不起的杰作！……宇宙的精华！万物的灵长！","from":"莎士比亚《哈姆雷特》（约 1601 年）"},"pitfall":"文艺复兴不是古典文化的简单复兴，而是新思想的创造；它的核心是人文主义，不能说它摧毁了教会势力，也不能把它当成政治革命。","memory":"意大利起文艺复兴，人文主义换脑筋；但丁神曲开先路，达翁莎翁写人心。","link":"经济先变，思想随后：文艺复兴把人从神的世界里唤回，下一课的新航路则把人的目光引向海外。","exam":["人文主义的内涵与文艺复兴的实质","但丁、达·芬奇、莎士比亚的代表作","文艺复兴的历史影响"]},{"id":"w5l3","num":14,"unit":"w5","title":"探寻新航路","years":"15—16 世纪","icon":"🧭","tag":"航海","hook":"1492 年 10 月 12 日凌晨两点，船队的水手突然高喊“陆地”。他们已在海上漂了三十多天。哥伦布以为那是印度，实际是巴哈马群岛中的一座小岛。","core":"15 世纪，欧洲商品经济发展、对东方财富的渴望和传播基督教的热望，促使葡萄牙、西班牙支持航海家向海洋探索。迪亚士到达好望角，达·伽马绕非洲到印度，哥伦布到达美洲，麦哲伦船队完成环球航行。新航路开辟使世界开始连为一个整体。","points":["原因：欧洲商品经济发达，资产阶级渴求开拓市场；《马可·波罗行纪》激起东方想象；奥斯曼帝国控制传统商路；传播基督教是动力。","条件：地圆学说流行，罗盘针用于航海，造船技术进步，葡萄牙、西班牙王室给予人力物力支持。","向东：1487 年迪亚士到达非洲好望角；1497—1498 年达·伽马绕过好望角，到达印度西海岸。","向西：1492 年哥伦布在西班牙支持下横渡大西洋，到达美洲；1519—1522 年麦哲伦船队完成环球航行，证明地圆学说。","影响：欧洲大西洋沿岸工商业繁荣，促进资本主义发展；世界开始连为一个整体，世界观念逐步确立；也开启了殖民掠夺。","评价：新航路开辟具有世界意义，但伴随血腥征服与掠夺，给亚非拉人民带来灾难。"],"terms":[["新航路","15、16 世纪欧洲航海家开辟的、不经过地中海而直通东方的新航线，主要有向东绕非洲和向西渡大西洋两条。"],["好望角","非洲大陆西南端的海角。1487 年迪亚士到达这里，为绕过非洲通往印度开辟了道路。"],["地圆学说","认为地球是球形的学说。麦哲伦船队环球航行成功，用事实证明了这一学说。"],["印第安人","哥伦布误以为自己到达印度，把当地居民称为“印第安人”，这一称呼沿用至今。"]],"figures":[["迪亚士","葡萄牙航海家，1487 年到达好望角"],["达·伽马","葡萄牙航海家，1498 年到达印度"],["哥伦布","意大利航海家，1492 年在西班牙支持下到达美洲"],["麦哲伦","葡萄牙航海家，1519—1522 年率船队环球航行"]],"events":[["1487 年","迪亚士到达非洲好望角"],["1492 年","哥伦布到达美洲"],["1497—1498 年","达·伽马绕过好望角到达印度"],["1519—1522 年","麦哲伦船队完成环球航行"]],"treaty":null,"significance":"新航路开辟使世界开始连为一个整体，欧洲与亚非美洲的联系日益紧密；欧洲大西洋沿岸工商业繁荣起来，促进资本主义的发展；同时开启了殖民扩张，改变了世界格局。","source":{"quote":"十月十二日凌晨两点，我们看见了陆地。","from":"哥伦布《航海日记》（1492 年 10 月 12 日）"},"pitfall":"哥伦布到的是美洲，却至死以为到了印度；迪亚士只到好望角，达·伽马才到印度；麦哲伦死于菲律宾，环球航行由其船队完成。","memory":"好望角前迪亚士，印度洋上达伽马；哥伦布西到美洲，麦哲伦船绕地球。","link":"文艺复兴让人重新看自己，新航路让人重新看世界；两条线索汇合，才有下一课跨海而来的殖民掠夺。","exam":["新航路开辟的原因与条件","四位航海家的航线与时间","新航路开辟的世界影响"]},{"id":"w5l4","num":15,"unit":"w5","title":"早期殖民掠夺","years":"16—18 世纪","icon":"⚓","tag":"殖民","hook":"1565 年，一艘西班牙大帆船驶进马尼拉港，船舱里装着从美洲运来的白银。几千公里外的非洲海岸，又一批人被推上贩奴船。世界市场就这样在血与银之间被缝合起来。","core":"新航路开辟后，葡萄牙、西班牙最先殖民扩张，随后荷兰、英国、法国加入。欧洲殖民者在美洲掠夺金银、屠杀印第安人，在非洲掳掠黑奴，形成“三角贸易”，把亚非拉卷入世界市场。殖民掠夺是欧洲资本原始积累的主要途径，也给殖民地人民带来深重灾难。","points":["葡萄牙与西班牙：葡萄牙在亚洲、非洲沿海和巴西建立商站；西班牙在美洲掠夺金银，屠杀印第安人，摧毁阿兹特克、印加帝国。","荷兰：17 世纪垄断世界航运，被称为“海上马车夫”，在东南亚、非洲、美洲建立殖民地。","英国：1588 年击败西班牙“无敌舰队”；17 世纪胜荷兰，18 世纪下半叶胜法国，成为最大殖民国家，号称日不落帝国。","三角贸易：从欧洲运枪支、纺织品到非洲换取黑奴，把黑奴运到美洲出售，再满载金银和原料返回欧洲，全程获利巨大。","对欧洲：殖民掠夺获取巨额财富，为资本主义发展提供资本原始积累，促进世界市场逐渐形成。","对殖民地：屠杀印第安人、贩卖黑奴使非洲损失大量人口，印第安文明遭到毁灭；殖民者也把欧洲文化带到殖民地，影响深远。"],"terms":[["三角贸易","欧洲殖民者从欧洲运工业品到非洲换取黑奴，把黑奴运到美洲出售，再运回金银和原料的循环贸易，因航线呈三角形而得名。"],["资本原始积累","资本主义生产方式确立前，通过殖民掠夺、贩卖奴隶等暴力手段积累财富的过程，充满血腥。"],["日不落帝国","18 世纪下半叶英国打败法国后，殖民地遍布全球，太阳在其领土上永不落下，故称。"],["无敌舰队","西班牙的海上舰队。1588 年远征英国失败，西班牙海上霸权从此衰落。"]],"figures":[["哥伦布","1492 年到达美洲，揭开欧洲殖民美洲的序幕"],["麦哲伦","1519—1522 年船队环球航行，西班牙势力扩及亚洲"],["德雷克","英国航海家，16 世纪劫掠西班牙运银船，受女王授勋"]],"events":[["16 世纪","西班牙殖民者摧毁阿兹特克、印加帝国，掠夺美洲金银"],["16—19 世纪","三角贸易持续数百年，非洲损失大量人口"],["1588 年","英国打败西班牙“无敌舰队”"],["17 世纪","荷兰成为“海上马车夫”，垄断世界航运"],["18 世纪下半叶","英国打败法国，成为最大的殖民国家"]],"treaty":null,"significance":"早期殖民掠夺是欧洲资本原始积累的主要途径，促进了欧洲资本主义的发展和世界市场的形成；但它以屠杀、奴役和贩卖人口为代价，给亚非拉人民带来深重灾难，造成这些地区长期的贫困与落后。","source":{"quote":"资本来到世间，从头到脚，每个毛孔都滴着血和肮脏的东西。","from":"马克思《资本论》第一卷（1867 年）"},"pitfall":"三角贸易指欧洲—非洲—美洲的循环航程，不是三个国家；殖民掠夺对欧洲是资本积累，对殖民地是灾难，评价要看两面。","memory":"西葡先下手，荷兰称马车；英国日不落，三角贩黑奴。","link":"新航路把世界连成一张网，殖民掠夺则在这张网上抽取财富；这些财富流入欧洲，成为下一单元资产阶级革命的资本。","exam":["三角贸易的路线与影响","英国成为最大殖民国家的过程","早期殖民掠夺的评价"]}],"questions":[{"id":"w5q1","lesson":"w5l1","unit":"w5","type":"choice","level":1,"stem":"14 世纪中叶以后，西欧农村出现的租地农场，其生产经营的特点是","options":["领主直接经营，产品自给自足","富裕农民集中土地，雇用工人，产品面向市场","教会统一管理，按什一税分配产品","村社平均分配土地，各家自耕自食"],"answer":1,"explain":"租地农场由富裕农民承租或购买土地集中经营，雇用少地或无地的农民，产品面向市场，雇主与工人之间是雇佣关系。领主自营、教会管理和村社平均分配都是旧式经营方式。","point":"租地农场的经营方式"},{"id":"w5q2","lesson":"w5l1","unit":"w5","type":"choice","level":2,"stem":"在集中的手工工场里，商人提供原料、统一安排生产，工人按件或按时领取报酬。工人与雇主之间形成的是","options":["人身依附关系","雇佣关系","封建宗法关系","奴隶主与奴隶的关系"],"answer":1,"explain":"集中手工工场中的工人靠出卖劳动力领取工资，与雇主之间是雇佣与被雇佣的关系，这正是资本主义生产方式的特征。人身依附是庄园农奴的处境，宗法关系属于封建家族，奴隶制则完全不同。","point":"手工工场中的雇佣关系"},{"id":"w5q3","lesson":"w5l1","unit":"w5","type":"order","level":2,"stem":"按时间先后排列西欧经济和社会变化的主要表现","items":["西欧农村开展垦殖运动","富裕农民、骑士集中土地","领主出租自营地，租地农场建立","集中的手工工场发展，市民阶层壮大"],"explain":"11 世纪以后开展垦殖运动 → 13、14 世纪富裕农民和骑士集中土地 → 14 世纪中叶以后领主出租自营地、租地农场建立 → 15、16 世纪集中的手工工场发展、市民阶层壮大。","point":"西欧经济和社会的变化"},{"id":"w5q4","lesson":"w5l1","unit":"w5","type":"fill","level":2,"stem":"14 世纪中叶以后，西欧富裕农民集中土地，建立______，雇用工人经营，产品面向市场，具有资本主义性质。","answer":["租地农场","租地农场。"],"explain":"租地农场是西欧农村资本主义萌芽的重要表现，它与集中手工工场一起，推动西欧生产组织逐渐资本主义化。","point":"租地农场"},{"id":"w5q5","lesson":"w5l2","unit":"w5","type":"choice","level":1,"stem":"文艺复兴时期，艺术家和作家们肯定人的价值、反对神权束缚，这一思潮的核心是","options":["人文主义","禁欲主义","重商主义","专制主义"],"answer":0,"explain":"人文主义是文艺复兴的核心思想，它主张以人为中心而不是以神为中心，肯定人的价值和尊严，提倡追求现世幸福。禁欲主义正是它反对的对象，重商主义和专制主义与文艺复兴的核心无关。","point":"人文主义"},{"id":"w5q6","lesson":"w5l2","unit":"w5","type":"choice","level":2,"stem":"文艺复兴最早兴起于意大利，最重要的原因是","options":["意大利保留了较多的古代希腊罗马文化遗产，工商业城市繁荣，资产阶级成长","意大利完成了工业革命，急需海外市场","意大利建立了统一的中央集权国家","意大利的教会主动提倡人文主义"],"answer":0,"explain":"意大利地处地中海商路要冲，佛罗伦萨、威尼斯等城市工商业繁荣，资产阶级较早成长；这里又保存了丰富的古典文化遗产，为人文主义提供了思想材料。工业革命发生在 18 世纪的英国，意大利当时并未统一，教会恰恰是文艺复兴批判的对象。","point":"文艺复兴兴起的原因"},{"id":"w5q7","lesson":"w5l2","unit":"w5","type":"match","level":2,"stem":"把下列文艺复兴时期的人物与其代表作配对","pairs":[["但丁","《神曲》"],["达·芬奇","《蒙娜丽莎》"],["莎士比亚","《哈姆雷特》"],["薄伽丘","《十日谈》"]],"explain":"但丁的《神曲》抨击教会，被视为文艺复兴的先声；达·芬奇的《蒙娜丽莎》以写实手法表现人性之美；莎士比亚的《哈姆雷特》是英国文艺复兴戏剧的高峰；薄伽丘的《十日谈》讽刺教会的虚伪。","point":"文艺复兴的代表人物与作品"},{"id":"w5q8","lesson":"w5l2","unit":"w5","type":"fill","level":3,"stem":"14 世纪，意大利诗人______创作长诗《神曲》，抨击教会的贪婪腐败，率先透出人文主义的光芒，被视为文艺复兴的先驱。","answer":["但丁"],"explain":"但丁是意大利诗人，《神曲》分《地狱》《炼狱》《天堂》三部分，借幻游三界的故事抨击教会和封建贵族的腐败，因此被称为文艺复兴的先驱。","point":"但丁与《神曲》"},{"id":"w5q9","lesson":"w5l3","unit":"w5","type":"choice","level":1,"stem":"1492 年，在西班牙王室支持下横渡大西洋、到达美洲的航海家是","options":["迪亚士","达·伽马","哥伦布","麦哲伦"],"answer":2,"explain":"1492 年哥伦布在西班牙支持下横渡大西洋，到达巴哈马群岛，他误以为是印度。迪亚士 1487 年到达好望角，达·伽马 1498 年到达印度，麦哲伦船队 1519—1522 年环球航行。","point":"哥伦布到达美洲"},{"id":"w5q10","lesson":"w5l3","unit":"w5","type":"choice","level":2,"stem":"15 世纪欧洲人急于开辟通往东方的新航路，其根本原因是","options":["欧洲商品经济日趋发达，新生资产阶级渴求开拓市场和获取财富","欧洲人普遍相信地球是方的，想验证一下","奥斯曼帝国鼓励欧洲商人到东方贸易","葡萄牙和西班牙人口过多，需要向外移民"],"answer":0,"explain":"新航路开辟的根本原因是欧洲商品经济发展、资本主义萌芽产生，新生资产阶级渴求开拓市场、获取东方财富。地圆学说流行是条件而非原因；奥斯曼帝国控制传统商路，反而使东西方贸易受阻。","point":"新航路开辟的原因"},{"id":"w5q11","lesson":"w5l3","unit":"w5","type":"order","level":2,"stem":"按时间先后排列下列航海活动","items":["迪亚士到达非洲好望角","哥伦布到达美洲","达·伽马到达印度","麦哲伦船队完成环球航行"],"explain":"1487 年迪亚士到达好望角 → 1492 年哥伦布到达美洲 → 1497—1498 年达·伽马到达印度 → 1519—1522 年麦哲伦船队环球航行。","point":"新航路开辟的过程"},{"id":"w5q12","lesson":"w5l3","unit":"w5","type":"choice","level":3,"stem":"1519—1522 年，麦哲伦船队完成人类首次环球航行。这一壮举最重要的历史意义是","options":["用事实证明了地圆学说，世界开始连为一个整体","第一次发现了美洲大陆","开辟了绕过好望角到达印度的航路","使西班牙立即成为最大的殖民国家"],"answer":0,"explain":"麦哲伦船队从西班牙出发向西航行，最终回到出发地，用事实证明了地圆学说，也使世界开始连为一个整体。发现美洲的是哥伦布，绕过好望角到印度的是达·伽马，西班牙成为最大殖民国家是后来英国崛起之前的事。","point":"麦哲伦环球航行的意义"},{"id":"w5q13","lesson":"w5l4","unit":"w5","type":"choice","level":1,"stem":"“三角贸易”的航程依次是","options":["欧洲→非洲→美洲→欧洲","欧洲→美洲→非洲→欧洲","非洲→欧洲→美洲→非洲","美洲→欧洲→非洲→美洲"],"answer":0,"explain":"殖民者先从欧洲运枪支、纺织品等到非洲换取黑奴，再把黑奴运到美洲出售，最后满载金银和原料返回欧洲。三段航程连成三角形，故称“三角贸易”。","point":"三角贸易的路线"},{"id":"w5q14","lesson":"w5l4","unit":"w5","type":"choice","level":2,"stem":"18 世纪下半叶，打败法国、成为最大殖民国家，号称“日不落帝国”的是","options":["葡萄牙","西班牙","荷兰","英国"],"answer":3,"explain":"英国 1588 年击败西班牙“无敌舰队”，17 世纪下半叶打败荷兰，18 世纪下半叶打败法国，殖民地遍布全球，成为最大的殖民国家。葡萄牙、西班牙是最早的殖民国家，荷兰在 17 世纪称“海上马车夫”。","point":"英国成为最大殖民国家"},{"id":"w5q15","lesson":"w5l4","unit":"w5","type":"match","level":2,"stem":"把下列殖民国家与其主要殖民活动配对","pairs":[["葡萄牙","在非洲、亚洲沿海建立商站和据点"],["西班牙","在美洲掠夺金银，屠杀印第安人"],["荷兰","17 世纪垄断世界航运，号称“海上马车夫”"],["英国","18 世纪下半叶打败法国，号称“日不落帝国”"]],"explain":"葡萄牙沿非洲、亚洲海岸建立商站；西班牙以美洲为重点，掠夺金银、屠杀印第安人；荷兰靠航运称霸 17 世纪；英国后来居上，18 世纪下半叶成为最大殖民国家。","point":"早期殖民国家"},{"id":"w5q16","lesson":"w5l4","unit":"w5","type":"choice","level":3,"stem":"对早期殖民掠夺，下列评价最全面的是","options":["它促进了欧洲资本原始积累和世界市场形成，也给殖民地人民带来深重灾难","它只有破坏性，对世界历史没有产生任何客观作用","它是欧洲资本主义发展的唯一原因","它使亚非拉殖民地迅速走上了工业化道路"],"answer":0,"explain":"早期殖民掠夺为欧洲提供了资本原始积累，推动世界市场逐渐形成，这是客观作用；但它以屠杀、奴役和贩卖人口为手段，给亚非拉带来深重灾难。因此评价要兼顾两面，既不能只讲破坏，也不能美化掠夺。","point":"早期殖民掠夺的评价"}],"timeline":[{"t":"11 世纪以后","y":1050,"text":"西欧农村开展垦殖运动，耕地面积扩大、人口增长","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"14 世纪","y":1321,"text":"但丁完成《神曲》，文艺复兴在意大利兴起","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"14 世纪中叶","y":1350,"text":"领主出租自营地，租地农场和手工工场发展，资本主义萌芽产生","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"1487 年","y":1487,"text":"迪亚士到达非洲好望角","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"1492 年","y":1492,"text":"哥伦布横渡大西洋，到达美洲","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"1497—1498 年","y":1497,"text":"达·伽马绕过好望角，到达印度","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"1519—1522 年","y":1519,"text":"麦哲伦船队完成环球航行，证明地圆学说","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"16 世纪","y":1550,"text":"西班牙在美洲掠夺金银，三角贸易兴起","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"1588 年","y":1588,"text":"英国打败西班牙“无敌舰队”，海上力量崛起","unit":"w5","tag":"世界近代","volume":"v5"},{"t":"18 世纪下半叶","y":1760,"text":"英国打败法国，成为最大的殖民国家","unit":"w5","tag":"世界近代","volume":"v5"}]},{"volume":"v5","unit":{"id":"w6","volume":"v5","num":6,"title":"资本主义制度的初步确立","short":"资产阶级革命","years":"17—18 世纪","accent":"#2F5478","soft":"#E4ECF5","tint":"#BFCFE2","icon":"⚖","tagline":"三个国家，三条道路，把王权关进法律的笼子","intro":"17—18 世纪，大西洋两岸接连爆发三场革命：英国议会与国王较量数十年，用《权利法案》把王权关进法律的笼子；北美殖民地发表《独立宣言》，在战争中建起新国家；法国人攻占巴士底狱，把自由平等写进《人权宣言》，又眼看拿破仑帝国起落。这一单元要回答：资本主义制度如何在法与战中确立。","bigQuestion":"同样要限制王权、确立资本主义制度，英、美、法为什么走出了三条不同的路？","goals":["说出英国革命的进程，理解《权利法案》限制王权的作用","分析独立战争的双重性质与 1787 年宪法的原则","梳理法国大革命进程，评价《人权宣言》与拿破仑","比较三国革命的异同，认识资本主义制度的确立"],"keyLine":"1640 年英国议会重开 → 1689 年《权利法案》确立君主立宪 → 1776 年《独立宣言》宣告美国诞生 → 1789 年攻占巴士底狱 → 1804 年《拿破仑法典》"},"lessons":[{"id":"w6l1","num":16,"unit":"w6","title":"君主立宪制的英国","years":"1640—1689 年","icon":"👑","tag":"英国","hook":"1640 年 11 月，查理一世走进威斯敏斯特宫，面对十一年未曾召开的议会。议员们没先谈军费，而是摊开一叠旧账：未经议会同意的征税、被关押的商人、被解散的议会。","core":"英国资产阶级革命从 1640 年议会重新召开开始。内战处死了国王，共和国与复辟轮番上演，直到 1688 年光荣革命迎立新王，1689 年《权利法案》以法律形式限制王权，议会主权确立，君主立宪制在英国站稳脚跟。","points":["传统：1215 年《大宪章》确立“王权有限、法律至上”原则；13 世纪末议会制度基本确立，分上下两院，征税须经议会同意。","革命背景：17 世纪初英国资本主义发展，斯图亚特王朝詹姆斯一世宣扬“君权神授”，不经议会强行征税，与议会矛盾激化。","革命开始：1640 年，查理一世为筹集对苏格兰作战的军费重新召开议会，议会要求限制王权，革命由此开始。","内战与共和：1642 年国王挑起内战；1649 年查理一世被处死，英国宣布为共和国，克伦威尔却实行独裁，自称护国主。","复辟与政变：1660 年斯图亚特王朝复辟；1688 年议会邀请玛丽和威廉入主英国，不流血的政变史称“光荣革命”。","制度确立：1689 年《权利法案》规定国王不经议会同意不得征税、不得废止法律、不得维持常备军，君主立宪制确立。"],"terms":[["《大宪章》","1215 年英国贵族迫使国王签署的文件，规定国王不得随意征税、不得任意逮捕自由人，体现“王权有限、法律至上”原则。"],["议会","英国的最高立法机构，13 世纪末基本确立，分上院（贵族）和下院（骑士、市民），掌握征税权，是限制王权的主要力量。"],["君主立宪制","君主保留国家元首地位，但权力受宪法和法律限制，议会掌握国家最高权力。1689 年《权利法案》标志其在英国确立。"],["光荣革命","1688 年英国议会邀请玛丽和威廉入主英国，詹姆斯二世出逃，政权更替未发生大规模流血，史称“光荣革命”。"]],"figures":[["查理一世","英国国王，宣扬君权神授，1642 年挑起内战，1649 年被处死"],["克伦威尔","英国资产阶级革命领导人，处死国王后实行独裁，自任“护国主”"],["威廉和玛丽","1688 年应议会邀请入主英国，次年接受《权利法案》"],["詹姆斯一世","斯图亚特王朝国王，宣扬“君权神授”，与议会冲突不断"]],"events":[["1640 年","查理一世重新召开议会，革命开始"],["1642 年","内战爆发"],["1649 年","查理一世被处死，英国宣布为共和国"],["1688 年","光荣革命"],["1689 年","《权利法案》颁布，君主立宪制确立"]],"treaty":{"name":"《权利法案》","date":"1689 年","items":["凡未经议会同意，以国王权威停止法律或停止法律实施，为非法权力","未经议会准许，借口国王特权征收赋税，为非法","未经议会同意，国王不得在和平时期招募和维持常备军","议会内言论、辩论自由，不受法院或其他机关追究","议会应定期召开，议员由选举产生"],"note":"《权利法案》不是一部统一的成文宪法，英国至今没有这样的宪法；它与 1701 年《王位继承法》等法律、惯例一起，奠定了君主立宪制的基础。"},"significance":"英国用近半个世纪的较量，把“国王的权力”变成了“法律下的权力”。君主立宪制既保留了传统，又为资本主义发展提供了稳定的政治环境，为后来各国的制度设计提供了一个可以模仿的样本。","source":{"quote":"凡未经议会同意，以国王权威停止法律或停止法律实施之僭越权力，为非法权力。","from":"《权利法案》（1689 年）"},"pitfall":"开始的标志是 1640 年议会重开，不是 1642 年内战；《权利法案》在 1688 年光荣革命之后颁布，二者不可颠倒。","memory":"四〇议会起风波，四九查理上断头；八八光荣迎威廉，八九法案限王权。","link":"上承新航路与殖民掠夺带来的资本主义发展，本课看英国用立法限制王权；下一课看北美殖民地怎样用战争摆脱英国。","exam":["《权利法案》的内容与君主立宪制的确立","英国资产阶级革命的原因与进程","光荣革命与“王权有限”的历史传统"]},{"id":"w6l2","num":17,"unit":"w6","title":"美国的独立","years":"1775—1783 年","icon":"🗽","tag":"美国","hook":"1775 年 4 月 19 日清晨，来克星顿的草地上响起枪声。几百名民兵握着猎枪站在路边，英军队伍沿着乡道行进，谁也不知道这一枪会把十三块殖民地打成一个国家。","core":"1775 年来克星顿的枪声打响美国独立战争。1776 年 7 月 4 日《独立宣言》宣告美国诞生，1783 年英国承认美国独立。战后 1787 年宪法确立联邦制与三权分立，美国成为第一个由殖民地独立建成的资本主义国家。","points":["背景：1607—1733 年，英国在北美大西洋沿岸建立 13 个殖民地；18 世纪中期，殖民地经济发展，美利坚民族形成。","矛盾激化：英国为转嫁战争债务，对殖民地加征税收，颁布《印花税法》；1773 年波士顿倾茶事件使矛盾进一步激化。","战争爆发：1775 年 4 月 19 日，来克星顿的枪声标志独立战争爆发；第二届大陆会议组建大陆军，华盛顿任总司令。","宣告独立：1776 年 7 月 4 日，大陆会议通过杰斐逊起草的《独立宣言》，宣告北美 13 个殖民地脱离英国独立。","转折胜利：1777 年萨拉托加大捷成为转折点；1781 年约克镇英军投降；1783 年英国承认美国独立。","宪法立国：1787 年费城制宪会议制定宪法，确立联邦制，立法、行政、司法三权分立，华盛顿当选第一任总统。"],"terms":[["《独立宣言》","1776 年 7 月大陆会议通过，杰斐逊起草。宣布人人生而平等，享有生命权、自由权和追求幸福的权利，宣告美国独立。"],["联邦制","美国 1787 年宪法确立的国家结构，联邦政府与各州分权，联邦政府拥有征税、征兵、外交等权力，各州保留一定自治权。"],["三权分立","国家权力分为立法、行政、司法三部分，分别由国会、总统、最高法院行使，相互制约，防止权力滥用。"],["大陆军","第二届大陆会议组建的军队，由华盛顿任总司令，是独立战争中的主要武装力量。"]],"figures":[["华盛顿","大陆军总司令，领导独立战争，1789 年当选美国第一任总统"],["杰斐逊","《独立宣言》起草人，后来当选美国第三任总统"],["康华利","英军将领，1781 年在约克镇率部投降"]],"events":[["1773 年","波士顿倾茶事件"],["1775 年","来克星顿枪声，独立战争爆发"],["1776 年","《独立宣言》发表，美国诞生"],["1777 年","萨拉托加大捷"],["1783 年","英国承认美国独立"]],"treaty":{"name":"《独立宣言》","date":"1776 年 7 月 4 日","items":["宣布人人生而平等，造物主赋予他们生命权、自由权和追求幸福的权利","政府的正当权力来自被统治者的同意","当政府损害这些权利时，人民有权改变或废除它","宣告北美 13 个殖民地脱离英国，成为自由独立的国家","签名者以生命、财产和神圣的名誉相互担保"],"note":"《独立宣言》被称为“第一个人权宣言”，但它没有废除奴隶制，印第安人和黑人的权利也未得到保障；1787 年宪法同样默认了奴隶制的存在。"},"significance":"美国独立战争推翻了英国的殖民统治，赢得了民族独立，为美国资本主义的发展扫清了道路。它是民族解放战争，也是资产阶级革命；《独立宣言》和 1787 年宪法把启蒙思想变成了制度实践。","source":{"quote":"我们认为下述真理是不言而喻的：人人生而平等，造物主赋予他们若干不可让与的权利，其中包括生命权、自由权和追求幸福的权利。","from":"《独立宣言》（1776 年 7 月 4 日）"},"pitfall":"战争开始的标志是 1775 年来克星顿枪声，不是《独立宣言》发表；英国直到 1783 年才承认美国独立。","memory":"七五枪响来克星顿，七六宣言告独立；七七萨拉托加转，八三英国认独立。","link":"上承英国对北美殖民地的统治与重商政策，本课看殖民地如何用战争建国、用宪法分权；下一课看法国怎样把启蒙思想变成行动。","exam":["《独立宣言》的内容与意义","美国独立战争的性质与转折点","1787 年宪法与三权分立"]},{"id":"w6l3","num":18,"unit":"w6","title":"法国大革命和拿破仑帝国","years":"1789—1815 年","icon":"⚔","tag":"法国","hook":"1789 年 7 月 14 日，巴黎的空气里全是火药味。人群涌向巴士底狱——那座关押政治犯的石头城堡。几个小时后，狱长的人头被挑在长矛上，旧制度的象征倒下了。","core":"1789 年 7 月 14 日巴黎人民攻占巴士底狱，法国大革命爆发。《人权宣言》宣告自由平等，共和国取代君主制，路易十六被处死。拿破仑 1804 年称帝，用《拿破仑法典》巩固革命成果，又用战争把革命带向欧洲，1815 年帝国在滑铁卢终结。","points":["旧制度危机：18 世纪法国仍实行封建专制，社会分三个等级，教士和贵族享有特权，人口最多的第三等级承担赋税却无政治权利。","思想准备：伏尔泰、孟德斯鸠、卢梭等启蒙思想家批判专制与特权，主张自由、平等、法治和分权，为革命做了思想准备。","革命爆发：1789 年 5 月路易十六召开三级会议；7 月 14 日巴黎人民攻占巴士底狱，法国大革命开始。","纲领：1789 年制宪议会通过《人权宣言》，宣告人权、法治、自由、平等和保护私有财产；1791 年宪法确立君主立宪制。","共和：1792 年法国废除君主制，成立法兰西第一共和国；1793 年路易十六被处死；雅各宾派专政打退外敌、平息叛乱。","帝国：1799 年雾月政变后拿破仑掌权，1804 年称帝并颁布《拿破仑法典》；1815 年滑铁卢战败，帝国覆灭。"],"terms":[["《人权宣言》","1789 年制宪议会通过，宣告人权、法治、自由、分权、平等和保护私有财产，是法国大革命的纲领性文件。"],["《拿破仑法典》","1804 年颁布的民法典，确认资产阶级的私有财产权、契约自由和法律面前人人平等，成为许多国家民法的参照。"],["三级会议","法国国王召集的等级代表会议，参加者为教士、贵族和第三等级代表。1789 年路易十六为征税而召开，成为革命的导火线。"],["雅各宾派","法国大革命中的激进派别，罗伯斯庇尔领导，实行恐怖政策，打退外国武装干涉、平息国内叛乱，1794 年倒台。"]],"figures":[["罗伯斯庇尔","雅各宾派领导人，实行革命恐怖政策，1794 年被处死"],["拿破仑","法兰西第一帝国皇帝，颁布《拿破仑法典》，多次打败反法同盟，1815 年滑铁卢战败"],["路易十六","法国国王，1789 年召开三级会议，1793 年被处死"],["伏尔泰","法国启蒙思想家，抨击天主教会和封建专制，主张自由平等"]],"events":[["1789 年 7 月 14 日","巴黎人民攻占巴士底狱，革命爆发"],["1789 年 8 月","《人权宣言》发表"],["1793 年","路易十六被处死"],["1804 年","拿破仑称帝，颁布《拿破仑法典》"],["1815 年","滑铁卢战败，拿破仑帝国灭亡"]],"treaty":{"name":"《人权宣言》","date":"1789 年 8 月","items":["在权利方面，人们生来是而且始终是自由平等的","法律是公共意志的表现，法律面前人人平等","国家主权属于人民","私有财产是神圣不可侵犯的权利","言论、信仰自由，但不得扰乱法律所规定的公共秩序"],"note":"《人权宣言》以“天赋人权”“主权在民”否定了君主专制和等级制度，但它保护的主要是资产阶级的财产与权利，妇女和普通劳动者的权利并未真正实现。"},"significance":"法国大革命是资产阶级革命时代最彻底的一次革命，它摧毁了法国的君主专制统治，传播了自由民主思想，对世界历史产生了深远影响。拿破仑则用战争与法典，把革命的成果和矛盾一起带给了整个欧洲。","source":{"quote":"在权利方面，人们生来是而且始终是自由平等的。","from":"《人权宣言》（1789 年 8 月）"},"pitfall":"开始标志是 1789 年 7 月攻占巴士底狱，不是三级会议；《人权宣言》不是宪法，1791 年宪法才确立君主立宪制。","memory":"一七八九破巴士底，人权宣言立自由；九三断头路易十六，〇四法典拿破仑。","link":"上承英、美两种方案，本课看法国更彻底地推翻旧制度；拿破仑把革命成果带向欧洲，为下一单元资本主义的扩展埋下伏笔。","exam":["《人权宣言》的内容与法国大革命的意义","拿破仑帝国与《拿破仑法典》的评价","英、美、法三国资产阶级革命的比较"]}],"questions":[{"id":"w6q1","lesson":"w6l1","unit":"w6","type":"choice","level":1,"stem":"英国资产阶级革命开始的标志是","options":["1640 年查理一世重新召开议会","1642 年查理一世挑起内战","1649 年查理一世被处死","1688 年光荣革命"],"answer":0,"explain":"1640 年，查理一世为筹集军费重新召开议会，议会要求限制王权，革命由此开始。1642 年内战爆发、1649 年处死国王、1688 年光荣革命都是革命进程中的事件，不是开始的标志。","point":"英国资产阶级革命的开端"},{"id":"w6q2","lesson":"w6l1","unit":"w6","type":"choice","level":2,"stem":"《权利法案》规定：“凡未经议会同意，以国王权威停止法律或停止法律实施之僭越权力，为非法权力。”这一条文的核心是","options":["废除英国的君主制度","以法律形式限制王权，确立议会主权","规定国王有权解散议会","赋予全体成年男子选举权"],"answer":1,"explain":"该条文否定国王以特权废止法律的权力，把国王置于法律和议会之下。《权利法案》保留了君主，英国至今仍是君主立宪制；它也没有赋予全体成年男子选举权，选举权是后来逐步扩大的。","point":"《权利法案》与君主立宪制"},{"id":"w6q3","lesson":"w6l1","unit":"w6","type":"order","level":2,"stem":"按时间先后排列英国资产阶级革命的主要事件","items":["查理一世重新召开议会","内战爆发","查理一世被处死","光荣革命","《权利法案》颁布"],"explain":"1640 年议会重开 → 1642 年内战爆发 → 1649 年处死查理一世 → 1688 年光荣革命 → 1689 年《权利法案》颁布。","point":"英国资产阶级革命的进程"},{"id":"w6q4","lesson":"w6l1","unit":"w6","type":"fill","level":1,"stem":"1688 年，英国议会邀请玛丽和威廉入主英国，詹姆斯二世出逃，这场未发生大规模流血的政变被称为“______”。","answer":["光荣革命","“光荣革命”","1688年光荣革命"],"explain":"光荣革命完成了政权更替，第二年议会通过《权利法案》，君主立宪制在英国确立。","point":"光荣革命"},{"id":"w6q5","lesson":"w6l2","unit":"w6","type":"choice","level":1,"stem":"1776 年 7 月 4 日，大陆会议通过《独立宣言》，其最重要的意义是","options":["标志美国独立战争爆发","宣告北美 13 个殖民地脱离英国独立，美国诞生","确立美国的三权分立制度","英国被迫承认美国独立"],"answer":1,"explain":"《独立宣言》宣告北美 13 个殖民地脱离英国独立，美国由此诞生。独立战争爆发于 1775 年来克星顿枪声，三权分立由 1787 年宪法确立，英国到 1783 年才承认美国独立。","point":"《独立宣言》"},{"id":"w6q6","lesson":"w6l2","unit":"w6","type":"choice","level":2,"stem":"美国 1787 年宪法规定，立法权归国会，行政权归总统，司法权归最高法院，三者相互制约。这体现的原则是","options":["君主立宪","三权分立","天赋人权","邦联制"],"answer":1,"explain":"三权分立来自孟德斯鸠的分权学说，目的是防止权力滥用。1787 年宪法同时确立联邦制，加强中央政府的权力；君主立宪是英国的制度，天赋人权是《独立宣言》宣示的原则。","point":"1787 年美国宪法"},{"id":"w6q7","lesson":"w6l2","unit":"w6","type":"match","level":2,"stem":"把下列时间与美国独立战争中的事件配对","pairs":[["1773 年","波士顿倾茶事件"],["1775 年","来克星顿枪声"],["1776 年","《独立宣言》发表"],["1783 年","英国承认美国独立"]],"explain":"1773 年波士顿倾茶事件使矛盾激化 → 1775 年来克星顿枪声标志战争爆发 → 1776 年《独立宣言》宣告美国诞生 → 1783 年英国承认美国独立。","point":"美国独立战争的进程"},{"id":"w6q8","lesson":"w6l2","unit":"w6","type":"fill","level":2,"stem":"美国独立战争既是一场民族解放战争，也是一场______革命，因为它推翻了英国的殖民统治，为美国资本主义的发展扫清了道路。","answer":["资产阶级"],"explain":"美国独立战争具有双重性质：它使北美 13 个殖民地摆脱英国殖民统治，赢得民族独立；同时确立了资本主义制度，为美国资本主义发展开辟了道路。","point":"美国独立战争的性质"},{"id":"w6q9","lesson":"w6l3","unit":"w6","type":"choice","level":1,"stem":"法国大革命开始的标志是","options":["1789 年 5 月三级会议召开","1789 年 7 月 14 日巴黎人民攻占巴士底狱","1789 年 8 月《人权宣言》发表","1793 年路易十六被处死"],"answer":1,"explain":"1789 年 7 月 14 日巴黎人民攻占巴士底狱，法国大革命爆发。三级会议召开是革命的导火线，《人权宣言》发表于革命爆发之后，处死路易十六在 1793 年。","point":"法国大革命的开端"},{"id":"w6q10","lesson":"w6l3","unit":"w6","type":"choice","level":2,"stem":"1804 年拿破仑颁布的《拿破仑法典》","options":["确立了法国的君主立宪制","确认了资产阶级的私有财产权和法律面前人人平等，成为许多国家民法的参照","废除了法国的资本主义制度","恢复了封建贵族的特权"],"answer":1,"explain":"《拿破仑法典》把大革命形成的财产、契约和身份平等原则固定下来，体现了资产阶级国家的立法原则。君主立宪制由 1791 年宪法确立；法典维护的是资本主义制度，不是封建特权。","point":"《拿破仑法典》"},{"id":"w6q11","lesson":"w6l3","unit":"w6","type":"order","level":3,"stem":"按时间先后排列法国大革命与拿破仑帝国的主要事件","items":["巴黎人民攻占巴士底狱","《人权宣言》发表","法兰西第一共和国成立","拿破仑称帝","滑铁卢战败"],"explain":"1789 年 7 月攻占巴士底狱 → 1789 年 8 月《人权宣言》发表 → 1792 年法兰西第一共和国成立 → 1804 年拿破仑称帝 → 1815 年滑铁卢战败，帝国覆灭。","point":"法国大革命与拿破仑帝国的进程"},{"id":"w6q12","lesson":"w6l3","unit":"w6","type":"choice","level":3,"stem":"对拿破仑的对外战争，较为恰当的评价是","options":["始终是保卫法国革命的正义战争","前期打击了欧洲封建势力，后期损害了被侵略国家的主权与利益","只给欧洲各国带来灾难，没有任何进步作用","使法国丧失了全部海外殖民地"],"answer":1,"explain":"拿破仑的对外战争前期打败反法同盟，传播了革命成果，打击了欧洲封建势力；后期变为侵略扩张，激起各国反抗。评价要分阶段，不能一概而论。","point":"拿破仑对外战争"}],"timeline":[{"t":"1640 年","y":1640,"text":"查理一世重新召开议会，英国资产阶级革命开始","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1649 年","y":1649,"text":"查理一世被处死，英国宣布为共和国","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1688 年","y":1688,"text":"光荣革命，玛丽和威廉入主英国","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1689 年","y":1689,"text":"英国议会颁布《权利法案》，君主立宪制确立","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1775 年","y":1775,"text":"来克星顿枪声，美国独立战争爆发","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1776 年","y":1776,"text":"《独立宣言》发表，宣告美国诞生","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1787 年","y":1787,"text":"美国制宪会议制定宪法，确立联邦制和三权分立","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1789 年","y":1789,"text":"巴黎人民攻占巴士底狱，法国大革命爆发；《人权宣言》发表","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1804 年","y":1804,"text":"拿破仑称帝，建立法兰西第一帝国，颁布《拿破仑法典》","unit":"w6","tag":"世界近代","volume":"v5"},{"t":"1815 年","y":1815,"text":"拿破仑在滑铁卢战败，法兰西第一帝国覆灭","unit":"w6","tag":"世界近代","volume":"v5"}]},{"volume":"v5","unit":{"id":"w7","volume":"v5","num":7,"title":"工业革命和国际共产主义运动的兴起","short":"工业与思想","years":"18—19 世纪","accent":"#2C5073","soft":"#E3EBF5","tint":"#BDCEE1","icon":"⚙","tagline":"机器轰鸣改变世界，一纸宣言追问公平","intro":"18 世纪 60 年代，英国兰开夏郡的纺车旁响起机器的声音。蒸汽机带动机器，机器带动机车，工厂、铁路和城市在几十年间长满英伦三岛。可机器的另一面，是十二小时的工时和饥饿的工人。这一单元看清两件事：工业革命怎样改变生产与生活，马克思和恩格斯又怎样从中提出新的社会理想。","bigQuestion":"机器让英国成为世界工厂，为什么也让工人陷入贫困？","goals":["说出工业革命首先发生在英国的原因","概述珍妮机、蒸汽机和铁路带来的生产变革","分析工业革命对世界格局与社会结构的影响","理解《共产党宣言》的内容和马克思主义诞生的意义"],"keyLine":"1765 年珍妮机转动 → 1785 年蒸汽机轰鸣 → 19 世纪中期英国成为世界工厂 → 1848 年《共产党宣言》问世 → 1871 年巴黎公社举起红旗"},"lessons":[{"id":"w7l1","num":19,"unit":"w7","title":"第一次工业革命","years":"18 世纪 60 年代—19 世纪 40 年代","icon":"🚂","tag":"工业","hook":"1765 年，英国兰开夏郡的一间农舍里，织工哈格里夫斯造出一台能同时带动八个纱锭的手摇机器，取名“珍妮机”。一个人守着一台机器，干的活抵得上过去八个人。","core":"18 世纪 60 年代，工业革命从英国棉纺织业开始。珍妮机让机器代替手工，瓦特改良的蒸汽机让机器摆脱水力和风力，1825 年蒸汽机车又把动力送上铁轨。到 19 世纪中期，英国成为世界上第一个工业国家，人类进入“蒸汽时代”。","points":["背景：英国君主立宪制确立，资本主义经济发展；圈地运动提供劳动力，殖民扩张积累资本，海外市场扩大。","开端：18 世纪 60 年代哈格里夫斯发明珍妮机，一台机器带动多个纱锭，棉纺织业率先出现机器生产。","动力：1785 年瓦特改良的蒸汽机投入使用，不受水力风力限制；19 世纪 30 年代成为主要动力，人类进入蒸汽时代。","交通：1807 年美国人富尔顿发明汽船；1825 年史蒂芬孙的蒸汽机车旅行者号试车成功，铁路时代到来。","扩展：工业革命由英国向法、美、德扩展，19 世纪中期英国成为世界上第一个工业国家。","影响：生产力极大提高，工厂制度确立，工业资产阶级和无产阶级形成，城市化加速，也带来污染与贫富分化。"],"terms":[["工业革命","以机器生产代替手工劳动、以工厂代替手工工场的生产变革，18 世纪 60 年代始于英国棉纺织业，后扩展到欧美各国。"],["珍妮机","18 世纪 60 年代哈格里夫斯发明的手摇纺纱机，一次可带动多个纱锭，是棉纺织业中最早的重要机器发明。"],["蒸汽时代","瓦特改良的蒸汽机广泛用于生产后，人类以蒸汽为动力的时代。它使工厂摆脱自然条件限制，是工业革命的重要标志。"],["工厂制度","工业革命中形成的生产组织形式：机器集中在厂房，工人按工序分工，听从统一作息与管理，与分散的手工工场截然不同。"]],"figures":[["哈格里夫斯","英国织工，18 世纪 60 年代发明珍妮机，标志工业革命开始"],["瓦特","英国发明家，1785 年改良的蒸汽机投入使用，把人类带入“蒸汽时代”"],["史蒂芬孙","英国工程师，1825 年设计的蒸汽机车“旅行者号”试车成功"],["富尔顿","美国发明家，1807 年发明汽船，开辟水上运输的新动力"]],"events":[["18 世纪 60 年代","哈格里夫斯发明珍妮机，工业革命开始"],["1785 年","瓦特改良的蒸汽机投入使用"],["1807 年","美国人富尔顿发明汽船"],["1825 年","史蒂芬孙设计的蒸汽机车“旅行者号”试车成功"],["19 世纪中期","英国成为世界上第一个工业国家"]],"treaty":null,"significance":"工业革命极大提高了社会生产力，使人类由手工劳动时代跨入机器生产时代；工厂制度确立，工业资产阶级和工业无产阶级形成；资本主义世界市场初步形成，西方工业国与东方农业国之间的差距被迅速拉开。","source":{"quote":"手推磨产生的是封建主为首的社会，蒸汽磨产生的是工业资本家为首的社会。","from":"马克思《哲学的贫困》（1847 年）"},"pitfall":"工业革命从棉纺织业开始，不是从蒸汽机开始；瓦特是改良而非发明蒸汽机；工业革命首先发生在英国。","memory":"六〇年代珍妮机，八五蒸汽代水力；二五机车铁轨响，中期英国世界厂。","link":"上承新航路开辟和殖民扩张积累的市场与资本，下启世界市场的形成，也为马克思主义诞生准备了条件。","exam":["工业革命首先发生在英国的原因","珍妮机、蒸汽机和蒸汽机车的发明","工业革命的影响与评价"]},{"id":"w7l2","num":20,"unit":"w7","title":"马克思主义的诞生和国际共产主义运动的兴起","years":"1848—1871 年","icon":"📖","tag":"思想","hook":"1848 年 2 月，伦敦一家印刷所里，一本只有二十多页的德文小册子装订成书。封面末行印着一句口号：“全世界无产者，联合起来！”","core":"工业革命使资本主义迅速发展，工人运动不断高涨。1848 年《共产党宣言》发表，标志马克思主义诞生；1864 年第一国际成立，1871 年巴黎公社建立世界上第一个无产阶级政权。","points":["背景：工业革命使资本主义发展、贫富分化加剧；里昂工人起义、英国宪章运动、西里西亚织工起义，工人阶级登上政治舞台。","来源：马克思、恩格斯批判继承德意志古典哲学、英国古典政治经济学和英法空想社会主义，在工人运动中创立理论。","诞生：1848 年《共产党宣言》在伦敦发表，第一次全面阐述科学社会主义，标志马克思主义诞生。","内容：宣言指出全部历史都是阶级斗争的历史；资本主义必将被共产主义取代；无产阶级要建立自己的政权。","第一国际：1864 年在伦敦成立，马克思是创始人之一，起草《成立宣言》，推动各国工人运动走向联合。","巴黎公社：1871 年 3 月 18 日巴黎人民起义，建立世界上第一个无产阶级政权；5 月 28 日失败。"],"terms":[["马克思主义","马克思、恩格斯创立的科学理论体系，包括哲学、政治经济学和科学社会主义，为无产阶级解放提供了思想武器。"],["《共产党宣言》","1848 年在伦敦发表的纲领性文献，第一次全面阐述科学社会主义，号召“全世界无产者，联合起来”，标志马克思主义诞生。"],["第一国际","即国际工人协会，1864 年在伦敦成立，马克思是创始人之一并起草《成立宣言》，是各国工人运动走向联合的组织。"],["巴黎公社","1871 年 3 月 18 日巴黎人民起义后建立的无产阶级政权，是世界上第一个无产阶级政权，5 月 28 日被镇压而失败。"]],"figures":[["马克思","与恩格斯共同创立马克思主义，起草《共产党宣言》，第一国际创始人之一"],["恩格斯","马克思的亲密战友，与他合著《共产党宣言》，整理出版《资本论》后两卷"],["欧仁·鲍狄埃","巴黎公社社员，创作《国际歌》歌词，歌颂无产阶级的斗争"]],"events":[["1848 年","《共产党宣言》发表，马克思主义诞生"],["1864 年","第一国际在伦敦成立"],["1871 年 3 月 18 日","巴黎人民起义，巴黎公社成立"],["1871 年 5 月 28 日","巴黎公社失败"]],"treaty":null,"significance":"马克思主义是科学的理论、人民的理论、实践的理论，为无产阶级的解放提供了思想武器；从此国际共产主义运动有了科学理论的指导，深刻影响了此后一百多年的世界历史进程。","source":{"quote":"无产者在这个革命中失去的只是锁链。他们获得的将是整个世界。","from":"《共产党宣言》（1848 年）"},"pitfall":"马克思主义诞生的标志是 1848 年《共产党宣言》发表，不是第一国际成立；巴黎公社只是第一次伟大尝试。","memory":"四八宣言伦敦出，阶级斗争写前途；六四国际聚伦敦，七一公社红旗举。","link":"承接工业革命造成的阶级对立，把机器时代的贫困变成理论问题；此后马克思主义传到俄国、中国。","exam":["《共产党宣言》的内容与意义","马克思主义诞生的历史条件","巴黎公社的性质与失败原因"]}],"questions":[{"id":"w7q1","lesson":"w7l1","unit":"w7","type":"choice","level":1,"stem":"18 世纪 60 年代，工业革命最早开始于","options":["英国的棉纺织业","英国的冶金业","法国的丝织业","美国的机器制造业"],"answer":0,"explain":"工业革命首先发生在英国，最先出现的部门是棉纺织业：哈格里夫斯发明珍妮机，标志着工业革命的开始。冶金等行业是机器生产推广之后才大规模改造的，法国、美国则是在英国之后才相继开展工业革命。","point":"工业革命的开端"},{"id":"w7q2","lesson":"w7l1","unit":"w7","type":"choice","level":2,"stem":"1785 年以后，瓦特改良的蒸汽机在英国工厂中广泛使用，其最重要的历史意义是","options":["使机器生产摆脱了自然条件的限制，人类进入“蒸汽时代”","使英国确立了君主立宪制度","使英国成为世界上第一个工业国家","使工人摆脱了长时间劳动和贫困"],"answer":0,"explain":"瓦特改良的蒸汽机以煤炭为燃料，不再受河流、风力等自然条件限制，工厂可以建在任何地方，到 19 世纪 30 年代蒸汽机成为主要动力，人类进入“蒸汽时代”。君主立宪制在 17 世纪末已确立；英国成为第一个工业国家是工业革命整体完成的结果；工人反而面临更长工时和更重剥削。","point":"蒸汽机的改良与“蒸汽时代”"},{"id":"w7q3","lesson":"w7l1","unit":"w7","type":"order","level":2,"stem":"按时间先后排列下列工业革命中的发明与应用","items":["哈格里夫斯发明珍妮机","瓦特改良的蒸汽机投入使用","富尔顿发明汽船","史蒂芬孙设计的蒸汽机车试车成功"],"explain":"18 世纪 60 年代哈格里夫斯发明珍妮机，工业革命开始；1785 年瓦特改良的蒸汽机投入使用；1807 年美国人富尔顿发明汽船；1825 年史蒂芬孙设计的蒸汽机车“旅行者号”试车成功。","point":"工业革命的主要发明"},{"id":"w7q4","lesson":"w7l1","unit":"w7","type":"fill","level":2,"stem":"1825 年，英国工程师______设计的蒸汽机车“旅行者号”试车成功，人类由此进入铁路时代。","answer":["史蒂芬孙","斯蒂芬森"],"explain":"1825 年，史蒂芬孙设计的蒸汽机车“旅行者号”试车成功，铁路运输迅速发展，人类进入铁路时代。汽船则由美国人富尔顿在 1807 年发明。","point":"蒸汽机车的发明"},{"id":"w7q5","lesson":"w7l2","unit":"w7","type":"choice","level":1,"stem":"1848 年 2 月，一本德文小册子在伦敦出版，结尾号召“全世界无产者，联合起来”。这部著作的发表标志着","options":["马克思主义的诞生","第一国际的成立","巴黎公社的建立","工业革命的完成"],"answer":0,"explain":"这部著作是马克思、恩格斯为共产主义者同盟起草的《共产党宣言》，它第一次全面阐述科学社会主义，标志马克思主义诞生。第一国际成立于 1864 年，巴黎公社建立于 1871 年。","point":"马克思主义的诞生"},{"id":"w7q6","lesson":"w7l2","unit":"w7","type":"choice","level":2,"stem":"19 世纪三四十年代，法国里昂工人两次起义、英国宪章运动、德意志西里西亚织工起义相继爆发，这些斗争表明","options":["工人阶级开始作为独立的政治力量登上历史舞台","资本主义制度已被工人运动推翻","无产阶级已经建立了自己的政权","马克思主义已经成为工人运动的指导思想"],"answer":0,"explain":"三大工人运
