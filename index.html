function addXP(n, reason, silent) {
  if (!n) return;
  state.xp = Number(state.xp || 0) + n;
  state.daily.xp = Number(state.daily.xp || 0) + n;
  logActivity({ xp: n });
  const before = levelInfo(state.xp - n).index;
  const after = levelInfo(state.xp).index;
  saveState();
  updateTopStats();
  if (!silent) toast(`+${n} XP · ${reason || '继续加油'}`, '⚡', 2200);
  if (after > before) {
    setTimeout(() => {
      toast(`升级！现在是「${LEVELS[after].name}」`, '🎉', 3600);
      burstConfetti(70);
      playSound('level');
    }, 450);
  }
  checkBadges();
}
function checkBadges() {
  const earned = new Set(state.badges);
  const wrongTodo = state.wrong.filter(w => w.status !== 'mastered').length;
  const mastered = state.wrong.filter(w => w.status === 'mastered').length;
  const unitsRight = UNITS.filter(u => unitQuestions(u.id).some(q => (state.answers[q.id] || {}).right > 0)).length;
  const volumesRight = VOLUMES.filter(v => volumeUnits(v.id).some(u => unitQuestions(u.id).some(q => (state.answers[q.id] || {}).right > 0))).length;
  const readSources = Number(state.readSources || 0);
  const rules = {
    first_quiz: state.quizCount >= 1,
    combo5: state.bestCombo >= 5,
    unit_star: UNITS.some(u => unitQuestions(u.id).filter(q => (state.answers[q.id] || {}).right > 0).length >= 5),
    lab3: state.explored.length >= 3,
    wrong5: state.wrong.length >= 5,
    clean5: mastered >= 5,
    streak3: state.streak >= 3,
    streak7: state.streak >= 7,
    xp200: state.xp >= 200,
    all_units: volumesRight >= VOLUMES.length,
    daily_goal: state.daily.xp >= state.daily.goal,
    chest_first: !!state.daily.chestClaimed,
    quiz100: state.totalAnswered >= 100,
    source_reader: readSources >= 5
  };
  const newly = BADGES.filter(b => rules[b.id] && !earned.has(b.id));
  if (!newly.length) return;
  newly.forEach(b => { state.badges.push(b.id); });
  saveState();
  newly.forEach((b, i) => setTimeout(() => { toast(`获得徽章「${b.name}」`, b.icon, 3200); playSound('badge'); }, 600 + i * 700));
}
function readSource() {
  state.readSources = Number(state.readSources || 0) + 1;
  saveState();
  checkBadges();
}

/* ---------- 统计 ---------- */
function unitStats(u) {
  const lessons = unitLessons(u);
  const totalK = lessons.length;
  const learned = lessons.filter(l => state.learned.includes(l.id)).length;
  const qs = unitQuestions(u.id);
  const totalQ = qs.length;
  const correctUnique = qs.filter(q => (state.answers[q.id] || {}).right > 0).length;
  let attempts = 0, right = 0;
  qs.forEach(q => { const a = state.answers[q.id]; if (a) { attempts += (a.right || 0) + (a.wrong || 0); right += (a.right || 0); } });
  const accuracy = attempts ? Math.round(right / attempts * 100) : null;
  const progress = Math.round((learned / Math.max(1, totalK)) * 55 + (correctUnique / Math.max(1, totalQ)) * 45);
  return { lessons, totalK, learned, totalQ, correctUnique, attempts, right, accuracy, progress };
}
function overallStats() {
  const totalK = LESSONS.length;
  const learned = state.learned.length;
  const accounts = Object.values(state.answers);
  let attempts = 0, right = 0;
  accounts.forEach(a => { attempts += (a.right || 0) + (a.wrong || 0); right += (a.right || 0); });
  const accuracy = attempts ? Math.round(right / attempts * 100) : null;
  const mastered = state.wrong.filter(w => w.status === 'mastered').length;
  const todo = state.wrong.filter(w => w.status !== 'mastered').length;
  return { totalK, learned, attempts, right, accuracy, mastered, todo, wrong: state.wrong.length };
}
function campaignRecord(uid) {
  return state.campaign[uid] || { stars: 0, best: 0 };
}
function campaignTotals() {
  let stars = 0, cleared = 0, perfect = 0;
  UNITS.forEach(u => { const r = campaignRecord(u.id); stars += r.stars || 0; if (r.stars) cleared++; if (r.stars === 3) perfect++; });
  return { stars, max: UNITS.length * 3, cleared, perfect, progress: Math.round(stars / (UNITS.length * 3) * 100) };
}
function campaignRank(stars) {
  const max = Math.max(1, UNITS.length * 3);
  const pct = stars / max * 100;
  if (pct >= 92) return { name: '历史通', icon: '👑' };
  if (pct >= 70) return { name: '时空旅人', icon: '🧭' };
  if (pct >= 45) return { name: '史料侦探', icon: '🕵' };
  if (pct >= 20) return { name: '青铜观察员', icon: '🔍' };
  if (pct >= 1) return { name: '竹简学徒', icon: '📜' };
  return { name: '小小史官', icon: '🌱' };
}

/* ---------- 音效 / 提示 / 彩带 ---------- */
let audioCtx = null;
function playSound(type) {
  if (!state.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const map = {
      click: [520, 0.05, 'sine', 0.06],
      correct: [660, 0.12, 'sine', 0.1],
      wrong: [200, 0.18, 'triangle', 0.08],
      level: [880, 0.3, 'sine', 0.1],
      badge: [740, 0.22, 'sine', 0.09],
      chest: [980, 0.32, 'sine', 0.1]
    };
    const cfg = map[type] || map.click;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = cfg[2];
    osc.frequency.value = cfg[0];
    gain.gain.value = cfg[3];
    osc.connect(gain).connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(cfg[3], t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + cfg[1]);
    osc.start(t);
    if (type === 'correct' || type === 'level' || type === 'chest') {
      const osc2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      osc2.type = 'sine'; osc2.frequency.value = cfg[0] * 1.26; g2.gain.value = cfg[3] * 0.7;
      osc2.connect(g2).connect(audioCtx.destination);
      osc2.start(t + 0.08); g2.gain.setValueAtTime(cfg[3] * 0.7, t + 0.08);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.08 + cfg[1]);
      osc2.stop(t + 0.08 + cfg[1]);
    }
    osc.stop(t + cfg[1] + 0.02);
  } catch (e) { /* 忽略音频错误 */ }
}
function toast(msg, icon = '✦', ms = 2600) {
  const wrap = $('#toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="t-ico">${esc(icon)}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 260);
  }, ms);
}
let confettiRAF = null;
function burstConfetti(count = 60) {
  const canvas = $('#confettiCanvas');
  if (!canvas) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#B23A2C', '#B48833', '#2F6C60', '#3A5D7E', '#E0B96A', '#D98B72'];
  const parts = Array.from({ length: count }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 220,
    y: innerHeight * 0.34 + Math.random() * 60,
    vx: (Math.random() - 0.5) * 9,
    vy: -Math.random() * 11 - 2,
    w: 5 + Math.random() * 6,
    h: 8 + Math.random() * 8,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.35,
    color: colors[Math.floor(Math.random() * colors.length)],
    life: 90 + Math.random() * 50
  }));
  if (confettiRAF) cancelAnimationFrame(confettiRAF);
  const tick = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    parts.forEach(p => {
      p.life -= 1;
      if (p.life <= 0) return;
      alive = true;
      p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.vx *= 0.995; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (alive) confettiRAF = requestAnimationFrame(tick);
    else { ctx.clearRect(0, 0, innerWidth, innerHeight); confettiRAF = null; }
  };
  tick();
}

let modalOnClose = null;
function openModal({ title, body, actions = [], onClose }) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>
      <div class="modal-body">${body || ''}</div>
      <div class="modal-actions">${actions.map((a, i) => `<button class="btn ${a.primary ? 'btn-primary' : 'btn-ghost'}" data-modal-action="${i}">${esc(a.text)}</button>`).join('')}</div>
    </div>
  </div>`;
  document.body.classList.add('is-locked');
  modalOnClose = onClose || null;
  const close = () => closeModal();
  $('#modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') close(); });
  actions.forEach((a, i) => {
    const btn = $(`[data-modal-action="${i}"]`);
    if (!btn) return;
    btn.addEventListener('click', () => { if (a.onClick) a.onClick(); if (a.keepOpen !== true) close(); });
  });
  const first = $('.modal .btn-primary, .modal .btn-ghost');
  if (first) setTimeout(() => first.focus(), 40);
}
function closeModal() {
  const root = $('#modalRoot');
  root.innerHTML = '';
  document.body.classList.remove('is-locked');
  if (modalOnClose) { const fn = modalOnClose; modalOnClose = null; fn(); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const SEARCH_INDEX = [];
function buildSearchIndex() {
  if (SEARCH_INDEX.length) return;
  VOLUMES.forEach(v => {
    const first = volumeUnits(v.id)[0];
    SEARCH_INDEX.push({ kind: '分册', title: v.name, sub: `${v.short} · ${v.era} · ${volumeUnits(v.id).length} 个单元`, href: first ? `#unit/${first.id}/knowledge` : '#courses', keys: `${v.name}${v.short}${v.era}${v.desc}` });
  });
  UNITS.forEach(u => SEARCH_INDEX.push({ kind: '单元', title: `第 ${u.num} 单元 · ${u.title}`, sub: `${volumeById(u.volume)?.short || ''} · ${u.years}`, href: `#unit/${u.id}`, keys: `${u.title}${u.short}${u.years}${u.tagline}` }));
  LESSONS.forEach(l => {
    const uv = unitById(l.unit)?.volume;
    SEARCH_INDEX.push({ kind: '课时', title: `第 ${l.num} 课 · ${l.title}`, sub: `${volumeById(uv)?.short || ''} · ${l.years} · ${l.tag}`, href: `#unit/${l.unit}/knowledge`, keys: `${l.title}${l.tag}${l.core}${l.points.join('')}${l.terms.map(t => t[0]).join('')}` });
    l.terms.forEach(t => SEARCH_INDEX.push({ kind: '名词', title: t[0], sub: t[1], href: `#unit/${l.unit}/knowledge`, keys: t[0] + t[1] }));
  });
  TOPICS.forEach(t => SEARCH_INDEX.push({ kind: '专题', title: t.title, sub: t.desc, href: `#topic/${t.id}`, keys: t.title + t.desc + t.intro }));
  TIMELINE.forEach(e => SEARCH_INDEX.push({ kind: '年表', title: e.t, sub: e.text, href: '#guide', keys: e.text }));
}
function openSearch() {
  buildSearchIndex();
  openModal({
    title: '搜索全站',
    body: `<div class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="输入关键词：鸦片战争、孙中山、辛丑条约…" autocomplete="off" aria-label="搜索关键词"></div>
      <div class="search-results" id="searchResults"><div class="search-empty">输入关键词，查找单元、课时、名词、专题和大事年表。</div></div>`,
    actions: [{ text: '关闭' }]
  });
  $('#modalRoot .modal').classList.add('search-modal');
  const input = $('#searchInput');
  input.focus();
  const render = () => {
    const kw = input.value.trim().toLowerCase();
    const box = $('#searchResults');
    if (!kw) { box.innerHTML = '<div class="search-empty">输入关键词，查找单元、课时、名词、专题和大事年表。</div>'; return; }
    const hits = SEARCH_INDEX.filter(item => (item.title + item.sub + item.keys).toLowerCase().includes(kw)).slice(0, 24);
    if (!hits.length) { box.innerHTML = '<div class="search-empty">没有找到相关内容，换个词试试。</div>'; return; }
    box.innerHTML = hits.map(h => `<a class="search-result" href="${h.href}"><span class="sr-kind">${h.kind}</span><span><b>${esc(h.title)}</b><span>${esc(h.sub).slice(0, 60)}</span></span></a>`).join('');
    $$('.search-result', box).forEach(a => a.addEventListener('click', () => closeModal()));
  };
  input.addEventListener('input', render);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = $('.search-result'); if (first) { location.hash = first.getAttribute('href'); closeModal(); } }
  });
}

/* ---------- SVG 工具 ---------- */
function svgEl(tag, attrs, parent) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
  if (parent) parent.appendChild(el);
  return el;
}
function svgText(parent, x, y, text, cls, extra) {
  const el = svgEl('text', Object.assign({ x, y, class: cls || 'svg-small' }, extra || {}), parent);
  el.textContent = text;
  return el;
}

/* ---------- 路由 ---------- */
function parseHash() {
  const raw = (location.hash || '#home').replace(/^#/, '');
  const parts = raw.split('/').filter(Boolean);
  return { page: parts[0] || 'home', a: parts[1] || '', b: parts[2] || '' };
}
let currentPage = '';
function route() {
  const { page, a, b } = parseHash();
  const pages = {
    home: () => renderHome(),
    courses: () => { if (volumeById(a)) { courseVolume = a; } renderCourses(); },
    campaign: () => {
      if (volumeById(a)) { campaignVolume = a; campaignSelected = volumeUnits(a)[0]?.id || campaignSelected; }
      renderCampaign();
    },
    unit: () => renderUnit(a || state.lastUnit || 'u1', b || 'knowledge'),
    lab: () => renderLab(a || 'timeline'),
    practice: () => renderPractice(),
    wrong: () => renderWrong(),
    achievements: () => renderAchievements(),
    report: () => renderReport(),
    guide: () => renderGuide(a),
    topic: () => renderTopic(a),
    sync: () => renderSync(a),
    search: () => { renderHome(); openSearch(); }
  };
  const fn = pages[page] || pages.home;
  if (page !== currentPage) window.scrollTo({ top: 0, behavior: 'auto' });
  currentPage = page;
  setNavActive(['unit'].includes(page) ? 'courses' : page === 'topic' ? 'guide' : page);
  fn();
  updateTopStats();
  app.focus({ preventScroll: true });
}
function navigate(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}

function handleDailyAnswer(idx) {
  if (state.daily.qChecked) return;
  const q = qById(state.daily.qid);
  if (!q) return;
  state.daily.qChosen = idx;
  state.daily.qChecked = true;
  const ok = idx === q.answer;
  recordAnswer(q, ok, 'daily');
  if (ok) addXP(6, '每日一题答对', true);
  saveState();
  if (ok) playSound('correct'); else playSound('wrong');
  renderHome();
  setTimeout(() => $('#dailyCard')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 40);
}
function openDailyChest() {
  if (state.daily.chestClaimed) return;
  const done = state.daily.learned >= 1 && state.daily.correct >= 5 && state.daily.reviewed >= 1;
  if (!done) { toast('先完成今天的三件小事，奖励箱才会打开。', '🎁'); return; }
  state.daily.chestClaimed = true;
  addXP(20, '开启每日奖励箱');
  playSound('chest');
  burstConfetti(70);
  toast('奖励箱打开！+20 XP，继续加油。', '🎁', 3800);
  saveState();
  setTimeout(() => renderHome(), 500);
}
function recordAnswer(q, ok, mode) {
  const a = state.answers[q.id] || { right: 0, wrong: 0 };
  if (ok) a.right += 1; else a.wrong += 1;
  a.last = Date.now();
  state.answers[q.id] = a;
  state.totalAnswered += 1;
  if (ok) {
    state.totalCorrect += 1;
    state.daily.correct += 1;
    logActivity({ answered: 1, correct: 1 });
  } else {
    logActivity({ answered: 1, correct: 0 });
    if (mode !== 'review') addWrong(q.id);
  }
  saveState();
}

let courseVolume = volumeById(state.lastVolume) ? state.lastVolume : 'v1';

function volumeStats(v) {
  const units = volumeUnits(v.id);
  const lessons = units.flatMap(u => unitLessons(u));
  const learned = lessons.filter(l => state.learned.includes(l.id)).length;
  const qs = units.flatMap(u => unitQuestions(u.id));
  const correctUnique = qs.filter(q => (state.answers[q.id] || {}).right > 0).length;
  let attempts = 0, right = 0;
  qs.forEach(q => { const a = state.answers[q.id]; if (a) { attempts += (a.right || 0) + (a.wrong || 0); right += a.right || 0; } });
  const progress = Math.round(
    (learned / Math.max(1, lessons.length)) * 55 +
    (correctUnique / Math.max(1, qs.length)) * 45
  );
  return { units, lessons, totalK: lessons.length, learned, totalQ: qs.length, correctUnique, attempts, accuracy: attempts ? Math.round(right / attempts * 100) : null, progress };
}

function stagePositions(n) {
  if (n <= 1) return [[360, 210]];
  if (n <= 4) {
    return Array.from({ length: n }, (_, i) => [110 + i * (500 / (n - 1)), 170]);
  }
  const top = Math.ceil(n / 2);
  const bottom = n - top;
  const pts = [];
  for (let i = 0; i < top; i++) pts.push([110 + i * (500 / (top - 1)), 100]);
  if (bottom === 1) pts.push([360, 330]);
  else for (let j = 0; j < bottom; j++) pts.push([610 - j * (500 / (bottom - 1)), 330]);
  return pts;
}
function pathFrom(pts) {
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const mx = (x0 + x1) / 2;
    d += ` C ${mx} ${y0}, ${mx} ${y1}, ${x1} ${y1}`;
  }
  return d;
}
function starRowHTML(n) {
  return `<span class="star-row">${[0, 1, 2].map(i => `<span class="${i < n ? 'on' : ''}">★</span>`).join('')}</span>`;
}

/* ============================================================
   视图 · 闯关 / 答题 / 结果
   ============================================================ */
let quiz = null;
let quizResult = null;
let practiceUnit = unitById(state.lastUnit) ? state.lastUnit : (volumeUnits('v1')[0]?.id || 'u1');
let practiceVolume = unitById(practiceUnit)?.volume || 'v1';
const TYPE_LABEL = { choice: '单项选择', fill: '填空', order: '时序排序', match: '配对连线' };

function addWrong(qid) {
  let w = state.wrong.find(x => x.qid === qid);
  if (!w) {
    w = { qid, status: 'todo', wrongCount: 1, rightStreak: 0, last: Date.now() };
    state.wrong.push(w);
  } else {
    w.wrongCount = Number(w.wrongCount || 0) + 1;
    w.rightStreak = 0;
    w.status = 'todo';
    w.last = Date.now();
  }
  saveState();
}
function markReviewCorrect(qid) {
  const w = state.wrong.find(x => x.qid === qid);
  if (!w) return;
  w.rightStreak = Number(w.rightStreak || 0) + 1;
  w.last = Date.now();
  if (w.rightStreak >= 2) w.status = 'mastered';
  saveState();
}

function startQuiz(opts) {
  let qids = [];
  const unitId = opts.unitId || practiceUnit;
  if (opts.qids) qids = opts.qids.slice();
  else if (opts.mode === 'unit') qids = shuffle(unitQuestions(unitId).map(q => q.id)).slice(0, opts.count || 8);
  else if (opts.mode === 'lesson') qids = shuffle(lessonQuestions(opts.lessonId).map(q => q.id)).slice(0, opts.count || 4);
  else if (opts.mode === 'wrong') qids = state.wrong.filter(w => w.status !== 'mastered').map(w => w.qid);
  else if (opts.mode === 'seq') qids = shuffle(QUESTIONS.filter(q => q.type === 'order' || q.type === 'match').map(q => q.id)).slice(0, opts.count || 8);
  else if (opts.mode === 'source') qids = shuffle(QUESTIONS.filter(q => q.source).map(q => q.id)).slice(0, opts.count || 6);
  else if (opts.mode === 'daily') {
    const done = new Set(state.wrong.map(w => w.qid));
    qids = shuffle(QUESTIONS.filter(q => q.type === 'choice' && !done.has(q.id)).map(q => q.id)).slice(0, 5);
    if (qids.length < 5) qids = qids.concat(shuffle(QUESTIONS.filter(q => q.type === 'choice').map(q => q.id)).slice(0, 5 - qids.length));
  } else qids = shuffle(QUESTIONS.map(q => q.id)).slice(0, opts.count || 10);
  qids = [...new Set(qids)].filter(id => qById(id));
  if (!qids.length) {
    if (opts.mode === 'wrong') toast('暂时没有待复习的错题，先去闯关吧。', '🪹');
    else toast('没有找到可以练习的题目。', '🧩');
    return;
  }
  quizResult = null;
  quiz = {
    qids, index: 0, checked: false, correct: false,
    selected: null, fillValue: '', hint: false, showHint: false,
    combo: 0, maxCombo: 0, mode: opts.mode || 'random', unitId, title: opts.title || '闯关练习',
    answers: [], startedAt: Date.now(), xpStart: state.xp,
    orderPool: [], orderPicked: [],
    matchLeft: [], matchRight: [], matchSel: null, matchDone: [], matchMistakes: 0
  };
  if (qById(qids[0])) {
    practiceUnit = qById(qids[0]).unit;
    practiceVolume = unitById(practiceUnit)?.volume || 'v3';
  }
  playSound('click');
  if (location.hash === '#practice') renderPractice();
  else location.hash = '#practice';
}

function resetQuestionState() {
  quiz.checked = false; quiz.correct = false; quiz.selected = null; quiz.fillValue = '';
  quiz.showHint = false; quiz.orderPicked = []; quiz.orderPool = [];
  quiz.matchSel = null; quiz.matchDone = []; quiz.matchMistakes = 0;
}
function prepareQuestion(q) {
  resetQuestionState();
  if (q.type === 'order') quiz.orderPool = shuffle(q.items.map((_, i) => i));
  if (q.type === 'match') {
    quiz.matchLeft = shuffle(q.pairs.map((_, i) => i));
    quiz.matchRight = shuffle(q.pairs.map((_, i) => i));
    quiz.matchDone = [];
  }
}
function renderQuiz() {

  if (!q) { finishQuiz(); return; }
  if (!quiz.preparedFor || quiz.preparedFor !== q.id) {
    prepareQuestion(q);
    quiz.preparedFor = q.id;
  }
  const l = lessonById(q.lesson);
  const u = unitById(q.unit);
  const pct = Math.round((quiz.index + (quiz.checked ? 1 : 0)) / quiz.qids.length * 100);
  let bodyHTML = '';

  if (q.type === 'choice') {
    bodyHTML = `<div class="quiz-options">${q.options.map((opt, i) => {
      let cls = 'option';
      if (quiz.checked) {
        if (i === q.answer) cls += ' correct';
        else if (i === quiz.selected) cls += ' wrong';
        else cls += ' dim';
      }
      return `<button class="${cls}" data-opt="${i}" ${quiz.checked ? 'disabled' : ''}>
        <span class="o-key">${'ABCD'[i]}</span><span>${esc(opt)}</span>
      </button>`;
    }).join('')}</div>`;
  } else if (q.type === 'fill') {
    bodyHTML = `<div class="fill-zone">
      <input type="text" id="fillInput" placeholder="在这里输入答案" value="${esc(quiz.fillValue)}" ${quiz.checked ? 'disabled' : ''} autocomplete="off">
      ${quiz.checked ? '' : '<button class="btn btn-primary" id="submitFill">确认答案</button>'}
    </div>`;
  } else if (q.type === 'order') {
    bodyHTML = `<div class="order-area">
      <div class="order-hint">按时间先后，依次点击下面的卡片（点击已放入的卡片可撤回）。</div>
      <div class="order-answer" id="orderAnswer">${quiz.orderPicked.map((idx, pos) => `<button class="order-item picked" data-order-remove="${pos}" ${quiz.checked ? 'disabled' : ''}>${pos + 1}. ${esc(q.items[idx])}</button>`).join('')}</div>
      <div class="order-pool" id="orderPool">${quiz.orderPool.map(idx => `<button class="order-item" data-order-pick="${idx}" ${quiz.checked ? 'disabled' : ''}>${esc(q.items[idx])}</button>`).join('')}</div>
      ${quiz.checked ? '' : `<div><button class="btn btn-primary" id="submitOrder" ${quiz.orderPicked.length < q.items.length ? 'disabled style="opacity:.5"' : ''}>确认顺序</button></div>`}
    </div>`;
  } else if (q.type === 'match') {
    bodyHTML = `<div class="match-grid">
      <div class="match-col">
        <div class="match-col-title">左栏</div>
        ${quiz.matchLeft.map(i => `<button class="match-item ${quiz.matchDone.includes(i) ? 'matched' : ''} ${quiz.matchSel === i ? 'sel' : ''}" data-match-left="${i}" ${quiz.matchDone.includes(i) || quiz.checked ? 'disabled' : ''}>${esc(q.pairs[i][0])}</button>`).join('')}
      </div>
      <div class="match-col">
        <div class="match-col-title">右栏</div>
        ${quiz.matchRight.map(i => `<button class="match-item ${quiz.matchDone.includes(i) ? 'matched' : ''}" data-match-right="${i}" ${quiz.matchDone.includes(i) || quiz.checked ? 'disabled' : ''}>${esc(q.pairs[i][1])}</button>`).join('')}
      </div>
    </div>
    ${quiz.checked ? '' : '<div class="small muted" style="margin-top:10px">先点左栏一项，再点右栏对应项。配对错误会记一次失误。</div>'}`;
  }

  const answerText = q.type === 'choice' ? q.options[q.answer] : q.type === 'fill' ? q.answer[0] : q.type === 'order' ? q.items.join(' → ') : q.pairs.map(p => `${p[0]}—${p[1]}`).join('；');
  const hintText = q.hint || (l ? `提示：先想「${q.point}」，再回忆第 ${l.num} 课的知识卡。` : `提示：想一想「${q.point}」。`);

  app.innerHTML = `<div class="page-wrap"><div class="quiz-shell">
    <div class="quiz-top">

      <div class="progress"><i style="width:${pct}%;background:${u ? u.accent : 'var(--red)'}"></i></div>
      <span class="quiz-count">${quiz.index + 1} / ${quiz.qids.length}</span>
      <span class="chip">${quiz.combo > 0 ? `🔥 连对 ${quiz.combo}` : '—'}</span>
    </div>
    <div class="quiz-card">
      <div class="quiz-meta">

        <span class="chip">第 ${l.num} 课 · ${l.title}</span>
        <span class="chip teal">${TYPE_LABEL[q.type]}</span>
        <span class="chip gold">${q.level === 1 ? '基础' : q.level === 2 ? '提升' : '综合'}</span>
        ${q.type === 'match' && quiz.matchMistakes > 0 ? `<span class="chip coral">失误 ${quiz.matchMistakes} 次</span>` : ''}
      </div>
      ${q.source ? `<div class="quiz-source">“${esc(q.source)}”<small>—— 材料选自教材相关史事</small></div>` : ''}
      <div class="quiz-stem-big">${esc(q.stem)}</div>
      ${bodyHTML}
      ${!quiz.checked ? `<div class="quiz-foot">
        <button class="hint-btn" id="hintBtn">${quiz.showHint ? '收起提示' : '💡 看提示'}</button>
        <span class="small muted">${quiz.mode === 'wrong' ? '错题重练：连续答对 2 次即掌握' : '答错会自动收进错题本'}</span>
      </div>` : ''}
      ${quiz.showHint && !quiz.checked ? `<div class="hint-box">${esc(hintText)}</div>` : ''}
      ${quiz.checked ? `<div class="feedback ${quiz.correct ? 'good' : 'bad'}">
        <div class="feedback-head">
          <span class="f-emoji">${quiz.correct ? '🌟' : '🧩'}</span>
          <span class="f-title">${quiz.correct ? '答对了！' : '这一步没走对，正好补上'}</span>
          <span class="xp-gain">${quiz.correct ? '+4 XP' : '已收进错题本'}</span>
        </div>
        <p class="feedback-answer"><b>正确答案：</b>${esc(answerText)}</p>
        <p>${esc(q.explain)}</p>
        <div class="solution"><b>知识点：</b>${esc(q.point)} · ${esc(l.core)}</div>
        <details class="knowledge-details"><summary>📘 展开知识卡回顾</summary><div class="knowledge-recap">${knowledgeRecapHTML(q)}</div></details>
      </div>
      <div class="quiz-foot">
        <span class="small muted">${quiz.index + 1 === quiz.qids.length ? '最后一题，加油' : '别急，想清楚再选'}</span>
        <button class="btn btn-primary" id="nextBtn">${quiz.index + 1 === quiz.qids.length ? '看结果 →' : '下一题 →'}</button>
      </div>` : ''}
    </div>
  </div></div>`;

  const quit = $('#quitQuiz');
  if (quit) quit.addEventListener('click', e => {
    e.preventDefault();
    if (quiz.answers.length && !confirm('退出后本轮成绩不会保存，确定退出吗？')) return;
    quiz = null; quizResult = null; location.hash = '#practice'; renderPractice();
  });
  if (q.type === 'choice') {
    $$('[data-opt]').forEach(btn => btn.addEventListener('click', () => {
      if (quiz.checked) return;
      const i = Number(btn.dataset.opt);
      quiz.selected = i;
      checkAnswer(i === q.answer, q);
    }));
  }
  if (q.type === 'fill') {
    const input = $('#fillInput');
    if (input) {
      input.addEventListener('input', () => { quiz.fillValue = input.value; });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submitFill(q); });
      input.focus();
    }
    const submit = $('#submitFill');
    if (submit) submit.addEventListener('click', () => submitFill(q));
  }
  if (q.type === 'order') {
    $$('[data-order-pick]').forEach(btn => btn.addEventListener('click', () => {
      if (quiz.checked) return;
      const idx = Number(btn.dataset.orderPick);
      quiz.orderPool = quiz.orderPool.filter(x => x !== idx);
      quiz.orderPicked.push(idx);
      renderQuiz();
    }));
    $$('[data-order-remove]').forEach(btn => btn.addEventListener('click', () => {
      if (quiz.checked) return;
      const pos = Number(btn.dataset.orderRemove);
      const [idx] = quiz.orderPicked.splice(pos, 1);
      if (idx !== undefined) quiz.orderPool.push(idx);
      renderQuiz();
    }));
    const so = $('#submitOrder');
    if (so) so.addEventListener('click', () => {

          checkAnswer(quiz.matchMistakes === 0, q);

  const nextBtn = $('#nextBtn');

}
function submitFill(q) {
  if (quiz.checked) return;
  const norm = s => String(s).toLowerCase().replace(/[\s，。、《》''""（）()·.,;；:：!！?？]/g, '');
  const val = norm(quiz.fillValue);
  if (!val) { toast('先写下你的答案。', '✍️'); return; }
  const ok = q.answer.some(a => norm(a) === val || val.includes(norm(a)));
  checkAnswer(ok, q);
}
function checkAnswer(ok, q) {
  quiz.checked = true;
  quiz.correct = ok;
  quiz.answers.push({ qid: q.id, ok });
  recordAnswer(q, ok, quiz.mode);
  if (ok) {
    quiz.combo += 1;
    state.bestCombo = Math.max(Number(state.bestCombo || 0), quiz.combo);
    quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo);
    if (quiz.mode === 'wrong' || quiz.mode === 'review') {
      markReviewCorrect(q.id);
      state.daily.reviewed += 1;
      addXP(2, '错题答对', true);
    } else {
      addXP(4, '答对一题', true);
    }
    playSound('correct');
  } else {
    quiz.combo = 0;
    const existing = state.wrong.find(w => w.qid === q.id);
    if (!existing) addWrong(q.id);
    else if (quiz.mode === 'review') { existing.rightStreak = 0; existing.status = 'todo'; existing.last = Date.now(); saveState(); }
    playSound('wrong');
  }
  saveState();
  renderQuiz();
  checkBadges();
}
function nextQuestion() {
  quiz.index += 1;
  quiz.preparedFor = '';
  if (quiz.index >= quiz.qids.length) finishQuiz();
  else renderQuiz();
}
function finishQuiz() {
  const okCount = quiz.answers.filter(a => a.ok).length;
  const total = quiz.answers.length;
  const acc = total ? Math.round(okCount / total * 100) : 0;
  const xpAtStart = quiz.xpStart;
  const bonus = 5 + (acc >= 80 ? 5 : 0);
  state.quizCount = Number(state.quizCount || 0) + 1;
  let newStars = 0, oldStars = 0;
  if (quiz.mode === 'unit' && quiz.unitId) {
    oldStars = campaignRecord(quiz.unitId).stars || 0;
    newStars = acc >= 90 ? 3 : acc >= 70 ? 2 : acc >= 50 ? 1 : 0;
    const rec = campaignRecord(quiz.unitId);
    state.campaign[quiz.unitId] = { stars: Math.max(oldStars, newStars), best: Math.max(rec.best || 0, acc) };
  }
  addXP(bonus, '完成一组练习', true);
  logActivity({ answered: 0, correct: 0 });
  saveState();
  quizResult = {
    mode: quiz.mode, title: quiz.title, total, okCount, acc, xp: state.xp - xpAtStart,
    maxCombo: quiz.maxCombo, answers: quiz.answers.slice(), newStars, oldStars, unitId: quiz.unitId
  };
  playSound(acc >= 60 ? 'level' : 'click');
  if (acc >= 80) burstConfetti(70);
  quiz = null;
  renderResult();
  checkBadges();
}
function renderResult() {
  const r = quizResult;
  const rank = r.acc >= 90 ? '🏆' : r.acc >= 70 ? '🎖' : r.acc >= 50 ? '📜' : '🌱';
  const title = r.acc >= 90 ? '太漂亮了，这一单元你过关了' : r.acc >= 70 ? '稳住了，再补一补就是满分' : r.acc >= 50 ? '过半了，错题正是提分点' : '没关系，先把知识卡读一遍';
  const wrongQids = r.answers.filter(a => !a.ok).map(a => a.qid);
  app.innerHTML = `<div class="page-wrap"><div class="result-page">
    <div class="result-hero">
      <div class="result-rank">${rank}</div>
      <h1>${title}</h1>
      <p>${esc(r.title)} · 本轮成绩已记录</p>
      <div class="result-score">
        <div class="rs-cell"><small>正确率</small><b>${r.acc}%</b></div>
        <div class="rs-cell"><small>答对</small><b>${r.okCount} / ${r.total}</b></div>
        <div class="rs-cell"><small>最高连击</small><b>${r.maxCombo}</b></div>
        <div class="rs-cell"><small>获得经验</small><b>+${r.xp}</b></div>
      </div>
      ${r.mode === 'unit' ? `<div style="position:relative;z-index:1;margin-top:16px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap">${starRowHTML(r.newStars)} <span style="font-size:12px;color:rgba(246,236,218,.7)">${r.newStars > r.oldStars ? '刷新了本单元战功星！' : r.oldStars ? '保持原有成绩' : '再练一次，冲击三星'}</span></div>` : ''}
    </div>
    <div class="result-grid">
      <div class="result-card"><b>${r.total}</b><span>本轮题数</span></div>
      <div class="result-card"><b>${r.okCount}</b><span>答对</span></div>
      <div class="result-card"><b>${r.total - r.okCount}</b><span>答错</span></div>
      <div class="result-card"><b>${wrongQids.length}</b><span>可重练</span></div>
    </div>
    <div class="card card-pad" style="margin-top:14px">
      <div class="eyebrow">REVIEW · 本轮回顾</div>
      <h3 style="margin:6px 0 8px;font-family:var(--serif);font-size:18px">错题是最好的复习清单</h3>
      <div class="review-list">
        ${r.answers.map(a => {
          const q = qById(a.qid);
          return `<div class="review-item ${a.ok ? 'ok' : 'no'}">
            <span class="ri-mark">${a.ok ? '✓' : '✕'}</span>
            <div><b>${esc(q.stem)}</b><span>${esc(q.type === 'choice' ? q.options[q.answer] : q.type === 'fill' ? q.answer[0] : q.explain)}</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      ${wrongQids.length ? `<button class="btn btn-coral" id="retryWrong">重练本轮错题（${wrongQids.length}）</button>` : ''}
      <a class="btn btn-primary" href="#practice">再来一组</a>
      <a class="btn btn-ghost" href="#unit/${r.unitId || practiceUnit}/knowledge">回单元复习</a>
      <a class="btn btn-ghost" href="#wrong">打开错题本</a>
    </div>
  </div></div>`;
  const retry = $('#retryWrong');
  if (retry) retry.addEventListener('click', () => startQuiz({ qids: wrongQids, mode: 'review', title: '重练本轮错题' }));
  quizResult = null;
}

   视图 · 错题本
   ============================================================ */
let wrongFilter = 'todo';
function renderWrong() {
  const all = state.wrong.slice().sort((a, b) => (b.last || 0) - (a.last || 0));
  const todo = all.filter(w => w.status !== 'mastered');
  const mastered = all.filter(w => w.status === 'mastered');
  const list = wrongFilter === 'all' ? all : wrongFilter === 'mastered' ? mastered : todo;

  app.innerHTML = `<div class="page-wrap">
    <div class="practice-head">
      <div>
        <div class="eyebrow">ERROR BOOK · 错题本</div>
        <h1>错题不是敌人，是地图。</h1>
        <p>每一道错题都暴露了一个知识缺口。连续答对 2 次，它就会自动盖上“已掌握”的章。</p>
      </div>
      <div class="btn-row">
        ${todo.length ? `<button class="btn btn-coral" id="reviewAll">重练全部待复习（${todo.length}）</button>` : ''}
        <a class="btn btn-ghost" href="#practice">去闯关</a>
      </div>
    </div>

    <div class="stat-strip" style="margin-top:18px">
      <div class="stat-box"><span class="stat-ico">🩹</span><div><b>${todo.length}</b><span>待复习</span></div></div>
      <div class="stat-box"><span class="stat-ico">✓</span><div><b>${mastered.length}</b><span>已掌握</span></div></div>
      <div class="stat-box"><span class="stat-ico">📚</span><div><b>${all.length}</b><span>累计错题</span></div></div>
      <div class="stat-box"><span class="stat-ico">🎯</span><div><b>${overallStats().accuracy === null ? '—' : overallStats().accuracy + '%'}</b><span>整体正确率</span></div></div>
    </div>

    <div class="volume-bar" style="margin-top:18px" id="wrongFilters">
      <button data-wrong-filter="todo" class="${wrongFilter === 'todo' ? 'active' : ''}">待复习 ${todo.length}</button>
      <button data-wrong-filter="mastered" class="${wrongFilter === 'mastered' ? 'active' : ''}">已掌握 ${mastered.length}</button>
      <button data-wrong-filter="all" class="${wrongFilter === 'all' ? 'active' : ''}">全部 ${all.length}</button>
    </div>

    ${list.length ? `<div class="wrong-list">${list.map(w => {
      const q = qById(w.qid);
      if (!q) return '';
      const u = unitById(q.unit), l = lessonById(q.lesson);
      return `<div class="wrong-card ${w.status === 'mastered' ? 'mastered' : ''}">
        <div class="wrong-meta">
          <span class="chip red">${volumeById(u.volume)?.short || ''} · 第 ${u.num} 单元</span>
          <span class="chip">第 ${l.num} 课 · ${l.title}</span>
          <span class="chip gold">${w.status === 'mastered' ? '✓ 已掌握' : '待复习'}</span>
          <span class="small muted">答错 ${w.wrongCount} 次 · 连续答对 ${w.rightStreak || 0} 次</span>
        </div>
        <div class="wrong-stem">${esc(q.stem)}</div>
        <div class="wrong-answer"><b>正确答案：</b>${esc(q.type === 'choice' ? q.options[q.answer] : q.type === 'fill' ? q.answer[0] : q.explain)}</div>
        <div class="wrong-actions">
          <button class="btn btn-sm btn-primary" data-wrong-review="${q.id}">重练这题</button>
          <button class="btn btn-sm btn-ghost" data-wrong-explain="${q.id}">看解析</button>
          ${w.status === 'mastered' ? `<button class="btn btn-sm btn-ghost" data-wrong-reset="${q.id}">标记为待复习</button>` : ''}
          <button class="btn btn-sm btn-ghost" data-wrong-remove="${q.id}">移出错题本</button>
        </div>
      </div>`;
    }).join('')}</div>` : `<div class="empty-state"><div class="es-ico">🪹</div><h3>${wrongFilter === 'todo' ? '没有待复习的错题' : wrongFilter === 'mastered' ? '还没有掌握的错题' : '错题本还是空的'}</h3><p>${wrongFilter === 'todo' ? '保持下去！也可以去闯关找几道新题练练。' : '去闯关，答错的题会自动来到这里。'}</p><a class="btn btn-primary" href="#practice">开始闯关 →</a></div>`}
  </div>`;

  $('#wrongFilters').addEventListener('click', e => {
    const b = e.target.closest('[data-wrong-filter]');
    if (!b) return;
    wrongFilter = b.dataset.wrongFilter;
    renderWrong();
  });
  const reviewAll = $('#reviewAll');
  if (reviewAll) reviewAll.addEventListener('click', () => startQuiz({ mode: 'wrong', title: '错题重练' }));
  $$('[data-wrong-review]').forEach(b => b.addEventListener('click', () => startQuiz({ qids: [b.dataset.wrongReview], mode: 'review', title: '重练一题' })));
  $$('[data-wrong-explain]').forEach(b => b.addEventListener('click', () => {
    const q = qById(b.dataset.wrongExplain);
    openModal({
      title: q.point,
      body: `<p style="color:var(--ink)">${esc(q.stem)}</p>
        <p><b>正确答案：</b>${esc(q.type === 'choice' ? q.options[q.answer] : q.type === 'fill' ? q.answer[0] : q.explain)}</p>
        <p><b>解析：</b>${esc(q.explain)}</p>
        <p class="small"><a href="#unit/${q.unit}/knowledge" onclick="closeModal()" style="color:var(--teal);font-weight:600">回看第 ${q.lesson ? lessonById(q.lesson).num : ''} 课知识卡 →</a></p>`,
      actions: [{ text: '知道了', primary: true }]
    });
  }));
  $$('[data-wrong-remove]').forEach(b => b.addEventListener('click', () => {
    state.wrong = state.wrong.filter(w => w.qid !== b.dataset.wrongRemove);
    saveState();
    toast('已移出错题本。', '🧹');
    renderWrong();
  }));
  $$('[data-wrong-reset]').forEach(b => b.addEventListener('click', () => {
    const w = state.wrong.find(x => x.qid === b.dataset.wrongReset);
    if (w) { w.status = 'todo'; w.rightStreak = 0; saveState(); renderWrong(); }
  }));
}

function last7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const row = state.log.find(r => r.date === key) || { xp: 0, answered: 0, correct: 0 };
    days.push({ key, label: `${d.getMonth() + 1}/${d.getDate()}`, xp: row.xp || 0, answered: row.answered || 0 });
  }
  return days;
}
function adviceList() {
  const os = overallStats();
  const out = [];
  if (os.attempts < 5) out.push('先完成 1—2 组闯关（每组 5—8 题），系统才能看出薄弱的环节。');
  else if (os.accuracy !== null && os.accuracy < 60) out.push('正确率还不到 60%：先回到知识卡，把“时间、人物、事件、影响”四要素读全，再做题。');
  else if (os.accuracy !== null && os.accuracy >= 85) out.push('正确率很稳。可以尝试“史料研读”和“时序专题”，把记忆升级为理解。');
  if (os.learned / LESSONS.length < 0.3) out.push('知识卡只读了不到三成，建议按单元顺序推进，每天 1—2 张。');
  if (os.todo > 5) out.push(`错题本还有 ${os.todo} 道待复习，用“错题重练”每天清 3 道，连续答对 2 次即可掌握。`);
  if (state.streak < 3) out.push('连续学习天数还短，固定一个时间段（如晚饭后 20 分钟）更容易养成习惯。');
  const weak = UNITS.map(u => ({ u, st: unitStats(u) })).filter(x => x.st.attempts >= 3 && x.st.accuracy !== null && x.st.accuracy < 65).slice(0, 2);
  if (weak.length) out.push('薄弱单元：' + weak.map(x => `${volumeById(x.u.volume)?.short || ''}第 ${x.u.num} 单元「${x.u.short}」`).join('、') + '，建议先看该单元的“时空坐标”，再重做错题。');
  if (!out.length) out.push('节奏保持得不错。下一步可以挑战每单元的三星评价，或者阅读专题页做跨课整合。');
  return out;
}
function renderReport() {

  const days = last7Days();
  const maxXp = Math.max(10, ...days.map(d => d.xp));
  const weak = UNITS.map(u => ({ u, st: unitStats(u) })).filter(x => x.st.learned > 0 || x.st.attempts > 0);

  app.innerHTML = `<div class="page-wrap">
    <div class="practice-head">
      <div>
        <div class="eyebrow">PARENT REPORT · 学习报告</div>
        <h1>这段时间，孩子学得怎么样？</h1>
        <p>${esc(pName())} · 数据统计自本机浏览器 · 生成时间 ${new Date().toLocaleString('zh-CN')}</p>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="printReport">打印 / 保存为 PDF</button>
        <a class="btn btn-ghost" href="#achievements">看成长档案</a>
      </div>
    </div>

    <div class="report-summary">
      <div class="stat-box"><span class="stat-ico">⚡</span><div><b>${state.xp}</b><span>累计成长值</span></div></div>
      <div class="stat-box"><span class="stat-ico">🕯</span><div><b>${state.streak} 天</b><span>连续学习</span></div></div>
      <div class="stat-box"><span class="stat-ico">📖</span><div><b>${os.learned}/${os.totalK}</b><span>知识卡</span></div></div>
      <div class="stat-box"><span class="stat-ico">🎯</span><div><b>${os.accuracy === null ? '—' : os.accuracy + '%'}</b><span>正确率</span></div></div>
    </div>

    <section class="report-panel">
      <h3>一、学习投入</h3>
      <div class="bar-row"><span class="br-label">累计答题</span><div class="progress"><i style="width:${Math.min(100, os.attempts)}%"></i></div><span class="br-val">${os.attempts} 道</span></div>
      <div class="bar-row"><span class="br-label">完成闯关组数</span><div class="progress"><i style="width:${Math.min(100, state.quizCount * 8)}%"></i></div><span class="br-val">${state.quizCount} 组</span></div>
      <div class="bar-row"><span class="br-label">互动实验</span><div class="progress"><i style="width:${state.explored.length / Math.max(1, LABS.length) * 100}%"></i></div><span class="br-val">${state.explored.length} / ${LABS.length}</span></div>
      <div class="bar-row"><span class="br-label">战功星</span><div class="progress"><i style="width:${cp.progress}%"></i></div><span class="br-val">${cp.stars} / ${cp.max}</span></div>
    </section>

    <section class="report-panel">
      <h3>二、最近七天的学习节奏</h3>
      <div class="week-bars">
        ${days.map(d => `<div class="week-bar"><b>${d.xp || ''}</b><i style="height:${Math.max(3, d.xp / maxXp * 100)}%;background:${d.key === todayKey() ? 'var(--red)' : 'var(--teal)'}"></i><span>${d.label}</span></div>`).join('')}
      </div>
      <p class="small muted" style="margin:8px 0 0">柱子高度代表当天获得的成长值（XP），红色是今天。</p>
    </section>

    <section class="report-panel">
      <h3>三、各单元掌握情况</h3>
      ${weak.length ? weak.map(({ u, st }) => `<div class="bar-row">
        <span class="br-label">${volumeById(u.volume)?.short || ''} · 第 ${u.num} 单元</span>
        <div class="progress"><i style="width:${st.progress}%;background:${u.accent}"></i></div>
        <span class="br-val">${st.progress}%</span>
      </div>`).join('') : '<p class="muted">还没有开始学习，先从一个单元的第一张知识卡开始吧。</p>'}
      <p class="small muted" style="margin:10px 0 0">完成度 = 知识卡阅读（55%）+ 单元题目答对（45%）。</p>
    </section>

    <section class="report-panel">
      <h3>四、知识薄弱点</h3>
      ${(() => {
        const rows = UNITS.map(u => {
          const qs = unitQuestions(u.id);
          let attempts = 0, right = 0;
          qs.forEach(q => { const a = state.answers[q.id]; if (a) { attempts += (a.right || 0) + (a.wrong || 0); right += a.right || 0; } });
          return { u, attempts, acc: attempts ? Math.round(right / attempts * 100) : null };
        }).filter(x => x.attempts >= 2).sort((a, b) => (a.acc || 0) - (b.acc || 0)).slice(0, 3);
        if (!rows.length) return '<p class="muted">答题量还不够，做一组闯关后再来看这里。</p>';
        return `<ul style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.9;color:var(--ink-soft)">${rows.map(r => `<li><b>第 ${r.u.num} 单元「${r.u.short}」</b>：正确率 ${r.acc}%（${r.attempts} 次作答）</li>`).join('')}</ul>`;
      })()}
    </section>

    <section class="report-panel report-advice">
      <h3>五、给家长和孩子的建议</h3>
      <ul>${adviceList().map(a => `<li>${a}</li>`).join('')}</ul>
    </section>

    <section class="report-panel">
      <h3>六、本周可以这样做</h3>
      <p style="font-size:12.5px;line-height:1.9;color:var(--ink-soft);margin:0">
        1. 每天 20—30 分钟：读 1 张知识卡 + 做 5 道题；<br>
        2. 周末用 15 分钟看“时空坐标”，把本周事件串成一条线；<br>
        3. 错题不要抄答案，先说出“错在哪一步”，再重练；<br>
        4. 鼓励孩子当“小老师”，把一课讲给您听——能讲清楚，才是真掌握。
      </p>
    </section>

    <p class="small muted" style="margin-top:16px">说明：本报告由浏览器本地数据自动生成，不上传任何服务器。清除浏览器数据会导致记录丢失，建议定期在“成长档案”中导出备份。</p>
  </div>`;

  $('#printReport').addEventListener('click', () => window.print());
}

function timelineHTML() {
  const vols = timelineFilter === 'all' ? VOLUMES : [volumeById(timelineFilter)].filter(Boolean);
  const total = TIMELINE.length;
  return `<div class="filter-bar" id="timelineFilters">
      <button data-timeline-volume="all" class="${timelineFilter === 'all' ? 'active' : ''}">全部</button>
      ${VOLUMES.map(v => `<button data-timeline-volume="${v.id}" class="${timelineFilter === v.id ? 'active' : ''}">${v.icon} ${v.short}</button>`).join('')}
    </div>
    <div class="card card-pad" style="margin-bottom:18px">
      <p class="small" style="margin:0;color:var(--ink-soft);line-height:1.8"><b>使用方法：</b>先按分册筛选，再遮住事件描述只看年份，练习“看到年份，想起事件”；最后合上页面，用一张纸默写这一册的关键节点。全站共收 ${total} 条大事。</p>
    </div>
    ${vols.map(v => {
      const units = volumeUnits(v.id).filter(u => TIMELINE.some(e => e.unit === u.id));
      if (!units.length) return `<section class="era-block"><div class="era-head"><h3>${v.name}</h3><span>${v.era}</span></div><p class="small muted">这一册的年表正在整理中。</p></section>`;
      return `<section class="era-block">
        <div class="era-head"><h3>${v.icon} ${v.name}</h3><span>${v.era} · ${v.short}</span></div>
        ${units.map(u => {
          const list = TIMELINE.filter(e => e.unit === u.id).sort((a, b) => a.y - b.y);
          return `<div class="tl-unit">
            <div class="tl-unit-head"><b>第 ${u.num} 单元 · ${u.title}</b><span>${u.years}</span></div>
            <div class="era-events">
              ${list.map(e => `<div class="era-event" style="--accent:${u.accent}">
                <b>${e.t}</b>
                <p>${e.text}</p>
              </div>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </section>`;
    }).join('')}`;
}
function bindTimeline() {
  $('#timelineFilters').addEventListener('click', e => {

}

  app.innerHTML = `<div class="page-wrap topic-detail">
    <div style="margin-bottom:12px"><a class="text-link" href="#guide/topics">← 返回专题速查</a></div>

      <thead><tr>${t.table.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${t.table.rows.map(r => `<tr>${r.map((c, i) => `<td>${i === 0 ? '<b>' + c + '</b>' : c}</td>`).join('')}</tr>`).join('')}</tbody>

    <section class="topic-section">
      <h3>中考常见考法</h3>
      <div class="exam-row" style="margin-top:6px">${t.exam.map(e => `<span class="exam-tag">${e}</span>`).join('')}</div>
    </section>
    <div class="time-links" style="margin-top:22px">
      <button class="btn btn-primary" id="topicQuiz">做一组综合题 →</button>

      <a class="btn btn-ghost" href="#courses">回课程地图</a>
    </div>
  </div>`;
  $('#topicQuiz').addEventListener('click', () => {
    const fixed = id === 't1' ? ['qu1-1', 'q1-2', 'q2-2', 'q5-2', 'q7-2', 'qu1-2']
      : id === 't2' ? ['qu2-1', 'q4-2', 'q6-3', 'q9-2', 'q12-2', 'qu2-3']
        : id === 't3' ? ['q15-1', 'q15-4', 'q18-2', 'qu5-1', 'qu6-1', 'qu7-1']
          : id === 't4' ? ['q18-1', 'q19-1', 'q19-2', 'q20-1', 'q21-1', 'q22-3']
            : id === 't5' ? ['q25-1', 'q25-2', 'q25-3', 'qu8-1', 'qu8-2', 'q26-2']
              : id === 't6' ? ['qx-1', 'qx-2', 'qx-3', 'qx-4', 'qx-5', 'qx-6'] : null;
    let pool = fixed;
    if (!pool) {
      const vols = ['t7', 't8', 't9', 't10'].includes(id) ? ['v1', 'v2']
        : ['t11', 't12', 't13'].includes(id) ? ['v5', 'v6'] : ['v1', 'v2', 'v3', 'v4', 'v5', 'v6'];
      pool = shuffle(QUESTIONS.filter(q => vols.includes(unitById(q.unit)?.volume)).map(q => q.id)).slice(0, 8);
    }
    startQuiz({ qids: pool.filter(x => qById(x)), mode: 'review', title: `专题 · ${t.title}` });
  });
}

const GROUP_FIGURE = /(人|阶级|阶层|军|联军|同盟|轴心|政府|组织|国家|帝国|王朝|社会|民族|工人|农民|市民|贵族|地主|资产阶级|无产阶级|国际联盟|联合国|志愿军|新四军|八路军|解放军|红军|北伐军|日军|美军|苏军|英军|法军|八国联军|远征军|中国人民|世界人民|农奴|奴隶|平民|公民|居民|师生|骑士|教士|僧侣|武士|士兵|商人|领主|工匠|殖民者)$/;
const FEMALE_FIGURE = /武则天|慈禧|太后|皇后|公主|女皇|宋庆龄|何香凝|秋瑾|向警予|赵一曼|江竹筠|卓娅|居里夫人|维多利亚|伊丽莎白|章西女王/;

function figHash(str) {
  let h = 2166136261;
  for (let i = 0; i < String(str).length; i++) {
    h ^= String(str).charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}
function figPick(arr, seed) { return arr[seed % arr.length]; }

function figureLook(name, role, volume) {
  const v = volumeById(volume) || VOLUMES[0];
  const base = String(name || '').replace(/[（(].*$/, '');
  const curated = FIGURE_LOOKS[name] || FIGURE_LOOKS[base] || {};
  const text = `${name} ${role || ''}`;
  const seed = figHash(text);
  const group = GROUP_FIGURE.test(String(name || ''));
  const female = curated.female !== undefined ? curated.female : FEMALE_FIGURE.test(text);
  const modern = volume === 'v3' || volume === 'v4' || volume === 'v6';
  const ancient = volume === 'v1' || volume === 'v2' || volume === 'v5';

  let hat = curated.hat;
  if (!hat) {
    if (/皇帝|帝王|大汗|可汗|法老|沙皇|国王|女王|天皇|帝$|王$/.test(String(name || '')) || /皇帝|大汗|可汗|法老|沙皇|国王|女王|天皇/.test(role || '')) hat = 'crown';
    else if (/太后|皇后|公主|女皇/.test(text)) hat = 'bun';
    else if (/将军|将领|元帅|司令|军长|舰长|提督|总兵|英雄|烈士|指挥|统帅/.test(text)) hat = ancient ? 'helmet' : 'military';
    else if (/思想家|教育家|学者|诗人|文学家|作家|画家|音乐家|科学家|史学家|哲学家|翻译家|改革家/.test(text)) hat = 'scholar';
    else if (/总统|主席|总理|书记|革命家|政治家|外交家|领导人|总书记/.test(text)) hat = 'modern';
    else if (/僧人|法师|传教士|宗教|教士/.test(text)) hat = 'monk';
    else if (/航海家|探险家|殖民者/.test(text)) hat = 'tricorne';
    else hat = ancient ? figPick(['scholar', 'official', 'none', 'straw'], seed) : figPick(['modern', 'modern', 'none'], seed);
  }

  const palettes = {
    v1: ['#6B7A8F', '#8A6A3A', '#7D5B45', '#5E6B5A', '#8C5A3C'],
    v2: ['#7E5B8C', '#6B5A8A', '#8A4A3A', '#4F6B5A', '#8A7A4A'],
    v3: ['#3A5D7E', '#5A4A3A', '#2F6C60', '#7E4A63', '#6B4A3A'],
    v4: ['#B5482F', '#3A5D7E', '#4F7A46', '#6A5A8C', '#8A6A3A'],
    v5: ['#3A5D7E', '#6B5A8A', '#8A4A3A', '#4F6B5A', '#7A5A3A'],
    v6: ['#2F6C60', '#3A5D7E', '#6A5A8C', '#B5482F', '#4F7A46']
  };
  const skins = (volume === 'v5' || volume === 'v6')
    ? ['#F2D3B3', '#E8C39E', '#D9A97F', '#C68B5E', '#B57A52', '#8D5A3B']
    : ['#F6E1C8', '#F1D5B8', '#EBC9A8', '#E2BA94'];
  const hairColors = ['#2A241E', '#3A2A1E', '#241F1A', '#4A3A2A'];
  const old = curated.old !== undefined ? curated.old : seed % 11 === 0;

  let beard = curated.beard;
  if (beard === undefined) {
    if (female) beard = 'none';
    else if (ancient) beard = figPick(['short', 'long', 'none', 'short', 'mustache'], seed);
    else beard = figPick(['none', 'none', 'mustache', 'short'], seed);
  }
  let hair = curated.hair || (female ? 'long' : figPick(['short', 'short', 'short', 'side'], seed));
  const bald = curated.bald !== undefined ? curated.bald : (hat === 'monk');
  const glasses = curated.glasses !== undefined
    ? curated.glasses
    : (modern && /科学家|学者|思想家|教育家|作家|文学家|工程师|物理学家|化学家|数学家/.test(text) && seed % 3 === 0);
  const wig = !!curated.wig;
  if (wig) hair = 'curly';

  return {
    name,
    group,
    female,
    skin: curated.skin || figPick(skins, seed),
    robe: curated.robe || figPick(palettes[volume] || palettes.v3, seed),
    accent: curated.accent || v.accent,
    bg: v.soft,
    hat,
    beard,
    hair,
    bald,
    glasses,
    old,
    hairColor: wig ? '#E8E0D2' : (old ? '#6B6257' : figPick(hairColors, seed)),
    accessory: curated.accessory || 'none'
  };
}

function labById(id) { return LABS.find(l => l.id === id) || LABS[0]; }
function mountLab(id, canvas, controls, readouts) {
  canvas.innerHTML = ''; controls.innerHTML = ''; readouts.innerHTML = '';
  const fn = LAB_MOUNTS[id];
  if (!fn) { canvas.innerHTML = '<div style="padding:60px;text-align:center;color:#7C7263">实验准备中…</div>'; return; }
  return fn(canvas, controls, readouts) || null;
}
function readoutHTML(items) {
  return items.map(it => `<div class="ro-box ${it.accent ? 'accent' : ''}"><small>${it.label}</small><b id="${it.id}">${it.value || '—'}</b></div>`).join('');
}
function setRO(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }

const LAB_MOUNTS = {};

/* ---------- 实验一：时光轴 ---------- */
LAB_MOUNTS.timeline = (canvas, controls, readouts) => {
  const ac = new AbortController();
  let vol = volumeById(state.lastVolume)?.id || 'v1';
  let idx = 0;
  const eventsOf = v => TIMELINE
    .filter(e => (e.volume || unitById(e.unit)?.volume) === v)
    .sort((a, b) => a.y - b.y);
  let events = eventsOf(vol);

  const paint = () => {
    const v = volumeById(vol);
    if (!events.length) {
      canvas.innerHTML = `<div style="padding:60px;text-align:center;color:#7C7263">${v ? v.name : ''}的年表正在整理中，先看看其他分册。</div>`;
      setRO('tlVol', v ? v.short : '—');
      setRO('tlNow', '—');
      setRO('tlIndex', '0 / 0');
      return;
    }
    idx = clamp(idx, 0, events.length - 1);
    const W = 900, H = 320, L = 64, R = 836, AXIS = 196;
    const n = events.length;
    const xOf = i => n === 1 ? 450 : L + i * (R - L) / (n - 1);
    const active = events[idx];
    const unit = unitById(active.unit);
    const dots = events.map((e, i) => {
      const on = i === idx;
      return `<circle cx="${xOf(i).toFixed(1)}" cy="${AXIS}" r="${on ? 7 : 3.4}" fill="${on ? '#B23A2C' : (unitById(e.unit)?.accent || '#7C7263')}" opacity="${on ? 1 : .4}"><title>${esc(e.t + ' ' + e.text)}</title></circle>
        ${on ? `<line x1="${xOf(i).toFixed(1)}" y1="70" x2="${xOf(i).toFixed(1)}" y2="${AXIS}" stroke="#B23A2C" stroke-width="1.4" stroke-dasharray="3 3" opacity=".55"/>` : ''}`;
    }).join('');
    const step = Math.ceil(n / 8);
    const labels = events.map((e, i) => {
      if (i % step !== 0 && i !== idx) return '';
      const x = xOf(i);
      return `<text x="${x}" y="228" text-anchor="end" font-size="9.5" fill="${i === idx ? '#B23A2C' : '#7C7263'}" transform="rotate(-38 ${x} 228)">${esc(e.t)}</text>`;
    }).join('');
    const labelW = 150;
    const lx = clamp(xOf(idx) - labelW / 2, 8, W - labelW - 8);
    canvas.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((v?.name || '') + '时光轴')}">
      <line x1="${L}" y1="${AXIS}" x2="${R}" y2="${AXIS}" stroke="#211D18" stroke-width="2"/>
      ${dots}${labels}
      <rect x="${lx}" y="16" width="${labelW}" height="44" rx="8" fill="#FFFDF8" stroke="#E4D8C3"/>
      <text x="${lx + labelW / 2}" y="35" text-anchor="middle" font-size="11" fill="#B23A2C" font-weight="700">${esc(active.t)}</text>
      <text x="${lx + labelW / 2}" y="50" text-anchor="middle" font-size="9.5" fill="#7C7263">第 ${idx + 1} / ${n} 条</text>
    </svg>
    <div class="lab-year-events">
      <div class="lye-head">${v?.name || ''} · ${esc(active.t)} · 共 ${n} 条年表</div>
      <div class="lye"><span class="chip" style="background:${unit?.soft || '#F8E5DF'};color:${unit?.accent || '#B23A2C'}">${esc(active.tag || '大事')}</span><b>${esc(active.t)}</b><span>${esc(active.text)}</span></div>
      <div class="small muted" style="margin-top:6px">所属：第 ${unit?.num || '?'} 单元 · ${esc(unit?.title || '')}</div>
    </div>`;
    setRO('tlVol', v?.short || '—');
    setRO('tlNow', active.t);
    setRO('tlIndex', `${idx + 1} / ${n}`);
    const range = $('#tlRange');
    if (range) { range.max = Math.max(0, n - 1); range.value = idx; }
    const lab = $('#tlSliderLabel');
    if (lab) lab.textContent = `${n} 条`;
  };

  const volButtons = () => VOLUMES.map(v => `<button data-tl-vol="${v.id}" class="${v.id === vol ? 'active' : ''}">${v.icon} ${v.short}</button>`).join('');
  controls.innerHTML = `<div class="control-row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="seg-tabs" id="tlVols">${volButtons()}</div>
    <div class="control-row"><label class="small muted" for="tlRange">拖动时间轴</label><input id="tlRange" type="range" min="0" max="${Math.max(0, events.length - 1)}" step="1" value="0" aria-label="选择年表条目"><span class="small muted" id="tlSliderLabel">${events.length} 条</span></div>
  </div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'tlVol', label: '当前分册', value: volumeById(vol)?.short || '—' },
    { id: 'tlNow', label: '所在时间', value: '—', accent: true },
    { id: 'tlIndex', label: '年表进度', value: `0 / ${events.length}` }
  ]);
  $('#tlVols').addEventListener('click', e => {
    const b = e.target.closest('[data-tl-vol]');
    if (!b) return;
    vol = b.dataset.tlVol;
    events = eventsOf(vol);
    idx = 0;
    $$('#tlVols button').forEach(x => x.classList.toggle('active', x === b));
    const range = $('#tlRange');
    if (range) { range.max = Math.max(0, events.length - 1); range.value = 0; }
    const lab = $('#tlSliderLabel');
    if (lab) lab.textContent = `${events.length} 条`;
    paint();
  }, { signal: ac.signal });
  $('#tlRange').addEventListener('input', e => { idx = Number(e.target.value); paint(); }, { signal: ac.signal });
  paint();
  return () => ac.abort();
};

/* ---------- 实验二：条约对比 ---------- */
LAB_MOUNTS.treaty = (canvas, controls, readouts) => {
  const ac = new AbortController();
  let left = 'nanking', right = 'xinchou';
  const dotRow = n => `<span class="danger-dots">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
  const col = t => `<div class="treaty-col">
    <div class="treaty-col-head"><span>${t.year}</span><b>${t.name}</b></div>
    <div class="treaty-row"><small>战争</small><span>${t.war}</span></div>
    <div class="treaty-row"><small>割地</small><span>${t.land}</span></div>
    <div class="treaty-row"><small>赔款</small><span>${t.money}</span></div>
    <div class="treaty-row"><small>通商</small><span>${t.ports}</span></div>
    <div class="treaty-row"><small>特权</small><span>${t.privilege}</span></div>
    <div class="treaty-row"><small>影响</small><span>${t.impact}</span></div>
    <div class="treaty-danger"><small>半殖民地化程度</small>${dotRow(t.danger)}</div>
  </div>`;
  const paint = () => {
    const a = TREATIES.find(t => t.id === left), b = TREATIES.find(t => t.id === right);
    canvas.innerHTML = `<div class="treaty-compare">${col(a)}<div class="treaty-vs">VS</div>${col(b)}</div>
      <div class="treaty-summary">两份条约相隔 <b>${Math.abs(Number(b.year.split(' ')[0]) - Number(a.year.split(' ')[0]))}</b> 年。从「${a.impact.slice(0, 12)}…」到「${b.impact.slice(0, 12)}…」，中国的主权一步步丧失。</div>`;
    setRO('trLeft', a.name.replace(/《|》/g, ''));
    setRO('trRight', b.name.replace(/《|》/g, ''));
    setRO('trDanger', `${a.danger} → ${b.danger} 级`);
  };
  const opts = list => TREATIES.map(t => `<button data-treaty="${t.id}" class="${list === t.id ? 'active' : ''}">${t.name.replace(/《|》/g, '')}</button>`).join('');
  controls.innerHTML = `<div class="control-row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="seg-line"><span class="small muted">左：</span><span class="seg-tabs" id="treatyLeft">${opts(left)}</span></div>
    <div class="seg-line"><span class="small muted">右：</span><span class="seg-tabs" id="treatyRight">${opts(right)}</span></div>
  </div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'trLeft', label: '左侧条约', value: '南京条约' },
    { id: 'trRight', label: '右侧条约', value: '辛丑条约' },
    { id: 'trDanger', label: '危险指数', value: '2 → 5 级', accent: true }
  ]);
  const bind = (wrapId, side) => {
    $(`#${wrapId}`).addEventListener('click', e => {
      const b = e.target.closest('[data-treaty]');
      if (!b) return;
      if (side === 'left') left = b.dataset.treaty; else right = b.dataset.treaty;
      $$(`#${wrapId} button`).forEach(x => x.classList.toggle('active', x.dataset.treaty === b.dataset.treaty));
      paint();
    }, { signal: ac.signal });
  };
  bind('treatyLeft', 'left'); bind('treatyRight', 'right');
  paint();
  return () => ac.abort();
};

  };

      <rect width="640" height="420" fill="#F7EFDD"/>
      <path d="M 40 340 C 160 300 200 360 300 330 C 420 300 520 340 610 300" fill="none" stroke="#C9DCCB" stroke-width="40" opacity=".5"/>
      <polyline points="${points}" fill="none" stroke="#E4D8C3" stroke-width="3.5" stroke-dasharray="5 6"/>
      ${MARCH.map((m, i) => `<g>
        ${i <= step ? `<polyline points="${MARCH.slice(Math.max(0, i - 1), i + 1).map(x => `${x.x},${x.y}`).join(' ')}" fill="none" stroke="#B23A2C" stroke-width="3.5" stroke-linecap="round"/>` : ''}
        <circle cx="${m.x}" cy="${m.y}" r="${i === step ? 8 : 5}" fill="${i === step ? '#B23A2C' : i < step ? '#B48833' : '#fff'}" stroke="${i <= step ? '#B23A2C' : '#C9B99C'}" stroke-width="2"/>

        <text x="${m.x + 11}" y="${m.y + 17}" font-size="9" fill="#7C7263">${m.year}</text>

    <div class="map-caption"><b>第 ${step + 1} 站 · ${MARCH[step].name}（${MARCH[step].year}）</b><br>${MARCH[step].d}</div>`;
  };
  const paint = () => {
    canvas.innerHTML = mode === 'ports' ? portsSVG() : marchSVG();
    if (mode === 'ports') {
      const cur = PORT_STOPS[stop];
      const shown = PORTS.filter(p => p.year <= cur.year);

    r.addEventListener('input', () => {
      const v = Number(r.value);

      else { step = v; $('#mapStopLabel').textContent = MARCH[v].name; }
      paint();
    }, { signal: ac.signal });
  };
  bindRange();
  paint();
  return () => ac.abort();
};

/* ---------- 实验四：因果多米诺 ---------- */
LAB_MOUNTS.cause = (canvas, controls, readouts) => {
  const ac = new AbortController();
  let chainId = 'opium', revealed = 1;
  const paint = () => {
    const chain = CHAINS.find(c => c.id === chainId);
    canvas.innerHTML = `<div class="domino-wrap">
      ${chain.steps.map((s, i) => `<div class="domino ${i < revealed ? 'revealed' : ''} ${i === revealed - 1 ? 'last' : ''}">
        <span class="domino-n">${i + 1}</span>
        <span class="domino-t">${i < revealed ? s : '？'}</span>
      </div>${i < chain.steps.length - 1 ? '<span class="domino-arrow">→</span>' : ''}`).join('')}
    </div>
    <div class="domino-note">${revealed >= chain.steps.length ? '<b>链式反应完成。</b>历史的因果不是单线的，但把关键环节串起来，就能看清“为什么会走到这一步”。' : '点击“推倒下一张”，看看这一步会引发出什么。'}</div>`;
    setRO('czChain', chain.title);
    setRO('czStep', `${revealed} / ${chain.steps.length} 环`);
  };
  controls.innerHTML = `<div class="control-row" style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="seg-tabs" id="chainTabs">${CHAINS.map(c => `<button data-chain="${c.id}" class="${c.id === chainId ? 'active' : ''}">${c.short}</button>`).join('')}</div>
    <div class="control-row"><button class="btn btn-primary btn-sm" id="pushDomino">推倒下一张 →</button><button class="btn btn-ghost btn-sm" id="resetDomino">重来</button><span class="small muted">共 ${CHAINS.find(c => c.id === chainId).steps.length} 环</span></div>
  </div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'czChain', label: '当前因果链', value: '从虎门销烟到近代化探索', accent: true },
    { id: 'czStep', label: '推演进度', value: '1 / 5 环' }
  ]);
  $('#chainTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-chain]');
    if (!b) return;
    chainId = b.dataset.chain;
    revealed = 1;
    controls.innerHTML = `<div class="control-row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div class="seg-tabs" id="chainTabs">${CHAINS.map(c => `<button data-chain="${c.id}" class="${c.id === chainId ? 'active' : ''}">${c.short}</button>`).join('')}</div>
      <div class="control-row"><button class="btn btn-primary btn-sm" id="pushDomino">推倒下一张 →</button><button class="btn btn-ghost btn-sm" id="resetDomino">重来</button><span class="small muted">共 ${CHAINS.find(c => c.id === chainId).steps.length} 环</span></div>
    </div>`;
    bindCause();
    paint();
  }, { signal: ac.signal });
  const bindCause = () => {
    const push = $('#pushDomino'), reset = $('#resetDomino');
    if (push) push.addEventListener('click', () => {
      const total = CHAINS.find(c => c.id === chainId).steps.length;
      if (revealed < total) { revealed++; playSound('click'); paint(); }
      else toast('这条因果链已经推完了，换一条试试。', '🀄');
    }, { signal: ac.signal });
    if (reset) reset.addEventListener('click', () => { revealed = 1; paint(); }, { signal: ac.signal });
  };
  bindCause();
  paint();
  return () => ac.abort();
};

/* ---------- 实验六：人物档案馆 ---------- */
LAB_MOUNTS.figures = (canvas, controls, readouts) => {
  const ac = new AbortController();
  if (controls && canvas.parentNode) canvas.parentNode.insertBefore(controls, canvas);
  let filter = volumeById(state.lastVolume)?.id || 'v1';
  const curated = new Map(FIGURES.map(f => [f.name, f]));
  const pool = [];
  const seen = new Set();
  LESSONS.forEach(l => {
    (l.figures || []).forEach(f => {
      const name = f[0];
      if (!name || seen.has(name)) return;
      seen.add(name);
      const c = curated.get(name);
      const unit = unitById(l.unit);
      pool.push({
        name,
        role: f[1] || c?.title || '',
        unit,
        lesson: l,
        years: c?.years || l.years,
        quote: c?.quote || '',
        deeds: c?.deeds || [],
        look: figureLook(name, f[1] || c?.title || '', unit?.volume)
      });
    });
  });
  const paint = () => {
    const list = pool.filter(f => filter === 'all' || f.unit?.volume === filter);
    canvas.innerHTML = `<div class="figure-note">头像为风格化人物插画（非历史照片），按身份、时代与人物特征生成，用来帮助记忆。</div>
    <div class="figure-grid">
      ${list.map(f => `<button class="figure-card" data-figure="${esc(f.name)}">
        <span class="fig-avatar">${figureAvatarSVG(f.look)}</span>
        <b>${esc(f.name)}</b>
        <em>${esc(f.unit?.short || '')} · ${esc(f.years).slice(0, 14)}</em>
      </button>`).join('')}
    </div>`;
    setRO('fgCount', `${list.length} 条`);
    setRO('fgFilter', filter === 'all' ? '全部人物 / 群像' : `${volumeById(filter)?.short || ''}所有人物`);
  };
  controls.innerHTML = `<div class="control-row"><span class="small muted">筛选：</span><div class="seg-tabs" id="figureTabs">
    <button data-figure-filter="all" class="${filter === 'all' ? 'active' : ''}">全部</button>
    ${VOLUMES.map(v => `<button data-figure-filter="${v.id}" class="${filter === v.id ? 'active' : ''}">${v.icon} ${v.short}</button>`).join('')}
