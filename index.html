<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>时光探险岛 · 初中历史</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23B23A2C'/%3E%3Ctext x='32' y='46' font-size='36' text-anchor='middle' fill='%23FBF3E2' font-family='serif'%3E史%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   时光探险岛 · 视觉系统
   宣纸底色 + 朱砂 / 竹青 / 鎏金 / 靛蓝
   ============================================================ */
:root {
  --paper: #F7F1E6;
  --paper-deep: #EFE5D2;
  --card: #FFFCF5;
  --card-solid: #FFFFFF;
  --ink: #211D18;
  --ink-soft: #403A30;
  --muted: #7C7263;
  --line: #E4D8C3;
  --line-strong: #D2C1A2;
  --red: #B23A2C;
  --red-deep: #8C291D;
  --red-soft: #F8E5DF;
  --gold: #B48833;
  --gold-deep: #8F6A20;
  --gold-soft: #F7EDD5;
  --teal: #2F6C60;
  --teal-soft: #E2F0EA;
  --indigo: #3A5D7E;
  --indigo-soft: #E7EEF6;
  --plum: #7E4A63;
  --plum-soft: #F3E6EC;
  --green: #4F7A46;
  --green-soft: #EAF2E3;
  --shadow-sm: 0 1px 0 rgba(33, 29, 24, .04), 0 8px 22px rgba(90, 68, 40, .06);
  --shadow-md: 0 2px 0 rgba(33, 29, 24, .04), 0 18px 44px rgba(90, 68, 40, .1);
  --shadow-lg: 0 4px 0 rgba(33, 29, 24, .04), 0 30px 70px rgba(90, 68, 40, .14);
  --radius-sm: 10px;
  --radius: 18px;
  --radius-lg: 26px;
  --radius-xl: 34px;
  --maxw: 1240px;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", Georgia, serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.is-locked { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
img, svg { display: block; max-width: 100%; }
::selection { background: var(--gold-soft); color: var(--ink); }
:focus-visible { outline: 3px solid rgba(58, 93, 126, .45); outline-offset: 3px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 背景 ---------- */
.page-atmosphere {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(1100px 640px at 88% -8%, rgba(232, 193, 156, .42), transparent 62%),
    radial-gradient(900px 620px at -8% 18%, rgba(196, 220, 208, .4), transparent 58%),
    radial-gradient(760px 520px at 55% 112%, rgba(246, 226, 178, .38), transparent 62%),
    var(--paper);
}
.page-atmosphere::after {
  content: ""; position: absolute; inset: 0; opacity: .5;
  background-image:
    repeating-linear-gradient(0deg, rgba(120, 96, 62, .028) 0 1px, transparent 1px 4px),
    radial-gradient(rgba(90, 73, 48, .12) .6px, transparent .6px);
  background-size: auto, 20px 20px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
}
.atmo-seal {
  position: absolute; font-family: var(--serif); font-weight: 700;
  color: rgba(178, 58, 44, .07); user-select: none; line-height: 1;
}
.s1 { top: 8%; right: 4%; font-size: 190px; transform: rotate(-8deg); }
.s2 { bottom: 6%; left: 2%; font-size: 130px; transform: rotate(6deg); }
.atmo-dot { position: absolute; border-radius: 50%; opacity: .5; }
.d1 { width: 10px; height: 10px; background: var(--red); top: 20%; left: 5%; }
.d2 { width: 7px; height: 7px; background: var(--teal); top: 68%; left: 7%; }
.d3 { width: 13px; height: 13px; background: var(--gold); top: 38%; right: 6%; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 80;
  display: flex; align-items: center; gap: 22px;
  width: 100%; max-width: 1400px; margin: 0 auto;
  padding: 12px 26px;
  background: rgba(247, 241, 230, .84);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid transparent;
  transition: border-color .25s, box-shadow .25s, background .25s;
}
.topbar.scrolled { border-color: rgba(210, 193, 162, .7); box-shadow: 0 10px 30px rgba(90, 68, 40, .06); }
.brand { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; }
.brand-mark {
  display: grid; place-items: center; width: 44px; height: 44px;
  border-radius: 12px; background: var(--red); color: #FBF3E2;
  font-family: var(--serif); font-size: 25px; font-weight: 700;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .22), 0 3px 10px rgba(140, 41, 29, .3);
}
.brand-mark.small { width: 38px; height: 38px; font-size: 21px; }
.brand-word { display: flex; flex-direction: column; line-height: 1.2; }
.brand-word strong { font-family: var(--serif); font-size: 18px; letter-spacing: .04em; }
.brand-word small { font-size: 10.5px; color: var(--muted); letter-spacing: .08em; }
.main-nav { display: flex; align-items: center; gap: 2px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.main-nav::-webkit-scrollbar { display: none; }
.main-nav a {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  padding: 8px 11px; border-radius: 10px;
  font-size: 13.5px; color: var(--ink-soft); transition: background .18s, color .18s;
}
.main-nav a:hover { background: rgba(178, 58, 44, .07); color: var(--red-deep); }
.main-nav a.active { background: var(--ink); color: var(--paper); }
.nav-ico { font-size: 12px; opacity: .8; }
.top-actions { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
.icon-btn {
  display: grid; place-items: center; width: 36px; height: 36px;
  border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255, 252, 245, .7); color: var(--ink-soft);
  font-size: 16px; transition: .18s;
}
.icon-btn:hover { border-color: var(--line-strong); background: var(--card); transform: translateY(-1px); }
.top-avatar { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--gold-soft); border: 1.5px solid var(--gold); }
.ta-face { font-family: var(--serif); font-size: 15px; color: var(--gold-deep); }
.ta-star { position: absolute; right: -3px; bottom: -2px; font-size: 10px; color: var(--red); background: var(--paper); border-radius: 50%; padding: 0 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line); background: rgba(255, 252, 245, .72); }
.pill b { font-size: 13px; }
.pill small { color: var(--muted); font-size: 10px; }
.pill-xp b { color: var(--gold-deep); }
.pill-streak b { color: var(--red); }

/* ---------- 通用 ---------- */
.page-wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 20px 26px 80px; }
.eyebrow { font-size: 10.5px; letter-spacing: .16em; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.section { margin-top: 56px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }
.section-head h2 { margin: 4px 0 4px; font-family: var(--serif); font-size: clamp(22px, 2.6vw, 30px); letter-spacing: .01em; }
.section-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 620px; }
.section-link { font-size: 13px; color: var(--red-deep); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(178, 58, 44, .3); padding-bottom: 2px; }
.section-link:hover { border-color: var(--red); }
.text-link { font-size: 13px; color: var(--muted); }
.text-link:hover { color: var(--red-deep); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.progress { height: 6px; border-radius: 99px; background: var(--paper-deep); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 99px; background: var(--red); transition: width .5s ease; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-pad { padding: 24px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; font-size: 11px; background: var(--paper-deep); color: var(--ink-soft); border: 1px solid transparent; white-space: nowrap; }
.chip.gold { background: var(--gold-soft); color: var(--gold-deep); }
.chip.coral, .chip.red { background: var(--red-soft); color: var(--red-deep); }
.chip.teal { background: var(--teal-soft); color: var(--teal); }
.chip.indigo { background: var(--indigo-soft); color: var(--indigo); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 17px; border-radius: 11px; font-size: 13.5px; font-weight: 600;
  border: 1px solid transparent; transition: transform .16s, box-shadow .16s, background .16s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--ink); color: var(--paper); box-shadow: 0 3px 0 rgba(0, 0, 0, .16); }
.btn-primary:hover { background: #322C24; }
.btn-coral { background: var(--red); color: #FFF6ED; box-shadow: 0 3px 0 var(--red-deep); }
.btn-coral:hover { background: var(--red-deep); }
.btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--ink-soft); }
.btn-ghost:hover { background: var(--card); border-color: var(--muted); }
.btn-soft { background: var(--paper-deep); color: var(--ink-soft); }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 9px; }
.btn-lg { padding: 13px 22px; font-size: 15px; border-radius: 13px; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- 首页 Hero ---------- */
.hero { display: grid; grid-template-columns: 1.12fr .88fr; gap: 34px; align-items: center; padding: 38px 0 10px; }
.hero-kicker { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 11.5px; color: var(--ink-soft); box-shadow: var(--shadow-sm); }
.hero-kicker i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--red-soft); color: var(--red-deep); font-style: normal; font-size: 11px; }
.hero h1 { margin: 16px 0 14px; font-family: var(--serif); font-size: clamp(34px, 4.9vw, 58px); line-height: 1.14; letter-spacing: -.01em; font-weight: 700; }
.hero h1 .highlight { position: relative; color: var(--red); }
.hero h1 .highlight::after { content: ""; position: absolute; left: 0; right: 0; bottom: 4px; height: 10px; background: rgba(180, 136, 51, .28); border-radius: 2px; z-index: -1; }
.hero-lead { font-size: 15px; color: var(--ink-soft); max-width: 560px; margin: 0 0 22px; line-height: 1.85; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 20px; font-size: 12px; color: var(--muted); }
.hero-meta b { color: var(--ink); font-family: var(--serif); font-size: 15px; }
.hero-art { position: relative; min-height: 360px; display: grid; place-items: center; }
.compass { position: relative; width: min(100%, 380px); aspect-ratio: 1; }
.compass .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(140, 115, 78, .25); }
.compass .ring.r2 { inset: 9%; border-style: dashed; opacity: .8; }
.compass .ring.r3 { inset: 20%; border-color: rgba(178, 58, 44, .22); }
.compass .ring.r4 { inset: 32%; border-style: dotted; }
.compass::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(circle at 34% 30%, rgba(255, 252, 245, .96), rgba(247, 237, 213, .7) 60%, rgba(243, 228, 196, .28)); box-shadow: inset 0 0 60px rgba(180, 136, 51, .18); }
.compass-core { position: absolute; inset: 22%; border-radius: 50%; display: grid; place-items: center; text-align: center; }
.compass-core .cc-year { font-family: var(--serif); font-size: clamp(38px, 5vw, 56px); line-height: 1; color: var(--ink); letter-spacing: -.02em; }
.compass-core .cc-sub { font-size: 10.5px; letter-spacing: .2em; color: var(--muted); margin-top: 8px; }
.year-chip { position: absolute; padding: 5px 11px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 11.5px; box-shadow: var(--shadow-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
.year-chip b { color: var(--red); font-family: var(--serif); }
.yc1 { top: 6%; left: 48%; transform: translateX(-50%); }
.yc2 { top: 27%; right: -4%; }
.yc3 { bottom: 27%; right: -3%; }
.yc4 { bottom: 4%; left: 50%; transform: translateX(-50%); }
.yc5 { top: 30%; left: -5%; }
.yc6 { bottom: 28%; left: -5%; }
.mascot-wrap { position: absolute; right: 1%; bottom: -3%; width: 128px; filter: drop-shadow(0 12px 20px rgba(90, 68, 40, .18)); }

/* ---------- 数据条 ---------- */
.stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 34px; }
.stat-box { display: flex; align-items: center; gap: 12px; padding: 15px 17px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); }
.stat-ico { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--paper-deep); font-size: 17px; }
.stat-box b { display: block; font-family: var(--serif); font-size: 19px; line-height: 1.2; }
.stat-box span:last-child { font-size: 11px; color: var(--muted); }
.stat-box > div { line-height: 1.3; }

/* ---------- 首页两栏 ---------- */
.home-split { display: grid; grid-template-columns: 1.25fr .9fr; gap: 18px; margin-top: 40px; }
.mission-card {
  position: relative; overflow: hidden; padding: 26px; border-radius: var(--radius-lg);
  background: radial-gradient(700px 340px at 90% -10%, rgba(180, 136, 51, .22), transparent 60%), linear-gradient(150deg, #2A241C, #1B1712 70%);
  color: #F6ECDA; box-shadow: var(--shadow-md);
}
.mission-card::after { content: ""; position: absolute; inset: 0; opacity: .18; background-image: radial-gradient(rgba(255, 244, 220, .5) .6px, transparent .6px); background-size: 18px 18px; pointer-events: none; }
.mission-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; position: relative; z-index: 1; }
.mission-head h3 { margin: 6px 0 4px; font-family: var(--serif); font-size: 23px; }
.mission-head p { margin: 0; font-size: 12.5px; color: rgba(246, 236, 218, .62); }
.mission-ring { --p: 0; position: relative; width: 74px; height: 74px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255, 255, 255, .12) 0); display: grid; place-items: center; flex: 0 0 auto; }
.mission-ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #221D16; }
.mission-ring div { position: relative; text-align: center; line-height: 1.15; }
.mission-ring b { display: block; font-size: 16px; }
.mission-ring small { font-size: 9.5px; color: rgba(246, 236, 218, .55); }
.mission-chest-strip {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; width: 100%;
  margin: 18px 0 6px; padding: 12px 15px; border-radius: 13px; text-align: left;
  border: 1px dashed rgba(246, 236, 218, .24); background: rgba(255, 255, 255, .04); color: inherit;
}
.mission-chest-strip.ready { border-style: solid; border-color: rgba(232, 193, 106, .55); background: rgba(232, 193, 106, .12); }
.mission-chest-strip.opened { opacity: .55; }
.mcs-icon { font-size: 22px; }
.mission-chest-strip b { font-size: 13px; }
.mission-chest-strip em { flex: 1; font-style: normal; font-size: 11.5px; color: rgba(246, 236, 218, .62); text-align: left; }
.mission-chest-strip i { font-style: normal; font-size: 11.5px; color: var(--gold); white-space: nowrap; }
.mission-list { position: relative; z-index: 1; list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
.mission-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px; background: rgba(255, 255, 255, .035); }
.mission-item.done { background: rgba(232, 193, 106, .1); }
.mission-check { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(246, 236, 218, .3); font-size: 11px; color: transparent; flex: 0 0 auto; }
.mission-item.done .mission-check { background: var(--gold); border-color: var(--gold); color: #2A241C; }
.mission-item div { flex: 1; line-height: 1.35; }
.mission-item b { display: block; font-size: 12.5px; font-weight: 600; }
.mission-item span { font-size: 11px; color: rgba(246, 236, 218, .55); }
.mission-xp { font-size: 11px; color: var(--gold); white-space: nowrap; padding: 4px 8px; border-radius: 99px; border: 1px solid rgba(232, 193, 106, .35); }
.mission-complete { position: relative; z-index: 1; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: rgba(232, 193, 106, .16); font-size: 12px; color: #F0D9A6; text-align: center; }
.continue-card { display: flex; flex-direction: column; gap: 12px; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.continue-label { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgba(47, 108, 96, .12); animation: pulse 2.4s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(47, 108, 96, 0); } }
.continue-chapter { display: flex; align-items: center; gap: 14px; }
.continue-icon { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 15px; background: var(--soft, var(--red-soft)); color: var(--accent, var(--red)); font-family: var(--serif); font-size: 25px; flex: 0 0 auto; }
.continue-chapter h3 { margin: 0 0 3px; font-family: var(--serif); font-size: 20px; }
.continue-chapter p { margin: 0; font-size: 12px; color: var(--muted); }
.continue-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.continue-q { padding: 10px 12px; border-radius: 10px; background: var(--paper); border-left: 3px solid var(--gold); font-size: 11.5px; line-height: 1.65; color: var(--ink-soft); }
.continue-q b { display: block; font-size: 9.5px; letter-spacing: .1em; color: var(--gold-deep); margin-bottom: 2px; }
.daily-quote { margin-top: auto; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft); border-left: 3px solid var(--gold); font-size: 12.5px; color: var(--ink-soft); line-height: 1.65; }
.daily-quote b { display: block; font-size: 10.5px; letter-spacing: .12em; color: var(--gold-deep); margin-bottom: 3px; }

/* ---------- 长廊横幅 ---------- */
.campaign-banner {
  display: flex; align-items: center; gap: 20px; margin-top: 22px; padding: 22px 26px;
  border-radius: var(--radius-lg); color: #FBF1DE; position: relative; overflow: hidden;
  background: radial-gradient(600px 240px at 8% 0%, rgba(255, 214, 160, .18), transparent 60%), linear-gradient(120deg, #8C291D, #5E1A13 72%);
  box-shadow: var(--shadow-md);
}
.campaign-banner::after { content: "史前 — 今天"; position: absolute; right: 18px; bottom: -10px; font-family: var(--serif); font-size: 58px; color: rgba(255, 244, 222, .07); letter-spacing: .04em; }
.cb-emblem { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255, 226, 178, .45); font-size: 23px; flex: 0 0 auto; background: rgba(255, 255, 255, .06); }
.cb-main { flex: 1 1 auto; position: relative; z-index: 1; }
.cb-kicker { font-size: 10px; letter-spacing: .16em; color: rgba(255, 226, 178, .7); }
.cb-main h3 { margin: 4px 0 3px; font-family: var(--serif); font-size: 21px; }
.cb-main p { margin: 0; font-size: 12px; color: rgba(251, 241, 222, .7); }
.cb-main p b { color: #FFE2B2; }
.cb-progress-wrap { width: 190px; position: relative; z-index: 1; }
.cb-progress { height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .16); overflow: hidden; }
.cb-progress i { display: block; height: 100%; background: linear-gradient(90deg, #E8C16A, #FFF0C8); border-radius: 99px; }
.cb-progress-text { font-size: 11px; color: rgba(251, 241, 222, .7); margin-top: 6px; }

.cb-go { position: relative; z-index: 1; font-size: 12px; padding: 8px 14px; border-radius: 99px; border: 1px solid rgba(255, 226, 178, .4); white-space: nowrap; }

/* ---------- 单元地图 ---------- */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.unit-card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); transition: transform .18s, box-shadow .18s, border-color .18s; overflow: hidden; }
.unit-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); opacity: .75; }
.unit-card::after { content: attr(data-num); position: absolute; right: 10px; bottom: -18px; font-family: var(--serif); font-size: 74px; line-height: 1; color: var(--accent); opacity: .07; pointer-events: none; }
.unit-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.unit-top { display: flex; align-items: flex-start; gap: 11px; }
.unit-ico { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--soft); color: var(--accent); font-family: var(--serif); font-size: 20px; flex: 0 0 auto; }
.unit-top h3 { margin: 1px 0 2px; font-family: var(--serif); font-size: 16.5px; line-height: 1.4; }
.unit-top p { margin: 0; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.unit-tagline { font-size: 12px; color: var(--ink-soft); line-height: 1.65; }
.unit-lessons { display: flex; flex-wrap: wrap; gap: 5px; }

.unit-foot { margin-top: auto; display: flex; align-items: center; gap: 9px; font-size: 10.5px; color: var(--muted); }
.unit-foot .progress { flex: 1; }
.unit-foot b { color: var(--ink); font-size: 11.5px; }

/* ---------- 五步法 ---------- */
.method-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.method-mini { padding: 16px 17px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.method-mini b { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-family: var(--serif); }
.method-mini i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--red); border: 1px solid rgba(178, 58, 44, .3); padding: 1px 5px; border-radius: 5px; }
.method-mini span { display: block; margin-top: 6px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }

/* ---------- 每日一题 ---------- */
.quiz-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.quiz-stem { font-size: 16px; line-height: 1.75; margin-bottom: 14px; }
.quiz-stem .blank { color: var(--red-deep); font-weight: 700; letter-spacing: .08em; }
.quiz-options { display: grid; gap: 8px; }
.option { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); text-align: left; font-size: 13.5px; line-height: 1.6; transition: .16s; }
.option:hover:not(:disabled) { border-color: var(--line-strong); background: #FFFDF8; transform: translateX(2px); }
.option:disabled { cursor: default; }
.option .o-key { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--paper-deep); font-size: 11px; font-weight: 700; flex: 0 0 auto; margin-top: 1px; }
.option.correct { border-color: #7FA36F; background: #F0F6EA; }
.option.correct .o-key { background: #7FA36F; color: #fff; }
.option.wrong { border-color: #D08A7E; background: #FBEAE6; }
.option.wrong .o-key { background: #C4553F; color: #fff; }
.option.dim { opacity: .55; }
.feedback { margin-top: 14px; padding: 16px 18px; border-radius: 13px; border: 1px solid var(--line); background: var(--card); }
.feedback.good { border-color: #BCD3AD; background: #F4F8EE; }
.feedback.bad { border-color: #E5C1B6; background: #FCF1ED; }
.feedback-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.f-emoji { font-size: 19px; }
.f-title { font-weight: 600; font-size: 14px; flex: 1; }
.xp-gain { font-size: 11px; color: var(--gold-deep); background: var(--gold-soft); padding: 2px 8px; border-radius: 99px; }
.feedback p { margin: 6px 0; font-size: 13px; line-height: 1.7; }
.feedback-answer b { color: var(--red-deep); }
.knowledge-details { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.knowledge-details summary { cursor: pointer; font-size: 12.5px; color: var(--teal); font-weight: 600; list-style: none; }
.knowledge-details summary::-webkit-details-marker { display: none; }
.knowledge-details summary::before { content: "＋ "; }
.knowledge-details[open] summary::before { content: "－ "; }
.knowledge-recap { margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; }
.knowledge-recap b { color: var(--red-deep); }
.quiz-footnote { margin-top: 12px; font-size: 11.5px; color: var(--muted); }

/* ---------- 课程地图 ---------- */
.courses-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin: 14px 0 26px; }
.courses-head h1 { margin: 6px 0 6px; font-family: var(--serif); font-size: clamp(28px, 3.6vw, 40px); }
.courses-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 640px; }
.volume-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
.volume-bar button { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); font-size: 12.5px; background: var(--card); }
.volume-bar button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.volume-hero { display: flex; align-items: center; justify-content: space-between; gap: 22px; padding: 22px 26px; border-radius: var(--radius-lg); background: linear-gradient(120deg, var(--soft), rgba(255, 252, 245, .55) 72%); border: 1px solid var(--line); margin-bottom: 18px; }

.volume-hero .chapter-ring { flex: 0 0 auto; }
.tl-unit { margin: 0 0 16px; }
.tl-unit-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 10px 0 6px; padding-left: 2px; }
.tl-unit-head b { font-size: 13px; font-family: var(--serif); }
.tl-unit-head span { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
.campaign-volume-bar { margin: 18px 0 6px; }
.campaign-volume-bar button { font-size: 12px; padding: 7px 12px; }
.unit-block { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--card); overflow: hidden; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.ub-head { display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, var(--soft), transparent 72%); }
.ub-num { font-family: var(--serif); font-size: 30px; color: var(--accent); line-height: 1; min-width: 40px; }
.ub-head h2 { margin: 0; font-family: var(--serif); font-size: 19px; }
.ub-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
.ub-head .ub-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.lesson-rows { display: grid; }
.lesson-row { display: flex; align-items: center; gap: 14px; padding: 13px 22px; border-top: 1px solid rgba(228, 216, 195, .55); transition: background .15s; }
.lesson-row:first-child { border-top: none; }
.lesson-row:hover { background: #FFFDF8; }
@media (max-width: 760px) {
  .ub-head { flex-wrap: wrap; gap: 8px 10px; padding: 14px 16px; }
  .ub-num { flex: 0 0 auto; }
  .ub-head > div:not(.ub-right) { flex: 1 1 160px; min-width: 0; }
  .ub-head h2 { font-size: 16px; line-height: 1.4; }
  .ub-head .ub-right { margin-left: 0; width: 100%; justify-content: flex-end; }
  .lesson-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) 18px; align-items: center; gap: 4px 10px; padding: 12px 16px; }
  .lr-main { flex: none; min-width: 0; }
  .lr-num { width: auto !important; }
  .lr-main span { max-width: 100%; }
  .lr-tags { display: none !important; }
  .lr-dot { display: none !important; }
  .lr-arrow { margin-left: 0; justify-self: end; }
  .volume-bar button { flex: 0 0 auto; white-space: nowrap; }
}
.lr-num { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 46px; flex: 0 0 auto; }
.lr-main { flex: 1; min-width: 0; }
.lr-main b { display: block; font-size: 13.5px; font-weight: 600; }
.lr-main span { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-tags { display: flex; gap: 5px; flex: 0 0 auto; }
.lr-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex: 0 0 auto; }
.lr-dot.learned { background: var(--teal); }
.lr-dot.quizzed { background: var(--gold); }
.lr-arrow { color: var(--muted); font-size: 14px; }

/* ---------- 时光长廊 ---------- */
.command-hero { position: relative; overflow: hidden; padding: 30px 32px; border-radius: var(--radius-xl); color: #FBF1DE; background: radial-gradient(700px 320px at 86% -10%, rgba(255, 205, 150, .2), transparent 60%), linear-gradient(140deg, #2C241A, #191510 66%); box-shadow: var(--shadow-md); }
.command-hero::after { content: "六册"; position: absolute; right: 24px; top: 10px; font-family: var(--serif); font-size: 110px; line-height: 1; color: rgba(255, 240, 214, .05); pointer-events: none; }
.command-id { display: flex; align-items: center; gap: 15px; }
.command-avatar { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; border: 1.5px solid rgba(232, 193, 106, .5); background: rgba(255, 255, 255, .06); font-family: var(--serif); font-size: 24px; color: #F0D9A6; }
.command-id h1 { margin: 3px 0; font-family: var(--serif); font-size: clamp(26px, 3.4vw, 36px); }
.command-id p { margin: 0; font-size: 12.5px; color: rgba(251, 241, 222, .68); }
.command-hud { display: flex; gap: 34px; margin: 26px 0 18px; flex-wrap: wrap; }
.hud-cell small { display: block; font-size: 10.5px; color: rgba(251, 241, 222, .55); letter-spacing: .06em; }
.hud-cell b { font-family: var(--serif); font-size: 25px; line-height: 1.3; }
.hud-cell b span { font-size: 12px; color: rgba(251, 241, 222, .45); }
.command-progress { display: flex; align-items: center; gap: 14px; }
.command-progress .progress { flex: 1; background: rgba(255, 255, 255, .12); }
.command-progress .progress i { background: linear-gradient(90deg, #E8C16A, #FFF0C8); }
.command-progress span { font-size: 11.5px; color: rgba(251, 241, 222, .65); white-space: nowrap; }
.campaign-layout { display: grid; grid-template-columns: 1.55fr .85fr; gap: 18px; margin-top: 20px; }
.campaign-map-panel { position: relative; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--card); padding: 20px; box-shadow: var(--shadow-sm); }
.map-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.map-head h2 { margin: 4px 0 0; font-family: var(--serif); font-size: 19px; }
.map-signal { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .12em; color: var(--teal); }
.map-signal i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: pulse2 2s infinite; }
@keyframes pulse2 { 50% { opacity: .3; } }
.campaign-map-scroll { overflow-x: auto; padding: 12px 0 4px; scrollbar-width: thin; }
.campaign-map { position: relative; width: 720px; min-height: 470px; }
.campaign-map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage-node { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 118px; transform: translate(-50%, -50%); text-align: center; }
.stage-dot { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--card); border: 2px solid var(--line-strong); font-family: var(--serif); font-size: 18px; color: var(--ink-soft); position: relative; transition: .18s; box-shadow: 0 3px 0 rgba(33, 29, 24, .08); }
.stage-node:hover .stage-dot, .stage-node:focus-visible .stage-dot { transform: scale(1.08); border-color: var(--accent); color: var(--accent); }
.stage-node.s1 .stage-dot { border-color: #B08D4E; }
.stage-node.s2 .stage-dot { border-color: #96A3AE; }
.stage-node.s3 .stage-dot { border-color: var(--gold); background: var(--gold-soft); }
.stage-node.active .stage-dot { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stage-label { font-size: 11px; font-weight: 600; line-height: 1.3; }
.stage-years { font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-stars { display: flex; gap: 2px; font-size: 10px; color: var(--line-strong); }
.stage-stars .on { color: var(--gold); }
.campaign-briefing { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--card); padding: 22px; box-shadow: var(--shadow-sm); align-self: start; }
.briefing-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.briefing-ico { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; background: var(--soft); color: var(--accent); font-family: var(--serif); font-size: 22px; }
.briefing-head h3 { margin: 0; font-family: var(--serif); font-size: 18px; }
.briefing-head p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
.briefing-body p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; }
.briefing-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.brief-stat { padding: 10px 12px; border-radius: 10px; background: var(--paper-deep); }
.brief-stat small { display: block; font-size: 10px; color: var(--muted); }
.brief-stat b { font-family: var(--serif); font-size: 17px; }
.brief-lessons { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; }
.brief-lessons li { display: flex; gap: 8px; font-size: 12px; line-height: 1.5; }
.brief-lessons i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--muted); padding-top: 1px; }
.brief-actions { display: grid; gap: 7px; margin-top: 16px; }
.medal-wall { margin-top: 34px; }
.section-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.section-title-row h2 { margin: 0 0 3px; font-family: var(--serif); font-size: 24px; }
.section-title-row p { margin: 0; font-size: 12.5px; color: var(--muted); }
.medal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.medal-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; }

.medal-ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--paper-deep); color: var(--medal, var(--gold)); font-size: 15px; flex: 0 0 auto; }
.medal-main { flex: 1; min-width: 0; line-height: 1.35; }
.medal-main b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.medal-main span { font-size: 10.5px; color: var(--muted); }
.star-row { display: flex; gap: 1px; color: var(--line-strong); font-size: 12px; }
.star-row .on { color: var(--gold); }
.command-tip { display: flex; gap: 12px; align-items: flex-start; margin-top: 22px; padding: 14px 18px; border-radius: 13px; background: var(--gold-soft); border: 1px solid rgba(180, 136, 51, .28); font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
.command-tip p { margin: 0; }

/* ---------- 单元详情 ---------- */
.chapter-hero { position: relative; overflow: hidden; display: flex; justify-content: space-between; gap: 24px; padding: 30px 32px; border-radius: var(--radius-xl); background: linear-gradient(120deg, var(--soft), rgba(255, 252, 245, .55) 70%); border: 1px solid var(--line); }
.chapter-hero::after { content: attr(data-glyph); position: absolute; right: 20px; bottom: -28px; font-family: var(--serif); font-size: 150px; line-height: 1; color: var(--accent); opacity: .08; }
.chapter-hero .eyebrow { color: var(--accent); opacity: .85; }
.chapter-hero h1 { display: flex; align-items: baseline; gap: 14px; margin: 8px 0 6px; font-family: var(--serif); font-size: clamp(26px, 3.4vw, 38px); line-height: 1.25; text-wrap: balance; }
.ch-num { font-size: .55em; color: var(--accent); font-family: var(--mono); letter-spacing: .02em; }

.chapter-hero-side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; flex: 0 0 auto; position: relative; z-index: 1; }
.chapter-ring { --p: 0; position: relative; width: 104px; height: 104px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), rgba(210, 193, 162, .35) 0); display: grid; place-items: center; }
.chapter-ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--card); }

.chapter-ring b { display: block; font-family: var(--serif); font-size: 22px; }
.chapter-ring small { font-size: 9.5px; color: var(--muted); }
.side-note { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.7; }

.chapter-tabs { display: flex; gap: 6px; margin: 20px 0 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chapter-tabs::-webkit-scrollbar { display: none; }
.chapter-tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; white-space: nowrap; color: var(--ink-soft); }
.tab-short { display: none; }
.chapter-tabs a.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab-num { font-family: var(--mono); font-size: 9.5px; opacity: .55; }
.goal-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.goal-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 11px; color: var(--ink-soft); }

.chapter-layout { display: grid; grid-template-columns: minmax(0, 1fr) 288px; gap: 20px; align-items: start; }

.side-card { padding: 17px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

.side-stat { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--muted); padding: 5px 0; }

.lab-note { padding: 9px 11px; border-radius: 9px; background: var(--gold-soft); font-size: 11px; color: var(--ink-soft); line-height: 1.6; }

/* ---------- 知识卡 ---------- */
.k-toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.k-toolbar h2 { margin: 0 0 2px; font-family: var(--serif); font-size: 22px; }

.k-list { display: grid; gap: 12px; }
.k-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; scroll-margin-top: 90px; }
.k-card.learned { border-color: rgba(47, 108, 96, .38); }
.k-head { display: flex; align-items: center; gap: 13px; width: 100%; padding: 16px 18px; text-align: left; }
.k-index { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--soft); color: var(--accent); font-family: var(--mono); font-size: 12px; font-weight: 700; flex: 0 0 auto; }
.k-card.learned .k-index { background: var(--teal); color: #fff; }
.k-head-main { flex: 1; min-width: 0; }
.k-head-main h3 { margin: 0 0 1px; font-family: var(--serif); font-size: 17px; line-height: 1.45; }
.k-head-main p { margin: 0; font-size: 10.5px; color: var(--muted); }
.k-status { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.k-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.k-card.learned .k-status { color: var(--teal); }
.k-card.learned .k-status .dot { background: var(--teal); }
.k-chevron { font-size: 15px; color: var(--muted); transition: transform .2s; }
.k-card.open .k-chevron { transform: rotate(180deg); }
.k-body { display: none; padding: 0 18px 20px; }
.k-card.open .k-body { display: block; animation: slideDown .3s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } }
.k-core { position: relative; padding: 14px 16px 14px 18px; border-radius: 12px; background: var(--soft); font-size: 14px; line-height: 1.8; color: var(--ink); }
.k-core::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--accent); }
.k-core b { color: var(--accent); }
.fact-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.fact-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 7px; background: var(--paper-deep); font-size: 11px; color: var(--ink-soft); }
.fact-chip b { color: var(--accent); font-weight: 600; }
.k-points { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.k-points li { position: relative; padding-left: 22px; font-size: 13px; line-height: 1.75; color: var(--ink-soft); }
.k-points li::before { content: "▸"; position: absolute; left: 4px; top: 0; color: var(--accent); font-size: 11px; }
.k-points li b { color: var(--ink); }
.term-list { display: grid; gap: 7px; margin-top: 14px; }
.term-item { display: flex; gap: 10px; padding: 9px 12px; border-radius: 9px; background: #FFFDF8; border: 1px dashed var(--line); font-size: 12px; line-height: 1.65; }
.term-item b { flex: 0 0 auto; color: var(--red-deep); font-weight: 600; min-width: 74px; }
.term-item span { color: var(--ink-soft); }
.figure-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.figure-chip { display: flex; align-items: center; gap: 7px; padding: 6px 11px 6px 7px; border-radius: 99px; background: var(--paper-deep); font-size: 11.5px; }
.figure-chip i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-style: normal; font-family: var(--serif); font-size: 11px; }
.figure-chip span { color: var(--ink-soft); }
.event-strip { display: flex; gap: 0; margin: 16px 0 0; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.event-item { position: relative; padding: 0 16px 0 0; min-width: 132px; font-size: 11px; line-height: 1.5; }
.event-item::before { content: ""; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-bottom: 6px; box-shadow: 0 0 0 3px var(--soft); }
.event-item::after { content: ""; position: absolute; left: 8px; top: 4px; right: 0; height: 1px; background: var(--line); }
.event-item:last-child::after { display: none; }
.event-item b { display: block; color: var(--accent); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.treaty-box { margin-top: 14px; border: 1px solid rgba(178, 58, 44, .24); border-radius: 12px; overflow: hidden; }
.treaty-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--red-soft); font-size: 12.5px; font-weight: 600; color: var(--red-deep); }
.treaty-head small { font-weight: 400; color: rgba(140, 41, 29, .7); font-size: 10.5px; }
.treaty-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: #FFFDF8; }
.treaty-body div { padding: 8px 14px; font-size: 12px; border-top: 1px solid rgba(228, 216, 195, .6); line-height: 1.6; }
.treaty-body div:nth-child(odd) { border-right: 1px solid rgba(228, 216, 195, .6); }
.treaty-body b { color: var(--red-deep); }
.source-box { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: #F8F2E4; border-left: 3px solid var(--gold); }
.source-box .src-label { font-size: 10px; letter-spacing: .14em; color: var(--gold-deep); font-weight: 700; margin-bottom: 4px; }
.source-box blockquote { margin: 0; font-family: var(--serif); font-size: 14px; line-height: 1.9; color: var(--ink); }
.source-box cite { display: block; margin-top: 6px; font-size: 10.5px; color: var(--muted); font-style: normal; text-align: right; }
.k-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.note-box { padding: 11px 13px; border-radius: 10px; font-size: 12px; line-height: 1.65; }
.note-box b { display: block; font-size: 10.5px; letter-spacing: .08em; margin-bottom: 3px; }
.note-tip { background: var(--teal-soft); color: #24544A; }
.note-tip b { color: var(--teal); }
.note-warn { background: var(--red-soft); color: #7A2A1C; }
.note-warn b { color: var(--red-deep); }
.k-link { margin-top: 12px; padding: 10px 13px; border-radius: 10px; background: var(--indigo-soft); font-size: 12px; color: #2B4A66; line-height: 1.7; }
.k-link b { color: var(--indigo); }
.exam-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.exam-row > span:first-child { font-size: 10.5px; color: var(--muted); letter-spacing: .06em; }
.exam-tag { font-size: 10.5px; padding: 3px 8px; border-radius: 6px; background: var(--paper-deep); color: var(--ink-soft); }
.k-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.learn-btn { padding: 8px 15px; border-radius: 99px; border: 1px solid var(--line-strong); font-size: 12.5px; font-weight: 600; background: var(--card); }
.learn-btn.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.k-actions .small { color: var(--muted); }

/* ---------- 史料 / 时空 ---------- */
.source-grid { display: grid; gap: 12px; }
.source-card { padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.source-card blockquote { margin: 8px 0 6px; padding-left: 14px; border-left: 3px solid var(--gold); font-family: var(--serif); font-size: 15px; line-height: 1.9; }
.source-card cite { display: block; font-size: 11px; color: var(--muted); font-style: normal; margin-bottom: 12px; }
.source-q { margin: 10px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--paper-deep); font-size: 12.5px; line-height: 1.7; }
.source-q b { color: var(--red-deep); }
.source-a { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; color: var(--ink-soft); display: none; line-height: 1.75; }
.source-a.show { display: block; }
.source-toggle { margin-top: 8px; font-size: 12px; color: var(--teal); font-weight: 600; }
.time-wrap { display: grid; gap: 14px; }
.timeline-rail { position: relative; padding-left: 26px; }
.timeline-rail::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), rgba(210, 193, 162, .3)); border-radius: 2px; }
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item::before { content: ""; position: absolute; left: -22px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--card); border: 2px solid var(--accent); }
.tl-year { font-family: var(--mono); font-size: 11.5px; color: var(--accent); font-weight: 700; }
.tl-text { font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); margin-top: 1px; }
.tl-text b { color: var(--ink); }
.time-note { padding: 14px 16px; border-radius: 12px; background: var(--gold-soft); font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
.time-links { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 单元闯关入口 ---------- */
.quiz-entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quiz-entry { padding: 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--card); text-align: left; transition: .16s; }
.quiz-entry:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.quiz-entry .qe-ico { font-size: 20px; }
.quiz-entry b { display: block; margin: 4px 0 2px; font-size: 13.5px; }
.quiz-entry span { font-size: 11px; color: var(--muted); line-height: 1.5; display: block; }
.qe-stat { margin-top: 8px; font-size: 10.5px; color: var(--accent); }

/* ---------- 互动展馆 ---------- */
.lab-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 18px 0 24px; flex-wrap: wrap; }
.lab-hero h1 { margin: 6px 0 6px; font-family: var(--serif); font-size: clamp(28px, 3.6vw, 42px); }
.lab-hero p { margin: 0; max-width: 640px; color: var(--muted); font-size: 13.5px; }
.lab-layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 18px; align-items: start; }
.lab-menu { display: grid; gap: 6px; position: sticky; top: 92px; }
.menu-title { font-size: 10px; letter-spacing: .16em; color: var(--muted); font-weight: 700; padding: 0 4px 6px; }
.lab-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; border: 1px solid transparent; background: transparent; }
.lab-item:hover { background: var(--card); border-color: var(--line); }
.lab-item.active { background: var(--card); border-color: var(--line); box-shadow: var(--shadow-sm); }
.lab-item-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--soft, var(--paper-deep)); color: var(--accent, var(--ink)); font-size: 15px; flex: 0 0 auto; }
.lab-item-main { flex: 1; line-height: 1.3; }
.lab-item-main b { display: block; font-size: 12.5px; }
.lab-item-main span { font-size: 10.5px; color: var(--muted); }
.seen-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); flex: 0 0 auto; }
.lab-stage { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); min-height: 560px; }
.lab-stage-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
.lab-stage-head h2 { margin: 4px 0 4px; font-family: var(--serif); font-size: 21px; }
.lab-stage-head p { margin: 0; font-size: 12px; color: var(--muted); }
.lab-canvas { position: relative; border-radius: 14px; background: linear-gradient(160deg, #FBF5E7, #F3E9D6); border: 1px solid var(--line); overflow: hidden; min-height: 320px; }
.lab-canvas svg { width: 100%; height: auto; display: block; }
.lab-readouts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ro-box { flex: 1 1 120px; padding: 10px 12px; border-radius: 10px; background: var(--paper-deep); }
.ro-box small { display: block; font-size: 10px; color: var(--muted); }
.ro-box b { font-family: var(--serif); font-size: 16px; }
.ro-box.accent b { color: var(--red-deep); }
.lab-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #FBF6EB; border: 1px dashed var(--line-strong); }
.lab-controls label { font-size: 12px; color: var(--ink-soft); }
.lab-controls input[type=range] { accent-color: var(--red); flex: 1; min-width: 160px; max-width: 360px; }
.control-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; }
.lab-question { margin-top: 14px; padding: 13px 16px; border-radius: 12px; background: var(--indigo-soft); font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lab-question p { margin: 0; color: #2B4A66; line-height: 1.65; }
.lab-question b { color: var(--indigo); }
.seg-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.seg-tabs button { padding: 5px 10px; border-radius: 7px; font-size: 11.5px; border: 1px solid var(--line); background: var(--card); }
.seg-tabs button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- 闯关 ---------- */
.practice-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.practice-head h1 { margin: 6px 0 6px; font-family: var(--serif); font-size: clamp(28px, 3.6vw, 42px); }
.practice-head p { margin: 0; max-width: 640px; color: var(--muted); font-size: 13.5px; }
.practice-modes { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; margin-top: 22px; align-items: start; }
.mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.mode-card { display: flex; flex-direction: column; gap: 3px; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); text-align: left; transition: .16s; }
.mode-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-sm); }
.m-ico { font-size: 19px; }
.mode-card b { font-size: 14px; margin-top: 3px; }
.mode-card span { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
.mode-card small { font-size: 10.5px; color: var(--accent); margin-top: 5px; }
.chapter-picker { margin-top: 22px; padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
.chapter-picker h3 { margin: 0 0 10px; font-family: var(--serif); font-size: 16px; }
.picker-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.picker-chip { padding: 6px 11px; border-radius: 99px; font-size: 11.5px; border: 1px solid var(--line); background: var(--paper); }
.picker-chip.active { background: var(--accent, var(--ink)); color: #fff; border-color: transparent; }
.practice-side { display: grid; gap: 12px; }
.practice-tip { padding: 18px; border-radius: 14px; background: var(--ink); color: #F2E8D6; }
.practice-tip h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 16px; }
.practice-tip p { margin: 0 0 8px; font-size: 12px; color: rgba(242, 232, 214, .68); line-height: 1.7; }
.practice-tip ul { margin: 0; padding-left: 16px; font-size: 11.5px; color: rgba(242, 232, 214, .82); line-height: 1.8; }
.reading-method-card { padding: 18px; border-radius: 14px; background: var(--gold-soft); border: 1px solid rgba(180, 136, 51, .25); }
.reading-method-card h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 16px; color: var(--gold-deep); }
.reading-method-card p { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
.reading-method-card ol { margin: 0; padding-left: 17px; font-size: 11.5px; line-height: 1.85; color: var(--ink-soft); }
.reading-method-card b { color: var(--red-deep); }

/* ---------- 答题页 ---------- */
.quiz-shell { max-width: 860px; margin: 0 auto; }
.quiz-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.quiz-top .progress { flex: 1; }
.quiz-count { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.quiz-timer { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.quiz-card { padding: 26px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.quiz-source { margin-bottom: 14px; padding: 12px 15px; border-radius: 10px; background: #F8F2E4; border-left: 3px solid var(--gold); font-family: var(--serif); font-size: 13px; line-height: 1.85; color: var(--ink-soft); }
.quiz-source small { display: block; font-family: var(--font); color: var(--muted); font-size: 10px; margin-top: 4px; }
.quiz-stem-big { font-size: 17px; line-height: 1.75; margin-bottom: 16px; }
.quiz-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.hint-btn { font-size: 12px; color: var(--teal); font-weight: 600; }
.hint-box { margin-top: 12px; padding: 11px 14px; border-radius: 10px; background: var(--teal-soft); font-size: 12.5px; color: #24544A; line-height: 1.7; }
.solution { margin-top: 12px; padding: 14px 16px; border-radius: 11px; background: #FBF6EB; border: 1px solid var(--line); font-size: 12.5px; line-height: 1.8; }
.solution b { color: var(--red-deep); }
.fill-zone { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fill-zone input { flex: 1; min-width: 220px; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line-strong); background: #FFFDF8; font-size: 14px; }
.fill-zone input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(47, 108, 96, .12); }
.order-area { display: grid; gap: 12px; }
.order-hint { font-size: 11.5px; color: var(--muted); }
.order-answer { min-height: 52px; padding: 8px; border-radius: 11px; border: 1px dashed var(--line-strong); background: #FFFDF8; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.order-answer:empty::before { content: "点击下面的卡片，按时间先后依次放入…"; font-size: 11.5px; color: var(--muted); padding: 0 6px; }
.order-item { padding: 7px 11px; border-radius: 8px; background: var(--paper-deep); border: 1px solid var(--line); font-size: 12.5px; text-align: left; }
.order-item.picked { background: var(--teal-soft); border-color: rgba(47, 108, 96, .35); }
.order-pool { display: flex; flex-wrap: wrap; gap: 6px; }
.order-pool .order-item:hover { border-color: var(--teal); }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col { display: grid; gap: 6px; align-content: start; }
.match-col-title { font-size: 10.5px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.match-item { padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); text-align: left; font-size: 12.5px; transition: .15s; }
.match-item:hover:not(:disabled) { border-color: var(--teal); }
.match-item.sel { border-color: var(--teal); background: var(--teal-soft); }
.match-item.matched { border-color: #A9C39A; background: #F1F7EC; color: #46613A; opacity: .8; }
.match-item.bad { border-color: #D08A7E; background: var(--red-soft); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

/* ---------- 结果 ---------- */
.result-page { max-width: 880px; margin: 0 auto; }
.result-hero { padding: 30px; border-radius: var(--radius-lg); background: linear-gradient(140deg, #2A241C, #1A1611); color: #F6ECDA; text-align: center; position: relative; overflow: hidden; }
.result-hero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 244, 220, .35) .6px, transparent .6px); background-size: 16px 16px; opacity: .2; }
.result-rank { position: relative; z-index: 1; font-size: 44px; }
.result-hero h1 { position: relative; z-index: 1; margin: 8px 0 4px; font-family: var(--serif); font-size: 30px; }
.result-hero p { position: relative; z-index: 1; margin: 0; font-size: 13px; color: rgba(246, 236, 218, .7); }
.result-score { position: relative; z-index: 1; display: flex; justify-content: center; gap: 30px; margin-top: 20px; flex-wrap: wrap; }
.rs-cell small { display: block; font-size: 10.5px; color: rgba(246, 236, 218, .55); }
.rs-cell b { font-family: var(--serif); font-size: 26px; }
.result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.result-card { padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; text-align: center; }
.result-card b { display: block; font-family: var(--serif); font-size: 22px; }
.result-card span { font-size: 10.5px; color: var(--muted); }
.review-list { display: grid; gap: 8px; margin-top: 10px; }
.review-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; }
.review-item .ri-mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; flex: 0 0 auto; }
.review-item.ok .ri-mark { background: var(--teal-soft); color: var(--teal); }
.review-item.no .ri-mark { background: var(--red-soft); color: var(--red-deep); }
.review-item b { display: block; font-weight: 600; line-height: 1.55; }
.review-item span { color: var(--muted); font-size: 11px; }

/* ---------- 错题本 ---------- */
.wrong-list { display: grid; gap: 10px; }
.wrong-card { padding: 18px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 12px; }
.wrong-card.mastered { border-left-color: var(--teal); opacity: .85; }
.wrong-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; align-items: center; }
.wrong-stem { font-size: 13px; line-height: 1.7; }
.wrong-answer { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.7; }
.wrong-answer b { color: var(--teal); }
.wrong-actions { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
.empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty-state .es-ico { font-size: 44px; margin-bottom: 10px; }
.empty-state h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 20px; color: var(--ink); }
.empty-state p { margin: 0 0 16px; font-size: 13px; }

/* ---------- 成长 ---------- */
.ach-hero { position: relative; overflow: hidden; padding: 28px 30px; border-radius: var(--radius-xl); background: linear-gradient(130deg, #FBF3E1, #F1E4C8); border: 1px solid rgba(180, 136, 51, .35); }
.ach-hero::after { content: "★"; position: absolute; right: 24px; bottom: -30px; font-size: 150px; color: rgba(180, 136, 51, .1); }
.ach-id { display: flex; align-items: center; gap: 16px; }
.ach-avatar { display: grid; place-items: center; width: 66px; height: 66px; border-radius: 50%; background: var(--red); color: #FBF3E2; font-family: var(--serif); font-size: 26px; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .25); flex: 0 0 auto; }
.ach-id h1 { margin: 3px 0; font-family: var(--serif); font-size: 27px; }
.ach-id p { margin: 0; font-size: 12px; color: var(--muted); }
.level-bar { margin-top: 22px; max-width: 640px; }
.level-bar .lb-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
.level-bar .lb-top b { color: var(--ink); }
.level-nodes { display: flex; justify-content: space-between; margin-top: 8px; gap: 4px; }
.level-node { flex: 1; text-align: center; font-size: 9.5px; color: var(--muted); line-height: 1.35; }
.level-node i { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); margin: 0 auto 4px; }
.level-node.done i { background: var(--gold); }
.level-node.cur i { background: var(--red); box-shadow: 0 0 0 4px rgba(178, 58, 44, .15); }
.level-node.cur { color: var(--red-deep); font-weight: 700; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.badge-card { display: flex; gap: 11px; padding: 14px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); align-items: flex-start; }
.badge-card.locked { opacity: .5; filter: grayscale(1); }
.badge-ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--gold-soft); font-size: 19px; flex: 0 0 auto; }
.badge-main { line-height: 1.4; }
.badge-main b { display: block; font-size: 12.5px; }
.badge-main span { font-size: 10.5px; color: var(--muted); display: block; margin-top: 1px; }
.badge-main em { font-style: normal; font-size: 10px; color: var(--gold-deep); }
.name-edit { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.name-edit input { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: #FFFDF8; font-size: 13px; width: 170px; }

/* ---------- 报告 ---------- */
.report-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0; }
.report-panel { padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
.report-panel h3 { margin: 0 0 12px; font-family: var(--serif); font-size: 17px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 11.5px; }
.bar-row .br-label { width: 168px; flex: 0 0 auto; color: var(--ink-soft); }
.bar-row .progress { flex: 1; }
.bar-row .br-val { width: 46px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.week-bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 8px; }
.week-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.week-bar i { display: block; width: 100%; max-width: 34px; border-radius: 5px 5px 2px 2px; background: var(--accent, var(--teal)); min-height: 3px; }
.week-bar span { font-size: 9.5px; color: var(--muted); }
.week-bar b { font-size: 9.5px; color: var(--ink-soft); font-family: var(--mono); }
.report-advice { background: var(--gold-soft); border-color: rgba(180, 136, 51, .3); }
.report-advice ul { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.9; color: var(--ink-soft); }
.report-advice b { color: var(--red-deep); }

/* ---------- 学习指南 / 年表 ---------- */
.guide-hero { padding: 18px 0 14px; }
.guide-hero h1 { margin: 6px 0; font-family: var(--serif); font-size: clamp(28px, 3.6vw, 40px); }
.guide-hero p { margin: 0; max-width: 680px; color: var(--muted); font-size: 13.5px; }
.filter-bar { display: flex; gap: 5px; flex-wrap: wrap; margin: 18px 0; }
.filter-bar button { padding: 6px 12px; border-radius: 99px; font-size: 11.5px; border: 1px solid var(--line); background: var(--card); }
.filter-bar button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.era-block { margin-bottom: 24px; }
.era-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.era-head h3 { margin: 0; font-family: var(--serif); font-size: 18px; }
.era-head span { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.era-events { display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.era-event { position: relative; padding: 0 0 12px 18px; }
.era-event::before { content: ""; position: absolute; left: -6px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--accent, var(--red)); }
.era-event b { font-family: var(--mono); font-size: 11.5px; color: var(--accent, var(--red-deep)); }
.era-event p { margin: 1px 0 0; font-size: 12.5px; line-height: 1.65; }
.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.topic-card { display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); transition: .16s; }
.topic-card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.topic-card .tc-ico { font-size: 22px; }
.topic-card h3 { margin: 0; font-family: var(--serif); font-size: 16px; }
.topic-card p { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.6; flex: 1; }
.topic-card span { font-size: 11px; color: var(--red-deep); }
.topic-detail h1 { margin: 10px 0 8px; font-family: var(--serif); font-size: clamp(26px, 3.4vw, 36px); }
.topic-detail .topic-intro { font-size: 13.5px; color: var(--ink-soft); max-width: 760px; line-height: 1.85; }
.compare-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 12.5px; background: var(--card); border-radius: 12px; overflow: hidden; }
.compare-table th, .compare-table td { padding: 10px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; line-height: 1.6; }
.compare-table th { background: var(--paper-deep); font-weight: 600; font-size: 12px; }
.compare-table td b { color: var(--red-deep); }
.topic-section { margin-top: 20px; }
.topic-section h3 { font-family: var(--serif); font-size: 18px; margin: 0 0 8px; }
.topic-section p, .topic-section li { font-size: 13px; line-height: 1.85; color: var(--ink-soft); }
.topic-section ul { padding-left: 20px; }
.topic-section li b { color: var(--ink); }

/* ---------- 云同步 ---------- */
.sync-icon-btn { position: relative; }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.sync-icon-btn .sync-dot { position: absolute; right: 5px; bottom: 5px; border: 1px solid var(--paper); width: 8px; height: 8px; }
.sync-dot.online { background: var(--teal); box-shadow: 0 0 0 3px rgba(47, 108, 96, .16); }
.sync-dot.connecting { background: var(--gold); animation: pulse2 1.4s infinite; }
.sync-dot.error { background: var(--red); }
.sync-status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: var(--paper-deep); color: var(--muted); font-size: 11px; white-space: nowrap; }
.sync-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sync-status.online { background: var(--teal-soft); color: var(--teal); }
.sync-status.connecting { background: var(--gold-soft); color: var(--gold-deep); }
.sync-status.error { background: var(--red-soft); color: var(--red-deep); }
.sync-warn { margin: 14px 0 0; padding: 12px 16px; border-radius: 12px; background: var(--gold-soft); border: 1px solid rgba(180, 136, 51, .28); font-size: 12px; line-height: 1.7; color: var(--ink-soft); }
.sync-warn.good { background: var(--teal-soft); border-color: rgba(47, 108, 96, .28); }
.sync-layout { display: grid; grid-template-columns: minmax(0, 1.28fr) minmax(260px, .72fr); gap: 18px; margin-top: 18px; align-items: start; }
.sync-panel { padding: 24px; border-radius: var(--radius-lg); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.sync-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.sync-head h2 { margin: 0 0 3px; font-family: var(--serif); font-size: 21px; }
.sync-head p { margin: 0; font-size: 11.5px; color: var(--muted); }
.sync-head > .sync-dot { margin-top: 9px; width: 10px; height: 10px; }
.sync-label { display: block; margin: 13px 0 5px; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.sync-code-row { display: flex; gap: 8px; }
.sync-code-row input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: #FFFDF8; font-size: 13px; }
.sync-hint { margin: 6px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.6; }
.sync-provider-tabs { display: flex; gap: 4px; margin: 16px 0 12px; padding: 4px; border-radius: 11px; background: var(--paper-deep); border: 1px solid var(--line); }
.sync-provider-tab { flex: 1; padding: 8px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; }
.sync-provider-tab.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .07); }
.sync-cb-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 10px; }
.sync-cb-grid label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.sync-cb-grid input, .sync-cb-grid select, .sync-key-input, #syncConfig { width: 100%; margin-top: 5px; padding: 10px 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: #FFFDF8; font-size: 12.5px; }
.sync-key-input { font-family: var(--mono); font-size: 11px; }
#syncConfig { min-height: 150px; resize: vertical; font-family: var(--mono); font-size: 11px; line-height: 1.6; }
.sync-cb-grid input:focus, .sync-cb-grid select:focus, .sync-key-input:focus, #syncConfig:focus, .sync-code-row input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(47, 108, 96, .1); }
.sync-security { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--teal-soft); color: #24544A; font-size: 10.5px; line-height: 1.65; }
.sync-steps { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.sync-steps summary { cursor: pointer; font-size: 11px; font-weight: 700; color: var(--teal); }
.sync-steps ol { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 5px; font-size: 11px; line-height: 1.7; color: var(--ink-soft); }
.sync-steps a { color: var(--red-deep); text-decoration: underline; }
.sync-steps code { padding: 1px 5px; border-radius: 4px; background: var(--paper-deep); font-family: var(--mono); font-size: 10px; }
.sync-steps p { margin: 8px 0 0; font-size: 10px; color: var(--muted); line-height: 1.7; }
.sync-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.sync-tools b { display: block; font-size: 12px; }
.sync-tools span { font-size: 10.5px; color: var(--muted); }
.sync-guide { padding: 24px; border-radius: var(--radius-lg); background: #1D1913; color: var(--paper); border: 1px solid #352D22; box-shadow: var(--shadow-md); }
.sync-guide h2 { margin: 0 0 14px; font-family: var(--serif); font-size: 20px; }
.sync-guide ol { margin: 0; padding-left: 18px; display: grid; gap: 11px; color: rgba(247, 241, 230, .72); font-size: 11.5px; line-height: 1.75; }
.sync-guide li b { color: var(--gold); display: block; margin-bottom: 1px; }
.sync-note { margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255, 255, 255, .14); color: rgba(247, 241, 230, .48); font-size: 10.5px; line-height: 1.7; }
.sync-note code { color: rgba(232, 193, 106, .8); font-family: var(--mono); font-size: 10px; }
@media (max-width: 900px) {
  .sync-layout { grid-template-columns: 1fr; }
  .sync-cb-grid { grid-template-columns: 1fr; }
  .sync-panel, .sync-guide { padding: 18px; }
  .sync-tools { align-items: flex-start; }
}

/* ---------- 弹窗 / 搜索 ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(25, 21, 16, .48); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: fadeIn .18s; }
@keyframes fadeIn { from { opacity: 0; } }
.modal { width: min(100%, 520px); background: var(--card); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-lg); border: 1px solid var(--line); max-height: min(80vh, 720px); overflow: auto; }
.modal h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 20px; }
.modal p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.7; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.search-modal { width: min(100%, 620px); padding: 20px; }
.search-box { display: flex; gap: 8px; align-items: center; padding: 4px 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: #FFFDF8; }
.search-box span { color: var(--muted); }
.search-box input { flex: 1; border: none; background: none; padding: 11px 0; font-size: 15px; outline: none; }
.search-results { margin-top: 14px; display: grid; gap: 6px; max-height: 50vh; overflow: auto; }
.search-result { display: flex; gap: 10px; padding: 10px 12px; border-radius: 9px; background: var(--paper); align-items: flex-start; }
.search-result:hover { background: var(--paper-deep); }
.search-result .sr-kind { font-size: 9.5px; padding: 1px 6px; border-radius: 4px; background: var(--card); border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto; }
.search-result b { font-size: 12.5px; display: block; }
.search-result span { font-size: 11px; color: var(--muted); }
.search-empty { padding: 30px; text-align: center; color: var(--muted); font-size: 12.5px; }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 300; display: grid; gap: 8px; width: min(94vw, 460px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 9px; padding: 11px 15px; border-radius: 12px; background: var(--ink); color: #F7EFDD; font-size: 12.5px; box-shadow: var(--shadow-md); animation: toastIn .3s ease; }
.toast .t-ico { font-size: 15px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
#confettiCanvas { position: fixed; inset: 0; z-index: 250; pointer-events: none; width: 100%; height: 100%; }

/* ---------- 页脚 ---------- */
.site-footer { border-top: 1px solid var(--line); background: rgba(243, 235, 221, .6); margin-top: 30px; }
.footer-inner { max-width: var(--maxw); margin: 0 auto; padding: 34px 26px 40px; display: grid; gap: 18px; }
.footer-brand { display: flex; align-items: center; gap: 12px; }
.footer-brand strong { font-family: var(--serif); font-size: 16px; }
.footer-brand p { margin: 0; font-size: 11.5px; color: var(--muted); }
.footer-links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.footer-links a:hover { color: var(--red-deep); }
.footer-note { margin: 0; font-size: 10.5px; color: var(--muted); }

/* ---------- 骨架屏 ---------- */
.skeleton { padding: 60px; text-align: center; color: var(--muted); font-size: 13px; }

/* ---------- 响应式 ---------- */
@media (max-width: 1120px) {
  .hero { grid-template-columns: 1fr; gap: 8px; }
  .hero-art { min-height: 300px; margin-top: 6px; }
  .compass { width: min(100%, 320px); }
  .campaign-layout { grid-template-columns: 1fr; }
  .chapter-layout { grid-template-columns: 1fr; }
  .chapter-side { position: static; grid-template-columns: 1fr 1fr; }
  .chapter-side > .btn { grid-column: 1 / -1; }
  .lab-layout { grid-template-columns: 1fr; }
  .lab-menu { position: static; grid-template-columns: repeat(2, 1fr); }
  .menu-title { grid-column: 1 / -1; }
  .practice-modes { grid-template-columns: 1fr; }
  .practice-side { grid-template-columns: 1fr 1fr; }
}

  .page-wrap { padding: 16px 16px 64px; }
  .hero { padding-top: 20px; }
  .hero h1 { font-size: clamp(30px, 8.4vw, 44px); }
  .stat-strip { grid-template-columns: 1fr 1fr; }
  .home-split { grid-template-columns: 1fr; }
  .method-strip { grid-template-columns: 1fr 1fr; }
  .unit-grid { grid-template-columns: 1fr; }
  .campaign-banner { flex-wrap: wrap; gap: 12px; padding: 18px; }
  .cb-progress-wrap { width: 100%; }
  .cb-go { display: none; }
  .chapter-hero { flex-direction: column; padding: 22px; }
  .chapter-hero-side { flex-direction: row; justify-content: space-between; width: 100%; }
  .chapter-ring { width: 84px; height: 84px; }
  .treaty-body { grid-template-columns: 1fr; }
  .treaty-body div:nth-child(odd) { border-right: none; }
  .k-notes { grid-template-columns: 1fr; }
  .quiz-entry-grid { grid-template-columns: 1fr; }
  .match-grid { grid-template-columns: 1fr; }
  .result-grid { grid-template-columns: 1fr 1fr; }
  .report-summary { grid-template-columns: 1fr 1fr; }
  .lab-stage { padding: 16px; }
  .practice-side { grid-template-columns: 1fr; }
  .chapter-side { grid-template-columns: 1fr; }
  .volume-bar { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  .volume-hero { flex-direction: column; align-items: flex-start; padding: 18px; }

  .lesson-row { padding: 12px 16px; gap: 10px; }
  .lr-num { width: 38px; }

/* ---------- 实验内部组件 ---------- */
.lab-year-events { padding: 4px 16px 16px; }
.lye-head { font-size: 11px; letter-spacing: .06em; color: var(--muted); margin: 4px 0 8px; }
.lye { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 12.5px; line-height: 1.6; }
