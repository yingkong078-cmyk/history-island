动虽然先后失败，但表明工人阶级已作为独立的政治力量登上历史舞台，斗争需要有科学理论指导，这成为马克思主义诞生的阶级基础。当时资本主义制度并未被推翻，无产阶级政权要到 1871 年巴黎公社才第一次建立，马克思主义此时尚未诞生。","point":"马克思主义诞生的阶级基础"},{"id":"w7q7","lesson":"w7l2","unit":"w7","type":"match","level":2,"stem":"把下列人物与其主要贡献配对","pairs":[["马克思","第一国际的创始人之一"],["恩格斯","与马克思合著《共产党宣言》"],["欧仁·鲍狄埃","创作《国际歌》歌词"],["比尔·狄盖特","为《国际歌》谱曲"]],"explain":"马克思与恩格斯共同创立马克思主义，合著《共产党宣言》，马克思还是第一国际的创始人之一并起草《成立宣言》；巴黎公社失败后，社员鲍狄埃写下《国际歌》歌词，狄盖特后来为它谱曲。","point":"马克思主义的创立者与《国际歌》"},{"id":"w7q8","lesson":"w7l2","unit":"w7","type":"fill","level":2,"stem":"1871 年 3 月 18 日，巴黎人民起义，建立了世界上第一个无产阶级政权——______。","answer":["巴黎公社"],"explain":"1871 年 3 月 18 日，巴黎人民起义，巴黎公社成立，这是世界上第一个无产阶级政权。公社只存在两个多月，5 月 28 日被镇压而失败，但它的革命精神影响深远。","point":"巴黎公社"}],"timeline":[{"t":"1765 年","y":1765,"text":"哈格里夫斯发明珍妮机，工业革命开始","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"1785 年","y":1785,"text":"瓦特改良的蒸汽机投入使用，人类进入“蒸汽时代”","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"1807 年","y":1807,"text":"美国人富尔顿发明汽船","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"1825 年","y":1825,"text":"史蒂芬孙设计的蒸汽机车“旅行者号”试车成功，铁路时代到来","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"19 世纪中期","y":1840,"text":"英国成为世界上第一个工业国家，工业革命向欧美各国扩展","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"1848 年","y":1848,"text":"《共产党宣言》在伦敦发表，马克思主义诞生","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"1864 年","y":1864,"text":"第一国际在伦敦成立，马克思是创始人之一","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"1871 年 3 月 18 日","y":1871,"text":"巴黎人民起义，建立世界上第一个无产阶级政权巴黎公社","unit":"w7","tag":"世界近代","volume":"v5"},{"t":"1871 年 5 月 28 日","y":1871,"text":"巴黎公社失败，《国际歌》此后传遍世界","unit":"w7","tag":"世界近代","volume":"v5"}]},{"volume":"v6","unit":{"id":"x1","volume":"v6","num":1,"title":"殖民地人民的反抗与资本主义制度的扩展","short":"反抗与扩展","years":"19 世纪","accent":"#2F6C60","soft":"#E2F0EA","tint":"#BFDCD2","icon":"🌎","tagline":"四条道路同一个时代：反抗殖民、废除旧制、走向资本主义。","intro":"19 世纪，工业资本主义把世界连成一张网，殖民统治却在亚非拉激起反抗。本单元要回答：被压迫的民族和落后的国家，怎样自救？拉美与印度用起义回应殖民者，俄国用沙皇签字的改革、美国用四年内战、日本用自上而下的维新，各自搬开资本主义发展的障碍。四条道路，四种代价，也留下四种隐患。","bigQuestion":"同样是 19 世纪，为什么有的国家靠战争、有的靠改革走向资本主义？","goals":["说出拉美独立运动和印度民族大起义的史实与影响","比较彼得一世改革与 1861 年农奴制改革的异同","分析美国内战爆发的原因、进程与历史意义","概括明治维新的措施，辩证评价其影响"],"keyLine":"拉美、印度揭竿反抗；俄国废奴、美国内战、日本维新，资本主义制度在 19 世纪向全球扩展。"},"lessons":[{"id":"x1l1","num":1,"unit":"x1","title":"殖民地人民的反抗斗争","years":"19 世纪","icon":"⚔","tag":"反抗","hook":"1819 年，玻利瓦尔率军翻越安第斯山，山口寒风刺骨，战马冻死过半。当他突然出现在波哥大城下时，西班牙守军几乎不相信这支军队是从天而降的。","core":"18 世纪末 19 世纪初，受美国独立战争和法国大革命影响，拉美人民在玻利瓦尔、圣马丁领导下推翻西班牙、葡萄牙殖民统治，19 世纪 20 年代基本独立。1857—1859 年，印度土兵和章西女王领导民族大起义，虽失败却打击了英国殖民统治。","points":["背景：拉美长期受西班牙、葡萄牙殖民统治，美国独立战争和法国大革命的影响，使独立意识日益增强。","北部：玻利瓦尔率军解放南美洲北部地区，被誉为“南美的解放者”；1822 年，巴西宣布独立。","南部：圣马丁领导南美洲南部地区的独立斗争；到 19 世纪 20 年代，西、葡殖民地基本独立。","印度：19 世纪中期，英国完成工业革命后加紧经济掠夺和政治压迫，激起印度各阶层不满。","起义：1857 年印度土兵首先起义，农民、手工业者和部分封建王公参加，章西女王是杰出代表；1859 年失败。","影响：沉重打击了英国殖民统治，反映印度民族意识的觉醒，是 19 世纪中期亚洲民族解放运动的重要组成部分。"],"terms":[["南美的解放者","玻利瓦尔领导南美洲北部地区摆脱西班牙殖民统治，被尊称为“南美的解放者”，这一称号成为拉美独立运动的象征。"],["土兵","英国殖民者在印度招募的印度籍士兵。1857 年，他们首先举起义旗，成为印度民族大起义的先锋。"],["拉丁美洲","美国以南的美洲地区，长期受西班牙、葡萄牙殖民统治，19 世纪 20 年代基本获得独立。"]],"figures":[["玻利瓦尔","率军解放南美洲北部，被誉为“南美的解放者”"],["圣马丁","领导南美洲南部独立斗争，与玻利瓦尔南北呼应"],["章西女王","印度民族大起义杰出代表，1858 年在抗英战斗中牺牲"]],"events":[["19 世纪初","拉丁美洲独立运动兴起"],["1822 年","巴西宣布独立"],["19 世纪 20 年代","西、葡在拉美的殖民地基本独立"],["1857 年","印度民族大起义爆发"],["1859 年","印度民族大起义失败"]],"treaty":null,"significance":"拉美独立运动摧毁了西班牙、葡萄牙的殖民统治，建立起一批新国家；印度民族大起义沉重打击了英国殖民统治，显示出亚洲人民反抗侵略的力量。两者都说明：殖民体系的裂缝，首先从被压迫者的反抗开始。","source":{"quote":"我们既不是印第安人，也不是欧洲人，而是介于两者之间的人。","from":"玻利瓦尔《牙买加来信》（1815 年）"},"pitfall":"拉美独立运动推翻的是西、葡殖民统治，不是本国封建制度；印度民族大起义由土兵首先发动，领导者包括封建王公，并非资产阶级。","memory":"玻利瓦尔北、圣马丁南，拉美独立二十年；土兵起义一八五七，章西女王血战英军。","link":"本课是 19 世纪民族解放运动的第一波；随后俄、美、日以改革、内战、维新的方式扩展资本主义制度。","exam":["拉美独立运动的领导人及影响","印度民族大起义的时间、领导与意义","殖民地反抗与资本主义制度扩展的关系"]},{"id":"x1l2","num":2,"unit":"x1","title":"俄国的改革","years":"1861 年","icon":"🐻","tag":"俄国","hook":"1861 年 3 月，圣彼得堡冬宫前的广场上，一群农民跪着等待沙皇的诏书。诏书宣读完毕，有人欢呼，有人低头——他们自由了，可脚下的土地还要用几十年的钱去赎。","core":"18 世纪初，彼得一世改革开启俄国近代化，却强化了农奴制。19 世纪中期，克里木战争的失败暴露了俄国的落后，1861 年亚历山大二世颁布法令废除农奴制，使俄国走上发展资本主义的道路，但保留了大量封建残余。","points":["背景：17 世纪的俄国封闭落后，农奴制盛行，工商业发展缓慢，与西欧的差距不断拉大。","内容：建立中央集权体制，鼓励兴办手工工场，创建新式常备军，发展教育，提倡西式生活方式。","影响：俄国经济军事实力大增，成为欧洲军事强国，开启近代化进程；但农奴制进一步强化。","背景：19 世纪中期农奴制严重制约资本主义发展；1853—1856 年克里木战争失败，社会矛盾激化。","内容：农奴获得人身自由，可以改变身份、自由转换职业；可获得一份土地，但必须出钱赎买。","评价：改革废除农奴制，推动俄国走上发展资本主义的道路；但赎金远高于地价，封建残余仍存。"],"terms":[["农奴制","俄国以农奴劳动为基础的封建剥削制度。农奴被束缚在土地上，人身依附于地主，可被买卖。"],["彼得一世改革","18 世纪初彼得一世推行的自上而下改革，涉及政治、经济、军事、文化和社会生活，开启俄国近代化。"],["克里木战争","1853—1856 年俄国与英、法等国争夺黑海和巴尔干地区的战争，俄国战败，暴露了农奴制的落后。"],["赎买","1861 年改革规定，农民获得土地须向地主支付高价赎金，金额远高于土地的实际价格。"]],"figures":[["彼得一世","俄国沙皇，推行改革，使俄国成为欧洲军事强国"],["亚历山大二世","1861 年颁布废除农奴制的法令，推动俄国走上资本主义道路"]],"events":[["18 世纪初","彼得一世开始推行改革"],["1721 年","俄国在北方战争中获胜，夺得波罗的海出海口"],["1853—1856 年","克里木战争，俄国战败"],["1861 年","亚历山大二世颁布废除农奴制的法令"]],"treaty":null,"significance":"彼得一世改革开启了俄国近代化，1861 年改革则是俄国历史上的重要转折点：农奴制被废除，俄国走上发展资本主义的道路。但两次改革都是自上而下的，沙皇专制和农奴制残余被保留下来，成为俄国社会矛盾的根源。","source":{"quote":"与其等农民自下而上起来解放自己，不如自上而下解放农民。","from":"亚历山大二世对莫斯科贵族代表的讲话（1856 年）"},"pitfall":"彼得一世改革没有废除农奴制，反而强化了它；1861 年改革废除了农奴制，但农民必须高价赎买土地，改革很不彻底。","memory":"彼得学西不废奴，克战一败逼改革；一八六一亚历山大，人身自由地要赎。","link":"俄国以自上而下的改革解决旧制度，与下一课美国的内战形成对照：一个靠沙皇签字，一个靠四年战火。","exam":["1861 年农奴制改革的内容与评价","彼得一世改革的影响","改革与革命两种道路的比较"]},{"id":"x1l3","num":3,"unit":"x1","title":"美国内战","years":"1861—1865 年","icon":"⚔","tag":"美国","hook":"1861 年 4 月，南卡罗来纳州的萨姆特堡炮声响起。这座海港小堡的守军还没有撤走，南北之间那根绷了多年的弦，终于断了。","core":"美国南北两种经济制度的矛盾集中在奴隶制存废上。1861 年内战爆发，林肯政府颁布《宅地法》和《解放黑人奴隶宣言》，扭转战局。1865 年北方获胜，内战维护了国家统一，废除了奴隶制，为资本主义发展扫清道路。","points":["背景：北方资本主义工商业发达，南方盛行种植园经济、大量使用奴隶劳动，双方在市场、原料和关税上矛盾尖锐。","焦点：奴隶制的存废问题。南方主张把奴隶制扩展到西部新领土，北方主张限制奴隶制。","爆发：1860 年林肯当选总统，南方各州相继退出联邦；1861 年 4 月，南方军队挑起内战。","转折：1862 年颁布《宅地法》，林肯发表《解放黑人奴隶宣言》，调动农民和黑人奴隶的积极性，扭转战局。","结局：1863 年葛底斯堡战役后北方掌握主动；1865 年南方投降，林肯不久被刺杀。","意义：维护国家统一，废除奴隶制，清除资本主义发展的最大障碍，为美国经济迅速发展创造条件。"],"terms":[["《宅地法》","1862 年联邦政府颁布，规定美国公民交纳 10 美元登记费，就可在西部获得一块土地，耕种 5 年后归其所有。"],["《解放黑人奴隶宣言》","1862 年林肯发表，宣布自 1863 年 1 月 1 日起，南方叛乱各州的奴隶永远获得自由。"],["南部同盟","1861 年南方 11 个州退出联邦后建立的政权，定都里士满，挑起内战。"]],"figures":[["林肯","美国总统，颁布《解放黑人奴隶宣言》，领导北方赢得内战"],["格兰特","联邦军总司令，1865 年接受南方军队投降"]],"events":[["1860 年","林肯当选美国总统"],["1861 年 4 月","南方军队挑起内战"],["1862 年","颁布《宅地法》，发表《解放黑人奴隶宣言》"],["1863 年","葛底斯堡战役，北方取得决定性胜利"],["1865 年","南方投降，内战结束"]],"treaty":null,"significance":"美国内战是美国历史上第二次资产阶级革命。它维护了国家统一，废除了奴隶制，清除了资本主义发展的最大障碍，为美国经济的迅速发展创造了条件；但黑人获得自由后，仍长期遭受种族歧视。","source":{"quote":"一幢裂开的房子是站立不住的。我相信这个政府不能永远维持半奴隶和半自由的状态。","from":"林肯竞选参议员时的演说（1858 年）"},"pitfall":"内战爆发的原因是南北两种经济制度的矛盾，焦点是奴隶制存废；林肯最初的目标是维护国家统一，废除奴隶制是战争发展中提出的。","memory":"一八六〇林肯选，南方独立起烽烟；宅地法加解放令，一八六五复统一。","link":"美国用内战扫清资本主义障碍，与俄国改革、日本维新并列为 19 世纪资本主义制度扩展的三条路径。","exam":["美国内战的原因与焦点","《解放黑人奴隶宣言》的作用","美国内战的性质与历史意义"]},{"id":"x1l4","num":4,"unit":"x1","title":"日本明治维新","years":"1868 年","icon":"🌸","tag":"日本","hook":"1853 年 7 月，四艘黑色巨舰驶入江户湾，炮口对准岸边。日本渔民从没见过这样的船。第二年，幕府在压力下打开了国门。","core":"19 世纪中期，日本面临沦为半殖民地的危机。1868 年明治政府推行废藩置县、殖产兴业、征兵制、文明开化等改革，使日本迅速走上发展资本主义的道路，摆脱民族危机，但也保留大量封建残余，走上对外侵略扩张的道路。","points":["内忧：19 世纪中期，日本处于德川幕府统治下，实行闭关锁国，封建等级森严，社会矛盾尖锐。","外患：1853 年美国舰队叩关，1854 年日本被迫签订《日美亲善条约》，西方列强纷纷效仿。","倒幕：1868 年倒幕派发动政变，推翻德川幕府，明治天皇亲政，改年号明治，开始改革。","政治军事：废藩置县，加强中央集权；实行征兵制，建立新式军队，由中央统一指挥。","经济文化：推行地税改革，以“殖产兴业”为口号发展近代经济；提倡“文明开化”，学习西方。","影响：日本走上发展资本主义的道路，跻身资本主义强国之列；但保留大量封建残余，很快对外侵略扩张。"],"terms":[["明治维新","1868 年起明治政府推行的自上而下改革，使日本由封建社会逐步转向资本主义社会。"],["废藩置县","废除幕藩体制，取消藩国，设立府、县，由中央任命官员，从而加强中央集权。"],["殖产兴业","明治政府的经济口号，主张引进西方技术、创办近代企业，大力发展资本主义经济。"],["文明开化","明治政府提倡学习西方，改造日本的教育、文化和生活方式，如提倡穿西服、吃西餐。"]],"figures":[["明治天皇","日本天皇，1868 年明治政府成立后亲政，推行维新"],["佩里","美国舰队司令，1853 年率舰队到日本要求开港通商"],["德川庆喜","末代幕府将军，1868 年被迫交出政权"]],"events":[["1853 年","美国舰队到达日本，要求开港通商"],["1854 年","日本被迫签订《日美亲善条约》"],["1868 年","倒幕派推翻德川幕府，明治维新开始"],["1889 年","明治政府颁布《大日本帝国宪法》"]],"treaty":{"name":"《日美亲善条约》","date":"1854 年","items":["开放下田、函馆两个港口","美国船只可在上述港口停泊、补给","美国可在日本设立领事","日本给予美国最惠国待遇"],"note":"此后英、俄、法等国援例与日本签订类似条约，日本面临沦为半殖民地的危险。"},"significance":"明治维新是日本历史的重大转折点。它使日本摆脱了沦为半殖民地的危机，迅速走上发展资本主义的道路，跻身资本主义强国之列；但改革保留了大量旧制度残余，军国主义色彩浓厚，日本强大后很快走上对外侵略扩张的道路。","source":{"quote":"破旧来之陋习，基天地之公道；求知识于世界，大振皇基。","from":"明治政府《五条誓文》（1868 年）"},"pitfall":"明治维新是自上而下的改革，不是革命；它保留天皇制和大量封建残余，军国主义色彩浓厚，这是日本后来对外侵略的重要根源。","memory":"黑船叩关一八五三，倒幕维新一八六八；废藩殖产征兵制，文明开化学西方。","link":"日本以维新摆脱民族危机，与拉美、印度的反抗形成对照；三条道路合起来，就是 19 世纪世界的基本格局。","exam":["明治维新的措施与影响","《日美亲善条约》与民族危机","明治维新保留封建残余的后果"]}],"questions":[{"id":"x1q1","lesson":"x1l1","unit":"x1","type":"choice","level":1,"stem":"拉丁美洲独立运动中，率军解放南美洲北部地区、被誉为“南美的解放者”的是","options":["圣马丁","玻利瓦尔","章西女王","林肯"],"answer":1,"explain":"玻利瓦尔率军解放南美洲北部地区，被誉为“南美的解放者”；圣马丁领导的是南美洲南部地区的独立斗争；章西女王领导印度民族大起义；林肯是美国总统。","point":"拉美独立运动的领导人"},{"id":"x1q2","lesson":"x1l1","unit":"x1","type":"choice","level":2,"stem":"1857 年，首先起来反抗英国殖民者、点燃印度民族大起义的是","options":["印度封建王公","印度土兵","印度农民","印度资产阶级"],"answer":1,"explain":"1857 年，受英国殖民者压迫的印度土兵首先起义，随后农民、手工业者参加，部分封建王公成为起义领导者；起义坚持到 1859 年失败。","point":"印度民族大起义"},{"id":"x1q3","lesson":"x1l1","unit":"x1","type":"match","level":2,"stem":"把下列人物与其在反抗殖民斗争中的主要活动配对","pairs":[["玻利瓦尔","解放南美洲北部地区"],["圣马丁","领导南美洲南部独立斗争"],["章西女王","在印度民族大起义中英勇抗英"]],"explain":"玻利瓦尔和圣马丁一北一南，共同推动拉丁美洲独立；章西女王是印度民族大起义的杰出代表，1858 年在战斗中牺牲。","point":"殖民地反抗斗争的代表人物"},{"id":"x1q4","lesson":"x1l1","unit":"x1","type":"fill","level":2,"stem":"到 19 世纪 20 年代，拉丁美洲的西班牙、葡萄牙殖民地基本获得独立，只有______仍处在西班牙的殖民统治之下。","answer":["古巴","古巴岛"],"explain":"19 世纪 20 年代，拉美西、葡殖民地基本独立，古巴仍被西班牙控制，是当时西属美洲最后一块殖民地。","point":"拉美独立运动的范围"},{"id":"x1q5","lesson":"x1l2","unit":"x1","type":"choice","level":1,"stem":"1861 年，颁布法令废除农奴制的俄国沙皇是","options":["彼得一世","叶卡捷琳娜二世","亚历山大二世","尼古拉二世"],"answer":2,"explain":"1861 年，亚历山大二世颁布废除农奴制的法令，农奴获得人身自由，但须高价赎买土地。彼得一世改革没有废除农奴制。","point":"1861 年农奴制改革"},{"id":"x1q6","lesson":"x1l2","unit":"x1","type":"choice","level":2,"stem":"18 世纪初彼得一世推行改革，其历史作用主要是","options":["废除了农奴制，农民获得人身自由","开启了俄国近代化的进程，增强了国力","确立了君主立宪制，议会掌握实权","使俄国彻底摆脱了封建制度的束缚"],"answer":1,"explain":"彼得一世改革使俄国经济军事实力大增，成为欧洲军事强国，开启了俄国近代化的进程；但改革没有废除农奴制，反而进一步强化了它。","point":"彼得一世改革的影响"},{"id":"x1q7","lesson":"x1l2","unit":"x1","type":"order","level":2,"stem":"按时间先后排列俄国历史上的下列事件","items":["彼得一世开始推行改革","俄国在北方战争中获胜，夺得波罗的海出海口","克里木战争失败，俄国国际地位下降","亚历山大二世颁布废除农奴制的法令"],"explain":"18 世纪初彼得一世开始改革；1721 年北方战争获胜；1853—1856 年克里木战争失败；1861 年颁布废除农奴制的法令。","point":"俄国改革的历史进程"},{"id":"x1q8","lesson":"x1l2","unit":"x1","type":"fill","level":2,"stem":"1861 年改革中，农奴获得人身自由，并可得到一份土地，但必须______，而且所付价钱远高于当时的地价。","answer":["出钱赎买","赎买","高价赎买"],"explain":"农奴获得土地必须出钱赎买，赎金远高于地价。这一规定使农民背上沉重债务，也说明改革保留了浓厚的封建残余。","point":"1861 年改革的内容"},{"id":"x1q9","lesson":"x1l3","unit":"x1","type":"choice","level":1,"stem":"19 世纪中期，美国南北矛盾的焦点是","options":["关税税率的高低","奴隶制的存废问题","西部铁路的修建","与英国的贸易逆差"],"answer":1,"explain":"北方资本主义工商业与南方种植园经济在原料、市场、关税上矛盾重重，但矛盾的焦点是奴隶制的存废问题。","point":"美国内战的原因"},{"id":"x1q10","lesson":"x1l3","unit":"x1","type":"choice","level":2,"stem":"1862 年林肯发表《解放黑人奴隶宣言》，其直接作用是","options":["宣布南方各州脱离联邦","调动黑人奴隶的积极性，扭转了战局","彻底废除了美国的种族歧视","使北方获得大量海外殖民地"],"answer":1,"explain":"宣言宣布南方叛乱各州的奴隶获得自由，调动了黑人奴隶的积极性，使战争形势发生转折。它没有废除全美国的奴隶制，也没有消除种族歧视。","point":"《解放黑人奴隶宣言》的作用"},{"id":"x1q11","lesson":"x1l3","unit":"x1","type":"order","level":2,"stem":"按时间先后排列美国内战期间的主要事件","items":["林肯当选美国总统","南方军队挑起内战","颁布《宅地法》，发表《解放黑人奴隶宣言》","葛底斯堡战役，北方取得决定性胜利","南方军队投降，内战结束"],"explain":"1860 年林肯当选；1861 年 4 月内战爆发；1862 年颁布《宅地法》和《解放黑人奴隶宣言》；1863 年葛底斯堡战役；1865 年南方投降，内战结束。","point":"美国内战的进程"},{"id":"x1q12","lesson":"x1l3","unit":"x1","type":"choice","level":3,"stem":"林肯说：“一幢裂开的房子是站立不住的。”这句话反映当时美国面临的核心问题是","options":["英国对美国的经济封锁","南北两种经济制度的矛盾使国家面临分裂","印第安人的反抗日益激烈","工业革命使美国技术落后"],"answer":1,"explain":"“裂开的房子”比喻南北两种经济制度并存、国家面临分裂的局面，其矛盾的焦点是奴隶制的存废。林肯借此强调国家不能长期处于半奴隶、半自由状态。","point":"美国内战的背景"},{"id":"x1q13","lesson":"x1l4","unit":"x1","type":"choice","level":1,"stem":"日本明治维新开始于","options":["1853 年","1854 年","1868 年","1889 年"],"answer":2,"explain":"1868 年，倒幕派推翻德川幕府，明治政府成立并开始改革。1853 年美国舰队到达日本，1854 年日本签订《日美亲善条约》，1889 年颁布《大日本帝国宪法》。","point":"明治维新的时间"},{"id":"x1q14","lesson":"x1l4","unit":"x1","type":"choice","level":2,"stem":"明治政府推行“废藩置县”的直接目的是","options":["加强中央集权","发展近代工业","建立新式军队","提倡文明开化"],"answer":0,"explain":"废藩置县废除了幕藩体制，取消藩国、设立府县，官员由中央任命，直接目的是加强中央集权。发展近代工业靠“殖产兴业”，建立新式军队靠征兵制。","point":"明治维新的政治措施"},{"id":"x1q15","lesson":"x1l4","unit":"x1","type":"match","level":2,"stem":"把下列明治维新的措施与其主要作用配对","pairs":[["废藩置县","加强中央集权"],["殖产兴业","发展近代资本主义经济"],["征兵制","建立新式军队"],["文明开化","改造教育、文化和生活方式"]],"explain":"明治维新从政治、经济、军事、社会生活四个方面推进：废藩置县强化中央，殖产兴业发展经济，征兵制建立新军，文明开化学习西方。","point":"明治维新的措施"},{"id":"x1q16","lesson":"x1l4","unit":"x1","type":"choice","level":3,"stem":"明治维新使日本迅速走上资本主义道路，但日本强大后很快走上对外侵略扩张的道路，其重要原因是","options":["明治维新保留了大量旧制度残余，军国主义色彩浓厚","日本国土狭小、资源贫乏","日本没有建立新式军队","日本没有颁布宪法"],"answer":0,"explain":"明治维新保留了大量旧制度残余，天皇制和军国主义色彩浓厚，1889 年宪法更规定天皇神圣不可侵犯。这些残余使日本强大后很快走上对外侵略扩张的道路。","point":"明治维新的局限"}],"timeline":[{"t":"19 世纪初","y":1810,"text":"拉丁美洲独立运动兴起，玻利瓦尔、圣马丁领导反抗西班牙殖民统治","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1822 年","y":1822,"text":"巴西宣布独立","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1853 年","y":1853,"text":"美国舰队到达日本，日本被迫开港通商","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1857 年","y":1857,"text":"印度民族大起义爆发，土兵首先起义","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1861 年","y":1861,"text":"俄国亚历山大二世颁布废除农奴制的法令","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1861 年","y":1861,"text":"美国内战爆发，南方军队挑起战争","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1862 年","y":1862,"text":"美国颁布《宅地法》，林肯发表《解放黑人奴隶宣言》","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1865 年","y":1865,"text":"美国内战结束，奴隶制被废除","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1868 年","y":1868,"text":"日本明治维新开始","unit":"x1","tag":"世界近代","volume":"v6"},{"t":"1889 年","y":1889,"text":"日本颁布《大日本帝国宪法》，确立君主立宪制","unit":"x1","tag":"世界近代","volume":"v6"}]},{"volume":"v6","unit":{"id":"x2","volume":"v6","num":2,"title":"第二次工业革命和近代科学文化","short":"电气时代","years":"19 世纪中—20 世纪初","accent":"#2A6559","soft":"#E0EFE9","tint":"#BBD9CF","icon":"💡","tagline":"电灯亮起，流水线转动，科学第一次跑到了生产前面。","intro":"1882 年，纽约的街道被电灯照亮；二十多年后，福特厂的流水线每几分钟就开出一辆汽车。本单元要回答三个问题：第二次工业革命为什么以科学为先导？工业化怎样改变了人口、城市和教育的面貌？牛顿、达尔文、巴尔扎克们又怎样用科学和艺术重新解释人与世界？","bigQuestion":"当科学成为生产的第一推动力，工业化究竟把人带向更自由的生活，还是新的不平等？","goals":["说出第二次工业革命的主要成就与特点。","分析垄断组织出现的原因与影响。","概括工业化带来的社会变化及问题。","列举近代科学家、文学家和艺术家的贡献。"],"keyLine":"法拉第打开电的大门，爱迪生点亮城市，本茨与莱特让机器上路飞天；福特流水线造出汽车，牛顿与达尔文改写宇宙和生命。"},"lessons":[{"id":"x2l1","num":5,"unit":"x2","title":"第二次工业革命","years":"19 世纪六七十年代—20 世纪初","icon":"⚡","tag":"工业","hook":"1879 年 10 月的一个夜晚，门罗公园的实验室忽然亮如白昼。爱迪生和助手们守着那盏灯泡，看它一秒一秒地亮下去——四十多个小时后，人类终于有了能点进家里的光。","core":"19 世纪六七十年代，第二次工业革命兴起。它以科学研究同工业生产紧密结合为突出特点，电力、内燃机、化学工业和新通信技术相继突破，人类进入“电气时代”。主要资本主义国家成为工业化强国，生产与资本日益集中，垄断组织出现，资本主义向帝国主义过渡。","points":["前提条件：19 世纪中后期，资本主义制度在世界范围内确立，市场扩大、资本积累、技术经验积累，为新技术发明提供了条件。","电力时代：1831 年法拉第发现电磁感应现象，为发电机和电动机的发明奠定基础；19 世纪 70 年代电力进入生产领域。","内燃机与交通：1876 年奥托制成煤气内燃机，1885 年本茨造出内燃机汽车，1903 年莱特兄弟试飞飞机成功。","化学与通信：1867 年诺贝尔发明现代炸药，1869 年海厄特发明赛璐珞；贝尔发明电话，马可尼试验无线电报成功。","突出特点：科学研究同工业生产紧密结合；在几个先进国家同时展开；一些国家两次工业革命交叉进行。","影响：生产力飞跃，人类进入“电气时代”；主要资本主义国家成为工业化强国；垄断组织出现，列强加紧瓜分世界。"],"terms":[["电气时代","第二次工业革命中电力广泛用于生产和生活，逐渐取代蒸汽成为主要动力，人类由此从“蒸汽时代”进入“电气时代”。"],["垄断组织","第二次工业革命中生产和资本日益集中，少数大企业联合起来控制生产与市场，形成垄断组织，资本主义向帝国主义过渡。"],["内燃机","以汽油、柴油等为燃料，在汽缸内燃烧产生动力的机器。它的发明和改进推动了汽车和飞机的问世。"],["赛璐珞","1869 年美国发明家海厄特发明的一种塑料，是早期化学工业的重要成果，可用来制造梳子、胶片等日用品。"]],"figures":[["法拉第","英国物理学家，1831 年发现电磁感应现象"],["爱迪生","美国发明家，发明耐用白炽灯泡，被誉为“发明大王”"],["本茨","德国工程师，1885 年制造出第一辆内燃机驱动的汽车"],["莱特兄弟","美国发明家，1903 年试飞飞机成功"]],"events":[["1831 年","法拉第发现电磁感应现象"],["1876 年","奥托制造出煤气内燃机"],["1879 年","爱迪生发明耐用白炽灯泡"],["1885 年","本茨制造出内燃机驱动的汽车"],["1903 年","莱特兄弟试飞飞机成功"]],"treaty":null,"significance":"第二次工业革命极大提高了生产力，人类进入“电气时代”；主要资本主义国家成为工业化强国；垄断组织形成，资本主义向帝国主义过渡，列强掀起瓜分世界狂潮，也埋下了世界大战的祸根。","source":{"quote":"天才是百分之一的灵感加百分之九十九的汗水。","from":"爱迪生语，转引自《爱迪生传》（20 世纪初）"},"pitfall":"第二次工业革命最突出的特点是科学研究同工业生产紧密结合，不是电力取代蒸汽；电力的广泛应用是成果，不是特点。","memory":"法拉第开电门，爱迪生点明灯；本茨造车莱特飞，科学领跑电气兴。","link":"上承第一次工业革命的“蒸汽时代”，下启工业化国家的社会变化与垄断的形成，是本册近代后期史的起点。","exam":["第二次工业革命的主要发明与发明家","第二次工业革命的特点与影响","垄断组织与向帝国主义过渡"]},{"id":"x2l2","num":6,"unit":"x2","title":"工业化国家的社会变化","years":"19—20 世纪","icon":"🏙","tag":"社会","hook":"1854 年，伦敦苏豪区霍乱横行。医生斯诺把死亡病例一一标在地图上，发现死者几乎都从同一口水井取水。工业化把人口吸进城市，也把脏水、烟尘和贫穷一起带了进来。","core":"工业革命推动人口迅速增长和劳动力结构变化，妇女走出家庭进入工厂；欧美国家推广大众教育，城市化进程加快。但工业化也带来环境污染、贫富分化加剧、犯罪率上升等问题。工业化既创造了前所未有的财富，也制造了新的社会矛盾。","points":["人口增长：工业革命促进生产力发展，医疗和生活条件改善，欧美国家人口迅速增长，为工业提供了充足劳动力。","劳动力结构：农业人口比重下降，工业和服务业人口上升；妇女走出家庭进入工厂，社会角色变化，但同工不同酬。","大众教育：19 世纪中期以后欧美主要国家开始推广大众教育，德国最早建立国家教育体系，英法等国逐步实行免费义务教育。","城市化：大量农村人口涌入城市，城市规模扩大；19 世纪中期以后，城市公共交通、照明和卫生设施逐步改善。","社会问题：贫富分化加剧，工人劳动时间长、工资低；环境污染严重，伦敦因烟尘弥漫被称为“雾都”；犯罪率上升。","历史评价：工业化是人类文明的巨大进步，但代价主要由底层劳动者承担，这推动各国进行社会立法和城市治理。"],"terms":[["城市化","随着工业化推进，大量农村人口迁入城市，城市规模扩大、人口增加，城市逐渐成为社会经济生活的中心。"],["大众教育","19 世纪中期以后欧美国家面向普通民众推行的教育，由国家承担办学责任，逐步实行免费义务教育。"],["劳动力结构","指就业人口在农业、工业、服务业等产业中的分布比例。工业化使农业人口比重下降，工业和服务业人口上升。"],["雾都","19 世纪伦敦因工厂和居民大量燃煤、烟尘弥漫而得到的名号，反映了工业化带来的严重环境污染。"]],"figures":[["恩格斯","深入曼彻斯特工人区调查，在《英国工人阶级状况》中揭露工人的贫困"],["狄更斯","英国作家，作品描写工业时代的城市与底层人生"],["斯诺","英国医生，1854 年用地图追查霍乱水源，推动城市公共卫生改革"]],"events":[["19 世纪中期","欧美主要国家开始推广大众教育"],["19 世纪中期","伦敦等工业城市烟尘弥漫，被称为“雾都”"],["19 世纪中期以后","城市公共交通、照明和卫生设施逐步改善"],["1870 年以后","英国、法国等逐步对儿童实行免费义务教育"]],"treaty":null,"significance":"工业化使社会面貌发生巨大变化：人口增长、教育普及、城市化推进，人类生活水平总体提高；但贫富分化、环境污染和城市问题也随之而来。这些矛盾促使各国进行社会立法和城市治理，也推动工人为争取权利而斗争。","source":{"quote":"这是最好的时代，这是最坏的时代；这是智慧的年代，这是愚蠢的年代。","from":"狄更斯《双城记》（1859 年）"},"pitfall":"人口增长是工业革命的结果，不是工业革命的原因；城市化早期问题严重，但不能因此否定工业化推动社会进步的总趋势。","memory":"人口涨、农转工，妇女进厂读书声；城市亮起也脏乱，贫富两分雾都中。","link":"承接第二次工业革命的技术成果，说明工业化怎样重塑人口、城市与教育，为下一单元大战前的社会矛盾埋下伏笔。","exam":["工业革命带来的社会变化","城市化进程及其问题","大众教育的兴起与作用"]},{"id":"x2l3","num":7,"unit":"x2","title":"近代科学与文化","years":"16—20 世纪","icon":"🔬","tag":"文化","hook":"1687 年，一本拉丁文厚书在伦敦出版。书里没有一台仪器，却用几条定律把苹果落地和行星运行写进了同一个公式。作者是 44 岁的牛顿。","core":"17 世纪以来，近代科学在数学、物理、生物等领域取得突破：牛顿建立经典力学体系，达尔文提出进化论。与此同时，巴尔扎克、托尔斯泰用小说再现社会，贝多芬、梵高用音乐和绘画表达人的情感。科学和文艺共同塑造了近代人的世界观。","points":["背景：资本主义经济发展和思想解放，使人们敢于用观察、实验和理性解释自然，近代科学逐渐摆脱神学束缚。","牛顿：发现万有引力定律，创立微积分，1687 年出版《自然哲学的数学原理》，标志经典力学体系的建立。","达尔文：1859 年出版《物种起源》，提出进化论，认为生物由低等到高等不断进化，打破“神创论”和物种不变论。","文学：巴尔扎克创作《人间喜剧》，包括《高老头》等；托尔斯泰著《战争与和平》《复活》，被列宁称为“俄国革命的镜子”。","音乐与美术：贝多芬 1804 年完成《英雄交响曲》，表达对自由、平等、博爱的渴望；梵高代表作《向日葵》色彩浓烈。","影响：近代科学削弱了神学权威，改变人们对宇宙和生命的认识；文学艺术从写神转向写人，丰富了精神世界。"],"terms":[["经典力学","牛顿建立的力学体系，以万有引力定律和运动三定律为核心，1687 年《自然哲学的数学原理》的出版标志其形成。"],["进化论","达尔文在《物种起源》中提出的学说，认为生物由低等到高等、由简单到复杂不断进化，自然选择起重要作用。"],["《人间喜剧》","巴尔扎克创作的小说总集，包括《高老头》《欧也妮·葛朗台》等九十多部作品，再现法国 19 世纪上半叶的社会图景。"],["《英雄交响曲》","贝多芬 1804 年完成的交响曲，表达对自由、平等和博爱的渴望，标志其音乐创作的成熟。"]],"figures":[["牛顿","英国科学家，建立经典力学体系，著《自然哲学的数学原理》"],["达尔文","英国生物学家，著《物种起源》，提出进化论"],["巴尔扎克","法国作家，创作小说总集《人间喜剧》"],["贝多芬","德国音乐家，创作《英雄交响曲》"]],"events":[["1687 年","牛顿出版《自然哲学的数学原理》"],["1804 年","贝多芬完成《英雄交响曲》"],["1859 年","达尔文出版《物种起源》"],["1888 年","梵高创作《向日葵》"]],"treaty":null,"significance":"近代科学以实验和理性为武器，动摇了神学对自然的解释，也为工业革命提供了理论基础；现实主义文学和浪漫主义艺术记录了工业化时代人的处境与情感，共同构成近代精神文明的重要部分。","source":{"quote":"如果我看得更远，那是因为我站在巨人的肩膀上。","from":"牛顿致胡克信（1676 年）"},"pitfall":"牛顿的成就是建立经典力学体系，不是发明蒸汽机；达尔文的进化论讲生物进化，不是社会进化，不能被用来为种族歧视辩护。","memory":"牛顿苹果落地球，达尔文物种竞天择；巴尔扎克写人间，贝多芬唱英雄歌。","link":"在第二次工业革命的技术成就之后，回看支撑这些成就的科学理论与人文精神，完成本单元“技术—社会—文化”的闭环。","exam":["牛顿、达尔文的主要成就","《物种起源》与进化论的意义","近代文学艺术代表作及作者"]}],"questions":[{"id":"x2q1","lesson":"x2l1","unit":"x2","type":"choice","level":1,"stem":"第二次工业革命最突出的特点是","options":["电力的广泛应用","科学研究同工业生产紧密结合","内燃机的发明和使用","垄断组织的形成"],"answer":1,"explain":"教材强调，第二次工业革命中自然科学的新发展同工业生产紧密结合，科学成为生产的第一推动力。电力和内燃机是主要成就，垄断组织是革命造成的影响。","point":"第二次工业革命的特点"},{"id":"x2q2","lesson":"x2l1","unit":"x2","type":"choice","level":1,"stem":"1885 年，制造出世界上第一辆内燃机驱动的汽车的是","options":["爱迪生","本茨","莱特兄弟","福特"],"answer":1,"explain":"德国工程师本茨在 1885 年制造出第一辆内燃机驱动的汽车。福特在 1913 年使用流水线生产汽车；莱特兄弟在 1903 年试飞飞机；爱迪生的代表成就是电灯。","point":"内燃机与交通工具的发明"},{"id":"x2q3","lesson":"x2l1","unit":"x2","type":"order","level":2,"stem":"把下列第二次工业革命的成果按出现时间先后排序","items":["法拉第发现电磁感应现象","爱迪生发明耐用白炽灯泡","本茨制造出内燃机驱动的汽车","莱特兄弟试飞飞机成功"],"explain":"1831 年法拉第发现电磁感应，1879 年爱迪生发明耐用白炽灯泡，1885 年本茨造出内燃机汽车，1903 年莱特兄弟试飞飞机成功。","point":"第二次工业革命的时间线索"},{"id":"x2q4","lesson":"x2l1","unit":"x2","type":"fill","level":3,"stem":"1876 年，德国人______制造出煤气内燃机，为汽车和飞机的发明提供了条件。","answer":["奥托","尼古拉斯·奥托"],"explain":"1876 年德国人奥托制造出煤气内燃机；1883 年戴姆勒研制出汽油内燃机，1892 年狄塞尔发明柴油内燃机，内燃机由此推动汽车和飞机的问世。","point":"内燃机的发明"},{"id":"x2q5","lesson":"x2l2","unit":"x2","type":"choice","level":1,"stem":"19 世纪中期以后，欧美主要国家推广大众教育，其重要作用是","options":["使工厂不再使用童工","提高了国民素质，促进了社会发展","消除了社会贫富差距","使农业人口迅速增加"],"answer":1,"explain":"推广大众教育提高了欧美国家国民的素质，适应了工业化对劳动者的要求，促进了社会发展。它没有也不可能消除贫富差距，也不会使农业人口增加。","point":"大众教育的兴起"},{"id":"x2q6","lesson":"x2l2","unit":"x2","type":"choice","level":2,"stem":"19 世纪中期，伦敦因工厂和居民大量燃煤而烟尘弥漫，被称为“雾都”；工人聚居的贫民窟拥挤肮脏。这一现象反映出工业化","options":["只带来了环境污染","造成了环境污染和贫富分化","使城市人口迅速减少","阻碍了交通事业的发展"],"answer":1,"explain":"“雾都”反映环境污染，贫民窟反映贫富分化和城市问题。工业化还带来人口增长、城市化等变化，说“只带来环境污染”过于片面；工业化恰恰推动了城市人口增长和交通发展。","point":"工业化的社会问题"},{"id":"x2q7","lesson":"x2l2","unit":"x2","type":"match","level":2,"stem":"把下列工业化带来的变化与其影响配对","pairs":[["人口迅速增长","为工业发展提供劳动力和市场"],["妇女走进工厂","社会角色变化，但同工不同酬"],["大众教育推广","国民素质提高"],["农村人口涌入城市","城市规模不断扩大"]],"explain":"工业革命推动人口增长和劳动力结构变化，妇女走出家庭进入工厂，大众教育提高国民素质，农村人口涌入城市推动城市化。","point":"工业化的社会影响"},{"id":"x2q8","lesson":"x2l2","unit":"x2","type":"choice","level":3,"stem":"恩格斯在《英国工人阶级状况》中描述曼彻斯特：工厂主住在城郊的别墅里，工人却挤在工厂旁的贫民窟。这一现象表明","options":["工业革命消除了城乡差别","工业化加剧了社会贫富分化","工人的生活水平全面下降","城市化阻碍了工业发展"],"answer":1,"explain":"工厂主与工人居住环境的巨大反差，说明工业化在创造财富的同时加剧了贫富分化。工业革命并未消除城乡差别，工人生活水平总体有所提高但相对贫困加重，城市化则推动了工业发展。","point":"工业化与贫富分化"},{"id":"x2q9","lesson":"x2l3","unit":"x2","type":"choice","level":1,"stem":"1859 年，达尔文出版《物种起源》，提出进化论。这一学说的主要意义是","options":["证明了上帝创造万物","打破了“神创论”和物种不变论","建立了经典力学体系","推动了蒸汽机的发明"],"answer":1,"explain":"进化论认为生物由低等到高等不断进化，直接冲击了“神创论”和物种不变论，是生物科学的一次伟大革命。建立经典力学体系的是牛顿。","point":"达尔文与进化论"},{"id":"x2q10","lesson":"x2l3","unit":"x2","type":"choice","level":2,"stem":"贝多芬 1804 年完成的《英雄交响曲》，其表达的主题是","options":["对教会权威的赞美","对自由、平等和博爱的渴望","对工业城市的批判","对殖民扩张的歌颂"],"answer":1,"explain":"《英雄交响曲》表达了贝多芬对自由、平等和博爱的渴望，标志着他音乐创作的成熟，也体现了法国大革命时期追求自由的精神。","point":"贝多芬与《英雄交响曲》"},{"id":"x2q11","lesson":"x2l3","unit":"x2","type":"order","level":3,"stem":"把下列近代科学与文化成果按出现时间先后排序","items":["牛顿出版《自然哲学的数学原理》","贝多芬完成《英雄交响曲》","巴尔扎克创作《高老头》","达尔文出版《物种起源》","梵高创作《向日葵》"],"explain":"1687 年牛顿出版《自然哲学的数学原理》，1804 年贝多芬完成《英雄交响曲》，1835 年巴尔扎克创作《高老头》，1859 年达尔文出版《物种起源》，1888 年梵高创作《向日葵》。","point":"近代科学与文化的时间线索"},{"id":"x2q12","lesson":"x2l3","unit":"x2","type":"fill","level":2,"stem":"法国作家巴尔扎克创作的小说总集《______》，包括《高老头》《欧也妮·葛朗台》等，再现了法国 19 世纪上半叶的社会图景。","answer":["人间喜剧","《人间喜剧》"],"explain":"《人间喜剧》是巴尔扎克创作的小说总集，被誉为法国 19 世纪上半叶社会生活的百科全书，巴尔扎克是法国现实主义文学大师。","point":"巴尔扎克与《人间喜剧》"}],"timeline":[{"t":"1687 年","y":1687,"text":"牛顿出版《自然哲学的数学原理》，经典力学体系形成","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1804 年","y":1804,"text":"贝多芬完成《英雄交响曲》，表达对自由、平等和博爱的渴望","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1831 年","y":1831,"text":"法拉第发现电磁感应现象，为发电机和电动机的发明奠定基础","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1859 年","y":1859,"text":"达尔文出版《物种起源》，提出进化论","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1867 年","y":1867,"text":"诺贝尔发明现代炸药，化学工业取得重要突破","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1879 年","y":1879,"text":"爱迪生发明耐用的白炽灯泡，电灯走进千家万户","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1885 年","y":1885,"text":"本茨制造出第一辆内燃机驱动的汽车","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1892 年","y":1892,"text":"狄塞尔发明柴油内燃机，内燃机的应用更加广泛","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1903 年","y":1903,"text":"莱特兄弟试飞飞机成功，人类实现动力飞行","unit":"x2","tag":"世界近代","volume":"v6"},{"t":"1913 年","y":1913,"text":"福特汽车公司使用流水线生产汽车，汽车逐渐普及","unit":"x2","tag":"世界近代","volume":"v6"}]},{"volume":"v6","unit":{"id":"x3","volume":"v6","num":3,"title":"第一次世界大战和战后初期的世界","short":"一战与革命","years":"1914—1939 年","accent":"#2C6E66","soft":"#E1F0EB","tint":"#BDDBD3","icon":"🌍","tagline":"炮火打碎旧世界，革命催生新国家，条约拼出短暂和平","intro":"1914 年，萨拉热窝的几声枪响把整个欧洲拖进战壕；四年后，旧帝国崩塌，革命在俄国爆发，战胜国在巴黎和华盛顿重新划分世界。本单元要回答三个问题：一场大战怎样打碎了 19 世纪的秩序？战后建立的新秩序为什么只维持了二十年？社会主义与民族解放这两股新力量，怎样在这一时期生长起来？","bigQuestion":"一场把欧洲拖进深渊的战争，为什么在胜利之后立刻埋下了新的战争？","goals":["说出第一次世界大战的原因、进程与影响","理解十月革命的意义与苏维埃政权的建立","分析凡尔赛—华盛顿体系的实质与隐患","比较苏联建设道路与亚非拉民族民主运动"],"keyLine":"1914 年萨拉热窝的枪声 → 1917 年彼得格勒的起义 → 1919 年凡尔赛宫的签字 → 1922 年华盛顿的条约 → 1936 年苏联新宪法"},"lessons":[{"id":"x3l1","num":8,"unit":"x3","title":"第一次世界大战","years":"1914—1918 年","icon":"💥","tag":"一战","hook":"1914 年 6 月 28 日，萨拉热窝街头，一辆敞篷汽车拐错了方向，正好停在刺客面前。几声枪响，奥匈帝国皇储倒在血泊里，欧洲的火药桶被点燃了。","core":"19 世纪末 20 世纪初，帝国主义国家政治经济发展不平衡，为争夺霸权和殖民地结成两大军事集团。1914 年萨拉热窝事件点燃战火，大战持续四年多，1918 年以同盟国失败告终。这是一场非正义的帝国主义战争，深刻改变了世界格局。","points":["背景：第二次工业革命后，主要资本主义国家进入帝国主义阶段，政治经济发展不平衡，后起的德国要求重新瓜分世界。","两大集团：德国、奥匈帝国、意大利组成三国同盟；英国、法国、俄国组成三国协约，双方疯狂扩军备战。","导火线：1914 年 6 月 28 日萨拉热窝事件；7 月 28 日奥匈帝国对塞尔维亚宣战，第一次世界大战爆发。","进程：西线是决定性战场；1916 年凡尔登战役伤亡七十多万人，被称为“绞肉机”，成为一战的转折点。","1917 年美国参战，协约国实力增强；俄国十月革命后退出战争；1918 年 11 月德国投降，战争结束。","影响：30 多个国家、约 15 亿人口卷入，伤亡 3000 多万；欧洲被削弱，美日崛起，民族解放运动高涨。"],"terms":[["三国同盟","德国、奥匈帝国、意大利组成的军事集团，核心是德国；意大利后来倒向协约国一方。"],["萨拉热窝事件","1914 年 6 月 28 日，奥匈帝国皇储在萨拉热窝被塞尔维亚青年刺杀，成为一战的导火线。"],["凡尔登战役","1916 年德法两军在凡尔登反复争夺，伤亡七十多万人，被称为“凡尔登绞肉机”，是一战的转折点。"],["帝国主义战争","交战双方都为争夺霸权和殖民地而战，是非正义的掠夺战争，给各国人民带来深重灾难。"]],"figures":[["威廉二世","德国皇帝，推行“世界政策”，支持奥匈并对俄法宣战"],["斐迪南大公","奥匈帝国皇储，1914 年在萨拉热窝被刺杀"],["威尔逊","美国总统，1917 年推动美国参加协约国一方作战"]],"events":[["1914.6","萨拉热窝事件"],["1914.7","奥匈对塞尔维亚宣战，大战爆发"],["1916","凡尔登战役"],["1917","美国参战"],["1918.11","德国投降，一战结束"]],"treaty":null,"significance":"一战历时四年多，给人类带来空前灾难，削弱了帝国主义和殖民主义力量，动摇了欧洲的世界优势地位；它促进了殖民地半殖民地人民的民族觉醒，也推动了俄国十月革命的胜利，世界历史由此进入新阶段。","source":{"quote":"整个欧洲的灯光正在熄灭，我们此生将不会看到它们重新点亮。","from":"英国外交大臣格雷（1914 年 8 月 3 日）"},"pitfall":"一战根本原因是帝国主义政治经济发展不平衡，萨拉热窝事件只是导火线；凡尔登战役是一战的转折点，不是结束标志。","memory":"三国同盟对协约，萨拉热窝点战火；凡尔登前绞肉机，一九一八同盟降。","link":"一战打乱了旧秩序，为俄国十月革命和战后的凡尔赛—华盛顿体系埋下伏笔，是本单元的总起点。","exam":["一战爆发的原因与性质","凡尔登战役与一战进程","一战对世界格局的影响"]},{"id":"x3l2","num":9,"unit":"x3","title":"列宁与十月革命","years":"1917 年","icon":"🚩","tag":"俄国","hook":"1917 年 11 月 7 日夜，彼得格勒冬宫外的广场上，起义的士兵和工人越过街垒。这座沙皇的宫殿，几个小时后就要换主人了。","core":"一战激化了俄国社会矛盾。1917 年二月革命推翻沙皇专制，形成临时政府与工兵代表苏维埃并存的局面；列宁提出《四月提纲》，指明社会主义革命方向。11 月 7 日彼得格勒武装起义胜利，十月革命建立了世界上第一个无产阶级专政国家。","points":["背景：俄国是帝国主义链条上最薄弱的环节，一战使经济濒临崩溃、社会矛盾激化，革命形势逐渐成熟。","二月革命：1917 年 3 月，彼得格勒工人和士兵起义，推翻罗曼诺夫王朝，形成两个政权并存的局面。","方向：列宁发表《四月提纲》，提出从资产阶级民主革命向社会主义革命过渡，全部政权归苏维埃。","起义：1917 年 11 月 7 日，彼得格勒武装起义，攻占冬宫，推翻资产阶级临时政府。","建政：全俄工兵代表苏维埃第二次代表大会通过《和平法令》《土地法令》，成立人民委员会，列宁任主席。","巩固：1918—1920 年粉碎国内反动势力和外国干涉，实行战时共产主义政策，保卫了新生政权。"],"terms":[["二月革命","1917 年 3 月俄国爆发的资产阶级民主革命，推翻沙皇专制统治，形成两个政权并存的局面。"],["《四月提纲》","列宁 1917 年 4 月提出的革命纲领，主张从资产阶级民主革命过渡到社会主义革命，全部政权归苏维埃。"],["《和平法令》","苏维埃政府颁布的第一个对外政策文件，宣布退出一战，缔结不割地、不赔款的和平。"],["战时共产主义政策","国内战争时期实行的非常政策，实行余粮收集制、工业国有化、取消自由贸易，集中力量战胜敌人。"]],"figures":[["列宁","领导十月革命，任人民委员会主席，提出《四月提纲》"],["尼古拉二世","俄国末代沙皇，二月革命中被推翻"],["克伦斯基","资产阶级临时政府总理，十月革命中被推翻"]],"events":[["1917.3","二月革命推翻沙皇统治"],["1917.4","列宁发表《四月提纲》"],["1917.11","彼得格勒武装起义，十月革命胜利"],["1918—1920","国内战争，保卫苏维埃政权"]],"treaty":null,"significance":"十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政国家；它打击了帝国主义的统治，推动了国际无产阶级革命运动和殖民地半殖民地人民的解放斗争，开辟了人类历史的新纪元。","source":{"quote":"目前俄国的特点是从革命的第一阶段过渡到革命的第二阶段……使政权转到无产阶级和贫苦农民手中。","from":"列宁《四月提纲》（1917 年 4 月）"},"pitfall":"二月革命推翻沙皇专制，是资产阶级民主革命；十月革命推翻资产阶级临时政府，是社会主义革命，两者不能混淆。","memory":"二月推倒沙皇帝，两个政权同台立；四月提纲指方向，十月冬宫红旗起。","link":"十月革命使俄国退出一战，也让社会主义从理论变为现实，与战后苏联的社会主义建设直接相连。","exam":["十月革命的历史意义","二月革命与十月革命的比较","苏维埃政权的建立与巩固"]},{"id":"x3l3","num":10,"unit":"x3","title":"《凡尔赛条约》和《九国公约》","years":"1919—1922 年","icon":"📜","tag":"外交","hook":"1919 年 1 月，巴黎近郊的法国外交部大厅里，二十七个国家的代表围坐。战败国不许入场，中国代表坐在角落里，等待别人替自己决定山东的命运。","core":"1919 年巴黎和会签订《凡尔赛条约》，与战败国的一系列条约构成凡尔赛体系，确立欧洲、西亚、非洲的新秩序；1921—1922 年华盛顿会议签订《九国公约》，构成华盛顿体系。凡尔赛—华盛顿体系暂时调整了帝国主义关系，却埋下更深的矛盾。","points":["巴黎和会：1919 年 1—6 月，战胜国在巴黎开会，实际由英、法、美三国操纵，是一场帝国主义的分赃会议。","《凡尔赛条约》：从领土、军事、政治、赔款、殖民地五方面严惩德国，德国失去全部海外殖民地。","凡尔赛体系：1919—1920 年协约国又同奥地利、匈牙利、保加利亚、土耳其签约，确立欧洲、西亚、非洲的统治秩序。","国际联盟：1920 年 1 月成立，标榜维护和平、制裁侵略，实际被英法操纵，美国没有加入。","华盛顿会议：1921—1922 年九国参加，签订《九国公约》，宣称尊重中国主权，实际使中国回到列强共同支配的局面。","评价：凡尔赛—华盛顿体系暂时缓和了列强矛盾，但没有消除它们之间的根本分歧，不可能长期维持。"],"terms":[["凡尔赛体系","1919—1920 年协约国与战败国签订一系列条约构成的国际关系体系，确立了欧洲、西亚和非洲的统治秩序。"],["国际联盟","1920 年成立的国际组织，标榜维护世界和平，实际被英法操纵，美国未加入，缺乏普遍性和权威性。"],["《九国公约》","1922 年华盛顿会议签订，宣称尊重中国的主权、独立与领土完整，实际使中国回到几个帝国主义国家共同支配的局面。"],["凡尔赛—华盛顿体系","一战后帝国主义国家通过巴黎和会和华盛顿会议建立的国际新秩序，暂时调整了关系，但矛盾重重、不能持久。"]],"figures":[["克里孟梭","法国总理，主张严惩德国，巴黎和会三巨头之一"],["劳合·乔治","英国首相，主张削弱德国又保留其牵制法国，三巨头之一"],["威尔逊","美国总统，提出“十四点原则”，主张建立国际联盟"]],"events":[["1919.1","巴黎和会开幕"],["1919.6","《凡尔赛条约》签订"],["1920.1","国际联盟成立"],["1921—1922","华盛顿会议召开"],["1922","《九国公约》签订"]],"treaty":{"name":"《凡尔赛条约》和《九国公约》","date":"1919 年 6 月、1922 年 2 月","items":["《凡尔赛条约》：阿尔萨斯—洛林归还法国，萨尔煤矿交法国开采 15 年","《凡尔赛条约》：德国陆军不得超过 10 万人，不得拥有空军和潜艇","《凡尔赛条约》：德国海外殖民地由英、法、日、比等国以“委任统治”形式瓜分","《凡尔赛条约》：德国支付巨额赔款，并承担战争罪责","《九国公约》：宣称尊重中国的主权、独立与领土完整","《九国公约》：确立各国在中国“门户开放”“机会均等”的原则"],"note":"中国在巴黎和会上要求收回山东权益被拒，引发五四运动；《九国公约》表面上尊重中国，实际上使中国重回列强共同支配的局面。"},"significance":"凡尔赛—华盛顿体系确立了战后帝国主义的国际新秩序，暂时缓和了列强矛盾，却没有消除战胜国与战败国、殖民国家与被压迫民族之间的深刻矛盾，反而为新的战争埋下祸根。","source":{"quote":"德国应承担因德国及其盟国的侵略而强加于协约国及其参战各国政府的一切损失和损害的责任。","from":"《凡尔赛条约》第 231 条（1919 年 6 月）"},"pitfall":"巴黎和会被英法美操纵，美国没有加入国际联盟；《九国公约》不是维护中国主权，而是使中国回到列强共同支配的局面。","memory":"巴黎和会分赃忙，凡尔赛约压德强；华盛顿开九国约，中国权益又遭殃。","link":"一战的结局由这两场会议写成，体系的不公正是二战爆发的重要根源，也为亚非拉民族运动的高涨提供了背景。","exam":["《凡尔赛条约》的内容与影响","《九国公约》的实质","凡尔赛—华盛顿体系的评价"]},{"id":"x3l4","num":11,"unit":"x3","title":"苏联的社会主义建设","years":"1921—1937 年","icon":"🏭","tag":"苏联","hook":"1921 年春，喀琅施塔得的水兵哗变。饥荒、疲惫和不满逼着列宁承认：用战时的办法直接过渡到社会主义，这条路走不通了。","core":"1921 年苏俄开始实行新经济政策，利用市场和商品货币关系恢复经济，1925 年国民经济基本恢复。1922 年苏联成立。此后在斯大林领导下实行社会主义工业化和农业集体化，1936 年新宪法宣告社会主义制度建立，形成高度集中的苏联模式。","points":["新经济政策：1921 年开始，以粮食税代替余粮收集制，允许自由贸易、私人经营中小企业，实行按劳分配。","成效：调动了生产者的积极性，迅速缓解危机，1925 年国民经济恢复到战前水平，工农联盟得到巩固。","苏联成立：1922 年底，俄罗斯、乌克兰、白俄罗斯和外高加索联邦组成苏维埃社会主义共和国联盟。","工业化：1925 年提出社会主义工业化方针，1928 年起实施两个五年计划，重点发展重工业。","农业集体化：1929 年起大规模推行，建立集体农庄，消灭富农，为工业化提供粮食和资金。","苏联模式：1936 年新宪法宣告社会主义制度建立，高度集中的计划经济与高度集权的政治体制定型，工业总产值跃居欧洲第一。"],"terms":[["新经济政策","1921 年苏俄开始实行的政策，用粮食税代替余粮收集制，允许多种经济成分并存，利用市场恢复经济。"],["苏联模式","又称斯大林模式，以高度集中的计划经济体制和高度集权的政治体制为特征，1936 年新宪法颁布后正式确立。"],["农业集体化","20 世纪 30 年代苏联把个体农民组织成集体农庄的运动，为工业化提供粮食和资金，但损害了农民利益。"],["五年计划","苏联从 1928 年起编制的国民经济计划，集中力量发展重工业，使苏联迅速实现工业化。"]],"figures":[["列宁","实行新经济政策，探索在小农国家建设社会主义的道路"],["斯大林","领导社会主义工业化和农业集体化，确立苏联模式"]],"events":[["1921","开始实行新经济政策"],["1922","苏联成立"],["1925","提出社会主义工业化方针"],["1928","第一个五年计划开始"],["1936","新宪法宣告社会主义制度建立"]],"treaty":null,"significance":"新经济政策是列宁对小农国家如何建设社会主义的有益探索；苏联模式使苏联在较短时间内实现工业化，为后来反法西斯战争的胜利奠定物质基础，但片面发展重工业、权力过分集中，弊端长期积累。","source":{"quote":"我们原打算直接用无产阶级国家的法令，在一个小农国家里按共产主义原则来调整生产……现实生活说明我们犯了错误。","from":"列宁《十月革命四周年》（1921 年 10 月）"},"pitfall":"新经济政策不是恢复资本主义，而是在国家掌握经济命脉的前提下利用市场；苏联模式形成的标志是 1936 年新宪法。","memory":"二一改行粮食税，市场活跃经济回；二二联盟初结成，三六宪法模式定。","link":"十月革命建立了苏维埃政权，新经济政策与苏联模式是这个政权在经济上的两种选择，也埋下了后来苏联改革的难题。","exam":["新经济政策的内容与作用","苏联模式的特征与评价","苏联工业化的成就与问题"]},{"id":"x3l5","num":12,"unit":"x3","title":"亚非拉民族民主运动的高涨","years":"20 世纪上半叶","icon":"✊","tag":"民族","hook":"1930 年 3 月，甘地带着几十名追随者从修道院出发，步行三百多公里走向海边。他要做的只是捧起一把海水煮盐，却让整个英属印度紧张起来。","core":"第一次世界大战削弱了帝国主义力量，也唤醒了殖民地半殖民地人民。印度甘地领导非暴力不合作运动，埃及华夫脱运动迫使英国承认埃及独立，墨西哥卡德纳斯改革推进民族民主进程。这些运动方式不同、结果不同，却共同冲击了殖民体系。","points":["背景：一战中列强把殖民地拖入战争，战后民族工业有所发展，民族资产阶级和无产阶级壮大，民族民主意识增强。","印度：1920 年甘地领导第一次非暴力不合作运动，抵制英国货物、学校与法庭，1930 年发起“食盐进军”。","印度影响：动员了广大群众，打击了英国殖民统治，增强了印度人民的民族自尊心，但非暴力方式限制了斗争深入。","埃及：1919 年华夫脱党领导反英运动，1922 年英国被迫承认埃及独立，但仍保留控制苏伊士运河等特权。","墨西哥：1910—1917 年资产阶级革命后颁布 1917 年宪法；1934 年起卡德纳斯推行土地改革、发展教育、石油国有化。","特点：范围广、规模大、方式多样，从和平抵制到武装斗争，打击了殖民统治，为战后民族解放运动奠定基础。"],"terms":[["非暴力不合作","甘地领导的印度民族解放运动方式，主张用和平抵制、不合作的手段反对英国殖民统治，不使用暴力。"],["食盐进军","1930 年甘地率众步行到海边煮盐，公开反抗英国食盐专卖法，把印度非暴力不合作运动推向高潮。"],["华夫脱运动","1919 年埃及华夫脱党领导的争取民族独立的运动，迫使英国于 1922 年承认埃及独立。"],["卡德纳斯改革","1934 年起墨西哥总统卡德纳斯推行的改革，实行土地改革、发展教育、将石油收归国有，推进民族民主进程。"]],"figures":[["甘地","印度民族解放运动领袖，倡导非暴力不合作，被称为“圣雄”"],["扎格鲁尔","埃及华夫脱党领袖，领导 1919 年反英运动"],["卡德纳斯","墨西哥总统，1934 年起推行改革，实行石油国有化"]],"events":[["1919","埃及华夫脱运动兴起"],["1920","甘地领导第一次非暴力不合作运动"],["1922","英国承认埃及独立"],["1930","甘地发起“食盐进军”"],["1934","墨西哥卡德纳斯改革开始"]],"treaty":null,"significance":"亚非拉民族民主运动的高涨，说明一战后的世界秩序并没有给被压迫民族带来公正；这些运动打击了殖民统治，积累了斗争经验，为二战后民族解放运动的全面胜利准备了条件。","source":{"quote":"我从穷人的立场看，盐税是一切税收中最不公正的。","from":"甘地《致欧文总督的信》（1930 年 3 月）"},"pitfall":"非暴力不合作不是放弃斗争，而是以和平方式抵制英国统治；埃及 1922 年只是名义独立，英国仍保留特权。","memory":"甘地纺车抵英货，食盐进军海边走；华夫脱争埃及立，卡德纳斯改墨西哥。","link":"一战的创伤与凡尔赛体系的不公，激起亚非拉的民族觉醒；这股力量在二战后汇成民族解放的洪流。","exam":["甘地非暴力不合作运动","埃及华夫脱运动与 1922 年独立","卡德纳斯改革的内容与性质"]}],"questions":[{"id":"x3q1","lesson":"x3l1","unit":"x3","type":"choice","level":1,"stem":"1914 年 6 月 28 日，奥匈帝国皇储在萨拉热窝被刺杀。这一事件成为第一次世界大战的","options":["根本原因","导火线","转折点","结束标志"],"answer":1,"explain":"萨拉热窝事件是一战的导火线。根本原因是帝国主义国家政治经济发展不平衡，争夺霸权和殖民地；1916 年凡尔登战役是一战的转折点；1918 年 11 月德国投降标志一战结束。","point":"第一次世界大战的爆发"},{"id":"x3q2","lesson":"x3l1","unit":"x3","type":"choice","level":2,"stem":"1916 年，德法两军在凡尔登投入上百万兵力，伤亡七十多万人。这场被称为“绞肉机”的战役","options":["标志第一次世界大战爆发","是第一次世界大战的转折点","标志第一次世界大战结束","标志德国宣布投降"],"answer":1,"explain":"凡尔登战役是一战的转折点，此后德军的进攻能力大大削弱。一战爆发于 1914 年 7 月，结束于 1918 年 11 月德国投降。","point":"凡尔登战役"},{"id":"x3q3","lesson":"x3l1","unit":"x3","type":"order","level":2,"stem":"按时间先后排列第一次世界大战中的事件","items":["萨拉热窝事件","奥匈帝国对塞尔维亚宣战","凡尔登战役","美国参战","德国投降"],"explain":"1914 年 6 月发生萨拉热窝事件，7 月奥匈对塞尔维亚宣战；1916 年凡尔登战役；1917 年美国参战；1918 年 11 月德国投降，一战结束。","point":"第一次世界大战的进程"},{"id":"x3q4","lesson":"x3l1","unit":"x3","type":"fill","level":1,"stem":"1914 年 7 月，奥匈帝国以______事件为借口，对塞尔维亚宣战，第一次世界大战爆发。","answer":["萨拉热窝","萨拉热窝事件"],"explain":"1914 年 6 月 28 日萨拉热窝事件发生后，奥匈帝国在德国支持下于 7 月 28 日对塞尔维亚宣战，大战由此爆发。","point":"第一次世界大战的导火线"},{"id":"x3q5","lesson":"x3l2","unit":"x3","type":"choice","level":1,"stem":"1917 年 11 月 7 日，彼得格勒武装起义取得胜利。这场革命推翻的是","options":["沙皇专制统治","资产阶级临时政府","工兵代表苏维埃","外国武装干涉军"],"answer":1,"explain":"十月革命推翻的是资产阶级临时政府。推翻沙皇专制统治的是 1917 年 3 月的二月革命；苏维埃是革命后建立的政权机关。","point":"十月革命的胜利"},{"id":"x3q6","lesson":"x3l2","unit":"x3","type":"choice","level":2,"stem":"俄国出现资产阶级临时政府和工兵代表苏维埃两个政权并存的局面，是在","options":["二月革命后","十月革命后","国内战争结束后","新经济政策实施后"],"answer":0,"explain":"二月革命推翻沙皇专制后，俄国出现了资产阶级临时政府和工兵代表苏维埃两个政权并存的局面。十月革命推翻了临时政府，两个政权并存的局面结束。","point":"二月革命后的俄国局势"},{"id":"x3q7","lesson":"x3l2","unit":"x3","type":"match","level":2,"stem":"把俄国十月革命前后的史事与其意义配对","pairs":[["二月革命","推翻沙皇专制统治，形成两个政权并存的局面"],["《四月提纲》","提出从资产阶级民主革命向社会主义革命过渡"],["《和平法令》","宣布退出一战，缔结不割地、不赔款的和平"],["《土地法令》","废除土地私有制，把土地分给农民耕种"]],"explain":"二月革命推翻沙皇；《四月提纲》解决革命方向问题；苏维埃政权成立后通过《和平法令》退出战争，通过《土地法令》满足农民的土地要求。","point":"十月革命前后的重要文献"},{"id":"x3q8","lesson":"x3l2","unit":"x3","type":"fill","level":2,"stem":"1917 年 11 月，全俄工兵代表苏维埃第二次代表大会决定成立人民委员会，______当选为主席。","answer":["列宁","列宁同志"],"explain":"十月革命胜利后，全俄工兵代表苏维埃第二次代表大会成立人民委员会，列宁当选为主席，世界上第一个无产阶级专政国家诞生。","point":"苏维埃政权的建立"},{"id":"x3q9","lesson":"x3l3","unit":"x3","type":"choice","level":1,"stem":"1919 年召开的巴黎和会，实际操纵会议的是","options":["英、法、美三国","英、法、俄三国","美、日、意三国","德、奥、俄三国"],"answer":0,"explain":"巴黎和会由英国首相劳合·乔治、法国总理克里孟梭、美国总统威尔逊操纵，是战胜国重新瓜分世界的分赃会议，战败国和苏俄被排斥在外。","point":"巴黎和会"},{"id":"x3q10","lesson":"x3l3","unit":"x3","type":"choice","level":2,"stem":"1922 年签订的《九国公约》宣称尊重中国的主权、独立与领土完整，其实际作用是","options":["使中国收回了山东主权","使中国回到几个帝国主义国家共同支配的局面","承认中国为世界强国","取消了列强在华的一切特权"],"answer":1,"explain":"《九国公约》表面尊重中国主权，实际确认了各国在中国“门户开放”“机会均等”的原则，使中国重回列强共同支配的局面。山东权益是 1922 年中日双方在华盛顿会议外谈判解决的，不是公约本身的作用。","point":"《九国公约》的实质"},{"id":"x3q11","lesson":"x3l3","unit":"x3","type":"order","level":2,"stem":"按时间先后排列一战后国际新秩序形成过程中的事件","items":["巴黎和会开幕","《凡尔赛条约》签订","国际联盟成立","华盛顿会议召开","《九国公约》签订"],"explain":"1919 年 1 月巴黎和会开幕，6 月签订《凡尔赛条约》；1920 年 1 月国际联盟成立；1921—1922 年召开华盛顿会议，1922 年签订《九国公约》。","point":"凡尔赛—华盛顿体系的形成"},{"id":"x3q12","lesson":"x3l3","unit":"x3","type":"fill","level":3,"stem":"1919 年，中国在巴黎和会上要求收回山东权益遭到拒绝，消息传回国内，引发了______运动。","answer":["五四","五四运动","五四爱国"],"explain":"巴黎和会决定把德国在山东的权益转给日本，中国外交失败，直接引发 1919 年 5 月 4 日爆发的五四运动。","point":"巴黎和会与中国外交"},{"id":"x3q13","lesson":"x3l4","unit":"x3","type":"choice","level":1,"stem":"1921 年，苏俄开始实行新经济政策，其中农业方面的主要措施是","options":["实行余粮收集制","以粮食税代替余粮收集制","没收农民的全部土地","强制推行农业集体化"],"answer":1,"explain":"新经济政策以粮食税代替余粮收集制，允许农民自由支配纳税后的余粮，调动了生产积极性。余粮收集制是战时共产主义政策的内容，农业集体化是 20 世纪 30 年代的事。","point":"新经济政策的内容"},{"id":"x3q14","lesson":"x3l4","unit":"x3","type":"choice","level":2,"stem":"1936 年，苏联颁布新宪法，宣布苏联是“工农社会主义国家”。这部宪法的颁布标志着","options":["苏维埃政权建立","苏联正式成立","苏联模式形成","新经济政策开始"],"answer":2,"explain":"1936 年新宪法宣告社会主义制度在苏联建立，标志着高度集中的计划经济体制和高度集权的政治体制即苏联模式形成。苏维埃政权建立于 1917 年，苏联成立于 1922 年。","point":"苏联模式的形成"},{"id":"x3q15","lesson":"x3l4","unit":"x3","type":"order","level":2,"stem":"按时间先后排列苏联社会主义建设中的事件","items":["开始实行新经济政策","苏维埃社会主义共和国联盟成立","提出社会主义工业化方针","第一个五年计划开始","新宪法宣告社会主义制度建立"],"explain":"1921 年开始实行新经济政策；1922 年底苏联成立；1925 年提出社会主义工业化方针；1928 年开始第一个五年计划；1936 年新宪法宣告社会主义制度建立。","point":"苏联社会主义建设的历程"},{"id":"x3q16","lesson":"x3l4","unit":"x3","type":"fill","level":1,"stem":"1922 年底，俄罗斯、乌克兰、白俄罗斯和外高加索联邦组成苏维埃社会主义共和国联盟，简称______。","answer":["苏联"],"explain":"1922 年底，苏维埃社会主义共和国联盟成立，简称苏联。此后苏联逐渐扩大，成为横跨欧亚的社会主义国家。","point":"苏联的成立"},{"id":"x3q17","lesson":"x3l5","unit":"x3","type":"choice","level":1,"stem":"甘地领导的印度反英斗争，采取的主要方式是","options":["武装起义","非暴力不合作","议会合法斗争","全民族的武装抗战"],"answer":1,"explain":"甘地主张用和平抵制、不合作的方式反对英国殖民统治，如抵制英货、拒上英国学校、拒绝在英国法庭工作，1930 年又发起“食盐进军”。","point":"印度的非暴力不合作运动"},{"id":"x3q18","lesson":"x3l5","unit":"x3","type":"choice","level":2,"stem":"20 世纪 30 年代，墨西哥总统卡德纳斯推行改革，其措施包括 ①推行土地改革 ②发展教育 ③将石油收归国有 ④开展非暴力不合作运动","options":["①②③","①②④","①③④","②③④"],"answer":0,"explain":"卡德纳斯改革推行土地改革、发展教育、将石油收归国有，属于民族民主改革。④非暴力不合作运动是甘地在印度领导的，与墨西哥无关。","point":"卡德纳斯改革"},{"id":"x3q19","lesson":"x3l5","unit":"x3","type":"match","level":2,"stem":"把亚非拉民族民主运动的人物与其事迹配对","pairs":[["甘地","领导印度非暴力不合作运动，1930 年发起“食盐进军”"],["扎格鲁尔","领导埃及华夫脱运动，迫使英国承认埃及独立"],["卡德纳斯","推行墨西哥改革，将石油收归国有"]],"explain":"甘地、扎格鲁尔、卡德纳斯分别代表印度、埃及、墨西哥的民族民主运动，斗争方式从和平抵制到改革，都打击了殖民统治和本国旧势力。","point":"亚非拉民族民主运动的代表人物"},{"id":"x3q20","lesson":"x3l5","unit":"x3","type":"fill","level":3,"stem":"1930 年，甘地带领数十名追随者步行到海边，捧起海水煮盐，公开反抗英国的食盐专卖法，这一行动被称为“______”。","answer":["食盐进军","食盐长征"],"explain":"1930 年的“食盐进军”是印度非暴力不合作运动的第二次高潮，甘地以违法煮盐的方式公开挑战英国的殖民法令，震动英国当局。","point":"食盐进军"}],"timeline":[{"t":"1914 年 6 月","y":1914,"text":"萨拉热窝事件发生，奥匈帝国随后对塞尔维亚宣战，第一次世界大战爆发","unit":"x3","tag":"一战","volume":"v6"},{"t":"1916 年","y":1916,"text":"凡尔登战役伤亡七十多万人，被称为“绞肉机”，成为一战的转折点","unit":"x3","tag":"一战","volume":"v6"},{"t":"1917 年 11 月","y":1917,"text":"彼得格勒武装起义胜利，十月革命建立世界上第一个无产阶级专政国家","unit":"x3","tag":"俄国革命","volume":"v6"},{"t":"1918 年 11 月","y":1918,"text":"德国投降，第一次世界大战以同盟国的失败而结束","unit":"x3","tag":"一战","volume":"v6"},{"t":"1919 年 6 月","y":1919,"text":"巴黎和会签订《凡尔赛条约》，凡尔赛体系开始确立","unit":"x3","tag":"外交","volume":"v6"},{"t":"1920 年","y":1920,"text":"甘地领导印度第一次非暴力不合作运动，抵制英国殖民统治","unit":"x3","tag":"民族","volume":"v6"},{"t":"1921 年","y":1921,"text":"苏俄开始实行新经济政策，以粮食税代替余粮收集制","unit":"x3","tag":"苏联","volume":"v6"},{"t":"1922 年 2 月","y":1922,"text":"华盛顿会议签订《九国公约》，凡尔赛—华盛顿体系形成","unit":"x3","tag":"外交","volume":"v6"},{"t":"1922 年底","y":1922,"text":"苏维埃社会主义共和国联盟成立，简称苏联","unit":"x3","tag":"苏联","volume":"v6"},{"t":"1936 年","y":1936,"text":"苏联颁布新宪法，宣告社会主义制度建立，苏联模式形成","unit":"x3","tag":"苏联","volume":"v6"}]},{"volume":"v6","unit":{"id":"x4","volume":"v6","num":4,"title":"经济大危机和第二次世界大战","short":"危机与大战","years":"1929—1945 年","accent":"#35746B","soft":"#E3F1EC","tint":"#C0DDD5","icon":"🔥","tagline":"股市崩盘、新政救急、战火燎原，旧秩序在这里崩塌","intro":"1929 年 10 月，纽约股市崩盘，银行倒闭、工厂关门，危机从美国蔓延到整个资本主义世界。有人在投票箱里找出路，有人把希望寄托给独裁者。罗斯福用新政给美国止血，希特勒、墨索里尼却用侵略转嫁危机。这一单元要看清：一场经济危机，怎样改写了国内政治，又把世界推向战争。","bigQuestion":"一场源于华尔街的经济危机，为什么会以世界大战收场？","goals":["说出 1929—1933 年经济大危机的特点与表现","概述罗斯福新政的措施，理解国家干预的特点","了解德意日法西斯扩张与绥靖政策的危害","梳理二战进程，认识反法西斯同盟的作用"],"keyLine":"1929 年股市崩盘 → 1933 年罗斯福新政 → 1933 年希特勒上台 → 1939 年突袭波兰 → 1942 年同盟形成 → 1945 年法西斯覆灭"},"lessons":[{"id":"x4l1","num":13,"unit":"x4","title":"罗斯福新政","years":"1933 年","icon":"🏛","tag":"美国","hook":"1933 年 3 月 4 日，华盛顿阴雨。国会大厦前，新总统罗斯福宣誓就职。全国大多数银行已经关门，街上排着挤兑的长队。他对着话筒说：我们唯一恐惧的就是恐惧本身。","core":"1929—1933 年经济大危机把美国推到崩溃边缘。1933 年罗斯福就任总统后，从整顿金融、复兴工业、调整农业、以工代赈到社会保障，用国家干预的办法推动经济缓慢复苏，开创了资本主义国家干预经济的新模式。","points":["背景：1929 年 10 月纽约股市崩溃，经济大危机爆发。危机波及整个资本主义世界，范围广、时间长、破坏大。","危机表现：银行纷纷倒闭，工厂停产，失业人数激增，农产品价格猛跌，社会矛盾尖锐，胡佛政府应对无力。","整顿金融：1933 年 3 月下令银行停业整顿，淘汰无力经营的银行，恢复银行信用，先稳住人心。","复兴工业：中心措施是实施《全国工业复兴法》，要求各行业制定公平竞争法规，规定生产规模、价格、工资和工时。","调整农业与以工代赈：减耕减产、政府补贴以稳定农产品价格；兴办田纳西河流域治理等公共工程，安排失业者就业。","社会保障：1935 年通过《社会保障法》，建立养老和失业保险制度；新政使联邦政府的权力明显增强。"],"terms":[["经济大危机","1929—1933 年从美国爆发的资本主义世界经济危机，范围广、时间长、破坏大，暴露了自由放任政策的弊端。"],["《全国工业复兴法》","1933 年美国国会通过，是罗斯福新政的中心措施，要求各工业部门制定公平竞争法规，规定生产规模、价格、工资和工时。"],["以工代赈","政府兴办公共工程，招募失业者做工并发给工资。既解决就业、提高购买力，又改善基础设施，是新政的重要措施。"],["国家干预经济","政府通过立法、财政等手段直接调节生产与分配。罗斯福新政开创了这一新模式，战后被资本主义国家广泛采用。"]],"figures":[["罗斯福","1933 年就任美国总统，推行新政，带领美国逐步走出危机"],["胡佛","罗斯福的前任，固守自由放任政策，危机期间应对不力"],["凯恩斯","英国经济学家，主张国家干预经济，其理论为后来各国调节经济提供了思想资源"]],"events":[["1929.10","纽约股市崩溃，经济大危机爆发"],["1933.3","罗斯福就任美国总统，推行新政"],["1933.6","国会通过《全国工业复兴法》"],["1935.8","《社会保障法》通过，社会保障制度建立"]],"treaty":null,"significance":"新政使美国经济缓慢复苏，人民生活有所改善，联邦政府权力增强；它开创了国家干预经济的新模式，对战后资本主义世界影响深远。但新政没有改变资本主义制度，也无法根除经济危机。","source":{"quote":"首先请允许我表明自己的坚定信念：我们唯一恐惧的就是恐惧本身。","from":"罗斯福首次就职演说（1933 年 3 月 4 日）"},"pitfall":"新政的中心措施是对工业的调整，不是兴办公共工程；新政只是缓解了危机，没有消除经济危机，也没有改变资本主义制度。","memory":"二九股市一声崩，三三新政救危城；金融工业加救济，国家干预开新风。","link":"上承 1929 年经济大危机，下接法西斯势力上台与二战爆发；新政的国家干预模式在战后资本主义国家广泛推行。","exam":["罗斯福新政的中心措施与特点","新政的影响与局限性","经济大危机的特点与表现"]},{"id":"x4l2","num":14,"unit":"x4","title":"法西斯国家的侵略扩张","years":"20 世纪 30 年代","icon":"⚔","tag":"法西斯","hook":"1938 年 9 月 30 日，英国首相张伯伦走下飞机，挥动着一纸协定说：我带来了我们时代的和平。机场一片欢呼。不到一年，德军坦克开进了波兰。","core":"经济大危机中，意大利、德国、日本先后建立法西斯政权并对外侵略扩张。德意日结成轴心国集团，英法推行绥靖政策，助长了法西斯的野心。1939 年 9 月德国突袭波兰，第二次世界大战全面爆发。","points":["意大利：1922 年墨索里尼建立法西斯政权，是最早建立法西斯统治的国家；1935 年出兵侵略埃塞俄比亚。","德国：1933 年希特勒出任总理，纳粹党上台，建立法西斯专政，世界大战的欧洲战争策源地形成。","纳粹统治：制造国会纵火案，打击德国共产党；解散工会，取缔除纳粹党以外的一切政党；疯狂迫害犹太人。","日本：1931 年发动九一八事变侵占中国东北；1936 年军部法西斯专政建立，亚洲战争策源地形成；1937 年全面侵华。","对外扩张：1938 年德国吞并奥地利，1939 年 3 月吞并捷克斯洛伐克；德、意、日结成轴心国集团。","绥靖政策：英法牺牲弱小国家利益与法西斯妥协。1938 年 9 月慕尼黑会议把苏台德区割给德国，绥靖政策达到顶峰。"],"terms":[["法西斯","对内实行独裁恐怖统治、对外侵略扩张的极端反动势力。20 世纪二三十年代，德、意、日相继法西斯化。"],["慕尼黑会议","1938 年 9 月英、法、德、意四国首脑在慕尼黑举行，把捷克斯洛伐克的苏台德区割让给德国，绥靖政策达到顶峰。"],["绥靖政策","英法等国对法西斯侵略不加抵制，而以牺牲弱小国家利益的方式谋求妥协，企图把祸水引向苏联。"],["轴心国集团","德、意、日三国结成的侵略集团，妄图称霸世界，是发动第二次世界大战的罪魁。"]],"figures":[["墨索里尼","意大利法西斯头目，1922 年率党徒进军罗马，建立法西斯政权"],["希特勒","德国纳粹党头目，1933 年出任总理，建立法西斯专政，挑起第二次世界大战"],["张伯伦","英国首相，推行绥靖政策，签订《慕尼黑协定》"]],"events":[["1922","墨索里尼建立意大利法西斯政权"],["1933","希特勒上台，德国建立法西斯专政"],["1936","日本军部法西斯专政建立"],["1938.9","慕尼黑会议，绥靖政策达到顶峰"],["1939.3","德国吞并捷克斯洛伐克"]],"treaty":{"name":"《慕尼黑协定》","date":"1938 年 9 月","items":["捷克斯洛伐克的苏台德区割让给德国，由德军分阶段占领","协定由英、法、德、意四国签订，捷克斯洛伐克代表未被允许参加","英法承诺保证捷克斯洛伐克新边界的“安全”","德国声明对其他国家不再提出领土要求","此后波兰、匈牙利也乘机瓜分捷克斯洛伐克领土"],"note":"这是绥靖政策达到顶峰的标志。1939 年 3 月，德国撕毁协定，出兵吞并捷克斯洛伐克，英法的保证随即落空。"},"significance":"法西斯政权的建立与扩张，使世界面临战争威胁；英法的绥靖政策纵容侵略，加速了大战的爆发。法西斯主义是人类文明的公敌，反法西斯战争因此具有正义性。","source":{"quote":"让你在战争与耻辱之间作一抉择，你选择了耻辱，而你将来还得进行战争。","from":"丘吉尔评《慕尼黑协定》（1938 年）"},"pitfall":"最早建立法西斯政权的是意大利（1922 年），不是德国；绥靖政策达到顶峰的标志是 1938 年慕尼黑会议，不是德国吞并奥地利。","memory":"意先德后日追随，三三上台祸欧洲；慕尼黑里割苏台，绥靖换来大战来。","link":"上承经济大危机，是危机在政治上的恶果；下接二战全面爆发，说明牺牲别国换不来和平。","exam":["德意日法西斯政权建立的时间与标志","慕尼黑会议与绥靖政策","法西斯侵略扩张与二战爆发的关系"]},{"id":"x4l3","num":15,"unit":"x4","title":"第二次世界大战","years":"1939—1945 年","icon":"🌍","tag":"二战","hook":"1939 年 9 月 1 日凌晨，德军坦克越过波兰边境，飞机扑向华沙。两天后，英法对德宣战。人类历史上规模最大的一场战争，就这样开始了。","core":"1939 年 9 月德国突袭波兰，二战全面爆发。1942 年《联合国家宣言》签署，世界反法西斯同盟形成。斯大林格勒战役成为转折点，1944 年诺曼底登陆开辟第二战场，1945 年 9 月 2 日日本签署投降书，法西斯彻底失败。","points":["爆发：1939 年 9 月 1 日德国突袭波兰，英法对德宣战，二战全面爆发；波兰在德军闪电战下迅速灭亡。","扩大：1940 年德国进攻西欧，法国溃败投降，英国坚持抵抗；1941 年 6 月德军进攻苏联，苏德战争爆发。","最大规模：1941 年 12 月 7 日日本偷袭美国海军基地珍珠港，太平洋战争爆发，二战达到最大规模。","走向联合：1942 年 1 月 1 日，美、英、苏、中等 26 国签署《联合国家宣言》，世界反法西斯同盟正式形成。","转折：1942 年 7 月至 1943 年 2 月斯大林格勒战役，德军由进攻转入防御，成为第二次世界大战的转折点。","胜利：1944 年 6 月诺曼底登陆开辟欧洲第二战场；1945 年 5 月 8 日德国投降；9 月 2 日日本签署投降书。"],"terms":[["《联合国家宣言》","1942 年 1 月 1 日，美、英、苏、中等 26 国在华盛顿签署，保证用全部资源共同对敌，标志世界反法西斯同盟正式形成。"],["斯大林格勒战役","1942 年 7 月至 1943 年 2 月苏军在斯大林格勒保卫战中歼灭大量德军，是苏德战场的转折点，也是二战的转折点。"],["诺曼底登陆","1944 年 6 月 6 日，美英盟军在法国诺曼底登陆，开辟欧洲第二战场，使德国陷入东西两面夹击。"],["雅尔塔会议","1945 年 2 月美、英、苏三国首脑在雅尔塔举行，决定分区占领德国、成立联合国、苏联在结束欧洲战争后对日作战。"]],"figures":[["罗斯福","美国总统，推动新政与反法西斯同盟的建立，参加雅尔塔会议"],["斯大林","苏联领导人，指挥斯大林格勒保卫战，参加雅尔塔会议"],["丘吉尔","英国首相，领导英国抗击德国空袭，参加雅尔塔会议"],["希特勒","德国法西斯头目，挑起世界大战，1945 年 4 月在柏林自杀"]],"events":[["1939.9.1","德国突袭波兰，二战全面爆发"],["1941.6.22","德军进攻苏联，苏德战争爆发"],["1941.12.7","日本偷袭珍珠港，太平洋战争爆发"],["1942.1.1","《联合国家宣言》签署，反法西斯同盟形成"],["1945.9.2","日本签署投降书，二战结束"]],"treaty":null,"significance":"二战是人类历史上规模最大的战争，给人类带来深重灾难；世界反法西斯同盟的胜利彻底粉碎了法西斯主义，挽救了人类文明。战后形成美苏对峙的两极格局，联合国成立，殖民体系加速瓦解。","source":{"quote":"每一政府各自保证对与各该政府作战的三国同盟成员国及其附从者使用其全部资源，不论军事的或经济的。","from":"《联合国家宣言》（1942 年 1 月 1 日）"},"pitfall":"二战全面爆发的标志是 1939 年德国突袭波兰，不是九一八事变；斯大林格勒战役是二战的转折点，不是二战的开始。","memory":"三九波兰燃战火，四一珍珠港滔天；四二宣言结同盟，四三城下转乾坤；四五九月降书签。","link":"承接法西斯扩张与绥靖政策，回答了大战为何爆发；下接战后冷战格局与联合国的建立。","exam":["二战的主要进程与重要战役","世界反法西斯同盟形成的作用","二战胜利的原因与历史影响"]}],"questions":[{"id":"x4q1","lesson":"x4l1","unit":"x4","type":"choice","level":1,"stem":"罗斯福新政的中心措施是","options":["整顿金融体系，恢复银行信用","对工业的调整，实施《全国工业复兴法》","减耕减产，由政府补贴农民","兴办公共工程，推行以工代赈"],"answer":1,"explain":"新政的中心措施是对工业的调整：1933 年国会通过《全国工业复兴法》，要求各工业部门制定公平竞争法规，规定生产规模、价格水平、工资标准和工作时数。整顿金融是首先采取的措施，减耕减产和兴办公共工程属于农业与就业方面的措施。","point":"罗斯福新政的中心措施"},{"id":"x4q2","lesson":"x4l1","unit":"x4","type":"choice","level":2,"stem":"罗斯福新政期间，政府通过立法规定工业生产规模、价格和工资，兴办公共工程安置失业者。这些做法最突出的特点是","options":["政府不干预经济，听任市场自由调节","国家加强对经济的干预和指导","用计划经济取代资本主义市场经济","以国有化代替资本主义私有制"],"answer":1,"explain":"新政以立法、财政等手段直接调节金融、工业、农业和就业，实质是国家干预经济。但它没有改变资本主义私有制，也没有实行计划经济和国有化；听任市场调节是胡佛政府的自由放任政策。","point":"罗斯福新政的特点"},{"id":"x4q3","lesson":"x4l1","unit":"x4","type":"order","level":2,"stem":"按时间先后排列下列与美国经济大危机及新政有关的事件","items":["纽约股市崩溃","罗斯福就任美国总统","《全国工业复兴法》颁布","《社会保障法》通过"],"explain":"1929 年 10 月纽约股市崩溃，经济大危机爆发；1933 年 3 月罗斯福就任总统，开始推行新政；1933 年 6 月国会通过《全国工业复兴法》；1935 年 8 月通过《社会保障法》，建立社会保障制度。","point":"经济大危机与罗斯福新政的进程"},{"id":"x4q4","lesson":"x4l1","unit":"x4","type":"fill","level":2,"stem":"1933 年，美国国会通过《______》，要求各工业部门制定公平竞争法规，规定生产规模、价格水平、工资标准和工作时数。这是罗斯福新政的中心措施。","answer":["全国工业复兴法","《全国工业复兴法》"],"explain":"《全国工业复兴法》于 1933 年 6 月通过，是罗斯福新政的中心措施，目的是防止盲目竞争引起生产过剩，同时保障工人的基本权利。","point":"《全国工业复兴法》"},{"id":"x4q5","lesson":"x4l2","unit":"x4","type":"choice","level":1,"stem":"20 世纪二三十年代，最早建立法西斯政权的国家是","options":["意大利","德国","日本","西班牙"],"answer":0,"explain":"1922 年墨索里尼率党徒进军罗马，在意大利建立起最早的法西斯政权。德国法西斯专政建立于 1933 年希特勒上台；日本军部法西斯专政建立于 1936 年；西班牙佛朗哥建立独裁政权是在 1936—1939 年内战之后。","point":"法西斯政权的建立"},{"id":"x4q6","lesson":"x4l2","unit":"x4","type":"choice","level":2,"stem":"1938 年 9 月，英、法、德、意四国首脑在慕尼黑签订协定，把捷克斯洛伐克的苏台德区割让给德国。这一事件表明","options":["英法的绥靖政策达到顶峰","世界反法西斯同盟已经形成","德国刚刚开始建立法西斯专政","欧洲战争策源地这时才形成"],"answer":0,"explain":"慕尼黑会议上，英法为求自保牺牲捷克斯洛伐克，是绥靖政策达到顶峰的标志。反法西斯同盟形成于 1942 年 1 月；德国法西斯专政建立于 1933 年，欧洲战争策源地也在 1933 年形成。","point":"慕尼黑会议与绥靖政策"},{"id":"x4q7","lesson":"x4l2","unit":"x4","type":"match","level":2,"stem":"把下列国家与其法西斯势力上台或绥靖政策的表现配对","pairs":[["意大利","1922 年墨索里尼建立法西斯政权"],["德国","1933 年希特勒出任总理，纳粹党上台"],["日本","1936 年军部法西斯专政建立"],["英国","1938 年张伯伦签订《慕尼黑协定》"]],"explain":"意大利是法西斯政权的发源地；德国纳粹党于 1933 年上台，欧洲战争策源地形成；日本军部于 1936 年建立法西斯专政，亚洲战争策源地形成；英国首相张伯伦推行绥靖政策，签订《慕尼黑协定》。","point":"德意日法西斯化与绥靖政策"},{"id":"x4q8","lesson":"x4l2","unit":"x4","type":"choice","level":3,"stem":"20 世纪 30 年代，德国和日本相继成为世界大战的策源地，其共同的背景是","options":["两国都受到 1929—1933 年经济大危机的沉重打击","两国都被《凡尔赛条约》严格限制军备","两国都通过革命建立了社会主义制度","两国都遭到英法军队的进攻和占领"],"answer":0,"explain":"经济大危机使德日两国经济凋敝、社会动荡，法西斯势力乘机煽动民族仇恨、鼓吹对外扩张，最终掌握政权。《凡尔赛条约》限制的是德国，不是日本；两国当时都是资本主义国家；30 年代是它们对外侵略，而不是被英法进攻占领。","point":"法西斯势力上台的背景"},{"id":"x4q9","lesson":"x4l3","unit":"x4","type":"choice","level":1,"stem":"第二次世界大战全面爆发的标志是","options":["日本制造九一八事变","德国突袭波兰，英法对德宣战","日本偷袭珍珠港","《慕尼黑协定》签订"],"answer":1,"explain":"1939 年 9 月 1 日德国突袭波兰，9 月 3 日英法对德宣战，二战全面爆发。九一八事变是中国局部抗战的开始；珍珠港事件使二战达到最大规模；慕尼黑会议是绥靖政策达到顶峰的标志。","point":"二战全面爆发的标志"},{"id":"x4q10","lesson":"x4l3","unit":"x4","type":"choice","level":2,"stem":"1942 年 7 月至 1943 年 2 月，苏军在斯大林格勒歼灭大量德军，德军从此由进攻转入防御。这场战役","options":["是一战的转折点","是第二次世界大战的转折点","开辟了欧洲第二战场","使德国法西斯无条件投降"],"answer":1,"explain":"斯大林格勒战役是苏德战场的转折点，也是第二次世界大战的转折点。凡尔登战役是一战的转折点；开辟欧洲第二战场的是 1944 年诺曼底登陆；德国投降是在 1945 年 5 月 8 日。","point":"斯大林格勒战役"},{"id":"x4q11","lesson":"x4l3","unit":"x4","type":"order","level":2,"stem":"按时间先后排列第二次世界大战中的下列事件","items":["德国突袭波兰","德军进攻苏联","日本偷袭珍珠港","《联合国家宣言》签署","斯大林格勒战役结束"],"explain":"1939 年 9 月德国突袭波兰，二战全面爆发；1941 年 6 月德军进攻苏联，苏德战争爆发；1941 年 12 月日本偷袭珍珠港，太平洋战争爆发；1942 年 1 月《联合国家宣言》签署，反法西斯同盟形成；1943 年 2 月斯大林格勒战役结束，二战迎来转折。","point":"第二次世界大战的进程"},{"id":"x4q12","lesson":"x4l3","unit":"x4","type":"choice","level":3,"stem":"二战期间，中国战场长期牵制日本陆军主力；1942 年中国远征军入缅作战，与盟军共同抗击日军。这些事实最能说明","options":["中国是世界反法西斯战争的东方主战场","中国独自打败了日本法西斯","中国战场是第二次世界大战的转折点","中国在战后成为联合国安理会常任理事国"],"answer":0,"explain":"中国战场开辟最早、持续时间最长，牵制了日本陆军主力，为世界反法西斯战争的胜利作出重大贡献，是东方主战场。日本投降是反法西斯同盟共同作战的结果；二战的转折点是斯大林格勒战役；中国成为安理会常任理事国是 1945 年联合国成立时的事，不能由题干材料直接说明。","point":"中国战场的地位"}],"timeline":[{"t":"1929 年 10 月","y":1929,"text":"纽约股市崩溃，经济大危机爆发，迅速波及整个资本主义世界","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1933 年 1 月","y":1933,"text":"希特勒出任德国总理，纳粹党上台，欧洲战争策源地形成","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1933 年 3 月","y":1933,"text":"罗斯福就任美国总统，推行新政，国家干预经济的新模式由此开启","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1936 年","y":1936,"text":"日本军部法西斯专政建立，亚洲战争策源地形成","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1938 年 9 月","y":1938,"text":"慕尼黑会议签订协定，把苏台德区割给德国，绥靖政策达到顶峰","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1939 年 9 月 1 日","y":1939,"text":"德国突袭波兰，英法对德宣战，第二次世界大战全面爆发","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1941 年 12 月 7 日","y":1941,"text":"日本偷袭珍珠港，太平洋战争爆发，二战达到最大规模","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1942 年 1 月 1 日","y":1942,"text":"26 国签署《联合国家宣言》，世界反法西斯同盟正式形成","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1943 年 2 月","y":1943,"text":"斯大林格勒战役结束，德军由进攻转入防御，二战迎来转折点","unit":"x4","tag":"世界现代","volume":"v6"},{"t":"1945 年 9 月 2 日","y":1945,"text":"日本正式签署投降书，第二次世界大战结束","unit":"x4","tag":"世界现代","volume":"v6"}]},{"volume":"v6","unit":{"id":"x5","volume":"v6","num":5,"title":"二战后的世界变化","short":"冷战与变化","years":"1945—1991 年","accent":"#3C7A70","soft":"#E6F2EE","tint":"#C5DED7","icon":"❄","tagline":"两个超级大国对峙四十余年，世界在冷战与变革中重排。","intro":"1945 年，炮火停歇，世界却没有安宁。美苏从盟友变成对手，一道铁幕横贯欧洲；西欧在废墟上走向联合，日本从战败中重新崛起；社会主义国家在改革中摸索，亚非拉的殖民地一个个独立。这个单元要回答：两极对峙怎样塑造了战后世界，又怎样被自身的变化终结？","bigQuestion":"冷战没有打起来，为什么却改变了几乎每一个国家？","goals":["梳理冷战的形成、对峙与结束，理解两极格局","说明西欧联合、日本崛起与福利国家的利与弊","分析苏联改革失败和东欧剧变、苏联解体的原因","概述亚非拉民族独立浪潮及其对世界格局的影响"],"keyLine":"1947 年杜鲁门主义拉开冷战，1949 年北约成立与德国分裂固化对峙，1955 年华约成立标志两极格局形成，1960 年“非洲年”壮大第三世界，1991 年苏联解体终结冷战。"},"lessons":[{"id":"x5l1","num":16,"unit":"x5","title":"冷战","years":"1947—1991 年","icon":"❄","tag":"冷战","hook":"1946 年 3 月，丘吉尔在美国富尔顿发表演说：“一幅横贯欧洲大陆的铁幕已经降落下来。”台下掌声雷动，莫斯科一片沉默。","core":"冷战是二战后以美苏为首的两大集团之间既非战争又非和平的对峙与竞争。1947 年杜鲁门主义出台标志冷战开始，1949 年北约成立、1955 年华约成立后，两极格局最终形成。1991 年苏联解体，冷战结束。","points":["背景：二战结束，美苏共同敌人消失，国家利益与社会制度根本对立；美国实力最强，苏联是唯一能与之抗衡的军事大国。","序幕：1946 年 3 月，丘吉尔在富尔顿发表“铁幕演说”，攻击苏联和东欧国家，呼吁英美联合对付“共产主义威胁”。","开始：1947 年 3 月，杜鲁门在国会发表演说，宣称要“遏制共产主义”，杜鲁门主义出台，标志美苏冷战开始。","经济：1947 年马歇尔计划提出，美国以援助西欧复兴经济为名，加强对西欧的控制，把西欧纳入美国势力范围。","军事：1949 年北大西洋公约组织成立；1955 年华沙条约组织成立，欧洲出现两大军事集团对峙，两极格局最终形成。","对峙与结束：德国分裂、柏林墙修建、古巴导弹危机、越南战争、苏联入侵阿富汗；1991 年苏联解体，两极格局终结。"],"terms":[["杜鲁门主义","1947 年 3 月杜鲁门在国会演说中提出，以“遏制共产主义”为核心，标志美苏冷战开始，也是美国推行全球霸权的宣言。"],["马歇尔计划","1947 年美国国务卿马歇尔提出的“欧洲复兴计划”，1948 年开始实施，以经济援助帮助西欧复兴，同时加强美国对西欧的控制。"],["两极格局","以美苏为中心，以北大西洋公约组织和华沙条约组织两大军事集团对峙为形式，在欧洲和全球形成的东西方对立格局。"],["柏林墙","1961 年民主德国在东西柏林之间修建的隔离墙，是冷战和德国分裂的象征，1989 年 11 月被推倒。"]],"figures":[["杜鲁门","美国总统，1947 年提出杜鲁门主义"],["丘吉尔","英国前首相，1946 年发表“铁幕演说”"],["马歇尔","美国国务卿，提出“欧洲复兴计划”"],["斯大林","苏联领导人，冷战初期领导苏联对抗西方"]],"events":[["1946 年 3 月","丘吉尔发表“铁幕演说”"],["1947 年 3 月","杜鲁门主义出台，冷战开始"],["1949 年","北大西洋公约组织成立"],["1955 年","华沙条约组织成立，两极格局形成"],["1991 年 12 月","苏联解体，冷战结束"]],"treaty":{"name":"《北大西洋公约》《华沙条约》","date":"1949 年、1955 年","items":["1949 年 4 月，美国等 12 国在华盛顿签订《北大西洋公约》，成立北大西洋公约组织","公约规定：对缔约国之一的武装攻击，即视为对全体缔约国的攻击","1955 年 5 月，苏联同东欧 7 国签订《华沙条约》，成立华沙条约组织","华约规定：缔约国以和平方式解决争端，就共同利益问题互相磋商","两大军事集团在欧洲全面对峙，两极格局最终形成"],"note":"北约总部设在布鲁塞尔，是美国控制西欧、对抗苏联的工具；华约的建立是苏联对北约吸收联邦德国的回应。1991 年华约解散。"},"significance":"冷战使世界长期处于核战争阴影之下，也避免了美苏直接大规模交战；美苏争霸给许多国家带来灾难，但双方在对抗中保持克制，客观上形成了相对稳定的两极秩序。1991 年苏联解体，冷战结束。","source":{"quote":"从波罗的海的什切青到亚得里亚海的的里雅斯特，一幅横贯欧洲大陆的铁幕已经降落下来。","from":"丘吉尔在美国富尔顿的演说（1946 年 3 月）"},"pitfall":"冷战开始的标志是 1947 年杜鲁门主义出台，不是 1946 年铁幕演说；冷战结束的标志是 1991 年苏联解体。","memory":"四六铁幕先开腔，四七杜鲁门登场；四九北约五五华约，九一解体冷战收场。","link":"冷战把战后世界切成两半，也逼出了西欧的联合、日本的崛起和社会主义国家的改革。","exam":["冷战开始的标志与两极格局的形成","杜鲁门主义与马歇尔计划的区别","冷战对世界格局的影响"]},{"id":"x5l2","num":17,"unit":"x5","title":"战后资本主义的新变化","years":"1945—1990 年代","icon":"📈","tag":"资本主义","hook":"1945 年的华沙一片瓦砾，人们在地窖里点起蜡烛。二十年后，西欧的工厂重新冒烟，高速公路上的汽车排成长龙，超市货架摆满商品——欧洲从废墟里爬了起来。","core":"战后西欧走上联合之路，1967 年欧洲共同体成立；日本在美国扶持下经济高速增长，1968 年成为资本主义世界第二经济大国；主要资本主义国家建立社会保障制度，缓和了社会矛盾，也背上了财政包袱。","points":["背景：二战使西欧经济严重受损，国际地位下降；美国为对抗苏联推行马歇尔计划，客观上促进了西欧经济恢复。","西欧联合：1951 年六国建立欧洲煤钢共同体；1957 年签订《罗马条约》；1967 年三个共同体合并为欧洲共同体。","日本崛起：战后日本民主改革，又得美国扶持；20 世纪 50—70 年代经济高速增长，1968 年成为资本主义世界第二经济大国。","美国经济：战后繁荣一时，20 世纪 70 年代出现“滞胀”；90 年代以信息化为特征的“新经济”兴起。","社会保障：1948 年英国宣布建成“福利国家”；20 世纪六七十年代，西欧国家社会保障制度进一步发展，缓和了社会矛盾。","改革弊端：福利制度加重财政负担，也助长惰性；20 世纪 80 年代，英美等国削减福利开支，改革社会保障制度。"],"terms":[["欧洲共同体","1967 年由欧洲煤钢共同体、欧洲经济共同体、欧洲原子能共同体合并而成，推动西欧国家的经济合作与政治联合。"],["福利国家","国家通过社会保障制度为公民的生老病死、失业等提供保障。1948 年英国宣布建成“福利国家”，西欧国家纷纷效仿。"],["新经济","20 世纪 90 年代美国出现的以信息技术为基础、以全球化为特征的经济增长方式，一度出现低通胀与低失业并存。"],["滞胀","20 世纪 70 年代资本主义国家出现的经济停滞与通货膨胀并存的现象，1973 年石油危机后尤为明显。"]],"figures":[["阿登纳","联邦德国首任总理，推动法德和解与西欧联合"],["戴高乐","法国总统，主张欧洲联合，推行独立自主外交"],["吉田茂","日本首相，主持战后经济复兴，确立“吉田路线”"],["撒切尔夫人","英国首相，20 世纪 80 年代改革福利制度"]],"events":[["1951 年","欧洲煤钢共同体成立"],["1957 年","六国签订《罗马条约》"],["1967 年","欧洲共同体成立"],["1968 年","日本成为资本主义世界第二经济大国"],["1973 年","石油危机爆发，资本主义国家经济出现“滞胀”"]],"treaty":{"name":"《罗马条约》","date":"1957 年 3 月","items":["由法国、联邦德国、意大利、荷兰、比利时、卢森堡六国签订","决定成立欧洲经济共同体和欧洲原子能共同体","逐步取消成员国之间的关税壁垒，建立关税同盟","实行共同的农业政策，建立共同市场","1958 年 1 月 1 日条约生效，欧洲一体化进入新阶段"],"note":"《罗马条约》与 1951 年建立欧洲煤钢共同体的条约一起，为 1967 年欧洲共同体的成立奠定了基础。"},"significance":"西欧联合提高了欧洲的国际地位，日本崛起使资本主义世界形成美、日、西欧三足鼎立；社会保障制度缓和了社会矛盾，但福利开支过大又迫使各国改革。","source":{"quote":"决心为在欧洲各国人民之间建立日益紧密的联盟奠定基础。","from":"《罗马条约》序言（1957 年 3 月）"},"pitfall":"欧共体成立于 1967 年，不是 1957 年；1957 年签订《罗马条约》的是六国；日本跃居资本主义世界第二是在 1968 年。","memory":"五一煤钢五七约，六七三合一欧共体；六八日本居第二，福利国家有喜也有忧。","link":"西欧与日本的经济崛起改变了资本主义世界的力量对比，也冲击了两极格局下美苏说了算的局面。","exam":["欧洲共同体的成立与欧洲一体化","战后日本经济高速发展的原因","社会保障制度的积极作用与弊端"]},{"id":"x5l3","num":18,"unit":"x5","title":"社会主义的发展与挫折","years":"1945—1991 年","icon":"🧱","tag":"社会主义","hook":"1986 年 4 月，基辅以北的切尔诺贝利，四号反应堆在凌晨爆炸。放射性尘埃随风飘向欧洲，也把苏联体制的深层问题吹到了世人面前。","core":"二战后社会主义从一国发展到多国。苏联模式曾推动工业化，却因高度集中而日益僵化；赫鲁晓夫、勃列日涅夫、戈尔巴乔夫的改革都未成功，最终导致东欧剧变和 1991 年苏联解体。","points":["社会主义阵营：二战后东欧国家先后走上社会主义道路；1949 年新中国诞生；1959 年古巴革命胜利后也选择了社会主义。","苏联模式：高度集中的计划经济和高度集权的政治体制，在战后恢复中起过作用，但排斥市场、缺乏活力，弊端日益暴露。","赫鲁晓夫改革：20 世纪 50 年代中期起，批判斯大林个人崇拜，平反冤假错案，改革农业和工业管理，但没有突破苏联模式。","勃列日涅夫改革：20 世纪 60 年代中期起推行新经济体制，重点发展重工业和军事工业，后期经济停滞，改革停顿。","戈尔巴乔夫改革：1985 年起先改经济后改政治，取消苏共领导地位、实行多党制，造成思想混乱，民族分离主义抬头。","剧变与解体：1989 年起东欧国家社会制度发生根本变化；1991 年“八一九事件”后苏共失去执政地位，同年 12 月苏联解体。"],"terms":[["苏联模式","又称斯大林模式，特征是高度集中的计划经济体制和高度集权的政治体制，曾推动苏联工业化，后来日益僵化。"],["新经济体制","勃列日涅夫时期推行的改革，扩大企业经营自主权，运用经济杠杆，但没有改变计划经济的根本框架。"],["八一九事件","1991 年 8 月苏联部分领导人试图阻止联盟解体、挽救苏联的行动，失败后苏共失去执政地位，加速了苏联解体。"],["东欧剧变","20 世纪 80 年代末 90 年代初，东欧社会主义国家的社会制度发生根本变化，共产党丧失执政地位，国家转向资本主义。"]],"figures":[["赫鲁晓夫","苏共中央第一书记，批判斯大林个人崇拜，推行改革"],["勃列日涅夫","苏共中央总书记，推行新经济体制，重点发展军事工业"],["戈尔巴乔夫","苏共中央总书记，改革失败，苏联在他任内解体"]],"events":[["1949 年","中华人民共和国成立，社会主义力量壮大"],["1959 年","古巴革命胜利"],["1985 年","戈尔巴乔夫开始改革"],["1989 年","东欧剧变开始"],["1991 年 12 月","苏联解体，冷战结束"]],"treaty":null,"significance":"苏联模式在特定条件下推动了工业化，但长期僵化造成经济停滞、民生困难；改革缺乏科学设计，戈尔巴乔夫又放弃了党的领导，最终使世界社会主义运动遭受严重挫折。","source":{"quote":"社会主义究竟是个什么样子，苏联搞了很多年，也并没有完全搞清楚。","from":"邓小平《改革是中国发展生产力的必由之路》（1985 年）"},"pitfall":"苏联解体的根本原因是苏联模式弊端长期未改，戈尔巴乔夫改革是直接原因；东欧剧变在 1989 年，苏联解体在 1991 年。","memory":"赫氏批斯未破模，勃氏重工经济停；戈氏新思维失控，九一解体两局终。","link":"社会主义国家的改革受挫与资本主义国家的调整同时发生，两极格局的天平随之倾斜，冷战走向终点。","exam":["苏联模式的特征与弊端","赫鲁晓夫、勃列日涅夫、戈尔巴乔夫改革的比较","苏联解体的原因与历史教训"]},{"id":"x5l4","num":19,"unit":"x5","title":"亚非拉国家的新发展","years":"1945 年至今","icon":"🌍","tag":"民族","hook":"1955 年 4 月，印度尼西亚万隆，29 个亚非国家的代表走进独立大厅。没有殖民国家在场，这是亚非国家第一次自己坐下来商量自己的事。","core":"二战后亚非拉民族解放运动高涨：亚洲国家纷纷独立，1960 年“非洲年”有 17 国独立，1990 年纳米比亚独立标志非洲殖民体系崩溃；拉美国家捍卫主权，第三世界登上国际舞台。","points":["亚洲：1947 年印度独立，印巴分治；1948 年缅甸独立；1949 年荷兰被迫承认印度尼西亚独立，亚洲政治版图改变。","非洲：1952 年埃及革命，1956 年收回苏伊士运河主权；1960 年 17 国独立，史称“非洲年”；1990 年纳米比亚独立。","拉丁美洲：1959 年古巴革命胜利；1977 年巴拿马与美国签约，1999 年收回运河区全部主权；拉美国家捍卫主权、团结合作。","万隆会议：1955 年 4 月，29 个亚非国家在印尼万隆开会，这是第一次没有殖民国家参加的亚非国际会议，形成“万隆精神”。","不结盟运动：1961 年，第一次不结盟国家和政府首脑会议在南斯拉夫贝尔格莱德召开，不结盟运动正式形成。","影响：新独立国家面临维护主权、发展经济的共同任务，它们联合反对霸权主义，推动建立国际经济新秩序，改变了世界格局。"],"terms":[["非洲年","1960 年，非洲有 17 个国家宣布独立，这一年被称为“非洲年”，是非洲民族独立运动的高潮。"],["万隆精神","1955 年万隆会议形成的团结、友谊、合作精神，成为亚非国家处理相互关系的准则。"],["不结盟运动","1961 年正式形成，主张不结盟、不参加军事集团，反对帝国主义和殖民主义，是第三世界崛起的重要标志。"],["第三世界","指亚非拉发展中国家，它们政治上独立后致力于维护主权、发展经济，在国际事务中发挥越来越大的作用。"]],"figures":[["尼赫鲁","印度首任总理，领导独立后的国家建设"],["纳赛尔","埃及领导人，1956 年宣布收回苏伊士运河主权"],["卡斯特罗","古巴革命领导人，1959 年推翻独裁政权"],["曼德拉","南非反种族隔离领袖，1994 年当选总统"]],"events":[["1947 年","印度独立，印巴分治"],["1955 年 4 月","万隆会议召开"],["1960 年","“非洲年”，17 个非洲国家独立"],["1961 年","不结盟运动正式形成"],["1990 年","纳米比亚独立"]],"treaty":{"name":"《巴拿马运河条约》","date":"1977 年 9 月","items":["由巴拿马领导人托里霍斯与美国总统卡特签署","废除 1903 年的不平等条约，承认巴拿马对运河区的主权","运河由巴拿马和美国共同管理，过渡期到 1999 年 12 月 31 日","1999 年底，巴拿马收回运河区的全部主权"],"note":"1903 年，美国通过不平等条约取得巴拿马运河的开凿权和运河区的永久使用、占领和控制权。1977 年条约是巴拿马人民长期斗争的结果。"},"significance":"民族独立运动摧毁了延续数百年的殖民体系，一大批新国家诞生；它们联合自强、反对霸权，改变了世界政治力量对比，也为南南合作开辟了道路。","source":{"quote":"中国代表团是来求团结而不是来吵架的。","from":"周恩来在万隆会议上的补充发言（1955 年 4 月）"},"pitfall":"1960 年“非洲年”是 17 国独立；1990 年纳米比亚独立才标志非洲殖民体系崩溃；万隆会议第一次没有殖民国家参加。","memory":"四七印巴分两家，五五万隆聚亚非；六〇十七国独立，九〇纳米最后归。","link":"第三世界的崛起改变了美苏两极下的力量对比，为冷战后世界向多极化发展准备了条件。","exam":["非洲独立浪潮与纳米比亚独立","万隆会议与不结盟运动","亚非拉民族独立的历史影响"]}],"questions":[{"id":"x5q1","lesson":"x5l1","unit":"x5","type":"choice","level":1,"stem":"1947 年 3 月，美国总统杜鲁门在国会发表演说，宣称要“遏制共产主义”。这一演说的出台标志着","options":["冷战开始","两极格局形成","华约建立","德国分裂"],"answer":0,"explain":"杜鲁门主义出台标志美苏冷战开始。两极格局形成于 1955 年华约成立，德国分裂发生在 1949 年。","point":"冷战开始的标志"},{"id":"x5q2","lesson":"x5l1","unit":"x5","type":"choice","level":2,"stem":"1947 年，美国国务卿马歇尔提出“欧洲复兴计划”。美国推行这一计划的主要目的是","options":["帮助欧洲国家建立社会主义制度","援助西欧复兴经济，同时加强对西欧的控制","促成欧洲共同体的成立","推动欧洲实现政治一体化"],"answer":1,"explain":"马歇尔计划以经济援助帮助西欧复兴，同时把西欧纳入美国势力范围，是冷战在经济上的表现。它的目的是遏制苏联，不会帮助欧洲建立社会主义制度；欧共体成立于 1967 年，与此无直接关系。","point":"马歇尔计划"},{"id":"x5q3","lesson":"x5l1","unit":"x5","type":"order","level":2,"stem":"按时间先后排列下列冷战中的事件","items":["丘吉尔发表“铁幕演说”","杜鲁门主义出台","北大西洋公约组织成立","华沙条约组织成立","苏联解体"],"explain":"1946 年铁幕演说 → 1947 年杜鲁门主义出台 → 1949 年北约成立 → 1955 年华约成立 → 1991 年苏联解体。","point":"冷战的过程"},{"id":"x5q4","lesson":"x5l1","unit":"x5","type":"fill","level":1,"stem":"1955 年，苏联同东欧 7 国签订《______》，成立华沙条约组织，标志着两极格局最终形成。","answer":["华沙条约","《华沙条约》"],"explain":"1955 年华约成立，与 1949 年成立的北约形成两大军事集团对峙，两极格局最终形成。","point":"两极格局的形成"},{"id":"x5q5","lesson":"x5l2","unit":"x5","type":"choice","level":1,"stem":"1967 年，由欧洲煤钢共同体、欧洲经济共同体和欧洲原子能共同体合并而成的是","options":["欧洲联盟","欧洲共同体","北大西洋公约组织","经济互助委员会"],"answer":1,"explain":"1967 年三个共同体合并为欧洲共同体；欧洲联盟成立于 1993 年；北约是军事政治集团；经互会是苏联主导的经济组织。","point":"欧洲共同体的成立"},{"id":"x5q6","lesson":"x5l2","unit":"x5","type":"choice","level":2,"stem":"20 世纪 50—70 年代，日本经济持续高速增长。1968 年，日本","options":["成为资本主义世界第二经济大国","成为世界第一经济大国","加入欧洲共同体","建立起“福利国家”制度"],"answer":0,"explain":"1968 年日本国民生产总值跃居资本主义世界第二位，仅次于美国。日本不是欧共体成员；“福利国家”是西欧国家的做法。","point":"战后日本经济的发展"},{"id":"x5q7","lesson":"x5l2","unit":"x5","type":"match","level":2,"stem":"把下列国家或国家集团与其战后经济发展的特点配对","pairs":[["西欧六国","签订《罗马条约》，走向经济联合"],["日本","1968 年成为资本主义世界第二经济大国"],["美国","20 世纪 90 年代出现“新经济”"],["英国","1948 年宣布建成“福利国家”"]],"explain":"西欧以联合求复兴，日本靠民主改革与外部扶持高速增长，美国在 90 年代转向信息化，英国率先宣布建成“福利国家”。","point":"战后资本主义的新变化"},{"id":"x5q8","lesson":"x5l2","unit":"x5","type":"fill","level":2,"stem":"1948 年，______宣布建成“福利国家”，此后西欧国家纷纷效仿，社会保障制度逐步完善。","answer":["英国","大不列颠"],"explain":"1948 年英国宣布建成“福利国家”，这是战后资本主义国家社会保障制度发展的标志性事件。","point":"社会保障制度"},{"id":"x5q9","lesson":"x5l3","unit":"x5","type":"choice","level":1,"stem":"苏联模式（斯大林模式）的主要特征是","options":["高度集中的计划经济体制和高度集权的政治体制","实行多党制和议会民主","以市场调节为主、国家干预为辅","优先发展轻工业和农业"],"answer":0,"explain":"苏联模式排斥市场调节，权力高度集中；多党制是戈尔巴乔夫政治改革的内容；苏联长期优先发展重工业，而不是轻工业和农业。","point":"苏联模式的特征"},{"id":"x5q10","lesson":"x5l3","unit":"x5","type":"choice","level":2,"stem":"1991 年苏联解体的直接原因之一是","options":["赫鲁晓夫批判斯大林个人崇拜","戈尔巴乔夫的政治改革取消苏共领导地位，造成思想混乱","勃列日涅夫推行新经济体制","东欧国家加入北约"],"answer":1,"explain":"戈尔巴乔夫改革取消苏共领导地位、实行多党制，导致思想混乱和民族分离主义抬头。赫鲁晓夫、勃列日涅夫的改革未突破苏联模式；东欧国家加入北约是冷战结束后的事。","point":"苏联解体的原因"},{"id":"x5q11","lesson":"x5l3","unit":"x5","type":"order","level":2,"stem":"按时间先后排列苏联社会主义发展与挫折的主要事件","items":["赫鲁晓夫开始改革","勃列日涅夫推行新经济体制","戈尔巴乔夫开始改革","“八一九事件”","苏联解体"],"explain":"20 世纪 50 年代中期赫鲁晓夫改革 → 60 年代中期勃列日涅夫推行新经济体制 → 1985 年戈尔巴乔夫改革 → 1991 年 8 月“八一九事件” → 1991 年 12 月苏联解体。","point":"苏联改革与解体"},{"id":"x5q12","lesson":"x5l3","unit":"x5","type":"fill","level":1,"stem":"1991 年 12 月，苏联解体，标志着______格局终结，冷战结束。","answer":["两极","两极格局"],"explain":"苏联解体使美苏两极格局终结，冷战结束，世界朝多极化方向发展。","point":"苏联解体的影响"},{"id":"x5q13","lesson":"x5l4","unit":"x5","type":"choice","level":1,"stem":"1960 年，非洲有 17 个国家宣布独立，这一年被称为","options":["“非洲年”","“独立年”","“万隆年”","“不结盟年”"],"answer":0,"explain":"1960 年 17 个非洲国家独立，史称“非洲年”；1990 年纳米比亚独立，标志非洲殖民体系最终崩溃。","point":"非洲独立浪潮"},{"id":"x5q14","lesson":"x5l4","unit":"x5","type":"choice","level":2,"stem":"1955 年 4 月，在印度尼西亚万隆召开的亚非会议，其重要意义在于","options":["这是第一次没有殖民国家参加的亚非国际会议","标志着不结盟运动正式形成","宣告了非洲殖民体系的崩溃","宣告了联合国的成立"],"answer":0,"explain":"万隆会议是亚非国家第一次在没有殖民国家参加的情况下讨论自身问题的国际会议，形成“万隆精神”。不结盟运动 1961 年正式形成；非洲殖民体系崩溃于 1990 年；联合国成立于 1945 年。","point":"万隆会议"},{"id":"x5q15","lesson":"x5l4","unit":"x5","type":"match","level":2,"stem":"把下列人物与其主要活动配对","pairs":[["尼赫鲁","领导印度独立后的国家建设"],["纳赛尔","宣布收回苏伊士运河主权"],["卡斯特罗","领导古巴革命取得胜利"],["曼德拉","领导南非反对种族隔离的斗争"]],"explain":"四人分别代表亚洲、非洲、拉丁美洲和南部非洲的民族独立与维护主权斗争。","point":"亚非拉民族独立人物"},{"id":"x5q16","lesson":"x5l4","unit":"x5","type":"choice","level":3,"stem":"二战后亚非拉民族独立运动对世界格局产生的重要影响是","options":["帝国主义殖民体系最终崩溃，第三世界成为国际舞台上的重要力量","直接导致美苏冷战的爆发","使美苏两极格局正式形成","促成了欧洲共同体的建立"],"answer":0,"explain":"民族独立运动摧毁了殖民体系，不结盟运动兴起，第三世界崛起，冲击了两极格局。冷战爆发和两极格局形成是美苏对抗的结果，与欧共体成立也没有直接因果关系。","point":"亚非拉民族独立的影响"}],"timeline":[{"t":"1947 年 3 月","y":1947,"text":"杜鲁门主义出台，美苏冷战开始","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1949 年","y":1949,"text":"北大西洋公约组织成立；德国分裂为联邦德国和民主德国","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1955 年 4 月","y":1955,"text":"亚非会议在印度尼西亚万隆召开，亚非国家走向团结合作","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1955 年 5 月","y":1955,"text":"华沙条约组织成立，两极格局最终形成","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1960 年","y":1960,"text":"“非洲年”，17 个非洲国家宣布独立","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1961 年","y":1961,"text":"不结盟运动正式形成，第三世界登上国际舞台","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1967 年","y":1967,"text":"欧洲共同体成立，西欧联合迈出关键一步","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1985 年","y":1985,"text":"戈尔巴乔夫开始改革，苏联模式的危机加深","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1990 年","y":1990,"text":"纳米比亚独立，帝国主义在非洲的殖民体系最终崩溃","unit":"x5","tag":"世界现代","volume":"v6"},{"t":"1991 年 12 月","y":1991,"text":"苏联解体，冷战结束，两极格局终结","unit":"x5","tag":"世界现代","volume":"v6"}]},{"volume":"v6","unit":{"id":"x6","volume":"v6","num":6,"title":"走向和平发展的世界","short":"和平发展","years":"1991 年至今","accent":"#42857A","soft":"#E9F4F0","tint":"#CBE3DC","icon":"🕊","tagline":"从联合国的讲台到互联网的屏幕，和平与发展仍是未完成的答卷。","intro":"1945 年，旧金山的代表们在炮火未熄时签署《联合国宪章》；1995 年，世界贸易组织在日内瓦开始运转；1991 年苏联解体，世界走出两极对峙，却又面对地区冲突的阴影。本单元要弄清：国际组织怎样维系世界秩序？冷战后格局为何走向多极化？人口、环境与网络又给人类出了哪些新考题？","bigQuestion":"没有了两大阵营的对峙，人类靠什么守住和平、共享发展？","goals":["了解联合国和世界贸易组织的成立、宗旨与作用。","分析冷战后世界格局多极化的趋势与挑战。","认识人口、环境、网络等现代社会问题。","理解和平与发展是当今时代的主题。"],"keyLine":"1945 年联合国诞生，1995 年世贸组织成立；1991 年冷战落幕，多极化在曲折中展开，和平与发展成为时代主题。"},"lessons":[{"id":"x6l1","num":20,"unit":"x6","title":"联合国与世界贸易组织","years":"1945 年至今","icon":"🤝","tag":"国际组织","hook":"1945 年 4 月，旧金山的剧院里坐满 50 个国家的代表。欧洲的硝烟还没散尽，他们已经在争论一件事：怎样才能让下一代不再经历这样一场战争。","core":"1945 年，《联合国宪章》生效，联合国正式成立，以维护国际和平与安全、促进国际合作为宗旨；1995 年，世界贸易组织成立，推动全球贸易自由化。二者成为支撑、协调世界政治和经济的两大支柱，也推动经济全球化不断深入。","points":["背景：两次大战的惨痛教训使各国认识到须建立维护和平的国际组织；1945 年 4 月，50 国代表在旧金山召开制宪会议。","成立：1945 年 6 月 26 日签署《联合国宪章》，10 月 24 日宪章生效，联合国正式成立，总部设在美国纽约。","机构与宗旨：设大会、安全理事会、经济及社会理事会、国际法院和秘书处；宗旨是维护国际和平与安全，促进国际合作。","安理会：由中、法、俄、英、美五个常任理事国和十个非常任理事国组成，常任理事国拥有否决权，承担维护和平的主要责任。","作用：联合国通过维和行动、人道主义援助和《世界人权宣言》等，在维护和平、促进发展、保障人权方面发挥积极作用。","世贸组织：1995 年成立，前身是关税与贸易总协定，中国 2001 年 12 月加入；它与联合国同为世界两大支柱。"],"terms":[["联合国安全理事会","联合国维护国际和平与安全的主要机构，由五个常任理事国和十个非常任理事国组成，常任理事国拥有否决权。"],["否决权","安理会常任理事国在表决非程序性事项时拥有的权利，只要有一票反对，决议就不能通过。"],["世界贸易组织","1995 年成立的国际经济组织，前身是关税与贸易总协定，负责制定贸易规则、组织谈判、解决争端。"],["经济全球化","商品、资本、技术和劳动力在全球流动，各国经济相互联系、相互依赖的趋势，20 世纪 90 年代以来加速发展。"]],"figures":[["罗斯福","美国总统，积极推动建立战后维护和平的国际组织，“联合国”一词即由他提出"],["董必武","中国代表，1945 年 6 月代表中国在《联合国宪章》上签字"],["石广生","中国外经贸部部长，2001 年代表中国签署加入世界贸易组织的议定书"]],"events":[["1945 年 6 月","50 国代表在旧金山签署《联合国宪章》"],["1945 年 10 月","《联合国宪章》生效，联合国正式成立"],["1947 年","关税与贸易总协定签署"],["1995 年 1 月","世界贸易组织成立"],["2001 年 12 月","中国正式加入世界贸易组织"]],"treaty":{"name":"《联合国宪章》","date":"1945 年 6 月 26 日签署，10 月 24 日生效","items":["维持国际和平及安全，采取有效集体办法防止和消除对和平的威胁","发展国际间以尊重人民平等权利及自决原则为根据的友好关系","促成国际合作，解决经济、社会、文化及人类福利性质的国际问题","构成一协调各国行动之中心，以达成上述共同目的","确立会员国主权平等、和平解决国际争端等原则"],"note":"中国是联合国创始会员国和安理会常任理事国，董必武代表中国在宪章上签字。"},"significance":"联合国是世界最具普遍性、代表性和权威性的政府间国际组织，在维护和平、促进发展方面不可替代；世界贸易组织推动贸易自由化和经济全球化；两者成为支撑、协调世界政治和经济的两大支柱。","source":{"quote":"我联合国人民同兹决心，欲免后世再遭今代人类两度身历惨不堪言之战祸","from":"《联合国宪章》序言（1945 年 6 月 26 日签署）"},"pitfall":"联合国正式成立于 1945 年 10 月宪章生效时，不是 6 月签署时；世贸组织 1995 年成立，前身是关贸总协定。","memory":"一九四五立联合国，一九九五立世贸；政治经济两支柱，和平发展离不了。","link":"作为本单元第一课，从国际组织入手认识战后世界秩序的支柱，为下一课冷战后格局的演变奠定基础。","exam":["联合国的宗旨与主要机构","世界贸易组织的职能与作用","经济全球化的表现与影响"]},{"id":"x6l2","num":21,"unit":"x6","title":"冷战后的世界格局","years":"1991 年至今","icon":"🌐","tag":"格局","hook":"1991 年 12 月 25 日傍晚，克里姆林宫顶上的苏联国旗最后一次降下。第二天，苏联不复存在，持续近半个世纪的冷战结束了，可世界并没有安静下来。","core":"1991 年苏联解体，两极格局终结，世界暂时形成“一超多强”的局面，多极化趋势在曲折中发展。霸权主义、地区冲突和恐怖主义威胁和平，建立公正合理的国际政治经济新秩序成为各国的共同愿望。","points":["格局转换：1991 年苏联解体，华约解散，两极格局终结，美国成为唯一超级大国，世界格局向多极化方向发展。","一超多强：美国凭实力推行霸权主义；欧盟 1993 年成立，日本谋求政治大国地位，俄罗斯军事力量强大，中国综合国力增强。","多极化：世界多极化趋势在曲折中发展，多极化格局尚未形成；发展中国家总体实力增强，是推动多极化的重要力量。","威胁和平的因素：霸权主义和强权政治、地区冲突、民族矛盾、宗教纷争、领土争端，以及日益猖獗的恐怖主义。","地区冲突：1999 年北约轰炸南联盟，发动科索沃战争；2003 年美国未经联合国授权发动伊拉克战争；巴以冲突长期难解。","建立新秩序：不结盟运动和七十七国集团为建立国际政治经济新秩序而努力；中国倡导构建人类命运共同体。"],"terms":[["两极格局","以美苏为首的两大军事政治集团对峙的国际格局，随着 1991 年苏联解体而终结。"],["一超多强","冷战后美国是唯一超级大国，欧盟、日本、俄罗斯、中国等力量中心同时存在，世界格局呈现“一超多强”的局面。"],["多极化趋势","世界权力向多个力量中心分散的趋势。冷战后这一趋势在曲折中发展，但多极化格局尚未形成。"],["不结盟运动","1961 年在贝尔格莱德正式形成，主张独立、自主、非集团，反对霸权主义，是发展中国家的重要国际组织。"]],"figures":[["邓小平","中国领导人，提出和平与发展是当今世界的两大问题，主张建立国际政治经济新秩序"],["铁托","南斯拉夫领导人，不结盟运动的发起人之一"]],"events":[["1991 年","苏联解体，两极格局终结"],["1993 年","欧洲联盟成立"],["1999 年","北约轰炸南联盟，科索沃战争爆发"],["2001 年","“9·11”事件发生，恐怖主义威胁凸显"],["2003 年","美国未经联合国授权发动伊拉克战争"]],"treaty":null,"significance":"两极格局终结后，世界形势总体缓和，但霸权主义、地区冲突和恐怖主义仍威胁和平；多极化趋势有利于遏制霸权、维护和平；建立公正合理的国际政治经济新秩序是各国人民的共同愿望。","source":{"quote":"现在世界上真正大的问题，带全球性的战略问题，一个是和平问题，一个是经济问题或者说发展问题。","from":"邓小平《和平与发展是当代世界的两大问题》（1985 年）"},"pitfall":"苏联解体标志两极格局终结和冷战结束，但不等于多极化格局已经形成；多极化只是一种发展趋势，至今尚未定型。","memory":"九一苏联旗落地，一超多强暂成形；科索沃与伊拉克，霸权未去多极生。","link":"上承冷战中两极对峙的终结，下启现代社会的全球议题，是理解当今国际关系与世界主题的关键一课。","exam":["冷战结束的标志与两极格局的终结","世界多极化趋势的表现与评价","霸权主义、地区冲突与恐怖主义"]},{"id":"x6l3","num":22,"unit":"x6","title":"不断发展的现代社会","years":"20 世纪中至今","icon":"💻","tag":"社会","hook":"1969 年 10 月 29 日，加州大学洛杉矶分校的计算机向斯坦福研究所发出第一条信息。传到第二个字母时系统崩溃了，人类连接世界的尝试却从此没有停下。","core":"20 世纪中以来，计算机网络技术把人类带入信息时代，世界人口迅速增长，环境问题日益突出，妇女地位不断提高。现代社会在进步中也面临人口、资源、环境、网络安全等共同挑战，可持续发展成为人类的必然选择。","points":["计算机网络：1969 年美国建立阿帕网；20 世纪 90 年代互联网商业化后迅速普及；1994 年中国正式接入互联网。","网络影响：信息传递快捷、资源共享，改变生产、生活和交往方式，世界变成“地球村”；也带来网络安全和沉迷网络等问题。","人口增长：20 世纪以来世界人口迅速增长，2011 年达到 70 亿；人口过快增长加重资源、环境和就业压力。","环境问题：工业化、城市化带来温室效应、臭氧层破坏、酸雨、土地荒漠化、水资源短缺和生物多样性减少等全球性问题。","应对：1987 年提出可持续发展；1992 年通过《21 世纪议程》；2015 年达成《巴黎协定》加强气候治理。","妇女地位：二战后妇女普遍获得选举权，1979 年联合国通过《消除对妇女一切形式歧视公约》；性别歧视仍存在。"],"terms":[["信息时代","以计算机和互联网技术为核心，信息成为重要资源，知识传播与交流方式发生根本变化的社会发展阶段。"],["可持续发展","既满足当代人的需要，又不对后代人满足其需要的能力构成危害的发展，强调经济、社会与环境的协调。"],["温室效应","大气中二氧化碳等气体增多，使地球表面温度升高的现象，是全球气候变暖的主要原因。"],["阿帕网","1969 年美国建立的计算机网络，是互联网的前身，最初用于军事和科研机构的计算机互联。"]],"figures":[["蕾切尔·卡森","美国生物学家，1962 年出版《寂静的春天》，唤起人们的环境保护意识"],["蒂姆·伯纳斯-李","英国计算机科学家，提出万维网构想，使互联网走向大众"]],"events":[["1969 年","美国阿帕网建立，计算机网络出现"],["1987 年","世界环境与发展委员会发表《我们共同的未来》，提出可持续发展"],["1992 年","联合国环境与发展大会通过《21 世纪议程》"],["1995 年","第四次世界妇女大会在北京召开"],["2011 年","世界人口达到 70 亿"]],"treaty":null,"significance":"现代社会的发展极大改善了人类的物质生活和交往方式，但人口、资源、环境和网络安全等问题威胁着人类的生存与发展；只有加强国际合作、走可持续发展道路，才能实现人与自然、社会的协调发展。","source":{"quote":"可持续发展是既满足当代人的需要，又不对后代人满足其需要的能力构成危害的发展。","from":"世界环境与发展委员会《我们共同的未来》（1987 年）"},"pitfall":"计算机网络 1969 年就已出现，互联网普及在 20 世纪 90 年代；可持续发展不是不发展，而是发展与资源环境相协调。","memory":"阿帕网 1969，中国接入 1994；人口七十亿，发展要持续。","link":"承接冷战后的世界格局，把目光从国际关系转向人类共同的社会问题，为全册“和平与发展”主题作结。","exam":["计算机网络的影响","人口、环境问题与可持续发展","妇女地位提高的表现"]}],"questions":[{"id":"x6q1","lesson":"x6l1","unit":"x6","type":"choice","level":1,"stem":"1945 年 10 月 24 日，随着《联合国宪章》生效，一个旨在维护国际和平与安全的国际组织正式成立。它是","options":["国际联盟","联合国","世界贸易组织","欧洲联盟"],"answer":1,"explain":"《联合国宪章》于 1945 年 6 月 26 日签署，10 月 24 日生效，联合国正式成立，总部设在美国纽约。国际联盟成立于 1920 年，世贸组织成立于 1995 年，欧盟成立于 1993 年。","point":"联合国的成立"},{"id":"x6q2","lesson":"x6l1","unit":"x6","type":"choice","level":2,"stem":"联合国安全理事会承担维护国际和平与安全的主要责任。下列国家中不是安理会常任理事国的是","options":["中国","法国","德国","俄罗斯"],"answer":2,"explain":"安理会五个常任理事国是中国、法国、俄罗斯、英国、美国，德国不是常任理事国。常任理事国对非程序性事项拥有否决权。","point":"联合国安全理事会"},{"id":"x6q3","lesson":"x6l1","unit":"x6","type":"order","level":2,"stem":"把下列与国际组织有关的史实按时间先后排序","items":["《联合国宪章》生效，联合国成立","关税与贸易总协定正式生效","世界贸易组织成立","中国正式加入世界贸易组织"],"explain":"1945 年 10 月联合国成立；1948 年 1 月关税与贸易总协定生效；1995 年 1 月世界贸易组织成立；2001 年 12 月中国正式加入世界贸易组织。","point":"国际组织的发展历程"},{"id":"x6q4","lesson":"x6l1","unit":"x6","type":"choice","level":3,"stem":"21 世纪以来，中国商品进入世界市场遇到的关税和贸易争端，主要通过世界贸易组织的规则解决。这说明世界贸易组织","options":["是联合国下属的专门机构，负责维护世界和平","通过制定贸易规则、组织谈判和解决争端推动全球贸易发展","只对发达国家开放，发展中国家没有发言权","成立后取代了联合国，成为最重要的国际组织"],"answer":1,"explain":"世贸组织的主要职能是制定和规范多边贸易协定、组织贸易谈判、解决贸易争端。它与联合国是支撑、协调世界政治和经济的两大支柱，不是联合国下属机构，也不只对发达国家开放。","point":"世界贸易组织的职能"},{"id":"x6q5","lesson":"x6l2","unit":"x6","type":"choice","level":1,"stem":"1991 年，苏联解体。这一事件最直接的影响是","options":["第二次世界大战爆发","两极格局终结，冷战结束","欧洲联盟正式成立","世界多极化格局最终形成"],"answer":1,"explain":"1991 年苏联解体，华约解散，以美苏对峙为基础的两极格局终结，冷战结束。二战爆发于 1939 年；欧盟成立于 1993 年；多极化只是一种发展趋势，格局尚未形成。","point":"两极格局的终结"},{"id":"x6q6","lesson":"x6l2","unit":"x6","type":"choice","level":2,"stem":"冷战结束后，世界格局暂时呈现“一超多强”的局面。对“一超多强”理解正确的是","options":["美国是唯一超级大国，欧盟、日本、中国、俄罗斯等力量不断增强","世界已经形成稳定的多极化格局","发展中国家在国际事务中已无足轻重","“多强”是指华约组织的成员国"],"answer":0,"explain":"“一超”指美国是唯一超级大国，“多强”指欧盟、日本、中国、俄罗斯等力量中心。多极化只是发展趋势，格局尚未定型；发展中国家总体实力增强，是推动多极化的重要力量。","point":"一超多强与多极化趋势"},{"id":"x6q7","lesson":"x6l2","unit":"x6","type":"match","level":2,"stem":"把下列国际组织或力量与其特征配对","pairs":[["联合国","维护国际和平与安全，派出维和部队"],["世界贸易组织","制定贸易规则，解决贸易争端"],["欧洲联盟","1993 年成立，推动欧洲一体化"],["不结盟运动","1961 年兴起，反对霸权主义"]],"explain":"联合国与世贸组织是支撑、协调世界政治和经济的两大支柱；欧盟是欧洲一体化的重要成果；不结盟运动是发展中国家争取独立自主、反对霸权主义的重要力量。","point":"主要国际组织与力量"},{"id":"x6q8","lesson":"x6l2","unit":"x6","type":"choice","level":3,"stem":"1999 年，以美国为首的北约没有经过联合国安理会授权，对南斯拉夫联盟共和国进行了 78 天空袭。这一事件表明","options":["联合国安理会已失去作用","霸权主义和强权政治依然威胁世界和平","世界多极化格局已经形成","地区冲突只发生在欧洲"],"answer":1,"explain":"北约绕过联合国对主权国家动武，是霸权主义和强权政治的表现，说明世界和平仍面临挑战。联合国仍在发挥重要作用，多极化尚未定型，地区冲突遍布多个地区。","point":"霸权主义与地区冲突"},{"id":"x6q9","lesson":"x6l3","unit":"x6","type":"choice","level":1,"stem":"2011 年 10 月，世界人口达到 70 亿。这一数据说明","options":["世界人口增长过快，给资源与环境带来压力","发达国家人口增长最快","世界人口已经开始减少","人口问题已经得到解决"],"answer":0,"explain":"20 世纪以来世界人口迅速增长，2011 年达到 70 亿。人口过快增长加重了粮食、资源、环境和就业的压力。发达国家人口增长缓慢，世界人口仍在增长。","point":"世界人口增长"},{"id":"x6q10","lesson":"x6l3","unit":"x6","type":"choice","level":2,"stem":"面对全球气候变暖、臭氧层破坏等环境问题，1987 年世界环境与发展委员会在《我们共同的未来》中提出的理念是","options":["可持续发展","优胜劣汰","贸易保护","殖民扩张"],"answer":0,"explain":"《我们共同的未来》把“既满足当代人的需要，又不对后代人满足其需要的能力构成危害的发展”称为可持续发展，强调经济、社会与环境的协调。","point":"可持续发展"},{"id":"x6q11","lesson":"x6l3","unit":"x6","type":"order","level":2,"stem":"把下列现代社会发展的史实按时间先后排序","items":["美国建立阿帕网，计算机网络出现","联合国环境与发展大会通过《21 世纪议程》","第四次世界妇女大会在北京召开","世界人口达到 70 亿"],"explain":"1969 年美国建立阿帕网；1992 年联合国环境与发展大会通过《21 世纪议程》；1995 年第四次世界妇女大会在北京召开；2011 年世界人口达到 70 亿。","point":"现代社会的发展历程"},{"id":"x6q12","lesson":"x6l3","unit":"x6","type":"fill","level":2,"stem":"1987 年，世界环境与发展委员会在《我们共同的未来》报告中，把既满足当代人的需要、又不对后代人满足其需要的能力构成危害的发展称为“______”。","answer":["可持续发展"],"explain":"可持续发展强调经济建设与人口、资源、环境相协调，是国际社会应对全球环境问题的重要共识。","point":"可持续发展"}],"timeline":[{"t":"1945 年 10 月","y":1945,"text":"《联合国宪章》生效，联合国正式成立，总部设在美国纽约","unit":"x6","tag":"世界现代","volume":"v6"},{"t":"1947 年","y":1947,"text":"关税与贸易总协定签署，1948 年 1 月正式生效","unit":"x6","tag":"世界现代","volume":"v6"},{"t":"1961 年","y":1961,"text":"第一次不结盟国家和政府首脑会议在贝尔格莱德举行，不结盟运动正式形成","unit":"x6","tag":"世界现代","volume":"v6"},{"t":"1969 年","y":1969,"text":"美国建立阿帕网，计算机网络出现","unit":"x6","tag":"世界现代","volume":"v6"},{"t":"1991 年","y":1991,"text":"苏联解体，两极格局终结，冷战结束","unit":"x6","tag":"世界现代","volume":"v6"},{"t":"1993 年","y":1993,"text":"欧洲联盟成立，欧洲一体化进程加快","unit":"x6","tag":"世界现代","volume":"v6"},{"t":"1995 年 1 月","y":1995,"text":"世界贸易组织正式成立，成为推动经济全球化的重要力量","unit":"x6","tag":"世界现代","volume":"v6"},{"t":"2001 年 12 月","y":2001,"text":"中国正式加入世界贸易组织，进一步融入经济全球化","unit":"x6","tag":"世界现 const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 存储 ---------- */
const STORAGE_KEY = 'timeship_history_v1';
function defaultState() {
  return {
    version: 1, name: '小小史官',
    xp: 0, streak: 0, lastDay: '', bestCombo: 0,
    sound: true,
    learned: [], explored: [], wrong: [], answers: {}, badges: [], notes: {},
    campaign: {},
    daily: { date: '', learned: 0, correct: 0, reviewed: 0, xp: 0, goal: 40, chestClaimed: false, qid: '', qChecked: false, qChosen: null },
    lastUnit: '', log: [], totalAnswered: 0, totalCorrect: 0, quizCount: 0, masteredCount: 0
  };
}
function loadState() {
  const base = defaultState();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved || typeof saved !== 'object') return base;
  const s = Object.assign(base, saved);
  s.daily = Object.assign(base.daily, saved.daily || {});
  s.answers = saved.answers && typeof saved.answers === 'object' ? saved.answers : {};
  s.campaign = saved.campaign && typeof saved.campaign === 'object' ? saved.campaign : {};
  s.notes = saved.notes && typeof saved.notes === 'object' ? saved.notes : {};
  s.log = Array.isArray(saved.log) ? saved.log : [];
  ['learned', 'explored', 'wrong', 'badges'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}
let state = loadState();
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* 隐私模式下静默失败 */ }
  try { if (typeof window.__onStateSaved === 'function') window.__onStateSaved(); } catch (e) { /* 同步钩子失败不影响保存 */ }
}
function touchDay() {
  const today = todayKey();
  if (state.lastDay === today) {
    if (state.daily.date !== today) resetDaily(today);
    return;
  }
  state.streak = state.lastDay && dayDiff(state.lastDay, today) === 1 ? Number(state.streak || 0) + 1 : 1;
  state.lastDay = today;
  resetDaily(today);
  saveState();
}
function resetDaily(today) {
  state.daily = { date: today, learned: 0, correct: 0, reviewed: 0, xp: 0, goal: 40, chestClaimed: false, qid: '', qChecked: false, qChosen: null };
}
function pickDailyQuestion() {
  const pool = QUESTIONS.filter(q => q.type === 'choice');
  if (!state.daily.qid || !qById(state.daily.qid)) {
    const d = new Date();
    const seed = d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate();
    state.daily.qid = pool[seed % pool.length].id;
    state.daily.qChecked = false;
    state.daily.qChosen = null;
    saveState();
  }
  return qById(state.daily.qid);
}
function logActivity(inc) {
  const today = todayKey();
  let row = state.log.find(r => r.date === today);
  if (!row) { row = { date: today, xp: 0, answered: 0, correct: 0 }; state.log.push(row); }
  row.xp += inc.xp || 0;
  row.answered += inc.answered || 0;
  row.correct += inc.correct || 0;
  state.log = state.log.slice(-60);
}

function levelInfo(xp) {
  let idx = 0;
  LEVELS.forEach((l, i) => { if (xp >= l.min) idx = i; });
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1] || null;
  const span = next ? next.min - cur.min : 1;
  return { cur, next, index: idx, progress: next ? Math.round(clamp((xp - cur.min) / span, 0, 1) * 100) : 100, toNext: next ? next.min - xp : 0 };
}
